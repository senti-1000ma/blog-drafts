tal": 6, "text": "면제는 현재 2026년 12월 31일까지.\n\n2027년에 오는 친구라면 항공권 예약 전에 K-ETA 공식 공지부터 확인하라고 알려 주세요. (6/6)", "len": 124, "need": 0, "media": []}], "replies": [{"text": "공식 출처: K-ETA 면제 공지 https://www.k-eta.go.kr/portal/board/viewboarddetail.do?bbsSn=299707&esntlPnotiMtYn= · K-ETA 수수료 안내 https://www.k-eta.go.kr/portal/guide/viewetafeeinformation.do?locale=EN", "len": 94, "need": 0}, {"text": "전자입국신고서(무료·공식): 안내 https://www.e-arrivalcard.go.kr/portal/guide/eacGuide.do · 제출 대상 https://www.e-arrivalcard.go.kr/portal/guide/eacTargetGuide.do", "len": 91, "need": 0}], "plain": "외국인 친구 한국 초대할 때 제일 많이 헷갈리는 거: K-ETA vs 전자입국신고서.\n\n둘은 완전 별개고, 하나는 무료예요 🧵 #한국여행 (1/6)\n\n---\n\nK-ETA = 전자여행허가.\n\n미국·캐나다·영국·일본·호주 등 일부 국가·지역 국민은 법무부 조치로 2026년 12월 31일(한국시간)까지 한시 면제예요. (2/6)\n\n---\n\n근데 면제 ≠ 서류 0개.\n\nK-ETA 면제자와 비자 소지자는 전자입국신고서(e-Arrival Card)를 내야 해요. 종이 입국신고서를 대신하는 무료 온라인 신고예요. (3/6)\n\n---\n\n작성 시기: 입국 3일 전(한국시간)부터, 제출 후 72시간 유효.\n\n준비물: 여권, 이메일, 입국일·편명, 한국 내 숙소 주소. (4/6)\n\n---\n\n입국신고서 쓰기 귀찮다면? 면제자도 K-ETA를 따로 신청할 수 있어요. 1인 1만 원(+카드 수수료 약 3%), 불허돼도 환불 안 됨.\n\nK-ETA가 있으면 보통 입국신고서 제외지만, 비자 소지자는 예외. (5/6)\n\n---\n\n면제는 현재 2026년 12월 31일까지.\n\n2027년에 오는 친구라면 항공권 예약 전에 K-ETA 공식 공지부터 확인하라고 알려 주세요. (6/6)", "copyAll": "외국인 친구 한국 초대할 때 제일 많이 헷갈리는 거: K-ETA vs 전자입국신고서.\n\n둘은 완전 별개고, 하나는 무료예요 🧵 #한국여행 (1/6)\n\n---\n\nK-ETA = 전자여행허가.\n\n미국·캐나다·영국·일본·호주 등 일부 국가·지역 국민은 법무부 조치로 2026년 12월 31일(한국시간)까지 한시 면제예요. (2/6)\n\n---\n\n근데 면제 ≠ 서류 0개.\n\nK-ETA 면제자와 비자 소지자는 전자입국신고서(e-Arrival Card)를 내야 해요. 종이 입국신고서를 대신하는 무료 온라인 신고예요. (3/6)\n\n---\n\n작성 시기: 입국 3일 전(한국시간)부터, 제출 후 72시간 유효.\n\n준비물: 여권, 이메일, 입국일·편명, 한국 내 숙소 주소. (4/6)\n\n---\n\n입국신고서 쓰기 귀찮다면? 면제자도 K-ETA를 따로 신청할 수 있어요. 1인 1만 원(+카드 수수료 약 3%), 불허돼도 환불 안 됨.\n\nK-ETA가 있으면 보통 입국신고서 제외지만, 비자 소지자는 예외. (5/6)\n\n---\n\n면제는 현재 2026년 12월 31일까지.\n\n2027년에 오는 친구라면 항공권 예약 전에 K-ETA 공식 공지부터 확인하라고 알려 주세요. (6/6)", "extras": [{"title": "이미지·미디어 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>트윗 3<\/td><td>' "#비밀번호"], "ko": "NIST SP 800-63B-4(2025년 7월 최종): 조합 규칙 강제 금지, 길이 중시(단독 15자·다중인증 8자 이상, 64자 이상 허용), 정기 변경 요구 금지(유출 정황 시 변경), 흔한·유출 비밀번호 목록 대조. 미국 정부 시스템용 지침이라 개별 사이트는 다를 수 있어요(2026-10-05 한국어로 재작성).", "need": 0, "chars": 176, "imgs": 0, "tweets": [{"n": 1, "total": 5, "text": "'대문자+숫자+특수문자 꼭 섞으세요' 그 짜증나는 규칙…\n\n미국 표준기술연구소(NIST) 최신 지침은 서비스가 이걸 강제하면 안 된다고 해요 🧵 #비밀번호 (1/5)", "len": 149, "need": 0, "media": []}, {"n": 2, "total": 5, "text": "근거: NIST SP 800-63B-4(2025년 7월 최종본).\n\n문자 종류 섞기 같은 조합 규칙은 강제 금지. 유출 비밀번호를 분석해 보니 효과는 기대보다 작고 사용성만 떨어뜨린다는 설명이에요. (2/5)", "len": 176, "need": 0, "media": []}, {"n": 3, "total": 5, "text": "대신 중요한 건 길이.\n\n비밀번호 하나로만 로그인하면 최소 15자, 다중인증의 한 요소면 최소 8자.\n\n서비스는 64자 이상도 받아 줘야 한다고 적혀 있어요. (3/5)", "len": 150, "need": 0, "media": []}, {"n": 4, "total": 5, "text": "'90일마다 변경'도 요구하지 말 것.\n\n대신 유출 정황이 있으면 바꾸게 해야 하고, 새 비밀번호는 흔하거나 유출된 비밀번호 목록과 대조해야 해요. (4/5)", "len": 143, "need": 0, "media": []}, {"n": 5, "total": 5, "text": "단, 미국 정부 정보시스템용 기술 지침이라 각 사이트 규칙은 다를 수 있어요.\n\n내 계정엔 '특수문자보다 길이' 하나만 기억해 둬도 좋아요. (5/5)", "len": 137, "need": 0, "media": []}], "replies": [{"text": "출처(NIST): SP 800-63B-4 최종본 https://csrc.nist.gov/pubs/sp/800/63/b/4/final · 인증 수단 요구사항 https://pages.nist.gov/800-63-4/sp800-63b/authenticators/ · 조합 규칙 설명 https://pages.nist.gov/800-63-4/sp800-63b/passwords/", "len": 141, "need": 0}], "plain": "'대문자+숫자+특수문자 꼭 섞으세요' 그 짜증나는 규칙…\n\n미국 표준기술연구소(NIST) 최신 지침은 서비스가 이걸 강제하면 안 된다고 해요 🧵 #비밀번호 (1/5)\n\n---\n\n근거: NIST SP 800-63B-4(2025년 7월 최종본).\n\n문자 종류 섞기 같은 조합 규칙은 강제 금지. 유출 비밀번호를 분석해 보니 효과는 기대보다 작고 사용성만 떨어뜨린다는 설명이에요. (2/5)\n\n---\n\n대신 중요한 건 길이.\n\n비밀번호 하나로만 로그인하면 최소 15자, 다중인증의 한 요소면 최소 8자.\n\n서비스는 64자 이상도 받아 줘야 한다고 적혀 있어요. (3/5)\n\n---\n\n'90일마다 변경'도 요구하지 말 것.\n\n대신 유출 정황이 있으면 바꾸게 해야 하고, 새 비밀번호는 흔하거나 유출된 비밀번호 목록과 대조해야 해요. (4/5)\n\n---\n\n단, 미국 정부 정보시스템용 기술 지침이라 각 사이트 규칙은 다를 수 있어요.\n\n내 계정엔 '특수문자보다 길이' 하나만 기억해 둬도 좋아요. (5/5)", "copyAll": "'대문자+숫자+특수문자 꼭 섞으세요' 그 짜증나는 규칙…\n\n미국 표준기술연구소(NIST) 최신 지침은 서비스가 이걸 강제하면 안 된다고 해요 🧵 #비밀번호 (1/5)\n\n---\n\n근거: NIST SP 800-63B-4(2025년 7월 최종본).\n\n문자 종류 섞기 같은 조합 규칙은 강제 금지. 유출 비밀번호를 분석해 보니 효과는 기대보다 작고 사용성만 떨어뜨린다는 설명이에요. (2/5)\n\n---\n\n대신 중요한 건 길이.\n\n비밀번호 하나로만 로그인하면 최소 15자, 다중인증의 한 요소면 최소 8자.\n\n서비스는 64자 이상도 받아 줘야 한다고 적혀 있어요. (3/5)\n\n---\n\n'90일마다 변경'도 요구하지 말 것.\n\n대신 유출 정황이 있으면 바꾸게 해야 하고, 새 비밀번호는 흔하거나 유출된 비밀번호 목록과 대조해야 해요. (4/5)\n\n---\n\n단, 미국 정부 정보시스템용 기술 지침이라 각 사이트 규칙은 다를 수 있어요.\n\n내 계정엔 '특수문자보다 길이' 하나만 기억해 둬도 좋아요. (5/5)", "extras": [{"title": "이미지·미디어 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>트윗 3<\/td><td>'15 / 8 / 64+' 숫자 카드(직접 제작)<\/td><td>이미지에만 정보를 넣지 말 것<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 트윗 3의 15자·8자·64자를 NIST 인증 수단 페이지에서 직접 확인<\/li><li class=\"cb\">☐ 트윗 4의 정기 변경 금지·유출 시 강제 변경·목록 대조가 같은 페이지 조항과 맞는지 확인<\/li><li class=\"cb\">☐ 트윗 5 '정부 정보시스템 대상' 설명을 CSRC 개요와 대조<\/li><li class=\"cb\">☐ 특정 서비스 규칙을 평가하는 문장을 추가하지 않기<\/li><li class=\"cb\">☐ 발행은 직접 수동으로<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>SP 800-63B-4 최종(2025년 7월), 정부 정보시스템 대상 인증 지침<\/td><td>NIST CSRC <a href=\"https://csrc.nist.gov/pubs/sp/800/63/b/4/final\" target=\"_blank\" rel=\"noopener noreferrer\">https://csrc.nist.gov/pubs/sp/800/63/b/4/final<\/a><\/td><td>공식<\/td><\/tr><tr><td>길이 최소(15자/8자), 최대 64자 이상 허용, 조합 규칙 금지, 정기 변경 금지, 유출 시 변경 강제, 차단 목록 대조<\/td><td>NIST SP 800-63-4 <a href=\"https://pages.nist.gov/800-63-4/sp800-63b/authenticators/\" target=\"_blank\" rel=\"noopener noreferrer\">https://pages.nist.gov/800-63-4/sp800-63b/authenticators/<\/a><\/td><td>공식<\/td><\/tr><tr><td>조합 규칙의 효과가 기대보다 작고 사용성에 해롭다는 설명, 길이가 핵심 요소<\/td><td>NIST SP 800-63-4 부록 <a href=\"https://pages.nist.gov/800-63-4/sp800-63b/passwords/\" target=\"_blank\" rel=\"noopener noreferrer\">https://pages.nist.gov/800-63-4/sp800-63b/passwords/<\/a><\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>(선택) 스레드 끝 답글이나 프로필에 쓸 수 있는 문구: \"AI 도움을 받아 초안을 쓰고, 공식 자료로 사실을 확인했어요. 날짜·규정은 바뀔 수 있어요.\"<\/blockquote>", "open": false}], "search": "018 '대문자+숫자+특수문자 섞으세요' 그 규칙, 미국 NIST는 강제하지 말라고 함 디지털·보안 비밀번호, NIST, 보안, 패스프레이즈, 인증 #비밀번호 미국 NIST 2025년 7월 최종 지침(SP 800-63B-4)의 비밀번호 원칙(조합 규칙 강제 금지·길이 중시·정기 변경 요구 금지·유출 목록 대조)을 한국어 5개 트윗으로 정리 NIST SP 800-63B-4(2025년 7월 최종): 조합 규칙 강제 금지, 길이 중시(단독 15자·다중인증 8자 이상, 64자 이상 허용), 정기 변경 요구 금지(유출 정황 시 변경), 흔한·유출 비밀번호 목록 대조. 미국 정부 시스템용 지침이라 개별 사이트는 다를 수 있어요(2026-10-05 한국어로 재작성). '대문자+숫자+특수문자 꼭 섞으세요' 그 짜증나는 규칙… 미국 표준기술연구소(NIST) 최신 지침은 서비스가 이걸 강제하면 안 된다고 해요 🧵 #비밀번호 (1/5) --- 근거: NIST SP 800-63B-4(2025년 7월 최종본). 문자 종류 섞기 같은 조합 규칙은 강제 금지. 유출 비밀번호를 분석해 보니 효과는 기대보다 작고 사용성만 떨어뜨린다는 설명이에요. (2/5) --- 대신 중요한 건 길이. 비밀번호 하나로만 로그인하면 최소 15자, 다중인증의 한 요소면 최소 8자. 서비스는 64자 이상도 받아 줘야 한다고 적혀 있어요. (3/5) --- '90일마다 변경'도 요구하지 말 것. 대신 유출 정황이 있으면 바꾸게 해야 하고, 새 비밀번호는 흔하거나 유출된 비밀번호 목록과 대조해야 해요. (4/5) --- 단, 미국 정부 정보시스템용 기술 지침이라 각 사이트 규칙은 다를 수 있어요. 내 계정엔 '특수문자보다 길이' 하나만 기억해 둬도 좋아요. (5/5) X 일반"}, {"id": "017", "platform": "x", "sub": "x_general", "subLabel": "X 일반", "file": "017_korea-help-numbers.md", "title": "외국인 친구가 한국 온다면 폰에 이 번호부터 저장시켜 주세요", "cands": ["외국인 친구가 한국 온다면 폰에 이 번호부터 저장시켜 주세요", "한국 여행 온 친구가 길 잃었을 때, 112 말고 먼저 걸 번호", "1330·1345 뭔지 아는 사람? 외국인 친구용 필수 번호 4개"], "cat": "방한·체류 실용", "kw": ["1330", "112", "119", "1345", "외국인 관광객", "긴급전화"], "summary": "외국인 친구가 한국에 올 때 저장해 둘 번호(112 경찰, 119 소방·구급, 1330 관광통역·안내, 1345 법무부 외국인 종합안내)를 한국어 단일 포스트로 정리", "status": "초안", "created": "2026-10-05 13:45", "base": "2026-10-05", "format": "single", "hashtags": "#한국여행", "tags": ["#한국여행"], "ko": "외국인 친구에게 알려 줄 번호: 112(경찰), 119(소방·구급), 1330(관광 통역·안내·불편 신고, 해외에서는 +82-2-1330), 1345(법무부 외국인 종합안내). 위급하지 않으면 1330부터. 단일 포스트 1개 + 답글 2개(2026-10-05 한국어로 재작성).", "need": 0, "chars": 214, "imgs": 0, "tweets": [{"n": 1, "total": 1, "text": "외국인 친구가 한국 온다면 폰에 이 번호부터 저장시켜 주세요 📱\n\n🚓 112 경찰\n🚒 119 소방·구급\n🧭 1330 관광통역·안내·불편신고 (해외에선 +82-2-1330)\n🛂 1345 외국인 출입국 안내(법무부)\n\n급한 일 아니면 1330부터 #한국여행", "len": 214, "need": 0, "media": []}], "replies": [{"text": "출처: 한국관광공사 1330 안내 https://english.visitkorea.or.kr/svc/contents/contentsView.do?vcontsId=140632 · VISITKOREA 긴급상황 FAQ https://english.visitkorea.or.kr/svc/faq/faqMainView.do?menuSn=404&pstSn=94", "len": 102, "need": 0}, {"text": "1330은 1345·119로 연결도 해 주고 영어·일본어·중국어 등 여러 언어로 상담해요. 일부 언어는 운영시간이 더 짧고, 통화료는 일반 요금이라고 안전디딤돌이 안내해요 https://eng.safekorea.go.kr/safekorea-eng/userful/links/eng/userfulLinks.do?menuSn=1013", "len": 179, "need": 0}], "plain": "외국인 친구가 한국 온다면 폰에 이 번호부터 저장시켜 주세요 📱\n\n🚓 112 경찰\n🚒 119 소방·구급\n🧭 1330 관광통역·안내·불편신고 (해외에선 +82-2-1330)\n🛂 1345 외국인 출입국 안내(법무부)\n\n급한 일 아니면 1330부터 #한국여행", "copyAll": "외국인 친구가 한국 온다면 폰에 이 번호부터 저장시켜 주세요 📱\n\n🚓 112 경찰\n🚒 119 소방·구급\n🧭 1330 관광통역·안내·불편신고 (해외에선 +82-2-1330)\n🛂 1345 외국인 출입국 안내(법무부)\n\n급한 일 아니면 1330부터 #한국여행", "extras": [{"title": "이미지·미디어 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>본문<\/td><td>번호 4개를 크게 쓴 직접 제작 카드(본문과 같은 내용)<\/td><td>이미지에만 정보를 넣지 말 것, 알트텍스트 권장<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 게시 직전 VISITKOREA 1330 페이지에서 서비스가 같은 방식으로 운영되는지 확인<\/li><li class=\"cb\">☐ Reply 2: 언어별 운영시간 숫자는 공식 최신값을 찾지 못해 넣지 않았음(넣고 싶으면 공식 안내로 확인 후)<\/li><li class=\"cb\">☐ 1345(법무부 외국인 종합안내센터) 설명을 HiKorea/법무부 안내로 확인<\/li><li class=\"cb\">☐ 이모지 포함 글자수가 280 이하인지 게시 화면 카운터로 확인<\/li><li class=\"cb\">☐ 발행은 직접 수동으로<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>1330 여행안내·통역·불만접수, +82-2-1330<\/td><td>VISITKOREA(한국관광공사) <a href=\"https://english.visitkorea.or.kr/svc/contents/contentsView.do?vcontsId=140632\" target=\"_blank\" rel=\"noopener noreferrer\">https://english.visitkorea.or.kr/svc/contents/contentsView.do?vcontsId=140632 한글날(10월 9일) 날짜가 정해진 방식(해례본 간행 '9월 상순' 끝날 환산), 28자→24자, 해례본 유네스코 기록유산(1997), 세종대왕 문해상, 공휴일 복원(2013)을 한국어 6개 트윗으로 정리", "status": "초안", "created": "2026-10-05 13:45", "base": "2026-10-05", "format": "thread", "hashtags": "#한글날", "tags": ["#한글날"], "ko": "한글날(10월 9일)은 해례본 간행 시기 '1446년 음력 9월 상순'의 끝날(10일)을 양력으로 환산한 날이라 정확한 날짜는 아니에요. 28자→24자, 해례본 유네스코 세계기록유산(1997), 유네스코 세종대왕 문해상(1989 제정, 2025 수상 세네갈·에콰도르·태국), 1990년 공휴일 제외→2013년 복원을 6개 트윗으로 정리했어요(2026-10-05 한국어로 재작성).", "need": 0, "chars": 159, "imgs": 0, "tweets": [{"n": 1, "total": 6, "text": "이번 주 금요일(10월 9일)은 한글날.\n\n근데 이 날짜, 사실 '정확히 이날'이 아니라 계산해서 정한 날이라는 거 알고 있었음? 🧵 #한글날 (1/6)", "len": 133, "need": 0, "media": []}, {"n": 2, "total": 6, "text": "세종대왕이 한글을 완성한 건 1443년 음력 12월(국가유산청).\n\n처음 이름은 '훈민정음' — 백성을 가르치는 바른 소리라는 뜻. (2/6)", "len": 123, "need": 0, "media": []}, {"n": 3, "total": 6, "text": "처음엔 28자였는데 지금 우리가 쓰는 건 24자.\n\n4글자는 쓰이다가 사라졌어요. 국가유산청은 한글을 독창적이고 과학적인 문자라고 설명해요. (3/6)", "len": 138, "need": 0, "media": []}, {"n": 4, "total": 6, "text": "날짜 미스터리 🧩\n\n해설서(해례본)가 나온 건 1446년 음력 9월 '상순'. 그래서 상순의 끝날인 9월 10일을 양력으로 바꾼 게 10월 9일.\n\n정확한 날은 기록에 없어요. (4/6)", "len": 159, "need": 0, "media": []}, {"n": 5, "total": 6, "text": "그 해례본은 1997년 유네스코 세계기록유산에 등재.\n\n유네스코엔 '세종대왕 문해상'도 있어요(1989년 제정). 2025년 수상 기관은 세네갈·에콰도르·태국. (5/6)", "len": 148, "need": 0, "media": []}, {"n": 6, "total": 6, "text": "그리고 한글날은 1990년에 공휴일에서 빠졌다가, 2012년 규정 개정으로 2013년부터 다시 쉬는 날이 됐어요.\n\n올해 한글날은 금요일. 다들 좋은 연휴 보내요 🙌 (6/6)", "len": 154, "need": 0, "media": []}], "replies": [{"text": "출처: 국가유산청 훈민정음 해례본 https://english.khs.go.kr/cop/bbs/selectBoardArticle.do?bbsId=BBSMSTR_1205&ctgryLrcls=CTGRY211&mn=EN_03_03&nttId=57977&uniq=0 · 유네스코 세계기록유산 https://www.unesco.org/en/memory-world/hunminjeongum-manuscript", "len": 104, "need": 0}, {"text": "더 보기: 문체부 세종대왕 문해상 보도자료 https://www.mcst.go.kr/english/policy/pressView.jsp?pSeq=548 · 국가기록원 한글날 공휴일 재지정 https://theme.archives.go.kr/next/hangeulPolicy/holiday2013.do", "len": 122, "need": 0}], "plain": "이번 주 금요일(10월 9일)은 한글날.\n\n근데 이 날짜, 사실 '정확히 이날'이 아니라 계산해서 정한 날이라는 거 알고 있었음? 🧵 #한글날 (1/6)\n\n---\n\n세종대왕이 한글을 완성한 건 1443년 음력 12월(국가유산청).\n\n처음 이름은 '훈민정음' — 백성을 가르치는 바른 소리라는 뜻. (2/6)\n\n---\n\n처음엔 28자였는데 지금 우리가 쓰는 건 24자.\n\n4글자는 쓰이다가 사라졌어요. 국가유산청은 한글을 독창적이고 과학적인 문자라고 설명해요. (3/6)\n\n---\n\n날짜 미스터리 🧩\n\n해설서(해례본)가 나온 건 1446년 음력 9월 '상순'. 그래서 상순의 끝날인 9월 10일을 양력으로 바꾼 게 10월 9일.\n\n정확한 날은 기록에 없어요. (4/6)\n\n---\n\n그 해례본은 1997년 유네스코 세계기록유산에 등재.\n\n유네스코엔 '세종대왕 문해상'도 있어요(1989년 제정). 2025년 수상 기관은 세네갈·에콰도르·태국. (5/6)\n\n---\n\n그리고 한글날은 1990년에 공휴일에서 빠졌다가, 2012년 규정 개정으로 2013년부터 다시 쉬는 날이 됐어요.\n\n올해 한글날은 금요일. 다들 좋은 연휴 보내요 🙌 (6/6)", "copyAll": "이번 주 금요일(10월 9일)은 한글날.\n\n근데 이 날짜, 사실 '정확히 이날'이 아니라 계산해서 정한 날이라는 거 알고 있었음? 🧵 #한글날 (1/6)\n\n---\n\n세종대왕이 한글을 완성한 건 1443년 음력 12월(국가유산청).\n\n처음 이름은 '훈민정음' — 백성을 가르치는 바른 소리라는 뜻. (2/6)\n\n---\n\n처음엔 28자였는데 지금 우리가 쓰는 건 24자.\n\n4글자는 쓰이다가 사라졌어요. 국가유산청은 한글을 독창적이고 과학적인 문자라고 설명해요. (3/6)\n\n---\n\n날짜 미스터리 🧩\n\n해설서(해례본)가 나온 건 1446년 음력 9월 '상순'. 그래서 상순의 끝날인 9월 10일을 양력으로 바꾼 게 10월 9일.\n\n정확한 날은 기록에 없어요. (4/6)\n\n---\n\n그 해례본은 1997년 유네스코 세계기록유산에 등재.\n\n유네스코엔 '세종대왕 문해상'도 있어요(1989년 제정). 2025년 수상 기관은 세네갈·에콰도르·태국. (5/6)\n\n---\n\n그리고 한글날은 1990년에 공휴일에서 빠졌다가, 2012년 규정 개정으로 2013년부터 다시 쉬는 날이 됐어요.\n\n올해 한글날은 금요일. 다들 좋은 연휴 보내요 🙌 (6/6)", "extras": [{"title": "이미지·미디어 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>트윗 1<\/td><td>직접 만든 텍스트 카드('10월 9일 = 계산으로 정한 날')<\/td><td>남의 짤·방송 캡처는 첨부하지 말고, 쓰고 싶으면 원본 링크 인용<\/td><\/tr><tr><td>트윗 3<\/td><td>한글 자모 24자 표(직접 제작)<\/td><td>폰트 상업 이용 가능 여부 확인<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 트윗 2·3·4의 1443년·28자→24자·1446년 9월 상순 서술을 국가유산청 페이지와 대조<\/li><li class=\"cb\">☐ 트윗 5 유네스코 세종대왕 문해상 설명(1989 제정, 2025 수상 기관)을 문체부 보도자료로 확인<\/li><li class=\"cb\">☐ 트윗 6: 1990년 공휴일 제외·2013년 복원을 국가기록원 페이지로 확인, '올해 한글날 금요일'(2026-10-09) 확인<\/li><li class=\"cb\">☐ 게시 직전 트윗별 글자수(280 이하)와 해시태그 1개 확인, 링크는 답글에만<\/li><li class=\"cb\">☐ 발행은 직접 수동으로<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>1443년 12월 완성, 훈민정음, 28자→24자, 1446년 9월 간행, 10일 이전 간행 판단, 양력 10월 9일 환산<\/td><td>Korea Heritage Service <a href=\"https://english.khs.go.kr/cop/bbs/selectBoardArticle.do?bbsId=BBSMSTR_1205&amp;ctgryLrcls=CTGRY211&amp;mn=EN_03_03&amp;nttId=57977&amp;uniq=0\" target=\"_blank\" rel=\"noopener noreferrer\">https://english.khs.go.kr/cop/bbs/selectBoardArticle.do?bbsId=BBSMSTR_1205&amp;ctgryLrcls=CTGRY211&amp;mn=EN_03_03&amp;nttId=57977&amp;uniq=0<\/a><\/td><td>공식<\/td><\/tr><tr><td>훈민정음(해례본) 유네스코 세계기록유산 등재 1997<\/td><td>UNESCO <a href=\"https://www.unesco.org/en/memory-world/hunminjeongum-manuscript\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.unesco.org/en/memory-world/hunminjeongum-manuscript<\/a><\/td><td>공식<\/td><\/tr><tr><td>한글날 지정 경위와 날짜 불확실성<\/td><td>국립국어원 <a href=\"https://www.korean.go.kr/eng_hangeul/origin/001.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korean.go.kr/eng_hangeul/origin/001.html<\/a><\/td><td>공식<\/td><\/tr><tr><td>유네스코 세종대왕 문해상 1989 제정, 2025 수상 기관(세네갈·에콰도르·태국)<\/td><td>문화체육관광부 보도자료(2025-09-12) <a href=\"https://www.mcst.go.kr/english/policy/pressView.jsp?pSeq=548\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.mcst.go.kr/english/policy/pressView.jsp?pSeq=548<\/a><\/td><td>공식<\/td><\/tr><tr><td>1990년 공휴일 제외, 2013년부터 다시 공휴일(관보 2012-12-28, 대통령령 24273호)<\/td><td>국가기록원 <a href=\"https://theme.archives.go.kr/next/hangeulPolicy/holiday2013.do\" target=\"_blank\" rel=\"noopener noreferrer\">https://theme.archives.go.kr/next/hangeulPolicy/holiday2013.do<\/a><\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>(선택) 스레드 끝 답글이나 프로필에 쓸 수 있는 문구: \"AI 도움을 받아 초안을 쓰고, 공식 자료로 사실을 확인했어요. 날짜·규정은 바뀔 수 있어요.\"<\/blockquote>", "open": false}], "search": "016 한글날이 10월 9일인 이유, 사실 '추정 날짜'라는 거 알고 있었음? 흥미로운 사실 한글날, 훈민정음, 해례본, 세종대왕, 유네스코 #한글날 한글날(10월 9일) 날짜가 정해진 방식(해례본 간행 '9월 상순' 끝날 환산), 28자→24자, 해례본 유네스코 기록유산(1997), 세종대왕 문해상, 공휴일 복원(2013)을 한국어 6개 트윗으로 정리 한글날(10월 9일)은 해례본 간행 시기 '1446년 음력 9월 상순'의 끝날(10일)을 양력으로 환산한 날이라 정확한 날짜는 아니에요. 28자→24자, 해례본 유네스코 세계기록유산(1997), 유네스코 세종대왕 문해상(1989 제정, 2025 수상 세네갈·에콰도르·태국), 1990년 공휴일 제외→2013년 복원을 6개 트윗으로 정리했어요(2026-10-05 한국어로 재작성). 이번 주 금요일(10월 9일)은 한글날. 근데 이 날짜, 사실 '정확히 이날'이 아니라 계산해서 정한 날이라는 거 알고 있었음? 🧵 #한글날 (1/6) --- 세종대왕이 한글을 완성한 건 1443년 음력 12월(국가유산청). 처음 이름은 '훈민정음' — 백성을 가르치는 바른 소리라는 뜻. (2/6) --- 처음엔 28자였는데 지금 우리가 쓰는 건 24자. 4글자는 쓰이다가 사라졌어요. 국가유산청은 한글을 독창적이고 과학적인 문자라고 설명해요. (3/6) --- 날짜 미스터리 🧩 해설서(해례본)가 나온 건 1446년 음력 9월 '상순'. 그래서 상순의 끝날인 9월 10일을 양력으로 바꾼 게 10월 9일. 정확한 날은 기록에 없어요. (4/6) --- 그 해례본은 1997년 유네스코 세계기록유산에 등재. 유네스코엔 '세종대왕 문해상'도 있어요(1989년 제정). 2025년 수상 기관은 세네갈·에콰도르·태국. (5/6) --- 그리고 한글날은 1990년에 공휴일에서 빠졌다가, 2012년 규정 개정으로 2013년부터 다시 쉬는 날이 됐어요. 올해 한글날은 금요일. 다들 좋은 연휴 보내요 🙌 (6/6) X 일반"}, {"id": "015", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "015_mobile-id-issuance.md", "title": "모바일 주민등록증·운전면허증 발급, IC 신분증 태그와 주민센터 QR 무엇이 다를까", "cands": ["지갑 없이 신분증 쓰기: 모바일 신분증 발급 방법 두 가지 비교 (2026년)", "모바일 신분증 8월 28일부터 법으로 보호받는다는데, 무엇이 달라졌을까?", "모바일 운전면허증 발급 준비물과 수수료, IC 면허증 방식 vs QR 방식"], "cat": "민원·디지털", "kw": ["모바일 신분증", "모바일 주민등록증", "모바일 운전면허증", "IC 주민등록증", "전자정부법 시행령"], "summary": "모바일 주민등록증·운전면허증의 두 가지 발급 방식(IC 태그/QR), 준비물과 수수료, 2026년 8월 28일 시행된 전자정부법 시행령의 핵심을 정리", "status": "초안", "created": "2026-10-05 12:28", "base": "2026-10-05", "need": 0, "chars": 1839, "chars_ns": 1418, "imgs": 3, "slots": 2, "filled": 2, "thumb": "img/015/015_0_thumb.png", "seHtml": "<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/015/015_0_thumb.png\" alt=\"대표 이미지\" width=\"720\"><\/p>\n<p>외출했는데 지갑을 놓고 나왔고, 하필 신분증이 필요한 상황이 생기면 난감하죠. 그럴 때 쓸 수 있는 모바일 신분증은 어떻게 발급받는지 궁금해서 정부 모바일 신분증 사이트의 발급 안내를 살펴봤어요. 행정안전부가 올해 8월에 낸 시행령 소식도 함께 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/lib/draft_5/d5_wm_Smartphone_Use.jpg\" alt=\"스마트폰 사용 사진(분위기 이미지, 모바일 신분증 앱 화면 아님) — Océanos y dados / Wikimedia Commons, CC0\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>모바일 신분증은 어떤 건가요?<\/b><\/span><\/p>\n<p>모바일 신분증 안내 사이트는 행정기관이 발행하는 신분증으로, 실물 신분증과 법적으로 동일한 효력을 가진다고 소개해요. 이름·주민번호·주소를 모두 보여 주지 않고 필요한 정보만 골라서 제공할 수 있다는 점도 장점으로 설명돼 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>모바일 주민등록증 발급, 두 갈래<\/b><\/span><\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>구분<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>IC 주민등록증 태그<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>주민센터 QR 발급<\/b><\/td><\/tr><tr><td>대상<\/td><td>IC 주민등록증이 있는 사람<\/td><td>기존 주민등록증 소지자<\/td><\/tr><tr><td>준비물<\/td><td>6개월 이내 사진 1장, 신분증(교체발급이면 기존 주민등록증), 수수료 1만 원(IC 주민등록증 발급용)<\/td><td>실물 주민등록증, 신청서 작성<\/td><\/tr><tr><td>순서<\/td><td>IC 주민등록증 신청(온라인 또는 주민센터) → 수령 → 신분증 앱 설치 → 휴대폰 뒷면에 태그해 본인 인증<\/td><td>주민센터 방문 → 앱 설치 → 본인 인증 → 공무원 안내에 따라 QR 촬영<\/td><\/tr><tr><td>특징<\/td><td>이후 스마트폰을 바꿔도 직접 재발급 가능<\/td><td>IC 주민등록증을 따로 만들지 않아도 됨<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p>주민센터에서 QR로 발급받는 방식은 수수료가 없어요. IC 주민등록증으로 재발급받는 경우는 재발급 수수료 5,000원에 IC 비용 5,000원이 더해진다고 정부24와 정부민원안내콜센터(110)가 안내해요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>모바일 운전면허증은 이렇게<\/b><\/span><\/p>\n<p>방식은 비슷해요. IC 운전면허증을 안전운전 통합민원 홈페이지나 운전면허시험장·경찰서에서 신청하고(사진 1장, 신분증, 수수료 1만 5천 원), 시험장이나 경찰서 민원실에서 받은 뒤 앱에서 휴대폰 뒷면에 태그해 발급해요. IC 면허증으로 바꾸고 싶지 않다면 실물 면허증을 들고 운전면허시험장을 방문해 신청서를 쓰고 QR 코드로 발급받을 수 있어요. 외국인등록증이 있는 국내 거주 외국인도 모바일 운전면허증을 발급받을 수 있다고 해요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>8월 28일부터 달라진 점<\/b><\/span><\/p>\n<p>행정안전부는 모바일 신분증의 종류와 안전성 확보 조치를 담은 전자정부법 시행령이 2026년 8월 28일부터 시행된다고 밝혔어요.<\/p>\n<ul><li>법적 근거가 분명해진 종류: 주민등록증, 운전면허증, 장애인등록증, 국가보훈등록증, 외국인등록증, 영주증, 외국국적동포 국내거소신고증, 공무원증이에요.<\/li><li>발급기관이 지켜야 할 조치: 본인 명의 스마트폰 중 1대에만 발급하고, 신청자가 본인인지 확인한 뒤 발급하며, 신원정보를 암호화하는 전자적 정보의 유효기간을 3년 이내로 정해야 해요.<\/li><li>부정 사용과 위·변조를 처벌하는 개정 전자정부법 규정도 함께 시행돼요.<\/li><\/ul>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>어디서 쓸 수 있고, 어떤 앱으로?<\/b><\/span><\/p>\n<p>정부가 제공하는 모바일 신분증 앱 외에 민간 앱으로도 쓸 수 있도록 개방이 진행 중이에요. 안내 사이트에는 현재 이용 가능한 민간 앱으로 삼성월렛(구 삼성페이)이 적혀 있고, 국민은행·네이버·농협은행·토스·카카오 등은 앞으로 제공할 예정이라고 되어 있어요. 이 목록은 2026년 10월 5일 확인 기준이라 바뀔 수 있으니, 발급 전에 사이트에서 직접 확인해 주세요.<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/015/015_2_card.png\" alt=\"모바일 신분증 한눈에 정리\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>방식 두 가지: IC 신분증 태그 또는 방문 후 QR 발급<\/li><li>필요한 것: 사진, 실물 신분증, 수수료(주민증 1만 원·운전면허증 1만 5천 원은 IC 신분증 발급용)<\/li><li>2026년 8월 28일부터 본인 명의 스마트폰 1대에만 발급<\/li><\/ul>\n<p>절차와 수수료는 바뀔 수 있으니 발급 전에 모바일 신분증 사이트와 해당 기관 안내를 확인해 주세요.<\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/015/015_0_thumb.png\n\n외출했는데 지갑을 놓고 나왔고, 하필 신분증이 필요한 상황이 생기면 난감하죠. 그럴 때 쓸 수 있는 모바일 신분증은 어떻게 발급받는지 궁금해서 정부 모바일 신분증 사이트의 발급 안내를 살펴봤어요. 행정안전부가 올해 8월에 낸 시행령 소식도 함께 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/lib/draft_5/d5_wm_Smartphone_Use.jpg\n\n모바일 신분증은 어떤 건가요?\n\n모바일 신분증 안내 사이트는 행정기관이 발행하는 신분증으로, 실물 신분증과 법적으로 동일한 효력을 가진다고 소개해요. 이름·주민번호·주소를 모두 보여 주지 않고 필요한 정보만 골라서 제공할 수 있다는 점도 장점으로 설명돼 있어요.\n\n모바일 주민등록증 발급, 두 갈래\n\n• 대상 — IC 주민등록증 태그: IC 주민등록증이 있는 사람 / 주민센터 QR 발급: 기존 주민등록증 소지자\n• 준비물 — IC 주민등록증 태그: 6개월 이내 사진 1장, 신분증(교체발급이면 기존 주민등록증), 수수료 1만 원(IC 주민등록증 발급용) / 주민센터 QR 발급: 실물 주민등록증, 신청서 작성\n• 순서 — IC 주민등록증 태그: IC 주민등록증 신청(온라인 또는 주민센터) → 수령 → 신분증 앱 설치 → 휴대폰 뒷면에 태그해 본인 인증 / 주민센터 QR 발급: 주민센터 방문 → 앱 설치 → 본인 인증 → 공무원 안내에 따라 QR 촬영\n• 특징 — IC 주민등록증 태그: 이후 스마트폰을 바꿔도 직접 재발급 가능 / 주민센터 QR 발급: IC 주민등록증을 따로 만들지 않아도 됨\n\n주민센터에서 QR로 발급받는 방식은 수수료가 없어요. IC 주민등록증으로 재발급받는 경우는 재발급 수수료 5,000원에 IC 비용 5,000원이 더해진다고 정부24와 정부민원안내콜센터(110)가 안내해요.\n\n모바일 운전면허증은 이렇게\n\n방식은 비슷해요. IC 운전면허증을 안전운전 통합민원 홈페이지나 운전면허시험장·경찰서에서 신청하고(사진 1장, 신분증, 수수료 1만 5천 원), 시험장이나 경찰서 민원실에서 받은 뒤 앱에서 휴대폰 뒷면에 태그해 발급해요. IC 면허증으로 바꾸고 싶지 않다면 실물 면허증을 들고 운전면허시험장을 방문해 신청서를 쓰고 QR 코드로 발급받을 수 있어요. 외국인등록증이 있는 국내 거주 외국인도 모바일 운전면허증을 발급받을 수 있다고 해요.\n\n8월 28일부터 달라진 점\n\n행정안전부는 모바일 신분증의 종류와 안전성 확보 조치를 담은 전자정부법 시행령이 2026년 8월 28일부터 시행된다고 밝혔어요.\n\n- 법적 근거가 분명해진 종류: 주민등록증, 운전면허증, 장애인등록증, 국가보훈등록증, 외국인등록증, 영주증, 외국국적동포 국내거소신고증, 공무원증이에요.\n- 발급기관이 지켜야 할 조치: 본인 명의 스마트폰 중 1대에만 발급하고, 신청자가 본인인지 확인한 뒤 발급하며, 신원정보를 암호화하는 전자적 정보의 유효기간을 3년 이내로 정해야 해요.\n- 부정 사용과 위·변조를 처벌하는 개정 전자정부법 규정도 함께 시행돼요.\n\n어디서 쓸 수 있고, 어떤 앱으로?\n\n정부가 제공하는 모바일 신분증 앱 외에 민간 앱으로도 쓸 수 있도록 개방이 진행 중이에요. 안내 사이트에는 현재 이용 가능한 민간 앱으로 삼성월렛(구 삼성페이)이 적혀 있고, 국민은행·네이버·농협은행·토스·카카오 등은 앞으로 제공할 예정이라고 되어 있어요. 이 목록은 2026년 10월 5일 확인 기준이라 바뀔 수 있으니, 발급 전에 사이트에서 직접 확인해 주세요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/015/015_2_card.png\n\n한눈에 정리\n\n- 방식 두 가지: IC 신분증 태그 또는 방문 후 QR 발급\n- 필요한 것: 사진, 실물 신분증, 수수료(주민증 1만 원·운전면허증 1만 5천 원은 IC 신분증 발급용)\n- 2026년 8월 28일부터 본인 명의 스마트폰 1대에만 발급\n\n절차와 수수료는 바뀔 수 있으니 발급 전에 모바일 신분증 사이트와 해당 기관 안내를 확인해 주세요.", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/015/015_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/015/015_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "015_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/lib/draft_5/d5_wm_Smartphone_Use.jpg", "abs": "https://senti-1000ma.github.io/blog-drafts/img/lib/draft_5/d5_wm_Smartphone_Use.jpg", "cap": "", "alt": "스마트폰 사용 사진(분위기 이미지, 모바일 신분증 앱 화면 아님) — Océanos y dados / Wikimedia Commons, CC0", "name": "d5_wm_Smartphone_Use.jpg", "w": 1080, "h": 720}, {"n": 2, "label": "사진 2", "uri": "img/015/015_2_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/015/015_2_card.png", "cap": "", "alt": "모바일 신분증 한눈에 정리", "name": "015_2_card.png", "w": 1080, "h": 816}], "zip": "img/015/015_images.zip", "html": "<figure class=\"ph thumbfig\" data-n=\"0\"><img src=\"img/015/015_0_thumb.png\" alt=\"대표 이미지\"><\/figure>\n<p>외출했는데 지갑을 놓고 나왔고, 하필 신분증이 필요한 상황이 생기면 난감하죠. 그럴 때 쓸 수 있는 모바일 신분증은 어떻게 발급받는지 궁금해서 정부 모바일 신분증 사이트의 발급 안내를 살펴봤어요. 행정안전부가 올해 8월에 낸 시행령 소식도 함께 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<figure class=\"ph\" data-n=\"1\"><img loading=\"lazy\" src=\"img/lib/draft_5/d5_wm_Smartphone_Use.jpg\" alt=\"스마트폰 사용 사진(분위기 이미지, 모바일 신분증 앱 화면 아님) — Océanos y dados / Wikimedia Commons, CC0\"><\/figure>\n<h3>모바일 신분증은 어떤 건가요?<\/h3>\n<p>모바일 신분증 안내 사이트는 행정기관이 발행하는 신분증으로, 실물 신분증과 법적으로 동일한 효력을 가진다고 소개해요. 이름·주민번호·주소를 모두 보여 주지 않고 필요한 정보만 골라서 제공할 수 있다는 점도 장점으로 설명돼 있어요.<\/p>\n<h3>모바일 주민등록증 발급, 두 갈래<\/h3>\n<div class=\"tw\"><table><thead><tr><th>구분<\/th><th>IC 주민등록증 태그<\/th><th>주민센터 QR 발급<\/th><\/tr><\/thead><tbody><tr><td>대상<\/td><td>IC 주민등록증이 있는 사람<\/td><td>기존 주민등록증 소지자<\/td><\/tr><tr><td>준비물<\/td><td>6개월 이내 사진 1장, 신분증(교체발급이면 기존 주민등록증), 수수료 1만 원(IC 주민등록증 발급용)<\/td><td>실물 주민등록증, 신청서 작성<\/td><\/tr><tr><td>순서<\/td><td>IC 주민등록증 신청(온라인 또는 주민센터) → 수령 → 신분증 앱 설치 → 휴대폰 뒷면에 태그해 본인 인증<\/td><td>주민센터 방문 → 앱 설치 → 본인 인증 → 공무원 안내에 따라 QR 촬영<\/td><\/tr><tr><td>특징<\/td><td>이후 스마트폰을 바꿔도 직접 재발급 가능<\/td><td>IC 주민등록증을 따로 만들지 않아도 됨<\/td><\/tr><\/tbody><\/table><\/div>\n<p>주민센터에서 QR로 발급받는 방식은 수수료가 없어요. IC 주민등록증으로 재발급받는 경우는 재발급 수수료 5,000원에 IC 비용 5,000원이 더해진다고 정부24와 정부민원안내콜센터(110)가 안내해요.<\/p>\n<h3>모바일 운전면허증은 이렇게<\/h3>\n<p>방식은 비슷해요. IC 운전면허증을 안전운전 통합민원 홈페이지나 운전면허시험장·경찰서에서 신청하고(사진 1장, 신분증, 수수료 1만 5천 원), 시험장이나 경찰서 민원실에서 받은 뒤 앱에서 휴대폰 뒷면에 태그해 발급해요. IC 면허증으로 바꾸고 싶지 않다면 실물 면허증을 들고 운전면허시험장을 방문해 신청서를 쓰고 QR 코드로 발급받을 수 있어요. 외국인등록증이 있는 국내 거주 외국인도 모바일 운전면허증을 발급받을 수 있다고 해요.<\/p>\n<h3>8월 28일부터 달라진 점<\/h3>\n<p>행정안전부는 모바일 신분증의 종류와 안전성 확보 조치를 담은 전자정부법 시행령이 2026년 8월 28일부터 시행된다고 밝혔어요.<\/p>\n<ul><li>법적 근거가 분명해진 종류: 주민등록증, 운전면허증, 장애인등록증, 국가보훈등록증, 외국인등록증, 영주증, 외국국적동포 국내거소신고증, 공무원증이에요.<\/li><li>발급기관이 지켜야 할 조치: 본인 명의 스마트폰 중 1대에만 발급하고, 신청자가 본인인지 확인한 뒤 발급하며, 신원정보를 암호화하는 전자적 정보의 유효기간을 3년 이내로 정해야 해요.<\/li><li>부정 사용과 위·변조를 처벌하는 개정 전자정부법 규정도 함께 시행돼요.<\/li><\/ul>\n<h3>어디서 쓸 수 있고, 어떤 앱으로?<\/h3>\n<p>정부가 제공하는 모바일 신분증 앱 외에 민간 앱으로도 쓸 수 있도록 개방이 진행 중이에요. 안내 사이트에는 현재 이용 가능한 민간 앱으로 삼성월렛(구 삼성페이)이 적혀 있고, 국민은행·네이버·농협은행·토스·카카오 등은 앞으로 제공할 예정이라고 되어 있어요. 이 목록은 2026년 10월 5일 확인 기준이라 바뀔 수 있으니, 발급 전에 사이트에서 직접 확인해 주세요.<\/p>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/015/015_2_card.png\" alt=\"모바일 신분증 한눈에 정리\"><\/figure>\n<h3>한눈에 정리<\/h3>\n<ul><li>방식 두 가지: IC 신분증 태그 또는 방문 후 QR 발급<\/li><li>필요한 것: 사진, 실물 신분증, 수수료(주민증 1만 원·운전면허증 1만 5천 원은 IC 신분증 발급용)<\/li><li>2026년 8월 28일부터 본인 명의 스마트폰 1대에만 발급<\/li><\/ul>\n<p>절차와 수수료는 바뀔 수 있으니 발급 전에 모바일 신분증 사이트와 해당 기관 안내를 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 라이선스 이미지 · 사진 2 자체 제작 카드 — 파일 images/posts/015/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래(대표)<\/td><td>스마트폰 사진 (images/draft_5/d5_wm_Smartphone_Use.jpg)<\/td><td>모바일 신분증 앱 화면이 아닌 일반 스마트폰 사진임을 캡션에 표시<\/td><\/tr><tr><td>발급 방식 표 아래<\/td><td>모바일 신분증 사이트(mobileid.go.kr) 발급 안내 화면 직접 캡처<\/td><td>개인 신분증 화면·QR 코드는 절대 캡처 금지<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 주민센터 QR 발급 무료·IC 재발급 1만 원(5,000+5,000) 안내가 발행 시점에도 같은지 정부24에서 확인<\/li><li class=\"cb\">☐ 현재 이용 가능한 민간 앱 목록을 모바일 신분증 사이트에서 확인해 본문 수정 (삼성월렛 외 추가 여부)<\/li><li class=\"cb\">☐ 이미지가 모바일 신분증 앱의 실제 화면이 아니라는 캡션 유지<\/li><li class=\"cb\">☐ 본인이 발급해 본 경험이 있을 때만 경험 문장 추가, 신분증 내용·QR은 가리기<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>모바일 신분증 소개, 법적 효력, 민간 앱 현황<\/td><td>모바일 신분증 사이트 <a href=\"https://mobileid.go.kr/mip/hps/main.do\" target=\"_blank\" rel=\"noopener noreferrer\">https://mobileid.go.kr/mip/hps/main.do<\/a><\/td><td>공식<\/td><\/tr><tr><td>모바일 주민등록증 발급 방법(IC 태그/QR), 준비물, 수수료<\/td><td>모바일 신분증 사이트 <a href=\"https://www.mobileid.go.kr/mip/hps/issuReqstGuidance/issuReqstGuidanceMrc.do\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.mobileid.go.kr/mip/hps/is 행령 소식도 함께 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/lib/draft_5/d5_wm_Smartphone_Use.jpg\n\n모바일 신분증은 어떤 건가요?\n\n모바일 신분증 안내 사이트는 행정기관이 발행하는 신분증으로, 실물 신분증과 법적으로 동일한 효력을 가진다고 소개해요. 이름·주민번호·주소를 모두 보여 주지 않고 필요한 정보만 골라서 제공할 수 있다는 점도 장점으로 설명돼 있어요.\n\n모바일 주민등록증 발급, 두 갈래\n\n• 대상 — IC 주민등록증 태그: IC 주민등록증이 있는 사람 / 주민센터 QR 발급: 기존 주민등록증 소지자\n• 준비물 — IC 주민등록증 태그: 6개월 이내 사진 1장, 신분증(교체발급이면 기존 주민등록증), 수수료 1만 원(IC 주민등록증 발급용) / 주민센터 QR 발급: 실물 주민등록증, 신청서 작성\n• 순서 — IC 주민등록증 태그: IC 주민등록증 신청(온라인 또는 주민센터) → 수령 → 신분증 앱 설치 → 휴대폰 뒷면에 태그해 본인 인증 / 주민센터 QR 발급: 주민센터 방문 → 앱 설치 → 본인 인증 → 공무원 안내에 따라 QR 촬영\n• 특징 — IC 주민등록증 태그: 이후 스마트폰을 바꿔도 직접 재발급 가능 / 주민센터 QR 발급: IC 주민등록증을 따로 만들지 않아도 됨\n\n주민센터에서 QR로 발급받는 방식은 수수료가 없어요. IC 주민등록증으로 재발급받는 경우는 재발급 수수료 5,000원에 IC 비용 5,000원이 더해진다고 정부24와 정부민원안내콜센터(110)가 안내해요.\n\n모바일 운전면허증은 이렇게\n\n방식은 비슷해요. IC 운전면허증을 안전운전 통합민원 홈페이지나 운전면허시험장·경찰서에서 신청하고(사진 1장, 신분증, 수수료 1만 5천 원), 시험장이나 경찰서 민원실에서 받은 뒤 앱에서 휴대폰 뒷면에 태그해 발급해요. IC 면허증으로 바꾸고 싶지 않다면 실물 면허증을 들고 운전면허시험장을 방문해 신청서를 쓰고 QR 코드로 발급받을 수 있어요. 외국인등록증이 있는 국내 거주 외국인도 모바일 운전면허증을 발급받을 수 있다고 해요.\n\n8월 28일부터 달라진 점\n\n행정안전부는 모바일 신분증의 종류와 안전성 확보 조치를 담은 전자정부법 시행령이 2026년 8월 28일부터 시행된다고 밝혔어요.\n\n- 법적 근거가 분명해진 종류: 주민등록증, 운전면허증, 장애인등록증, 국가보훈등록증, 외국인등록증, 영주증, 외국국적동포 국내거소신고증, 공무원증이에요.\n- 발급기관이 지켜야 할 조치: 본인 명의 스마트폰 중 1대에만 발급하고, 신청자가 본인인지 확인한 뒤 발급하며, 신원정보를 암호화하는 전자적 정보의 유효기간을 3년 이내로 정해야 해요.\n- 부정 사용과 위·변조를 처벌하는 개정 전자정부법 규정도 함께 시행돼요.\n\n어디서 쓸 수 있고, 어떤 앱으로?\n\n정부가 제공하는 모바일 신분증 앱 외에 민간 앱으로도 쓸 수 있도록 개방이 진행 중이에요. 안내 사이트에는 현재 이용 가능한 민간 앱으로 삼성월렛(구 삼성페이)이 적혀 있고, 국민은행·네이버·농협은행·토스·카카오 등은 앞으로 제공할 예정이라고 되어 있어요. 이 목록은 2026년 10월 5일 확인 기준이라 바뀔 수 있으니, 발급 전에 사이트에서 직접 확인해 주세요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/015/015_2_card.png\n\n한눈에 정리\n\n- 방식 두 가지: IC 신분증 태그 또는 방문 후 QR 발급\n- 필요한 것: 사진, 실물 신분증, 수수료(주민증 1만 원·운전면허증 1만 5천 원은 IC 신분증 발급용)\n- 2026년 8월 28일부터 본인 명의 스마트폰 1대에만 발급\n\n절차와 수수료는 바뀔 수 있으니 발급 전에 모바일 신분증 사이트와 해당 기관 안내를 확인해 주세요.", "copyAll": "외출했는데 지갑을 놓고 나왔고, 하필 신분증이 필요한 상황이 생기면 난감하죠. 그럴 때 쓸 수 있는 모바 search": "015 모바일 주민등록증·운전면허증 발급, IC 신분증 태그와 주민센터 QR 무엇이 다를까 민원·디지털 모바일 신분증, 모바일 주민등록증, 모바일 운전면허증, IC 주민등록증, 전자정부법 시행령 모바일 주민등록증·운전면허증의 두 가지 발급 방식(IC 태그/QR), 준비물과 수수료, 2026년 8월 28일 시행된 전자정부법 시행령의 핵심을 정리 외출했는데 지갑을 놓고 나왔고, 하필 신분증이 필요한 상황이 생기면 난감하죠. 그럴 때 쓸 수 있는 모바일 신분증은 어떻게 발급받는지 궁금해서 정부 모바일 신분증 사이트의 발급 안내를 살펴봤어요. 행정안전부가 올해 8월에 낸 시행령 소식도 함께 정리했습니다. (2026년 10월 5일 기준) [사진 1] https://senti-1000ma.github.io/blog-drafts/img/lib/draft_5/d5_wm_Smartphone_Use.jpg 모바일 신분증은 어떤 건가요? 모바일 신분증 안내 사이트는 행정기관이 발행하는 신분증으로, 실물 신분증과 법적으로 동일한 효력을 가진다고 소개해요. 이름·주민번호·주소를 모두 보여 주지 않고 필요한 정보만 골라서 제공할 수 있다는 점도 장점으로 설명돼 있어요. 모바일 주민등록증 발급, 두 갈래 • 대상 — IC 주민등록증 태그: IC 주민등록증이 있는 사람 / 주민센터 QR 발급: 기존 주민등록증 소지자 • 준비물 — IC 주민등록증 태그: 6개월 이내 사진 1장, 신분증(교체발급이면 기존 주민등록증), 수수료 1만 원(IC 주민등록증 발급용) / 주민센터 QR 발급: 실물 주민등록증, 신청서 작성 • 순서 — IC 주민등록증 태그: IC 주민등록증 신청(온라인 또는 주민센터) → 수령 → 신분증 앱 설치 → 휴대폰 뒷면에 태그해 본인 인증 / 주민센터 QR 발급: 주민센터 방문 → 앱 설치 → 본인 인증 → 공무원 안내에 따라 QR 촬영 • 특징 — IC 주민등록증 태그: 이후 스마트폰을 바꿔도 직접 재발급 가능 / 주민센터 QR 발급: IC 주민등록증을 따로 만들지 않아도 됨 주민센터에서 QR로 발급받는 방식은 수수료가 없어요. IC 주민등록증으로 재발급받는 경우는 재발급 수수료 5,000원에 IC 비용 5,000원이 더해진다고 정부24와 정부민원안내콜센터(110)가 안내해요. 모바일 운전면허증은 이렇게 방식은 비슷해요. IC 운전면허증을 안전운전 통합민원 홈페이지나 운전면허시험장·경찰서에서 신청하고(사진 1장, 신분증, 수수료 1만 5천 원), 시험장이나 경찰서 민원실에서 받은 뒤 앱에서 휴대폰 뒷면에 태그해 발급해요. IC 면허증으로 바꾸고 싶지 않다면 실물 면허증을 들고 운전면허시험장을 방문해 신청서를 쓰고 QR 코드로 발급받을 수 있어요. 외국인등록증이 있는 국내 거주 외국인도 모바일 운전면허증을 발급받을 수 있다고 해요. 8월 28일부터 달라진 점 행정안전부는 모바일 신분증의 종류와 안전성 확보 조치를 담은 전자정부법 시행령이 2026년 8월 28일부터 시행된다고 밝혔어요. - 법적 근거가 분명해진 종류: 주민등록증, 운전면허증, 장애인등록증, 국가보훈등록증, 외국인등록증, 영주증, 외국국적동포 국내거소신고증, 공무원증이에요. - 발급기관이 지켜야 할 조치: 본인 명의 스마트폰 중 1대에만 발급하고, 신청자가 본인인지 확인한 뒤 발급하며, 신원정보를 암호화하는 전자적 정보의 유효기간을 3년 이내로 정해야 해요. - 부정 사용과 위·변조를 처벌하는 개정 전자정부법 규정도 함께 시행돼요. 어디서 쓸 수 있고, 어떤 앱으로? 정부가 제공하는 모바일 신분증 앱 외에 민간 앱으로도 쓸 수 있도록 개방이 진행 중이에요. 안내 사이트에는 현재 이용 가능한 민간 앱으로 삼성월렛(구 삼성페이)이 적혀 있고, 국민은행·네이버·농협은행·토스·카카오 등은 앞으로 제공할 예정이라고 되어 있어요. 이 목록은 2026년 10월 5일 확인 기준이라 바뀔 수 있으니, 발급 전에 사이트에서 직접 확인해 주세요. [사진 2] https://senti-1000ma.github.io/blog-drafts/img/015/015_2_card.png 한눈에 정리 - 방식 두 가지: IC 신분증 태그 또는 방문 후 QR 발급 - 필요한 것: 사진, 실물 신분증, 수수료(주민증 1만 원·운전면허증 1만 5천 원은 IC 신분증 발급용) - 2026년 8월 28일부터 본인 명의 스마트폰 1대에만 발급 절차와 수수료는 바뀔 수 있으니 발급 전에 모바일 신분증 사이트와 해당 기관 안내를 확인해 주세요. 네이버"}, {"id": "014", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "014_parental-benefit-child-allowance.md", "title": "부모급여와 아동수당, 나이·금액·신청 시기 비교 (2026년 달라진 점 포함)", "cands": ["부모급여랑 아동수당은 뭐가 다를까? 한 표로 정리한 2026년 육아 지원금", "아동수당 만 9세 미만으로 확대! 지역별 금액과 소급 지급 정리", "출생 후 60일 안에 신청하세요: 부모급여·아동수당 신청 기한과 지급일"], "cat": "육아·가족", "kw": ["부모급여", "아동수당", "아동수당 확대", "출생 60일 신청", "어린이집 차액"], "summary": "부모급여와 아동수당의 대상 연령·금액·지급일·신청 방법을 표로 비교하고 2026년 아동수당 확대(만 9세 미만, 지역별 금액)를 정리", "status": "초안", "created": "2026-10-05 12:27", "base": "2026-10-05", "need": 0, "chars": 1928, "chars_ns": 1483, "imgs": 3, "slots": 2, "filled": 2, "thumb": "img/014/014_0_thumb.png", "seHtml": "<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/014/014_0_thumb.png\" alt=\"대표 이미지\" width=\"720\"><\/p>\n<p>\"부모급여랑 아동수당, 둘 다 받을 수 있나요?\" 육아를 시작하면 가장 먼저 헷갈리는 질문 중 하나예요. 두 제도는 이름이 비슷하지만 대상 나이와 금액, 지급일이 달라서 표로 나란히 비교해 봤어요. 보건복지부 안내와 정책브리핑을 바탕으로 했고, 아동수당은 올해 바뀐 부분도 반영했습니다. (2026년 10월 5일 기준)<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/014/014_1_card.png\" alt=\"부모급여 vs 아동수당\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한 표로 비교하기<\/b><\/span><\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>구분<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>부모급여<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>아동수당<\/b><\/td><\/tr><tr><td>대상<\/td><td>만 2세 미만(0~23개월) 아동<\/td><td>2026년은 만 9세 미만 아동<\/td><\/tr><tr><td>금액<\/td><td>0세 월 100만 원, 1세 월 50만 원<\/td><td>수도권 월 10만 원, 비수도권 월 10만 5천 원, 인구감소지역 월 11만~12만 원<\/td><\/tr><tr><td>지급일<\/td><td>가정 양육은 매월 25일, 어린이집 이용 차액은 다음 달 20일<\/td><td>매월 25일(휴일이면 그 전날)<\/td><\/tr><tr><td>신청<\/td><td>읍·면·동 행정복지센터, 복지로, 정부24<\/td><td>읍·면·동 행정복지센터, 복지로(앱 포함), 정부24<\/td><\/tr><tr><td>소급<\/td><td>출생일로부터 60일 이내 신청하면 출생한 달부터<\/td><td>출생일 포함 60일 이내 신청하면 출생한 달부터<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p>정부24의 아동수당 안내에는 아동수당이 보육료나 양육수당 같은 다른 복지급여를 받는지와 상관없이 나이·국적·주민등록 요건만 맞으면 지급된다고 적혀 있어요. 부모급여는 출생신고와 함께 한 번에 신청하는 원스톱 신청도 가능하다고 해요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>어린이집에 보내면 부모급여는 어떻게 될까?<\/b><\/span><\/p>\n<p>어린이집을 이용하면 영유아 기본보육료를 뺀 차액을 현금으로 받아요. 2026년 기준 0세(0~11개월)는 100만 원에서 보육료 58만 4천 원을 뺀 41만 6천 원이고, 1세(12~23개월)는 50만 원보다 보육료 51만 5천 원이 커서 차액이 없다고 안내돼 있어요. 어린이집이나 종일제 아이돌봄은 부모급여와 별개로 신청해야 한다는 점도 함께 나와 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>올해 아동수당이 달라진 점<\/b><\/span><\/p>\n<ul><li>대상 확대: 아동수당법이 개정되어 지급 대상이 13세 미만까지 단계적으로 넓어져요. 2025년 8세 미만, 2026년 9세 미만, 2027년 10세 미만으로 이어져 2030년에 13세 미만이 돼요.<\/li><li>지역별 금액: 거주 지역에 따라 금액이 달라요. 인구감소지역은 우대 지역이 11만 원, 특별 지역이 12만 원이에요. 내가 사는 시·군·구가 어디에 속하는지는 복지부 정책브리핑의 지역 목록으로 확인할 수 있어요.<\/li><li>상품권 추가 지원: 인구감소지역에서 지역사랑상품권으로 받으면 월 1만 원 상당이 더해지는데, 2026년 하반기부터 지역별로 조례 등을 거쳐 추진한다고 해요. 실제 시행 여부와 시기는 지자체마다 다를 수 있으니 사는 곳의 시·군·구 공지를 확인해 주세요.<\/li><li>적용 시점: 확대분은 4월 지급분부터이고 1월분까지 소급돼요. 이미 지급이 끝났던 2017년 1월~2018년 3월생 아동은 지자체가 직권 신청 절차를 거쳐 순차적으로 지급한다고 해요.<\/li><\/ul>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>정보가 서로 달라 보일 때<\/b><\/span><\/p>\n<p>정부24 아동수당 서비스 페이지(최종 수정 2026년 2월 20일)에는 아직 만 8세 미만, 월 10만 원으로 적혀 있어요. 반면 보건복지부 정책 페이지(2026년 3월 31일 수정)와 정책브리핑(2026년 3월 30일)은 개정된 만 9세 미만과 지역별 금액을 안내해요. 개정 이후 날짜의 자료를 기준으로 삼는 게 안전합니다.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한 가지 더, 피싱 주의<\/b><\/span><\/p>\n<p>복지부는 아동수당 확대와 관련해 신청을 요구하는 문자나 링크는 피싱일 수 있다며 주의하라고 안내했어요. 직권 신청으로 순차 지급하는 대상이 있기 때문이에요. 문의는 보건복지상담센터 129로 하면 돼요.<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/014/014_2_card.png\" alt=\"부모급여·아동수당 한눈에 정리\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>부모급여는 만 2세 미만, 아동수당은 2026년 만 9세 미만<\/li><li>둘 다 출생 후 60일 안에 신청하면 출생한 달부터 소급<\/li><li>아동수당은 거주 지역에 따라 월 10만~12만 원<\/li><\/ul>\n<p>금액과 대상은 해마다 바뀌니 신청 전 복지로나 129에서 다시 확인해 주세요.<\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/014/014_0_thumb.png\n\n\"부모급여랑 아동수당, 둘 다 받을 수 있나요?\" 육아를 시작하면 가장 먼저 헷갈리는 질문 중 하나예요. 두 제도는 이름이 비슷하지만 대상 나이와 금액, 지급일이 달라서 표로 나란히 비교해 봤어요. 보건복지부 안내와 정책브리핑을 바탕으로 했고, 아동수당은 올해 바뀐 부분도 반영했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/014/014_1_card.png\n\n한 표로 비교하기\n\n• 대상 — 부모급여: 만 2세 미만(0~23개월) 아동 / 아동수당: 2026년은 만 9세 미만 아동\n• 금액 — 부모급여: 0세 월 100만 원, 1세 월 50만 원 / 아동수당: 수도권 월 10만 원, 비수도권 월 10만 5천 원, 인구감소지역 월 11만~12만 원\n• 지급일 — 부모급여: 가정 양육은 매월 25일, 어린이집 이용 차액은 다음 달 20일 / 아동수당: 매월 25일(휴일이면 그 전날)\n• 신청 — 부모급여: 읍·면·동 행정복지센터, 복지로, 정부24 / 아동수당: 읍·면·동 행정복지센터, 복지로(앱 포함), 정부24\n• 소급 — 부모급여: 출생일로부터 60일 이내 신청하면 출생한 달부터 / 아동수당: 출생일 포함 60일 이내 신청하면 출생한 달부터\n\n정부24의 아동수당 안내에는 아동수당이 보육료나 양육수당 같은 다른 복지급여를 받는지와 상관없이 나이·국적·주민등록 요건만 맞으면 지급된다고 적혀 있어요. 부모급여는 출생신고와 함께 한 번에 신청하는 원스톱 신청도 가능하다고 해요.\n\n어린이집에 보내면 부모급여는 어떻게 될까?\n\n어린이집을 이용하면 영유아 기본보육료를 뺀 차액을 현금으로 받아요. 2026년 기준 0세(0~11개월)는 100만 원에서 보육료 58만 4천 원을 뺀 41만 6천 원이고, 1세(12~23개월)는 50만 원보다 보육료 51만 5천 원이 커서 차액이 없다고 안내돼 있어요. 어린이집이나 종일제 아이돌봄은 부모급여와 별개로 신청해야 한다는 점도 함께 나와 있어요.\n\n올해 아동수당이 달라진 점\n\n- 대상 확대: 아동수당법이 개정되어 지급 대상이 13세 미만까지 단계적으로 넓어져요. 2025년 8세 미만, 2026년 9세 미만, 2027년 10세 미만으로 이어져 2030년에 13세 미만이 돼요.\n- 지역별 금액: 거주 지역에 따라 금액이 달라요. 인구감소지역은 우대 지역이 11만 원, 특별 지역이 12만 원이에요. 내가 사는 시·군·구가 어디에 속하는지는 복지부 정책브리핑의 지역 목록으로 확인할 수 있어요.\n- 상품권 추가 지원: 인구감소지역에서 지역사랑상품권으로 받으면 월 1만 원 상당이 더해지는데, 2026년 하반기부터 지역별로 조례 등을 거쳐 추진한다고 해요. 실제 시행 여부와 시기는 지자체마다 다를 수 있으니 사는 곳의 시·군·구 공지를 확인해 주세요.\n- 적용 시점: 확대분은 4월 지급분부터이고 1월분까지 소급돼요. 이미 지급이 끝났던 2017년 1월~2018년 3월생 아동은 지자체가 직권 신청 절차를 거쳐 순차적으로 지급한다고 해요.\n\n정보가 서로 달라 보일 때\n\n정부24 아동수당 서비스 페이지(최종 수정 2026년 2월 20일)에는 아직 만 8세 미만, 월 10만 원으로 적혀 있어요. 반면 보건복지부 정책 페이지(2026년 3월 31일 수정)와 정책브리핑(2026년 3월 30일)은 개정된 만 9세 미만과 지역별 금액을 안내해요. 개정 이후 날짜의 자료를 기준으로 삼는 게 안전합니다.\n\n한 가지 더, 피싱 주의\n\n복지부는 아동수당 확대와 관련해 신청을 요구하는 문자나 링크는 피싱일 수 있다며 주의하라고 안내했어요. 직권 신청으로 순차 지급하는 대상이 있기 때문이에요. 문의는 보건복지상담센터 129로 하면 돼요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/014/014_2_card.png\n\n한눈에 정리\n\n- 부모급여는 만 2세 미만, 아동수당은 2026년 만 9세 미만\n- 둘 다 출생 후 60일 안에 신청하면 출생한 달부터 소급\n- 아동수당은 거주 지역에 따라 월 10만~12만 원\n\n금액과 대상은 해마다 바뀌니 신청 전 복지로나 129에서 다시 확인해 주세요.", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/014/014_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/014/014_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "014_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/014/014_1_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/014/014_1_card.png", "cap": "", "alt": "부모급여 vs 아동수당", "name": "014_1_card.png", "w": 1080, "h": 1307}, {"n": 2, "label": "사진 2", "uri": "img/014/014_2_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/014/014_2_card.png", "cap": "", "alt": "부모급여·아동수당 한눈에 정리", "name": "014_2_card.png", "w": 1080, "h": 768}], "zip": "img/014/014_images.zip", "html": "<figure class=\"ph thumbfig\" data-n=\"0\"><img src=\"img/014/014_0_thumb.png\" alt=\"대표 이미지\"><\/figure>\n<p>\"부모급여랑 아동수당, 둘 다 받을 수 있나요?\" 육아를 시작하면 가장 먼저 헷갈리는 질문 중 하나예요. 두 제도는 이름이 비슷하지만 대상 나이와 금액, 지급일이 달라서 표로 나란히 비교해 봤어요. 보건복지부 안내와 정책브리핑을 바탕으로 했고, 아동수당은 올해 바뀐 부분도 반영했습니다. (2026년 10월 5일 기준)<\/p>\n<figure class=\"ph\" data-n=\"1\"><img loading=\"lazy\" src=\"img/014/014_1_card.png\" alt=\"부모급여 vs 아동수당\"><\/figure>\n<h3>한 표로 비교하기<\/h3>\n<div class=\"tw\"><table><thead><tr><th>구분<\/th><th>부모급여<\/th><th>아동수당<\/th><\/tr><\/thead><tbody><tr><td>대상<\/td><td>만 2세 미만(0~23개월) 아동<\/td><td>2026년은 만 9세 미만 아동<\/td><\/tr><tr><td>금액<\/td><td>0세 월 100만 원, 1세 월 50만 원<\/td><td>수도권 월 10만 원, 비수도권 월 10만 5천 원, 인구감소지역 월 11만~12만 원<\/td><\/tr><tr><td>지급일<\/td><td>가정 양육은 매월 25일, 어린이집 이용 차액은 다음 달 20일<\/td><td>매월 25일(휴일이면 그 전날)<\/td><\/tr><tr><td>신청<\/td><td>읍·면·동 행정복지센터, 복지로, 정부24<\/td><td>읍·면·동 행정복지센터, 복지로(앱 포함), 정부24<\/td><\/tr><tr><td>소급<\/td><td>출생일로부터 60일 이내 신청하면 출생한 달부터<\/td><td>출생일 포함 60일 이내 신청하면 출생한 달부터<\/td><\/tr><\/tbody><\/table><\/div>\n<p>정부24의 아동수당 안내에는 아동수당이 보육료나 양육수당 같은 다른 복지급여를 받는지와 상관없이 나이·국적·주민등록 요건만 맞으면 지급된다고 적혀 있어요. 부모급여는 출생신고와 함께 한 번에 신청하는 원스톱 신청도 가능하다고 해요.<\/p>\n<h3>어린이집에 보내면 부모급여는 어떻게 될까?<\/h3>\n<p>어린이집을 이용하면 영유아 기본보육료를 뺀 차액을 현금으로 받아요. 2026년 기준 0세(0~11개월)는 100만 원에서 보육료 58만 4천 원을 뺀 41만 6천 원이고, 1세(12~23개월)는 50만 원보다 보육료 51만 5천 원이 커서 차액이 없다고 안내돼 있어요. 어린이집이나 종일제 아이돌봄은 부모급여와 별개로 신청해야 한다는 점도 함께 나와 있어요.<\/p>\n<h3>올해 아동수당이 달라진 점<\/h3>\n<ul><li>대상 확대: 아동수당법이 개정되어 지급 대상이 13세 미만까지 단계적으로 넓어져요. 2025년 8세 미만, 2026년 9세 미만, 2027년 10세 미만으로 이어져 2030년에 13세 미만이 돼요.<\/li><li>지역별 금액: 거주 지역에 따라 금액이 달라요. 인구감소지역은 우대 지역이 11만 원, 특별 지역이 12만 원이에요. 내가 사는 시·군·구가 어디에 속하는지는 복지부 정책브리핑의 지역 목록으로 확인할 수 있어요.<\/li><li>상품권 추가 지원: 인구감소지역에서 지역사랑상품권으로 받으면 월 1만 원 상당이 더해지는데, 2026년 하반기부터 지역별로 조례 등을 거쳐 추진한다고 해요. 실제 시행 여부와 시기는 지자체마다 다를 수 있으니 사는 곳의 시·군·구 공지를 확인해 주세요.<\/li><li>적용 시점: 확대분은 4월 지급분부터이고 1월분까지 소급돼요. 이미 지급이 끝났던 2017년 1월~2018년 3월생 아동은 지자체가 직권 신청 절차를 거쳐 순차적으로 지급한다고 해요.<\/li><\/ul>\n<h3>정보가 서로 달라 보일 때<\/h3>\n<p>정부24 아동수당 서비스 페이지(최종 수정 2026년 2월 20일)에는 아직 만 8세 미만, 월 10만 원으로 적혀 있어요. 반면 보건복지부 정책 페이지(2026년 3월 31일 수정)와 정책브리핑(2026년 3월 30일)은 개정된 만 9세 미만과 지역별 금액을 안내해요. 개정 이후 날짜의 자료를 기준으로 삼는 게 안전합니다.<\/p>\n<h3>한 가지 더, 피싱 주의<\/h3>\n<p>복지부는 아동수당 확대와 관련해 신청을 요구하는 문자나 링크는 피싱일 수 있다며 주의하라고 안내했어요. 직권 신청으로 순차 지급하는 대상이 있기 때문이에요. 문의는 보건복지상담센터 129로 하면 돼요.<\/p>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/014/014_2_card.png\" alt=\"부모급여·아동수당 한눈에 정리\"><\/figure>\n<h3>한눈에 정리<\/h3>\n<ul><li>부모급여는 만 2세 미만, 아동수당은 2026년 만 9세 미만<\/li><li>둘 다 출생 후 60일 안에 신청하면 출생한 달부터 소급<\/li><li>아동수당은 거주 지역에 따라 월 10만~12만 원<\/li><\/ul>\n<p>금액과 대상은 해마다 바뀌니 신청 전 복지로나 129에서 다시 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 자체 제작 카드 · 사진 2 자체 제작 카드 — 파일 images/posts/014/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래<\/td><td>복지로의 부모급여·아동수당 안내 화면(로그인 전) 직접 캡처<\/td><td>아동·보호자 정보가 보이는 화면은 캡처 금지<\/td><\/tr><tr><td>비교표 아래<\/td><td>본문 표를 그대로 이미지화하지 말고 텍스트 표 유지<\/td><td>이미지 속 글자는 검색에 잡히지 않을 수 있음<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 본인 거주 시·군·구가 아동수당 어느 구분에 속하는지(수도권·비수도권·인구감소지역) 정책브리핑 목록으로 확인(본문은 '목록으로 확인' 안내 유지)<\/li><li class=\"cb\">☐ 지역사랑상품권 추가 지급이 시행 중인 지자체를 쓰고 싶다면 해당 지자체 공지로 확인 (확인 전에는 일반론만 유지)<\/li><li class=\"cb\">☐ 정책브리핑·복지부 문장은 공공누리 4유형일 수 있으므로 문장을 그대로 복사하지 않기<\/li><li class=\"cb\">☐ 정부24 아동수당 페이지가 개정 내용으로 갱신됐는지 발행 전에 확인 (갱신됐다면 '정보가 서로 달라 보일 때' 문단 삭제)<\/li><li class=\"cb\">☐ 육아 경험담은 실제 경험이 있을 때만, 아이 사진·정보는 넣지 않기<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>부모급여 대상·금액·신청 방식(최종수정 2026-03-25)<\/td><td>보건복지부 <a href=\"https://www.mohw.go.kr/menu.es?mid=a10711030600\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.mohw.go.kr/menu.es?mid=a10711030600<\/a><\/td><td>공식<\/td><\/tr><tr><td>부모급여 어린이집 차액, 지급일, 60일 소급, 원스톱<\/td><td>대한민국 정책브리핑 정책포커스(2026-01-14) <a href=\"https://www.korea.kr/news/policyFocusView.do?newsId=148957936&amp;pkgId=49500831\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyFocusView.do?newsId=148957936&amp;pkgId=49500831<\/a><\/td><td>공식<\/td><\/tr><tr><td>아동수당 지급 대상·지역별 금액·신청 방식(최종수정 2026-03-31)<\/td><td>보건복지부 <a href=\"https://www.mohw.go.kr/menu.es?mid=a10711030100\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.mohw.go.kr/menu.es?mid=a10711030100<\/a><\/td><td>공식<\/td><\/tr><tr><td>아동수당 단계적 확대 일정, 지역 구분, 상품권, 소급, 피싱 주의<\/td><td>대한민국 정책브리핑 정책뉴스(2026-03-30) <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148961693\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyNewsView.do?newsId=148961693<\/a><\/td><td>공식<\/td><\/tr><tr><td>아동수당 신청 방법, 60일 소급, 다른 급여와 무관, 매월 25일(만 8세 미만 표기는 개정 전 정보)<\/td><td>정부24 보조금24 <a href=\"https://www.gov.kr/portal/rcvfvrSvc/dtlEx/135200000120\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.kr/portal/rcvfvrSvc/dtlEx/135200000120<\/a> (최종수정 2026-02-20)<\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "\"부모급여랑 아동수당, 둘 다 받을 수 있나요?\" 육아를 시작하면 가장 먼저 헷갈리는 질문 중 하나예요. 두 제도는 이름이 비슷하지만 대상 나이와 금액, 지급일이 달라서 표로 나란히 비교해 봤어요. 보건복지부 안내와 정책브리핑을 바탕으로 했고, 아동수당은 올해 바뀐 부분도 반영했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/014/014_1_card.png\n\n한 표로 비교하기\n\n• 대상 — 부모급여: 만 2세 미만(0~23개월) 아동 / 아동수당: 2026년은 만 9세 미만 아동\n• 금액 — 부모급여: 0세 월 100만 원, 1세 월 50만 원 / 아동수당: 수도권 월 10만 원, 비수도권 월 10만 5천 원, 인구감소지역 월 11만~12만 원\n• 지급일 — 부모급여: 가정 양육은 매월 25일, 어린이집 이용 차액은 다음 달 20일 / 아동수당: 매월 25일(휴일이면 그 전날)\n• 신청 — 부모급여: 읍·면·동 행정복지센터, 복지로, 정부24 / 아동수당: 읍·면·동 행정복지센터, 복지로(앱 포함), 정부24\n• 소급 — 부모급여: 출생일로부터 60일 이내 신청하면 출생한 달부터 / 아동수당: 출생일 포함 60일 이내 신청하면 출생한 달부터\n\n정부24의 아동수당 안내에는 아동수당이 보육료나 양육수당 같은 다른 복지급여를 받는지와 상관없이 나이·국적·주민등록 요건만 맞으면 지급된다고 적혀 있어요. 부모급여는 출생신고와 함께 한 번에 신청하는 원스톱 신청도 가능하다고 해요.\n\n어린이집에 보내면 부모급여는 어떻게 될까?\n\n어린이집을 이용하면 영유아 기본보육료를 뺀 차액을 현금으로 받아요. 2026년 기준 0세(0~11개월)는 100만 원에서 보육료 58만 4천 원을 뺀 41만 6천 원이고, 1세(12~23개월)는 50만 원보다 보육료 51만 5천 원이 커서 차액이 없다고 안내돼 있어요. 어린이집이나 종일제 아이돌봄은 부모급여와 별개로 신청해야 한다는 점도 함께 나와 있어요.\n\n올해 아동수당이 달라진 점\n\n- 대상 확대: 아동수당법이 개정되어 지급 대상이 13세 미만까지 단계적으로 넓어져요. 2025년 8세 미만, 2026년 9세 미만, 2027년 10세 미만으로 이어져 2030년에 13세 미만이 돼요.\n- 지역별 금액: 거주 지역에 따라 금액이 달라요. 인구감소지역은 우대 지역이 11만 원, 특별 지역이 12만 원이에요. 내가 사는 시·군·구가 어디에 속하는지는 복지부 정책브리핑의 지역 목록으로 확인할 수 있어요.\n- 상품권 추가 지원: 인구감소지역에서 지역사랑상품권으로 받으면 월 1만 원 상당이 더해지는데, 2026년 하반기부터 지역별로 조례 등을 거쳐 추진한다고 해요. 실제 시행 여부와 시기는 지자체마다 다를 수 있으니 사는 곳의 시·군·구 공지를 확인해 주세요.\n- 적용 시점: 확대분은 4월 지급분부터이고 1월분까지 소급돼요. 이미 지급이 끝났던 2017년 1월~2018년 3월생 아동은 지자체가 직권 신청 절차를 거쳐 순차적으로 지급한다고 해요.\n\n정보가 서로 달라 보일 때\n\n정부24 아동수당 서비스 페이지(최종 수정 2026년 2월 20일)에는 아직 만 8세 미만, 월 10만 원으로 적혀 있어요. 반면 보건복지부 정책 페이지(2026년 3월 31일 수정)와 정책브리핑(2026년 3월 30일)은 개정된 만 9세 미만과 지역별 금액을 안내해요. 개정 이후 날짜의 자료를 기준으로 삼는 게 안전합니다.\n\n한 가지 더, 피싱 주의\n\n복지부는 아동수당 확대와 관련해 신청을 요구하는 문자나 링크는 피싱일 수 있다며 주의하라고 안내했어요. 직권 신청으로 순차 지급하는 대상이 있기 때문이에요. 문의는 보건복지상담센터 129로 하면 돼요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/014/014_2_card.png\n\n한눈에 정리\n\n- 부모급여는 만 2세 미만, 아동수당은 2026년 만 9세 미만\n- 둘 다 출생 후 60일 안에 신청하면 출생한 달부터 소급\n- 아동수당은 거주 지역에 따라 월 10만~12만 원\n\n금액과 대상은 해마다 바뀌니 신청 전 복지로나 129에서 다시 확인해 주세요.", "copyAll": "\"부모급여랑 아동수당, 둘 다 받을 수 있나요?\" 육아를 시작하면 가장 먼저 헷갈리는 질문 중 하나예요. 두 제도는 이름이 비슷하지만 대상 나이와 금액, 지급일이 달라서 표로 나란히 비교해 봤어요. 보건복지부 안내와 정책브리핑을 바탕으로 했고, 아동수당은 올해 바뀐 부분도 반영했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/014/014_1_card.png\n\n한 표로 비교하기\n\n• 대상 — 부모급여: 만 2세 미만(0~23개월) 아동 / 아동수당: 2026년은 만 9세 미만 아동\n• 금액 — 부모급여: 0세 월 100만 원, 1세 월 50만 원 / 아동수당: 수도권 월 10만 원, 비수도권 월 10만 5천 원, 인구감소지역 월 11만~12만 원\n• 지급일 — 부모급여: 가정 양육은 매월 25일, 어린이집 이용 차액은 다음 달 20일 / 아동수당: 매월 25일(휴일이면 그 전날)\n• 신청 — 부모급여: 읍·면·동 행정복지센터, 복지로, 정부24 / 아동수당: 읍·면·동 행정복지센터, 복지로(앱 포함), 정부24\n• 소급 — 부모급여: 출생일로부터 60일 이내 신청하면 출생한 달부터 / 아동수당: 출생일 포함 60일 이내 신청하면 출생한 달부터\n\n정부24의 아동수당 안내에는 아동수당이 보육료나 양육수당 같은 다른 복지급여를 받는지와 상관없이 나이·국적·주민등록 요건만 맞으면 지급된다고 적혀 있어요. 부모급여는 출생신고와 함께 한 번에 신청하는 원스톱 신청도 가능하다고 해요.\n\n어린이집에 보내면 부모급여는 어떻게 될까?\n\n어린이집을 이용하면 영유아 기본보육료를 뺀 차액을 현금으로 받아요. 2026년 기준 0세(0~11개월)는 100만 원에서 보육료 58만 4천 원을 뺀 41만 6천 원이고, 1세(12~23개월)는 50만 원보다 보육료 51만 5천 원이 커서 차액이 없다고 안내돼 있어요. 어린이집이나 종일제 아이돌봄은 부모급여와 별개로 신청해야 한다는 점도 함께 나와 있어요.\n\n올해 아동수당이 달라진 점\n\n- 대상 확대: 아동수당법이 개정되어 지급 대상이 13세 미만까지 단계적으로 넓어져요. 2025년 8세 미만, 2026년 9세 미만, 2027년 10세 미만으로 이어져 2030년에 13세 미만이 돼요.\n- 지역별 금액: 거주 지역에 따라 금액이 달라요. 인구감소지역은 우대 지역이 11만 원, 특별 지역이 12만 원이에요. 내가 사는 시·군·구가 어디에 속하는지는 복지부 정책브리핑의 지역 목록으로 확인할 수 있어요.\n- 상품권 추가 지원: 인구 라진 점 - 대상 확대: 아동수당법이 개정되어 지급 대상이 13세 미만까지 단계적으로 넓어져요. 2025년 8세 미만, 2026년 9세 미만, 2027년 10세 미만으로 이어져 2030년에 13세 미만이 돼요. - 지역별 금액: 거주 지역에 따라 금액이 달라요. 인구감소지역은 우대 지역이 11만 원, 특별 지역이 12만 원이에요. 내가 사는 시·군·구가 어디에 속하는지는 복지부 정책브리핑의 지역 목록으로 확인할 수 있어요. - 상품권 추가 지원: 인구감소지역에서 지역사랑상품권으로 받으면 월 1만 원 상당이 더해지는데, 2026년 하반기부터 지역별로 조례 등을 거쳐 추진한다고 해요. 실제 시행 여부와 시기는 지자체마다 다를 수 있으니 사는 곳의 시·군·구 공지를 확인해 주세요. - 적용 시점: 확대분은 4월 지급분부터이고 1월분까지 소급돼요. 이미 지급이 끝났던 2017년 1월~2018년 3월생 아동은 지자체가 직권 신청 절차를 거쳐 순차적으로 지급한다고 해요. 정보가 서로 달라 보일 때 정부24 아동수당 서비스 페이지(최종 수정 2026년 2월 20일)에는 아직 만 8세 미만, 월 10만 원으로 적혀 있어요. 반면 보건복지부 정책 페이지(2026년 3월 31일 수정)와 정책브리핑(2026년 3월 30일)은 개정된 만 9세 미만과 지역별 금액을 안내해요. 개정 이후 날짜의 자료를 기준으로 삼는 게 안전합니다. 한 가지 더, 피싱 주의 복지부는 아동수당 확대와 관련해 신청을 요구하는 문자나 링크는 피싱일 수 있다며 주의하라고 안내했어요. 직권 신청으로 순차 지급하는 대상이 있기 때문이에요. 문의는 보건복지상담센터 129로 하면 돼요. [사진 2] https://senti-1000ma.github.io/blog-drafts/img/014/014_2_card.png 한눈에 정리 - 부모급여는 만 2세 미만, 아동수당은 2026년 만 9세 미만 - 둘 다 출생 후 60일 안에 신청하면 출생한 달부터 소급 - 아동수당은 거주 지역에 따라 월 10만~12만 원 금액과 대상은 해마다 바뀌니 신청 전 복지로나 129에서 다시 확인해 주세요. 네이버"}, {"id": "013", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "013_unemployment-benefit-steps.md", "title": "퇴사 후 실업급여(구직급여) 신청 순서, 이직확인서부터 실업인정까지 한 번에", "cands": ["실업급여는 '고용센터 방문'이 핵심! 퇴사 후 신청 순서와 준비할 것 (2026년)", "구직급여 지급일수는 얼마나? 가입기간·나이별 표와 신청 절차 정리", "실업급여 받다가 일을 하면 신고해야 할까? 신청 후 지켜야 할 것"], "cat": "고용·노동", "kw": ["실업급여", "구직급여", "이직확인서", "고용24", "실업인정"], "summary": "퇴사 후 구직급여 신청 순서, 지급일수·금액 구조, 신청 후 지켜야 할 신고 의무를 고용24·고용노동부 안내 기준으로 정리", "status": "초안", "created": "2026-10-05 12:26", "base": "2026-10-05", "need": 0, "chars": 2054, "chars_ns": 1578, "imgs": 3, "slots": 2, "filled": 2, "thumb": "img/013/013_0_thumb.png", "seHtml": "<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/013/013_0_thumb.png\" alt=\"대표 이미지\" width=\"720\"><\/p>\n<p>결론부터 말씀드리면 실업급여(구직급여) 신청의 핵심은 세 가지예요. 회사가 제출하는 이직확인서, 고용24 구직 등록과 사전 교육, 그리고 신분증을 들고 고용복지센터를 방문하는 수급자격 인정 신청이에요. 고용24 제도 안내와 고용노동부 자료를 기준으로 순서와 주의점을 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/013/013_1_card.png\" alt=\"가입기간·나이별 구직급여 지급일수\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>어떤 조건이 필요할까?<\/b><\/span><\/p>\n<p>정부24의 구직급여 안내에는 이직일 이전 18개월 동안 피보험단위기간이 180일 이상일 것, 회사 사정 등 본인 뜻과 무관한 이직일 것, 일할 의사와 능력이 있는데도 취업하지 못한 상태일 것, 적극적으로 재취업 활동을 할 것이 요건으로 나와 있어요. 스스로 그만뒀더라도 고용보험법 시행규칙 [별표 2]의 '정당한 이직 사유'에 해당하면 수급 자격이 제한되지 않아요. 이직 전 1년 안에 임금체불이 2개월 이상 있었던 경우, 사업장 이전 등으로 통근 왕복이 3시간 이상 걸리게 된 경우, 직장 내 괴롭힘을 당한 경우 등이 예로 적혀 있고, 해당 여부는 고용센터가 판단해요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>신청 순서<\/b><\/span><\/p>\n<ol><li>퇴사한 회사에 서류 요청: 회사가 고용보험 피보험자격 상실 신고서와 이직확인서를 제출해야 해요. 사업주는 이직확인서 발급 요청을 받으면 10일 이내에 발급해야 하고, 처리 현황은 고용24 마이페이지에서 볼 수 있어요. 퇴직할 때 미리 요청해 두는 것을 고용24가 권하고 있어요.<\/li><li>구직 등록: 고용24에서 구직 등록을 해요.<\/li><li>사전 교육: 온라인 교육을 먼저 듣는 게 좋고, 못 들었다면 센터에서 현장 교육을 받아요.<\/li><li>수급자격 인정 신청: 신분증을 지참해 고용복지센터를 방문해 신청서를 내요. 서류가 모두 처리된 상용근로자로서 180일 이상 비자발적 이직이고 이직일 기준 만 65세 미만이라면 인터넷으로 신청서를 먼저 제출하는 서비스를 쓸 수 있어요.<\/li><li>재취업 활동과 실업인정: 1~4주마다 취업하지 못한 상태인지, 구직 활동을 했는지 인정받아야 해요. 특정 회차를 빼면 온라인으로 가능하고, 통상 인정 다음 날 지정 계좌로 입금돼요.<\/li><\/ol>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>얼마나, 얼마 동안 받을까?<\/b><\/span><\/p>\n<p>구직급여는 이직 전 평균임금의 60%에 소정급여일수를 곱해 계산하고, 상한액과 하한액이 있어요. 고용노동부는 2025년 12월 시행령 개정안을 의결하면서 상한액을 66,000원에서 68,100원으로 올린다고 밝혔어요. 하한액은 이직 당시 최저임금의 80%에 1일 소정근로시간을 곱한 값이에요. 2026년 최저임금이 시간당 10,320원이라 하루 8시간 기준으로는 66,048원이고, 소정근로시간이 짧으면 하한액도 그만큼 낮아져요.<\/p>\n<p>지급일수는 이직일 2019년 10월 1일 이후 기준으로 아래와 같아요.<\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>가입기간<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>50세 미만<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>50세 이상·장애인<\/b><\/td><\/tr><tr><td>1년 미만<\/td><td>120일<\/td><td>120일<\/td><\/tr><tr><td>1~3년 미만<\/td><td>150일<\/td><td>180일<\/td><\/tr><tr><td>3~5년 미만<\/td><td>180일<\/td><td>210일<\/td><\/tr><tr><td>5~10년 미만<\/td><td>210일<\/td><td>240일<\/td><\/tr><tr><td>10년 이상<\/td><td>240일<\/td><td>270일<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>받으면서 꼭 지켜야 할 것<\/b><\/span><\/p>\n<ul><li>일을 했다면 하루 소득이 얼마든, 임금을 못 받았더라도 실업인정 때 근로 사실을 신고해야 해요. 신고하지 않으면 부정수급이 될 수 있고 1년 이하 징역 또는 300만 원 이하 벌금 대상이라고 안내돼 있어요.<\/li><li>재취업하면 취업한 날부터 2개월 이내에 신고해야 해요.<\/li><li>실업인정은 본인이 직접 신청해야 해요. 다른 사람이 대신 쓰면 부정수급이에요.<\/li><li>입사 지원을 한 것처럼 꾸미는 허위 구직활동은 지급 제한 대상이에요.<\/li><li>마지막 근무일 다음 날부터 1년이 지나면 지급일수가 남아 있어도 끝나요. 그래서 퇴사 후 너무 미루지 않는 게 중요해요.<\/li><li>결정에 이의가 있으면 통지를 받은 날부터 90일 안에 심사 청구를 할 수 있어요.<\/li><\/ul>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/013/013_2_card.png\" alt=\"실업급여 한눈에 정리\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>순서: 이직확인서 → 구직 등록 → 사전 교육 → 고용센터 방문 → 실업인정<\/li><li>지급: 평균임금 60% × 지급일수(120~270일), 상한·하한액 존재<\/li><li>일한 사실 신고와 본인 직접 신청이 필수<\/li><\/ul>\n<p>개인 사정에 따라 인정 여부가 달라질 수 있으니 고용노동부 고객상담센터(1350)나 관할 고용복지센터에 확인해 주세요.<\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/013/013_0_thumb.png\n\n결론부터 말씀드리면 실업급여(구직급여) 신청의 핵심은 세 가지예요. 회사가 제출하는 이직확인서, 고용24 구직 등록과 사전 교육, 그리고 신분증을 들고 고용복지센터를 방문하는 수급자격 인정 신청이에요. 고용24 제도 안내와 고용노동부 자료를 기준으로 순서와 주의점을 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/013/013_1_card.png\n\n어떤 조건이 필요할까?\n\n정부24의 구직급여 안내에는 이직일 이전 18개월 동안 피보험단위기간이 180일 이상일 것, 회사 사정 등 본인 뜻과 무관한 이직일 것, 일할 의사와 능력이 있는데도 취업하지 못한 상태일 것, 적극적으로 재취업 활동을 할 것이 요건으로 나와 있어요. 스스로 그만뒀더라도 고용보험법 시행규칙 [별표 2]의 '정당한 이직 사유'에 해당하면 수급 자격이 제한되지 않아요. 이직 전 1년 안에 임금체불이 2개월 이상 있었던 경우, 사업장 이전 등으로 통근 왕복이 3시간 이상 걸리게 된 경우, 직장 내 괴롭힘을 당한 경우 등이 예로 적혀 있고, 해당 여부는 고용센터가 판단해요.\n\n신청 순서\n\n1. 퇴사한 회사에 서류 요청: 회사가 고용보험 피보험자격 상실 신고서와 이직확인서를 제출해야 해요. 사업주는 이직확인서 발급 요청을 받으면 10일 이내에 발급해야 하고, 처리 현황은 고용24 마이페이지에서 볼 수 있어요. 퇴직할 때 미리 요청해 두는 것을 고용24가 권하고 있어요.\n2. 구직 등록: 고용24에서 구직 등록을 해요.\n3. 사전 교육: 온라인 교육을 먼저 듣는 게 좋고, 못 들었다면 센터에서 현장 교육을 받아요.\n4. 수급자격 인정 신청: 신분증을 지참해 고용복지센터를 방문해 신청서를 내요. 서류가 모두 처리된 상용근로자로서 180일 이상 비자발적 이직이고 이직일 기준 만 65세 미만이라면 인터넷으로 신청서를 먼저 제출하는 서비스를 쓸 수 있어요.\n5. 재취업 활동과 실업인정: 1~4주마다 취업하지 못한 상태인지, 구직 활동을 했는지 인정받아야 해요. 특정 회차를 빼면 온라인으로 가능하고, 통상 인정 다음 날 지정 계좌로 입금돼요.\n\n얼마나, 얼마 동안 받을까?\n\n구직급여는 이직 전 평균임금의 60%에 소정급여일수를 곱해 계산하고, 상한액과 하한액이 있어요. 고용노동부는 2025년 12월 시행령 개정안을 의결하면서 상한액을 66,000원에서 68,100원으로 올린다고 밝혔어요. 하한액은 이직 당시 최저임금의 80%에 1일 소정근로시간을 곱한 값이에요. 2026년 최저임금이 시간당 10,320원이라 하루 8시간 기준으로는 66,048원이고, 소정근로시간이 짧으면 하한액도 그만큼 낮아져요.\n\n지급일수는 이직일 2019년 10월 1일 이후 기준으로 아래와 같아요.\n\n• 1년 미만 — 50세 미만: 120일 / 50세 이상·장애인: 120일\n• 1~3년 미만 — 50세 미만: 150일 / 50세 이상·장애인: 180일\n• 3~5년 미만 — 50세 미만: 180일 / 50세 이상·장애인: 210일\n• 5~10년 미만 — 50세 미만: 210일 / 50세 이상·장애인: 240일\n• 10년 이상 — 50세 미만: 240일 / 50세 이상·장애인: 270일\n\n받으면서 꼭 지켜야 할 것\n\n- 일을 했다면 하루 소득이 얼마든, 임금을 못 받았더라도 실업인정 때 근로 사실을 신고해야 해요. 신고하지 않으면 부정수급이 될 수 있고 1년 이하 징역 또는 300만 원 이하 벌금 대상이라고 안내돼 있어요.\n- 재취업하면 취업한 날부터 2개월 이내에 신고해야 해요.\n- 실업인정은 본인이 직접 신청해야 해요. 다른 사람이 대신 쓰면 부정수급이에요.\n- 입사 지원을 한 것처럼 꾸미는 허위 구직활동은 지급 제한 대상이에요.\n- 마지막 근무일 다음 날부터 1년이 지나면 지급일수가 남아 있어도 끝나요. 그래서 퇴사 후 너무 미루지 않는 게 중요해요.\n- 결정에 이의가 있으면 통지를 받은 날부터 90일 안에 심사 청구를 할 수 있어요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/013/013_2_card.png\n\n한눈에 정리\n\n- 순서: 이직확인서 → 구직 등록 → 사전 교육 → 고용센터 방문 → 실업인정\n- 지급: 평균임금 60% × 지급일수(120~270일), 상한·하한액 존재\n- 일한 사실 신고와 본인 직접 신청이 필수\n\n개인 사정에 따라 인정 여부가 달라질 수 있으니 고용노동부 고객상담센터(1350)나 관할 고용복지센터에 확인해 주세요.", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/013/013_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/013/013_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "013_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/013/013_1_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/013/013_1_card.png", "cap": "", "alt": "가입기간·나이별 구직급여 지급일수", "name": "013_1_card.png", "w": 1080, "h": 934}, {"n": 2, "label": "사진 2", "uri": "img/013/013_2_card.png", " td>1~3년 미만<\/td><td>150일<\/td><td>180일<\/td><\/tr><tr><td>3~5년 미만<\/td><td>180일<\/td><td>210일<\/td><\/tr><tr><td>5~10년 미만<\/td><td>210일<\/td><td>240일<\/td><\/tr><tr><td>10년 이상<\/td><td>240일<\/td><td>270일<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>받으면서 꼭 지켜야 할 것<\/h3>\n<ul><li>일을 했다면 하루 소득이 얼마든, 임금을 못 받았더라도 실업인정 때 근로 사실을 신고해야 해요. 신고하지 않으면 부정수급이 될 수 있고 1년 이하 징역 또는 300만 원 이하 벌금 대상이라고 안내돼 있어요.<\/li><li>재취업하면 취업한 날부터 2개월 이내에 신고해야 해요.<\/li><li>실업인정은 본인이 직접 신청해야 해요. 다른 사람이 대신 쓰면 부정수급이에요.<\/li><li>입사 지원을 한 것처럼 꾸미는 허위 구직활동은 지급 제한 대상이에요.<\/li><li>마지막 근무일 다음 날부터 1년이 지나면 지급일수가 남아 있어도 끝나요. 그래서 퇴사 후 너무 미루지 않는 게 중요해요.<\/li><li>결정에 이의가 있으면 통지를 받은 날부터 90일 안에 심사 청구를 할 수 있어요.<\/li><\/ul>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/013/013_2_card.png\" alt=\"실업급여 한눈에 정리\"><\/figure>\n<h3>한눈에 정리<\/h3>\n<ul><li>순서: 이직확인서 → 구직 등록 → 사전 교육 → 고용센터 방문 → 실업인정<\/li><li>지급: 평균임금 60% × 지급일수(120~270일), 상한·하한액 존재<\/li><li>일한 사실 신고와 본인 직접 신청이 필수<\/li><\/ul>\n<p>개인 사정에 따라 인정 여부가 달라질 수 있으니 고용노동부 고객상담센터(1350)나 관할 고용복지센터에 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 자체 제작 카드 · 사진 2 자체 제작 카드 — 파일 images/posts/013/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래<\/td><td>고용24 '실업급여' 제도 안내 화면(로그인 전) 직접 캡처<\/td><td>마이페이지 화면은 개인정보가 많아 캡처 금지<\/td><\/tr><tr><td>지급일수 표 아래<\/td><td>표를 이미지로 만들 경우에도 본문 텍스트 표는 유지<\/td><td>이미지 속 글자는 검색에 잡히지 않을 수 있음<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 2026년 하한액 66,048원(최저임금 10,320원×80%×8시간)을 고용24 안내 또는 수급자격 통지에서 다시 확인<\/li><li class=\"cb\">☐ 자발적 이직의 정당한 사유 예시(임금체불 2개월·통근 왕복 3시간·직장 내 괴롭힘)가 시행규칙 [별표 2]와 같은지 확인. 개별 사례 판단 문구는 추가하지 않기<\/li><li class=\"cb\">☐ 상한액 68,100원이 2026년 이직자에게 적용되는지(시행일) 고용노동부 자료에서 한 번 더 확인<\/li><li class=\"cb\">☐ 본문은 제도 안내일 뿐 개별 수급 가능 여부를 단정하는 표현이 없는지 확인<\/li><li class=\"cb\">☐ 실제 수급 경험담을 쓰고 싶으면 사실만 쓰고, 사업장·금액 정보는 가리기<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>신청 절차, 이직확인서·상실신고, 인터넷 제출 요건, 실업인정, 신고 의무, 부정수급 처벌, 1년 종료, 이의신청 90일<\/td><td>고용24 제도안내 <a href=\"https://www.work24.go.kr/cm/c/f/1100/selecSystInfo.do?systId=SI00000411\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.work24.go.kr/cm/c/f/1100/selecSystInfo.do?systId=SI00000411<\/a><\/td><td>공식<\/td><\/tr><tr><td>지급액 계산식(평균임금 60%), 하한액 계산식, 소정급여일수 표<\/td><td>고용보험 제도 구직급여액 <a href=\"https://ei.work24.go.kr/ei/eih/eg/pb/pbPersonBnef/retrievePb0203Info.do\" target=\"_blank\" rel=\"noopener noreferrer\">https://ei.work24.go.kr/ei/eih/eg/pb/pbPersonBnef/retrievePb0203Info.do<\/a><\/td><td>공식<\/td><\/tr><tr><td>하한액 계산 방식, 2026년 최저임금 10,320원, 상한 68,100원<\/td><td>찾기쉬운 생활법령정보 구직급여 수급 <a href=\"https://www.easylaw.go.kr/CSP/CnpClsMainBtr.laf?ccfNo=2&amp;cciNo=3&amp;cnpClsNo=2&amp;csmSeq=722\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.easylaw.go.kr/CSP/CnpClsMainBtr.laf?ccfNo=2&amp;cciNo=3&amp;cnpClsNo=2&amp;csmSeq=722<\/a><\/td><td>공식<\/td><\/tr><tr><td>정당한 이직 사유(임금체불·통근 곤란·직장 내 괴롭힘 등)<\/td><td>국가법령정보센터 고용보험법 시행규칙 [별표 2] <a href=\"https://www.law.go.kr/LSW/flDownload.do?bylClsCd=110201&amp;flSeq=109996715&amp;gubun=\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.law.go.kr/LSW/flDownload.do?bylClsCd=110201&amp;flSeq=109996715&amp;gubun=<\/a> (검색 요약 확인)<\/td><td>공식<\/td><\/tr><tr><td>상한액 66,000원→68,100원 인상<\/td><td>고용노동부 보도자료(2025-12-16) <a href=\"https://www.moel.go.kr/news/enews/report/enewsView.do?news_seq=18736\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.moel.go.kr/news/enews/report/enewsView.do?news_seq=18736<\/a><\/td><td>공식<\/td><\/tr><tr><td>수급 요건(18개월 중 180일 등)<\/td><td>정부24 구직급여 <a href=\"https://www.gov.kr/portal/service/serviceInfo/SD0000015536\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.kr/portal/service/serviceInfo/SD0000015536<\/a> (검색 요약으로 확인, 박스에서 페이지 직접 열람은 접근 제한)<\/td><td>공식(검색 요약)<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "결론부터 말씀드리면 실업급여(구직급여) 신청의 핵심은 세 가지예요. 회사가 제출하는 이직확인서, 고용24 구직 등록과 사전 교육, 그리고 신분증을 들고 고용복지센터를 방문하는 수급자격 인정 신청이에요. 고용24 제도 안내와 고용노동부 자료를 기준으로 순서와 주의점을 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/013/013_1_card.png\n\n어떤 조건이 필요할까?\n\n정부24의 구직급여 안내에는 이직일 이전 18개월 동안 피보험단위기간이 180일 이상일 것, 회사 사정 등 본인 뜻과 무관한 이직일 것, 일할 의사와 능력이 있는데도 취업하지 못한 상태일 것, 적극적으로 재취업 활동을 할 것이 요건으로 나와 있어요. 스스로 그만뒀더라도 고용보험법 시행규칙 [별표 2]의 '정당한 이직 사유'에 해당하면 수급 자격이 제한되지 않아요. 이직 전 1년 안에 임금체불이 2개월 이상 있었던 경우, 사업장 이전 등으로 통근 왕복이 3시간 이상 걸리게 된 경우, 직장 내 괴롭힘을 당한 경우 등이 예로 적혀 있고, 해당 여부는 고용센터가 판단해요.\n\n신청 순서\n\n1. 퇴사한 회사에 서류 요청: 회사가 고용보험 피보험자격 상실 신고서와 이직확인서를 제출해야 해요. 사업주는 이직확인서 발급 요청을 받으면 10일 이내에 발급해야 하고, 처리 현황은 고용24 마이페이지에서 볼 수 있어요. 퇴직할 때 미리 요청해 두는 것을 고용24가 권하고 있어요.\n2. 구직 등록: 고용24에서 구직 등록을 해요.\n3. 사전 교육: 온라인 교육을 먼저 듣는 게 좋고, 못 들었다면 센터에서 현장 교육을 받아요.\n4. 수급자격 인정 신청: 신분증을 지참해 고용복지센터를 방문해 신청서를 내요. 서류가 모두 처리된 상용근로자로서 180일 이상 비자발적 이직이고 이직일 기준 만 65세 미만이라면 인터넷으로 신청서를 먼저 제출하는 서비스를 쓸 수 있어요.\n5. 재취업 활동과 실업인정: 1~4주마다 취업하지 못한 상태인지, 구직 활동을 했는지 인정받아야 해요. 특정 회차를 빼면 온라인으로 가능하고, 통상 인정 다음 날 지정 계좌로 입금돼요.\n\n얼마나, 얼마 동안 받을까?\n\n구직급여는 이직 전 평균임금의 60%에 소정급여일수를 곱해 계산하고, 상한액과 하한액이 있어요. 고용노동부는 2025년 12월 시행령 개정안을 의결하면서 상한액을 66,000원에서 68,100원으로 올린다고 밝혔어요. 하한액은 이직 당시 최저임금의 80%에 1일 소정근로시간을 곱한 값이에요. 2026년 최저임금이 시간당 10,320원이라 하루 8시간 기준으로는 66,048원이고, 소정근로시간이 짧으면 하한액도 그만큼 낮아져요.\n\n지급일수는 이직일 2019년 10월 1일 이후 기준으로 아래와 같아요.\n\n• 1년 미만 — 50세 미만: 120일 / 50세 이상·장애인: 120일\n• 1~3년 미만 — 50세 미만: 150일 / 50세 이상·장애인: 180일\n• 3~5년 미만 — 50세 미만: 180일 / 50세 이상·장애인: 210일\n• 5~10년 미만 — 50세 미만: 210일 / 50세 이상·장애인: 240일\n• 10년 이상 — 50세 미만: 240일 / 50세 이상·장애인: 270일\n\n받으면서 꼭 지켜야 할 것\n\n- 일을 했다면 하루 소득이 얼마든, 임금을 못 받았더라도 실업인정 때 근로 사실을 신고해야 해요. 신고하지 않으면 부정수급이 될 수 있고 1년 이하 징역 또는 300만 원 이하 벌금 대상이라고 안내돼 있어요.\n- 재취업하면 취업한 날부터 2개월 이내에 신고해야 해요.\n- 실업인정은 본인이 직접 신청해야 해요. 다른 사람이 대신 쓰면 부정수급이에요.\n- 입사 지원을 한 것처럼 꾸미는 허위 구직활동은 지급 제한 대상이에요.\n- 마지막 근무일 다음 날부터 1년이 지나면 지급일수가 남아 있어도 끝나요. 그래서 퇴사 후 너무 미루지 않는 게 중요해요.\n- 결정에 이의가 있으면 통지를 받은 날부터 90일 안에 심사 청구를 할 수 있어요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/013/013_2_card.png\n\n한눈에 정리\n\n- 순서: 이직확인서 → 구직 등록 → 사전 교육 → 고용센터 방문 → 실업인정\n- 지급: 평균임금 60% × 지급일수(120~270일), 상한·하한액 존재\n- 일한 사실 신고와 본인 직접 신청이 필수\n\n개인 사정에 따라 인정 여부가 달라질 수 있으니 고용노동부 고객상담센터(1350)나 관할 고용복지센터에 확인해 주세요.", "copyAll": "결론부터 말씀드리면 실업급여(구직급여) 신청의 핵심은 세 가지예요. 회사가 제출하는 이직확인서, 고용24 구직 등록과 사전 교육, 그리고 신분증을 들고 고용복지센터를 방문하는 수급자격 인정 신청이에요. 고용24 제도 안내와 고용노동부 자료를 기준으로 순서와 주의점을 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/013/013_1_card.png\n\n어떤 조건이 필요할까?\n\n정부24의 구직급여 안내에는 이직일 이전 18개월 동안 피보험단위기간이 180일 이상일 것, 회사 사정 등 본인 뜻과 무관한 이직일 것, 일할 의사와 능력이 있는데도 취업하지 못한 상태일 것, 적극적으로 재취업 활동을 할 것이 요건으로 나와 있어요. 스스로 그만뒀더라도 고용보험법 시행규칙 [별표 2]의 '정당한 이직 사유'에 해당하면 수급 자격이 제한되지 않아요. 이직 전 1년 안에 임금체불이 2개월 이상 있었던 경우, 사업장 이전 등으로 통근 왕복이 3시간 이상 걸리게 된 경우, 직장 내 괴롭힘을 당한 경우 등이 예로 적혀 있고, 해당 여부는 고용센터가 판단해요.\n\n신청 순서\n\n1. 퇴사한 회사에 서류 요청: 회사가 고용보험 피보험자격 상실 신고서와 이직확인서를 제출해야 해요. 사업주는 이직확인서 발급 요청을 받으면 10일 이내에 발급해야 하고, 처리 현황은 고용24 마이페이지에서 볼 수 있어요. 퇴직할 때 미리 요청해 두는 것을 고용24가 권하고 있어요.\n2. 구직 등록: 고용24에서 구직 등록을 해요.\n3. 사전 교육: 온라인 교육을 먼저 듣는 게 좋고, 못 들었다면 센터에서 현장 교육을 받아요.\n4. 수급자격 인정 신청: 신분증을 지참해 고용복지센터를 방문해 신청서를 내요. 서류가 모두 처리된 상용근로자로서 180일 이상 비자발적 이직이고 이직일 기준 만 65세 미만이라면 인터넷으로 신청서를 먼저 제출하는 서비스를 쓸 수 있어요.\n5. 재취업 활동과 실업인정: 1~4주마다 취업하지 못한 상태인지, 구직 활동을 했는지 인정받아야 해요. 특정 회차를 빼면 온라인으로 가능하고, 통상 인정 다음 날 지정 계좌로 입금돼요.\n\n얼마나, 얼마 동안 받을까?\n\n구직급여는 이직 전 평균임금의 60%에 소정급여일수를 곱해 계산하고, 상한액과 하한액이 있어요. 고용노동부는 2025년 12월 시행령 개정안을 의결하면서 상한액을 66,000원에서 68,100원으로 올린다고 밝혔어요. 하한액은 이직 당시 최저임금의 80%에 1일 소정근로시간을 곱한 값이에요. 2026년 최저임금이 시간당 10,320원이라 하루 8시간 기준으로는 66,048원이고, 소정근로 <p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/012/012_0_thumb.png\" alt=\"대표 이미지\" width=\"720\"><\/p>\n<p>이삿짐을 풀고 나면 정리할 게 산더미라 서류 일은 자꾸 뒤로 밀리기 쉬워요. 그런데 전입신고와 확정일자는 세입자가 보증금을 지키는 데 쓰이는 기본 절차라서 순서와 기한을 알아 두면 좋아요. 정부24와 찾기쉬운 생활법령정보 안내를 바탕으로 정리했습니다. 법률 상담이 아니라 제도 안내예요. (2026년 10월 5일 기준)<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/012/012_1_card.png\" alt=\"전입신고·확정일자 한눈에 정리\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>전입신고는 언제까지, 어디서 하나요?<\/b><\/span><\/p>\n<p>거주지를 옮기면 전입한 날부터 14일 이내에 새 거주지 관할 기관에 신고해야 해요. 정부24의 '전입신고+'를 이용하면 직접 방문하지 않고 온라인으로 신청할 수 있고, 요금 감면 대상자는 신청서에서 통합 신청에 동의하면 전입신고와 감면 신청을 한 번에 할 수 있다고 안내돼 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>대항력은 무엇이고 언제 생길까요?<\/b><\/span><\/p>\n<p>임차인이 ① 주택의 인도(실제 입주)와 ② 주민등록을 마치면 그 다음 날부터 제3자에게도 임차권을 주장할 수 있는 힘이 생기는데, 이것을 대항력이라고 해요. 전입신고를 한 때 주민등록이 된 것으로 보고(주택임대차보호법 제3조 제1항), 여기서 '다음 날'은 오전 0시라고 해설돼 있어요.<\/p>\n<p>가상의 예를 들어 볼게요. 10월 20일에 입주하고 21일 오후 3시에 전입신고를 했다면 대항력은 22일 오전 0시부터 생겨요. 신고를 며칠 미룰수록 그만큼 대항력이 늦어지는 셈이에요.<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/012/012_2_card.png\" alt=\"가상 예시: 대항력은 언제 생길까\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>우선변제권은 확정일자가 더해져야 해요<\/b><\/span><\/p>\n<p>대항력을 갖추고 임대차계약서에 확정일자까지 받으면 집이 경매나 공매로 넘어갈 때 후순위 권리자나 다른 채권자보다 먼저 보증금을 돌려받을 수 있는 권리가 생겨요(같은 법 제3조의2). 확정일자는 주택 소재지의 행정복지센터나 등기소, 대법원 인터넷등기소, 또는 주택 임대차 계약 신고를 통해 받을 수 있어요. 정부24 안내에는 인터넷등기소 또는 이사 간 곳 관할 주민센터가 소개돼 있어요. 수수료는 주민센터·등기소에서 받으면 1건 600원(계약서가 4장을 넘으면 4장마다 100원 추가), 인터넷등기소 전자확정일자는 500원이에요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>임대차 신고를 하면 확정일자는 따로 안 받아도 될까?<\/b><\/span><\/p>\n<p>보증금이 6천만 원을 넘거나 월 차임이 30만 원을 넘는 주택 임대차 계약은 계약 체결일부터 30일 이내에 신고해야 하는 제도가 있어요. 임대인과 임차인이 함께 신고하는 게 원칙이고, 계약서를 첨부해 신고하면 확정일자가 부여된 것으로 본다고 해요. 그래서 전입신고 단계에서 임대차계약서를 냈거나 계약서를 붙여 임대차 신고를 했다면 확정일자 신청은 따로 하지 않아도 된다고 정부24는 안내하고 있어요.<\/p>\n<p>주의할 점이 두 가지 있어요.<\/p>\n<ul><li>임대차 신고와 전입신고는 다른 절차예요. 대항력의 요건인 주민등록은 전입신고로 갖춰요.<\/li><li>신고 대상 지역은 수도권(서울·경기·인천) 전역, 광역시, 세종시, 제주시, 그리고 도의 시 지역이에요. 도에 속한 군 지역은 빠져요(부동산 거래신고법 시행령 제4조의3, 찾기쉬운 생활법령정보).<\/li><\/ul>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>계약 전후에 알아 두면 좋은 것<\/b><\/span><\/p>\n<p>기존 세입자가 있는 집이라면 전입세대확인서로 그 집에 누가 언제 전입했는지 볼 수 있어요. 이 서류는 읍·면·동 주민센터에서만 발급되고 온라인 열람·교부는 안 된다고 해요. 임차인이 부동산거래관리시스템에서 확정일자를 받은 사실로 임차인 여부 확인에 동의하면 계약서 없이도 전입 세대를 확인할 수 있다는 설명도 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>전입신고: 전입일부터 14일 이내, 정부24 온라인 신청 가능<\/li><li>대항력: 입주 + 전입신고를 마친 다음 날 0시부터<\/li><li>우선변제권: 대항력 + 확정일자, 임대차 신고 시 확정일자가 부여된 것으로 봄<\/li><\/ul>\n<p>계약 내용에 따른 개별 판단은 달라질 수 있으니 분쟁이 걱정되는 경우에는 전문가 상담이나 공식 창구에서 한 번 더 확인해 주세요.<\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/012/012_0_thumb.png\n\n이삿짐을 풀고 나면 정리할 게 산더미라 서류 일은 자꾸 뒤로 밀리기 쉬워요. 그런데 전입신고와 확정일자는 세입자가 보증금을 지키는 데 쓰이는 기본 절차라서 순서와 기한을 알아 두면 좋아요. 정부24와 찾기쉬운 생활법령정보 안내를 바탕으로 정리했습니다. 법률 상담이 아니라 제도 안내예요. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/012/012_1_card.png\n\n전입신고는 언제까지, 어디서 하나요?\n\n거주지를 옮기면 전입한 날부터 14일 이내에 새 거주지 관할 기관에 신고해야 해요. 정부24의 '전입신고+'를 이용하면 직접 방문하지 않고 온라인으로 신청할 수 있고, 요금 감면 대상자는 신청서에서 통합 신청에 동의하면 전입신고와 감면 신청을 한 번에 할 수 있다고 안내돼 있어요.\n\n대항력은 무엇이고 언제 생길까요?\n\n임차인이 ① 주택의 인도(실제 입주)와 ② 주민등록을 마치면 그 다음 날부터 제3자에게도 임차권을 주장할 수 있는 힘이 생기는데, 이것을 대항력이라고 해요. 전입신고를 한 때 주민등록이 된 것으로 보고(주택임대차보호법 제3조 제1항), 여기서 '다음 날'은 오전 0시라고 해설돼 있어요.\n\n가상의 예를 들어 볼게요. 10월 20일에 입주하고 21일 오후 3시에 전입신고를 했다면 대항력은 22일 오전 0시부터 생겨요. 신고를 며칠 미룰수록 그만큼 대항력이 늦어지는 셈이에요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/012/012_2_card.png\n\n우선변제권은 확정일자가 더해져야 해요\n\n대항력을 갖추고 임대차계약서에 확정일자까지 받으면 집이 경매나 공매로 넘어갈 때 후순위 권리자나 다른 채권자보다 먼저 보증금을 돌려받을 수 있는 권리가 생겨요(같은 법 제3조의2). 확정일자는 주택 소재지의 행정복지센터나 등기소, 대법원 인터넷등기소, 또는 주택 임대차 계약 신고를 통해 받을 수 있어요. 정부24 안내에는 인터넷등기소 또는 이사 간 곳 관할 주민센터가 소개돼 있어요. 수수료는 주민센터·등기소에서 받으면 1건 600원(계약서가 4장을 넘으면 4장마다 100원 추가), 인터넷등기소 전자확정일자는 500원이에요.\n\n임대차 신고를 하면 확정일자는 따로 안 받아도 될까?\n\n보증금이 6천만 원을 넘거나 월 차임이 30만 원을 넘는 주택 임대차 계약은 계약 체결일부터 30일 이내에 신고해야 하는 제도가 있어요. 임대인과 임차인이 함께 신고하는 게 원칙이고, 계약서를 첨부해 신고하면 확정일자가 부여된 것으로 본다고 해요. 그래서 전입신고 단계에서 임대차계약서를 냈거나 계약서를 붙여 임대차 신고를 했다면 확정일자 신청은 따로 하지 않아도 된다고 정부24는 안내하고 있어요.\n\n주의할 점이 두 가지 있어요.\n- 임대차 신고와 전입신고는 다른 절차예요. 대항력의 요건인 주민등록은 전입신고로 갖춰요.\n- 신고 대상 지역은 수도권(서울·경기·인천) 전역, 광역시, 세종시, 제주시, 그리고 도의 시 지역이에요. 도에 속한 군 지역은 빠져요(부동산 거래신고법 시행령 제4조의3, 찾기쉬운 생활법령정보).\n\n계약 전후에 알아 두면 좋은 것\n\n기존 세입자가 있는 집이라면 전입세대확인서로 그 집에 누가 언제 전입했는지 볼 수 있어요. 이 서류는 읍·면·동 주민센터에서만 발급되고 온라인 열람·교부는 안 된다고 해요. 임차인이 부동산거래관리시스템에서 확정일자를 받은 사실로 임차인 여부 확인에 동의하면 계약서 없이도 전입 세대를 확인할 수 있다는 설명도 있어요.\n\n한눈에 정리\n\n- 전입신고: 전입일부터 14일 이내, 정부24 온라인 신청 가능\n- 대항력: 입주 + 전입신고를 마친 다음 날 0시부터\n- 우선변제권: 대항력 + 확정일자, 임대차 신고 시 확정일자가 부여된 것으로 봄\n\n계약 내용에 따른 개별 판단은 달라질 수 있으니 분쟁이 걱정되는 경우에는 전문가 상담이나 공식 창구에서 한 번 더 확인해 주세요.", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/012/012_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/012/012_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "012_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/012/012_1_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/012/012_1_card.png", "cap": "", "alt": "전입신고·확정일자 한눈에 정리", "name": "012_1_card.png", "w": 1080, "h": 778}, {"n": 2, "label": "사진 2", "uri": "img/012/012_2_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/012/012_2_card.png", "cap": "", "alt": "가상 예시: 대항력은 언제 생길까", "name": "012_2_card.png", "w": 1080, "h": 1129}], "zip": "img/012/012_images.zip", "html": "<figure class=\"ph thumbfig\" data-n=\"0\"><img src=\"img/012/012_0_thumb.png\" alt=\"대표 이미지\"><\/figure>\n<p>이삿짐을 풀고 나면 정리할 게 산더미라 서류 일은 자꾸 뒤로 밀리기 쉬워요. 그런데 전입신고와 확정일자는 세입자가 보증금을 지키는 데 쓰이는 기본 절차라서 순서와 기한을 알아 두면 좋아요. 정부24와 찾기쉬운 생활법령정보 안내를 바탕으로 정리했습니다. 법률 상담이 아니라 제도 안내예요. (2026년 10월 5일 기준)<\/p>\n<figure class=\"ph\" data-n=\"1\"><img loading=\"lazy\" src=\"img/012/012_1_card.png\" alt=\"전입신고·확정일자 한눈에 정리\"><\/figure>\n<h3>전입신고는 언제까지, 어디서 하나요?<\/h3>\n<p>거주지를 옮기면 전입한 날부터 14일 이내에 새 거주지 관할 기관에 신고해야 해요. 정부24의 '전입신고+'를 이용하면 직접 방문하지 않고 온라인으로 신청할 수 있고, 요금 감면 대상자는 신청서에서 통합 신청에 동의하면 전입신고와 감면 신청을 한 번에 할 수 있다고 안내돼 있어요.<\/p>\n<h3>대항력은 무엇이고 언제 생길까요?<\/h3>\n<p>임차인이 ① 주택의 인도(실제 입주)와 ② 주민등록을 마치면 그 다음 날부터 제3자에게도 임차권을 주장할 수 있는 힘이 생기는데, 이것을 대항력이라고 해요. 전입신고를 한 때 주민등록이 된 것으로 보고(주택임대차보호법 제3조 제1항), 여기서 '다음 날'은 오전 0시라고 해설돼 있어요.<\/p>\n<p>가상의 예를 들어 볼게요. 10월 20일에 입주하고 21일 오후 3시에 전입신고를 했다면 대항력은 22일 오전 0시부터 생겨요. 신고를 며칠 미룰수록 그만큼 대항력이 늦어지는 셈이에요.<\/p>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/012/012_2_card.png\" alt=\"가상 예시: 대항력은 언제 생길까\"><\/figure>\n<h3>우선변제권은 확정일자가 더해져야 해요<\/h3>\n<p>대항력을 갖추고 임대차계약서에 확정일자까지 받으면 집이 경매나 공매로 넘어갈 때 후순위 권리자나 다른 채권자보다 먼저 보증금을 돌려받을 수 있는 권리가 생겨요(같은 법 제3조의2). 확정일자는 주택 소재지의 행정복지센터나 등기소, 대법원 인터넷등기소, 또는 주택 임대차 계약 신고를 통해 받을 수 있어요. 정부24 안내에는 인터넷등기소 또는 이사 간 곳 관할 주민센터가 소개돼 있어요. 수수료는 주민센터·등기소에서 받으면 1건 600원(계약서가 4장을 넘으면 4장마다 100원 추가), 인터넷등기소 전자확정일자는 500원이에요.<\/p>\n<h3>임대차 신고를 하면 확정일자는 따로 안 받아도 될까?<\/h3>\n<p>보증금이 6천만 원을 넘거나 월 차임이 30만 원을 넘는 주택 임대차 계약은 계약 체결일부터 30일 이내에 신고해야 하는 제도가 있어요. 임대인과 임차인이 함께 신고하는 게 원칙이고, 계약서를 첨부해 신고하면 확정일자가 부여된 것으로 본다고 해요. 그래서 전입신고 단계에서 임대차계약서를 냈거나 계약서를 붙여 임대차 신고를 했다면 확정일자 신청은 따로 하지 않아도 된다고 정부24는 안내하고 있어요.<\/p>\n<p>주의할 점이 두 가지 있어요.<\/p>\n<ul><li>임대차 신고와 전입신고는 다른 절차예요. 대항력의 요건인 주민등록은 전입신고로 갖춰요.<\/li><li>신고 대상 지역은 수도권(서울·경기·인천) 전역, 광역시, 세종시, 제주시, 그리고 도의 시 지역이에요. 도에 속한 군 지역은 빠져요(부동산 거래신고법 시행령 제4조의3, 찾기쉬운 생활법령정보).<\/li><\/ul>\n<h3>계약 전후에 알아 두면 좋은 것<\/h3>\n<p>기존 세입자가 있는 집이라면 전입세대확인서로 그 집에 누가 언제 전입했는지 볼 수 있어요. 이 서류는 읍·면·동 주민센터에서만 발급되고 온라인 열람·교부는 안 된다고 해요. 임차인이 부동산거래관리시스템에서 확정일자를 받은 사실로 임차인 여부 확인에 동의하면 계약서 없이도 전입 세대를 확인할 수 있다는 설명도 있어요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>전입신고: 전입일부터 14일 이내, 정부24 온라인 신청 가능<\/li><li>대항력: 입주 + 전입신고를 마친 다음 날 0시부터<\/li><li>우선변제권: 대항력 + 확정일자, 임대차 신고 시 확정일자가 부여된 것으로 봄<\/li><\/ul>\n<p>계약 내용에 따른 개별 판단은 달라질 수 있으니 분쟁이 걱정되는 경우에는 전문가 상담이나 공식 창구에서 한 번 더 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 자체 제작 카드 · 사진 2 자체 제작 카드 — 파일 images/posts/012/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래<\/td><td>정부24 '전입신고+' 안내 화면(로그인 전) 직접 캡처<\/td><td>개인정보 입력 화면은 캡처 금지<\/td><\/tr><tr><td>대항력 예시 아래<\/td><td>날짜 흐름을 보여 주는 간단한 타임라인 표(직접 제작)<\/td><td>가상 예시임을 캡션에 표기<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 확정일자 수수료(방문 600원·인터넷등기소 500원)가 발행 시점에도 같은지 인터넷등기소 안내에서 확인<\/li><li class=\"cb\">☐ 임대차 신고제 적용 지역(제외 지역 표현)을 정부24 또는 국토교통부 안내에서 다시 확인<\/li><li class=\"cb\">☐ 전입세대확인서 관련 문단은 '제도 안내'임을 유지, 특정 계약 상황에 대한 법률 판단 문구를 추가하지 않기<\/li><li class=\"cb\">☐ 예시 날짜는 가상이라는 문구 유지 (실제 사례처럼 쓰지 않기)<\/li><li class=\"cb\">☐ 경험담을 넣는다면 실제 이사 경험만, 주소·계약 정보는 가리기<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>전입신고 14일 이내, 전입신고+ 온라인, 요금감면 통합신청, 임대차 신고 조건·확정일자 의제, 확정일자 신청처<\/td><td>정부24 전입신고 <a href=\"https://www.gov.kr/portal/onestopSvc/transferReport\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.kr/portal/onestopSvc/transferReport<\/a><\/td><td>공식<\/td><\/tr><tr><td>확정일자 수수료(1건 600원, 4장 초과 시 4장마다 100원, 인터넷등기소 500원)<\/td><td>국가법령정보센터 「주택임대차계약증서상의 확정일자 부여 및 임대차 정보제공에 관한 규칙」 <a href=\"https://www.law.go.kr/LSW/lsInfoP.do?lsId=011320\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.law.go.kr/LSW/lsInfoP.do?lsId=011320<\/a> (조문 수치는 검색 요약 확인) + 서대문구 수수료요율표 <a href=\"https://www.sdm.go.kr/civil/kind/chargechart.do\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.sdm.go.kr/civil/kind/chargechart.do<\/a> (교차 확인)<\/td><td>공식<\/td><\/tr><tr><td>임대차 신고 대상 지역(수도권 전역·광역시·세종시·제주시·도의 시, 도의 군 제외)<\/td><td>찾기쉬운 생활법령정보 <a href=\"https://easylaw.go.kr/CSP/CnpClsMain.laf?ccfNo=2&amp;cciNo=2&amp;cnpClsNo=5&amp;csmSeq=629&amp;popMenu=ov\" target=\"_blank\" rel=\"noopener noreferrer\">https://easylaw.go.kr/CSP/CnpClsMain.laf?ccfNo=2&amp;cciNo=2&amp;cnpClsNo=5&amp;csmSeq=629&amp;popMenu=ov<\/a> (시행령 제4조의3 제2항 근거)<\/td><td>공식<\/td><\/tr><tr><td>대항력 요건·발생 시점, 우선변제권, 확정일자 부여처, 임대차 신고제 요건, 전입세대확인서<\/td><td>찾기쉬운 생활법령정보 <a href=\"https://www.easylaw.go.kr/CSP/CnpClsMainBtr.laf?ccfNo=3&amp;cciNo=2&amp;cnpClsNo=1&amp;csmSeq=1972&amp;popMenu=ov\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.easylaw.go.kr/CSP/CnpClsMainBtr.laf?ccfNo=3&amp;cciNo=2&amp;cnpClsNo=1&amp;csmSeq=1972&amp;popMenu=ov<\/a> (주택임대차보호법 제3조·제3조의2, 부동산 거래신고 등에 관한 법률 제6조의2 근거 표기)<\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "이삿짐을 풀고 나면 정리할 게 산더미라 서류 일은 자꾸 뒤로 밀리기 쉬워요. 그런데 전입신고와 확정일자는 세입자가 보증금을 지키는 데 쓰이는 기본 절차라서 순서와 기한을 알아 두면 좋아요. 정부24와 찾기쉬운 생활법령정보 안내를 바탕으로 정리했습니다. 법률 상담이 아니라 제도 안내예요. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/012/012_1_card.png\n\n전입신고는 언제까지, 어디서 하나요?\n\n거주지를 옮기면 전입한 날부터 14일 이내에 새 거주지 관할 기관에 신고해야 해요. 정부24의 '전입신고+'를 이용하면 직접 방문하지 않고 온라인으로 신청할 수 있고, 요금 감면 대상자는 신청서에서 통합 신청에 동의하면 전입신고와 감면 신청을 한 번에 할 수 있다고 안내돼 있어요.\n\n대항력은 무엇이고 언제 생길까요?\n\n임차인이 ① 주택의 인도(실제 입주)와 ② 주민등록을 마치면 그 다음 날부터 제3자에게도 임차권을 주장할 수 있는 힘이 생기는데, 이것을 대항력이라고 해요. 전입신고를 한 때 주민등록이 된 것으로 보고(주택임대차보호법 제3조 제1항), 여기서 '다음 날'은 오전 0시라고 해설돼 있어요.\n\n가상의 예를 들어 볼게요. 10월 20일에 입주하고 21일 오후 3시에 전입신고를 했다면 대항력은 22일 오전 0시부터 생겨요. 신고를 며칠 미룰수록 그만큼 대항력이 늦어지는 셈이에요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/012/012_2_card.png\n\n우선변제권은 확정일자가 더해져야 해요\n\n대항력을 갖추고 임대차계약서에 확정일자까지 받으면 집이 경매나 공매로 넘어갈 때 후순위 권리자나 다른 채권자보다 먼저 보증금을 돌려받을 수 있는 권리가 생겨요(같은 법 제3조의2). 확정일자는 주택 소재지의 행정복지센터나 등기소, 대법원 인터넷등기소, 또는 주택 임대차 계약 신고를 통해 받을 수 있어요. 정부24 안내에는 인터넷등기소 또는 이사 간 곳 관할 주민센터가 소개돼 있어요. 수수료는 주민센터·등기소에서 받으면 1건 600원(계약서가 4장을 넘으면 4장마다 100원 추가), 인터넷등기소 전자확정일자는 500원이에요.\n\n임대차 신고를 하면 확정일자는 따로 안 받아도 될까?\n\n보증금이 6천만 원을 넘거나 월 차임이 30만 원을 넘는 주택 임대차 계약은 계약 체결일부터 30일 이내에 신고해야 하는 제도가 있어요. 임대인과 임차인이 함께 신고하는 게 원칙이고, 계약서를 첨부해 신고하면 확정일자가 부여된 것으로 본다고 해요. 그래서 전입신고 단계에서 임대차계약서를 냈거나 계약서를 붙여 임대차 신고를 했다면 확정일자 신청은 따로 하지 않아도 된다고 정부24는 안내하고 있어요.\n\n주의할 점이 두 가지 있어요.\n- 임대차 신고와 전입신고는 다른 절차예요. 대항력의 요건인 주민등록은 전입신고로 갖춰요.\n- 신고 대상 지역은 수도권(서울·경기·인천) 전역, 광역시, 세종시, 제주시, 그리고 도의 시 지역이에요. 도에 속한 군 지역은 빠져요(부동산 거래신고법 시행령 제4조의3, 찾기쉬운 생활법령정보).\n\n계약 전후에 알아 두면 좋은 것\n\n기존 세입자가 있는 집이라면 전입세대확인서로 그 집에 누가 언제 전입했는지 볼 수 있어요. 이 서류는 읍·면·동 주민센터에서만 발급되고 온라인 열람·교부는 안 된다고 해요. 임차인이 부동산거래관리시스템에서 확정일자를 받은 사실로 임차인 여부 확인에 동의하면 계약서 없이도 전입 세대를 확인할 수 있다는 설명도 있어요.\n\n한눈에 정리\n\n- 전입신고: 전입일부터 14일 이내, 정부24 온라인 신청 가능\n- 대항력: 입주 + 전입신고를 마친 다음 날 0시부터\n- 우선변제권: 대항력 + 확정일자, 임대차 신고 시 확정일자가 부여된 것으로 봄\n\n계약 내용에 따른 개별 판단은 달라질 수 있으니 분쟁이 걱정되는 경우에는 전문가 상담이나 공식 창구에서 한 번 더 확인해 주세요.", "copyAll": "이삿짐을 풀고 나면 정리할 게 산더미라 서류 일은 자꾸 뒤로 밀리기 쉬워요. 그런데 전입신고와 확정일자는 세입자가 보증금을 지키는 데 쓰이는 기본 절차라서 순서와 기한을 알아 두면 좋아요. 정부24와 찾기쉬운 생활법령정보 안내를 바탕으로 정리했습니다. 법률 상담이 아니라 제도 안내예요. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/012/012_1_card.png\n\n전입신고는 언제까지, 어디서 하나요?\n\n거주지를 옮기면 전입한 날부터 14일 이내에 새 거주지 관할 기관에 신고해야 해요. 정부24의 '전입신고+'를 이용하면 직접 방문하지 않고 온라인으로 신청할 수 있고, 요금 감면 대상자는 신청서에서 통합 신청에 동의하면 전입신고와 감면 신청을 한 번에 할 수 있다고 안내돼 있어요.\n\n대항력은 무엇이고 언제 생길까요?\n\n임차인이 ① 주택의 인도(실제 입주)와 ② 주민등록을 마치면 그 다음 날부터 제3자에게도 임차권을 주장할 수 있는 힘이 생기는데, 이것을 대항력이라고 해요. 전입신고를 한 때 주민등록이 된 것으로 보고(주택임대차보호법 제3조 제1항), 여기서 '다음 날'은 오전 0시라고 해설돼 있어요.\n\n가상의 예를 들어 볼게요. 10월 20일에 입주하고 21일 오후 3시에 전입신고를 했다면 대항력은 22일 오전 0시부터 생겨요. 신고를 며칠 미룰수록 그만큼 대항력이 늦어지는 셈이에요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/012/012_2_card.png\n\n우선변제권은 확정일자가 더해져야 해요\n\n대항력을 갖추고 임대차계약서에 확정일자까지 받으면 집이 경매나 공매로 넘어갈 때 후순위 권리자나 다른 채권자보다 먼저 보증금을 돌려받을 수 있는 권리가 생겨요(같은 법 제3조의2). 확정일자는 주택 소재지의 행정복지센터나 등기소, 대법원 인터넷등기소, 또는 주택 임대차 계약 신고를 통해 받을 수 있어요. 정부24 안내에는 인터넷등기소 또는 이사 간 곳 관할 주민센터가 소개돼 있어요. 수수료는 주민센터·등기소에서 받으면 1건 600원(계약서가 4장을 넘으면
