 동부) 위임 권한에 따라 Cboe BZX의 규칙 변경(SR-CboeBZX-2026-065)을 승인해 Volatility Shares VS Trust의 3x 금·은·비트코인·이더·원유·천연가스 6개 상품 상장·거래를 허용했어요(Release No. 34-106577). 각 상품은 1·2번째 월물 선물 벤치마크의 일일 성과 3배(수수료 전)를 목표로 하며, 레버리지 상품은 일반 상장기준 대상이 아니어서 별도 승인이 필요했어요. 보도에 따르면 거래 시작 전 등록신고서 효력 발생 등이 남았고 10월 5일 기준 일정은 미공개. 투자 조언 아님.", "need": 0, "chars": 197, "imgs": 0, "tweets": [{"n": 1, "total": 5, "text": "[크립토 뉴스] 미국 SEC가 10월 2일(미 동부) 비트코인·이더 '3배 레버리지' 상품의 Cboe BZX 상장 규칙 변경을 승인했어요. 한국에선 10월 3일 보도 🧵 #크립토뉴스 (1/5)", "len": 160, "need": 0, "media": []}, {"n": 2, "total": 5, "text": "SEC 명령(Release No. 34-106577) 기준 대상은 Volatility Shares의 VS Trust 6종.\n\n3x 금·은·비트코인·이더·원유·천연가스예요. Cboe BZX가 8월 10일 신청했어요. (2/5)", "len": 158, "need": 0, "media": []}, {"n": 3, "total": 5, "text": "구조가 핵심 👇\n\n현물을 보유하는 게 아니라 1·2번째 월물 선물로 구성한 벤치마크의 '하루' 성과 3배를 목표로 해요(수수료 차감 전). SEC 명령서 기준. (3/5)", "len": 149, "need": 0, "media": []}, {"n": 4, "total": 5, "text": "승인 = 바로 거래 시작은 아님.\n\n보도에 따르면 등록신고서 효력 발생 등 절차가 남았고, 10월 5일 기준 거래 시작일은 공개되지 않았어요. 레버리지 상품이라 일반 상장기준이 아닌 별도 승인을 받았어요. (4/5)", "len": 197, "need": 0, "media": []}, {"n": 5, "total": 5, "text": "비트코인닷컴은 FINRA를 인용해, 하루 단위 레버리지 상품을 오래 들고 있으면 결과가 기초자산 누적 변동의 3배와 크게 다를 수 있다고 전했어요.\n\n※ 정보 제공용, 투자 조언 아님 (5/5)", "len": 175, "need": 0, "media": []}], "replies": [{"text": "출처: SEC 승인 명령 Release No. 34-106577(2026-10-02) https://www.sec.gov/files/rules/sro/cboebzx/2026/34-106577.pdf", "len": 77, "need": 0}, {"text": "보도: 비트코인닷컴 https://news.bitcoin.com/regulation-and-legal/sec-approves-listing-of-bitcoin-etf-targeting-3x-daily-futures-moves/ · 크립토브리핑 https://cryptobriefing.com/sec-approves-3x-leveraged-bitcoin-ether-etps/", "len": 81, "need": 0}], "plain": "[크립토 뉴스] 미국 SEC가 10월 2일(미 동부) 비트코인·이더 '3배 레버리지' 상품의 Cboe BZX 상장 규칙 변경을 승인했어요. 한국에선 10월 3일 보도 🧵 #크립토뉴스 (1/5)\n\n---\n\nSEC 명령(Release No. 34-106577) 기준 대상은 Volatility Shares의 VS Trust 6종.\n\n3x 금·은·비트코인·이더·원유·천연가스예요. Cboe BZX가 8월 10일 신청했어요. (2/5)\n\n---\n\n구조가 핵심 👇\n\n현물을 보유하는 게 아니라 1·2번째 월물 선물로 구성한 벤치마크의 '하루' 성과 3배를 목표로 해요(수수료 차감 전). SEC 명령서 기준. (3/5)\n\n---\n\n승인 = 바로 거래 시작은 아님.\n\n보도에 따르면 등록신고서 효력 발생 등 절차가 남았고, 10월 5일 기준 거래 시작일은 공개되지 않았어요. 레버리지 상품이라 일반 상장기준이 아닌 별도 승인을 받았어요. (4/5)\n\n---\n\n비트코인닷컴은 FINRA를 인용해, 하루 단위 레버리지 상품을 오래 들고 있으면 결과가 기초자산 누적 변동의 3배와 크게 다를 수 있다고 전했어요.\n\n※ 정보 제공용, 투자 조언 아님 (5/5)", "copyAll": "[크립토 뉴스] 미국 SEC가 10월 2일(미 동부) 비트코인·이더 '3배 레버리지' 상품의 Cboe BZX 상장 규칙 변경을 승인했어요. 한국에선 10월 3일 보도 🧵 #크립토뉴스 (1/5)\n\n---\n\nSEC 명령(Release No. 34-106577) 기준 대상은 Volatility Shares의 VS Trust 6종.\n\n3x 금·은·비트코인·이더·원유·천연가스예요. Cboe BZX가 8월 10일 신청했어요. (2/5)\n\n---\n\n구조가 핵심 👇\n\n현물을 보유하는 게 아니라 1·2번째 월물 선물로 구성한 벤치마크의 '하루' 성과 3배를 목표로 해요(수수료 차감 전). SEC 명령서 기준. (3/5)\n\n---\n\n승인 = 바로 거래 시작은 아님.\n\n보도에 따르면 등록신고서 효력 발생 등 절차가 남았고, 10월 5일 기준 거래 시작일은 공개되지 않았어요. 레버리지 상품이라 일반 상장기준이 아닌 별도 승인을 받았어요. (4/5)\n\n---\n\n비트코인닷컴은 FINRA를 인용해, 하루 단위 레버리지 상품을 오래 들고 있으면 결과가 기초자산 누적 변동의 3배와 크게 다를 수 있다고 전했어요.\n\n※ 정보 제공용, 투자 조언 아님 (5/5)", "extras": [{"title": "이미지·미디어 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>트윗 3<\/td><td>직접 만든 구조 카드('현물 X → 선물 벤치마크의 하루 성과 × 3')<\/td><td>운용사 로고·차트·언론사 이미지는 첨부하지 말고 원본 링크로만<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 게시 직전 SEC 명령 원문과 Volatility Shares 공지로 거래 시작일이 정해졌는지 확인(정해졌다면 트윗 4 수정)<\/li><li class=\"cb\">☐ '등록신고서 효력 발생 필요'는 언론 보도 기준임을 유지(SEC 명령서 본문에서 직접 확인한 문장이 아님)<\/li><li class=\"cb\">☐ 상품 이름·티커를 추천하거나 거래를 권하는 표현을 추가하지 않기<\/li><li class=\"cb\">☐ 금·은·원유 등 비(非)크립토 상품이 함께 승인됐다는 점을 빼지 않기<\/li><li class=\"cb\">☐ 게시는 직접 수동으로(자동 게시 금지)<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>승인 일자 10월 2일, Release No. 34-106577, SR-CboeBZX-2026-065, VS Trust 6종(3x 금·은·비트코인·이더·원유·천연가스), 8월 10일 신청·8월 19일 관보 게재, 1·2번째 월물 선물 벤치마크 일일 3배(수수료 전), 레버리지 상품의 일반 상장기준 제외, 위임 권한에 따른 승인<\/td><td>SEC 승인 명령(PDF) <a href=\"https://www.sec F에 따르면 고종 때 주한 프랑스 공사 콜랭 드 플랑시가 수집해 가져갔고, 1911년 수집가 앙리 베베르에게 팔렸다가 1950년 유증, 1952년 BnF 소장품이 됐어요. (4/5)\n\n---\n\n반전 하나 더: BnF가 디지털 사본을 무료로 공개하고 있어서 지금 폰으로도 볼 수 있음 📱\n\n2023년엔 구텐베르크 성경과 같은 전시에 나란히 나왔대요. (5/5)", "extras": [{"title": "이미지·미디어 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>트윗 1<\/td><td>직접 만든 타임라인 카드(1377 청주 → 1900 파리 만국박람회 → 1952 BnF)<\/td><td>다큐·뉴스 영상 캡처, 남이 만든 짤은 첨부 금지 — 쓰고 싶으면 원본 링크 인용으로만<\/td><\/tr><tr><td>트윗 5<\/td><td>BnF 디지털 사본 이미지는 직접 첨부하지 말고 BnF 페이지 원본 링크만 안내<\/td><td>이용 조건은 BnF 안내를 따로 확인<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ '1377년 7월', '2001년 등재'를 유네스코 페이지에서, '78년', 소장 경위 연도(1911·1950·1952)를 BnF 페이지에서 다시 확인<\/li><li class=\"cb\">☐ '반환' 논쟁 같은 정치·외교 평가 문구를 덧붙이지 않기(사실 소개만)<\/li><li class=\"cb\">☐ 국가·국민을 비하하는 반응(인용 트윗 등)에 동조하는 답글을 달지 않기<\/li><li class=\"cb\">☐ 게시는 직접 수동으로<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>1377년 7월 청주 흥덕사 금속활자 인쇄, 현존 최고 금속활자 인쇄 증거, 2001년 세계기록유산 등재<\/td><td>유네스코 세계기록유산 <a href=\"https://www.unesco.org/en/memory-world/baegun-hwasang-chorok-buljo-jikji-simche-yojeol-volii-second-volume-anthology-great-buddhist-priests\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.unesco.org/en/memory-world/baegun-hwasang-chorok-buljo-jikji-simche-yojeol-volii-second-volume-anthology-great-buddhist-priests<\/a><\/td><td>공식<\/td><\/tr><tr><td>구텐베르크 성경보다 78년 앞섬, BnF 소장본은 하권, 1378년 목판본은 한국에 보존, 콜랭 드 플랑시 수집·1911년 앙리 베베르·1950년 유증·1952년 소장, 2001년 9월 4일 등재, 디지털 사본 무료 공개(Gallica), 2023년 전시<\/td><td>프랑스 국립도서관(BnF) <a href=\"https://www.bnf.fr/en/jikji-treasure-world-printing\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.bnf.fr/en/jikji-treasure-world-printing<\/a><\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>(선택) 스레드 끝 답글용: \"AI 도움을 받아 초안을 쓰고, 유네스코·프랑스 국립도서관 자료로 사실을 확인했어요.\"<\/blockquote>", "open": false}], "search": "032 세계에서 제일 오래된 금속활자 인쇄본, 한국에 없음. 파리에 있음 😇 흥미로운 사실 직지, 금속활자, 프랑스국립도서관, 세계기록유산, 흥덕사 #직지 1377년 청주 흥덕사에서 금속활자로 찍은 '직지'(하권)가 프랑스 국립도서관(BnF)에 소장된 경위와 유네스코 세계기록유산 등재(2001년)를 반전 훅으로 소개하는 한국어 5개 트윗 '직지'(백운화상초록불조직지심체요절, 하권)는 1377년 7월 청주 흥덕사에서 금속활자로 인쇄된 책으로, 유네스코가 현존 최고(最古) 금속활자 인쇄 증거로 설명하며 2001년 세계기록유산에 등재됐어요. 프랑스 국립도서관(BnF)은 구텐베르크 성경보다 78년 앞선다고 소개하며, 콜랭 드 플랑시 수집 → 1911년 앙리 베베르 매입 → 1950년 유증 → 1952년 BnF 소장 경위를 밝히고 있어요. BnF는 디지털 사본(Gallica)을 무료 공개하고 있고, 2023년 전시에서 구텐베르크 성경과 함께 공개했어요. 세계에서 제일 오래된 금속활자 인쇄본, 한국에 없음. 파리에 있음 😇 교과서에서 본 그 '직지' 얘기 🧵 #직지 (1/5) --- 직지는 1377년 7월 청주 흥덕사에서 금속활자로 찍은 불교 책이에요. 유네스코는 현존하는 가장 오래된 금속활자 인쇄 증거라고 설명하고, 2001년 세계기록유산에 올렸어요. (2/5) --- 프랑스 국립도서관(BnF) 설명으론 구텐베르크 성경보다 78년 빨라요. BnF에 있는 건 하권(2권)이에요. 1378년에 찍은 목판본은 한국에 남아 있다고 BnF가 소개해요. (3/5) --- 어쩌다 파리에? 🇫🇷 BnF에 따르면 고종 때 주한 프랑스 공사 콜랭 드 플랑시가 수집해 가져갔고, 1911년 수집가 앙리 베베르에게 팔렸다가 1950년 유증, 1952년 BnF 소장품이 됐어요. (4/5) --- 반전 하나 더: BnF가 디지털 사본을 무료로 공개하고 있어서 지금 폰으로도 볼 수 있음 📱 2023년엔 구텐베르크 성경과 같은 전시에 나란히 나왔대요. (5/5) X 일반"}, {"id": "031", "platform": "x", "sub": "x_general", "subLabel": "X 일반", "file": "031_karaoke-youth-entry.md", "title": "학생 때 코노 다닌 사람? 근데 노래방, 법적으로는 '청소년 출입·고용금지업소'였음 (10월 7일까지)", "cands": ["학생 때 코노 다닌 사람? 근데 노래방, 법적으로는 '청소년 출입·고용금지업소'였음 (10월 7일까지)", "노래방이 청소년 '출입금지' 업소였다는 거 아는 사람 🙋 10월 8일부터 바뀜", "10월 8일부터 노래방 분류가 바뀐다: 출입은 OK, 고용은 여전히 금지"], "cat": "일상 공감", "kw": ["노래방", "코인노래방", "청소년 출입", "청소년보호법", "노래연습장"], "summary": "10월 8일 시행 개정 청소년 보호법으로 노래연습장이 '청소년 출입·고용금지업소'에서 '청소년고용금지업소'로 바뀌는 내용과 오전 9시~오후 10시 출입시간 규정을 공감 톤으로 소개하는 한국어 5개 트윗", "status": "초안", "created": "2026-10-05 14:03", "base": "2026-10-05", "format": "thread", "hashtags": "#노래방", "tags": ["#노래방"], "ko": "10월 8일 시행되는 개정 청소년 보호법으로 노래연습장이 '청소년 출입·고용금지업소'에서 '청소년고용금지업소'로 바뀌어 청소년 출입이 법적으로 허용되고 고용은 계속 금지돼요(법제처 10월 1일 브리핑). 문체부는 청소년실 구분을 없애는 음악산업진흥법 시행령 개정을 추진 중이라는 보도가 있고, 현행 시행령상 청소년 출입시간은 오전 9시~오후 10시(성년 친족·교원 등 동반 시 예외). PC방 등은 청소년고용금지업소에서 제외.", "need": 0, "chars": 158, "imgs": 0, "tweets": [{"n": 1, "total": 5, "text": "학생 때 학교 끝나고 코노 달려간 사람 손 🙋\n\n근데 노래방, 법적으로는 아직 '청소년 출입·고용금지업소'임. 10월 7일까지만 🧵 #노래방 (1/5)", "len": 134, "need": 0, "media": []}, {"n": 2, "total": 5, "text": "10월 8일부터 개정 청소년 보호법 시행 🎤\n\n법제처 브리핑에 따르면 노래연습장은 '청소년고용금지업소'로 바뀌어요.\n\n출입은 법적으로 허용, 고용은 계속 금지. (2/5)", "len": 156, "need": 0, "media": []}, {"n": 3, "total": 5, "text": "그럼 그동안은? 🤔\n\n이투데이 보도(9월 22일)에 따르면 그동안 청소년은 '청소년실'만 쓸 수 있었고, 문체부가 모든 객실로 넓히는 시행령 개정을 추진 중이래요. (3/5)", "len": 157, "need": 0, "media": []}, {"n": 4, "total": 5, "text": "밤 10시 규칙은 따로 있음 ⏰\n\n음악산업진흥법 시행령상 청소년 출입시간은 오전 9시~오후 10시.\n\n성년 친족이나 학교 선생님 등과 함께면 예외 규정이 있어요. (4/5)", "len": 155, "need": 0, "media": []}, {"n": 5, "total": 5, "text": "같이 바뀐 것: PC방 등은 청소년고용금지업소에서 빠져서 청소년 알바 선택지도 넓어진다고 법제처가 설명했어요.\n\n결론: 노래방 가도 됨, 대신 10시엔 집 ㄱㄱ 🏠 (5/5)", "len": 158, "need": 0, "media": []}], "replies": [{"text": "출처: 법제처 '10월 주요 시행법령' 브리핑(2026-10-01) https://www.korea.kr/briefing/policyBriefingView.do?newsId=156783892", "len": 76, "need": 0}, {"text": "청소년실 구분 폐지 추진 보도: 이투데이(2026-09-22) https://www.etoday.co.kr/news/view/2628353", "len": 74, "need": 0}, {"text": "출입시간(오전 9시~오후 10시): 국가법령정보센터 음악산업진흥에 관한 법률 시행령 제8조 https://www.law.go.kr/법령/음악산업진흥에관한법률시행령/제8조", "len": 108, "need": 0}], "plain": "학생 때 학교 끝나고 코노 달려간 사람 손 🙋\n\n근데 노래방, 법적으로는 아직 '청소년 출입·고용금지업소'임. 10월 7일까지만 🧵 #노래방 (1/5)\n\n---\n\n10월 8일부터 개정 청소년 보호법 시행 🎤\n\n법제처 브리핑에 따르면 노래연습장은 '청소년고용금지업소'로 바뀌어요.\n\n출입은 법적으로 허용, 고용은 계속 금지. (2/5)\n\n---\n\n그럼 그동안은? 🤔\n\n이투데이 보도(9월 22일)에 따르면 그동안 청소년은 '청소년실'만 쓸 수 있었고, 문체부가 모든 객실로 넓히는 시행령 개정을 추진 중이래요. (3/5)\n\n---\n\n밤 10시 규칙은 따로 있음 ⏰\n\n음악산업진흥법 시행령상 청소년 출입시간은 오전 9시~오후 10시.\n\n성년 친족이나 학교 선생님 등과 함께면 예외 규정이 있어요. (4/5)\n\n---\n\n같이 바뀐 것: PC방 등은 청소년고용금지업소에서 빠져서 청소년 알바 선택지도 넓어진다고 법제처가 설명했어요.\n\n결론: 노래방 가도 됨, 대신 10시엔 집 ㄱㄱ 🏠 (5/5)", "copyAll": "학생 때 학교 끝나고 코노 달려간 사람 손 🙋\n\n근데 노래방, 법적으로는 아직 '청소년 출입·고용금지업소'임. 10월 7일까지만 🧵 #노래방 (1/5)\n\n---\n\n10월 8일부터 개정 청소년 보호법 시행 🎤\n\n법제처 브리핑에 따르면 노래연습장은 '청소년고용금지업소'로 바뀌어요.\n\n출입은 법적으로 허용, 고용은 계속 금지. (2/5)\n\n---\n\n그럼 그동안은? 🤔\n\n이투데이 보도(9월 22일)에 따르면 그동안 청소년은 '청소년실'만 쓸 수 있었고, 문체부가 모든 객실로 넓히는 시행령 개정을 추진 중이래요. (3/5)\n\n---\n\n밤 10시 규칙은 따로 있음 ⏰\n\n음악산업진흥법 시행령상 청소년 출입시간은 오전 9시~오후 10시.\n\n성년 친족이나 학교 선생님 등과 함께면 예외 규정이 있어요. (4/5)\n\n---\n\n같이 바뀐 것: PC방 등은 청소년고용금지업소에서 빠져서 청소년 알바 선택지도 넓어진다고 법제처가 설명했어요.\n\n결론: 노래방 가도 됨, 대신 10시엔 집 ㄱㄱ 🏠 (5/5)", "extras": [{"title": "이미지·미디어 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>트윗 1<\/td><td>직접 만든 텍스트 카드('출입·고용금지 → 고용금지')<\/td><td>노래방 상호·간판이 보이는 사진, 남이 만든 짤·영상은 첨부 금지 — 쓰고 싶으면 원본 링크 인용으로만<\/td><\/tr><tr><td>트윗 4<\/td><td>직접 만든 시계 아이콘 카드(09:00~22:00)<\/td><td>청소년 얼굴이 나오는 사진은 쓰지 않기<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 시행일 10월 8일과 '청소년고용금지업소'로 변경 문구를 법제처 브리핑·국가법령정보센터 청소년 보호법(시행 2026-10-08)으로 다시 확인<\/li><li class=\"cb\">☐ 음악산업진흥법 시행령 '청소년실' 폐지 개정이 실제로 공포·시행됐는지 게시 직전 확인(작성 시점엔 '추진' 보도 단계). 시행됐으면 트윗 3 문구를 수정<\/li><li class=\"cb\">☐ 출입시간(오전 9시~오후 10시)과 동반 예외가 시행령 개정 후에도 그대로인지 국가법령정보센터에서 확인<\/li><li class=\"cb\">☐ 학교 주변 등 다른 규제가 있을 수 있으니 '어디든 OK'처럼 단정하는 문구를 추가하지 않기<\/li><li class=\"cb\">☐ 게시는 직접 수동으로<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>10월 8일 시행 청소년 보호법: 노래연습장 '청소년 출입·고용금지업소' → '청소년고용금지업소', 출입 법적 허용, PC방 등 청소년고용금지업소 제외<\/td><td>법제처 브리핑(정책브리핑 2026-10-01) <a href=\"https://www.korea.kr/briefing/policyBriefingView.do?newsId=156783892\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/briefing/policyBriefingView.do?newsId=156783892<\/a><\/td><td>공식<\/td><\/tr><tr><td>기존 청소년실 한정, 문체부 음악산업진흥법 시행령 개정 추진(모든 객실 확대, 10월 8일 적용 목표), 고용 제한 유지<\/td><td>이투데이 2026-09-22 <a href=\"https://www.etoday.co.kr/news/view/2628353\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.etoday.co.kr/news/view/2628353<\/a><\/td><td>언론(문체부 설명 인용)<\/td><\/tr><tr><td>청소년 출입시간 오전 9시~오후 10시, 성년 친족·소속학교 교원 등 동반 예외<\/td><td>음악산업진흥에 관한 법률 시행령 제8조 — 조문 원문(govbrief.kr 법령 원문 수록) <a href=\"https://govbrief.kr/scan/010308/8/\" target=\"_blank\" rel=\"noopener noreferrer\">https://govbrief.kr/scan/010308/8/<\/a> · 국가법령정보센터 <a href=\"https://www.law.go.kr/법령/음악산업진흥에관한법률시행령/제8조\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.law.go.kr/법령/음악산업진흥에관한법률시행령/제8조<\/a> (박스에서 본문 미표시)<\/td><td>공식 조문(보조 사이트로 열람)<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>(선택) 스레드 끝 답글이나 프로필에 쓸 수 있는 문구: \"AI 도움을 받아 초안을 쓰고, 공식 자료로 사실을 확인했어요. 법 시행 내용은 바뀔 수 있어요.\"<\/blockquote>", "open": false}], "search": "031 학생 때 코노 다닌 사람? 근데 노래방, 법적으로는 '청소년 출입·고용금지업소'였음 (10월 7일까지) 일상 공감 노래방, 코인노래방, 청소년 출입, 청소년보호법, 노래연습장 #노래방 10월 8일 시행 개정 청소년 보호법으로 노래연습장이 '청소년 출입·고용금지업소'에서 '청소년고용금지업소'로 바뀌는 내용과 오전 9시~오후 10시 출입시간 규정을 공감 톤으로 소개하는 한국어 5개 트윗 10월 8일 시행되는 개정 청소년 보호법으로 노래연습장이 '청소년 출입·고용금지업소'에서 '청소년고용금지업소'로 바뀌어 청소년 출입이 법적으로 허용되고 고용은 계속 금지돼요(법제처 10월 1일 브리핑). 문체부는 청소년실 구분을 없애는 음악산업진흥법 시행령 개정을 추진 중이라는 보도가 있고, 현행 시행령상 청소년 출입시간은 오전 9시~오후 10시(성년 친족·교원 등 동반 시 예외). PC방 등은 청소년고용금지업소에서 제외. 학생 때 학교 끝나고 코노 달려간 사람 손 🙋 근데 노래방, 법적으로는 아직 '청소년 출입·고용금지업소'임. 10월 7일까지만 🧵 #노래방 (1/5) --- 10월 8일부터 개정 청소년 보호법 시행 🎤 법제처 브리핑에 따르면 노래연습장은 '청소년고용금지업소'로 바뀌어요. 출입은 법적으로 허용, 고용은 계속 금지. (2/5) --- 그럼 그동안은? 🤔 이투데이 보도(9월 22일)에 따르면 그동안 청소년은 '청소년실'만 쓸 수 있었고, 문체부가 모든 객실로 넓히는 시행령 개정을 추진 중이래요. (3/5) --- 밤 10시 규칙은 따로 있음 ⏰ 음악산업진흥법 시행령상 청소년 출입시간은 오전 9시~오후 10시. 성년 친족이나 학교 선생님 등과 함께면 예외 규정이 있어요. (4/5) --- 같이 바뀐 것: PC방 등은 청소년고용금지업소에서 빠져서 청소년 알바 선택지도 넓어진다고 법제처가 설명했어요. 결론: 노래방 가도 됨, 대신 10시엔 집 ㄱㄱ 🏠 (5/5) X 일반"}, {"id": "030", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "030_crypto-voice-phishing-refund.md", "title": "보이스피싱으로 코인까지 보냈다면? 10월 1일부터 달라진 가상자산 피해구제, 확인할 3가지", "cands": ["보이스피싱으로 코인까지 보냈다면? 10월 1일부터 달라진 가상자산 피해구제, 확인할 3가지", "가상자산 계정도 지급정지된다: 개정 통신사기피해환급법 10월 1일 시행 정리 (2026년)", "코인으로 바꿔 빼돌린 보이스피싱 피해금, 이제 돌려받을 길이 생겼어요"], "cat": "금융·자산조회", "kw": ["보이스피싱", "가상자산 지급정지", "피해환급", "통신사기피해환급법", "가상자산거래소"], "summary": "10월 1일 시행된 개정 통신사기피해환급법으로 가상자산거래소 계정도 지급정지·환급 절차 대상이 된 내용과, 피해 직후 할 일·환급 방식을 금융위원회·법제처·찾기쉬운 생활법령 기준으로 정리", "status": "초안", "created": "2026-10-05 14:03", "base": "2026-10-05", "need": 0, "chars": 1749, "chars_ns": 1365, "imgs": 3, "slots": 2, "filled": 2, "thumb": "img/030/030_0_thumb.png", "seHtml": "<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/030/030_0_thumb.png\" alt=\"대표 이미지\" width=\"720\"><\/p>\n<p>결론부터 말하면, 2026년 10월 1일부터 보이스피싱 피해금이 가상자산으로 바뀌어 빠져나간 경우에도 피해구제를 받을 수 있는 법적 길이 열렸어요. 개정된 「전기통신금융사기 피해 방지 및 피해자산 환급에 관한 특별법」(통신사기피해환급법)이 시행되면서 가상자산거래소도 법 적용 대상이 됐기 때문이에요. 피해를 입었을 때 확인할 세 가지를 순서대로 정리했어요. (2026년 10월 5일 기준)<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/030/030_1_card.png\" alt=\"가상자산 피해구제 한눈에 정리\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>무엇이 바뀌었나요?<\/b><\/span><\/p>\n<p>금융위원회에 따르면 보이스피싱에 가상자산을 이용하는 사례가 늘었지만, 그동안 가상자산은 피해구제 대상 자산에 들어가지 않아 범죄의 사각지대로 악용될 우려가 있었어요. 그래서 피해자산의 범위를 금전에서 가상자산까지 넓히는 법 개정이 2026년 3월 31일 공포됐고, 10월 1일부터 시행됐어요.<\/p>\n<p>법제처는 10월 1일 브리핑에서 이번 개정으로 가상자산거래소의 가상자산 계정에도 지급정지와 환급 절차를 진행할 수 있게 됐고, 피해자가 요청하면 가상자산을 현금으로 바꿔 돌려받을 근거도 생겼다고 설명했어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>확인할 것 ① 피해를 알았다면 바로 지급정지 신청<\/b><\/span><\/p>\n<p>찾기쉬운 생활법령정보는 송금·이체 사실을 알게 되면 곧바로 경찰청(112)이나 해당 금융회사 콜센터에 전화해 지급정지를 신청하라고 안내해요. 금융감독원(1332)을 통해서도 연결할 수 있어요. 기존 금융회사 계좌 기준으로는 경찰서에서 발급한 사건사고사실확인원 등 증빙을 갖춰 지급정지를 신청한 영업점에 신청일로부터 3영업일 안에 피해구제 신청서를 내야 해요. 가상자산거래소 계정이 얽힌 경우 구체적인 접수 창구와 서류는 112나 1332 상담에서 먼저 확인하세요.<\/p>\n<p>신분증·계좌번호 같은 개인정보가 새어 나갔거나 악성 앱 설치가 의심되면, 금융감독원 '개인정보노출자 사고 예방시스템'에 노출 사실을 등록하는 것도 안내돼 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>확인할 것 ② 무엇으로 돌려받는지<\/b><\/span><\/p>\n<p>금융위원회가 7월에 입법예고한 시행령 개정안은 환급 방식을 이렇게 정했어요.<\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>경우<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>환급 방식<\/b><\/td><\/tr><tr><td>피해 자산이 금전<\/td><td>금액 단위로 환급<\/td><\/tr><tr><td>피해 자산이 가상자산<\/td><td>종류·수량 단위로 환급<\/td><\/tr><tr><td>빼앗긴 자산과 계좌에 남은 자산의 형태가 다를 때<\/td><td>지급정지 시점에 사기이용계좌에 남아 있는 형태로 환급<\/td><\/tr><tr><td>금전과 가상자산이 섞여 있을 때<\/td><td>가상자산은 지급정지 시점 시세로 평가해 금액 결정<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/030/030_2_card.png\" alt=\"무엇으로 돌려받나\" width=\"720\"><\/p>\n<p>가상자산으로 받는 것이 원칙이지만, 거래 경험이나 계정이 없는 피해자를 위해 가상자산을 처분하고 대금을 금전으로 지급하는 '매도지원 전담기관'을 지정하도록 했어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>확인할 것 ③ 채권소멸 공고와 기한<\/b><\/span><\/p>\n<p>기존 절차에 따르면 금융회사가 사기이용계좌로 의심해 지급정지를 하면, 금융감독원이 채권소멸절차 개시를 2개월간 공고해요. 공고 전에 피해구제를 신청하지 못했더라도 공고일부터 2개월 안에는 신청할 수 있어요. 채권이 소멸되면 금융감독원이 14일 안에 피해환급금을 받을 사람과 금액을 정해요. 피해자가 여러 명이면 비율에 따라 나눠 받을 수 있어요.<\/p>\n<p>거짓으로 피해구제를 신청하면 3년 이하 징역 또는 3천만 원 이하 벌금 대상이에요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>10월 1일부터 가상자산거래소 계정도 지급정지·환급 절차 대상<\/li><li>피해 직후 112·금융회사 콜센터(1332 연결 가능)로 지급정지 신청<\/li><li>환급은 남아 있는 자산 형태 기준, 원하면 현금 지급 경로도 마련<\/li><li>채권소멸 공고일부터 2개월 안에 신청 가능<\/li><\/ul>\n<p>구체적 절차는 사건마다 다를 수 있으니 경찰청 112와 금융감독원 1332 안내를 꼭 다시 확인해 주세요.<\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/030/030_0_thumb.png\n\n결론부터 말하면, 2026년 10월 1일부터 보이스피싱 피해금이 가상자산으로 바뀌어 빠져나간 경우에도 피해구제를 받을 수 있는 법적 길이 열렸어요. 개정된 「전기통신금융사기 피해 방지 및 피해자산 환급에 관한 특별법」(통신사기피해환급법)이 시행되면서 가상자산거래소도 법 적용 대상이 됐기 때문이에요. 피해를 입었을 때 확인할 세 가지를 순서대로 정리했어요. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/030/030_1_card.png\n\n무엇이 바뀌었나요?\n\n금융위원회에 따르면 보이스피싱에 가상자산을 이용하는 사례가 늘었지만, 그동안 가상자산은 피해구제 대상 자산에 들어가지 않아 범죄의 사각지대로 악용될 우려가 있었어요. 그래서 피해자산의 범위를 금전에서 가상자산까지 넓히는 법 개정이 2026년 3월 31일 공포됐고, 10월 1일부터 시행됐어요.\n\n법제처는 10월 1일 브리핑에서 이번 개정으로 가상자산거래소의 가상자산 계정에도 지급정지와 환급 "name": "030_2_card.png", "w": 1080, "h": 1144}], "zip": "img/030/030_images.zip", "html": "<figure class=\"ph thumbfig\" data-n=\"0\"><img src=\"img/030/030_0_thumb.png\" alt=\"대표 이미지\"><\/figure>\n<p>결론부터 말하면, 2026년 10월 1일부터 보이스피싱 피해금이 가상자산으로 바뀌어 빠져나간 경우에도 피해구제를 받을 수 있는 법적 길이 열렸어요. 개정된 「전기통신금융사기 피해 방지 및 피해자산 환급에 관한 특별법」(통신사기피해환급법)이 시행되면서 가상자산거래소도 법 적용 대상이 됐기 때문이에요. 피해를 입었을 때 확인할 세 가지를 순서대로 정리했어요. (2026년 10월 5일 기준)<\/p>\n<figure class=\"ph\" data-n=\"1\"><img loading=\"lazy\" src=\"img/030/030_1_card.png\" alt=\"가상자산 피해구제 한눈에 정리\"><\/figure>\n<h3>무엇이 바뀌었나요?<\/h3>\n<p>금융위원회에 따르면 보이스피싱에 가상자산을 이용하는 사례가 늘었지만, 그동안 가상자산은 피해구제 대상 자산에 들어가지 않아 범죄의 사각지대로 악용될 우려가 있었어요. 그래서 피해자산의 범위를 금전에서 가상자산까지 넓히는 법 개정이 2026년 3월 31일 공포됐고, 10월 1일부터 시행됐어요.<\/p>\n<p>법제처는 10월 1일 브리핑에서 이번 개정으로 가상자산거래소의 가상자산 계정에도 지급정지와 환급 절차를 진행할 수 있게 됐고, 피해자가 요청하면 가상자산을 현금으로 바꿔 돌려받을 근거도 생겼다고 설명했어요.<\/p>\n<h3>확인할 것 ① 피해를 알았다면 바로 지급정지 신청<\/h3>\n<p>찾기쉬운 생활법령정보는 송금·이체 사실을 알게 되면 곧바로 경찰청(112)이나 해당 금융회사 콜센터에 전화해 지급정지를 신청하라고 안내해요. 금융감독원(1332)을 통해서도 연결할 수 있어요. 기존 금융회사 계좌 기준으로는 경찰서에서 발급한 사건사고사실확인원 등 증빙을 갖춰 지급정지를 신청한 영업점에 신청일로부터 3영업일 안에 피해구제 신청서를 내야 해요. 가상자산거래소 계정이 얽힌 경우 구체적인 접수 창구와 서류는 112나 1332 상담에서 먼저 확인하세요.<\/p>\n<p>신분증·계좌번호 같은 개인정보가 새어 나갔거나 악성 앱 설치가 의심되면, 금융감독원 '개인정보노출자 사고 예방시스템'에 노출 사실을 등록하는 것도 안내돼 있어요.<\/p>\n<h3>확인할 것 ② 무엇으로 돌려받는지<\/h3>\n<p>금융위원회가 7월에 입법예고한 시행령 개정안은 환급 방식을 이렇게 정했어요.<\/p>\n<div class=\"tw\"><table><thead><tr><th>경우<\/th><th>환급 방식<\/th><\/tr><\/thead><tbody><tr><td>피해 자산이 금전<\/td><td>금액 단위로 환급<\/td><\/tr><tr><td>피해 자산이 가상자산<\/td><td>종류·수량 단위로 환급<\/td><\/tr><tr><td>빼앗긴 자산과 계좌에 남은 자산의 형태가 다를 때<\/td><td>지급정지 시점에 사기이용계좌에 남아 있는 형태로 환급<\/td><\/tr><tr><td>금전과 가상자산이 섞여 있을 때<\/td><td>가상자산은 지급정지 시점 시세로 평가해 금액 결정<\/td><\/tr><\/tbody><\/table><\/div>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/030/030_2_card.png\" alt=\"무엇으로 돌려받나\"><\/figure>\n<p>가상자산으로 받는 것이 원칙이지만, 거래 경험이나 계정이 없는 피해자를 위해 가상자산을 처분하고 대금을 금전으로 지급하는 '매도지원 전담기관'을 지정하도록 했어요.<\/p>\n<h3>확인할 것 ③ 채권소멸 공고와 기한<\/h3>\n<p>기존 절차에 따르면 금융회사가 사기이용계좌로 의심해 지급정지를 하면, 금융감독원이 채권소멸절차 개시를 2개월간 공고해요. 공고 전에 피해구제를 신청하지 못했더라도 공고일부터 2개월 안에는 신청할 수 있어요. 채권이 소멸되면 금융감독원이 14일 안에 피해환급금을 받을 사람과 금액을 정해요. 피해자가 여러 명이면 비율에 따라 나눠 받을 수 있어요.<\/p>\n<p>거짓으로 피해구제를 신청하면 3년 이하 징역 또는 3천만 원 이하 벌금 대상이에요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>10월 1일부터 가상자산거래소 계정도 지급정지·환급 절차 대상<\/li><li>피해 직후 112·금융회사 콜센터(1332 연결 가능)로 지급정지 신청<\/li><li>환급은 남아 있는 자산 형태 기준, 원하면 현금 지급 경로도 마련<\/li><li>채권소멸 공고일부터 2개월 안에 신청 가능<\/li><\/ul>\n<p>구체적 절차는 사건마다 다를 수 있으니 경찰청 112와 금융감독원 1332 안내를 꼭 다시 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 자체 제작 카드 · 사진 2 자체 제작 카드 — 파일 images/posts/030/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래<\/td><td>직접 만든 '피해 직후 3단계' 텍스트 카드(112 → 지급정지 → 피해구제 신청)<\/td><td>금융위·금감원 카드뉴스는 이용조건이 불명확해 쓰지 않기<\/td><\/tr><tr><td>확인할 것 ①<\/td><td>문자·메신저 피싱 예시를 그림으로 만들 경우 가상의 내용만<\/td><td>실제 피해자 대화·계좌·지갑 주소 캡처 금지<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 법 공포일(3월 31일)·시행일(10월 1일)을 금융위원회 보도자료·법제처 브리핑과 다시 대조<\/li><li class=\"cb\">☐ 환급 방식 표는 7월 입법예고안 기준 — 확정된 시행령 조문이 달라졌는지 국가법령정보센터에서 확인 후 필요하면 '입법예고안 기준' 문구 수정<\/li><li class=\"cb\">☐ '3영업일 안 피해구제 신청'은 기존 금융회사 계좌 기준 안내임을 유지(가상자산거래소 접수 방식은 단정하지 않기)<\/li><li class=\"cb\">☐ 특정 거래소 이름·코인 이름, 투자 관련 문구를 추가하지 않기<\/li><li class=\"cb\">☐ 피해 경험담은 실제 있었던 경우에만, 개인정보 없이<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>개정 배경, 3월 31일 공포·10월 1일 시행, 시행령 입법예고안(금액·종류·수량 단위 환급, 지급정지 시점 형태, 혼재 시 시세 평가, 매도지원 전담기관)<\/td><td>금융위원회 보도참고자료(2026-07-15) <a href=\"https://www.fsc.go.kr/no010101/87333\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsc.go.kr/no010101/87333<\/a><\/td><td>공식<\/td><\/tr><tr><td>10월 1일 시행, 가상자산거래소 적용, 가상자산 계정 지급정지·환급, 요청 시 현금 환급 근거<\/td><td>법제처 10월 주요 시행법령 브리핑(정책브리핑 2026-10-01) <a href=\"https://www.korea.kr/briefing/policyBriefingView.do?newsId=156783892\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/briefing/policyBriefingView.do?newsId=156783892<\/a><\/td><td>공식<\/td><\/tr><tr><td>112·콜센터 지급정지, 1332 연결, 사건사고사실확인원·3영업일 피해구제 신청, 개인정보노출 등록, 채권소멸 공고 2개월·공고 후 2개월 내 신청, 14일 내 환급금 결정·배분, 거짓 신청 처벌<\/td><td>찾기쉬운 생활법령정보 100문100답 <a href=\"https://easylaw.go.kr/CSP/OnhunqueansLstRetrieve.laf?onhunqnaAstSeq=86&amp;onhunqueAstSeq=396&amp;sortType=11\" target=\"_blank\" rel=\"noopener noreferrer\">https://easylaw.go.kr/CSP/OnhunqueansLstRetrieve.laf?onhunqnaAstSeq=86&amp;onhunqueAstSeq=396&amp;sortType=11<\/a><\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "결론부터 말하면, 2026년 10월 1일부터 보이스피싱 피해금이 가상자산으로 바뀌어 빠져나간 경우에도 피해구제를 받을 수 있는 법적 길이 열렸어요. 개정된 「전기통신금융사기 피해 방지 및 피해자산 환급에 관한 특별법」(통신사기피해환급법)이 시행되면서 가상자산거래소도 법 적용 대상이 됐기 때문이에요. 피해를 입었을 때 확인할 세 가지를 순서대로 정리했어요. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/030/030_1_card.png\n\n무엇이 바뀌었나요?\n\n금융위원회에 따르면 보이스피싱에 가상자산을 이용하는 사례가 늘었지만, 그동안 가상자산은 피해구제 대상 자산에 들어가지 않아 범죄의 사각지대로 악용될 우려가 있었어요. 그래서 피해자산의 범위를 금전에서 가상자산까지 넓히는 법 개정이 2026년 3월 31일 공포됐고, 10월 1일부터 시행됐어요.\n\n법제처는 10월 1일 브리핑에서 이번 개정으로 가상자산거래소의 가상자산 계정에도 지급정지와 환급 절차를 진행할 수 있게 됐고, 피해자가 요청하면 가상자산을 현금으로 바꿔 돌려받을 근거도 생겼다고 설명했어요.\n\n확인할 것 ① 피해를 알았다면 바로 지급정지 신청\n\n찾기쉬운 생활법령정보는 송금·이체 사실을 알게 되면 곧바로 경찰청(112)이나 해당 금융회사 콜센터에 전화해 지급정지를 신청하라고 안내해요. 금융감독원(1332)을 통해서도 연결할 수 있어요. 기존 금융회사 계좌 기준으로는 경찰서에서 발급한 사건사고사실확인원 등 증빙을 갖춰 지급정지를 신청한 영업점에 신청일로부터 3영업일 안에 피해구제 신청서를 내야 해요. 가상자산거래소 계정이 얽힌 경우 구체적인 접수 창구와 서류는 112나 1332 상담에서 먼저 확인하세요.\n\n신분증·계좌번호 같은 개인정보가 새어 나갔거나 악성 앱 설치가 의심되면, 금융감독원 '개인정보노출자 사고 예방시스템'에 노출 사실을 등록하는 것도 안내돼 있어요.\n\n확인할 것 ② 무엇으로 돌려받는지\n\n금융위원회가 7월에 입법예고한 시행령 개정안은 환급 방식을 이렇게 정했어요.\n\n• 피해 자산이 금전 — 환급 방식: 금액 단위로 환급\n• 피해 자산이 가상자산 — 환급 방식: 종류·수량 단위로 환급\n• 빼앗긴 자산과 계좌에 남은 자산의 형태가 다를 때 — 환급 방식: 지급정지 시점에 사기이용계좌에 남아 있는 형태로 환급\n• 금전과 가상자산이 섞여 있을 때 — 환급 방식: 가상자산은 지급정지 시점 시세로 평가해 금액 결정\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/030/030_2_card.png\n\n가상자산으로 받는 것이 원칙이지만, 거래 경험이나 계정이 없는 피해자를 위해 가상자산을 처분하고 대금을 금전으로 지급하는 '매도지원 전담기관'을 지정하도록 했어요.\n\n확인할 것 ③ 채권소멸 공고와 기한\n\n기존 절차에 따르면 금융회사가 사기이용계좌로 의심해 지급정지를 하면, 금융감독원이 채권소멸절차 개시를 2개월간 공고해요. 공고 전에 피해구제를 신청하지 못했더라도 공고일부터 2개월 안에는 신청할 수 있어요. 채권이 소멸되면 금융감독원이 14일 안에 피해환급금을 받을 사람과 금액을 정해요. 피해자가 여러 명이면 비율에 따라 나눠 받을 수 있어요.\n\n거짓으로 피해구제를 신청하면 3년 이하 징역 또는 3천만 원 이하 벌금 대상이에요.\n\n한눈에 정리\n\n- 10월 1일부터 가상자산거래소 계정도 지급정지·환급 절차 대상\n- 피해 직후 112·금융회사 콜센터(1332 연결 가능)로 지급정지 신청\n- 환급은 남아 있는 자산 형태 기준, 원하면 현금 지급 경로도 마련\n- 채권소멸 공고일부터 2개월 안에 신청 가능\n\n구체적 절차는 사건마다 다를 수 있으니 경찰청 112와 금융감독원 1332 안내를 꼭 다시 확인해 주세요.", "copyAll": "결론부터 말하면, 2026년 10월 1일부터 보이스피싱 피해금이 가상자산으로 바뀌어 빠져나간 경우에도 피해구제를 받을 수 있는 법적 길이 열렸어요. 개정된 「전기통신금융사기 피해 방지 및 피해자산 환급에 관한 특별법」(통신사기피해환급법)이 시행되면서 가상자산거래소도 법 적용 대상이 됐기 때문이에요. 피해를 입었을 때 확인할 세 가지를 순서대로 정리했어요. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/030/030_1_card.png\n\n무엇이 바뀌었나요?\n\n금융위원회에 따르면 보이스피싱에 가상자산을 이용하는 사례가 늘었지만, 그동안 가상자산은 피해구제 대상 자산에 들어가지 않아 범죄의 사각지대로 악용될 우려가 있었어요. 그래서 피해자산의 범위를 금전에서 가상자산까지 넓히는 법 개정이 2026년 3월 31일 공포됐고, 10월 1일부터 시행됐어요.\n\n법제처는 10월 1일 브리핑에서 이번 개정으로 가상자산거래소의 가상자산 계정에도 지급정지와 환급 절차를 진행할 수 있게 됐고, 피해자가 요청하면 가상자산을 현금으로 바꿔 돌려받을 근거도 생겼다고 설명했어요.\n\n확인할 것 ① 피해를 알았다면 바로 지급정지 신청\n\n찾기쉬운 생활법령정보는 송금·이체 사실을 알게 되면 곧바로 경찰청(112)이나 해당 금융회사 콜센터에 전화해 지급정지를 신청하라고 안내해요. 금융감독원(1332)을 통해서도 연결할 수 있어요. 기존 금융회사 계좌 기준으로는 경찰서에서 발급한 사건사고사실확인원 등 증빙을 갖춰 지급정지를 신청한 영업점에 신청일로부터 3영업일 안에 피해구제 신청서를 내야 해요. 가상자산거래소 계정이 얽힌 경우 구체적인 접수 창구와 서류는 112나 1332 상담에서 먼저 확인하세요.\n\n신분증·계좌번호 같은 개인정보가 새어 나갔거나 악성 앱 설치가 의심되면, 금융감독원 '개인정보노출자 사고 예방시스템'에 노출 사실을 등록하는 것도 안내돼 있어요.\n\n확인할 것 ② 무엇으로 돌려받는지\n\n금융위원회가 7월에 입법예고한 시행령 개정안은 환급 방식을 이렇게 정했어요.\n\n• 피해 자산이 금 사고 예방시스템'에 노출 사실을 등록하는 것도 안내돼 있어요. 확인할 것 ② 무엇으로 돌려받는지 금융위원회가 7월에 입법예고한 시행령 개정안은 환급 방식을 이렇게 정했어요. • 피해 자산이 금전 — 환급 방식: 금액 단위로 환급 • 피해 자산이 가상자산 — 환급 방식: 종류·수량 단위로 환급 • 빼앗긴 자산과 계좌에 남은 자산의 형태가 다를 때 — 환급 방식: 지급정지 시점에 사기이용계좌에 남아 있는 형태로 환급 • 금전과 가상자산이 섞여 있을 때 — 환급 방식: 가상자산은 지급정지 시점 시세로 평가해 금액 결정 [사진 2] https://senti-1000ma.github.io/blog-drafts/img/030/030_2_card.png 가상자산으로 받는 것이 원칙이지만, 거래 경험이나 계정이 없는 피해자를 위해 가상자산을 처분하고 대금을 금전으로 지급하는 '매도지원 전담기관'을 지정하도록 했어요. 확인할 것 ③ 채권소멸 공고와 기한 기존 절차에 따르면 금융회사가 사기이용계좌로 의심해 지급정지를 하면, 금융감독원이 채권소멸절차 개시를 2개월간 공고해요. 공고 전에 피해구제를 신청하지 못했더라도 공고일부터 2개월 안에는 신청할 수 있어요. 채권이 소멸되면 금융감독원이 14일 안에 피해환급금을 받을 사람과 금액을 정해요. 피해자가 여러 명이면 비율에 따라 나눠 받을 수 있어요. 거짓으로 피해구제를 신청하면 3년 이하 징역 또는 3천만 원 이하 벌금 대상이에요. 한눈에 정리 - 10월 1일부터 가상자산거래소 계정도 지급정지·환급 절차 대상 - 피해 직후 112·금융회사 콜센터(1332 연결 가능)로 지급정지 신청 - 환급은 남아 있는 자산 형태 기준, 원하면 현금 지급 경로도 마련 - 채권소멸 공고일부터 2개월 안에 신청 가능 구체적 절차는 사건마다 다를 수 있으니 경찰청 112와 금융감독원 1332 안내를 꼭 다시 확인해 주세요. 네이버"}, {"id": "029", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "029_resident-register-relation-label.md", "title": "등본에 '자녀' 대신 '세대원'? 10월 29일부터 바뀌는 등·초본 표기, 그래도 예전 방식은 '상세'로 뽑을 수 있어요", "cands": ["등본에 '자녀' 대신 '세대원'? 10월 29일부터 바뀌는 등·초본 표기, 그래도 예전 방식은 '상세'로 뽑을 수 있어요", "주민등록등본 '일반'과 '상세' 무엇을 골라야 할까? 10월 29일부터 달라지는 세대주와의 관계 표기", "10월 29일부터 등본 가족 표기 '세대원·동거인'으로: 제출처에 먼저 물어볼 것"], "cat": "민원·디지털", "kw": ["주민등록등본", "세대원", "동거인", "등초본 발급", "세대주와의 관계"], "summary": "10월 29일부터 주민등록표 등·초본의 세대주와의 관계가 '세대원·동거인'으로 표기되는 일반 방식과 기존처럼 구체적 관계가 나오는 상세 방식을 행정안전부 안내 기준으로 비교", "status": "초안", "created": "2026-10-05 14:03", "base": "2026-10-05", "need": 0, "chars": 1592, "chars_ns": 1215, "imgs": 3, "slots": 2, "filled": 2, "thumb": "img/029/029_0_thumb.png", "seHtml": "<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/029/029_0_thumb.png\" alt=\"대표 이미지\" width=\"720\"><\/p>\n<p>회사나 학교에 등본을 낼 때, 가족 관계가 하나하나 다 적혀 나와서 신경 쓰였던 적 있으신가요? 2026년 10월 29일부터 주민등록표 등본·초본의 '세대주와의 관계' 칸이 달라져요. 그렇다고 예전 방식이 사라지는 건 아니에요. 행정안전부 안내를 바탕으로 '일반'과 '상세'를 나란히 비교해 볼게요. (2026년 10월 5일 기준)<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/029/029_1_card.png\" alt=\"등·초본 일반 vs 상세\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>왜 바뀌나요?<\/b><\/span><\/p>\n<p>행정안전부는 지금까지 등·초본에 불필요한 가족관계가 그대로 드러나 재혼 가정 등의 사생활이 노출되는 문제가 있었다며, 이를 막기 위해 세대주와의 관계 표기 방식을 고친다고 밝혔어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>일반 vs 상세, 나란히 비교<\/b><\/span><\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>구분<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>일반(새 방식)<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>상세(기존 방식)<\/b><\/td><\/tr><tr><td>세대주 본인·배우자<\/td><td>본인, 배우자<\/td><td>본인, 배우자<\/td><\/tr><tr><td>배우자 외 민법상 가족(자녀·부모 등)<\/td><td>'세대원'으로 통일<\/td><td>자녀, 배우자의 자녀 등 구체적 관계<\/td><\/tr><tr><td>가족이 아닌 사람(예: 함께 사는 친척 중 가족 범위 밖)<\/td><td>'동거인'<\/td><td>삼촌 등 구체적 관계<\/td><\/tr><tr><td>신청 시 추가 기재<\/td><td>없음<\/td><td>'용도 및 목적' 작성 필수<\/td><\/tr><tr><td>언제 쓰나<\/td><td>제출처가 따로 요구하지 않을 때<\/td><td>제출처가 구체적 관계를 요구할 때<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p>행정안전부 안내 예시를 보면, 세대주의 자녀는 '자녀' 대신 '세대원'으로, 배우자의 자녀도 똑같이 '세대원'으로 표시돼요. 그래서 일반 등본만 봐서는 누가 누구의 자녀인지 드러나지 않아요. 가족 범위에 들지 않는 동거 친척은 '동거인'으로 묶여요.<\/p>\n<p>참고로 이번 변경은 '세대주와의 관계' 칸을 어떻게 적느냐에 관한 것이에요. 세대주 본인과 배우자는 일반·상세 어느 쪽을 골라도 지금처럼 '본인', '배우자'로 나와요.<\/p>\n<p>정책브리핑은 기재 순서도 세대주와 배우자의 직계존비속을 같은 순위로 적는 방식으로 바뀐다고 소개했어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>어떤 것을 떼야 할까?<\/b><\/span><\/p>\n<p>행정안전부가 강조한 원칙은 두 가지예요.<\/p>\n<ol><li>제출하는 기관이 따로 요구하지 않으면 '일반'으로 발급하기<\/li><li>발급 전에 제출처에 어떤 서식이 필요한지 미리 확인하기<\/li><\/ol>\n<p>가족 관계를 증명해야 하는 서류 심사처럼 제출처가 구체적 관계를 보려는 경우에는 '상세'가 필요할 수 있어요. 이때는 신청할 때 용도와 목적을 꼭 적어야 해요. 미리 묻지 않고 일반으로 떼어 갔다가 다시 발급받는 일이 없도록, 제출처 안내문이나 담당자에게 한 번 확인하는 게 가장 확실해요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>10월 29일 전후로 달라지는 점 정리<\/b><\/span><\/p>\n<ul><li>10월 28일까지: 등·초본에 자녀, 배우자의 자녀, 삼촌처럼 구체적 관계가 표기돼요.<\/li><li>10월 29일부터: 신청할 때 '일반' 또는 '상세'를 고르고, 일반은 세대원·동거인으로 표기돼요.<\/li><li>이미 발급받아 둔 등본을 써도 되는지는 제출처의 기준(발급일 제한 등)에 따라 달라요.<\/li><\/ul>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/029/029_2_card.png\" alt=\"등·초본 표기 변경 한눈에 정리\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>10월 29일부터 세대주와의 관계 표기 개선(사생활 보호 목적)<\/li><li>일반: 배우자 외 가족은 '세대원', 그 밖은 '동거인'<\/li><li>상세: 기존처럼 구체적 관계, 용도·목적 기재 필수<\/li><li>제출처에 필요한 서식을 먼저 확인<\/li><\/ul>\n<p>발급 화면과 선택 방법은 시행 후 기관별로 다르게 보일 수 있으니, 발급 전 정부24나 주민센터 안내를 다시 확인해 주세요.<\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/029/029_0_thumb.png\n\n회사나 학교에 등본을 낼 때, 가족 관계가 하나하나 다 적혀 나와서 신경 쓰였던 적 있으신가요? 2026년 10월 29일부터 주민등록표 등본·초본의 '세대주와의 관계' 칸이 달라져요. 그렇다고 예전 방식이 사라지는 건 아니에요. 행정안전부 안내를 바탕으로 '일반'과 '상세'를 나란히 비교해 볼게요. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/029/029_1_card.png\n\n왜 바뀌나요?\n\n행정안전부는 지금까지 등·초본에 불필요한 가족관계가 그대로 드러나 재혼 가정 등의 사생활이 노출되는 문제가 있었다며, 이를 막기 위해 세대주와의 관계 표기 방식을 고친다고 밝혔어요.\n\n일반 vs 상세, 나란히 비교\n\n• 세대주 본인·배우자 — 일반(새 방식): 본인, 배우자 / 상세(기존 방식): 본인, 배우자\n• 배우자 외 민법상 가족(자녀·부모 등) — 일반(새 방식): '세대원'으로 통일 / 상세(기존 방식): 자녀, 배우자의 자녀 등 구체적 관계\n• 가족이 아닌 사람(예: 함께 사는 친척 중 가족 범위 밖) — 일반(새 방식): '동거인' / 상세(기존 방식): 삼촌 등 구체적 관계\n• 신청 시 추가 기재 — 일반(새 방식): 없음 / 상세(기존 방식): '용도 및 목적' 작성 필수\n• 언제 쓰나 — 일반(새 방식): 제출처가 따로 요구하지 않을 때 / 상세(기존 방식): 제출처가 구체적 관계를 요구할 때\n\n행정안전부 안내 예시를 보면, 세대주의 자녀는 '자녀' 대신 '세대원'으로, 배우자의 자녀도 똑같이 '세대원'으로 표시돼요. 그래서 일반 등본만 봐서는 누가 누구의 자녀인지 드러나지 않아요. 가족 범위에 들지 않는 동거 친척은 '동거인'으로 묶여요.\n\n참고로 이번 변경은 '세대주와의 관계' 칸을 어떻게 적느냐에 관한 것이에요. 세대주 본인과 배우자는 일반·상세 어느 쪽을 골라도 지금처럼 '본인', '배우자'로 나와요.\n\n정책브리핑은 기재 순서도 세대주와 배우자의 직계존비속을 같은 순위로 적는 방식으로 바뀐다고 소개했어요.\n\n어떤 것을 떼야 할까?\n\n행정안전부가 강조한 원칙은 두 가지예요.\n\n1. 제출하는 기관이 따로 요구하지 않으면 '일반'으로 발급하기\n2. 발급 전에 제출처에 어떤 서식이 필요한지 미리 확인하기\n\n가족 관계를 증명해야 하는 서류 심사처럼 제출처가 구체적 관계를 보려는 경우에는 '상세'가 필요할 수 있어요. 이때는 신청할 때 용도와 목적을 꼭 적어야 해요. 미리 묻지 않고 일반으로 떼어 갔다가 다시 발급받는 일이 없도록, 제출처 안내문이나 담당자에게 한 번 확인하는 게 가장 확실해요.\n\n10월 29일 전후로 달라지는 점 정리\n\n- 10월 28일까지: 등·초본에 자녀, 배우자의 자녀, 삼촌처럼 구체적 관계가 표기돼요.\n- 10월 29일부터: 신청할 때 '일반' 또는 '상세'를 고르고, 일반은 세대원·동거인으로 표기돼요.\n- 이미 발급받아 둔 등본을 써도 되는지는 제출처의 기준(발급일 제한 등)에 따라 달라요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/029/029_2_card.png\n\n한눈에 정리\n\n- 10월 29일부터 세대주와의 관계 표기 개선(사생활 보호 목적)\n- 일반: 배우자 외 가족은 '세대원', 그 밖은 '동거인'\n- 상세: 기존처럼 구체적 관계, 용도·목적 기재 필수\n- 제출처에 필요한 서식을 먼저 확인\n\n발급 화면과 선택 방법은 시행 후 기관별로 다르게 보일 수 있으니, 발급 전 정부24나 주민센터 안내를 다시 확인해 주세요.", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/029/029_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/029/029_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "029_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/029/029_1_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/029/029_1_card.png", "cap": "", "alt": "등·초본 일반 vs 상세", "name": "029_1_card.png", "w": 1080, "h": 1225}, {"n": 2, "label": "사진 2", "uri": "img/029/029_2_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/029/029_2_card.png", "cap": "", "alt": "등·초본 표기 변경 한눈에 정리", "name": "029_2_card.png", "w": 1080, "h": 878}], "zip": "img/029/029_images.zip", "html": "<figure class=\"ph thumbfig\" data-n=\"0\"><img src=\"img/029/029_0_thumb.png\" alt=\"대표 이미지\"><\/figure>\n<p>회사나 학교에 등본을 낼 때, 가족 관계가 하나하나 다 적혀 나와서 신경 쓰였던 적 있으신가요? 2026년 10월 29일부터 주민등록표 등본·초본의 '세대주와의 관계' 칸이 달라져요. 그렇다고 예전 방식이 사라지는 건 아니에요. 행정안전부 안내를 바탕으로 '일반'과 '상세'를 나란히 비교해 볼게요. (2026년 10월 5일 기준)<\/p>\n<figure class=\"ph\" data-n=\"1\"><img loading=\"lazy\" src=\"img/029/029_1_card.png\" alt=\"등·초본 일반 vs 상세\"><\/figure>\n<h3>왜 바뀌나요?<\/h3>\n<p>행정안전부는 지금까지 등·초본에 불필요한 가족관계가 그대로 드러나 재혼 가정 등의 사생활이 노출되는 문제가 있었다며, 이를 막기 위해 세대주와의 관계 표기 방식을 고친다고 밝혔어요.<\/p>\n<h3>일반 vs 상세, 나란히 비교<\/h3>\n<div class=\"tw\"><table><thead><tr><th>구분<\/th><th>일반(새 방식)<\/th><th>상세(기존 방식)<\/th><\/tr><\/thead><tbody><tr><td>세대주 본인·배우자<\/td><td>본인, 배우자<\/td><td>본인, 배우자<\/td><\/tr><tr><td>배우자 외 민법상 가족(자녀·부모 등)<\/td><td>'세대원'으로 통일<\/td><td>자녀, 배우자의 자녀 등 구체적 관계<\/td><\/tr><tr><td>가족이 아닌 사람(예: 함께 사는 친척 중 가족 범위 밖)<\/td><td>'동거인'<\/td><td>삼촌 등 구체적 관계<\/td><\/tr><tr><td>신청 시 추가 기재<\/td><td>없음<\/td><td>'용도 및 목적' 작성 필수<\/td><\/tr><tr><td>언제 쓰나<\/td><td>제출처가 따로 요구하지 않을 때<\/td><td>제출처가 구체적 관계를 요구할 때<\/td><\/tr><\/tbody><\/table><\/div>\n<p>행정안전부 안내 예시를 보면, 세대주의 자녀는 '자녀' 대신 '세대원'으로, 배우자의 자녀도 똑같이 '세대원'으로 표시돼요. 그래서 일반 등본만 봐서는 누가 누구의 자녀인지 드러나지 않아요. 가족 범위에 들지 않는 동거 친척은 '동거인'으로 묶여요.<\/p>\n<p>참고로 이번 변경은 '세대주와의 관계' 칸을 어떻게 적느냐에 관한 것이에요. 세대주 본인과 배우자는 일반·상세 어느 쪽을 골라도 지금처럼 '본인', '배우자'로 나와요.<\/p>\n<p>정책브리핑은 기재 순서도 세대주와 배우자의 직계존비속을 같은 순위로 적는 방식으로 바뀐다고 소개했어요.<\/p>\n<h3>어떤 것을 떼야 할까?<\/h3>\n<p>행정안전부가 강조한 원칙은 두 가지예요.<\/p>\n<ol><li>제출하는 기관이 따로 요구하지 않으면 '일반'으로 발급하기<\/li><li>발급 전에 제출처에 어떤 서식이 필요한지 미리 확인하기<\/li><\/ol>\n<p>가족 관계를 증명해야 하는 서류 심사처럼 제출처가 구체적 관계를 보려는 경우에는 '상세'가 필요할 수 있어요. 이때는 신청할 때 용도와 목적을 꼭 적어야 해요. 미리 묻지 않고 일반으로 떼어 갔다가 다시 발급받는 일이 없도록, 제출처 안내문이나 담당자에게 한 번 확인하는 게 가장 확실해요.<\/p>\n<h3>10월 29일 전후로 달라지는 점 정리<\/h3>\n<ul><li>10월 28일까지: 등·초본에 자녀, 배우자의 자녀, 삼촌처럼 구체적 관계가 표기돼요.<\/li><li>10월 29일부터: 신청할 때 '일반' 또는 '상세'를 고르고, 일반은 세대원·동거인으로 표기돼요.<\/li><li>이미 발급받아 둔 등본을 써도 되는지는 제출처의 기준(발급일 제한 등)에 따라 달라요.<\/li><\/ul>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/029/029_2_card.png\" alt=\"등·초본 표기 변경 한눈에 정리\"><\/figure>\n<h3>한눈에 정리<\/h3>\n<ul><li>10월 29일부터 세대주와의 관계 표기 개선(사생활 보호 목적)<\/li><li>일반: 배우자 외 가족은 '세대원', 그 밖은 '동거인'<\/li><li>상세: 기존처럼 구체적 관계, 용도·목적 기재 필수<\/li><li>제출처에 필요한 서식을 먼저 확인<\/li><\/ul>\n<p>발급 화면과 선택 방법은 시행 후 기관별로 다르게 보일 수 있으니, 발급 전 정부24나 주민센터 안내를 다시 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 자체 제작 카드 · 사진 2 자체 제작 카드 — 파일 images/posts/029/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>비교 표 아래<\/td><td>직접 만든 가상 예시 표(가짜 이름으로 '자녀 → 세대원' 변화)<\/td><td>실제 등본·초본 사진은 주민등록번호 등 개인정보라 절대 사용 금지<\/td><\/tr><tr><td>도입부<\/td><td>행정안전부 카드뉴스는 정책브리핑 이용조건상 그대로 쓰지 말고 원문 링크만 안내<\/td><td>카드 이미지 캡처 금지<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 시행일 10월 29일, '일반·상세' 선택, 상세 선택 시 '용도 및 목적' 필수 문구를 행정안전부 카드뉴스 원문과 대조<\/li><li class=\"cb\">☐ '동거인' 예시(가족 범위 밖 친척)가 행정안전부 예시(삼촌 → 동거인)와 같은 의미로 읽히는지 확인<\/li><li class=\"cb\">☐ 기재 순서 변경 문장(직계존비속 같은 순위)이 정책브리핑 10월 제도 안내와 같은지 확인<\/li><li class=\"cb\">☐ 정부24 발급 화면에서 '일반/상세' 선택 위치는 시행 후 직접 확인한 경우에만 화면 설명 추가<\/li><li class=\"cb\">☐ 본인·가족 실제 등본 이미지는 올리지 않기<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>10월 29일 시행, 사생활 노출 방지 목적, 세대원·동거인 표기, 일반·상세 선택, 상세 시 용도·목적 필수, 제출기관 확인·일반 발급 원칙, 표기 예시<\/td><td>행정안전부 카드뉴스(정책브리핑 2026-08-19) <a href=\"https://www.korea.kr/multi/visualNewsView.do?newsId=148970247\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/multi/visualNewsView.do?newsId=148970247<\/a><\/td><td>공식<\/td><\/tr><tr><td>10월 29일부터 세대원·동거인 통일 표기, 세대주와 배우자의 직계존비속 같은 순위 기재<\/td><td>정책브리핑 '10월부터 달라지는 제도'(2026-10-01) <a href=\"https://www.korea.kr/news/policyFocusView.do?newsId=148972822&amp;pkgId=49500843\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyFocusView.do?newsId=148972822&amp;pkgId=49500843<\/a><\/td><td>공식<\/td><\/tr><tr><td>등·초본 서식 근거(주민등록법 시행규칙)<\/td><td>국가법령정보센터 주민등록법 시행규칙 제·개정이유 <a href=\"https://www.law.go.kr/LSW/lsRvsRsnListP.do?chrClsCd=010202&amp;lsId=008230&amp;lsRvsGubun=all\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.law.go.kr/LSW/lsRvsRsnListP.do?chrClsCd=010202&amp;lsId=008230&amp;lsRvsGubun=all<\/a> (검색 요약 확인, 원문 미열람)<\/td><td>공식(검색 요약)<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "회사나 학교에 등본을 낼 때, 가족 관계가 하나하나 다 적혀 나와서 신경 쓰였던 적 있으신가요? 2026년 10월 29일부터 주민등록표 등본·초본의 '세대주와의 관계' 칸이 달라져요. 그렇다고 예전 방식이 사라지는 건 아니에요. 행정안전부 안내를 바탕으로 '일반'과 '상세'를 나란히 비교해 볼게요. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/029/029_1_card.png\n\n왜 바뀌나요?\n\n행정안전부는 지금까지 등·초본에 불필요한 가족관계가 그대로 드러나 재혼 가정 등의 사생활이 노출되는 문제가 있었다며, 이를 막기 위해 세대주와의 관계 표기 방식을 고친다고 밝혔어요.\n\n일반 vs 상세, 나란히 비교\n\n• 세대주 본인·배우자 — 일반(새 방식): 본인, 배우자 / 상세(기존 방식): 본인, 배우자\n• 배우자 외 민법상 가족(자녀·부모 등) — 일반(새 방식): '세대원'으로 통일 / 상세(기존 방식): 자녀, 배우자의 자녀 등 구체적 관계\n• 가족이 아닌 사람(예: 함께 사는 친척 중 가족 범위 밖) — 일반(새 방식): '동거인' / 상세(기존 방식): 삼촌 등 구체적 관계\n• 신청 시 추가 기재 — 일반(새 방식): 없음 / 상세(기존 방식): '용도 및 목적' 작성 필수\n• 언제 쓰나 — 일반(새 방식): 제출처가 따로 요구하지 않을 때 / 상세(기존 방식): 제출처가 구체적 관계를 요구할 때\n\n행정안전부 안내 예시를 보면, 세대주의 자녀는 '자녀' 대신 '세대원'으로, 배우자의 자녀도 똑같이 '세대원'으로 표시돼요. 그래서 일반 등본만 봐서는 누가 누구의 자녀인지 드러나지 않아요. 가족 범위에 들지 않는 동거 친척은 '동거인'으로 묶여요.\n\n참고로 이번 변경은 '세대주와의 관계' 칸을 어떻게 적느냐에 관한 것이에요. 세대주 본인과 배우자는 일반·상세 어느 쪽을 골라도 지금처럼 '본인', '배우자'로 나와요.\n\n정책브리핑은 기재 순서도 세대주와 배우자의 직계존비속을 같은 순위로 적는 방식으로 바뀐다고 소개했어요.\n\n어떤 것을 떼야 할까?\n\n행정안전부가 강조한 원칙은 두 가지예요.\n\n1. 제출하는 기관이 따로 요구하지 않으면 '일반'으로 발급하기\n2. 발급 전에 제출처에 어떤 서식이 필요한지 미리 확인하기\n\n가족 관계를 증명해야 하는 서류 심사처럼 제출처가 구체적 관계를 보려는 경우에는 '상세'가 필요할 수 있어요. 이때는 신청할 때 용도와 목적을 꼭 적어야 해요. 미리 묻지 않고 일반으로 떼어 갔다가 다시 발급받는 일이 없도록, 제출처 안내문이나 담당자에게 한 번 확인하는 게 가장 확실해요.\n\n10월 29일 전후로 달라지는 점 정리\n\n- 10월 28일까지: 등·초본에 자녀, 배우자의 자녀, 삼촌처럼 구체적 관계가 표기돼요.\n- 10월 29일부터: 신청할 때 '일반' 또는 '상세'를 고르고, 일반은 세대원·동거인으로 표기돼요.\n- 이미 발급받아 둔 등본을 써도 되는지는 제출처의 기준(발급일 제한 등)에 따라 달라요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/029/029_2_card.png\n\n한눈에 정리\n\n- 10월 29일부터 세대주와의 관계 표기 개선(사생활 보호 목적)\n- 일반: 배우자 외 가족은 '세대원', 그 밖은 '동거인'\n- 상세: 기존처럼 구체적 관계, 용도·목적 기재 필수\n- 제출처에 필요한 서식을 먼저 확인\n\n발급 화면과 선택 방법은 시행 후 기관별로 다르게 보일 수 있으니, 발급 전 정부24나 주민센터 안내를 다시 확인해 주세요.", "copyAll": "회사나 학교에 등본을 낼 때, 가족 관계가 하나하나 다 적혀 나와서 신경 쓰였던 적 있으신가요? 2026년 10월 29일부터 주민등록표 등본·초본의 '세대주와의 관계' 칸  29일부터 주민등록표 등본·초본의 '세대주와의 관계' 칸이 달라져요. 그렇다고 예전 방식이 사라지는 건 아니에요. 행정안전부 안내를 바탕으로 '일반'과 '상세'를 나란히 비교해 볼게요. (2026년 10월 5일 기준) [사진 1] https://senti-1000ma.github.io/blog-drafts/img/029/029_1_card.png 왜 바뀌나요? 행정안전부는 지금까지 등·초본에 불필요한 가족관계가 그대로 드러나 재혼 가정 등의 사생활이 노출되는 문제가 있었다며, 이를 막기 위해 세대주와의 관계 표기 방식을 고친다고 밝혔어요. 일반 vs 상세, 나란히 비교 • 세대주 본인·배우자 — 일반(새 방식): 본인, 배우자 / 상세(기존 방식): 본인, 배우자 • 배우자 외 민법상 가족(자녀·부모 등) — 일반(새 방식): '세대원'으로 통일 / 상세(기존 방식): 자녀, 배우자의 자녀 등 구체적 관계 • 가족이 아닌 사람(예: 함께 사는 친척 중 가족 범위 밖) — 일반(새 방식): '동거인' / 상세(기존 방식): 삼촌 등 구체적 관계 • 신청 시 추가 기재 — 일반(새 방식): 없음 / 상세(기존 방식): '용도 및 목적' 작성 필수 • 언제 쓰나 — 일반(새 방식): 제출처가 따로 요구하지 않을 때 / 상세(기존 방식): 제출처가 구체적 관계를 요구할 때 행정안전부 안내 예시를 보면, 세대주의 자녀는 '자녀' 대신 '세대원'으로, 배우자의 자녀도 똑같이 '세대원'으로 표시돼요. 그래서 일반 등본만 봐서는 누가 누구의 자녀인지 드러나지 않아요. 가족 범위에 들지 않는 동거 친척은 '동거인'으로 묶여요. 참고로 이번 변경은 '세대주와의 관계' 칸을 어떻게 적느냐에 관한 것이에요. 세대주 본인과 배우자는 일반·상세 어느 쪽을 골라도 지금처럼 '본인', '배우자'로 나와요. 정책브리핑은 기재 순서도 세대주와 배우자의 직계존비속을 같은 순위로 적는 방식으로 바뀐다고 소개했어요. 어떤 것을 떼야 할까? 행정안전부가 강조한 원칙은 두 가지예요. 1. 제출하는 기관이 따로 요구하지 않으면 '일반'으로 발급하기 2. 발급 전에 제출처에 어떤 서식이 필요한지 미리 확인하기 가족 관계를 증명해야 하는 서류 심사처럼 제출처가 구체적 관계를 보려는 경우에는 '상세'가 필요할 수 있어요. 이때는 신청할 때 용도와 목적을 꼭 적어야 해요. 미리 묻지 않고 일반으로 떼어 갔다가 다시 발급받는 일이 없도록, 제출처 안내문이나 담당자에게 한 번 확인하는 게 가장 확실해요. 10월 29일 전후로 달라지는 점 정리 - 10월 28일까지: 등·초본에 자녀, 배우자의 자녀, 삼촌처럼 구체적 관계가 표기돼요. - 10월 29일부터: 신청할 때 '일반' 또는 '상세'를 고르고, 일반은 세대원·동거인으로 표기돼요. - 이미 발급받아 둔 등본을 써도 되는지는 제출처의 기준(발급일 제한 등)에 따라 달라요. [사진 2] https://senti-1000ma.github.io/blog-drafts/img/029/029_2_card.png 한눈에 정리 - 10월 29일부터 세대주와의 관계 표기 개선(사생활 보호 목적) - 일반: 배우자 외 가족은 '세대원', 그 밖은 '동거인' - 상세: 기존처럼 구체적 관계, 용도·목적 기재 필수 - 제출처에 필요한 서식을 먼저 확인 발급 화면과 선택 방법은 시행 후 기관별로 다르게 보일 수 있으니, 발급 전 정부24나 주민센터 안내를 다시 확인해 주세요. 네이버"}, {"id": "028", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "028_wage-arrears-penalty-complaint.md", "title": "월급이 밀렸을 때 대처법: 10월 8일부터 임금체불 처벌 '5년 이하 징역'으로, 진정부터 간이대지급금까지", "cands": ["월급이 밀렸을 때 대처법: 10월 8일부터 임금체불 처벌 '5년 이하 징역'으로, 진정부터 간이대지급금까지", "임금체불 처벌 3년 → 5년, 10월 8일 시행! 체불임금 받는 순서 4단계 (2026년)", "노동포털 임금체불 진정 넣는 법과 간이대지급금 청구 기한 6개월 정리"], "cat": "고용·노동", "kw": ["임금체불", "체불임금 진정", "간이대지급금", "근로기준법 개정", "노동포털"], "summary": "10월 8일 시행되는 임금체불 법정형 상향(5년 이하 징역·5천만 원 이하 벌금)과, 체불 시 노동포털 진정→근로감독관 조사→간이대지급금 청구로 이어지는 순서를 고용노동부·찾기쉬운 생활법령 기준으로 정리", "status": "초안", "created": "2026-10-05 14:03", "base": "2026-10-05", "need": 0, "chars": 1829, "chars_ns": 1403, "imgs": 3, "slots": 2, "filled": 2, "thumb": "img/028/028_0_thumb.png", "seHtml": "<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/028/028_0_thumb.png\" alt=\"대표 이미지\" width=\"720\"><\/p>\n<p>\"임금체불은 3년 이하 징역이나 3천만 원 이하 벌금\"이라는 설명, 아직 여기저기서 보이죠. 2026년 10월 8일부터는 이 기준이 달라져요. 개정 근로기준법이 시행되면서 임금체불 사업주의 법정형이 '5년 이하 징역 또는 5천만 원 이하 벌금'으로 올라가요. 10월 5일 기준으로 고용노동부 노동포털의 처리 절차 안내에는 아직 이전 기준(3년·3천만 원)이 적혀 있으니 헷갈리지 마세요. 바뀌는 점과 함께, 실제로 월급이 밀렸을 때 밟는 순서를 단계별로 정리했어요. (2026년 10월 5일 기준)<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/028/028_1_card.png\" alt=\"임금체불 처벌, 무엇이 달라지나\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>무엇이 달라지나요?<\/b><\/span><\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>구분<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>이전<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>개정 후<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>시행일<\/b><\/td><\/tr><tr><td>임금체불 법정형<\/td><td>3년 이하 징역 또는 3천만 원 이하 벌금<\/td><td>5년 이하 징역 또는 5천만 원 이하 벌금<\/td><td>2026년 10월 8일<\/td><\/tr><tr><td>퇴직급여 체불 법정형<\/td><td>3년 이하 징역 또는 3천만 원 이하 벌금<\/td><td>5년 이하 징역 또는 5천만 원 이하 벌금<\/td><td>2026년 9월 18일<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p>고용노동부는 처벌 수위를 높여 사업주가 스스로 임금을 지급하도록 유도하고 체불을 미리 막으려는 조치라고 설명했어요. 다만 처벌이 강해졌다고 밀린 돈이 자동으로 들어오는 것은 아니에요. 돈을 받으려면 아래 절차를 직접 진행해야 해요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>1단계: 체불 사실을 보여줄 자료 모으기<\/b><\/span><\/p>\n<p>근로계약서, 급여 입금 내역, 근무한 날짜와 시간을 알 수 있는 기록처럼 일한 사실과 못 받은 금액을 보여줄 자료를 정리해 두세요. 자료가 있으면 진정서 작성과 이후 조사가 수월해져요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>2단계: 노동포털에서 진정 넣기<\/b><\/span><\/p>\n<p>노동포털에서 '민원신청·조회 → 민원신청 → 근로기준 분야 민원신청 → 진정서(임금체불, 기타 근로기준 분야)' 순서로 온라인 진정을 낼 수 있어요. 사업장 소재지를 관할하는 고용노동관서 고객지원실을 방문해 상담 후 진정이나 고소를 할 수도 있어요. 만 15~34세라면 '청소년 근로권익센터'를 통해 공인노무사의 상담·진정 대리 지원을 받을 수 있다고 안내돼 있어요.<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/028/028_2_capture.png\" alt=\"&#x27;민원제도 안내 &gt; 체불임금 해결 방법&#x27;의 진정 제기·처리절차 (2026-10-05 확인)\" width=\"720\"><\/p><p style=\"text-align:center\"><span style=\"font-size:13px;color:#888888\">출처: 고용노동부 노동포털 홈페이지<\/span><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>3단계: 근로감독관 조사와 시정지시<\/b><\/span><\/p>\n<ul><li>근로감독관이 진정인과 사업주에게 출석을 요구해 조사해요.<\/li><li>처리기간은 토요일·공휴일을 빼고 25일이며, 두 차례 연장될 수 있어요(1차는 감독관 직권, 2차는 진정인 동의).<\/li><li>진정인이 두 번 이상 출석하지 않으면 사건이 끝날 수 있어요(나중에 다시 진정은 가능).<\/li><li>법 위반이 확인되면 사업주에게 시정지시가 나가고, 따르지 않으면 형사입건 후 검찰로 송치돼요.<\/li><\/ul>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>4단계: 간이대지급금 청구 기한 챙기기<\/b><\/span><\/p>\n<p>사업주가 끝내 주지 않으면 국가가 대신 지급하는 '간이대지급금'을 근로복지공단에 청구할 수 있어요.<\/p>\n<ul><li>퇴직자: 퇴직일 다음 날부터 1년 안에 진정 등을 제기해야 하고, 최대 1,000만 원(임금 등 700만 원, 퇴직급여 등 700만 원 한도)이에요.<\/li><li>재직자: 시급이 최저임금의 110% 미만인 경우 대상이 되며, 상한은 700만 원이에요.<\/li><li>기한: 체불 임금등·사업주 확인서가 처음 발급된 날부터 6개월 안에 청구해야 해요. 이 기간을 넘기면 받을 수 없으니 꼭 달력에 적어 두세요.<\/li><\/ul>\n<p>회사가 도산한 경우에는 '도산대지급금'이 따로 있고, 2026년 8월 20일부터 임금 지원 범위가 최종 3개월분에서 최종 6개월분으로 넓어졌어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>10월 8일부터 임금체불 법정형 5년 이하 징역·5천만 원 이하 벌금<\/li><li>순서: 자료 정리 → 노동포털 진정 → 감독관 조사 → 간이대지급금 청구<\/li><li>간이대지급금은 확인서 발급일부터 6개월 안에 청구<\/li><\/ul>\n<p>개별 사건은 사정에 따라 결과가 다를 수 있으니 고용노동부 고객상담센터(1350)나 근로복지공단(1588-0075)에 먼저 문의해 보세요.<\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/028/028_0_thumb.png\n\n\"임금체불은 3년 이하 징역이나 3천만 원 이하 벌금\"이라는 설명, 아직 여기저기서 보이죠. 2026년 10월 8일부터는 이 기준이 달라 로 온라인 진정을 낼 수 있어요. 사업장 소재지를 관할하는 고용노동관서 고객지원실을 방문해 상담 후 진정이나 고소를 할 수도 있어요. 만 15~34세라면 '청소년 근로권익센터'를 통해 공인노무사의 상담·진정 대리 지원을 받을 수 있다고 안내돼 있어요.<\/p>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/028/028_2_capture.png\" alt=\"&#x27;민원제도 안내 &gt; 체불임금 해결 방법&#x27;의 진정 제기·처리절차 (2026-10-05 확인)\"><figcaption>출처: 고용노동부 노동포털 홈페이지<\/figcaption><\/figure>\n<h3>3단계: 근로감독관 조사와 시정지시<\/h3>\n<ul><li>근로감독관이 진정인과 사업주에게 출석을 요구해 조사해요.<\/li><li>처리기간은 토요일·공휴일을 빼고 25일이며, 두 차례 연장될 수 있어요(1차는 감독관 직권, 2차는 진정인 동의).<\/li><li>진정인이 두 번 이상 출석하지 않으면 사건이 끝날 수 있어요(나중에 다시 진정은 가능).<\/li><li>법 위반이 확인되면 사업주에게 시정지시가 나가고, 따르지 않으면 형사입건 후 검찰로 송치돼요.<\/li><\/ul>\n<h3>4단계: 간이대지급금 청구 기한 챙기기<\/h3>\n<p>사업주가 끝내 주지 않으면 국가가 대신 지급하는 '간이대지급금'을 근로복지공단에 청구할 수 있어요.<\/p>\n<ul><li>퇴직자: 퇴직일 다음 날부터 1년 안에 진정 등을 제기해야 하고, 최대 1,000만 원(임금 등 700만 원, 퇴직급여 등 700만 원 한도)이에요.<\/li><li>재직자: 시급이 최저임금의 110% 미만인 경우 대상이 되며, 상한은 700만 원이에요.<\/li><li>기한: 체불 임금등·사업주 확인서가 처음 발급된 날부터 6개월 안에 청구해야 해요. 이 기간을 넘기면 받을 수 없으니 꼭 달력에 적어 두세요.<\/li><\/ul>\n<p>회사가 도산한 경우에는 '도산대지급금'이 따로 있고, 2026년 8월 20일부터 임금 지원 범위가 최종 3개월분에서 최종 6개월분으로 넓어졌어요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>10월 8일부터 임금체불 법정형 5년 이하 징역·5천만 원 이하 벌금<\/li><li>순서: 자료 정리 → 노동포털 진정 → 감독관 조사 → 간이대지급금 청구<\/li><li>간이대지급금은 확인서 발급일부터 6개월 안에 청구<\/li><\/ul>\n<p>개별 사건은 사정에 따라 결과가 다를 수 있으니 고용노동부 고객상담센터(1350)나 근로복지공단(1588-0075)에 먼저 문의해 보세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 자체 제작 카드 · 사진 2 공식 화면 캡처 — 파일 images/posts/028/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래<\/td><td>직접 만든 '3년·3천만 원 → 5년·5천만 원' 비교 카드<\/td><td>언론사 AI 생성 이미지·사진은 쓰지 않기<\/td><\/tr><tr><td>2단계 아래<\/td><td>노동포털 첫 화면(로그인 전) 직접 캡처<\/td><td>진정서 작성 화면·급여명세서·근로계약서 사진은 개인정보라 캡처 금지<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 임금체불 법정형 시행일 10월 8일, 퇴직급여 체불 9월 18일을 고용노동부 하반기 달라지는 제도 자료와 다시 대조<\/li><li class=\"cb\">☐ able><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "<ul><li>사진 2: 고용노동부 노동포털 홈페이지 공개 화면 캡처(2026-10-05 확인, 로그인 전 화면) <a href=\"https://labor.moel.go.kr/minwonSysInfo/wagesolway.do\" target=\"_blank\" rel=\"noopener noreferrer\">https://labor.moel.go.kr/minwonSysInfo/wagesolway.do<\/a><\/li><\/ul>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "\"임금체불은 3년 이하 징역이나 3천만 원 이하 벌금\"이라는 설명, 아직 여기저기서 보이죠. 2026년 10월 8일부터는 이 기준이 달라져요. 개정 근로기준법이 시행되면서 임금체불 사업주의 법정형이 '5년 이하 징역 또는 5천만 원 이하 벌금'으로 올라가요. 10월 5일 기준으로 고용노동부 노동포털의 처리 절차 안내에는 아직 이전 기준(3년·3천만 원)이 적혀 있으니 헷갈리지 마세요. 바뀌는 점과 함께, 실제로 월급이 밀렸을 때 밟는 순서를 단계별로 정리했어요. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/028/028_1_card.png\n\n무엇이 달라지나요?\n\n• 임금체불 법정형 — 이전: 3년 이하 징역 또는 3천만 원 이하 벌금 / 개정 후: 5년 이하 징역 또는 5천만 원 이하 벌금 / 시행일: 2026년 10월 8일\n• 퇴직급여 체불 법정형 — 이전: 3년 이하 징역 또는 3천만 원 이하 벌금 / 개정 후: 5년 이하 징역 또는 5천만 원 이하 벌금 / 시행일: 2026년 9월 18일\n\n고용노동부는 처벌 수위를 높여 사업주가 스스로 임금을 지급하도록 유도하고 체불을 미리 막으려는 조치라고 설명했어요. 다만 처벌이 강해졌다고 밀린 돈이 자동으로 들어오는 것은 아니에요. 돈을 받으려면 아래 절차를 직접 진행해야 해요.\n\n1단계: 체불 사실을 보여줄 자료 모으기\n\n근로계약서, 급여 입금 내역, 근무한 날짜와 시간을 알 수 있는 기록처럼 일한 사실과 못 받은 금액을 보여줄 자료를 정리해 두세요. 자료가 있으면 진정서 작성과 이후 조사가 수월해져요.\n\n2단계: 노동포털에서 진정 넣기\n\n노동포털에서 '민원신청·조회 → 민원신청 → 근로기준 분야 민원신청 → 진정서(임금체불, 기타 근로기준 분야)' 순서로 온라인 진정을 낼 수 있어요. 사업장 소재지를 관할하는 고용노동관서 고객지원실을 방문해 상담 후 진정이나 고소를 할 수도 있어요. 만 15~34세라면 '청소년 근로권익센터'를 통해 공인노무사의 상담·진정 대리 지원을 받을 수 있다고 안내돼 있어요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/028/028_2_capture.png\n출처: 고용노동부 노동포털 홈페이지\n\n3단계: 근로감독관 조사와 시정지시\n\n- 근로감독관이 진정인과 사업주에게 출석을 요구해 조사해요.\n- 처리기간은 토요일·공휴일을 빼고 25일이며, 두 차례 연장될 수 있어요(1차는 감독관 직권, 2차는 진정인 동의).\n- 진정인이 두 번 이상 출석하지 않으면 사건이 끝날 수 있어요(나중에 다시 진정은 가능).\n- 법 위반이 확인되면 사업주에게 시정지시가 나가고, 따르지 않으면 형사입건 후 검찰로 송치돼요.\n\n4단계: 간이대지급금 청구 기한 챙기기\n\n사업주가 끝내 주지 않으면 국가가 대신 지급하는 '간이대지급금'을 근로복지공단에 청구할 수 있어요.\n\n- 퇴직자: 퇴직일 다음 날부터 1년 안에 진정 등을 제기해야 하고, 최대 1,000만 원(임금 등 700만 원, 퇴직급여 등 700만 원 한도)이에요.\n- 재직자: 시급이 최저임금의 110% 미만인 경우 대상이 되며, 상한은 700만 원이에요.\n- 기한: 체불 임금등·사업주 확인서가 처음 발급된 날부터 6개월 안에 청구해야 해요. 이 기간을 넘기면 받을 수 없으니 꼭 달력에 적어 두세요.\n\n회사가 도산한 경우에는 '도산대지급금'이 따로 있고, 2026년 8월 20일부터 임금 지원 범위가 최종 3개월분에서 최종 6개월분으로 넓어졌어요.\n\n한눈에 정리\n\n- 10월 8일부터 임금체불 법정형 5년 이하 징역·5천만 원 이하 벌금\n- 순서: 자료 정리 → 노동포털 진정 → 감독관 조사 → 간이대지급금 청구\n- 간이대지급금은 확인서 발급일부터 6개월 안에 청구\n\n개별 사건은 사정에 따라 결과가 다를 수 있으니 고용노동부 고객상담센터(1350)나 근로복지공단(1588-0075)에 먼저 문의해 보세요.", "copyAll": "\"임금체불은 3년 이하 징역이나 3천만 원 이하 벌금\"이라는 설명, 아직 여기저기서 보이죠. 2026년 10월 8일부터는 이 기준이 달라져요. 개정 근로기준법이 시행되면서 임금체불 사업주의 법정형이 '5년 이하 징역 또는 5천만 원 이하 벌금'으로 올라가요. 10월 5일 기준으로 고용노동부 노동포털의 처리 절차 안내에는 아직 이전 기준(3년·3천만 원)이 적혀 있으니 헷갈리지 마세요. 바뀌는 점과 함께, 실제로 월급이 밀렸을 때 밟는 순서를 단계별로 정리했어요. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/028/028_1_card.png\n\n무엇이 달라지나요?\n\n• 임금체불 법정형 — 이전: 3년 이하 징역 또는 3천만 원 이하 벌금 / 개정 후: 5년 이하 징역 또는 5천만 원 이하 벌금 / 시행일: 2026년 10월 8일\n• 퇴직급여 체불 법정형 — 이전: 3년 이하 징역 또는 3천만 원 이하 벌금 / 개정 후: 5년 이하 징역 또는 5천만 원 이하 벌금 / 시행일: 2026년 9월 18일\n\n고용노동부는 처벌 수위를 높여 사업주가 스스로 임금을 지급하도록 유도하고 체불을 미리 막으려는 조치라고 설명했어요. 다만 처벌이 강해졌다고 밀린 돈이 자동으로 들어오는 것은 아니에요. 돈을 받으려면 아래 절차를 직접 진행해야 해요.\n\n1단계: 체불 사실을 보여줄 자료 모으기\n\n근로계약서, 급여 입금 내역, 근무한 날짜와 시간을 알 수 있는 기록처럼 일한 사실과 못 받은 금액을 보여줄 자료를 정리해 두세요. 자료가 있으면 진정서 작성과 이후 조사가 수월해져요.\n\n2단계: 노동포털에서 진정 넣기\n\n노동포털에서 '민원신청·조회 → 민원신청 → 근로기준 분야 민원신청 → 진정서(임금체불, 기타 근로기준 분야)' 순서로 온라인 진정을 낼 수 있어요. 사업장 소재지를 관할하는 고용노동관서 고객지원실을 방문해 상담 후 진정이나 고소를 할 수도 있어요. 만 15~34세라면 '청소년 근로권익센터'를 통해 공인노무사의 상담·진정 대리 지원을 받을 수 있다고 안내돼 있어요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/028/028_2_capture.png\n출처: 고용노동부 노동포털 홈페이지\n\n3단계: 근로감독관 조사와 시정지시\n\n- 근로감독관이 진정인과 사업주에게 출석을 요구해 조사해요.\n- 처리기간은 토요일·공휴일을 빼고 25일이며, 두 차례 연장될 수 있어요(1차는 감독관 직권, 2차는 진정인 동의).\n- 진정인이 두 번 이상 출석하지 않으면 사건이 끝날 수 있어요(나중에 다시 진정은 가능).\n- 법 위반이 확인되면 사업주에게 시정지시가 나가고, 따르지 않으면 형사입건 후 검찰로 송치돼요.\n\n4단계: 간이대지급금 청구 기한 챙기기\n\n사업주가 끝내 주지 않으면 국가가 대신 e=\"font-size:19px\"><b>Q1. 정확히 무엇이 바뀌었나요?<\/b><\/span><\/p>\n<p>국토교통부와 한국철도공사는 10월 1일부터 KTX 등 철도 승차권 예매기간을 기존 '출발 1개월 전'에서 '출발 2개월 전'으로 늘렸어요.<\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>구분<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>9월 30일까지<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>10월 1일부터<\/b><\/td><\/tr><tr><td>예매 가능 시점<\/td><td>열차 출발 1개월 전<\/td><td>열차 출발 2개월 전<\/td><\/tr><tr><td>대상<\/td><td>KTX 등 철도 승차권<\/td><td>KTX 등 철도 승차권<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p>예매가 열리는 정확한 시각이나 하루 단위 계산 방식은 보도자료에 나와 있지 않아요. 원하는 날짜가 있다면 코레일 공지사항에서 오픈 시각을 미리 확인해 두세요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>Q2. 왜 2개월로 늘렸나요?<\/b><\/span><\/p>\n<p>정부는 외국인 관광객이 항공권은 보통 출발 2개월 전쯤 사는데 철도표는 1개월 전부터만 살 수 있어 국내 이동 계획을 세우기 불편했다고 설명했어요. 이제는 항공권을 살 때 기차표도 함께 준비할 수 있다는 거예요. 내국인도 휴가철·성수기처럼 긴 여행을 계획할 때 더 여유 있게 예매할 수 있을 것으로 기대한다고 밝혔어요.<\/p>\n<p>참고로 방한 외국인의 철도 이용은 2026년 8월까지 669만 명으로, 전년 같은 기간보다 68% 늘었다고 해요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>Q3. 요즘 SRT는 어떻게 되나요?<\/b><\/span><\/p>\n<p>국토교통부 10월 1일 발표에 따르면 KTX와 SRT로 나뉘어 있던 고속철도는 9월 1일부터 통합 체제로 운영되고 있어요. 함께 알려진 변화는 다음과 같아요.<\/p>\n<ul><li>고속철도 운임 10% 인하, 수서발 KTX에도 마일리지 도입<\/li><li>'코레일+' 통합 앱 회원이 2,000만 명 수준<\/li><li>고속철도와 일반철도 간 환승할인을 모든 고속열차로 확대<\/li><\/ul>\n<p>통합 후 첫 한 달(9월 1~27일) 고속철도 일평균 이용객은 전년보다 11.9% 늘었다고 발표됐어요.<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/027/027_2_card.png\" alt=\"철도 예매기간 한눈에 정리\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>Q4. 외국인 친구가 예매할 때 달라지는 점도 있나요?<\/b><\/span><\/p>\n<p>지금 외국인용 웹페이지는 영어·중국어·일본어·태국어·베트남어 등 7개 언어를 지원하는데, 연말까지 프랑스어·독일어·몽골어를 더해 10개 언어로 늘릴 계획이에요. 결제수단도 비자·마스터·유니온페이 같은 해외 신용카드 외에 위챗페이·알리페이 등 글로벌 간편결제를 쓸 수 있도록 시스템 개발을 추진 중이라고 해요. 아직 '계획·추진' 단계이니 적용 시점은 공지를 보고 안내해 주세요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>Q5. 명절 승차권도 2개월 전부터인가요?<\/b><\/spa 는 항공권을 살 때 기차표도 함께 준비할 수 있다는 거예요. 내국인도 휴가철·성수기처럼 긴 여행을 계획할 때 더 여유 있게 예매할 수 있을 것으로 기대한다고 밝혔어요.<\/p>\n<p>참고로 방한 외국인의 철도 이용은 2026년 8월까지 669만 명으로, 전년 같은 기간보다 68% 늘었다고 해요.<\/p>\n<h3>Q3. 요즘 SRT는 어떻게 되나요?<\/h3>\n<p>국토교통부 10월 1일 발표에 따르면 KTX와 SRT로 나뉘어 있던 고속철도는 9월 1일부터 통합 체제로 운영되고 있어요. 함께 알려진 변화는 다음과 같아요.<\/p>\n<ul><li>고속철도 운임 10% 인하, 수서발 KTX에도 마일리지 도입<\/li><li>'코레일+' 통합 앱 회원이 2,000만 명 수준<\/li><li>고속철도와 일반철도 간 환승할인을 모든 고속열차로 확대<\/li><\/ul>\n<p>통합 후 첫 한 달(9월 1~27일) 고속철도 일평균 이용객은 전년보다 11.9% 늘었다고 발표됐어요.<\/p>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/027/027_2_card.png\" alt=\"철도 예매기간 한눈에 정리\"><\/figure>\n<h3>Q4. 외국인 친구가 예매할 때 달라지는 점도 있나요?<\/h3>\n<p>지금 외국인용 웹페이지는 영어·중국어·일본어·태국어·베트남어 등 7개 언어를 지원하는데, 연말까지 프랑스어·독일어·몽골어를 더해 10개 언어로 늘릴 계획이에요. 결제수단도 비자·마스터·유니온페이 같은 해외 신용카드 외에 위챗페이·알리페이 등 글로벌 간편결제를 쓸 수 있도록 시스템 개발을 추진 중이라고 해요. 아직 '계획·추진' 단계이니 적용 시점은 공지를 보고 안내해 주세요.<\/p>\n<h3>Q5. 명절 승차권도 2개월 전부터인가요?<\/h3>\n<p>이번 보도자료에는 명절 승차권 예매 일정에 대한 별도 설명이 없어요. 명절 표는 코레일이 그때그때 내는 예매 공지를 기준으로 확인하는 것이 안전해요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>10월 1일부터 철도 승차권 예매는 출발 2개월 전부터<\/li><li>오픈 시각·명절 일정은 코레일 공지로 확인<\/li><li>9월 1일 KTX·SRT 통합, 운임 10% 인하·마일리지·환승할인 확대<\/li><li>외국어 서비스 10개 언어, 글로벌 간편결제는 추진 중<\/li><\/ul>\n<p>운영 세부 사항은 바뀔 수 있으니 예매 전 코레일 공식 안내를 다시 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 자체 제작 카드 · 사진 2 자체 제작 카드 — 파일 images/posts/027/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래<\/td><td>직접 만든 '1개월 전 → 2개월 전' 비교 카드<\/td><td>정책브리핑 속 연합뉴스·뉴스1 사진은 저작권상 사용 금지<\/td><\/tr><tr><td>Q3 아래<\/td><td>역 대합실·열차를 직접 찍은 사진(사람 얼굴이 보이지 않게)<\/td><td>앱 예매 화면을 캡처한다면 결제·회원 정보가 보이지 않게<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 시행일 10월 1일, '1개월 전 → 2개월 전' 문구를 국토교통부 9월 20일 보도자료와 다시 대조<\/li><li class=\"cb\">☐ 외국인 철도 이용 669만 명(8월까지, 68% 증가)과 고속철도 이용객 11.9% 증가(9월 1~27일) 숫자가 원문과 같은지 확인<\/ TX 등 철도 승차권 예매기간을 기존 '출발 1개월 전'에서 '출발 2개월 전'으로 늘렸어요.\n\n• 예매 가능 시점 — 9월 30일까지: 열차 출발 1개월 전 / 10월 1일부터: 열차 출발 2개월 전\n• 대상 — 9월 30일까지: KTX 등 철도 승차권 / 10월 1일부터: KTX 등 철도 승차권\n\n예매가 열리는 정확한 시각이나 하루 단위 계산 방식은 보도자료에 나와 있지 않아요. 원하는 날짜가 있다면 코레일 공지사항에서 오픈 시각을 미리 확인해 두세요.\n\nQ2. 왜 2개월로 늘렸나요?\n\n정부는 외국인 관광객이 항공권은 보통 출발 2개월 전쯤 사는데 철도표는 1개월 전부터만 살 수 있어 국내 이동 계획을 세우기 불편했다고 설명했어요. 이제는 항공권을 살 때 기차표도 함께 준비할 수 있다는 거예요. 내국인도 휴가철·성수기처럼 긴 여행을 계획할 때 더 여유 있게 예매할 수 있을 것으로 기대한다고 밝혔어요.\n\n참고로 방한 외국인의 철도 이용은 2026년 8월까지 669만 명으로, 전년 같은 기간보다 68% 늘었다고 해요.\n\nQ3. 요즘 SRT는 어떻게 되나요?\n\n국토교통부 10월 1일 발표에 따르면 KTX와 SRT로 나뉘어 있던 고속철도는 9월 1일부터 통합 체제로 운영되고 있어요. 함께 알려진 변화는 다음과 같아요.\n\n- 고속철도 운임 10% 인하, 수서발 KTX에도 마일리지 도입\n- '코레일+' 통합 앱 회원이 2,000만 명 수준\n- 고속철도와 일반철도 간 환승할인을 모든 고속열차로 확대\n\n통합 후 첫 한 달(9월 1~27일) 고속철도 일평균 이용객은 전년보다 11.9% 늘었다고 발표됐어요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/027/027_2_card.png\n\nQ4. 외국인 친구가 예매할 때 달라지는 점도 있나요?\n\n지금 외국인용 웹페이지는 영어·중국어·일본어·태국어·베트남어 등 7개 언어를 지원하는데, 연말까지 프랑스어·독일어·몽골어를 더해 10개 언어로 늘릴 계획이에요. 결제수단도 비자·마스터·유니온페이 같은 해외 신용카드 외에 위챗페이·알리페이 등 글로벌 간편결제를 쓸 수 있도록 시스템 개발을 추진 중이라고 해요. 아직 '계획·추진' 단계이니 적용 시점은 공지를 보고 안내해 주세요.\n\nQ5. 명절 승차권도 2개월 전부터인가요?\n\n이번 보도자료에는 명절 승차권 예매 일정에 대한 별도 설명이 없어요. 명절 표는 코레일이 그때그때 내는 예매 공지를 기준으로 확인하는 것이 안전해요.\n\n한눈에 정리\n\n- 10월 1일부터 철도 승차권 예매는 출발 2개월 전부터\n- 오픈 시각·명절 일정은 코레일 공지로 확인\n- 9월 1일 KTX·SRT 통합, 운임 10% 인하·마일리지·환승할인 확대\n- 외국어 서비스 10개 언어, 글로벌 간편결제는 추진 중\n\n운영 세부 사항은 바뀔 수 있으니 예매 전 코레일 공식 안내를 다시 확인해 주세요.", "copyAll": "연말 여행이나 설 연휴 계획을 일찍 세우는 편인데, 기차표만 한 달 전까지 기다려야 해서 답답했던 적 있으셨죠? 2026년 10월 1일부터는 KTX 등 철도 승차권을 출발 2개월 전부터 예매할 수 있게 됐어요. 국토교통부와 한국철도공사 발표를 기준으로 자주 나올 질문을 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/027/027_1_card.png\n\nQ1. 정확히 무엇이 바뀌었나요?\n\n국토교통부와 한국철도공사는 10월 1일부터 KTX 등 철도 승차권 예매기간을 기존 '출발 1개월 전'에서 '출발 2개월 전'으로 늘렸어요.\n\n• 예매 가능 시점 — 9월 30일까지: 열차 출발 1개월 전 / 10월 1일부터: 열차 출발 2개월 전\n• 대상 — 9월 30일까지: KTX 등 철도 승차권 / 10월 1일부터: KTX 등 철도 승차권\n\n예매가 열리는 정확한 시각이나 하루 단위 계산 방식은 보도자료에 나와 있지 않아요. 원하는 날짜가 있 idth=\"720\"><\/p>\n<p>핵심만 먼저 정리하면, 2026년 10월 29일부터 양육비 선지급제의 소득기준이 없어져요. 지금까지는 기준 중위소득 150% 이하 한부모가족만 신청할 수 있었지만, 이제는 소득 수준과 관계없이 나머지 요건만 갖추면 신청할 수 있어요. 성평등가족부가 9월 21일 발표한 내용을 바탕으로 무엇이 바뀌고 무엇이 그대로인지 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/026/026_1_card.png\" alt=\"양육비 선지급제, 무엇이 바뀌나\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>양육비 선지급제는 어떤 제도일까?<\/b><\/span><\/p>\n<p>비양육 부모에게서 양육비를 받지 못하는 한부모가족의 미성년 자녀에게 국가가 양육비를 먼저 주고, 그 돈을 나중에 비양육 부모에게서 돌려받는 제도예요. 아이에게 필요한 돈은 제때 지원하면서, 양육비를 줘야 할 사람의 책임은 그대로 묻는다는 것이 기본 원칙이라고 성평등가족부는 설명해요.<\/p>\n<p>2025년 7월 제도가 시작된 뒤 2026년 8월까지 8,188가구, 미성년 자녀 1만 2,924명에게 231억 원이 지원됐다고 해요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>10월 29일부터 바뀌는 점<\/b><\/span><\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>구분<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>10월 28일까지<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>10월 29일부터<\/b><\/td><\/tr><tr><td>소득기준<\/td><td>기준 중위소득 150% 이하 가구만<\/td><td>소득기준 없음<\/td><\/tr><tr><td>그 밖의 요건<\/td><td>양육비 채권·미지급·이행 절차<\/td><td>그대로 유지<\/td><\/tr><tr><td>지원 금액<\/td><td>자녀 1인당 월 20만 원까지<\/td><td>같음<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p>다만 소득기준 폐지는 법 시행일(10월 29일) 이후 결정되는 10월 선지급 지급분부터 적용된다고 안내돼 있어요. 그동안 소득 때문에 신청을 못 했던 분이라면 시행일 이후 결정 기준으로 적용된다는 점을 기억해 두세요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>그대로 남는 신청 요건 3가지<\/b><\/span><\/p>\n<p>소득 문턱은 사라져도 아래 세 가지는 모두 갖춰야 해요.<\/p>\n<ol><li>양육비 채권을 가지고 있을 것<\/li><li>신청한 달 직전 3개월(또는 3회) 동안 실제로 받은 양육비의 월평균이 선지급금보다 적을 것<\/li><li>양육비를 받기 위한 이행 절차를 진행하고 있을 것<\/li><\/ol>\n<p>어떤 서류가 '양육비 채권'으로 인정되는지, 이행 절차로 무엇이 해당하는지는 개인 상황에 따라 다를 수 있으니 양육비이행관리원 안내를 먼저 확인하는 것이 좋아요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>얼마를, 언제, 어디서?<\/b><\/span><\/p>\n<ul><li>금액: 선지급 대상으로 결정되면 미성년 자녀가 성년이 될 때까지 자녀 1인당 월 20만 원까지 받을 수 있어요.<\/li><li>지급일: 요건 충족 여부 조사를 거친 뒤 통상 매월 25일에 지급돼요. 국가가 먼저 준 돈은 이후 비양육 부모에게서 회수하는 절차가 따로 진행돼요.<\/li><li>신청: 양육비이행관리원 누리집에서 온라인으로 하거나, 신청서를 우편으로 보내면 돼요.<\/li><li>문의: 성평등가족부 가족지원과(02-2100-6342), 양육비이행관리원 선지급운영부(02-3479-5672)<\/li><\/ul>\n<p>성평등가족부는 신청 문턱이 낮아지는 만큼 국세청 등 관계기관과 협력해 먼저 지급한 양육비를 비양육 부모에게서 회수하는 체계도 강화하겠다고 밝혔어요.<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/026/026_2_capture.png\" alt=\"양육비이행관리원 누리집 &#x27;선지급제 안내&#x27;의 지원 절차·신청방법 (2026-10-05 확인)\" width=\"720\"><\/p><p style=\"text-align:center\"><span style=\"font-size:13px;color:#888888\">출처: 양육비이행관리원 누리집<\/span><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>10월 29일부터 중위소득 150% 소득기준 폐지<\/li><li>양육비 채권·월평균 수령액·이행 절차 요건은 그대로<\/li><li>자녀 1인당 월 20만 원까지, 통상 매월 25일 지급<\/li><li>신청은 양육비이행관리원 누리집 또는 우편<\/li><\/ul>\n<p>세부 요건과 제출 서류는 바뀔 수 있으니 신청 전에 양육비이행관리원 공지를 한 번 더 확인해 주세요.<\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/026/026_0_thumb.png\n\n핵심만 먼저 정리하면, 2026년 10월 29일부터 양육비 선지급제의 소득기준이 없어져요. 지금까지는 기준 중위소득 150% 이하 한부모가족만 신청할 수 있었지만, 이제는 소득 수준과 관계없이 나머지 요건만 갖추면 신청할 수 있어요. 성평등가족부가 9월 21일 발표한 내용을 바탕으로 무엇이 바뀌고 무엇이 그대로인지 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/026/026_1_card.png\n\n양육비 선지급제는 어떤 제도일까?\n\n비양육 부모에게서 양육비를 받지 못하는 한부모가족의 미성년 자녀에게 국가가 양육비를 먼저 주고, 그 돈을 나중에 비양육 부모에게서 돌려받는 제도예요. 아이에게 필요한 돈은 제때 지원하면서, 양육비를 줘야 할 사람의 책임은 그대로 묻는다는 것이 기본 원칙이라고 성평등가족부는 설명해요.\n\n2025년 7월 제도가 시작된 뒤 2026년 8월까지 8,188가구, 미성년 자녀 1만 2,924명에게 231억 원이 지원됐다고 해요.\n\n10월 29일부터 바뀌는 점\n\n• 소득기준 — 10월 28일까지: 기준 중위소득 150% 이하 가구만 / 10월 29일부터: 소득기준 없음\n• 그 밖의 요건 — 10월 28일까지: 양육비 채권·미지급·이행 절차 / 10월 29일부터: 그대로 유지\n• 지원 금액 — 10월 28일까지: 자녀 1인당 월 20만 원까지 / 10월 29일부터: 같음\n\n다만 소득기준 폐지는 법 시행일(10월 29일) 이후 결정되는 10월 선지급 지급분부터 적용된다고 안내돼 있어요. 그동안 소득 때문에 신청을 못 했던 분이라면 시행일 이후 결정 기준으로 적용된다는 점을 기억해 두세요.\n\n그대로 남는 신청 요건 3가지\n\n소득 문턱은 사라져도 아래 세 가지는 모두 갖춰야 해요.\n\n1. 양육비 채권을 가지고 있을 것\n2. 신청한 달 직전 3개월(또는 3회) 동안 실제로 받은 양육비의 월평균이 선지급금보다 적을 것\n3. 양육비를 받기 위한 이행 절차를 진행하고 있을 것\n\n어떤 서류가 '양육비 채권'으로 인정되는지, 이행 절차로 무엇이 해당하는지는 개인 상황에 따라 다를 수 있으니 양육비이행관리원 안내를 먼저 확인하는 것이 좋아요.\n\n얼마를, 언제, 어디서?\n\n- 금액: 선지급 대상으로 결정되면 미성년 자녀가 성년이 될 때까지 자녀 1인당 월 20만 원까지 받을 수 있어요.\n- 지급일: 요건 충족 여부 조사를 거친 뒤 통상 매월 25일에 지급돼요. 국가가 먼저 준 돈은 이후 비양육 부모에게서 회수하는 절차가 따로 진행돼요.\n- 신청: 양육비이행관리원 누리집에서 온라인으로 하거나, 신청서를 우편으로 보내면 돼요.\n- 문의: 성평등가족부 가족지원과(02-2100-6342), 양육비이행관리원 선지급운영부(02-3479-5672)\n\n성평등가족부는 신청 문턱이 낮아지는 만큼 국세청 등 관계기관과 협력해 먼저 지급한 양육비를 비양육 부모에게서 회수하는 체계도 강화하겠다고 밝혔어요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/026/026_2_capture.png\n출처: 양육비이행관리원 누리집\n\n한눈에 정리\n\n- 10월 29일부터 중위소득 150% 소득기준 폐지\n- 양육비 채권·월평균 수령액·이행 절차 요건은 그대로\n- 자녀 1인당 월 20만 원까지, 통상 매월 25일 지급\n- 신청은 양육비이행관리원 누리집 또는 우편\n\n세부 요건과 제출 서류는 바뀔 수 있으니 신청 전에 양육비이행관리원 공지를 한 번 더 확인해 주세요.", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/026/026_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/026/026_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "026_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/026/026_1_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/026/026_1_card.png", "cap": "", "alt": "양육비 선지급제, 무엇이 바뀌나", "name": "026_1_card.png", "w": 1080, "h": 831}, {"n": 2, "label": "사진 2", "uri": "img/026/026_2_capture.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/026/026_2_capture.png", "cap": "출처: 양육비이행관리원 누리집", "alt": "양육비이행관리원 누리집 '선지급제 안내'의 지원 절차·신청방법 (2026-10-05 확인)", "name": "026_2_capture.png", "w": 1080, "h": 606}], "zip": "img/026/026_images.zip", "html": "<figure class=\"ph thumbfig\" data-n=\"0\"><img src=\"img/026/026_0_thumb.png\" alt=\"대표 이미지\"><\/figure>\n<p>핵심만 먼저 정리하면, 2026년 10월 29일부터 양육비 선지급제의 소득기준이 없어져요. 지금까지는 기준 중위소득 150% 이하 한부모가족만 신청할 수 있었지만, 이제는 소득 수준과 관계없이 나머지 요건만 갖추면 신청할 수 있어요. 성평등가족부가 9월 21일 발표한 내용을 바탕으로 무엇이 바뀌고 무엇이 그대로인지 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<figure class=\"ph\" data-n=\"1\"><img loading=\"lazy\" src=\"img/026/026_1_card.png\" alt=\"양육비 선지급제, 무엇이 바뀌나\"><\/figure>\n<h3>양육비 선지급제는 어떤 제도일까?<\/h3>\n<p>비양육 부모에게서 양육비를 받지 못하는 한부모가족의 미성년 자녀에게 국가가 양육비를 먼저 주고, 그 돈을 나중에 비양육 부모에게서 돌려받는 제도예요. 아이에게 필요한 돈은 제때 지원하면서, 양육비를 줘야 할 사람의 책임은 그대로 묻는다는 것이 기본 원칙이라고 성평등가족부는 설명해요.<\/p>\n<p>2025년 7월 제도가 시작된 뒤 2026년 8월까지 8,188가구, 미성년 자녀 1만 2,924명에게 231억 원이 지원됐다고 해요.<\/p>\n<h3>10월 29일부터 바뀌는 점<\/h3>\n<div class=\"tw\"><table><thead><tr><th>구분<\/th><th>10월 28일까지<\/th><th>10월 29일부터<\/th><\/tr><\/thead><tbody><tr><td>소득기준<\/td><td>기준 중위소득 150% 이하 가구만<\/td><td>소득기준 없음<\/td><\/tr><tr><td>그 밖의 요건<\/td><td>양육비 채권·미지급·이행 절차<\/td><td>그대로 유지<\/td><\/tr><tr><td>지원 금액<\/td><td>자녀 1인당 월 20만 원까지<\/td><td>같음<\/td><\/tr><\/tbody><\/table><\/div>\n<p>다만 소득기준 폐지는 법 시행일(10월 29일) 이후 결정되는 10월 선지급 지급분부터 적용된다고 안내돼 있어요. 그동안 소득 때문에 신청을 못 했던 분이라면 시행일 이후 결정 기준으로 적용된다는 점을 기억해 두세요.<\/p>\n<h3>그대로 남는 신청 요건 3가지<\/h3>\n<p>소득 문턱은 사라져도 아래 세 가지는 모두 갖춰야 해요.<\/p>\n<ol><li>양육비 채권을 가지고 있을 것<\/li><li>신청한 달 직전 3개월(또는 3회) 동안 실제로 받은 양육비의 월평균이 선지급금보다 적을 것<\/li><li>양육비를 받기 위한 이행 절차를 진행하고 있을 것<\/li><\/ol>\n<p>어떤 서류가 '양육비 채권'으로 인정되는지, 이행 절차로 무엇이 해당하는지는 개인 상황에 따라 다를 수 있으니 양육비이행관리원 안내를 먼저 확인하는 것이 좋아요.<\/p>\n<h3>얼마를, 언제, 어디서?<\/h3>\n<ul><li>금액: 선지급 대상으로 결정되면 미성년 자녀가 성년이 될 때까지 자녀 1인당 월 20만 원까지 받을 수 있어요.<\/li><li>지급일: 요건 충족 여부 조사를 거친 뒤 통상 매월 25일에 지급돼요. 국가가 먼저 준 돈은 이후 비양육 부모에게서 회수하는 절차가 따로 진행돼요.<\/li><li>신청: 양육비이행관리원 누리집에서 온라인으로 하거나, 신청서를 우편으로 보내면 돼요.<\/li><li>문의: 성평등가족부 가족지원과(02-2100-6342), 양육비이행관리원 선지급운영부(02-3479-5672)<\/li><\/ul>\n<p>성평등가족부는 신청 문턱이 낮아지는 만큼 국세청 등 관계기관과 협력해 먼저 지급한 양육비를 비양육 부모에게서 회수하는 체계도 강화하겠다고 밝혔어요.<\/p>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/026/026_2_capture.png\" alt=\"양육비이행관리원 누리집 &#x27;선지급제 안내&#x27;의 지원 절차·신청방법 (2026-10-05 확인)\"><figcaption>출처: 양육비이행관리원 누리집<\/figcaption><\/figure>\n<h3>한눈에 정리<\/h3>\n<ul><li>10월 29일부터 중위소득 150% 소득기준 폐지<\/li><li>양육비 채권·월평균 수령액·이행 절차 요건은 그대로<\/li><li>자녀 1인당 월 20만 원까지, 통상 매월 25일 지급<\/li><li>신청은 양육비이행관리원 누리집 또는 우편<\/li><\/ul>\n<p>세부 요건과 제출 서류는 바뀔 수 있으니 신청 전에 양육비이행관리원 공지를 한 번 더 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 자체 제작 카드 · 사진 2 공식 화면 캡처 — 파일 images/posts/026/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래<\/td><td>직접 만든 '10월 28일까지 vs 10월 29일부터' 비교 카드<\/td><td>정책브리핑·언론사 사진은 저작권상 쓰지 않기<\/td><\/tr><tr><td>신청 문단<\/td><td>양육비이행관리원 누리집 첫 화면(로그인 전) 직접 캡처<\/td><td>신청서·개인 정보가 보이는 화면, 판결문 등 서류 사진은 캡처 금지<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 시행일 10월 29일과 '10월 선지급 지급분부터 적용' 문구를 성평등가족부 발표 원문과 다시 대조<\/li><li class=\"cb\">☐ 지급액 '자녀 1인당 월 20만 원까지'와 통상 지급일 '매월 25일'이 양육비이행관리원 안내와 같은지 확인<\/li><li class=\"cb\">☐ 누적 실적(8,188가구·1만 2,924명·231억 원, 2026년 8월까지) 숫자가 원문과 같은지 확인<\/li><li class=\"cb\">☐ 지원 기간: 성평등가족부 발표는 '미성년 자녀가 성년에 이를 때까지', 정책브리핑 10월 제도 기사는 '18세까지'로 표현이 달라 본문은 부처 발표 문구를 따름 — 발행 전 양육비이행관리원 안내로 최종 확인<\/li><li class=\"cb\">☐ 제출 서류 목록은 본문에 쓰지 않았음 — 넣고 싶다면 양육비이행관리원 '제출서류' 페이지를 직접 확인한 경우에만 추가<\/li><li class=\"cb\">☐ 개인 사례·경험담은 실제 있었던 경우에만 쓰고, 상대방 정보는 넣지 않기<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>10월 29일 소득기준(중위소득 150%) 폐지, 제도 개념, 신청 요건 3가지, 월 20만 원·성년까지, 누리집·우편 신청, 통상 매월 25일 지급, 10월 지급분부터 적용, 누적 실적, 회수 체계 강화, 문의처<\/td><td>성평등가족부 발표(정책브리핑 2026-09-21) <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148972321\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyNewsView.do?newsId=148972321<\/a><\/td><td>공식<\/td><\/tr><tr><td>10월 달라지는 제도 중 양육비 선지급 소득기준 폐지<\/td><td>정책브리핑 '10월부터 달라지는 제도'(2026-10-01) <a href=\"https://www.korea.kr/news/policyFocusView.do?newsId=148972822&amp;pkgId=49500843\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyFocusView.do?newsId=148972822&amp;pkgId=49500843<\/a><\/td><td>공식<\/td><\/tr><tr><td>신청처(양육비이행관리원 누리집)<\/td><td>양육비이행관리원 <a href=\"https://www.childsupport.or.kr/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.childsupport.or.kr/<\/a> (검색 요약 확인, 원문 미열람)<\/td><td>공식(검색 요약)<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "<ul><li>사진 2: 양육비이행관리원 누리집 공개 화면 캡처(2026-10-05 확인, 로그인 전 화면) <a href=\"https://www.childsupport.or.kr/lay1/S1T134C136/contents.do\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.childsupport.or.kr/lay1/S1T134C136/contents.do<\/a><\/li><\/ul>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "핵심만 먼저 정리하면, 2026년 10월 29일부터 양육비 선지급제의 소득기준이 없어져요. 지금까지는 기준 중위소득 150% 이하 한부모가족만 신청할 수 있었지만, 이제는 소득 수준과 관계없이 나머지 요건만 갖추면 신청할 수 있어요. 성평등가족부가 9월 21일 발표한 내용을 바탕으로 무엇이 바뀌고 무엇이 그대로인지 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/026/026_1_card.png\n\n양육비 선지급제는 어떤 제도일까?\n\n비양육 부모에게서 양육비를 받지 못하는 한부모가족의 미성년 자녀에게 국가가 양육비를 먼저 주고, 그 돈을 나중에 비양육 부모에게서 돌려받는 제도예요. 아이에게 필요한 돈은 제때 지원하면서, 양육비를 줘야 할 사람의 책임은 그대로 묻는다는 것이 기본 원칙이라고 성평등가족부는 설명해요.\n\n2025년 7월 제도가 시작된 뒤 2026년 8월까지 8,188가구, 미성년 자녀 1만 2,924명에게 231억 원이 지원됐다고 해요.\n\n10월 29일부터 바뀌는 점\n\n• 소득기준 — 10월 28일까지: 기준 중위소득 150% 이하 가구만 / 10월 29일부터: 소득기준 없음\n• 그 밖의 요건 — 10월 28일까지: 양육비 채권·미지급·이행 절차 / 10월 29일부터: 그대로 유지\n• 지원 금액 — 10월 28일까지: 자녀 1인당 월 20만 원까지 / 10월 29일부터: 같음\n\n다만 소득기준 폐지는 법 시행일(10월 29일) 이후 결정되는 10월 선지급 지급분부터 적용된다고 안내돼 있어요. 그동안 소득 때문에 신청을 못 했던 분이라면 시행일 이후 결정 기준으로 적용된다는 점을 기억해 두세요.\n\n그대로 남는 신청 요건 3가지\n\n소득 문턱은 사라져도 아래 세 가지는 모두 갖춰야 해요.\n\n1. 양육비 채권을 가지고 있을 것\n2. 신청한 달 직전 3개월(또는 3회) 동안 실제로 받은 양육비의 월평균이 선지급금보다 적을 것\n3. 양육비를 받기 위한 이행 절차를 진행하고 있을 것\n\n어떤 서류가 '양육비 채권'으로 인정되는지, 이행 절차로 무엇이 해당하는지는 개인 상황에 따라 다를 수 있으니 양육비이행관리원 안내를 먼저 확인하는 것이 좋아요.\n\n얼마를, 언제, 어디서?\n\n- 금액: 선지급 대상으로 결정되면 미성년 자녀가 성년이 될 때까지 자녀 1인당 월 20만 원까지 받을 수 있어요.\n- 지급일: 요건 충족 여부 조사를 거친 뒤 통상 매월 25일에 지급돼요. 국가가 먼저 준 돈은 이후 비양육 부모에게서 회수하는 절차가 따로 진행돼요.\n- 신청: 양육비이행관리원 누리집에서 온라인으로 하거나, 신청서를 우편으로 보내면 돼요.\n- 문의: 성평등가족부 가족지원과(02-2100-6342), 양육비이행관리원 선지급운영부(02-3479-5672)\n\n성평등가족부는 신청 문턱이 낮아지는 만큼 국세청 등 관계기관과 협력해 먼저 지급한 양육비를 비양육 부모에게서 회수하는 체계도 강화하겠다고 밝혔어요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/026/026_2_capture.png\n출처: 양육비이행관리원 누리집\n\n한눈에 정리\n\n- 10월 29일부터 중위소득 150% 소득기준 폐지\n- 양육비 채권·월평균 수령액·이행 절차 요건은 그대로\n- 자녀 1인당 월 20만 원까지, 통상 매월 25일 지급\n- 신청은 양육비이행관리원 누리집 또는 우편\n\n세부 요건과 제출 서류는 바뀔 수 있으니 신청 전에 양육비이행관리원 공지를 한 번 더 확인해 주세요.", "copyAll": "핵심만 먼저 정리하면, 2026년 10월 29일부터 양육비 선지급제의 소득기준이 없어져요. 지금까지는 기준 중위소득 150% 이하 한부모가족만 신청할 수 있었지만, 이제는 소득 수준과 관계없이 나머지 요건만 갖추면 신청할 수 있어요. 성평등가족부가 9월 21일 발표한 내용을 바탕으로 무엇이 바뀌고 무엇이 그대로인지 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/026/026_1_card.png\n\n양육비 선지급제는 어떤 제도일까?\n\n비양육 부모에게서 양육비를 받지 못하는 한부모가족의 미성년 자녀에게 국가가 양육비를 먼저 주고, 그 돈을 나중에 비양육 부모에게서 돌려받는 제도예요. 아이에게 필요한 돈은 제때 지원하면서, 양육비를 줘야 할 사람의 책임은 그대로 묻는다는 것이 기본 원칙이라고 성평등가족부는 설명해요.\n\n2025년 7월 제도가 시작된 뒤 2026년 8월까지 8,188가구, 미성년 자녀 1만 2,924명에게 231억 원이 지원됐다고 해요.\n\n10월 29일부터 바뀌는 점\n\n• 소득기준 — 10월 28일까지: 기준 중위소득 150% 이하 가구만 / 10월 29일부터: 소득기준 없음\n• 그 밖의 요건 — 10월 28일까지: 양육비 채권·미지급·이행 절차 / 10월 29일부터: 그대로 유지\n• 지원 금액 — 10월 28일까지: 자녀 1인당 월 20만 원까지 / 10월 29일부터: 같음\n\n다만 소득기준 폐지는 법 시행일(10월 29일) 이후 결정되는 10월 선지급 지급분부터 적용된다고 안내돼 있어요. 그동안 소득 때문에 신청을 못 했던 분이라면 시행일 이후 결정 기준으로 적용된다는 점을 기억해 두세요.\n\n그대로 남는 신청 요건 3가지\n\n소득 문턱은 사라져도 아래 세 가지는 모두 갖춰야 해요.\n\n1. 양육비 채권을 가지고 있을 것\n2. 신청한 달 직전 3개월(또는 3회) 동안 실제로 받은 양육비의 월평균이 선지급금보다 적을 것\n3. 양육비를 받기 위한 이행 절차를 진행하고 있을 것\n\n어떤 서류가 '양육비 채권'으로 인정되는지, 이행 절차로 무엇이 해당하는지는 개인 상황에 따라 다를 수 있으니 양육비이행관리원 안내를 먼저 확인하는 것이 좋아요.\n\n얼마를, 언제, 어디서?\n\n- 금액: 선지급 대상으로 결정되면 미성년 자녀가 성년이 될 때까지 자녀 1인당 월 20만 원까지 받을 수 있어요.\n- 지급일: 요건 충족 여부 조사를 거친 뒤 통상 매월 25일에 지급돼요. 국가가 먼저 준 돈은 이후 비양육 부모에게서 회수하는 절차가 따로 진행돼요.\n- 신청: 양육비이행관리원 누리집에서 온라인으로 하거나, 신청서를 우편으로 보내면 돼요.\n- 문의: 성평등가족부 가족지원과(02-2100-6342), 양육비이행관리원 선지급운영부(02-3479-5672)\n\n성평등가족부는 신청 문턱이 낮아지는 만큼 국세청 등 관계기관과 협력해 먼저 지 boardProcess?bid=press&amp;fno=2&amp;k=ATC202104271102112_053690f3-20d6-4005-b700-009a4e1fd9da.pdf&amp;mode=download&amp;num=1194009&amp;ses=USERSESSION\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.kma.go.kr/kma/servlet/NeoboardProcess?bid=press&amp;fno=2&amp;k=ATC202104271102112_053690f3-20d6-4005-b700-009a4e1fd9da.pdf&amp;mode=download&amp;num=1194009&amp;ses=USERSESSION<\/a> (정의는 검색 요약·연합뉴스 팩트체크로 교차 확인 <a href=\"https://www.yna.co.kr/view/AKR20241122073500518\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.yna.co.kr/view/AKR20241122073500518<\/a>)<\/td><td>공식<\/td><\/tr><tr><td>6개 지점(인천·부산·목포·서울·대구·강릉) 109년 분석, 최근 30년 가을 시작 9월 26일(+9일), 가을 69일 최단·여름 118일 최장, 여름 +20일·겨울 −22일<\/td><td>기상청 보도자료 본문(HTML 변환본) <a href=\"https://www.kma.go.kr/kma/flexer/html/press/2021/04/27/ATC202104271102111_226ab095-6244-4ed5-86cc-e7b6240fb7e7.hwp.files/Sections1.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.kma.go.kr/kma/flexer/html/press/2021/04/27/ATC202104271102111_226ab095-6244-4ed5-86cc-e7b6240fb7e7.hwp.files/Sections1.html<\/a><\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>(선택) 스레드 끝 답글이나 프로필에 쓸 수 있는 문구: \"AI 도움을 받아 초안을 쓰고, 공식 자료로 사실을 확인했어요. 날짜·규정은 바뀔 수 있어요.\"<\/blockquote>", "open": false}], "search": "022 낮엔 반팔, 밤엔 패딩 고민… 기상청 기준 '가을'은 언제 시작할까? 일상 공감 가을, 기상청, 계절 시작일, 기후변화, 일평균기온 #가을 기상청의 계절 시작일 정의와 109년 기후변화 분석(2021년 4월 발표)의 가을 시작일·계절 길이 변화를 일상 공감 톤으로 소개하는 한국어 5개 트윗 기상청은 일평균기온(9일 이동평균)이 20℃ 미만으로 내려간 뒤 다시 오르지 않는 첫날을 가을 시작일로 봐요. 2021년 4월 발표한 109년 분석(6개 지점)에서 최근 30년 가을 시작일은 9월 26일(과거 30년보다 9일 늦음), 가을 길이는 69일로 가장 짧고 여름은 118일로 가장 길었어요(여름 +20일, 겨울 −22일). 낮엔 반팔, 밤엔 패딩 고민하는 그 시기 🍂 근데 기상청 기준으로 '가을'은 정확히 언제 시작할까? 🧵 #가을 (1/5) --- 기상청 기준(일평균기온, 9일 이동평균) - 여름: 20℃ 이상으로 오른 뒤 안 내려가는 첫날 - 가을: 20℃ 미만으로 내려간 뒤 다시 안 오르는 첫날 - 겨울: 5℃ 미만으로 내려간 뒤 안 오르는 첫날 (2/5) --- 기상청 109년 분석(2021년 4월 발표, 6개 지점 기준) 👇 최근 30년(1991~2020) 가을 시작일은 9월 26일. 과거 30년(1912~1940)보다 9일 늦어졌어요. (3/5) --- 그리고 가을은 69일로 사계절 중 가장 짧아요. 가장 긴 건 여름(118일). 과거 30년보다 여름은 20일 길어지고 겨울은 22일 짧아졌다고 해요. (4/5) --- 그러니까 '가을 좀 즐기려니까 겨울'이라는 말, 기분 탓만은 아니었던 걸로 ㅋㅋ 단, 6개 지점 평균이라 사는 동네 체감은 다를 수 있어요. (5/5) X 일반"}, {"id": "021", "platform": "x", "sub": "x_general", "subLabel": "X 일반", "file": "021_standard-korean-ippeuda.md", "title": "'이쁘다' 쓰면 빨간 펜 맞던 시절 기억나는 사람? 표준어 된 지 아직 10년밖에 안 됨", "cands": ["'이쁘다' 쓰면 빨간 펜 맞던 시절 기억나는 사람? 표준어 된 지 아직 10년밖에 안 됨", "'자장면'만 맞다고 혼났던 세대 모여라 🙋 짜장면 표준어 15년 차", "맞춤법 지적하기 전에 확인: 생각보다 최근에 표준어 된 말들"], "cat": "밈·유머", "kw": ["표준어", "짜장면", "이쁘다", "국립국어원", "맞춤법"], "summary": "'짜장면'(2011년 8월)과 '이쁘다'(2015년 12월)처럼 생각보다 최근에 표준어가 된 말들을 공감 밈 톤으로 소개하는 한국어 5개 트윗", "status": "초안", "created": "2026-10-05 13:46", "base": "2026-10-05", "format": "thread", "hashtags": "#맞춤법", "tags": ["#맞춤법"], "ko": "'짜장면'은 2011년 8월 31일 국립국어원이 39개 항목을 표준어로 인정할 때 '자장면'과 함께 복수 표준어가 됐고(간지럽히다·복숭아뼈·눈꼬리·택견 등도 함께), '이쁘다·마실·찰지다·-고프다'는 2015년 12월 복수 표준어로 인정됐다고 보도됐어요. 맞춤법 지적 전에 사전을 검색해 보자는 공감 톤의 5개 트윗.", "need": 0, "chars": 173, "imgs": 0, "tweets": [{"n": 1, "total": 5, "text": "'이쁘다'라고 쓰면 빨간 펜 맞던 시절 기억나는 사람? 🙋\n\n'이쁘다'가 표준어가 된 건 2015년 12월. 생각보다 진짜 최근임 🧵 #맞춤법 (1/5)", "len": 131, "need": 0, "media": []}, {"n": 2, "total": 5, "text": "원조 레전드는 '짜장면'.\n\n국립국어원이 2011년 8월 31일 '짜장면' 등 39개 항목을 표준어로 인정하면서 '자장면'만 맞던 시대가 끝났어요. 지금은 둘 다 표준어. (2/5)", "len": 157, "need": 0, "media": []}, {"n": 3, "total": 5, "text": "그때 같이 구제된 말들 👇\n- 간지럽히다·토란대·복숭아뼈(복수 표준어)\n- 눈꼬리·나래·내음(별도 표준어)\n- 택견·품새(표기 인정)\n\n그 전엔 '간질이다', '눈초리'만 맞았음. (3/5)", "len": 167, "need": 0, "media": []}, {"n": 4, "total": 5, "text": "2015년엔 '이쁘다·마실·찰지다·-고프다'가 복수 표준어로, '푸르르다·잎새·꼬리연' 등은 별도 표준어로 인정됐다고 당시 보도됐어요.\n\n단 '마실'은 '이웃에 놀러 다니는 일' 뜻만. (4/5)", "len": 173, "need": 0, "media": []}, {"n": 5, "total": 5, "text": "결론: 옛날 맞춤법 기억으로 남 지적하기 전에 표준국어대사전 한 번 검색 ㄱㄱ\n\n말은 지금도 계속 바뀌는 중 😇 (5/5)", "len": 111, "need": 0, "media": []}], "replies": [{"text": "출처: 국립국어원 '짜장면 등 39항목 표준어로 인정'(2011-08-31) https://korean.go.kr/front/board/boardStandardView.do?b_seq=374&board_id=6&mn_id=184&pageIndex=39", "len": 85, "need": 0}, {"text": "2015년 추가 표준어 보도: 동아일보 https://www.donga.com/news/Society/article/all/20151215/75366817/3", "len": 57, "need": 0}], "plain": "'이쁘다'라고 쓰면 빨간 펜 맞던 시절 기억나는 사람? 🙋\n\n'이쁘다'가 표준어가 된 건 2015년 12월. 생각보다 진짜 최근임 🧵 #맞춤법 (1/5)\n\n---\n\n원조 레전드는 '짜장면'.\n\n국립국어원이 2011년 8월 31일 '짜장면' 등 39개 항목을 표준어로 인정하면서 '자장면'만 맞던 시대가 끝났어요. 지금은 둘 다 표준어. (2/5)\n\n---\n\n그때 같이 구제된 말들 👇\n- 간지럽히다·토란대·복숭아뼈(복수 표준어)\n- 눈꼬리·나래·내음(별도 표준어)\n- 택견·품새(표기 인정)\n\n그 전엔 '간질이다', '눈초리'만 맞았음. (3/5)\n\n---\n\n2015년엔 '이쁘다·마실·찰지다·-고프다'가 복수 표준어로, '푸르르다·잎새·꼬리연' 등은 별도 표준어로 인정됐다고 당시 보도됐어요.\n\n단 '마실'은 '이웃에 놀러 다니는 일' 뜻만. (4/5)\n\n---\n\n결론: 옛날 맞춤법 기억으로 남 지적하기 전에 표준국어대사전 한 번 검색 ㄱㄱ\n\n말은 지금도 계속 바뀌는 중 😇 (5/5)", "copyAll": "'이쁘다'라고 쓰면 빨간 펜 맞던 시절 기억나는 사람? 🙋\n\n'이쁘다'가 표준어가 된 건 2015년 12월. 생각보다 진짜 최근임 🧵 #맞춤법 (1/5)\n\n---\n\n원조 레전드는 '짜장면'.\n\n국립국어원이 2011년 8월 31일 '짜장면' 등 39개 항목을 표준어로 인정하면서 '자장면'만 맞던 시대가 끝났어요. 지금은 둘 다 표준어. (2/5)\n\n---\n\n그때 같이 구제된 말들 👇\n- 간지럽히다·토란대·복숭아뼈(복수 표준어)\n- 눈꼬리·나래·내음(별도 표준어)\n- 택견·품새(표기 인정)\n\n그 전엔 '간질이다', '눈초리'만 맞았음. (3/5)\n\n---\n\n2015년엔 '이쁘다·마실·찰지다·-고프다'가 복수 표준어로, '푸르르다·잎새·꼬리연' 등은 별도 표준어로 인정됐다고 당시 보도됐어요.\n\n단 '마실'은 '이웃에 놀러 다니는 일' 뜻만. (4/5)\n\n---\n\n결론: 옛날 맞춤법 기억으로 남 지적하기 전에 표준국어대사전 한 번 검색 ㄱㄱ\n\n말은 지금도 계속 바뀌는 중 😇 (5/5)", "extras": [{"title": "이미지·미디어 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>트윗 1<\/td><td>직접 만든 'Before/After' 텍스트 카드(이쁘다 ❌→⭕)<\/td><td>예능·드라마 캡처, 남이 만든 짤은 첨부 금지 — 쓰고 싶으면 원본 링크 인용으로만<\/td><\/tr><tr><td>트윗 3<\/td><td>목록을 이미지로 만들 경우 직접 제작<\/td><td>이미지에만 정보 넣지 말고 본문에도 유지<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 트윗 4의 2015년 항목(이쁘다·마실·찰지다·-고프다 / 푸르르다·잎새·꼬리연)을 국립국어원 2015년 발표문으로 한 번 더 확인(박스에서 원문을 못 찾아 언론 2곳으로 교차 확인함)<\/li><li class=\"cb\">☐ 트윗 3 목록이 국립국어원 2011년 보도자료와 일치하는지 확인<\/li><li class=\"cb\">☐ '아직 10년밖에'(2015-12 → 2026-10, 약 10년 10개월) 표현이 어색하면 '약 11년'으로 수정<\/li><li class=\"cb\">☐ 특정 인물·집단을 조롱하는 인용(남의 맞춤법 실수 캡처 등)을 붙이지 않기<\/li><li class=\"cb\">☐ 발행은 직접 수동으로<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>2011-08-31 '짜장면' 등 39항목 표준어 인정, 세 부류(복수 표준어 11·별도 표준어 25·표기 3), 간지럽히다·토란대·복숭아뼈, 눈꼬리·나래·내음, 짜장면·택견·품새<\/td><td>국립국어원 보도자료 <a href=\"https://korean.go.kr/front/board/boardStandardView.do?b_seq=374&amp;board_id=6&amp;mn_id=184&amp;pageIndex=39\" target=\"_blank\" rel=\"noopener noreferrer\">https://korean.go.kr/front/board/boardStandardView.do?b_seq=374&amp;board_id=6&amp;mn_id=184&amp;pageIndex=39<\/a><\/td><td>공식<\/td><\/tr><tr><td>2015년 표준어 추가(복수 표준어 마실·이쁘다·찰지다·-고프다, 별도 표준어 푸르르다·잎새·꼬리연 등), 마실은 '이웃에 놀러 다니는 일' 뜻만<\/td><td>동아일보 2015-12-15 <a href=\"https://www.donga.com/news/Society/article/all/20151215/75366817/3\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.donga.com/news/Society/article/all/20151215/75366817/3<\/a> · 허프포스트코리아(국립국어원 발표 인용) <a href=\"https://www.huffingtonpost.kr/news/articleView.html?idxno=19054\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.huffingtonpost.kr/news/articleView.html?idxno=19054<\/a><\/td><td>언론(공식 발표 인용, 2곳 교차)<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>(선택) 스레드 끝 답글이나 프로필에 쓸 수 있는 문구: \"AI 도움을 받아 초안을 쓰고, 공식 자료로 사실을 확인했어요. 날짜·규정은 바뀔 수 있어요.\"<\/blockquote>", "open": false}], "search": "021 '이쁘다' 쓰면 빨간 펜 맞던 시절 기억나는 사람? 표준어 된 지 아직 10년밖에 안 됨 밈·유머 표준어, 짜장면, 이쁘다, 국립국어원, 맞춤법 #맞춤법 '짜장면'(2011년 8월)과 '이쁘다'(2015년 12월)처럼 생각보다 최근에 표준어가 된 말들을 공감 밈 톤으로 소개하는 한국어 5개 트윗 '짜장면'은 2011년 8월 31일 국립국어원이 39개 항목을 표준어로 인정할 때 '자장면'과 함께 복수 표준어가 됐고(간지럽히다·복숭아뼈·눈꼬리·택견 등도 함께), '이쁘다·마실·찰지다·-고프다'는 2015년 12월 복수 표준어로 인정됐다고 보도됐어요. 맞춤법 지적 전에 사전을 검색해 보자는 공감 톤의 5개 트윗. '이쁘다'라고 쓰면 빨간 펜 맞던 시절 기억나는 사람? 🙋 '이쁘다'가 표준어가 된 건 2015년 12월. 생각보다 진짜 최근임 🧵 #맞춤법 (1/5) --- 원조 레전드는 '짜장면'. 국립국어원이 2011년 8월 31일 '짜장면' 등 39개 항목을 표준어로 인정하면서 '자장면'만 맞던 시대가 끝났어요. 지금은 둘 다 표준어. (2/5) --- 그때 같이 구제된 말들 👇 - 간지럽히다·토란대·복숭아뼈
