까지 챙겨야 하는 이유 (임차인 기본 절차)", "대항력은 전입신고 '다음 날 0시'부터, 우선변제권은 확정일자까지 있어야 해요", "임대차 신고하면 확정일자가 따라온다? 이사 후 해야 할 서류 절차 정리"], "cat": "주거·임대차", "kw": ["전입신고", "확정일자", "대항력", "우선변제권", "주택 임대차 계약 신고"], "summary": "이사 후 14일 이내 전입신고와 확정일자의 역할 차이, 대항력 발생 시점, 임대차 신고제와의 관계를 법령 해설 기준으로 정리", "status": "초안", "created": "2026-10-05 12:25", "base": "2026-10-05", "need": 2, "chars": 1742, "chars_ns": 1338, "imgs": 0, "slots": 0, "html": "<p>이삿짐을 풀고 나면 정리할 게 산더미라 서류 일은 자꾸 뒤로 밀리기 쉬워요. 그런데 전입신고와 확정일자는 세입자가 보증금을 지키는 데 쓰이는 기본 절차라서 순서와 기한을 알아 두면 좋아요. 정부24와 찾기쉬운 생활법령정보 안내를 바탕으로 정리했습니다. 법률 상담이 아니라 제도 안내예요. (2026년 10월 5일 기준)<\/p>\n<h3>전입신고는 언제까지, 어디서 하나요?<\/h3>\n<p>거주지를 옮기면 전입한 날부터 14일 이내에 새 거주지 관할 기관에 신고해야 해요. 정부24의 '전입신고+'를 이용하면 직접 방문하지 않고 온라인으로 신청할 수 있고, 요금 감면 대상자는 신청서에서 통합 신청에 동의하면 전입신고와 감면 신청을 한 번에 할 수 있다고 안내돼 있어요.<\/p>\n<h3>대항력은 무엇이고 언제 생길까요?<\/h3>\n<p>임차인이 ① 주택의 인도(실제 입주)와 ② 주민등록을 마치면 그 다음 날부터 제3자에게도 임차권을 주장할 수 있는 힘이 생기는데, 이것을 대항력이라고 해요. 전입신고를 한 때 주민등록이 된 것으로 보고(주택임대차보호법 제3조 제1항), 여기서 '다음 날'은 오전 0시라고 해설돼 있어요.<\/p>\n<p>가상의 예를 들어 볼게요. 10월 20일에 입주하고 21일 오후 3시에 전입신고를 했다면 대항력은 22일 오전 0시부터 생겨요. 신고를 며칠 미룰수록 그만큼 대항력이 늦어지는 셈이에요.<\/p>\n<h3>우선변제권은 확정일자가 더해져야 해요<\/h3>\n<p>대항력을 갖추고 임대차계약서에 확정일자까지 받으면 집이 경매나 공매로 넘어갈 때 후순위 권리자나 다른 채권자보다 먼저 보증금을 돌려받을 수 있는 권리가 생겨요(같은 법 제3조의2). 확정일자는 주택 소재지의 행정복지센터나 등기소, 대법원 인터넷등기소, 또는 주택 임대차 계약 신고를 통해 받을 수 있어요. 정부24 안내에는 인터넷등기소 또는 이사 간 곳 관할 주민센터가 소개돼 있어요. 확정일자 수수료 금액은 확인하지 못했어요. <mark class=\"need\">[확인 필요: 확정일자 수수료]<\/mark><\/p>\n<h3>임대차 신고를 하면 확정일자는 따로 안 받아도 될까?<\/h3>\n<p>보증금이 6천만 원을 넘거나 월 차임이 30만 원을 넘는 주택 임대차 계약은 계약 체결일부터 30일 이내에 신고해야 하는 제도가 있어요. 임대인과 임차인이 함께 신고하는 게 원칙이고, 계약서를 첨부해 신고하면 확정일자가 부여된 것으로 본다고 해요. 그래서 전입신고 단계에서 임대차계약서를 냈거나 계약서를 붙여 임대차 신고를 했다면 확정일자 신청은 따로 하지 않아도 된다고 정부24는 안내하고 있어요.<\/p>\n<p>주의할 점이 두 가지 있어요.<\/p>\n<ul><li>임대차 신고와 전입신고는 다른 절차예요. 대항력의 요건인 주민등록은 전입신고로 갖춰요.<\/li><li>이 신고제가 적용되는 지역에서 제외되는 곳(경기도 외 도 관할 군 지역)이 있다고 정부24에 적혀 있어요. 내가 사는 곳이 해당하는지는 직접 확인해야 해요. <mark class=\"need\">[확인 필요: 신고 대상 지역 범위]<\/mark><\/li><\/ul>\n<h3>계약 전후에 알아 두면 좋은 것<\/h3>\n<p>기존 세입자가 있는 집이라면 전입세대확인서로 그 집에 누가 언제 전입했는지 볼 수 있어요. 이 서류는 읍·면·동 주민센터에서만 발급되고 온라인 열람·교부는 안 된다고 해요. 임차인이 부동산거래관리시스템에서 확정일자를 받은 사실로 임차인 여부 확인에 동의하면 계약서 없이도 전입 세대를 확인할 수 있다는 설명도 있어요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>전입신고: 전입일부터 14일 이내, 정부24 온라인 신청 가능<\/li><li>대항력: 입주 + 전입신고를 마친 다음 날 0시부터<\/li><li>우선변제권: 대항력 + 확정일자, 임대차 신고 시 확정일자가 부여된 것으로 봄<\/li><\/ul>\n<p>계약 내용에 따른 개별 판단은 달라질 수 있으니 분쟁이 걱정되는 경우에는 전문가 상담이나 공식 창구에서 한 번 더 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래<\/td><td>정부24 '전입신고+' 안내 화면(로그인 전) 직접 캡처<\/td><td>개인정보 입력 화면은 캡처 금지<\/td><\/tr><tr><td>대항력 예시 아래<\/td><td>날짜 흐름을 보여 주는 간단한 타임라인 표(직접 제작)<\/td><td>가상 예시임을 캡션에 표기<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 인터넷등기소 또는 주민센터의 확정일자 수수료를 공식 안내에서 확인하고 <mark class=\"need\">[확인 필요]<\/mark> 문장 대체<\/li><li class=\"cb\">☐ 임대차 신고제 적용 지역(제외 지역 표현)을 정부24 또는 국토교통부 안내에서 다시 확인<\/li><li class=\"cb\">☐ 전입세대확인서 관련 문단은 '제도 안내'임을 유지, 특정 계약 상황에 대한 법률 판단 문구를 추가하지 않기<\/li><li class=\"cb\">☐ 예시 날짜는 가상이라는 문구 유지 (실제 사례처럼 쓰지 않기)<\/li><li class=\"cb\">☐ 경험담을 넣는다면 실제 이사 경험만, 주소·계약 정보는 가리기<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>전입신고 14일 이내, 전입신고+ 온라인, 요금감면 통합신청, 임대차 신고 조건·확정일자 의제, 확정일자 신청처<\/td><td>정부24 전입신고 <a href=\"https://www.gov.kr/portal/onestopSvc/transferReport\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.kr/portal/onestopSvc/transferReport<\/a><\/td><td>공식<\/td><\/tr><tr><td>대항력 요건·발생 시점, 우선변제권, 확정일자 부여처, 임대차 신고제 요건, 전입세대확인서<\/td><td>찾기쉬운 생활법령정보 <a href=\"https://www.easylaw.go.kr/CSP/CnpClsMainBtr.laf?ccfNo=3&amp;cciNo=2&amp;cnpClsNo=1&amp;csmSeq=1972&amp;popMenu=ov\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.easylaw.go.kr/CSP/CnpClsMainBtr.laf?ccfNo=3&amp;cciNo=2&amp;cnpClsNo=1&amp;csmSeq=1972&amp;popMenu=ov<\/a> (주택임대차보호법 제3조·제3조의2, 부동산 거래신고 등에 관한 법률 제6조의2 근거 표기)<\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "이삿짐을 풀고 나면 정리할 게 산더미라 서류 일은 자꾸 뒤로 밀리기 쉬워요. 그런데 전입신고와 확정일자는 세입자가 보증금을 지키는 데 쓰이는 기본 절차라서 순서와 기한을 알아 두면 좋아요. 정부24와 찾기쉬운 생활법령정보 안내를 바탕으로 정리했습니다. 법률 상담이 아니라 제도 안내예요. (2026년 10월 5일 기준)\n\n전입신고는 언제까지, 어디서 하나요?\n\n거주지를 옮기면 전입한 날부터 14일 이내에 새 거주지 관할 기관에 신고해야 해요. 정부24의 '전입신고+'를 이용하면 직접 방문하지 않고 온라인으로 신청할 수 있고, 요금 감면 대상자는 신청서에서 통합 신청에 동의하면 전입신고와 감면 신청을 한 번에 할 수 있다고 안내돼 있어요.\n\n대항력은 무엇이고 언제 생길까요?\n\n임차인이 ① 주택의 인도(실제 입주)와 ② 주민등록을 마치면 그 다음 날부터 제3자에게도 임차권을 주장할 수 있는 힘이 생기는데, 이것을 대항력이라고 해요. 전입신고를 한 때 주민등록이 된 것으로 보고(주택임대차보호법 제3조 제1항), 여기서 '다음 날'은 오전 0시라고 해설돼 있어요.\n\n가상의 예를 들어 볼게요. 10월 20일에 입주하고 21일 오후 3시에 전입신고를 했다면 대항력은 22일 오전 0시부터 생겨요. 신고를 며칠 미룰수록 그만큼 대항력이 늦어지는 셈이에요.\n\n우선변제권은 확정일자가 더해져야 해요\n\n대항력을 갖추고 임대차계약서에 확정일자까지 받으면 집이 경매나 공매로 넘어갈 때 후순위 권리자나 다른 채권자보다 먼저 보증금을 돌려받을 수 있는 권리가 생겨요(같은 법 제3조의2). 확정일자는 주택 소재지의 행정복지센터나 등기소, 대법원 인터넷등기소, 또는 주택 임대차 계약 신고를 통해 받을 수 있어요. 정부24 안내에는 인터넷등기소 또는 이사 간 곳 관할 주민센터가 소개돼 있어요. 확정일자 수수료 금액은 확인하지 못했어요. [확인 필요: 확정일자 수수료]\n\n임대차 신고를 하면 확정일자는 따로 안 받아도 될까?\n\n보증금이 6천만 원을 넘거나 월 차임이 30만 원을 넘는 주택 임대차 계약은 계약 체결일부터 30일 이내에 신고해야 하는 제도가 있어요. 임대인과 임차인이 함께 신고하는 게 원칙이고, 계약서를 첨부해 신고하면 확정일자가 부여된 것으로 본다고 해요. 그래서 전입신고 단계에서 임대차계약서를 냈거나 계약서를 붙여 임대차 신고를 했다면 확정일자 신청은 따로 하지 않아도 된다고 정부24는 안내하고 있어요.\n\n주의할 점이 두 가지 있어요.\n- 임대차 신고와 전입신고는 다른 절차예요. 대항력의 요건인 주민등록은 전입신고로 갖춰요.\n- 이 신고제가 적용되는 지역에서 제외되는 곳(경기도 외 도 관할 군 지역)이 있다고 정부24에 적혀 있어요. 내가 사는 곳이 해당하는지는 직접 확인해야 해요. [확인 필요: 신고 대상 지역 범위]\n\n계약 전후에 알아 두면 좋은 것\n\n기존 세입자가 있는 집이라면 전입세대확인서로 그 집에 누가 언제 전입했는지 볼 수 있어요. 이 서류는 읍·면·동 주민센터에서만 발급되고 온라인 열람·교부는 안 된다고 해요. 임차인이 부동산거래관리시스템에서 확정일자를 받은 사실로 임차인 여부 확인에 동의하면 계약서 없이도 전입 세대를 확인할 수 있다는 설명도 있어요.\n\n한눈에 정리\n\n- 전입신고: 전입일부터 14일 이내, 정부24 온라인 신청 가능\n- 대항력: 입주 + 전입신고를 마친 다음 날 0시부터\n- 우선변제권: 대항력 + 확정일자, 임대차 신고 시 확정일자가 부여된 것으로 봄\n\n계약 내용에 따른 개별 판단은 달라질 수 있으니 분쟁이 걱정되는 경우에는 전문가 상담이나 공식 창구에서 한 번 더 확인해 주세요.", "copyAll": "이삿짐을 풀고 나면 정리할 게 산더미라 서류 일은 자꾸 뒤로 밀리기 쉬워요. 그런데 전입신고와 확정일자는 세입자가 보증금을 지키는 데 쓰이는 기본 절차라서 순서와 기한을 알아 두면 좋아요. 정부24와 찾기쉬운 생활법령정보 안내를 바탕으로 정리했습니다. 법률 상담이 아니라 제도 안내예요. (2026년 10월 5일 기준)\n\n전입신고는 언제까지, 어디서 하나요?\n\n거주지를 옮기면 전입한 날부터 14일 이내에 새 거주지 관할 기관에 신고해야 해요. 정부24의 '전입신고+'를 이용하면 직접 방문하지 않고 온라인으로 신청할 수 있고, 요금 감면 대상자는 신청서에서 통합 신청에 동의하면 전입신고와 감면 신청을 한 번에 할 수 있다고 안내돼 있어요.\n\n대항력은 무엇이고 언제 생길까요?\n\n임차인이 ① 주택의 인도(실제 입주)와 ② 주민등록을 마치면 그 다음 날부터 제3자에게도 임차권을 주장할 수 있는 힘이 생기는데, 이것을 대항력이라고 해요. 전입신고를 한 때 주민등록이 된 것으로 보고(주택임대차보호법 제3조 제1항), 여기서 '다음 날'은 오전 0시라고 해설돼 있어요.\n\n가상의 예를 들어 볼게요. 10월 20일에 입주하고 21일 오후 3시에 전입신고를 했다면 대항력은 22일 오전 0시부터 생겨요. 신고를 며칠 미룰수록 그만큼 대항력이 늦어지는 셈이에요.\n\n우선변제권은 확정일자가 더해져야 해요\n\n대항력을 갖추고 임대차계약서에 확정일자까지 받으면 집이 경매나 공매로 넘어갈 때 후순위 권리자나 다른 채권자보다 먼저 보증금을 돌려받을 수 있는 권리가 생겨요(같은 법 제3조의2). 확정일자는 주택 소재지의 행정복지센터나 등기소, 대법원 인터넷등기소, 또는 주택 임대차 계약 신고를 통해 받을 수 있어요. 정부24 안내에는 인터넷등기소 또는 이사 간 곳 관할 주민센터가 소개돼 있어요. 확정일자 수수료 금액은 확인하지 못했어요. [확인 필요: 확정일자 수수료]\n\n임대차 신고를 하면 확정일자는 따로 안 받아도 될까?\n\n보증금이 6천만 원을 넘거나 월 차임이 30만 원을 넘는 주택 임대차 계약은 계약 체결일부터 30일 이내에 신고해야 하는 제도가 있어요. 임대인과 임차인이 함께 신고하는 게 원칙이고, 계약서를 첨부해 신고하면 확정일자가 부여된 것으로 본다고 해요. 그래서 전입신고 단계에서 임대차계약서를 냈거나 계약서를 붙여 임대차 신고를 했다면 확정일자 신청은 따로 하지 않아도 된다고 정부24는 안내하고 있어요.\n\n주의할 점이 두 가지 있어요.\n- 임대차 신고와 전입신고는 다른 절차예요. 대항력의 요건인 주민등록은 전입신고로 갖춰요.\n- 이 신고제가 적용되는 지역에서 제외되는 곳(경기도 외 도 관할 군 지역)이 있다고 정부24에 적혀 있어요. 내가 사는 곳이 해당하는지는 직접 확인해야 해요. [확인 필요: 신고 대상 지역 범위]\n\n계약 전후에 알아 두면 좋은 것\n\n기존 세입자가 있는 집이라면 전입세대확인서로 그 집에 누가 언제 전입했는지 볼 수 있어요. 이 서류는 읍·면·동 주민센터에서만 발급되고 온라인 열람·교부는 안 된다고 해요. 임차인이 부동산거래관리시스템에서 확정일자를 받은 사실로 임차인 여부 확인에 동의하면 계약서 없이도 전입 세대를 확인할 수 있다는 설명도 있어요.\n\n한눈에 정리\n\n- 전입신고: 전입일부터 14일 이내, 정부24 온라인 신청 가능\n- 대항력: 입주 + 전입신고를 마친 다음 날 0시부터\n- 우선변제권: 대항력 + 확정일자, 임대차 신고 시 확정일자가 부여된 것으로 봄\n\n계약 내용에 따른 개별 판단은 달라질 수 있으니 분쟁이 걱정되는 경우에는 전문가 상담이나 공식 창구에서 한 번 더 확인해 주세요.\n\n이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 주세요. 네이버"}, {"id": "011", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "011_energy-voucher-winter.md", "title": "겨울철 에너지바우처, 내가 대상일까? 3단계로 확인하고 12월 31일 전에 신청하세요", "cands": ["에너지바우처 2026년 지원금액과 사용기간, 동절기 사용법까지 정리", "난방비 걱정 시작되는 계절, 에너지바우처 대상 여부 3단계 체크", "에너지바우처 가상카드와 실물카드, 무엇이 다를까? (2026년 동절기)"], "cat": "복지·지원금", "kw": ["에너지바우처", "동절기", "난방비 지원", "에너지취약계층", "복지로"], "summary": "2026년 에너지바우처의 대상 조건, 세대 규모별 금액, 신청기간, 동절기 사용 방식을 3단계 체크리스트로 정리", "status": "초안", "created": "2026-10-05 12:24", "base": "2026-10-05", "need": 1, "chars": 1623, "chars_ns": 1273, "imgs": 0, "slots": 0, "html": "<p>아침저녁으로 쌀쌀해지면 슬슬 난방비 걱정이 시작되죠. 에너지바우처는 에너지 취약계층의 냉·난방비를 지원하는 제도인데, 올해는 동절기 사용이 10월부터 시작돼서 대상인지 먼저 확인해 보는 게 좋아요. 기후에너지환경부 정책브리핑과 에너지바우처 누리집 안내를 기준으로 세 단계로 나눠 봤습니다. (2026년 10월 5일 기준)<\/p>\n<h3>1단계. 소득 기준부터<\/h3>\n<p>국민기초생활보장법에 따른 생계급여, 의료급여, 주거급여, 교육급여 수급자여야 해요. 이 조건이 기본이고, 다음 단계의 조건도 함께 충족해야 한다고 안내되어 있어요.<\/p>\n<h3>2단계. 세대원 특성 기준<\/h3>\n<p>주민등록등본상 본인이나 세대원 중 한 명이라도 아래에 해당해야 해요.<\/p>\n<ul><li>노인: 1961년 12월 31일 이전 출생<\/li><li>영유아: 2019년 1월 1일 이후 출생한 7세 이하 취학 전 아동<\/li><li>장애인: 장애인복지법에 따라 등록한 사람<\/li><li>임산부: 임신 중이거나 분만 후 6개월 미만인 여성<\/li><li>중증질환자, 희귀질환자, 중증난치질환자<\/li><li>한부모가족, 소년소녀가정<\/li><li>다자녀 세대: 부 또는 모와 함께 사는 19세 미만 자녀가 2명 이상<\/li><\/ul>\n<p>세대원 모두가 보장시설에서 급여를 받는 경우는 지원에서 제외된다고 해요.<\/p>\n<h3>3단계. 신청과 금액<\/h3>\n<p>신청 기간은 2026년 6월 15일부터 12월 31일까지예요. 읍·면·동 행정복지센터를 방문하거나 복지로에서 신청할 수 있고, 거동이 불편하면 대리 신청이나 공무원의 직권 신청도 가능해요. 문의는 에너지바우처 통합센터(1600-3190)에서 받아요.<\/p>\n<p>지원 금액은 세대원 수에 따라 달라요. 아래 금액은 올해 총액이고 월별 금액이 아니에요.<\/p>\n<div class=\"tw\"><table><thead><tr><th>세대원 수<\/th><th>총 지원금액<\/th><\/tr><\/thead><tbody><tr><td>1인<\/td><td>295,200원<\/td><\/tr><tr><td>2인<\/td><td>407,500원<\/td><\/tr><tr><td>3인<\/td><td>532,700원<\/td><\/tr><tr><td>4인 이상<\/td><td>701,300원<\/td><\/tr><\/tbody><\/table><\/div>\n<p>사용기간은 하절기와 동절기 구분 없이 2026년 7월 1일부터 2027년 5월 31일까지 자유롭게 쓸 수 있어요. 에너지바우처 지원금은 수급자의 소득 산정에는 반영되지 않는다고 안내돼 있어요.<\/p>\n<h3>겨울에는 어떻게 쓰나요?<\/h3>\n<div class=\"tw\"><table><thead><tr><th>방식<\/th><th>사용 시작<\/th><th>사용 가능한 에너지<\/th><\/tr><\/thead><tbody><tr><td>가상카드(요금 차감)<\/td><td>10월 1일<\/td><td>전기, 도시가스, 지역난방 중 택1<\/td><\/tr><tr><td>실물카드(국민행복카드)<\/td><td>10월 3일<\/td><td>전기, 도시가스, 등유, LPG, 연탄<\/td><\/tr><\/tbody><\/table><\/div>\n<p>둘 다 종료일은 2027년 5월 31일이에요. 가상카드는 발행되는 요금 고지서에서 금액이 차감되는 방식이라고 해요. 신청 시점에 따라 동절기 지원이 언제부터 반영되는지는 안내에서 확인하지 못했어요. <mark class=\"need\">[확인 필요: 10월 이후 신청 시 반영 시기]<\/mark><\/p>\n<h3>중복 지원은 안 돼요<\/h3>\n<p>같은 겨울에 긴급복지지원법에 따른 동절기 연료비(2026년 10월~2027년 3월), 한국광해광업공단의 연탄쿠폰, 연탄전환 에너지바우처를 받은 세대는 동절기 에너지바우처를 중복해서 받을 수 없다고 안내돼 있어요. 이미 다른 지원을 받고 있다면 읍·면·동 행정복지센터에서 어떻게 조정되는지 먼저 물어보세요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>수급자 조건과 세대원 특성 조건을 모두 충족해야 신청 가능<\/li><li>신청은 12월 31일까지, 사용은 2027년 5월 31일까지<\/li><li>가상카드는 요금 차감, 실물카드는 국민행복카드로 에너지 구입<\/li><\/ul>\n<p>대상과 금액은 해마다 달라지니 신청 전에 복지로나 에너지바우처 누리집에서 한 번 더 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래<\/td><td>에너지바우처 누리집(energyv.or.kr) 첫 화면 직접 캡처<\/td><td>공개 화면만, 캡처일 표기<\/td><\/tr><tr><td>금액 표 아래<\/td><td>복지로 신청 메뉴 화면<\/td><td>본인 신청 화면은 개인정보가 많으니 로그인 전 공개 화면만<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 10월 이후 신청한 경우 동절기 지원이 언제부터 반영되는지 에너지바우처 통합센터(1600-3190) 또는 누리집 FAQ에서 확인하고 <mark class=\"need\">[확인 필요]<\/mark> 문장 대체<\/li><li class=\"cb\">☐ 연탄쿠폰 등 중복 조건 문장은 누리집 '지원금액' 각주(일부 금액만 지원되는 경우)와 어긋나지 않는지 확인<\/li><li class=\"cb\">☐ 소관 부처 표기(기후에너지환경부)가 발행 시점에도 맞는지 확인<\/li><li class=\"cb\">☐ 개인 신청 경험이 없다면 경험 문장을 쓰지 않기<\/li><li class=\"cb\">☐ 정책브리핑 카드뉴스 문장(공공누리 4유형)을 그대로 옮기지 않았는지 훑어보기<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>신청 대상, 신청 장소·기간, 금액, 사용 방식<\/td><td>대한민국 정책브리핑 정책뉴스(기후에너지환경부, 2026-06-17) <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148966678\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyNewsView.do?newsId=148966678<\/a><\/td><td>공식<\/td><\/tr><tr><td>세대원 특성 세부 기준, 사용기간(7.1~2027.5.31), 소득 산정 미반영, 중복 지원 불가 사업<\/td><td>에너지바우처 누리집 <a href=\"https://www.energyv.or.kr/info/support_info.do\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.energyv.or.kr/info/support_info.do<\/a><\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "아침저녁으로 쌀쌀해지면 슬슬 난방비 걱정이 시작되죠. 에너지바우처는 에너지 취약계층의 냉·난방비를 지원하는 제도인데, 올해는 동절기 사용이 10월부터 시작돼서 대상인지 먼저 확인해 보는 게 좋아요. 기후에너지환경부 정책브리핑과 에너지바우처 누리집 안내를 기준으로 세 단계로 나눠 봤습니다. (2026년 10월 5일 기준)\n\n1단계. 소득 기준부터\n\n국민기초생활보장법에 따른 생계급여, 의료급여, 주거급여, 교육급여 수급자여야 해요. 이 조건이 기본이고, 다음 단계의 조건도 함께 충족해야 한다고 안내되어 있어요.\n\n2단계. 세대원 특성 기준\n\n주민등록등본상 본인이나 세대원 중 한 명이라도 아래에 해당해야 해요.\n\n- 노인: 1961년 12월 31일 이전 출생\n- 영유아: 2019년 1월 1일 이후 출생한 7세 이하 취학 전 아동\n- 장애인: 장애인복지법에 따라 등록한 사람\n- 임산부: 임신 중이거나 분만 후 6개월 미만인 여성\n- 중증질환자, 희귀질환자, 중증난치질환자\n- 한부모가족, 소년소녀가정\n- 다자녀 세대: 부 또는 모와 함께 사는 19세 미만 자녀가 2명 이상\n\n세대원 모두가 보장시설에서 급여를 받는 경우는 지원에서 제외된다고 해요.\n\n3단계. 신청과 금액\n\n신청 기간은 2026년 6월 15일부터 12월 31일까지예요. 읍·면·동 행정복지센터를 방문하거나 복지로에서 신청할 수 있고, 거동이 불편하면 대리 신청이나 공무원의 직권 신청도 가능해요. 문의는 에너지바우처 통합센터(1600-3190)에서 받아요.\n\n지원 금액은 세대원 수에 따라 달라요. 아래 금액은 올해 총액이고 월별 금액이 아니에요.\n\n• 1인 — 총 지원금액: 295,200원\n• 2인 — 총 지원금액: 407,500원\n• 3인 — 총 지원금액: 532,700원\n• 4인 이상 — 총 지원금액: 701,300원\n\n사용기간은 하절기와 동절기 구분 없이 2026년 7월 1일부터 2027년 5월 31일까지 자유롭게 쓸 수 있어요. 에너지바우처 지원금은 수급자의 소득 산정에는 반영되지 않는다고 안내돼 있어요.\n\n겨울에는 어떻게 쓰나요?\n\n• 가상카드(요금 차감) — 사용 시작: 10월 1일 / 사용 가능한 에너지: 전기, 도시가스, 지역난방 중 택1\n• 실물카드(국민행복카드) — 사용 시작: 10월 3일 / 사용 가능한 에너지: 전기, 도시가스, 등유, LPG, 연탄\n\n둘 다 종료일은 2027년 5월 31일이에요. 가상카드는 발행되는 요금 고지서에서 금액이 차감되는 방식이라고 해요. 신청 시점에 따라 동절기 지원이 언제부터 반영되는지는 안내에서 확인하지 못했어요. [확인 필요: 10월 이후 신청 시 반영 시기]\n\n중복 지원은 안 돼요\n\n같은 겨울에 긴급복지지원법에 따른 동절기 연료비(2026년 10월~2027년 3월), 한국광해광업공단의 연탄쿠폰, 연탄전환 에너지바우처를 받은 세대는 동절기 에너지바우처를 중복해서 받을 수 없다고 안내돼 있어요. 이미 다른 지원을 받고 있다면 읍·면·동 행정복지센터에서 어떻게 조정되는지 먼저 물어보세요.\n\n한눈에 정리\n\n- 수급자 조건과 세대원 특성 조건을 모두 충족해야 신청 가능\n- 신청은 12월 31일까지, 사용은 2027년 5월 31일까지\n- 가상카드는 요금 차감, 실물카드는 국민행복카드로 에너지 구입\n\n대상과 금액은 해마다 달라지니 신청 전에 복지로나 에너지바우처 누리집에서 한 번 더 확인해 주세요.", "copyAll": "아침저녁으로 쌀쌀해지면 슬슬 난방비 걱정이 시작되죠. 에너지바우처는 에너지 취약계층의 냉·난방비를 지원하는 제도인데, 올해는 동절기 사용이 10월부터 시작돼서 대상인지 먼저 확인해 보는 게 좋아요. 기후에너지환경부 정책브리핑과 에너지바우처 누리집 안내를 기준으로 세 단계로 나눠 봤습니다. (2026년 10월 5일 기준)\n\n1단계. 소득 기준부터\n\n국민기초생활보장법에 따른 생계급여, 의료급여, 주거급여, 교육급여 수급자여야 해요. 이 조건이 기본이고, 다음 단계의 조건도 함께 충족해야 한다고 안내되어 있어요.\n\n2단계. 세대원 특성 기준\n\n주민등록등본상 본인이나 세대원 중 한 명이라도 아래에 해당해야 해요.\n\n- 노인: 1961년 12월 31일 이전 출생\n- 영유아: 2019년 1월 1일 이후 출생한 7세 이하 취학 전 아동\n- 장애인: 장애인복지법에 따라 등록한 사람\n- 임산부: 임신 중이거나 분만 후 6개월 미만인 여성\n- 중증질환자, 희귀질환자, 중증난치질환자\n- 한부모가족, 소년소녀가정\n- 다자녀 세대: 부 또는 모와 함께 사는 19세 미만 자녀가 2명 이상\n\n세대원 모두가 보장시설에서 급여를 받는 경우는 지원에서 제외된다고 해요.\n\n3단계. 신청과 금액\n\n신청 기간은 2026년 6월 15일부터 12월 31일까지예요. 읍·면·동 행정복지센터를 방문하거나 복지로에서 신청할 수 있고, 거동이 불편하면 대리 신청이나 공무원의 직권 신청도 가능해요. 문의는 에너지바우처 통합센터(1600-3190)에서 받아요.\n\n지원 금액은 세대원 수에 따라 달라요. 아래 금액은 올해 총액이고 월별 금액이 아니에요.\n\n• 1인 — 총 지원금액: 295,200원\n• 2인 — 총 지원금액: 407,500원\n• 3인 — 총 지원금액: 532,700원\n• 4인 이상 — 총 지원금액: 701,300원\n\n사용기간은 하절기와 동절기 구분 없이 2026년 7월 1일부터 2027년 5월 31일까지 자유롭게 쓸 수 있어요. 에너지바우처 지원금은 수급자의 소득 산정에는 반영되지 않는다고 안내돼 있어요.\n\n겨울에는 어떻게 쓰나요?\n\n• 가상카드(요금 차감) — 사용 시작: 10월 1일 / 사용 가능한 에너지: 전기, 도시가스, 지역난방 중 택1\n• 실물카드(국민행복카드) — 사용 시작: 10월 3일 / 사용 가능한 에너지: 전기, 도시가스, 등유, LPG, 연탄\n\n둘 다 종료일은 2027년 5월 31일이에요. 가상카드는 발행되는 요금 고지서에서 금액이 차감되는 방식이라고 해요. 신청 시점에 따라 동절기 지원이 언제부터 반영되는지는 안내에서 확인하지 못했어요. [확인 필요: 10월 이후 신청 시 반영 시기]\n\n중복 지원은 안 돼요\n\n같은 겨울에 긴급복지지원법에 따른 동절기 연료비(2026년 10월~2027년 3월), 한국광해광업공단의 연탄쿠폰, 연탄전환 에너지바우처를 받은 세대는 동절기 에너지바우처를 중복해서 받을 수 없다고 안내돼 있어요. 이미 다른 지원을 받고 있다면 읍·면·동 행정복지센터에서 어떻게 조정되는지 먼저 물어보세요.\n\n한눈에 정리\n\n- 수급자 조건과 세대원 특성 조건을 모두 충족해야 신청 가능\n- 신청은 12월 31일까지, 사용은 2027년 5월 31일까지\n- 가상카드는 요금 차감, 실물카드는 국민행복카드로 에너지 구입\n\n대상과 금액은 해마다 달라지 aver", "sub": "naver", "subLabel": "네이버", "file": "010_driver-license-renewal.md", "title": "운전면허 적성검사·갱신 기간, 올해부터 '생일 전후 6개월'로 바뀌었어요", "cands": ["면허증에 적힌 갱신 기간이 틀릴 수 있다고요? 2026년 운전면허 갱신 기간 계산법", "운전면허 갱신·적성검사 한 번에 정리: 대상, 준비물, 수수료, 놓쳤을 때 과태료", "1종은 적성검사, 2종은 갱신? 헷갈리는 운전면허 갱신 규칙 (2026년 기준)"], "cat": "자동차·운전", "kw": ["운전면허 갱신", "적성검사", "도로교통법 개정", "생일 전후 6개월", "안전운전 통합민원"], "summary": "2026년 1월부터 생일 전후 6개월로 바뀐 운전면허 갱신·적성검사 기간과 대상, 준비물, 수수료, 놓쳤을 때의 과태료를 정리", "status": "초안", "created": "2026-10-05 12:23", "base": "2026-10-05", "need": 1, "chars": 1954, "chars_ns": 1509, "imgs": 0, "slots": 0, "html": "<p>운전면허증 뒷면에 적힌 갱신 기간, 그대로 믿고 계셨나요? 2026년 1월 1일부터 도로교통법이 바뀌어서, 예전 면허증에 표시된 기간과 법에서 정한 실제 기간이 다를 수 있어요. 한국도로교통공단 안내를 기준으로 달라진 점과 챙길 것을 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<h3>무엇이 바뀌었을까?<\/h3>\n<p>예전에는 갱신 대상이 되는 해의 1월 1일부터 12월 31일까지가 기간이었어요. 개정 후에는 갱신 대상이 되는 해의 생일을 기준으로 앞뒤 6개월씩, 모두 1년이에요. 공단은 연말에 시험장이 붐비는 현상을 줄이고 본인의 기한을 쉽게 알 수 있게 하려는 취지라고 설명했어요.<\/p>\n<p>다만 혼란을 막으려고 법 부칙에서 개정 전 면허 소지자의 첫 갱신에는 예전 기간도 함께 인정해 준다고 해요. 공단이 든 예시를 보면, 생일이 10월 1일인 올해 대상자는 개정 기준으로 2026년 4월 2일부터 2027년 4월 1일까지이고, 예전 기간까지 합치면 2026년 1월 1일부터 2027년 4월 1일까지 가능해요.<\/p>\n<p>정확한 내 기간은 안전운전 통합민원(safedriving.or.kr) 마이페이지나 경찰청 교통민원24(efine.go.kr)에서 확인하라고 안내돼 있어요.<\/p>\n<h3>나는 적성검사일까, 갱신일까?<\/h3>\n<div class=\"tw\"><table><thead><tr><th>구분<\/th><th>해야 하는 것<\/th><th>참고<\/th><\/tr><\/thead><tbody><tr><td>1종 면허<\/td><td>정기 적성검사<\/td><td>신체검사 필요<\/td><\/tr><tr><td>2종 면허(70세 미만)<\/td><td>면허 갱신<\/td><td>신체검사 불필요<\/td><\/tr><tr><td>70세 이상 2종 면허<\/td><td>적성검사<\/td><td>갱신 때 적성검사 의무<\/td><\/tr><\/tbody><\/table><\/div>\n<p>주기는 2011년 12월 9일 이후 취득·갱신한 분이 10년, 65세 이상이면 5년, 75세 이상이면 3년이에요. 75세 이상은 고령운전자 교육 대상이라는 점도 함께 안내돼 있어요.<\/p>\n<h3>어디서 무엇을 준비할까?<\/h3>\n<ul><li>장소: 전국 운전면허시험장이나 경찰서 교통민원실이에요. 강남경찰서는 이 업무를 하지 않아서 강남면허시험장을 이용해야 해요.<\/li><li>준비물: 운전면허증과 6개월 이내 촬영한 3.5×4.5cm 컬러 사진이에요. 1종 적성검사는 2매, 건강검진 결과나 진단서로 신체검사를 대신하면 1매, 2종 갱신은 1매로 안내돼 있어요.<\/li><li>수수료: 적성검사는 일반 16,000원, 모바일 IC 21,000원이고 신체검사비는 별도예요. 2종 갱신은 일반 10,000원, 모바일 IC 15,000원이에요. 시험장 안의 신체검사비는 1종 대형·특수 8,000원, 그 밖의 면허 7,000원이라고 해요. <mark class=\"need\">[확인 필요: 방문 전 공단 안내의 최신 수수료]<\/mark><\/li><li>신체검사 대신: 국민건강보험공단 건강검진 결과가 신청일 2년 이내라면 행정정보공동이용 동의로 갈음할 수 있어요(1종 보통·2종). 검진 후 약 15일 뒤부터 자료가 제공된다고 해요.<\/li><\/ul>\n<h3>기간을 놓치면 어떻게 될까?<\/h3>\n<div class=\"tw\"><table><thead><tr><th>상황<\/th><th>과태료<\/th><th>그 밖의 내용<\/th><\/tr><\/thead><tbody><tr><td>1종 적성검사 기간 경과<\/td><td>3만 원<\/td><td>만료일 다음 날부터 1년이 지나면 면허취소<\/td><\/tr><tr><td>2종 갱신 기간 경과<\/td><td>2만 원<\/td><td>갱신 미필 사유의 정지·취소 처분은 2011.12.9. 이후 폐지<\/td><\/tr><tr><td>70세 이상 2종 적성검사 대상<\/td><td>3만 원<\/td><td>만료일 다음 날부터 1년이 지나면 면허취소(면허증에 '적성검사 기간'이라고 표시된 경우)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>과태료를 내지 않으면 가산금 3%에 매달 중가산금 1.2%가 붙어 최대 75%까지 늘어난다고 공단이 안내하고 있어요.<\/p>\n<h3>사정이 있을 때는 연기 신청<\/h3>\n<p>해외 체류, 입원, 군 입대, 수감처럼 기간 안에 갱신하기 어려운 사유가 있으면 연기 신청이 가능하고, 사유가 없어진 날부터 3개월 안에 갱신하면 된다고 해요. 입원이면 퇴원일, 해외 출국이면 귀국일이 기준이에요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>기간은 갱신 대상 해의 생일 전후 6개월, 개정 전 면허는 예전 기간도 함께 인정<\/li><li>1종과 70세 이상 2종은 적성검사, 그 외 2종은 갱신<\/li><li>놓치면 과태료 2만~3만 원, 1년을 넘기면 취소될 수 있는 경우가 있음<\/li><\/ul>\n<p>수수료와 절차는 바뀔 수 있으니 방문 전에 공단 고객센터(1577-1120)나 안전운전 통합민원에서 다시 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래<\/td><td>안전운전 통합민원 '정기적성검사/면허갱신' 안내 화면 직접 캡처<\/td><td>공개 안내 화면만. 마이페이지 화면은 개인정보가 있어 캡처 금지<\/td><\/tr><tr><td>준비물 문단<\/td><td>직접 찍은 면허시험장 안내 표지판 등(있는 경우)<\/td><td>사람 얼굴·차량번호 제외<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 수수료(적성검사·갱신·신체검사비)를 공단 안내 화면에서 다시 확인하고 <mark class=\"need\">[확인 필요]<\/mark> 문장 정리<\/li><li class=\"cb\">☐ 안전운전 통합민원 안내의 과태료·취소 문구가 본문 표와 같은지 확인<\/li><li class=\"cb\">☐ 본인 갱신을 직접 해 본 경험이 있을 때만 경험 문장 추가 (없으면 공식 안내 기준 유지)<\/li><li class=\"cb\">☐ 도로교통법상 과태료 상한(20만 원 이하 등)과 공단의 실제 안내 금액을 혼동해서 쓰지 않기. 본문은 공단 안내 금액만 사용<\/li><li class=\"cb\">☐ 자신의 면허 번호·갱신 기간이 보이는 화면은 공개하지 않기<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>대상, 주기, 신청 장소, 준비물, 수수료, 건강검진내역서 활용, 과태료·취소·가산금, 연기 신청<\/td><td>한국도로교통공단 안전운전 통합민원 <a href=\"https://www.safedriving.or.kr/guide/larGuide011.do?menuCode=MN-PO-1211\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.safedriving.or.kr/guide/larGuide011.do?menuCode=MN-PO-1211<\/a><\/td><td>공식<\/td><\/tr><tr><td>생일 전후 6개월 개정 취지, 예시(생일 10월 1일)<\/td><td>연합뉴스 2026-01-12(공단 발표 인용) <a href=\"https://www.yna.co.kr/view/AKR20260112056000062\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.yna.co.kr/view/AKR20260112056000062<\/a><\/td><td>언론(공식 발표 인용)<\/td><\/tr><tr><td>법적 근거 (도로교통법 제87조)<\/td><td>국가법령정보센터 <a href=\"https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1025450551\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1025450551<\/a><\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "운전면허증 뒷면에 적힌 갱신 기간, 그대로 믿고 계셨나요? 2026년 1월 1일부터 도로교통법이 바뀌어서, 예전 면허증에 표시된 기간과 법에서 정한 실제 기간이 다를 수 있어요. 한국도로교통공단 안내를 기준으로 달라진 점과 챙길 것을 정리했습니다. (2026년 10월 5일 기준)\n\n무엇이 바뀌었을까?\n\n예전에는 갱신 대상이 되는 해의 1월 1일부터 12월 31일까지가 기간이었어요. 개정 후에는 갱신 대상이 되는 해의 생일을 기준으로 앞뒤 6개월씩, 모두 1년이에요. 공단은 연말에 시험장이 붐비는 현상을 줄이고 본인의 기한을 쉽게 알 수 있게 하려는 취지라고 설명했어요.\n\n다만 혼란을 막으려고 법 부칙에서 개정 전 면허 소지자의 첫 갱신에는 예전 기간도 함께 인정해 준다고 해요. 공단이 든 예시를 보면, 생일이 10월 1일인 올해 대상자는 개정 기준으로 2026년 4월 2일부터 2027년 4월 1일까지이고, 예전 기간까지 합치면 2026년 1월 1일부터 2027년 4월 1일까지 가능해요.\n\n정확한 내 기간은 안전운전 통합민원(safedriving.or.kr) 마이페이지나 경찰청 교통민원24(efine.go.kr)에서 확인하라고 안내돼 있어요.\n\n나는 적성검사일까, 갱신일까?\n\n• 1종 면허 — 해야 하는 것: 정기 적성검사 / 참고: 신체검사 필요\n• 2종 면허(70세 미만) — 해야 하는 것: 면허 갱신 / 참고: 신체검사 불필요\n• 70세 이상 2종 면허 — 해야 하는 것: 적성검사 / 참고: 갱신 때 적성검사 의무\n\n주기는 2011년 12월 9일 이후 취득·갱신한 분이 10년, 65세 이상이면 5년, 75세 이상이면 3년이에요. 75세 이상은 고령운전자 교육 대상이라는 점도 함께 안내돼 있어요.\n\n어디서 무엇을 준비할까?\n\n- 장소: 전국 운전면허시험장이나 경찰서 교통민원실이에요. 강남경찰서는 이 업무를 하지 않아서 강남면허시험장을 이용해야 해요.\n- 준비물: 운전면허증과 6개월 이내 촬영한 3.5×4.5cm 컬러 사진이에요. 1종 적성검사는 2매, 건강검진 결과나 진단서로 신체검사를 대신하면 1매, 2종 갱신은 1매로 안내돼 있어요.\n- 수수료: 적성검사는 일반 16,000원, 모바일 IC 21,000원이고 신체검사비는 별도예요. 2종 갱신은 일반 10,000원, 모바일 IC 15,000원이에요. 시험장 안의 신체검사비는 1종 대형·특수 8,000원, 그 밖의 면허 7,000원이라고 해요. [확인 필요: 방문 전 공단 안내의 최신 수수료]\n- 신체검사 대신: 국민건강보험공단 건강검진 결과가 신청일 2년 이내라면 행정정보공동이용 동의로 갈음할 수 있어요(1종 보통·2종). 검진 후 약 15일 뒤부터 자료가 제공된다고 해요.\n\n기간을 놓치면 어떻게 될까?\n\n• 1종 적성검사 기간 경과 — 과태료: 3만 원 / 그 밖의 내용: 만료일 다음 날부터 1년이 지나면 면허취소\n• 2종 갱신 기간 경과 — 과태료: 2만 원 / 그 밖의 내용: 갱신 미필 사유의 정지·취소 처분은 2011.12.9. 이후 폐지\n• 70세 이상 2종 적성검사 대상 — 과태료: 3만 원 / 그 밖의 내용: 만료일 다음 날부터 1년이 지나면 면허취소(면허증에 '적성검사 기간'이라고 표시된 경우)\n\n과태료를 내지 않으면 가산금 3%에 매달 중가산금 1.2%가 붙어 최대 75%까지 늘어난다고 공단이 안내하고 있어요.\n\n사정이 있을 때는 연기 신청\n\n해외 체류, 입원, 군 입대, 수감처럼 기간 안에 갱신하기 어려운 사유가 있으면 연기 신청이 가능하고, 사유가 없어진 날부터 3개월 안에 갱신하면 된다고 해요. 입원이면 퇴원일, 해외 출국이면 귀국일이 기준이에요.\n\n한눈에 정리\n\n- 기간은 갱신 대상 해의 생일 전후 6개월, 개정 전 면허는 예전 기간도 함께 인정\n- 1종과 70세 이상 2종은 적성검사, 그 외 2종은 갱신\n- 놓치면 과태료 2만~3만 원, 1년을 넘기면 취소될 수 있는 경우가 있음\n\n수수료와 절차는 바뀔 수 있으니 방문 전에 공단 고객센터(1577-1120)나 안전운전 통합민원에서 다시 확인해 주세요.", "copyAll": "운전면허증 뒷면에 적힌 갱신 기간, 그대로 믿고 계셨나요? 2026년 1월 1일부터 도로교통법이 바뀌어서, 예전 면허증에 표시된 기간과 법에서 정한 실제 기간이 다를 수 있어요. 한국도로교통공단 안내를 기준으로 달라진 점과 챙길 것을 정리했습니다. (2026년 10월 5일 기준)\n\n무엇이 바뀌었을까?\n\n예전에는 갱신 대상이 되는 해의 1월 1일부터 12월 31일까지가 기간이었어요. 개정 후에는 갱신 대상이 되는 해의 생일을 기준으로 앞뒤 6개월씩, 모두 1년이에요. 공단은 연말에 시험장이 붐비는 현상을 줄이고 본인의 기한을 쉽게 알 수 있게 하려는 취지라고 설명했어요.\n\n다만 혼란을 막으려고 법 부칙에서 개정 전 면허 소지자의 첫 갱신에는 예전 기간도 함께 인정해 준다고 해요. 공단이 든 예시를 보면, 생일이 10월 1일인 올해 대상자는 개정 기준으로 2026년 4월 2일부터 2027년 4월 1일까지이고, 예전 기간까지 합치면 2026년 1월 1일부터 2027년 4월 1일까지 가능해요.\n\n정확한 내 기간은 안전운전 통합민원(safedriving.or.kr) 마이페이지나 경찰청 교통민원24(efine.go.kr)에서 확인하라고 안내돼 있어요.\n\n나는 적성검사일까, 갱신일까?\n\n• 1종 면허 — 해야 하는 것: 정기 적성검사 / 참고: 신체검사 필요\n• 2종 면허(70세 미만) — 해야 하는 것: 면허 갱신 / 참고: 신체검사 불필요\n• 70세 예시를 보면, 생일이 10월 1일인 올해 대상자는 개정 기준으로 2026년 4월 2일부터 2027년 4월 1일까지이고, 예전 기간까지 합치면 2026년 1월 1일부터 2027년 4월 1일까지 가능해요. 정확한 내 기간은 안전운전 통합민원(safedriving.or.kr) 마이페이지나 경찰청 교통민원24(efine.go.kr)에서 확인하라고 안내돼 있어요. 나는 적성검사일까, 갱신일까? • 1종 면허 — 해야 하는 것: 정기 적성검사 / 참고: 신체검사 필요 • 2종 면허(70세 미만) — 해야 하는 것: 면허 갱신 / 참고: 신체검사 불필요 • 70세 이상 2종 면허 — 해야 하는 것: 적성검사 / 참고: 갱신 때 적성검사 의무 주기는 2011년 12월 9일 이후 취득·갱신한 분이 10년, 65세 이상이면 5년, 75세 이상이면 3년이에요. 75세 이상은 고령운전자 교육 대상이라는 점도 함께 안내돼 있어요. 어디서 무엇을 준비할까? - 장소: 전국 운전면허시험장이나 경찰서 교통민원실이에요. 강남경찰서는 이 업무를 하지 않아서 강남면허시험장을 이용해야 해요. - 준비물: 운전면허증과 6개월 이내 촬영한 3.5×4.5cm 컬러 사진이에요. 1종 적성검사는 2매, 건강검진 결과나 진단서로 신체검사를 대신하면 1매, 2종 갱신은 1매로 안내돼 있어요. - 수수료: 적성검사는 일반 16,000원, 모바일 IC 21,000원이고 신체검사비는 별도예요. 2종 갱신은 일반 10,000원, 모바일 IC 15,000원이에요. 시험장 안의 신체검사비는 1종 대형·특수 8,000원, 그 밖의 면허 7,000원이라고 해요. [확인 필요: 방문 전 공단 안내의 최신 수수료] - 신체검사 대신: 국민건강보험공단 건강검진 결과가 신청일 2년 이내라면 행정정보공동이용 동의로 갈음할 수 있어요(1종 보통·2종). 검진 후 약 15일 뒤부터 자료가 제공된다고 해요. 기간을 놓치면 어떻게 될까? • 1종 적성검사 기간 경과 — 과태료: 3만 원 / 그 밖의 내용: 만료일 다음 날부터 1년이 지나면 면허취소 • 2종 갱신 기간 경과 — 과태료: 2만 원 / 그 밖의 내용: 갱신 미필 사유의 정지·취소 처분은 2011.12.9. 이후 폐지 • 70세 이상 2종 적성검사 대상 — 과태료: 3만 원 / 그 밖의 내용: 만료일 다음 날부터 1년이 지나면 면허취소(면허증에 '적성검사 기간'이라고 표시된 경우) 과태료를 내지 않으면 가산금 3%에 매달 중가산금 1.2%가 붙어 최대 75%까지 늘어난다고 공단이 안내하고 있어요. 사정이 있을 때는 연기 신청 해외 체류, 입원, 군 입대, 수감처럼 기간 안에 갱신하기 어려운 사유가 있으면 연기 신청이 가능하고, 사유가 없어진 날부터 3개월 안에 갱신하면 된다고 해요. 입원이면 퇴원일, 해외 출국이면 귀국일이 기준이에요. 한눈에 정리 - 기간은 갱신 대상 해의 생일 전후 6개월, 개정 전 면허는 예전 기간도 함께 인정 - 1종과 70세 이상 2종은 적성검사, 그 외 2종은 갱신 - 놓치면 과태료 2만~3만 원, 1년을 넘기면 취소될 수 있는 경우가 있음 수수료와 절차는 바뀔 수 있으니 방문 전에 공단 고객센터(1577-1120)나 안전운전 통합민원에서 다시 확인해 주세요. 네이버"}, {"id": "009", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "009_nps-expected-pension.md", "title": "내 국민연금 나중에 얼마 받을까? '예상연금액 조회'와 '내 연금 알아보기' 차이", "cands": ["국민연금 예상 수령액, 인터넷 예시 말고 내 숫자로 확인하는 두 가지 공식 방법", "국민연금만 볼까, 퇴직연금·개인연금까지 볼까? 연금 조회 서비스 비교 (2026년)", "노령연금은 몇 살부터? 출생연도별 수급 시작 나이와 예상연금 조회 순서"], "cat": "세금·연금", "kw": ["국민연금", "예상연금액", "내 연금 알아보기", "노령연금", "노후준비서비스"], "summary": "국민연금 예상연금액 조회와 노후준비서비스의 '내 연금 알아보기'가 무엇이 다른지, 어떤 가정으로 계산되는지, 수급 시작 나이와 함께 정리", "status": "초안", "created": "2026-10-05 12:22", "base": "2026-10-05", "need": 1, "chars": 1804, "chars_ns": 1404, "imgs": 0, "slots": 0, "html": "<p>국민연금을 나중에 얼마 받는지 검색해 보면 글마다 숫자가 달라서 더 헷갈리죠. 사람마다 가입 기간과 소득이 다르니 당연한 일인데요, 정작 내 숫자를 보여 주는 공식 조회 서비스가 두 갈래라서 어디서 무엇을 볼 수 있는지부터 비교해 봤어요. 국민연금공단과 정부24 안내를 바탕으로 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<h3>두 서비스를 나란히 놓고 보면<\/h3>\n<div class=\"tw\"><table><thead><tr><th>구분<\/th><th>예상연금액 조회<\/th><th>내 연금 알아보기<\/th><\/tr><\/thead><tbody><tr><td>운영<\/td><td>국민연금공단 홈페이지·앱<\/td><td>NPS 중앙노후준비지원센터(csa.nps.or.kr)<\/td><\/tr><tr><td>보여 주는 것<\/td><td>국민연금의 예상 노령연금 (만 60세 이후 받을 금액)<\/td><td>국민연금, 공무원·사학·군인·별정우체국연금, 농지연금, 개인연금, 퇴직연금, 주택연금<\/td><\/tr><tr><td>로그인<\/td><td>공동인증서 등 본인 인증<\/td><td>공동인증서 로그인<\/td><\/tr><tr><td>특이점<\/td><td>소득·가입기간을 직접 넣어 보는 모의계산도 있음<\/td><td>개인연금·퇴직연금은 신청 후 3영업일 뒤부터 조회<\/td><\/tr><\/tbody><\/table><\/div>\n<p>국민연금만 궁금하면 왼쪽, 내가 가진 연금을 한꺼번에 보고 싶다면 오른쪽이 맞아요. 오른쪽은 제3자 정보제공 동의와 개인정보 수집·이용 동의를 거치는 구조라고 안내되어 있어요.<\/p>\n<h3>예상연금액은 어떤 가정으로 계산될까?<\/h3>\n<p>정부24의 서비스 안내에는 다음과 같은 가정이 적혀 있어요.<\/p>\n<ul><li>사업장가입자와 지역(임의)가입자는 지금의 소득으로 만 60세까지 보험료를 낸다고 가정해요.<\/li><li>납부예외 중이거나 자격을 잃은 상태라면 지금까지 낸 내역만으로 계산해요.<\/li><li>결과는 '현재가치 기준'과 '미래가치 기준' 두 가지로 나와요. 미래가치는 소득이 가정된 상승률로 오른다고 보고 연금을 받을 때의 화폐가치로 계산한 값이라 실제 금액과 차이가 날 수 있어요.<\/li><li>법령이 바뀌면 예상 금액도 달라질 수 있어요.<\/li><\/ul>\n<p>상세 조회에서는 부양가족 연금 대상, 지급 희망 연령, 앞으로 낼 소득을 직접 골라 비교해 볼 수 있어요.<\/p>\n<h3>몇 살부터 받을 수 있을까?<\/h3>\n<p>가입 기간이 10년 이상이면 출생연도별 지급개시 연령부터 노령연금을 받을 수 있어요.<\/p>\n<ul><li>1961~1964년생: 63세<\/li><li>1965~1968년생: 64세<\/li><li>1969년생 이후: 65세<\/li><\/ul>\n<p>소득 있는 업무에 종사하지 않는다면 최대 5년 먼저 받는 조기노령연금도 있는데, 청구 연령에 따라 70%에서 99.5%를 받는다고 해요. 반대로 연기연금은 최대 5년까지 늦출 수 있고, 연기한 한 달마다 0.6%가 더해진다고 공단이 안내하고 있어요.<\/p>\n<h3>2026년에는 이런 점도 있어요<\/h3>\n<p>공단 FAQ에는 2025년 연금개혁에 따라 2026년부터 기본연금액 계산식이 달라졌다고 나와요. 그래서 예전 글에 있는 계산 예시는 지금 기준과 다를 수 있어요. 참고로 2025년 12월 기준 가입 20년 이상인 분들의 노령연금 평균 수령액이 월 113만 원 정도라는 통계도 공단이 공개했는데, 내가 받을 금액이 아니라 전체 평균 참고치예요.<\/p>\n<h3>조회하는 순서<\/h3>\n<ol><li>국민연금공단 홈페이지나 '내 곁에 국민연금' 앱에서 본인 인증으로 로그인해요. <mark class=\"need\">[확인 필요: 홈페이지 전자민원 안에서 예상연금액 조회가 놓인 정확한 메뉴 경로]<\/mark><\/li><li>예상연금액을 확인하고, 필요하면 모의계산으로 소득이나 가입 기간을 바꿔 봐요.<\/li><li>퇴직연금·개인연금까지 보고 싶다면 중앙노후준비지원센터에서 '내 연금 알아보기'를 신청하고 3영업일 뒤 다시 들어가 조회해요.<\/li><\/ol>\n<p>문의는 국민연금공단 1355(유료)로 하면 돼요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>국민연금만 보려면 예상연금액 조회, 연금 전체를 보려면 내 연금 알아보기<\/li><li>결과는 가정에 기반한 예상치라서 실제 수령액과 다를 수 있음<\/li><li>지급개시 연령은 1969년생부터 65세<\/li><\/ul>\n<p>조회 화면과 계산 기준은 해마다 바뀔 수 있으니 공단 안내를 한 번 더 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>비교표 아래<\/td><td>국민연금공단 홈페이지 첫 화면 또는 '내 연금 알아보기' 소개 화면(로그인 전)<\/td><td>로그인 후 화면의 금액·가입내역은 절대 공개하지 않기<\/td><\/tr><tr><td>조회 순서 아래<\/td><td>앱 메뉴 위치 화면<\/td><td>직접 해 본 경우에만. 이름·가입내역 가림<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 홈페이지 전자민원의 '예상연금액 조회' 메뉴 경로를 직접 열어 확인하고 <mark class=\"need\">[확인 필요]<\/mark> 문장 대체<\/li><li class=\"cb\">☐ 비교표의 '로그인' 칸이 현재 인증 수단(공동인증서·간편인증 등)과 맞는지 확인<\/li><li class=\"cb\">☐ 평균 수령액 월 113만 원은 공단 FAQ의 기준 시점(2025년 12월)을 지키고 개인 예상치처럼 쓰지 않기<\/li><li class=\"cb\">☐ 본인의 예상 연금액을 공개하고 싶다면 사진 없이 문장으로, 공개 여부는 직접 판단<\/li><li class=\"cb\">☐ 노후·투자 조언으로 읽히는 문구(어느 쪽이 유리하다는 권유 등)를 추가하지 않기<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>예상연금액 조회의 가정, 현재가치·미래가치, 상세조회, 인증 로그인<\/td><td>정부24 국민연금 예상 연금 조회 <a href=\"https://www.gov.kr/portal/service/serviceInfo/PTR000050236\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.kr/portal/service/serviceInfo/PTR000050236<\/a> (최종수정 2026-08-10)<\/td><td>공식<\/td><\/tr><tr><td>내 연금 알아보기 신청 절차(공동인증서 로그인, 3영업일, 제3자 정보제공 동의)<\/td><td>정부24 내 연금 정보조회 <a href=\"https://www.gov.kr/portal/service/serviceInfo/B55201500014\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.kr/portal/service/serviceInfo/B55201500014<\/a> (최종수정 2026-08-10)<\/td><td>공식<\/td><\/tr><tr><td>내 연금 알아보기 조회 대상 9종, csa.nps.or.kr 경로<\/td><td>국민연금공단 안내 자료 <a href=\"https://www.nps.or.kr/html/download/memberGuide.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nps.or.kr/html/download/memberGuide.pdf<\/a><\/td><td>공식<\/td><\/tr><tr><td>지급개시 연령표, 조기노령연금(70~99.5%), 연기연금(월 0.6%), 2026년 계산식 변경, 평균 수령액, 앱 기능<\/td><td>국민연금공단 FAQ <a href=\"https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0095M0.do?menuId=MN24001131\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0095M0.do?menuId=MN24001131<\/a><\/td><td>공식<\/td><\/tr><tr><td>예상연금액 조회·모의계산 메뉴 존재<\/td><td>국민연금공단 전자민원 안내 <a href=\"https://www.nps.or.kr/elctcvlcpt/comm/getOHAC0000M3.do?menuId=MN24000936\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nps.or.kr/elctcvlcpt/comm/getOHAC0000M3.do?menuId=MN24000936<\/a> (검색 결과로 확인, 박스에서 페이지 직접 열람은 시간 초과)<\/td><td>공식(검색 요약)<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "국민연금을 나중에 얼마 받는지 검색해 보면 글마다 숫자가 달라서 더 헷갈리죠. 사람마다 가입 기간과 소득이 다르니 당연한 일인데요, 정작 내 숫자를 보여 주는 공식 조회 서비스가 두 갈래라서 어디서 무엇을 볼 수 있는지부터 비교해 봤어요. 국민연금공단과 정부24 안내를 바탕으로 정리했습니다. (2026년 10월 5일 기준)\n\n두 서비스를 나란히 놓고 보면\n\n• 운영 — 예상연금액 조회: 국민연금공단 홈페이지·앱 / 내 연금 알아보기: NPS 중앙노후준비지원센터(csa.nps.or.kr)\n• 보여 주는 것 — 예상연금액 조회: 국민연금의 예상 노령연금 (만 60세 이후 받을 금액) / 내 연금 알아보기: 국민연금, 공무원·사학·군인·별정우체국연금, 농지연금, 개인연금, 퇴직연금, 주택연금\n• 로그인 — 예상연금액 조회: 공동인증서 등 본인 인증 / 내 연금 알아보기: 공동인증서 로그인\n• 특이점 — 예상연금액 조회: 소득·가입기간을 직접 넣어 보는 모의계산도 있음 / 내 연금 알아보기: 개인연금·퇴직연금은 신청 후 3영업일 뒤부터 조회\n\n국민연금만 궁금하면 왼쪽, 내가 가진 연금을 한꺼번에 보고 싶다면 오른쪽이 맞아요. 오른쪽은 제3자 정보제공 동의와 개인정보 수집·이용 동의를 거치는 구조라고 안내되어 있어요.\n\n예상연금액은 어떤 가정으로 계산될까?\n\n정부24의 서비스 안내에는 다음과 같은 가정이 적혀 있어요.\n\n- 사업장가입자와 지역(임의)가입자는 지금의 소득으로 만 60세까지 보험료를 낸다고 가정해요.\n- 납부예외 중이거나 자격을 잃은 상태라면 지금까지 낸 내역만으로 계산해요.\n- 결과는 '현재가치 기준'과 '미래가치 기준' 두 가지로 나와요. 미래가치는 소득이 가정된 상승률로 오른다고 보고 연금을 받을 때의 화폐가치로 계산한 값이라 실제 금액과 차이가 날 수 있어요.\n- 법령이 바뀌면 예상 금액도 달라질 수 있어요.\n\n상세 조회에서는 부양가족 연금 대상, 지급 희망 연령, 앞으로 낼 소득을 직접 골라 비교해 볼 수 있어요.\n\n몇 살부터 받을 수 있을까?\n\n가입 기간이 10년 이상이면 출생연도별 지급개시 연령부터 노령연금을 받을 수 있어요.\n\n- 1961~1964년생: 63세\n- 1965~1968년생: 64세\n- 1969년생 이후: 65세\n\n소득 있는 업무에 종사하지 않는다면 최대 5년 먼저 받는 조기노령연금도 있는데, 청구 연령에 따라 70%에서 99.5%를 받는다고 해요. 반대로 연기연금은 최대 5년까지 늦출 수 있고, 연기한 한 달마다 0.6%가 더해진다고 공단이 안내하고 있어요.\n\n2026년에는 이런 점도 있어요\n\n공단 FAQ에는 2025년 연금개혁에 따라 2026년부터 기본연금액 계산식이 달라졌다고 나와요. 그래서 예전 글에 있는 계산 예시는 지금 기준과 다를 수 있어요. 참고로 2025년 12월 기준 가입 20년 이상인 분들의 노령연금 평균 수령액이 월 113만 원 정도라는 통계도 공단이 공개했는데, 내가 받을 금액이 아니라 전체 평균 참고치예요.\n\n조회하는 순서\n\n1. 국민연금공단 홈페이지나 '내 곁에 국민연금' 앱에서 본인 인증으로 로그인해요. [확인 필요: 홈페이지 전자민원 안에서 예상연금액 조회가 놓인 정확한 메뉴 경로]\n2. 예상연금액을 확인하고, 필요하면 모의계산으로 소득이나 가입 기간을 바꿔 봐요.\n3. 퇴직연금·개인연금까지 보고 싶다면 중앙노후준비지원센터에서 '내 연금 알아보기'를 신청하고 3영업일 뒤 다시 들어가 조회해요.\n\n문의는 국민연금공단 1355(유료)로 하면 돼요.\n\n한눈에 정리\n\n- 국민연금만 보려면 예상연금액 조회, 연금 전체를 보려면 내 연금 알아보기\n- 결과는 가정에 기반한 예상치라서 실제 수령액과 다를 수 있음\n- 지급개시 연령은 1969년생부터 65세\n\n조회 화면과 계산 기준은 해마다 바뀔 수 있으니 공단 안내를 한 번 더 확인해 주세요.", "copyAll": "국민연금을 나중에 얼마 받는지 검색해 보면 글마다 숫자가 달라서 더 헷갈리죠. 사람마다 가입 기간과 소득이 다르니 당연한 일인데요, 정작 내 숫자를 보여 주는 공식 조회 서비스가 두 갈래라서 어디서 무엇을 볼 수 있는지부터 비교해 봤어요. 국민연금공단과 정부24 안내를 바탕으로 정리했습니다. (2026년 10월 5일 기준)\n\n두 서비스를 나란히 놓고 보면\n\n• 운영 — 예상연금액 조회: 국민연금공단 홈페이지·앱 / 내 연금 알아보기: NPS 중앙노후준비지원센터(csa.nps.or.kr)\n• 보여 주는 것 — 예상연금액 조회: 국민연금의 예상 노령연금 (만 60세 이후 받을 금액) / 내 연금 알아보기: 국민연금, 공무원·사학·군인·별정우체국연금, 농지연금, 개인연금, 퇴직연금, 주택연금\n• 로그인 — 예상연금액 조회: 공동인증서 등 본인 인증 / 내 연금 알아보기: 공동인증서 로그인\n• 특이점 — 예상연금액 조회: 소득·가입기간을 직접 넣어 보는 모의계산도 있음 / 내 연금 알아보기: 개인연금·퇴직연금은 신청 후 3영업일 뒤부터 조회\n\n국민연금만 궁금하면 왼쪽, 내가 가진 연금을 한꺼번에 보고 싶다면 오른쪽이 맞아요. 오른쪽은 제3자 정보제공 동의와 개인정보 수집·이용 동의를 거치는 구조라고 안내되어 있어요.\n\n예상연금액은 어떤 가정으로 계산될까?\n\n정부24의 서비스 안내에는 다음과 같은 가정이 적혀 있어요.\n\n- 사업장가입자와 지역(임의)가입자는 지금의 소득으로 만 60세까지 보험료를 낸다고 가정해요.\n- 납부예외 중이거나 자  왼쪽, 내가 가진 연금을 한꺼번에 보고 싶다면 오른쪽이 맞아요. 오른쪽은 제3자 정보제공 동의와 개인정보 수집·이용 동의를 거치는 구조라고 안내되어 있어요. 예상연금액은 어떤 가정으로 계산될까? 정부24의 서비스 안내에는 다음과 같은 가정이 적혀 있어요. - 사업장가입자와 지역(임의)가입자는 지금의 소득으로 만 60세까지 보험료를 낸다고 가정해요. - 납부예외 중이거나 자격을 잃은 상태라면 지금까지 낸 내역만으로 계산해요. - 결과는 '현재가치 기준'과 '미래가치 기준' 두 가지로 나와요. 미래가치는 소득이 가정된 상승률로 오른다고 보고 연금을 받을 때의 화폐가치로 계산한 값이라 실제 금액과 차이가 날 수 있어요. - 법령이 바뀌면 예상 금액도 달라질 수 있어요. 상세 조회에서는 부양가족 연금 대상, 지급 희망 연령, 앞으로 낼 소득을 직접 골라 비교해 볼 수 있어요. 몇 살부터 받을 수 있을까? 가입 기간이 10년 이상이면 출생연도별 지급개시 연령부터 노령연금을 받을 수 있어요. - 1961~1964년생: 63세 - 1965~1968년생: 64세 - 1969년생 이후: 65세 소득 있는 업무에 종사하지 않는다면 최대 5년 먼저 받는 조기노령연금도 있는데, 청구 연령에 따라 70%에서 99.5%를 받는다고 해요. 반대로 연기연금은 최대 5년까지 늦출 수 있고, 연기한 한 달마다 0.6%가 더해진다고 공단이 안내하고 있어요. 2026년에는 이런 점도 있어요 공단 FAQ에는 2025년 연금개혁에 따라 2026년부터 기본연금액 계산식이 달라졌다고 나와요. 그래서 예전 글에 있는 계산 예시는 지금 기준과 다를 수 있어요. 참고로 2025년 12월 기준 가입 20년 이상인 분들의 노령연금 평균 수령액이 월 113만 원 정도라는 통계도 공단이 공개했는데, 내가 받을 금액이 아니라 전체 평균 참고치예요. 조회하는 순서 1. 국민연금공단 홈페이지나 '내 곁에 국민연금' 앱에서 본인 인증으로 로그인해요. [확인 필요: 홈페이지 전자민원 안에서 예상연금액 조회가 놓인 정확한 메뉴 경로] 2. 예상연금액을 확인하고, 필요하면 모의계산으로 소득이나 가입 기간을 바꿔 봐요. 3. 퇴직연금·개인연금까지 보고 싶다면 중앙노후준비지원센터에서 '내 연금 알아보기'를 신청하고 3영업일 뒤 다시 들어가 조회해요. 문의는 국민연금공단 1355(유료)로 하면 돼요. 한눈에 정리 - 국민연금만 보려면 예상연금액 조회, 연금 전체를 보려면 내 연금 알아보기 - 결과는 가정에 기반한 예상치라서 실제 수령액과 다를 수 있음 - 지급개시 연령은 1969년생부터 65세 조회 화면과 계산 기준은 해마다 바뀔 수 있으니 공단 안내를 한 번 더 확인해 주세요. 네이버"}, {"id": "008", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "008_flu-vaccine-2026-2027.md", "title": "독감 무료 접종 언제부터? 2026-2027절기 대상별 시작일 한눈에 정리", "cands": ["75세 이상은 내일부터! 인플루엔자 국가예방접종 대상별 일정 (2026-2027절기)", "올해는 일정이 앞당겨졌어요: 어린이·임신부·65세 이상 독감 무료 접종 달력", "독감 국가예방접종, 어디서 무엇을 챙겨 가야 할까? 접종 전 확인 정리"], "cat": "건강·보건", "kw": ["인플루엔자 국가예방접종", "독감 무료접종", "2026-2027절기", "예방접종도우미", "위탁의료기관"], "summary": "앞당겨진 2026-2027절기 독감 국가예방접종의 대상별 시작일, 접종 장소, 준비물을 공식 일정 기준으로 정리 (의료 조언 아님)", "status": "초안", "created": "2026-10-05 12:21", "base": "2026-10-05", "need": 0, "chars": 1883, "chars_ns": 1485, "imgs": 1, "slots": 1, "html": "<p>75세 이상 어르신은 바로 내일, 10월 6일(화)부터 독감 국가예방접종을  위탁의료기관은 약 2.3만 개소이고, 예방접종도우미 누리집(nip.kdca.go.kr)의 '지정의료기관 찾기'에서 확인할 수 있어요.<\/li><li>방문 전: 기관마다 접종 가능 여부가 다를 수 있으니 미리 확인하라고 질병관리청이 당부하고 있어요.<\/li><li>준비물: 신분증이 필요해요. 어린이는 주민등록등본이나 건강보험증 등, 임신부는 산모수첩이나 임신확인서 등으로 대상 여부를 확인한대요.<\/li><li>접종 후: 20~30분은 접종 기관에 머물며 이상반응을 살핀 뒤 귀가하라고 안내돼 있어요.<\/li><\/ul>\n<h3>65세 이상은 코로나19도 같은 시기<\/h3>\n<p>65세 이상은 코로나19 국가예방접종도 10월에 시작돼요. 70세 이상은 10월 12일(월), 65~69세는 10월 15일(목)부터 2027년 6월 30일까지이고, 인플루엔자 백신과 동시 접종이 가능하다고 안내돼 있어요.<\/p>\n<h3>백신 공급, 알아둘 점<\/h3>\n<p>올해 국가예방접종용으로 확보한 물량은 약 1,233만 도즈라고 해요. 같은 자료에서 질병관리청은 전체 생산·수입 물량이 지난해보다 약 400만 도즈 줄었고, 국가예방접종이 아닌 민간 접종은 공급 여건이 예년만큼 여유롭지 않다고 설명했어요. 국가예방접종 대상이 아닌 분은 이 점을 참고하세요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>어린이·임신부 9/21, 75세 이상 10/6, 70~74세 10/12, 65~69세 10/15 시작<\/li><li>모두 2027년 4월 30일까지, 주소지와 관계없이 위탁의료기관·보건소에서 무료<\/li><li>방문 전 접종 가능 여부 확인, 신분증 지참<\/li><\/ul>\n<p>일정은 상황에 따라 다시 조정될 수 있으니 접종 전에 예방접종도우미 누리집이나 질병관리청 콜센터(1339)에서 한 번 더 확인해 주세요. 이 글은 의료적 조언이 아니며, 접종 여부와 시기는 의료진과 상담해 정하세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래(대표)<\/td><td>예방접종 일러스트 (images/draft_1/d1_kogl85400_vaccination_1person.jpg)<\/td><td>공공누리 제1유형 표기 문구를 글 하단에 넣기. 캡션은 '분위기 이미지'<\/td><\/tr><tr><td>'대상별 접종 기간' 아래<\/td><td>예방접종도우미 누리집 인플루엔자 안내 화면 직접 캡처<\/td><td>캡처일 표기. 개인정보 없는 공개 화면만<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 발행 당일 예방접종도우미(nip.kdca.go.kr) 인플루엔자 안내에서 대상별 시작일이 본문 표와 같은지 재확인 (일정이 한 번 조정된 이력이 있음)<\/li><li class=\"cb\">☐ 본문에 개인 접종 경험이나 효과·부작용 설명을 추가하지 않기 (의료 조언 금지 원칙)<\/li><li class=\"cb\">☐ 65세 이상 코로나19 일정 문장은 질병관리청 안내(10/12, 10/15)와 맞는지 재확인<\/li><li class=\"cb\">☐ 작성 시점이 10월 6일 이후라면 '내일부터' 문구를 수정<\/li><li class=\"cb\">☐ 질병관리청 국가건강정보포털 문장은 공공누리 4유형이므로 복사하지 않음 (이 글은 예방접종도우미·보도참고자료 내용을 재서술)<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/t ain": "75세 이상 어르신은 바로 내일, 10월 6일(화)부터 독감 국가예방접종을 받을 수 있어요. 올해는 질병관리청이 일정을 앞당겼기 때문에 작년 기억대로 움직이면 날짜가 맞지 않을 수 있습니다. 이 글은 질병관리청 공식 안내를 기준으로 대상별 일정과 챙길 것을 정리한 제도 안내예요. (2026년 10월 5일 기준)\n\n(사진 1 자리)\n\n왜 일정이 앞당겨졌을까?\n\n질병관리청은 9월 11일에 인플루엔자 유행주의보가 발령되는 등 예년보다 유행이 빨리 시작되어 접종 시작일을 앞당긴다고 9월 16일에 밝혔어요. 전문위원회 심의와 관계기관 협의를 거쳐 결정했다고 해요.\n\n대상별 접종 기간\n\n• 생후 6개월~14세 어린이 (2012.1.1.~2026.8.31. 출생) — 시작일: 9월 21일(월) / 종료일: 2027년 4월 30일\n• 임신부 (임신 주수 무관) — 시작일: 9월 21일(월) / 종료일: 2027년 4월 30일\n• 75세 이상 (1951.12.31. 이전 출생) — 시작일: 10월 6일(화) / 종료일: 2027년 4월 30일\n• 70~74세 (1952.1.1.~1956.12.31. 출생) — 시작일: 10월 12일(월) / 종료일: 2027년 4월 30일\n• 65~69세 (1957.1.1.~1961.12.31. 출생) — 시작일: 10월 15일(목) / 종료일: 2027년 4월 30일\n\n면역저하자 등 고위험군은 연령별 일정과 상관없이 10월 6일부터 의료진과 상담한 뒤 접종할 수 있다고 안내돼 있어요. 어린이 연령 범위는 이번 절기부터 13세에서 14세로 넓어졌어요.\n\n어린이는 1회일까, 2회일까?\n\n생후 6개월~9세 미만 어린이 중 인플루엔자 접종이 처음이거나 이전 접종력을 모르는 경우, 또는 2026년 6월 30일까지 총 1회만 접종한 경우에는 2회 접종이 지원돼요. 그 외에는 1회예요. 다만 일정과 횟수는 예진 의사와 상담하라고 안내되어 있어서, 우리 아이 횟수는 접종 기관에서 꼭 확인하세요.\n\n어디서, 무엇을 들고 가나?\n\n- 장소: 주소지와 상관없이 전국 위탁의료기관과 보건소에서 무료로 받을 수 있어요. 위탁의료기관은 약 2.3만 개소이고, 예방접종도우미 누리집(nip.kdca.go.kr)의 '지정의료기관 찾기'에서 확인할 수 있어요.\n- 방문 전: 기관마다 접종 가능 여부가 다를 수 있으니 미리 확인하라고 질병관리청이 당부하고 있어요.\n- 준비물: 신분증이 필요해요. 어린이는 주민등록등본이나 건강보험증 등, 임신부는 산모수첩이나 임신확인서 등으로 대상 여부를 확인한대요.\n- 접종 후: 20~30분은 접종 기관에 머물며 이상반응을 살핀 뒤 귀가하라고 안내돼 있어요.\n\n65세 이상은 코로나19도 같은 시기\n\n65세 이상은 코로나19 국가예방접종도 10월에 시작돼요. 70세 이상은 10월 12일(월), 65~69세는 10월 15일(목)부터 2027년 6월 30일까지이고, 인플루엔자 백신과 동시 접종이 가능하다고 안내돼 있어요.\n\n백신 공급, 알아둘 점\n\n올해 국가예방접종용으로 확보한 물량은 약 1,233만 도즈라고 해요. 같은 자료에서 질병관리청은 전체 생산·수입 물량이 지난해보다 약 400만 도즈 줄었고, 국가예방접종이 아닌 민간 접종은 공급 여건이 예년만큼 여유롭지 않다고 설명했어요. 국가예방접종 대상이 아닌 분은 이 점을 참고하세요.\n\n한눈에 정리\n\n- 어린이·임신부 9/21, 75세 이상 10/6, 70~74세 10/12, 65~69세 10/15 시작\n- 모두 2027년 4월 30일까지, 주소지와 관계없이 위탁의료기관·보건소에서 무료\n- 방문 전 접종 가능 여부 확인, 신분증 지참\n\n일정은 상황에 따라 다시 조정될 수 있으니 접종 전에 예방접종도우미 누리집이나 질병관리청 콜센터(1339)에서 한 번 더 확인해 주세요. 이 글은 의료적 조언이 아니며, 접종 여부와 시기는 의료진과 상담해 정하세요.", "copyAll": "75세 이상 어르신은 바로 내일, 10월 6일(화)부터 독감 국가예방접종을 받을 수 있어요. 27년 4월 30일까지, 주소지와 관계없이 위탁의료기관·보건소에서 무료 - 방문 전 접종 가능 여부 확인, 신분증 지참 일정은 상황에 따라 다시 조정될 수 있으니 접종 전에 예방접종도우미 누리집이나 질병관리청 콜센터(1339)에서 한 번 더 확인해 주세요. 이 글은 의료적 조언이 아니며, 접종 여부와 시기는 의료진과 상담해 정하세요. 네이버"}, {"id": "007", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "007_unclaimed-tax-refund.md", "title": "홈택스에서 찾아가지 않은 국세 환급금 조회하는 법, 5년 지나면 국고로 귀속돼요", "cands": ["잠자고 있는 국세 환급금, 1년과 5년만 기억하면 헷갈리지 않아요", "세금 환급이 결정됐는데 못 받았다면? 국세환급금찾기로 조회하고 받는 3가지 방법", "내 이름으로 남은 국세 환급금이 있는지 홈택스로 확인해 보세요 (2026년 기준)"], "cat": "세금·연금", "kw": ["국세환급금", "홈택스", "미수령 환급금", "환급계좌 신고", "국고 귀속"], "summary": "환급이 결정됐지만 찾아가지 않은 국세 환급금을 홈택스에서 조회하고 계좌 신고로 받는 방법과 1년·5년 기한을 정리", "status": "초안", "created": "2026-10-05 12:20", "base": "2026-10-05", "need": 1, "chars": 1604, "chars_ns": 1255, "imgs": 0, "slots": 0, "html": "<p>국세 환급금에는 기억해 둘 숫자가 두 개 있어요. 하나는 '1년', 다른 하나는 '5년'입니다. 환급이 결정됐는데 계좌 정보가 맞지 않아 아직 찾아가지 않은 돈이 있을 수 있어서, 국세청 안내를 기준으로 조회 방법과 기한을 정리해 봤어요. (2026년 10월 5일 기준)<\/p>\n<h3>어떤 환급금이 조회될까?<\/h3>\n<p>부가가치세나 종합소득세 같은 세금을 신고했거나 근로장려금·자녀장려금을 신청해서 환급이 결정됐는데, 계좌 오류 등의 이유로 찾아가지 않은 국세 환급금이 대상이에요. 환급이 결정된 날부터 최근 5년간의 자료가 조회된다고 안내되어 있어요.<\/p>\n<p>한 가지 구분해 둘 점이 있어요. 연말정산으로 돌려받는 환급금은 이 조회와 별개예요. 홈택스 안내 문구에도 연말정산 관련 환급금은 '조회/발급 &gt; 기타조회 &gt; 근로소득 지급명세서 조회'를 이용하라고 되어 있어요.<\/p>\n<h3>조회하는 순서<\/h3>\n<ol><li>홈택스(PC) 또는 손택스(모바일)에서 '국세환급금찾기'를 열어요.<\/li><li>주민등록번호(사업자는 사업자등록번호)와 성명(상호)을 입력하고 조회해요.<\/li><li>찾아가지 않은 환급금이 있으면 안내 문구와 함께 내역이 보이고, 없으면 \"존재하지 않습니다\"라고 나와요.<\/li><\/ol>\n<p>PC 홈택스에서 이 메뉴가 놓인 정확한 위치는 제가 화면으로 확인하지 못했어요. <mark class=\"need\">[확인 필요: 홈택스 PC 화면의 국세환급금찾기 메뉴 위치]<\/mark> 참고로 은행에서 이미 지급을 마친 환급금이 시차 때문에 잠깐 조회될 수도 있다고 하니, 금액이 보여도 먼저 통장 입금 내역부터 확인해 보세요.<\/p>\n<h3>찾는 방법은 세 가지<\/h3>\n<ul><li>홈택스·손택스: 환급금 상세조회에서 본인 인증을 한 뒤 환급계좌 개설(변경) 신고를 하면 돼요. 국세청 통지서에는 '납부·고지·환급 &gt; 국세환급 &gt; 환급계좌개설(변경)신고' 경로가 적혀 있어요.<\/li><li>전화: 미수령 환급금이 500만 원 이하이면 세무서 담당자에게 연락해 본인 계좌를 신고할 수 있어요.<\/li><li>방문: 세무서에서 국세환급금통지서를 받아 우체국에 가는 방법이에요. 우체국에서 직접 받을 때는 신분증과 통지서가 필요하다고 통지서에 안내되어 있어요.<\/li><\/ul>\n<p>조회 결과를 보고 ARS(1544-9944)나 가까운 세무서로 지급 신청을 할 수도 있다고 정부 개방서비스 페이지에 소개돼 있어요.<\/p>\n<h3>1년과 5년은 무엇일까?<\/h3>\n<p>여기서 '지급요구일'은 국세청이 금융회사나 우체국에 환급금을 지급하라고 처음 요구한 날이에요.<\/p>\n<ul><li>1년: 지급요구일로부터 1년이 지나면 금융회사나 우체국에서는 더 이상 지급하지 않아요. 이때는 관할 세무서에 지급 절차를 문의해야 해요.<\/li><li>5년: 최초 지급요구일부터 5년이 지날 때까지 찾아가지 않으면 국고로 귀속돼요. 통지서에는 국세기본법 시행령 제36조가 근거로 적혀 있어요.<\/li><\/ul>\n<h3>마무리하기 전에<\/h3>\n<p>조회 화면은 주민등록번호를 입력하는 곳이라 포털 검색 광고나 문자로 받은 링크 대신 홈택스 공식 주소를 직접 열어서 들어가는 게 안전해요. 환급 사유나 금액이 궁금하면 안내 화면에 나온 세무서 문의처를 이용하면 되고요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>조회 대상: 환급이 결정됐지만 찾아가지 않은 국세 환급금(최근 5년)<\/li><li>조회 위치: 홈택스·손택스의 국세환급금찾기 (연말정산 환급은 별도)<\/li><li>기한: 지급요구일 1년 후 세무서 문의, 최초 지급요구일 5년 후 국고 귀속<\/li><\/ul>\n<p>기한과 절차는 바뀔 수 있으니 실제 신청 전에는 홈택스 안내를 다시 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래<\/td><td>홈택스 '국세환급금찾기' 조회 입력 화면(입력 전 상태)<\/td><td>주민등록번호·성명 입력 후 화면은 절대 캡처하지 않기<\/td><\/tr><tr><td>'찾는 방법은 세 가지' 아래<\/td><td>환급계좌개설(변경)신고 메뉴 경로 화면<\/td><td>본인 계좌번호가 보이면 가림<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ PC 홈택스에서 '국세환급금찾기' 메뉴 위치를 직접 열어 확인하고 본문에 한 줄로 추가(<mark class=\"need\">[확인 필요]<\/mark> 문장 대체)<\/li><li class=\"cb\">☐ 손택스·홈택스 화면에서 조회 입력 항목(주민등록번호, 성명)이 현재도 같은지 확인<\/li><li class=\"cb\">☐ 세무서 전화 신고의 '500만 원 이하' 조건이 현재 안내에도 남아 있는지 확인<\/li><li class=\"cb\">☐ 개인 환급 경험을 쓰고 싶다면 실제로 겪은 것만 쓰고, 금액·계좌는 가리기<\/li><li class=\"cb\">☐ 이 글은 세무 상담이 아니라 조회 절차 안내임을 유지(환급 사유 판단 문구 추가 금지)<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>국세환급금찾기 조회 항목, 최근 5년 조회, 5년 국고 귀속, 지급신청 방법(홈택스·전화 500만 원 이하·방문), 연말정산 환급 별도 안내<\/td><td>국세청 홈택스 모바일 국세환급금찾기 <a href=\"https://mob.tbht.hometax.go.kr/jsonAction.do?actionId=UTBRDAAA03F001\" target=\"_blank\" rel=\"noopener noreferrer\">https://mob.tbht.hometax.go.kr/jsonAction.do?actionId=UTBRDAAA03F001<\/a><\/td><td>공식<\/td><\/tr><tr><td>지급요구일 1년 후 금융회사·우체국 지급 중단, 5년 국고 귀속(국세기본법 시행령 제36조), 환급계좌개설(변경)신고 경로, 우체국 수령 시 서류<\/td><td>국세환급금 통지서 서식(국가법령정보센터) <a href=\"https://www.law.go.kr/LSW/flDownload.do?bylClsCd=110202&amp;flSeq=150100563&amp;gubun=\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.law.go.kr/LSW/flDownload.do?bylClsCd=110202&amp;flSeq=150100563&amp;gubun=<\/a> , <a href=\"https://law.go.kr/flDownload.do?flSeq=38325459&amp;gubun=\" target=\"_blank\" rel=\"noopener noreferrer\">https://law.go.kr/flDownload.do?flSeq=38325459&amp;gubun=<\/a><\/td><td>공식<\/td><\/tr><tr><td>대상 세목 예시(부가세·종소세·장려금), ARS 1544-9944<\/td><td>디지털서비스개방 국세 미수령환급금 조회 <a href=\"https://openservice.go.kr/refundInquiry\" target=\"_blank\" rel=\"noopener noreferrer\">https://openservice.go.kr/refundInquiry<\/a><\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "국세 환급금에는 기억해 둘 숫자가 두 개 있어요. 하나는 '1년', 다른 하나는 '5년'입니다. 환급이 결정됐는데 계좌 정보가 맞지 않아 아직 찾아가지 않은 돈이 있을 수 있어서, 국세청 안내를 기준으로 조회 방법과 기한을 정리해 봤어요. (2026년 10월 5일 기준)\n\n어떤 환급금이 조회될까?\n\n부가가치세나 종합소득세 같은 세금을 신고했거나 근로장려금·자녀장려금을 신청해서 환급이 결정됐는데, 계좌 오류 등의 이유로 찾아가지 않은 국세 환급금이 대상이에요. 환급이 결정된 날부터 최근 5년간의 자료가 조회된다고 안내되어 있어요.\n\n한 가지 구분해 둘 점이 있어요. 연말정산으로 돌려받는 환급금은 이 조회와 별개예요. 홈택스 안내 문구에도 연말정산 관련 환급금은 '조회/발급 > 기타조회 > 근로소득 지급명세서 조회'를 이용하라고 되어 있어요.\n\n조회하는 순서\n\n1. 홈택스(PC) 또는 손택스(모바일)에서 '국세환급금찾기'를 열어요.\n2. 주민등록번호(사업자는 사업자등록번호)와 성명(상호)을 입력하고 조회해요.\n3. 찾아가지 않은 환급금이 있으면 안내 문구와 함께 내역이 보이고, 없으면 \"존재하지 않습니다\"라고 나와요.\n\nPC 홈택스에서 이 메뉴가 놓인 정확한 위치는 제가 화면으로 확인하지 못했어요. [확인 필요: 홈택스 PC 화면의 국세환급금찾기 메뉴 위치] 참고로 은행에서 이미 지급을 마친 환급금이 시차 때문에 잠깐 조회될 수도 있다고 하니, 금액이 보여도 먼저 통장 입금 내역부터 확인해 보세요.\n\n찾는 방법은 세 가지\n\n- 홈택스·손택스: 환급금 상세조회에서 본인 인증을 한 뒤 환급계좌 개설(변경) 신고를 하면 돼요. 국세청 통지서에는 '납부·고지·환급 > 국세환급 > 환급계좌개설(변경)신고' 경로가 적혀 있어요.\n- 전화: 미수령 환급금이 500만 원 이하이면 세무서 담당자에게 연락해 본인 계좌를 신고할 수 있어요.\n- 방문: 세무서에서 국세환급금통지서를 받아 우체국에 가는 방법이에요. 우체국에서 직접 받을 때는 신분증과 통지서가 필요하다고 통지서에 안내되어 있어요.\n\n조회 결과를 보고 ARS(1544-9944)나 가까운 세무서로 지급 신청을 할 수도 있다고 정부 개방서비스 페이지에 소개돼 있어요.\n\n1년과 5년은 무엇일까?\n\n여기서 '지급요구일'은 국세청이 금융회사나 우체국에 환급금을 지급하라고 처음 요구한 날이에요.\n\n- 1년: 지급요구일로부터 1년이 지나면 금융회사나 우체국에서는 더 이상 지급하지 않아요. 이때는 관할 세무서에 지급 절차를 문의해야 해요.\n- 5년: 최초 지급요구일부터 5년이 지날 때까지 찾아가지 않으면 국고로 귀속돼요. 통지서에는 국세기본법 시행령 제36조가 근거로 적혀 있어요.\n\n마무리하기 전에\n\n조회 화면은 주민등록번호를 입력하는 곳이라 포털 검색 광고나 문자로 받은 링크 대신 홈택스 공식 주소를 직접 열어서 들어가는 게 안전해요. 환급 사유나 금액이 궁금하면 안내 화면에 나온 세무서 문의처를 이용하면 되고요.\n\n한눈에 정리\n\n- 조회 대상: 환급이 결정됐지만 찾아가지 않은 국세 환급금(최근 5년)\n- 조회 위치: 홈택스·손택스의 국세환급금찾기 (연말정산 환급은 별도)\n- 기한: 지급요구일 1년 후 세무서 문의, 최초 지급요구일 5년 후 국고 귀속\n\n기한과 절차는 바뀔 수 있으니 실제 신청 전에는 홈택스 안내를 다시 확인해 주세요.", "copyAll": "국세 환급금에는 기억해 둘 숫자가 두 개 있어요. 하나는 '1년', 다른 하나는 '5년'입니다. 환급이 결정됐는데 계좌 정보가 맞지 않아 아직 찾아가지 않은 돈이 있을 수 있어서, 국세청 안내를 기준으로 조회 방법과 기한을 정리해 봤어요. (2026년 10월 5일 기준)\n\n어떤 환급금이 조회될까?\n\n부가가치세나 종합소득세 같은 세금을 신고했거나 근로장려금·자녀장려금을 신청해서 환급이 결정됐는데, 계좌 오류 등의 이유로 찾아가지 않은 국세 환급금이 대상이에요. 환급이 결정된 날부터 최근 5년간의 자료가 조회된다고 안내되어 있어요.\n\n한 가지 구분해 둘 점이 있어요. 연말정산으로 돌려받는 환급금은 이 조회와 별개예요. 홈택스 안내 문구에도 연말정산 관련 환급금은 '조회/발급 > 기타조회 > 근로소득 지급명세서 조회'를 이용하라고 되어 있어요.\n\n조회하는 순서\n\n1. 홈택스(PC) 또는 손택스(모바일)에서 '국세환급금찾기'를 열어요.\n2. 주민등록번호(사업자는 사업자등록번호)와 성명(상호)을 입력하고 조회해요.\n3. 찾아가지 않은 환급금이 있으면 안내 문구와 함께 내역이 보이고, 없으면 \"존재하지 않습니다\"라고 나와요.\n\nPC 홈택스에서 이 메뉴가 놓인 정확한 위치는 제가 화면으로 확인하지 못했어요. [확인 필요: 홈택스 PC 화면의 국세환급금찾기 메뉴 위치] 참고로 은행에서 이미 지급을 마친 환급금이 시차 때문에 잠깐 조회될 수도 있다고 하니, 금액이 보여도 먼저 통장 입금 내역부터 확인해 보세요.\n\n찾는 방법은 세 가지\n\n- 홈택스·손택스: 환급금 상세조회에서 본인 인증을 한 뒤 환급계좌 개설(변경) 신고를 하면 돼요. 국세청 통지서에는 '납부·고지·환급 > 국세환급 > 환급계좌개설(변경)신고' 경로가 적혀 있어요.\n- 전화: 미수령 환급금이 500만 원 이하이면 세무서 담당자에게 연락해 본인 계좌를 신고할 수 있어요.\n- 방문: 세무서에서 국세환급금통지서를 받아 우체국에 가는 방법이에요. 우체국에서 직접 받을 때는 신분증과 통지서가 필요하다고 통지서에 안내되어 있어요.\n\n조회 결과를 보고 ARS(1544-9944)나 가까운 세무서로 지급 신청을 할 수도 있다고 정부 개방서비스 페이지에 소개돼 있어요.\n\n1년과 5년은 무엇일까?\n\n여기서 '지급요구일'은 국세청이 금융회사나 우체국에 환급금을 지급하라고 처음 요구한 날이에요.\n\n- 1년: 지급요구일로부터 1년이 지나면 금융회사나 우체국에서는 더 이상 지 국고로 귀속돼요. 통지서에는 국세기본법 시행령 제36조가 근거로 적혀 있어요. 마무리하기 전에 조회 화면은 주민등록번호를 입력하는 곳이라 포털 검색 광고나 문자로 받은 링크 대신 홈택스 공식 주소를 직접 열어서 들어가는 게 안전해요. 환급 사유나 금액이 궁금하면 안내 화면에 나온 세무서 문의처를 이용하면 되고요. 한눈에 정리 - 조회 대상: 환급이 결정됐지만 찾아가지 않은 국세 환급금(최근 5년) - 조회 위치: 홈택스·손택스의 국세환급금찾기 (연말정산 환급은 별도) - 기한: 지급요구일 1년 후 세무서 문의, 최초 지급요구일 5년 후 국고 귀속 기한과 절차는 바뀔 수 있으니 실제 신청 전에는 홈택스 안내를 다시 확인해 주세요. 네이버"}, {"id": "006", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "006_basic-pension-2026.md", "title": "기초연금 2026년 기준, 소득인정액 247만 원 이하라던데 '소득'과 뭐가 다를까?", "cands": ["기초연금 선정기준액 247만 원, 월급이 아니라 '소득인정액' 기준이에요 (2026년)", "기초연금 신청 전에 알아둘 것: 계산 방식, 신청 시기, 지급일 정리", "만 65세가 되면 언제부터 기초연금을 신청할 수 있을까? 2026년 기준 정리"], "cat": "복지·지원금", "kw": ["기초연금", "선정기준액", "소득인정액", "기초연금 신청", "복지로"], "summary": "2026년 기초연금 선정기준액(단독 247만 원)이 '소득'이 아니라 '소득인정액' 기준임을 설명하고 신청·지급 시기를 정리", "status": "초안", "created": "2026-10-05 12:19", "base": "2026-10-05", "need": 2, "chars": 1863, "chars_ns": 1463, "imgs": 0, "slots": 0, "html": "<p>\"월 소득이 247만 원을 넘으면 기초연금은 못 받는다\"는 말, 주변에서 들어보신 적 있으신가요? 공식 자료를 확인해 보니 기준은 '소득'이 아니라 '소득인정액'이에요. 보건복지부와 정부24 안내를 바탕으로 2026년 기준을 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<h3>먼저 숫자부터: 2026년 선정기준액<\/h3>\n<p>보건복지부는 2026년 선정기준액을 단독가구 월 247만 원, 부부가구 월 395만 2천 원으로 정했다고 밝혔어요. 2025년(228만 원, 364만 8천 원)보다 단독가구 기준 19만 원, 8.3% 오른 금액이에요. 가구의 월 소득인정액이 이 기준액 이하면 기초연금을 받을 수 있어요. 선정기준액은 65세 이상 어르신 중 수급자가 70% 수준이 되도록 정하는 기준선이라고 설명되어 있고요.<\/p>\n<h3>'소득인정액'은 어떻게 계산할까?<\/h3>\n<p>소득인정액은 '월 소득평가액'과 '재산의 월 소득환산액'을 더한 값이에요. 그래서 월급이나 연금 수입이 같아도 재산이 얼마냐에 따라 결과가 달라질 수 있어요.<\/p>\n<ul><li>근로소득은 116만 원을 뺀 뒤 30%를 더 공제해서 반영해요. 사업·재산·공적이전소득 같은 기타 소득은 따로 더해요.<\/li><li>재산은 기본재산액(대도시 1억 3,500만 원, 중소도시 8,500만 원)을 빼고, 금융재산은 2,000만 원을 공제한 뒤 부채를 차감해 월 소득으로 환산해요. 농어촌 기본재산액은 제가 본 정부24 안내에서 숫자를 또렷하게 읽지 못해서 이 글에는 적지 않았어요. <mark class=\"need\">[확인 필요: 농어촌 기본재산액]<\/mark><\/li><li>고급 자동차와 회원권은 일반재산에서 빼고 따로 계산한다고 안내돼 있어요.<\/li><\/ul>\n<h3>얼마나 받을까?<\/h3>\n<p>2026년 기준연금액은 월 349,700원이에요. 정부24에는 단독가구 최고 349,700원, 부부가구 최고 559,520원으로 안내되어 있고, 국민연금 가입기간과 급여액, 가구 유형, 소득인정액 수준에 따라 감액될 수 있다고 해요. 복지부 보도자료에 따르면 2025년 9월 통계 기준 실제 수급자의 약 86%는 소득인정액이 150만 원 미만이라고 해요.<\/p>\n<h3>제외되는 경우도 있어요<\/h3>\n<p>공무원연금, 사학연금, 군인연금, 별정우체국연금의 수급권자와 그 배우자는 원칙적으로 제외돼요. 다만 퇴직일시금을 받은 경우처럼 예외적으로 받을 수 있는 경우도 있어서, 해당될 것 같다면 창구에 꼭 문의해 보세요.<\/p>\n<h3>신청은 어디서, 언제부터?<\/h3>\n<ul><li>신청 장소: 읍·면·동 행정복지센터, 국민연금공단 지사, 복지로(bokjiro.go.kr). 주소지 관할과 상관없이 신청할 수 있어요.<\/li><li>신청 시기: 만 65세 생일이 속한 달의 한 달 전부터예요. 2026년에는 1961년생이 새로 대상이 돼요.<\/li><li>거동이 불편하시면 국민연금공단(1355)에 '찾아뵙는 서비스'를 요청할 수 있고, 일반 문의는 보건복지상담센터 129로 하면 돼요.<\/li><\/ul>\n<h3>지급은 신청한 달부터<\/h3>\n<p>기초연금은 신청한 날이 속한 달부터 지급되고, 매월 25일에 입금돼요. 25일이 토요일이나 공휴일이면 그 전날이에요. 예를 들어 7월에 신청해서 8월에 대상자로 결정되면, 8월 25일에 7월분까지 2개월 치를 받는다고 안내돼 있어요. 심사가 늦어져도 손해가 없다는 뜻이니, 생일 한 달 전에 맞춰 신청하는 게 가장 유리해요.<\/p>\n<h3>미리 가늠해 보고 싶다면<\/h3>\n<p>국민연금공단 FAQ에는 '내 곁에 국민연금' 앱의 노후준비 메뉴에 '기초연금 모의계산'과 '기초연금 신청하기'가 있다고 나와 있어요. 다만 모의계산 결과는 참고용이고 실제 결정은 심사에서 나와요. <mark class=\"need\">[확인 필요: 앱 화면의 메뉴 이름과 위치]<\/mark><\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>기준은 소득이 아니라 소득인정액(소득평가액 + 재산 환산액)<\/li><li>2026년 선정기준액: 단독 247만 원, 부부 395만 2천 원<\/li><li>신청: 생일 속한 달의 한 달 전부터, 지급은 신청한 달부터 매월 25일<\/li><\/ul>\n<p>제도는 해마다 바뀌니 신청 전에 복지로나 129에서 한 번 더 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래<\/td><td>복지로(bokjiro.go.kr) 기초연금 안내 화면 직접 캡처<\/td><td>로그인 전 공개 화면만, 캡처일 표기<\/td><\/tr><tr><td>'미리 가늠해 보고 싶다면'<\/td><td>'내 곁에 국민연금' 앱 모의계산 메뉴 화면<\/td><td>직접 해본 경우에만. 입력한 소득·재산 수치와 이름은 가림<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 농어촌 기본재산액을 정부24 '기초연금' 서비스 페이지 또는 복지로에서 직접 확인해 본문에 추가하거나 문장 삭제<\/li><li class=\"cb\">☐ '내 곁에 국민연금' 앱 메뉴 이름(기초연금 모의계산)이 현재 앱 화면과 같은지 확인 (같지 않으면 문장 수정)<\/li><li class=\"cb\">☐ 부부가구 559,520원은 정부24 표기를 그대로 옮긴 최고액이므로, 부부 감액 등 세부 계산은 쓰지 않았음을 유지<\/li><li class=\"cb\">☐ 직접 신청해 본 경험이 있다면 한두 문장만 추가 (없으면 '공식 안내 기준' 유지)<\/li><li class=\"cb\">☐ 보건복지부 보도자료 문장을 그대로 복사하지 않았는지 훑어보기<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>2026년 선정기준액(247만/395.2만), 2025년 비교, 70% 수준 설명, 수급자 86% 통계, 신청 3곳, 찾아뵙는 서비스, 1961년생<\/td><td>보건복지부 보도자료(2026-01-01) <a href=\"https://www.mohw.go.kr/board.es?act=view&amp;bid=0027&amp;list_no=1488478&amp;mid=a10503010100\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.mohw.go.kr/board.es?act=view&amp;bid=0027&amp;list_no=1488478&amp;mid=a10503010100<\/a><\/td><td>공식<\/td><\/tr><tr><td>소득인정액 계산식, 기본재산액, 단독 349,700원·부부 559,520원, 직역연금 제외, 신청 시기<\/td><td>정부24 기초연금 <a href=\"https://www.gov.kr/portal/service/serviceInfo/SSE000000170\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.kr/portal/service/serviceInfo/SSE000000170<\/a><\/td><td>공식<\/td><\/tr><tr><td>지급 기준(신청한 달부터), 매월 25일, 예시<\/td><td>기초연금 누리집 <a href=\"https://basicpension.mohw.go.kr/menu.es?mid=a10202020000\" target=\"_blank\" rel=\"noopener noreferrer\">https://basicpension.mohw.go.kr/menu.es?mid=a10202020000<\/a><\/td><td>공식<\/td><\/tr><tr><td>2026년 기준연금액 349,700원<\/td><td>찾기쉬운 생활법령정보 <a href=\"https://www.easylaw.go.kr/CSP/CnpClsMainBtr.laf?ccfNo=4&amp;cciNo=1&amp;cnpClsNo=1&amp;csmSeq=2056&amp;popMenu=ov\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.easylaw.go.kr/CSP/CnpClsMainBtr.laf?ccfNo=4&amp;cciNo=1&amp;cnpClsNo=1&amp;csmSeq=2056&amp;popMenu=ov<\/a><\/td><td>공식<\/td><\/tr><tr><td>'내 곁에 국민연금' 앱 기초연금 모의계산·신청 메뉴<\/td><td>국민연금공단 FAQ <a href=\"https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0095M0.do?menuId=MN24001131\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0095M0.do?menuId=MN24001131<\/a><\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "\"월 소득이 247만 원을 넘으면 기초연금은 못 받는다\"는 말, 주변에서 들어보신 적 있으신가요? 공식 자료를 확인해 보니 기준은 '소득'이 아니라 '소득인정액'이에요. 보건복지부와 정부24 안내를 바탕으로 2026년 기준을 정리했습니다. (2026년 10월 5일 기준)\n\n먼저 숫자부터: 2026년 선정기준액\n\n보건복지부는 2026년 선정기준액을 단독가구 월 247만 원, 부부가구 월 395만 2천 원으로 정했다고 밝혔어요. 2025년(228만 원, 364만 8천 원)보다 단독가구 기준 19만 원, 8.3% 오른 금액이에요. 가구의 월 소득인정액이 이 기준액 이하면 기초연금을 받을 수 있어요. 선정기준액은 65세 이상 어르신 중 수급자가 70% 수준이 되도록 정하는 기준선이라고 설명되어 있고요.\n\n'소득인정액'은 어떻게 계산할까?\n\n소득인정액은 '월 소득평가액'과 '재산의 월 소득환산액'을 더한 값이에요. 그래서 월급이나 연금 수입이 같아도 재산이 얼마냐에 따라 결과가 달라질 수 있어요.\n\n- 근로소득은 116만 원을 뺀 뒤 30%를 더 공제해서 반영해요. 사업·재산·공적이전소득 같은 기타 소득은 따로 더해요.\n- 재산은 기본재산액(대도시 1억 3,500만 원, 중소도시 8,500만 원)을 빼고, 금융재산은 2,000만 원을 공제한 뒤 부채를 차감해 월 소득으로 환산해요. 농어촌 기본재산액은 제가 본 정부24 안내에서 숫자를 또렷하게 읽지 못해서 이 글에는 적지 않았어요. [확인 필요: 농어촌 기본재산액]\n- 고급 자동차와 회원권은 일반재산에서 빼고 따로 계산한다고 안내돼 있어요.\n\n얼마나 받을까?\n\n2026년 기준연금액은 월 349,700원이에요. 정부24에는 단독가구 최고 349,700원, 부부가구 최고 559,520원으로 안내되어 있고, 국민연금 가입기간과 급여액, 가구 유형, 소득인정액 수준에 따라 감액될 수 있다고 해요. 복지부 보도자료에 따르면 2025년 9월 통계 기준 실제 수급자의 약 86%는 소득인정액이 150만 원 미만이라고 해요.\n\n제외되는 경우도 있어요\n\n공무원연금, 사학연금, 군인연금, 별정우체국연금의 수급권자와 그 배우자는 원칙적으로 제외돼요. 다만 퇴직일시금을 받은 경우처럼 예외적으로 받을 수 있는 경우도 있어서, 해당될 것 같다면 창구에 꼭 문의해 보세요.\n\n신청은 어디서, 언제부터?\n\n- 신청 장소: 읍·면·동 행정복지센터, 국민연금공단 지사, 복지로(bokjiro.go.kr). 주소지 관할과 상관없이 신청할 수 있어요.\n- 신청 시기: 만 65세 생일이 속한 달의 한 달 전부터예요. 2026년에는 1961년생이 새로 대상이 돼요.\n- 거동이 불편하시면 국민연금공단(1355)에 '찾아뵙는 서비스'를 요청할 수 있고, 일반 문의는 보건복지상담센터 129로 하면 돼요.\n\n지급은 신청한 달부터\n\n기초연금은 신청한 날이 속한 달부터 지급되고, 매월 25일에 입금돼요. 25일이 토요일이나 공휴일이면 그 전날이에요. 예를 들어 7월에 신청해서 8월에 대상자로 결정되면, 8월 25일에 7월분까지 2개월 치를 받는다고 안내돼 있어요. 심사가 늦어져도 손해가 없다는 뜻이니, 생일 한 달 전에 맞춰 신청하는 게 가장 유리해요.\n\n미리 가늠해 보고 싶다면\n\n국민연금공단 FAQ에는 '내 곁에 국민연금' 앱의 노후준비 메뉴에 '기초연금 모의계산'과 '기초연금 신청하기'가 있다고 나와 있어요. 다만 모의계산 결과는 참고용이고 실제 결정은 심사에서 나와요. [확인 필요: 앱 화면의 메뉴 이름과 위치]\n\n한눈에 정리\n\n- 기준은 소득이 아니라 소득인정액(소득평가액 + 재산 환산액)\n- 2026년 선정기준액: 단독 247만 원, 부부 395만 2천 원\n- 신청: 생일 속한 달의 한 달 전부터, 지급은 신청한 달부터 매월 25일\n\n제도는 해마다 바뀌니 신청 전에 복지로나 129에서 한 번 더 확인해 주세요.", "copyAll": "\"월 소득이 247만 원을 넘으면 기초연금은 못 받는다\"는 말, 주변에서 들어보신 적 있으신가요? 공식 자 h": "006 기초연금 2026년 기준, 소득인정액 247만 원 이하라던데 '소득'과 뭐가 다를까? 복지·지원금 기초연금, 선정기준액, 소득인정액, 기초연금 신청, 복지로 2026년 기초연금 선정기준액(단독 247만 원)이 '소득'이 아니라 '소득인정액' 기준임을 설명하고 신청·지급 시기를 정리 \"월 소득이 247만 원을 넘으면 기초연금은 못 받는다\"는 말, 주변에서 들어보신 적 있으신가요? 공식 자료를 확인해 보니 기준은 '소득'이 아니라 '소득인정액'이에요. 보건복지부와 정부24 안내를 바탕으로 2026년 기준을 정리했습니다. (2026년 10월 5일 기준) 먼저 숫자부터: 2026년 선정기준액 보건복지부는 2026년 선정기준액을 단독가구 월 247만 원, 부부가구 월 395만 2천 원으로 정했다고 밝혔어요. 2025년(228만 원, 364만 8천 원)보다 단독가구 기준 19만 원, 8.3% 오른 금액이에요. 가구의 월 소득인정액이 이 기준액 이하면 기초연금을 받을 수 있어요. 선정기준액은 65세 이상 어르신 중 수급자가 70% 수준이 되도록 정하는 기준선이라고 설명되어 있고요. '소득인정액'은 어떻게 계산할까? 소득인정액은 '월 소득평가액'과 '재산의 월 소득환산액'을 더한 값이에요. 그래서 월급이나 연금 수입이 같아도 재산이 얼마냐에 따라 결과가 달라질 수 있어요. - 근로소득은 116만 원을 뺀 뒤 30%를 더 공제해서 반영해요. 사업·재산·공적이전소득 같은 기타 소득은 따로 더해요. - 재산은 기본재산액(대도시 1억 3,500만 원, 중소도시 8,500만 원)을 빼고, 금융재산은 2,000만 원을 공제한 뒤 부채를 차감해 월 소득으로 환산해요. 농어촌 기본재산액은 제가 본 정부24 안내에서 숫자를 또렷하게 읽지 못해서 이 글에는 적지 않았어요. [확인 필요: 농어촌 기본재산액] - 고급 자동차와 회원권은 일반재산에서 빼고 따로 계산한다고 안내돼 있어요. 얼마나 받을까? 2026년 기준연금액은 월 349,700원이에요. 정부24에는 단독가구 최고 349,700원, 부부가구 최고 559,520원으로 안내되어 있고, 국민연금 가입기간과 급여액, 가구 유형, 소득인정액 수준에 따라 감액될 수 있다고 해요. 복지부 보도자료에 따르면 2025년 9월 통계 기준 실제 수급자의 약 86%는 소득인정액이 150만 원 미만이라고 해요. 제외되는 경우도 있어요 공무원연금, 사학연금, 군인연금, 별정우체국연금의 수급권자와 그 배우자는 원칙적으로 제외돼요. 다만 퇴직일시금을 받은 경우처럼 예외적으로 받을 수 있는 경우도 있어서, 해당될 것 같다면 창구에 꼭 문의해 보세요. 신청은 어디서, 언제부터? - 신청 장소: 읍·면·동 행정복지센터, 국민연금공단 지사, 복지로(bokjiro.go.kr). 주소지 관할과 상관없이 신청할 수 있어요. - 신청 시기: 만 65세 생일이 속한 달의 한 달 전부터예요. 2026년에는 1961년생이 새로 대상이 돼요. - 거동이 불편하시면 국민연금공단(1355)에 '찾아뵙는 서비스'를 요청할 수 있고, 일반 문의는 보건복지상담센터 129로 하면 돼요. 지급은 신청한 달부터 기초연금은 신청한 날이 속한 달부터 지급되고, 매월 25일에 입금돼요. 25일이 토요일이나 공휴일이면 그 전날이에요. 예를 들어 7월에 신청해서 8월에 대상자로 결정되면, 8월 25일에 7월분까지 2개월 치를 받는다고 안내돼 있어요. 심사가 늦어져도 손해가 없다는 뜻이니, 생일 한 달 전에 맞춰 신청하는 게 가장 유리해요. 미리 가늠해 보고 싶다면 국민연금공단 FAQ에는 '내 곁에 국민연금' 앱의 노후준비 메뉴에 '기초연금 모의계산'과 '기초연금 신청하기'가 있다고 나와 있어요. 다만 모의계산 결과는 참고용이고 실제 결정은 심사에서 나와요. [확인 필요: 앱 화면의 메뉴 이름과 위치] 한눈에 정리 - 기준은 소득이 아니라 소득인정액(소득평가액 + 재산 환산액) - 2026년 선정기준액: 단독 247만 원, 부부 395만 2천 원 - 신청: 생일 속한 달의 한 달 전부터, 지급은 신청한 달부터 매월 25일 제도는 해마다 바뀌니 신청 전에 복지로나 129에서 한 번 더 확인해 주세요. 네이버"}, {"id": "005", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "005_benefit-notifier.md", "title": "정부24 '혜택알리미'로 내가 받을 수 있는 정부 혜택 확인하는 순서", "cands": ["정부24 '혜택알리미'로 내가 받을 수 있는 정부 혜택 확인하는 순서", "혜택알리미 '신청하세요'와 '확인하세요'는 뭐가 다를까?", "몰라서 못 받는 공공서비스, 가족 것까지 확인하는 방법 (피싱 주의점 포함)"], "cat": "복지·지원금", "kw": ["혜택알리미", "정부24", "정부 혜택 조회", "가족 맞춤안내"], "summary": "정부24 혜택알리미로 내가 받을 수 있는 공공서비스를 확인하는 순서와 비슷한 이름 앱·피싱 주의점 정리", "status": "초안", "created": "2026-10-05 01:34", "base": "2026-10-05", "need": 4, "chars": 2483, "chars_ns": 1919, "imgs": 1, "slots": 2, "html": "<p>나라에서 주는 혜택이 많다는데, 정작 내가 받을 수 있는 게 뭔지는 알기 어렵잖아요. 행정안전부가 운영하는 '혜택알리미'는 소득, 거주지 같은 내 상황에 맞는 공공서비스를 찾아 알려주는 서비스예요. 어떤 서비스인지, 어떻게 쓰는지, 그리고 조심할 점까지 공식 발표와 정책브리핑 기사를 바탕으로 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<div class=\"ph-empty\"><b>사진 1 자리<\/b>대표 이미지: 정부24 혜택알리미 홈 화면 (로그인 전 화면 또는 개인정보 가린 화면)<small>직접 찍거나 캡처한 사진을 넣는 위치 (개인정보 가림)<\/small><\/div>\n<h3>혜택알리미는 어떤 서비스?<\/h3>\n<p>행정안전부는 2025년 12월 9일, 혜택알리미를 10일부터 본격 운영한다고 밝혔어요. 한 번 가입하면 행정·공공기관의 공공서비스를 개인 맞춤형으로 알려주는 알림 서비스예요. 처음에는 청년·구직·임신·전입 등 4개 분야 1,500종을 안내했고, 본격 운영부터는 전 분야 6,000여 종으로 넓어졌다고 해요. 시범운영 기간에 93만 명이 가입했고 650만 건 이상의 공공서비스가 안내됐다는 설명도 있었어요.<\/p>\n<p>2025년 12월 발표 당시 이용 채널은 정부24와 기업은행·신한은행·하나은행·우리은행·웰로 등 5개 민간 앱이었고, 농협은행 앱도 12월 중 추가될 예정이라고 했어요. 이후 제공 채널이 늘었어요. 서울신문(2026년 9월 29일, 행정안전부 자료 인용)에 따르면 현재 정부24와 민간 앱 10곳을 합쳐 11개 앱에서 이용할 수 있고, 2026년 8월 말 기준 이용자가 약 416만 명, 안내 가능한 혜택은 7,075종이라고 해요. 다만 11개 앱의 구체적인 목록은 공식 자료로 확인하지 못했어요. <mark class=\"need\">[확인 필요: 현재 이용 가능한 앱 목록은 정부24 안내에서 확인]<\/mark><\/p>\n<h3>어떻게 이용하나요? (정책기자단 이용기 기준)<\/h3>\n<p>대상은 국민 누구나(만 14세 미만 제외)라고 행정안전부 카드뉴스에 안내돼 있어요.<\/p>\n<ol><li>정부24에 로그인해요. 모바일 신분증, 간편인증, 공동·금융인증서로 로그인하면 추가 인증 없이 쓸 수 있다고 해요.<\/li><li>혜택알리미 홈에서 맞춤 조건을 설정해요.<\/li><li>서비스 이용에 동의해요. 연령, 소득, 가족 구성 같은 정보를 종합해서 분석하기 때문이에요.<\/li><li>결과 목록을 확인해요.<\/li><\/ol>\n<p>행정안전부 안내에는 정부24에서 혜택알리미에 가입하고 이용 동의를 한 뒤 '맞춤 혜택 알림 받기'를 선택하는 흐름으로 나와 있어요. 정부24 화면의 메뉴 이름은 바뀔 수 있으니 실제 화면은 직접 확인해 보세요.<\/p>\n<div class=\"ph-empty\"><b>사진 2 자리<\/b>조건 설정 또는 결과 목록 화면 (개인정보·혜택 내역 가림)<small>직접 찍거나 캡처한 사진을 넣는 위치 (개인정보 가림)<\/small><\/div>\n<h3>'신청하세요'와 '확인하세요'의 차이<\/h3>\n<p>결과 목록은 두 가지로 나뉘어요. '신청하세요'는 내 상황과 자격이 행정정보로 모두 확인되어 바로 신청할 수 있는 혜택이고, '확인하세요'는 일부 정보가 확인되지 않아 신청 조건을 직접 살펴봐야 하는 혜택이라고 설명돼요. 그러니 '확인하세요'에 있는 항목은 조건을 한 번 더 읽어 보는 게 좋겠죠.<\/p>\n<h3>가족 혜택도 볼 수 있어요<\/h3>\n<p>가족 맞춤안내 기능으로 가족의 혜택도 함께 확인할 수 있어요. 가족을 추가하고 그 가족의 정보제공 동의를 받아야 하고, 등록 대상은 주민등록등본상 같은 세대원이거나 가족관계등록부상 배우자 또는 직계 존속·비속이라고 안내돼요. 정부24 FAQ에 따르면 동의를 한 뒤에는 '맞춤안내 조회(재조회)'를 해야 가족 정보가 반영돼요. 가족의 연령별 동의 방식(14세 이상 본인 동의, 14세 미만 보호자 동의 등)은 공식 자료로 확인하지 못했어요. <mark class=\"need\">[확인 필요: 가족 연령별 동의 조건]<\/mark><\/p>\n<h3>꼭 알아둘 주의사항: 비슷한 이름의 앱<\/h3>\n<p>행정안전부는 정부와 기업이 '혜택알리미'라는 별도 앱이나 개별 누리집을 운영하고 있지 않다고 밝혔어요. 그래서 같은 이름을 내세운 앱이나 링크를 이용한 피싱에 주의해야 해요. 정부24나 위에서 안내된 민간 앱 안에서 접속하는 것이 안전하다고 이해하시면 돼요.<\/p>\n<p>참고로 정부24의 일부 동의 화면에는 아직 '보조금24 맞춤안내'라는 표기가 남아 있고 같은 주소 경로(rcvfvrSvc)를 쓰고 있어요. 다만 이름이 공식적으로 바뀐 것이라는 발표는 확인하지 못해서 <mark class=\"need\">[확인 필요]<\/mark>로 남겨요.<\/p>\n<h3>이런 점은 기억해 두세요<\/h3>\n<p>혜택알리미가 보여 주는 결과는 행정정보와 내가 입력한 조건을 바탕으로 한 안내예요. 그래서 목록에 있다고 해서 자동으로 지급되는 것은 아니고, 신청 기간과 제출 서류, 접수 기관은 혜택마다 달라요. 정책기자단 이용기에서도 정책명을 누르면 서비스 대상, 신청 기간과 방법, 제출 서류, 접수 홈페이지까지 확인할 수 있었다고 소개돼 있어요. 신청 전에는 이 상세 화면과 해당 기관 공고를 꼭 읽어 보세요. 새로운 혜택이 생기면 국민비서 등에서 선택한 앱이나 문자로 알림을 받을 수 있다는 설명도 있었는데, 알림 채널을 고르는 구체적인 설정 방법은 공식 자료로 확인하지 못했어요. <mark class=\"need\">[확인 필요: 알림 설정 방법]<\/mark><\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>혜택알리미는 정부24 등 공식 채널에서 이용하기<\/li><li>'신청하세요'는 바로 신청, '확인하세요'는 조건 확인<\/li><li>가족 혜택은 동의 절차가 필요<\/li><li>같은 이름의 별도 앱·링크는 피싱 주의<\/li><\/ul>\n<p>혜택 내용과 이용 채널은 바뀔 수 있으니 신청 전 해당 기관의 공식 안내를 꼭 확인해 주세요.<\/p><div class=\"gallery\"><div class=\"gl\">참고 이미지 (본문 하단·분위기용)<\/div><figure class=\"ph\"><img loading=\"lazy\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wgARCAHgAtADAS 내 화면에서 현재 이용 가능한 민간 앱 목록(11개 앱)과 메뉴 이름을 직접 확인하고 <mark class=\"need\">[확인 필요]<\/mark> 제거 또는 갱신<\/li><li class=\"cb\">☐ 가족 맞춤안내의 연령별(14세 미만 등) 동의 조건은 정부24 FAQ 또는 실제 화면에서 확인, 불확실하면 문장 삭제<\/li><li class=\"cb\">☐ '보조금24' 문단은 공식 근거를 못 찾으면 삭제 가능<\/li><li class=\"cb\">☐ 알림 설정(국민비서) 문장은 설정 절차를 확인하지 못하면 삭제<\/li><li class=\"cb\">☐ 직접 이용했다면 \"내 조건에서 몇 건 안내됐다\" 정도만 추가(개별 혜택명·금액·가족 정보는 가림)<\/li><li class=\"cb\">☐ 은행·민간 앱 홍보로 읽히지 않게 중립 표현 유지, 특정 지원금 금액·자격은 해당 부처 공고 링크와 기준일 필수<\/li><li class=\"cb\">☐ 행안부 카드뉴스·정책브리핑 이미지/텍스트는 공공누리 4유형 또는 협의 필요 대상이라 복사 금지(사실만 재서술)<\/li><\/ul>", "open": true}, {"title": "팩트체크 결과", "html": "<div class=\"tw\"><table><thead><tr><th>#<\/th><th>원본 <mark class=\"need\">[확인 필요]<\/mark>·확인 요청 항목<\/th><th>판정<\/th><th>확인 내용 · 출처<\/th><\/tr><\/thead><tbody><tr><td>5-1<\/td><td>본문 수치(2025-12-10 본격 운영, 6,000여 종, 시범 93만 명·650만 건, 5개 민간 앱, 농협 12월 추가, 별도 앱·누리집 없음/피싱 주의)<\/td><td>확인됨<\/td><td>행정안전부 정책브리핑 2025-12-09 <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148956160\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyNewsView.do?newsId=148956160<\/a><\/td><\/tr><tr><td>5-2<\/td><td>현재 제공 채널<\/td><td>불일치(정정/업데이트)<\/td><td>서울신문 2026-09-29(행안부 자료): 정부24 + 민간 앱 10곳 = 11개 앱, 이용자 415만 9,614명(2026-08말), 혜택 7,075종. 전자신문 2026-07-30: 농협 도입 완료, 카카오뱅크·모니모 하반기 도입 예정. 구체 앱 목록은 2차 보도뿐 → 확인 불가(<mark class=\"need\">[확인 필요]<\/mark> 유지)<\/td><\/tr><tr><td>5-3<\/td><td>이용 대상<\/td><td>확인됨(본문 추가)<\/td><td>국민 누구나(만 14세 미만 제외) — 행안부 카드뉴스 2025-12-18 <a href=\"https://www.korea.kr/multi/visualNewsView.do?newsId=148956713\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/multi/visualNewsView.do?newsId=148956713<\/a><\/td><\/tr><tr><td>5-4<\/td><td>가족 맞춤안내 등록 대상·동의·재조회<\/td><td>확인됨<\/td><td>정부24 FAQ <a href=\"https://www.gov.kr/portal/faq/3304\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.kr/portal/faq/3304<\/a> ; 정책기자단 <a href=\"https://www.korea.kr/news/reporterView.do?newsId=148957084\" target=\"_blank\" rel=\" 동의 후 재조회<\/td><td>정부24 FAQ <a href=\"https://www.gov.kr/portal/faq/3304\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.kr/portal/faq/3304<\/a><\/td><td>공식<\/td><\/tr><tr><td>현재 채널·이용자·혜택 수(11개 앱, 415만 9,614명, 7,075종)<\/td><td>서울신문 2026-09-29 (행정안전부 자료 인용)<\/td><td>2차(언론)<\/td><\/tr><tr><td>농협 도입, 카카오뱅크·모니모 예정<\/td><td>전자신문 2026-07-30<\/td><td>2차(언론)<\/td><\/tr><tr><td>보조금24 표기 잔존<\/td><td>정부24 동의 화면 <a href=\"https://www.gov.kr/mw/EgovPageLink.do?gubun=rcvfvrSvc&amp;link=etc%2FAA040_multi_icfrm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.kr/mw/EgovPageLink.do?gubun=rcvfvrSvc&amp;link=etc%2FAA040_multi_icfrm<\/a><\/td><td>공식<\/td><\/tr><tr><td>(참고·오래됨) 가족 14세 이상 조건(보조금24 시기)<\/td><td>정책기자단 <a href=\"https://www.korea.kr/news/reporterView.do?newsId=148927130\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/reporterView.do?newsId=148927130<\/a> (2024-03-25)<\/td><td>2차·오래됨 → <mark class=\"need\">[확인 필요]<\/mark> 유지<\/td><\/tr><tr><td>정부24 혜택알리미 홈<\/td><td><a href=\"https://www.gov.kr/portal/rcvfvrSvc/main\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.kr/portal/rcvfvrSvc/main<\/a> (박스에서 본문이 비어 화면 내용 확인 불가)<\/td><td>공식(내용 미확인)<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "<p>사진: Océanos y dados / Wikimedia Commons (CC0, 표기 의무 없음 — 출처 병기 권장) <a href=\"https://commons.wikimedia.org/wiki/File:Smartphone_Use.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">https://commons.wikimedia.org/wiki/File:Smartphone_Use.jpg<\/a><\/p>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 행정안전부 등 공식 발표 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 혜택 내용과 이용 채널은 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>\n<p>(참고: 광고·제휴·협찬·대가성 요소 없음. 특정 민간 앱·금융사 홍보 없음.)<\/p>", "open": false}], "plain": "나라에서 주는 혜택이 많다는데, 정작 내가 받을 수 있는 게 뭔지는 알기 어렵잖아요. 행정안전부가 운영하는 '혜택알리미'는 소득, 거주지 같은 내 상황에 맞는 공공서비스를 찾아 알려주는 서비스예요. 어떤 서비스인지, 어떻게 쓰는지, 그리고 조심할 점까지 공식 발표와 정책브리핑 기사를 바탕으로 정리했습니다. (2026년 10월 5일 기준)\n\n(사진 1 자리)\n\n혜택알리미는 어떤 서비스?\n\n행정안전부는 2025년 12월 9일, 혜택알리미를 10일부터 본격 운영한다고 밝혔어요. 한 번 가입하면 행정·공공기관의 공공서비스를 개인 맞춤형으로 알려주는 알림 서비스예요. 처음에는 청년·구직·임신·전입 등 4개 분야 1,500종을 안내했고, 본격 운영부터는 전 분야 6,000여 종으로 넓어졌다고 해요. 시범운영 기간에 93만 명이 가입했고 650만 건 이상의 공공서비스가 안내됐다는 설명도 있었어요.\n\n2025년 12월 발표 당시 이용 채널은 정부24와 기업은행·신한은행·하나은행·우리은행·웰로 등 5개 민간 앱이었고, 농협은행 앱도 12월 중 추가될 예정이라고 했어요. 이후 제공 채널이 늘었어요. 서울신문(2026년 9월 29일, 행정안전부 자료 인용)에 따르면 현재 정부24와 민간 앱 10곳을 합쳐 11개 앱에서 이용할 수 있고, 2026년 8월 말 기준 이용자가 약 416만 명, 안내 가능한 혜택은 7,075종이라고 해요. 다만 11개 앱의 구체적인 목록은 공식 자료로 확인하지 못했어요. [확인 필요: 현재 이용 가능한 앱 목록은 정부24 안내에서 확인]\n\n어떻게 이용하나요? (정책기자단 이용기 기준)\n\n대상은 국민 누구나(만 14세 미만 제외)라고 행정안전부 카드뉴스에 안내돼 있어요.\n\n1. 정부24에 로그인해요. 모바일 신분증, 간편인증, 공동·금융인증서로 로그인하면 추가 인증 없이 쓸 수 있다고 해요.\n2. 혜택알리미 홈에서 맞춤 조건을 설정해요.\n3. 서비스 이용에 동의해요. 연령, 소득, 가족 구성 같은 정보를 종합해서 분석하기 때문이에요.\n4. 결과 목록을 확인해요.\n\n행정안전부 안내에는 정부24에서 혜택알리미에 가입하고 이용 동의를 한 뒤 '맞춤 혜택 알림 받기'를 선택하는 흐름으로 나와 있어요. 정부24 화면의 메뉴 이름은 바뀔 수 있으니 실제 화면은 직접 확인해 보세요.\n\n(사진 2 자리)\n\n'신청하세요'와 '확인하세요'의 차이\n\n결과 목록은 두 가지로 나뉘어요. '신청하세요'는 내 상황과 자격이 행정정보로 모두 확인되어 바로 신청할 수 있는 혜택이고, '확인하세요'는 일부 정보가 확인되지 않아 신청 조건을 직접 살펴봐야 하는 혜택이라고 설명돼요. 그러니 '확인하세요'에 있는 항목은 조건을 한 번 더 읽어 보는 게 좋겠죠.\n\n가족 혜택도 볼 수 있어요\n\n가족 맞춤안내 기능으로 가족의 혜택도 함께 확인할 수 있어요. 가족을 추가하고 그 가족의 정보제공 동의를 받아야 하고, 등록 대상은 주민등록등본상 같은 세대원이거나 가족관계등록부상 배우자 또는 직계 존속·비속이라고 안내돼요. 정부24 FAQ에 따르면 동의를 한 뒤에는 '맞춤안내 조회(재조회)'를 해야 가족 정보가 반영돼요. 가족의 연령별 동의 방식(14세 이상 본인 동의, 14세 미만 보호자 동의 등)은 공식 자료로 확인하지 못했어요. [확인 필요: 가족 연령별 동의 조건]\n\n꼭 알아둘 주의사항: 비슷한 이름의 앱\n\n행정안전부는 정부와 기업이 '혜택알리미'라는 별도 앱이나 개별 누리집을 운영하고 있지 않다고 밝혔어요. 그래서 같은 이름을 내세운 앱이나 링크를 이용한 피싱에 주의해야 해요. 정부24나 위에서 안내된 민간 앱 안에서 접속하는 것이 안전하다고 이해하시면 돼요.\n\n참고로 정부24의 일부 동의 화면에는 아직 '보조금24 맞춤안내'라는 표기가 남아 있고 같은 주소 경로(rcvfvrSvc)를 쓰고 있어요. 다만 이름이 공식적으로 바뀐 것이라는 발표는 확인하지 못해서 [확인 필요]로 남겨요.\n\n이런 점은 기억해 두세요\n\n혜택알리미가 보여 주는 결과는 행정정보와 내가 입력한 조건을 바탕으로 한 안내예요. 그래서 목록에 있다고 해서 자동으로 지급되는 것은 아니고, 신청 기간과 제출 서류, 접수 기관은 혜택마다 달라요. 정책기자단 이용기에서도 정책명을 누르면 서비스 대상, 신청 기간과 방법, 제출 서류, 접수 홈페이지까지 확인할 수 있었다고 소개돼 있어요. 신청 전에는 이 상세 화면과 해당 기관 공고를 꼭 읽어 보세요. 새로운 혜택이 생기면 국민비서 등에서 선택한 앱이나 문자로 알림을 받을 수 있다는 설명도 있었는데, 알림 채널을 고르는 구체적인 설정 방법은 공식 자료로 확인하지 못했어요. [확인 필요: 알림 설정 방법]\n\n한눈에 정리\n\n- 혜택알리미는 정부24 등 공식 채널에서 이용하기\n- '신청하세요'는 바로 신청, '확인하세요'는 조건 확인\n- 가족 혜택은 동의 절차가 필요\n- 같은 이름의 별도 앱·링크는 피싱 주의\n\n혜택 내용과 이용 채널은 바뀔 수 있으니 신청 전 해당 기관의 공식 안내를 꼭 확인해 주세요.", "copyAll": "나라에서 주는 혜택이 많다는데, 정작 내가 받을 수 있는 게 뭔지는 알기 어렵잖아요. 행정안전부가 운영하는 '혜택알리미'는 소득, 거주지 같은 내 상황에 맞는 공공서비스를 찾아 알려주는 서비스예요. 어떤 서비스인지, 어떻게 쓰는지, 그리고 조심할 점까지 공식 발표와 정책브리핑 기사를 바탕으로 정리했습니다. (2026년 10월 5일 기준)\n\n(사진 1 자리)\n\n혜택알리미는 어떤 서비스?\n\n행정안전부는 2025년 12월 9일, 혜택알리미를 10일부터 본격 운영한다고 밝혔어요. 한 번 가입하면 행정·공공기관의 공공서비스를 개인 맞춤형으로 알려주는 알림 서비스예요. 처음에는 청년·구직·임신·전입 등 4개 분야 1,500종을 안내했고, 본격 운영부터는 전 분야 6,000여 종으로 넓어졌다고 해요. 시범운영 기간에 93만 명이 가입했고 650만 건 이상의 공공서비스가 안내됐다는 설명도 있었어요.\n\n2025년 12월 발표 당시 이용 채널은 정부24와 기업은행·신한은행·하나은행·우리은행·웰로 등 5개 민간 앱이었고, 농협은행 앱도 12월 중 추가될 예정이라고 했어요. 이후 제공 채널이 늘었어요. 서울신문(2026년 9월 29일, 행정안전부 자료 인용)에 따르면 현재 정부24와 민간 앱 10곳을 합쳐 11개 앱에서 이용할 수 있고, 2026년 8월 말 기준 이용자가 약 416만 명, 안내 가능한 혜택은 7,075종이라고 해요. 다만 11개 앱의 구체적인 목록은 공식 자료로 확인하지 못했어요. [확인 필요: 현재 이용 가능한 앱 목록은 정부24 안내에서 확인]\n\n어떻게 이용하나요? (정책기자단 이용기 기준)\n\n대상은 국민 누구나(만 14세 미만 제외)라고 행정안전부 카드뉴스에 안내돼 있어요.\n\n1. 정부24에 로그인해요. 모바일 신분증, 간편인증, 공동·금융인증서로 로그인하면 추가 인증 없이 쓸 수 있다고 해요.\n2. 혜택알리미 홈에서 맞춤 조건을 설정해요.\n3. 서비스 이용에 동의해요. 연령, 소득, 가족 구성 같은 정보를 종합해서 분석하기 때문이에요.\n4. 결과 목록을 확인해요.\n\n행정안전부 안내에는 정부24에서 혜택알리미에 가입하고 이용 동의를 한 뒤 '맞춤 혜택 알림 받기'를 선택하는 흐름으로 나와 있어요. 정부24 화면의 메뉴 이름은 바뀔 수 있으니 실제 화면은 직접 확인해 보세요.\n\n(사진 2 자리)\n\n'신청하세요'와 '확인하세요'의 차이\n\n결과 목록은 두 가지로 나뉘어요. '신청하세요'는 내 상황과 자격이 행정정보로 모두 확인되어 바로 신청할 수 있는 혜택이고, '확인하세요'는 일부 정보가 확인되지 않아 신청 조건을 직접 살펴봐야 하는 혜택이라고 설명돼요. 그러니 '확인하세요'에 있는 항목은 조건을 한 번 더 읽어 보는 게 좋겠죠.\n\n가족 혜택도 볼 수 있어요\n\n가족 맞춤안내 기능으로 가족의 혜택도 함께 확인할 수 있어요. 가족을 추가하고 그 가족의 정보제공 동의를 받아야 하고, 등록 대상은 주민등록등본상 같은 세대원이거나 가족관계등록부상 배우자 또는 직계 존속·비속이라고 안내돼요. 정부24 FAQ에 따르면 동의를 한 뒤에는 '맞춤안내 조회(재조회)'를 해야 가족 정보가 반영돼요. 가족의 연령별 동의 방식(14세 이상 본인 동의, 14세 미만 보호자 동의 등)은 공식 자료로 확인하지 못했어요. [확인 필요: 가족 연령별 동의 조건]\n\n꼭 알아둘 주의사항: 비슷한 이름의 앱\n\n행정안전부는 정부와 기업이 '혜택알리미'라는 별도 앱이나 개별 누리집을 운영하고 있지 않다고 밝혔어요. 그래서 같은 이름을 내세운 앱이나 링크를 이용한 피싱에 주의해야 해요. 정부24나 위에서 안내된 민간 앱 안에서 접속하는 것이 안전하다고 이해하시면 돼요.\n\n참고로 정부24의 일부 동의 화면에는 아직 '보조금24 맞춤안내'라는 표기가 남아 있고 같은 주소 경로(rcvfvrSvc)를 쓰고 있어요. 다만 이름이 공식적으로 바뀐 것이라는 발표는 확인하지 못해서 [확인 필요]로 남겨요.\n\n이런 점은 기억해 두세요\n\n혜택알리미가 보여 주는 결과는 행정정보와 내가 입력한 조건을 바탕으로 한 안내예요. 그래서 목록에 있다고 해서 자동으로 지급되는 것은 아니고, 신청 기간과 제출 서류, 접수 기관은 혜택마다 달라요. 정책기자단 이용기에서도 정책명을 누르면 서비스 대상, 신청 기간과 방법, 제출 서류, 접수 홈페이지까지 확인할 수 있었다고 소개돼 있어요. 신청 전에는 이 상세 화면과 해당 기관 공고를 꼭 읽어 보세요. 새로운 혜택이 생기면 국민비서 등에서 선택한 앱이나 문자로 알림을 받을 수 있다는 설명도 있었는데, 알림 채널을 고르는 구체적인 설정 방법은 공식 자료로 확인하지 못했어요. [확인 필요: 알림 설정 방법]\n\n한눈에 정리\n\n- 혜택알리미는 정부24 등 공식 채널에서 이용하기\n- '신청하세요'는 바로 신청, '확인하세요'는 조건 확인\n- 가족 혜택은 동의 절차가 필요\n- 같은 이름의 별도 앱·링크는 피싱 주의\n\n혜택 내용과 이용 채널은 바뀔 수 있으니 신청 전 해당 기관의 공식 안내를 꼭 확인해 주세요.\n\n사진: Océanos y dados / Wikimedia Commons (CC0, 표기 의무 없음 — 출처 병기 권장) https://commons.wikimedia.org/wiki/File:Smartphone_Use.jpg\n\n이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 행정안전부 등 공식 발표 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 혜택 내용과 이용 채널은 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.\n\n(참고: 광고·제휴·협찬·대가성 요소 없음. 특정 민간 앱·금융사 홍보 없음.)", "search": "005 정부24 '혜택알리미'로 내가 받을 수 있는 정부 혜택 확인하는 순서 복지·지원금 혜택알리미, 정부24, 정부 혜택 조회, 가족 맞춤안내 정부24 혜택알리미로 내가 받을 수 있는 공공서비스를 확인하는 순서와 비슷한 이름 앱·피싱 주의점 정리 나라에서 주는 혜택이 많다는데, 정작 내가 받을 수 있는 게 뭔지는 알기 어렵잖아요. 행정안전부가 운영하는 '혜택알리미'는 소득, 거주지 같은 내 상황에 맞는 공공서비스를 찾아 알려주는 서비스예요. 어떤 서비스인지, 어떻게 쓰는지, 그리고 조심할 점까지 공식 발표와 정책브리핑 기사를 바탕으로 정리했습니다. (2026년 10월 5일 기준) (사진 1 자리) 혜택알리미는 어떤 서비스? 행정안전부는 2025년 12월 9일, 혜택알리미를 10일부터 본격 운영한다고 밝혔어요. 한 번 가입하면 행정·공공기관의 공공서비스를 개인 맞춤형으로 알려주는 알림 서비스예요. 처음에는 청년·구직·임신·전입 등 4개 분야 1,500종을 안내했고, 본격 운영부터는 전 분야 6,000여 종으로 넓어졌다고 해요. 시범운영 기간에 93만 명이 가입했고 650만 건 이상의 공공서비스가 안내됐다는 설명도 있었어요. 2025년 12월 발표 당시 이용 채널은 정부24와 기업은행·신한은행·하나은행·우리은행·웰로 등 5개 민간 앱이었고, 농협은행 앱도 12월 중 추가될 예정이라고 했어요. 이후 제공 채널이 늘었어요. 서울신문(2026년 9월 29일, 행정안전부 자료 인용)에 따르면 현재 정부24와 민간 앱 10곳을 합쳐 11개 앱에서 이용할 수 있고, 2026년 8월 말 기준 이용자가 약 416만 명, 안내 가능한 혜택은 7,075종이라고 해요. 다만 11개 앱의 구체적인 목록은 공식 자료로 확인하지 못했어요. [확인 필요: 현재 이용 가능한 앱 목록은 정부24 안내에서 확인] 어떻게 이용하나요? (정책기자단 이용기 기준) 대상은 국민 누구나(만 14세 미만 제외)라고 행정안전부 카드뉴스에 안내돼 있어요. 1. 정부24에 로그인해요. 모바일 신분증, 간편인증, 공동·금융인증서로 로그인하면 추가 인증 없이 쓸 수 있다고 해요. 2. 혜택알리미 홈에서 맞춤 조건을 설정해요. 3. 서비스 이용에 동의해요. 연령, 소득, 가족 구성 같은 정보를 종합해서 분석하기 때문이에요. 4. 결과 목록을 확인해요. 행정안전부 안내에는 정부24에서 혜택알리미에 가입하고 이용 동의를 한 뒤 '맞춤 혜택 알림 받기'를 선택하는 흐름으로 나와 있어요. 정부24 화면의 메뉴 이름은 바뀔 수 있으니 실제 화면은 직접 확인해 보세요. (사진 2 자리) '신청하세요'와 '확인하세요'의 차이 결과 목록은 두 가지로 나뉘어요. '신청하세요'는 내 상황과 자격이 행정정보로 모두 확인되어 바로 신청할 수 있는 혜택이고, '확인하세요'는 일부 정보가 확인되지 않아 신청 조건을 직접 살펴봐야 하는 혜택이라고 설명돼요. 그러니 '확인하세요'에 있는 항목은 조건을 한 번 더 읽어 보는 게 좋겠죠. 가족 혜택도 볼 수 있어요 가족 맞춤안내 기능으로 가족의 혜택도 함께 확인할 수 있어요. 가족을 추가하고 그 가족의 정보제공 동의를 받아야 하고, 등록 대상은 주민등록등본상 같은 세대원이거나 가족관계등록부상 배우자 또는 직계 존속·비속이라고 안내돼요. 정부24 FAQ에 따르면 동의를 한 뒤에는 '맞춤안내 조회(재조회)'를 해야 가족 정보가 반영돼요. 가족의 연령별 동의 방식(14세 이상 본인 동의, 14세 미만 보호자 동의 등)은 공식 자료로 확인하지 못했어요. [확인 필요: 가족 연령별 동의 조건] 꼭 알아둘 주의사항: 비슷한 이름의 앱 행정안전부는 정부와 기업이 '혜택알리미'라는 별도 앱이나 개별 누리집을 운영하고 있지 않다고 밝혔어요. 그래서 같은 이름을 내세운 앱이나 링크를 이용한 피싱에 주의해야 해요. 정부24나 위에서 안내된 민간 앱 안에서 접속하는 것이 안전하다고 이해하시면 돼요. 참고로 정부24의 일부 동의 화면에는 아직 '보조금24 맞춤안내'라는 표기가 남아 있고 같은 주소 경로(rcvfvrSvc)를 쓰고 있어요. 다만 이름이 공식적으로 바뀐 것이라는 발표는 확인하지 못해서 [확인 필요]로 남겨요. 이런 점은 기억해 두세요 혜택알리미가 보여 주는 결과는 행정정보와 내가 입력한 조건을 바탕으로 한 안내예요. 그래서 목록에 있다고 해서 자동으로 지급되는 것은 아니고, 신청 기간과 제출 서류, 접수 기관은 혜택마다 달라요. 정책기자단 이용기에서도 정책명을 누르면 서비스 대상, 신청 기간과 방법, 제출 서류, 접수 홈페이지까지 확인할 수 있었다고 소개돼 있어요. 신청 전에는 이 상세 화면과 해당 기관 공고를 꼭 읽어 보세요. 새로운 혜택이 생기면 국민비서 등에서 선택한 앱이나 문자로 알림을 받을 수 있다는 설명도 있었는데, 알림 채널을 고르는 구체적인 설정 방법은 공식 자료로 확인하지 못했어요. [확인 필요: 알림 설정 방법] 한눈에 정리 - 혜택알리미는 정부24 등 공식 채널에서 이용하기 - '신청하세요'는 바로 신청, '확인하세요'는 조건 확인 - 가족 혜택은 동의 절차가 필요 - 같은 이름의 별도 앱·링크는 피싱 주의 혜택 내용과 이용 채널은 바뀔 수 있으니 신청 전 해당 기관의 공식 안내를 꼭 확인해 주세요. 네이버"}, {"id": "004", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "004_hidden-financial-assets.md", "title": "안 쓰는 계좌에 내 돈이 남아 있을지도? '내계좌 한눈에' 조회 방법", "cands": ["안 쓰는 계좌에 내 돈이 남아 있을지도? '내계좌 한눈에' 조회 방법", "잠자는 내 돈 찾기, 어디서 조회하는지 헷갈릴 때 (금융감독원 파인 기준)", "휴면·장기미거래 계좌, 순서대로 따라 하면 되는 조회 방법"], "cat": "금융·자산조회", "kw": ["내계좌 한눈에", "휴면계좌", "장기미거래", "잠자는 내 돈 찾기"], "summary": "금감원 파인 '내계좌 한눈에'로 휴면·장기미거래 금융자산을 조회하는 방법과 피싱 주의점 정리", "status": "초안", "created": "2026-10-05 01:34", "base": "2026-10-05", "need": 1, "chars": 2538, "chars_ns": 2001, "imgs": 2, "slots": 2, "html": "<p>오래전에 만든 통장이나 한동안 쓰지 않은 계좌, 한두 개쯤은 있으시죠? 그런 계좌에 돈이 남아 있는지 한 번에 확인할 수 있는 공식 서비스가 있어요. 금융감독원 금융소비자 정보포털 '파인'에서 안내하는 '내계좌 한눈에'입니다. 어떤 서비스인지, 어떻게 조회하는지 공식 안내를 중심으로 정리했어요. (2026년 10월 5일 기준)<\/p>\n<div class=\"ph-empty\"><b>사진 1 자리<\/b>대표 이미지: 파인(fine.fss.or.kr) &#x27;내계좌 통합조회 및 관리&#x27; 안내 화면 (공식 화면 캡처, 출처 표기)<small>직접 찍거나 캡처한 사진을 넣는 위치 (개인정보 가림)<\/small><\/div>\n<h3>'내계좌 한눈에'가 뭐예요?<\/h3>\n<p>파인 안내에 따르면 '내계좌 한눈에(계좌정보통합관리 서비스)'는 내 장기 미거래·휴면 금융자산을 간편하게 조회하는 서비스예요. 조회 대상으로 예·적금, 신탁, 투자자 예탁금, 휴면예금, 보험금 등이 안내되어 있어요. 문의는 금감원 콜센터(1332)에서 받는다고 되어 있고요.<\/p>\n<p>접속 경로는 파인(fine.fss.or.kr)의 '내 돈 관리' 메뉴에서 '내계좌 통합조회 및 관리'를 찾아 들어가면 돼요. 공식 안내 화면에는 서비스 주소로 payinfo.or.kr이 표시되어 있어요. 검색 결과의 광고나 문자로 받은 링크 대신, 공식 주소를 직접 입력하거나 파인에서 들어가는 방법을 권해 드려요. (이 부분은 제 개인적인 권고예요.)<\/p>\n<h3>어떤 자산을 찾을 수 있나?<\/h3>\n<p>금융위원회 보도자료(2023년 11월 13일)를 참고하면 대략 이런 구분이 있어요.<\/p>\n<ul><li>휴면금융자산: 소멸시효가 완성된 예금·보험금 등(휴면예금, 휴면보험금 등)<\/li><li>장기미거래 금융자산: 3년 이상 거래(입출금 등)가 없는 예·적금, 투자자예탁금, 보험금, 신탁 등<\/li><li>미사용 카드 포인트: 카드회원약관상 소멸시효가 5년이라서, 5년이 지나면 소멸할 수 있어요(금융위 2021년 1월 보도자료). 카드 포인트는 같은 경로의 '내 카드 한눈에'에서 조회·현금화할 수 있다고 안내돼요.<\/li><\/ul>\n<p>금융위는 1년 이상 거래가 없고 잔고가 100만 원 이하인 예금·적금·투자자예탁금·신탁계좌는 즉시 환급받을 수도 있다고 안내해요. 다만 '내계좌 통합조회'로는 대부분의 장기미거래 금융자산만 조회된다고 하니, 모든 자산이 한 번에 나온다고 기대하기는 어려워요.<\/p>\n<p>내계좌 한눈에로 조회되지 않는 자산도 있어요. 미청구 보험금은 '내 보험 찾아줌'(생명·손해보험협회), 실기주과실은 한국예탁결제원에서 따로 조회해야 한다고 안내돼요. 파인의 '업권별 계좌 조회 및 관리' 페이지에는 2026년 10월 5일 확인 기준으로 은행연합회(휴면예금·휴면보험금), 저축은행, 새마을금고(휴면예금·휴면공제금), 서민금융진흥원, 금융투자협회(휴면성증권), 한국예탁결제원(미수령주식·실기주과실), 내 보험 찾아줌, 보험개발원(자동차보험 과납보험료), 여신금융협회(카드포인트), 예금보험공사(파산금융기관 미수령금), 민원24(미환급공과금) 등 기관별 조회 링크가 모여 있어요. 항목 수와 구성은 바뀔 수 있어서 개수는 따로 적지 않을게요.<\/p>\n<h3>조회 순서 (금융위원회 안내 기준)<\/h3>\n<ol><li>PC는 파인(fine.fss.or.kr) 또는 payinfo.or.kr에 접속하고, 모바일은 '어카운트인포' 앱을 설치<\/li><li>'내계좌 한눈에'(파인에서는 '내계좌 통합조회 및 관리') 선택<\/li><li>본인 인증(휴대폰 인증 등) 진행<\/li><li>본인 명의 계좌와 휴면·장기미거래 자산 확인(앱에서는 하단 '계좌' 또는 더보기 메뉴에서 찾을 수 있다고 안내)<\/li><li>필요한 경우 잔고 이전이나 미사용 계좌 해지 등 처리<\/li><\/ol>\n<p>이 순서는 금융위원회 2023년 카드뉴스 안내를 바탕으로 한 것이라 현재 화면과 메뉴 이름이 조금 다를 수 있어요. <mark class=\"need\">[확인 필요: 현재 화면 구성은 직접 접속해 확인]<\/mark> 어카운트인포 앱은 금융위원회가 2025년 9월 휴면·장기미거래 금융자산 찾기 캠페인에서 안내한 공식 앱이에요.<\/p>\n<div class=\"ph-empty\"><b>사진 2 자리<\/b>본인 인증 직전 화면 등 개인정보가 없는 단계만 캡처<small>직접 찍거나 캡처한 사진을 넣는 위치 (개인정보 가림)<\/small><\/div>\n<h3>어떤 분들이 한 번 확인해 보면 좋을까?<\/h3>\n<p>이 부분은 공식 자료가 아니라 제 생각이에요. 학생 때나 첫 직장 시절에 급여 통장을 여러 개 만들었던 분, 이사나 이직을 하면서 쓰던 은행이 바뀐 분, 자동이체를 정리하지 않고 방치한 계좌가 있는 분이라면 한 번쯤 조회해 볼 만해요. 내 명의로 어떤 계좌가 남아 있는지 파악해 두면 쓰지 않는 계좌를 정리하는 데도 도움이 되고요. 다만 조회 결과가 어떻게 나올지는 사람마다 다르고, 돈이 남아 있을 것이라고 장담할 수는 없어요.<\/p>\n<h3>조회할 때 주의할 점<\/h3>\n<ul><li>조회 화면에는 계좌번호와 잔액이 나오니 캡처나 공유 전에 반드시 가려 주세요.<\/li><li>인증서·휴대폰 인증 정보는 공식 사이트에서만 입력하세요.<\/li><li>금융위원회는 금융회사가 이메일이나 문자로 신분증·계좌 비밀번호를 요구하지 않고, 환급을 이유로 수수료 이체를 요구하지 않으며, 별도 URL을 보내지 않는다고 안내해요. 이런 연락은 피싱을 의심하세요.<\/li><li>어떤 금융상품을 가입하라거나 대출을 받으라는 안내와는 관계없는 조회 서비스예요.<\/li><\/ul>\n<h3>한눈에 정리<\/h3>\n<ul><li>공식 서비스: 파인 '내계좌 한눈에'(장기 미거래·휴면 금융자산 조회)<\/li><li>접속은 공식 주소로, 인증은 공식 화면에서만<\/li><li>세부 대상 기준은 시기에 따라 달라질 수 있으니 공식 안내 재확인<\/li><\/ul>\n<p>제도와 화면은 바뀔 수 있으니 이용 전 금융감독원 공식 안내를 꼭 다시 확인해 주세요.<\/p><div class=\"gallery\"><div class=\"gl\">참고 이미지 (본문 하단·분위기용)<\/div><figure class=\"ph\"><img loading=\"lazy\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wgARCAHgAtADASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAMBAgQFBgf/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAfZAQAAAgAoBQAAAASAnC308/Cz49HZxK2Z6cynfuvD09Kbjjc/scWcya256L0nK0RIXXYM7ldM+j5zO10nmp9NSduPunGnZ0+Qi59icHq68+kDWQAAAAAAAAAAAAAAAAAAAAAAAAgAAAAKAIAAAQAUAABAC0AAEw3BhJ1jP1KZ65NszNTMWuYku
