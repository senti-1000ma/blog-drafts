<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>콘텐츠 초안 대시보드 · 네이버 · X</title>
<script>(function(){try{var u=new URLSearchParams(location.search).get("theme");var t=u||localStorage.getItem("dash_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="light"}})()</script>
<style>
:root{
 --bg:#f4f6f9;--panel:#ffffff;--panel2:#f8fafc;--tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;--line:#e5e9f0;--line2:#eef1f5;
 --acc:#4f46e5;--acc-bg:#eef2ff;--nv:#03c75a;--nv-bg:#e6f9ee;--xb:#1d9bf0;--x-bg:#e8f5fd;--cr:#f7931a;--cr-bg:#fff4e5;
 --warn:#b45309;--warn-bg:#fef3c7;--ok:#047857;--ok-bg:#d1fae5;--bad:#dc2626;--bad-bg:#fee2e2;
 --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.06);--shadow-h:0 2px 4px rgba(15,23,42,.06),0 12px 28px rgba(15,23,42,.10);
 --r:14px;--side:264px;--top:64px;
 --font:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif;
 --nvfont:"Nanum Gothic","NanumGothic","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
 /* naver/x preview surfaces */
 --pv-bg:#ffffff;--pv-tx:#222;--pv-tx2:#888;--pv-line:#e8e8e8;
 --tw-bg:#ffffff;--tw-tx:#0f1419;--tw-tx2:#536471;--tw-line:#eff3f4;--tw-thread:#cfd9de;--tw-hover:#f7f9f9;
}
[data-theme=dark]{
 --bg:#0b0f17;--panel:#121826;--panel2:#171e2e;--tx:#e5e9f0;--tx2:#a3adbf;--tx3:#667085;--line:#232b3b;--line2:#1b2232;
 --acc:#818cf8;--acc-bg:#1e2246;--nv-bg:#0f2e1e;--x-bg:#0d2537;--cr-bg:#36240c;
 --warn:#fbbf24;--warn-bg:#3a2a0b;--ok:#34d399;--ok-bg:#0d2d22;--bad:#f87171;--bad-bg:#3b1414;
 --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);--shadow-h:0 2px 4px rgba(0,0,0,.35),0 12px 28px rgba(0,0,0,.4);
 --pv-bg:#1a1d22;--pv-tx:#e4e6ea;--pv-tx2:#9198a1;--pv-line:#2c3036;
 --tw-bg:#000000;--tw-tx:#e7e9ea;--tw-tx2:#71767b;--tw-line:#2f3336;--tw-thread:#333639;--tw-hover:#080808;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.6 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--xb)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
svg.f{fill:currentColor;stroke:none}
/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
aside.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:18px 14px 24px;display:flex;flex-direction:column;gap:18px;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 6px}
.brand .lg{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#03c75a);display:grid;place-items:center;color:#fff;font-size:19px;box-shadow:var(--shadow)}
.brand b{display:block;font-size:15px;line-height:1.25}
.brand small{color:var(--tx3);font-size:12px}
.grp h6{margin:0 0 6px;padding:0 8px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);font-weight:700}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:10px;text-align:left;color:var(--tx2);font-size:14px;font-weight:500}
.nav:hover{background:var(--panel2);color:var(--tx)}
.nav.on{background:var(--acc-bg);color:var(--acc);font-weight:700}
.nav .n{margin-left:auto;font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;background:var(--panel2);border-radius:99px;padding:0 8px;min-width:26px;text-align:center}
.nav.on .n{background:var(--panel);color:var(--acc)}
.nav.zero{opacity:.45}
.nav .dot{width:8px;height:8px;border-radius:50%;flex:none}
.pi{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;color:#fff;font-size:12px;font-weight:800}
.pi svg{width:12px;height:12px}
.pi.all{background:linear-gradient(135deg,#6366f1,#8b5cf6)}.pi.naver{background:var(--nv)}.pi.x{background:#0f1419}.pi.crypto{background:var(--cr)}
[data-theme=dark] .pi.x{background:#e7e9ea;color:#000}
.toggle{display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:13.5px;color:var(--tx2);cursor:pointer;border-radius:10px}
.toggle:hover{background:var(--panel2)}
.toggle input{accent-color:var(--acc);width:16px;height:16px}
.side .foot{margin-top:auto;font-size:12px;color:var(--tx3);padding:0 8px;line-height:1.6}
.scrim{display:none}
main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;height:var(--top);display:flex;align-items:center;gap:10px;padding:0 24px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(12px);-webkit-backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--line)}
.ib{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--tx2);flex:none}
.ib:hover{color:var(--tx);border-color:var(--tx3)}
#menuBtn{display:none}
.search{flex:1;max-width:640px;position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--tx3)}
.search input{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:0 44px 0 40px;font-size:14.5px;outline:none;transition:.15s}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-bg)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:11px/1 var(--font);color:var(--tx3);border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--panel2)}
.topbar .sp{flex:1}
.sel{height:40px;border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:0 10px;font-size:13.5px;color:var(--tx2)}
.content{padding:22px 24px 60px;max-width:1440px;width:100%}
/* ---------- list ---------- */
.lhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.lhead h1{margin:0;font-size:22px;letter-spacing:-.02em}
.lhead .crumb{font-size:13px;color:var(--tx3)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stat .k{font-size:12.5px;color:var(--tx3);display:flex;align-items:center;gap:6px}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;font-weight:500;color:var(--tx3);margin-left:4px}
.seg{display:none;gap:6px;overflow-x:auto;margin:-4px 0 14px;padding-bottom:2px;scrollbar-width:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 13px;font-size:13px;color:var(--tx2)}
.seg button.on{background:var(--tx);color:var(--panel);border-color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;text-align:left;padding:0;color:inherit}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-h);border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.card:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card .thumb{height:132px;background:var(--panel2) center/cover no-repeat;border-bottom:1px solid var(--line2)}
.card .thumb.tw{display:flex;flex-direction:column;justify-content:center;padding:14px 16px;background:linear-gradient(135deg,var(--x-bg),var(--panel2));font-size:13px;line-height:1.5;color:var(--tx2);white-space:pre-line;overflow:hidden}
.card .thumb.tw.crypto{background:linear-gradient(135deg,var(--cr-bg),var(--panel2))}
.card .thumb.tw span{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.card .thumb.nimg{display:grid;place-items:center;color:var(--tx3);background:linear-gradient(135deg,var(--nv-bg),var(--panel2))}
.card .thumb.nimg svg{width:30px;height:30px;stroke-width:1.5}
.card .bd{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .t{font-weight:700;font-size:15.5px;line-height:1.45;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .s{font-size:13px;color:var(--tx2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .ft{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx3);padding-top:6px;border-top:1px dashed var(--line2)}
.card .ft .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.b{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;line-height:1}
.b svg{width:11px;height:11px}
.b.naver{background:var(--nv-bg);color:#02a54b}[data-theme=dark] .b.naver{color:#4ade80}
.b.x_general{background:var(--x-bg);color:#1a8cd8}
.b.x_crypto{background:var(--cr-bg);color:#c26a00}[data-theme=dark] .b.x_crypto{color:#fbbf24}
.b.cat{background:var(--panel2);color:var(--tx2);border:1px solid var(--line);font-weight:600}
.b.st{background:var(--acc-bg);color:var(--acc)}
.b.need{background:var(--warn-bg);color:var(--warn)}
.b.ok{background:var(--ok-bg);color:var(--ok)}
.empty{text-align:center;padding:70px 20px;color:var(--tx3)}
.empty b{display:block;font-size:17px;color:var(--tx2);margin-bottom:4px}
/* ---------- detail ---------- */
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.back{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;font-size:13.5px;color:var(--tx2)}
.back:hover{color:var(--tx)}
.dhead .ttl{flex:1;min-width:200px;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx2)}
.tabs{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.tabs button{border:0;background:none;padding:7px 16px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--tx3);display:flex;align-items:center;gap:6px}
.tabs button.on{background:var(--panel);color:var(--tx);box-shadow:var(--shadow)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.info{position:sticky;top:calc(var(--top) + 18px);padding:16px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - var(--top) - 36px);overflow-y:auto}
.info h4{margin:0;font-size:13px;color:var(--tx3);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--tx3)}.kv dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;word-break:break-all}
.info select{width:100%;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:0 10px}
.note{font-size:12.5px;color:var(--tx3);line-height:1.6}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.55}
.alert.ok{background:var(--ok-bg);color:var(--ok)}
details.ex{border:1px solid var(--line);border-radius:12px;background:var(--panel2);font-size:13.5px}
details.ex summary{cursor:pointer;font-weight:700;padding:10px 12px;list-style:none;display:flex;align-items:center;gap:8px}
details.ex summary::-webkit-details-marker{display:none}
details.ex summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--tx3);border-bottom:2px solid var(--tx3);transform:rotate(45deg);transition:.15s}
details.ex[open] summary::after{transform:rotate(225deg)}
details.ex .xb{padding:0 12px 10px;overflow-x:auto}
details.ex ul{padding-left:18px;margin:6px 0}details.ex li.cb{list-style:none;margin-left:-16px}
details.ex table{border-collapse:collapse;font-size:12.5px;width:100%}
details.ex th,details.ex td{border:1px solid var(--line);padding:5px 7px;vertical-align:top;text-align:left}
details.ex a{word-break:break-all}
mark.need{background:#fde68a;color:#713f12;padding:0 3px;border-radius:4px;font-weight:700}
/* copy tab */
.cpane{padding:18px;display:flex;flex-direction:column;gap:16px}
.cbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 15px;border-radius:11px;border:1px solid var(--line);background:var(--panel);font-size:14px;font-weight:600;color:var(--tx)}
.btn:hover{border-color:var(--tx3)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.p:hover{filter:brightness(1.08)}
.btn.nv{background:var(--nv);border-color:var(--nv);color:#fff}
.btn.xx{background:var(--tx);border-color:var(--tx);color:var(--panel)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.sec h5{margin:0 0 8px;font-size:13px;color:var(--tx3);font-weight:700;display:flex;align-items:center;gap:8px}
.cands{display:flex;flex-direction:column;gap:6px}
.cand{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 8px 8px 12px;font-size:14px}
.cand .no{color:var(--tx3);font-weight:700;font-size:12px;flex:none}
.cand span.tx{flex:1;min-width:0}
.raw{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font:14px/1.75 var(--font);white-space:pre-wrap;word-break:break-word;max-height:560px;overflow:auto;margin:0}
.raw.short{max-height:none}
.blk{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.blk .bh{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--tx2)}
.blk .bh .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.blk .raw{border:0;border-radius:0;background:var(--panel)}
.lenb{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--ok-bg);color:var(--ok);font-variant-numeric:tabular-nums}
.lenb.warn{background:var(--warn-bg);color:var(--warn)}.lenb.bad{background:var(--bad-bg);color:var(--bad)}
.ko{background:var(--acc-bg);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.65}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--tx2)}
/* ---------- NAVER preview ---------- */
.nvwrap{background:var(--pv-bg);color:var(--pv-tx);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);overflow:clip}
.nv-top{display:flex;align-items:center;gap:10px;height:50px;padding:0 20px;border-bottom:1px solid var(--pv-line);font-size:14px}
.nv-top .nlogo{width:20px;height:20px;border-radius:4px;background:var(--nv);display:grid;place-items:center;color:#fff}
.nv-top .nlogo svg{width:10px;height:10px}
.nv-top b{font-weight:800}
.nv-top .bn{color:var(--pv-tx2);font-size:13px}
.nv-top .tr{margin-left:auto;display:flex;gap:14px;color:var(--pv-tx2)}
.nv-post{max-width:740px;margin:0 auto;padding:44px 28px 30px;font-family:var(--nvfont)}
.nv-cat{font-size:13px;color:var(--pv-tx2);margin-bottom:12px}
.nv-cat a{color:var(--pv-tx2);text-decoration:none}
.nv-cat a:hover{text-decoration:underline}
.nv-title{font-size:30px;line-height:1.42;font-weight:400;letter-spacing:-.02em;margin:0 0 26px;word-break:keep-all}
.nv-prof{display:flex;align-items:center;gap:10px;padding-bottom:22px;border-bottom:1px solid var(--pv-line)}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:21px;background:linear-gradient(135deg,#ffe1b5,#ffd0e0);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.av.s{width:34px;height:34px;font-size:18px}
.nv-prof .nm{font-size:14px;font-weight:700}
.nv-prof .dt{font-size:13px;color:var(--pv-tx2);margin-left:8px;font-weight:400}
.nv-prof .tr{margin-left:auto;display:flex;gap:6px}
.nv-prof .tr span{font-size:12px;border:1px solid var(--pv-line);border-radius:4px;padding:3px 8px;color:var(--pv-tx2)}
.nv-body{padding-top:34px;font-size:16px;line-height:1.9;word-break:keep-all;overflow-wrap:anywhere}
.nv-body p{margin:0 0 1.25em}
.nv-body h3{font-size:23px;line-height:1.5;font-weight:700;margin:2.2em 0 .8em;padding-bottom:10px;border-bottom:2px solid var(--pv-tx);letter-spacing:-.02em}
.nv-body h4{font-size:19px;font-weight:700;margin:1.8em 0 .6em}
.nv-body h5{font-size:16.5px;font-weight:700;margin:1.4em 0 .5em}
.nv-body ul,.nv-body ol{padding-left:1.4em;margin:0 0 1.25em}
.nv-body li{margin:.25em 0}
.nv-body li.cb{list-style:none;margin-left:-1.2em}
.nv-body blockquote{margin:1.8em 0;padding:18px 26px;text-align:center;font-size:17px;line-height:1.75;color:var(--pv-tx);position:relative;border:0;background:none}
.nv-body blockquote::before,.nv-body blockquote::after{content:"“";display:block;font:700 46px/1 Georgia,serif;color:var(--nv);height:24px}
.nv-body blockquote::after{content:"”";margin-top:12px}
.nv-body hr{border:0;margin:2.2em auto;width:60px;border-top:2px solid var(--pv-line)}
.nv-body .tw{overflow-x:auto;margin:1.4em 0}
.nv-body table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.6}
.nv-body th,.nv-body td{border:1px solid var(--pv-line);padding:9px 11px;vertical-align:top;text-align:left}
.nv-body th{background:color-mix(in srgb,var(--pv-line) 45%,transparent);font-weight:700}
.nv-body code{background:color-mix(in srgb,var(--pv-line) 60%,transparent);padding:1px 5px;border-radius:4px;font-size:.9em}
.nv-body a{color:#1e6fd9;word-break:break-all}
.nv-body figure.ph{margin:1.8em 0;text-align:center}
.nv-body figure.ph img{max-width:100%;height:auto;display:block;margin:0 auto}
.nv-body figcaption{font-size:13px;color:var(--pv-tx2);margin-top:8px}
.nv-body .ph-empty{margin:1.8em 0;aspect-ratio:16/9;max-height:380px;width:100%;background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--pv-line) 45%,transparent) 0 12px,transparent 12px 24px),color-mix(in srgb,var(--pv-line) 30%,transparent);border:1px dashed color-mix(in srgb,var(--pv-tx2) 50%,transparent);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--pv-tx2);font-size:14px;text-align:center;padding:16px;line-height:1.5}
.nv-body .ph-empty::before{content:"";width:44px;height:44px;background:currentColor;opacity:.55;-webkit-mask:var(--cam) center/contain no-repeat;mask:var(--cam) center/contain no-repeat}

entry declaration that replaced the paper card. (3/6) --- Timing: you can file it from 3 days before arrival (Korea time). It's valid for 72 hours after submission. Have ready: passport, email address, entry date/flight number, and where you'll stay. (4/6) --- Want to skip the arrival card? Exempt travelers may still apply for K-ETA. Fee: 10,000 KRW per person (plus ~3% card processing), non-refundable even if denied. K-ETA holders are generally excluded from the e-Arrival Card, but visa holders with a K-ETA still file one. (5/6) --- The exemption runs through Dec 31, 2026 (KST). Planning a 2027 trip? Check the official K-ETA notices before you book. [확인 필요: 2027년 연장 공지 여부] (6/6) X 일반"}, {"id": "019", "platform": "x", "sub": "x_general", "subLabel": "X 일반", "file": "019_korean-age-law.md", "title": "Korea has three ways to count age — and until June 2023, many people used the one that made them older", "cands": ["Korea has three ways to count age — and until June 2023, many people used the one that made them older", "How old are you in Korea? It depends on which of 3 systems you ask.", "Korean age vs international age: what the 2023 law changed (and what it didn't)"], "cat": "한국 제도·문화", "kw": ["Korean age", "international age", "age counting", "Korea law 2023", "culture"], "summary": "한국의 세 가지 나이 셈법(세는 나이·연 나이·만 나이)과 2023년 6월 28일 만 나이 통일법의 적용 범위·예외를 6개 트윗으로 설명", "status": "초안", "created": "2026-10-05 12:39", "base": "2026-10-05", "format": "thread", "hashtags": "#Korea", "tags": ["#Korea"], "ko": "한국에는 세는 나이·연 나이·만 나이 세 가지 셈법이 있고, 2023년 6월 28일부터 법령·계약·공문서의 나이는 특별한 규정이 없으면 만 나이예요. 연금·정년은 원래 만 나이라 변화 없고, 취학·병역·청소년보호법상 술·담배·공무원 시험·보험나이 등은 2023년 당시 예외였어요(현재 규정은 확인 필요). 칠순·팔순 같은 사적 관습은 강제로 바꾸지 않는다고 법제처가 안내했어요.", "need": 1, "chars": 255, "imgs": 0, "tweets": [{"n": 1, "total": 6, "text": "How old are you in Korea? It depends on which of THREE systems you ask — and until June 2023, many people used the one that made them 1–2 years older. 🧵 #Korea (1/6)", "len": 166, "need": 0, "media": []}, {"n": 2, "total": 6, "text": "1) \"Korean age\": a baby is 1 at birth, and everyone adds a year on Jan 1.\n2) \"Yearly age\": current year minus birth year.\n3) \"Full age\" (international): starts at 0, +1 on each birthday. (2/6)", "len": 192, "need": 0, "media": []}, {"n": 3, "total": 6, "text": "On June 28, 2023, full age became the standard for laws, contracts and official documents, through amendments to the Civil Act and the Framework Act on Administrative Regulations (행정기본법).\n\nUnless a rule says otherwise, \"age\" now means full age. (3/6)", "len": 255, "need": 0, "media": []}, {"n": 4, "total": 6, "text": "Example from the Ministry of Government Legislation: someone born in 1993 is 30 in 2023 after their birthday — and 29 before it.\n\nFull age = current year − birth year, minus 1 if your birthday hasn't passed yet. (4/6)", "len": 218, "need": 0, "media": []}, {"n": 5, "total": 6, "text": "Not everything changed. Pension and retirement ages stayed the same — they were already based on full age.\n\nExceptions announced in 2023: elementary school entry, the draft, alcohol/tobacco purchase age, civil service exams, and insurance age. [확인 필요: 2023년 이후 예외 규정 변경 여부] (5/6)", "len": 249, "need": 1, "media": []}, {"n": 6, "total": 6, "text": "What about milestone birthdays like the 70th or 80th? The ministry said private customs shouldn't be forcibly changed.\n\nSo Korean age may still show up in private life — but on forms and contracts, it's full age. (6/6)", "len": 218, "need": 0, "media": []}], "replies": [{"text": "Sources: Korea.net (official) on the revised age system https://www.korea.net/NewsFocus/policies/view?articleId=234677&pageIndex=1 · Policy Briefing (Korean) FAQ from the Ministry of Government Legislation https://www.korea.kr/news/policyNewsView.do?newsId=148916510 · Ministry of National Defense / MMA notice on the draft age rule (Korean) https://www.korea.kr/briefing/pressReleaseView.do?newsId=156577420", "len": 277, "need": 0}], "plain": "How old are you in Korea? It depends on which of THREE systems you ask — and until June 2023, many people used the one that made them 1–2 years older. 🧵 #Korea (1/6)\n\n---\n\n1) \"Korean age\": a baby is 1 at birth, and everyone adds a year on Jan 1.\n2) \"Yearly age\": current year minus birth year.\n3) \"Full age\" (international): starts at 0, +1 on each birthday. (2/6)\n\n---\n\nOn June 28, 2023, full age became the standard for laws, contracts and official documents, through amendments to the Civil Act and the Framework Act on Administrative Regulations (행정기본법).\n\nUnless a rule says otherwise, \"age\" now means full age. (3/6)\n\n---\n\nExample from the Ministry of Government Legislation: someone born in 1993 is 30 in 2023 after their birthday — and 29 before it.\n\nFull age = current year − birth year, minus 1 if your birthday hasn't passed yet. (4/6)\n\n---\n\nNot everything changed. Pension and retirement ages stayed the same — they were already based on full age.\n\nExceptions announced in 2023: elementary school entry, the draft, alcohol/tobacco purchase age, civil service exams, and insurance age. [확인 필요: 2023년 이후 예외 규정 변경 여부] (5/6)\n\n---\n\nWhat about milestone birthdays like the 70th or 80th? The ministry said private customs shouldn't be forcibly changed.\n\nSo Korean age may still show up in private life — but on forms and contracts, it's full age. (6/6)", "copyAll": "How old are you in Korea? It depends on which of THREE systems you ask — and until June 2023, many people used the one that made them 1–2 years older. 🧵 #Korea (1/6)\n\n---\n\n1) \"Korean age\": a baby is 1 at birth, and everyone adds a year on Jan 1.\n2) \"Yearly age\": current year minus birth year.\n3) \"Full age\" (international): starts at 0, +1 on each birthday. (2/6)\n\n---\n\nOn June 28, 2023, full age became the standard for laws, contracts and official documents, through amendments to the Civil Act and the Framework Act on Administrative Regulations (행정기본법).\n\nUnless a rule says otherwise, \"age\" now means full age. (3/6)\n\n---\n\nExample from the Ministry of Government Legislation: someone born in 1993 is 30 in 2023 after their birthday — and 29 before it.\n\nFull age = current year − birth year, minus 1 if your birthday hasn't passed yet. (4/6)\n\n---\n\nNot everything changed. Pension and retirement ages stayed the same — they were already based on full age.\n\nExceptions announced in 2023: elementary school entry, the draft, alcohol/tobacco purchase age, civil service exams, and insurance age. [확인 필요: 2023년 이후 예외 규정 변경 여부] (5/6)\n\n---\n\nWhat about milestone birthdays like the 70th or 80th? The ministry said private customs shouldn't be forcibly changed.\n\nSo Korean age may still show up in private life — but on forms and contracts, it's full age. (6/6)", "extras": [{"title": "이미지·미디어 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>트윗 2<\/td><td>세 가지 나이 셈법 비교 표 이미지(직접 제작, 예: 1993년생 기준 비교)<\/td><td>비교 수치를 만들 때는 계산을 한 번 더 검산. 이미지에만 정보를 넣지 말고 본문에도 둘 것<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 트윗 5의 <mark class=\"need\">[확인 필요]<\/mark>: 취학·병역·술·담배·공무원시험·보험나이 예외가 2023년 이후 바뀌었는지 법제처(<a href=\"https://www.moleg.go.kr\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.moleg.go.kr<\/a>) 또는 해당 부처 최신 안내로 확인한 뒤 문장 수정, <mark class=\"need\">[확인 필요]<\/mark> 표시 삭제<\/li><li class=\"cb\">☐ 트윗 2 세 가지 셈법 설명을 Korea.net 기사와 대조(Korea.net 기사는 2023-06-27 기준)<\/li><li class=\"cb\">☐ 트윗 3의 영문 법 명칭(\"Framework Act on Administrative Regulations\")이 법제처 영문 법령 명칭과 같은지 확인<\/li><li class=\"cb\">☐ 트윗 4의 1993년생 예시는 정책브리핑(법제처 FAQ)의 \"2023년 기준 30세/29세\" 예시 — 현재 연도 기준으로 바꿔 쓰려면 직접 다시 계산<\/li><li class=\"cb\">☐ 발행은 직접 수동으로<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>세 가지 나이 셈법, 만 나이 표준화, 예외(취학·병역·술담배·공무원 시험·보험나이)<\/td><td>Korea.net(대한민국 공식 포털) <a href=\"https://www.korea.net/NewsFocus/policies/view?articleId=234677&amp;pageIndex=1\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.net/NewsFocus/policies/view?articleId=234677&amp;pageIndex=1<\/a><\/td><td>공식<\/td><\/tr><tr><td>만 나이 계산법, 행정기본법·민법 개정, 연금·정년 변화 없음, 칠순·팔순 관습, 연 나이 예외<\/td><td>대한민국 정책브리핑(법제처 FAQ 정리) <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148916510\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyNewsView.do?newsId=148916510<\/a><\/td><td>공식<\/td><\/tr><tr><td>병역법상 연 나이 기준 유지(2023-06-28)<\/td><td>정책브리핑 보도자료(국방부·병무청) <a href=\"https://www.korea.kr/briefing/pressReleaseView.do?newsId=156577420\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/briefing/pressReleaseView.do?newsId=156577420<\/a><\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>X는 AI 활용 표기가 필수는 아니지만, 원하면 프로필이나 스레드 끝 답글에 쓸 수 있는 문구: \"Drafted with AI assistance; facts checked against official sources before posting. Dates and rules can change.\"<\/blockquote>", "open": false}], "search": "019 Korea has three ways to count age — and until June 2023, many people used the one that made them older 한국 제도·문화 Korean age, international age, age counting, Korea law 2023, culture #Korea 한국의 세 가지 나이 셈법(세는 나이·연 나이·만 나이)과 2023년 6월 28일 만 나이 통일법의 적용 범위·예외를 6개 트윗으로 설명 한국에는 세는 나이·연 나이·만 나이 세 가지 셈법이 있고, 2023년 6월 28일부터 법령·계약·공문서의 나이는 특별한 규정이 없으면 만 나이예요. 연금·정년은 원래 만 나이라 변화 없고, 취학·병역·청소년보호법상 술·담배·공무원 시험·보험나이 등은 2023년 당시 예외였어요(현재 규정은 확인 필요). 칠순·팔순 같은 사적 관습은 강제로 바꾸지 않는다고 법제처가 안내했어요. How old are you in Korea? It depends on which of THREE systems you ask — and until June 2023, many people used the one that made them 1–2 years older. 🧵 #Korea (1/6) --- 1) \"Korean age\": a baby is 1 at birth, and everyone adds a year on Jan 1. 2) \"Yearly age\": current year minus birth year. 3) \"Full age\" (international): starts at 0, +1 on each birthday. (2/6) --- On June 28, 2023, full age became the standard for laws, contracts and official documents, through amendments to the Civil Act and the Framework Act on Administrative Regulations (행정기본법). Unless a rule says otherwise, \"age\" now means full age. (3/6) --- Example from the Ministry of Government Legislation: someone born in 1993 is 30 in 2023 after their birthday — and 29 before it. Full age = current year − birth year, minus 1 if your birthday hasn't passed yet. (4/6) --- Not everything changed. Pension and retirement ages stayed the same — they were already based on full age. Exceptions announced in 2023: elementary school entry, the draft, alcohol/tobacco purchase age, civil service exams, and insurance age. [확인 필요: 2023년 이후 예외 규정 변경 여부] (5/6) --- What about milestone birthdays like the 70th or 80th? The ministry said private customs shouldn't be forcibly changed. So Korean age may still show up in private life — but on forms and contracts, it's full age. (6/6) X 일반"}, {"id": "018", "platform": "x", "sub": "x_general", "subLabel": "X 일반", "file": "018_nist-password-rules.md", "title": "That password rule you hate — capital, number, symbol — is something NIST says services should not impose", "cands": ["That password rule you hate — capital, number, symbol — is something NIST says services should not impose", "Forced password changes every 90 days? NIST's latest guidance says no.", "Length beats \"clever\" symbols: what NIST's 2025 password guidance actually says"], "cat": "디지털·보안", "kw": ["password", "NIST", "cybersecurity", "passphrase", "authentication"], "summary": "미국 NIST의 2025년 7월 최종 지침(SP 800-63B-4)이 요구하는 비밀번호 원칙(조합 규칙 금지·길이 중시·주기적 변경 금지·유출 목록 대조)을 5개 트윗으로 정리", "status": "초안", "created": "2026-10-05 12:38", "base": "2026-10-05", "format": "thread", "hashtags": "#CyberSecurity", "tags": ["#CyberSecurity"], "ko": "미국 표준기술연구소(NIST)의 2025년 7월 최종 지침(SP 800-63B-4)은 비밀번호에 대문자·숫자·특수문자 조합을 강제하지 말고, 길이(단독 인증 15자 이상, 다중인증 병행 8자 이상)를 중시하며, 정기 변경을 요구하지 말고(유출 정황이 있을 때만 강제), 흔하거나 유출된 비밀번호와 대조하라고 설명해요. 다만 정부 정보시스템 대상 기술 지침이라 개별 사이트의 규칙은 다를 수 있어요.", "need": 0, "chars": 235, "imgs": 0, "tweets": [{"n": 1, "total": 5, "text": "That password rule you hate — \"must include a capital, a number and a symbol\" — is something NIST's latest guidance says services should NOT impose. 🧵 #CyberSecurity (1/5)", "len": 172, "need": 0, "media": []}, {"n": 2, "total": 5, "text": "NIST SP 800-63B-4 (final, July 2025): services shall not impose composition rules like mixing character types.\n\nNIST says analyses of breached passwords show those rules help less than expected, while hurting usability. (2/5)", "len": 225, "need": 0, "media": []}, {"n": 3, "total": 5, "text": "What matters more is length.\n\nPassword is the only login factor: at least 15 characters.\nPassword is one part of multi-factor login: at least 8.\n\nServices should also allow passwords of 64+ characters. (3/5)", "len": 207, "need": 0, "media": []}, {"n": 4, "total": 5, "text": "No scheduled changes either. Services shall not require periodic password changes — but must force one if there's evidence the credential was compromised.\n\nNew passwords should be checked against lists of common or breached ones. (4/5)", "len": 235, "need": 0, "media": []}, {"n": 5, "total": 5, "text": "Caveat: this is technical guidance written for government information systems, so individual sites may follow different rules.\n\nTakeaway for your own accounts: length beats clever symbols. (5/5)", "len": 194, "need": 0, "media": []}], "replies": [{"text": "Sources (NIST): SP 800-63B-4 final record https://csrc.nist.gov/pubs/sp/800/63/b/4/final · Authenticator requirements https://pages.nist.gov/800-63-4/sp800-63b/authenticators/ · Why composition rules fall short https://pages.nist.gov/800-63-4/sp800-63b/passwords/", "len": 177, "need": 0}], "plain": "That password rule you hate — \"must include a capital, a number and a symbol\" — is something NIST's latest guidance says services should NOT impose. 🧵 #CyberSecurity (1/5)\n\n---\n\nNIST SP 800-63B-4 (final, July 2025): services shall not impose composition rules like mixing character types.\n\nNIST says analyses of breached passwords show those rules help less than expected, while hurting usability. (2/5)\n\n---\n\nWhat matters more is length.\n\nPassword is the only login factor: at least 15 characters.\nPassword is one part of multi-factor login: at least 8.\n\nServices should also allow passwords of 64+ characters. (3/5)\n\n---\n\nNo scheduled changes either. Services shall not require periodic password changes — but must force one if there's evidence the credential was compromised.\n\nNew passwords should be checked against lists of common or breached ones. (4/5)\n\n---\n\nCaveat: this is technical guidance written for government information systems, so individual sites may follow different rules.\n\nTakeaway for your own accounts: length beats clever symbols. (5/5)", "copyAll": "That password rule you hate — \"must include a capital, a number and a symbol\" — is something NIST's latest guidance says services should NOT impose. 🧵 #CyberSecurity (1/5)\n\n---\n\nNIST SP 800-63B-4 (final, July 2025): services shall not impose composition rules like mixing character types.\n\nNIST says analyses of breached passwords show those rules help less than expected, while hurting usability. (2/5)\n\n---\n\nWhat matters more is length.\n\nPassword is the only login factor: at least 15 characters.\nPassword is one part of multi-factor login: at least 8.\n\nServices should also allow passwords of 64+ characters. (3/5)\n\n---\n\nNo scheduled changes either. Services shall not require periodic password changes — but must force one if there's evidence the credential was compromised.\n\nNew passwords should be checked against lists of common or breached ones. (4/5)\n\n---\n\nCaveat: this is technical guidance written for government information systems, so individual sites may follow different rules.\n\nTakeaway for your own accounts: length beats clever symbols. (5/5)", "extras": [{"title": "이미지·미디어 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>트윗 3<\/td><td>\"15 / 8 / 64+\" 숫자를 크게 쓴 직접 제작 카드<\/td><td>이미지에만 정보를 넣지 말고 본문에도 그대로 둘 것<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 트윗 3의 숫자(15자·8자·64자)를 NIST 페이지(<a href=\"https://pages.nist.gov/800-63-4/sp800-63b/authenticators/\" target=\"_blank\" rel=\"noopener noreferrer\">https://pages.nist.gov/800-63-4/sp800-63b/authenticators/<\/a>)에서 직접 확인<\/li><li class=\"cb\">☐ 트윗 4의 \"정기 변경 금지·유출 정황 시 강제 변경·유출 목록 대조\" 문구가 같은 페이지의 조항과 맞는지 확인<\/li><li class=\"cb\">☐ 트윗 5의 \"정부 정보시스템 대상\" 설명이 SP 800-63B-4 개요(CSRC 페이지)와 맞는지 확인<\/li><li class=\"cb\">☐ 개인 계정 보안 조언이 과하게 단정적이지 않은지 점검(이 글은 NIST 지침 소개이며 특정 서비스 규칙을 평가하지 않음)<\/li><li class=\"cb\">☐ 발행은 직접 수동으로<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>SP 800-63B-4 최종(2025년 7월), 정부 정보시스템 대상 인증 지침<\/td><td>NIST CSRC <a href=\"https://csrc.nist.gov/pubs/sp/800/63/b/4/final\" target=\"_blank\" rel=\"noopener noreferrer\">https://csrc.nist.gov/pubs/sp/800/63/b/4/final<\/a><\/td><td>공식<\/td><\/tr><tr><td>길이 최소(15자/8자), 최대 64자 이상 허용, 조합 규칙 금지, 정기 변경 금지, 유출 시 변경 강제, 차단 목록 대조<\/td><td>NIST SP 800-63-4 <a href=\"https://pages.nist.gov/800-63-4/sp800-63b/authenticators/\" target=\"_blank\" rel=\"noopener noreferrer\">https://pages.nist.gov/800-63-4/sp800-63b/authenticators/<\/a><\/td><td>공식<\/td><\/tr><tr><td>조합 규칙의 효과가 기대보다 작고 사용성에 해롭다는 설명, 길이가 핵심 요소<\/td><td>NIST SP 800-63-4 부록 <a href=\"https://pages.nist.gov/800-63-4/sp800-63b/passwords/\" target=\"_blank\" rel=\"noopener noreferrer\">https://pages.nist.gov/800-63-4/sp800-63b/passwords/<\/a><\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>X는 AI 활용 표기가 필수는 아니지만, 원하면 프로필이나 스레드 끝 답글에 쓸 수 있는 문구: \"Drafted with AI assistance; facts checked against official sources before posting. Dates and rules can change.\"<\/blockquote>", "open": false}], "search": "018 That password rule you hate — capital, number, symbol — is something NIST says services should not impose 디지털·보안 password, NIST, cybersecurity, passphrase, authentication #CyberSecurity 미국 NIST의 2025년 7월 최종 지침(SP 800-63B-4)이 요구하는 비밀번호 원칙(조합 규칙 금지·길이 중시·주기적 변경 금지·유출 목록 대조)을 5개 트윗으로 정리 미국 표준기술연구소(NIST)의 2025년 7월 최종 지침(SP 800-63B-4)은 비밀번호에 대문자·숫자·특수문자 조합을 강제하지 말고, 길이(단독 인증 15자 이상, 다중인증 병행 8자 이상)를 중시하며, 정기 변경을 요구하지 말고(유출 정황이 있을 때만 강제), 흔하거나 유출된 비밀번호와 대조하라고 설명해요. 다만 정부 정보시스템 대상 기술 지침이라 개별 사이트의 규칙은 다를 수 있어요. That password rule you hate — \"must include a capital, a number and a symbol\" — is something NIST's latest guidance says services should NOT impose. 🧵 #CyberSecurity (1/5) --- NIST SP 800-63B-4 (final, July 2025): services shall not impose composition rules like mixing character types. NIST says analyses of breached passwords show those rules help less than expected, while hurting usability. (2/5) --- What matters more is length. Password is the only login factor: at least 15 characters. Password is one part of multi-factor login: at least 8. Services should also allow passwords of 64+ characters. (3/5) --- No scheduled changes either. Services shall not require periodic password changes — but must force one if there's evidence the credential was compromised. New passwords should be checked against lists of common or breached ones. (4/5) --- Caveat: this is technical guidance written for government information systems, so individual sites may follow different rules. Takeaway for your own accounts: length beats clever symbols. (5/5) X 일반"}, {"id": "017", "platform": "x", "sub": "x_general", "subLabel": "X 일반", "file": "017_korea-help-numbers.md", "title": "Landing in Korea soon? Save these numbers now", "cands": ["Landing in Korea soon? Save these numbers now", "4 numbers every visitor to Korea should have in their phone before takeoff", "Lost, stuck or in trouble in Korea? Which number to call first"], "cat": "방한·체류 실용", "kw": ["Korea travel", "emergency numbers", "1330", "112", "119", "1345"], "summary": "방한 외국인이 알아둘 번호(112 경찰, 119 소방·구급, 1330 관광통역·안내, 1345 출입국)를 280자 단일 포스트로 정리하고 상세 내용은 답글로 분리", "status": "초안", "created": "2026-10-05 12:37", "base": "2026-10-05", "format": "single", "hashtags": "#VisitKorea", "tags": ["#VisitKorea"], "ko": "방한 외국인이 미리 저장해 두면 좋은 번호: 112(경찰), 119(소방·구급), 1330(관광 통역·안내·불편 신고, 해외에서는 +82-2-1330), 1345(법무부 출입국 외국인 종합안내). 생명이 위급하지 않으면 1330부터. 단일 포스트 1개 + 답글 2개.", "need": 1, "chars": 277, "imgs": 0, "tweets": [{"n": 1, "total": 1, "text": "Landing in Korea soon? Save these numbers now:\n\n🚓 112 — police\n🚒 119 — fire & ambulance\n🧭 1330 — travel helpline: interpretation, info, complaints (from abroad: +82-2-1330)\n🛂 1345 — Ministry of Justice immigration call center\n\nNot an emergency? Start with 1330. #VisitKorea", "len": 277, "need": 0, "media": []}], "replies": [{"text": "Sources: VISITKOREA 1330 Travel Helpline https://english.visitkorea.or.kr/svc/contents/contentsView.do?vcontsId=140632 · VISITKOREA FAQ on emergencies https://english.visitkorea.or.kr/svc/faq/faqMainView.do?menuSn=404&pstSn=94 · SafeKorea https://eng.safekorea.go.kr/safekorea-eng/userful/links/eng/userfulLinks.do?menuSn=1013", "len": 156, "need": 0}, {"text": "More on 1330: it can connect you to 1345 and 119, with staff in Korean, English, Japanese, Chinese, Russian, Vietnamese, Thai and Malay (SafeKorea lists shorter hours for Russian, Vietnamese, Thai and Malay). Local phone charges only. [확인 필요: 언어별 현재 운영시간]", "len": 234, "need": 1}], "plain": "Landing in Korea soon? Save these numbers now:\n\n🚓 112 — police\n🚒 119 — fire & ambulance\n🧭 1330 — travel helpline: interpretation, info, complaints (from abroad: +82-2-1330)\n🛂 1345 — Ministry of Justice immigration call center\n\nNot an emergency? Start with 1330. #VisitKorea", "copyAll": "Landing in Korea soon? Save these numbers now:\n\n🚓 112 — police\n🚒 119 — fire & ambulance\n🧭 1330 — travel helpline: interpretation, info, complaints (from abroad: +82-2-1330)\n🛂 1345 — Ministry of Justice immigration call center\n\nNot an emergency? Start with 1330. #VisitKorea", "extras": [{"title": "이미지·미디어 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>본문 포스트<\/td><td>번호 4개를 크게 적은 직접 제작 카드 이미지(텍스트 포스트와 같은 내용)<\/td><td>이미지에만 정보를 넣지 말고 본문에도 그대로 둘 것. 알트텍스트 추가 권장<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 게시 직전에 VISITKOREA 1330 페이지(<a href=\"https://english.visitkorea.or.kr/svc/contents/contentsView.do?vcontsId=140632\" target=\"_blank\" rel=\"noopener noreferrer\">https://english.visitkorea.or.kr/svc/contents/contentsView.do?vcontsId=140632<\/a>)에서 1330 서비스가 현재도 같은 방식으로 운영되는지 확인<\/li><li class=\"cb\">☐ Reply 2의 <mark class=\"need\">[확인 필요]<\/mark>: 언어별 운영시간(SafeKorea 안내는 러시아어·베트남어·태국어·말레이어 08:00–19:00)을 현재 공식 안내로 확인하거나 해당 문장을 삭제하고 <mark class=\"need\">[확인 필요]<\/mark> 표시 제거<\/li><li class=\"cb\">☐ 1345 설명(법무부 출입국 외국인 종합안내센터)을 법무부/HiKorea 안내로 한 번 더 확인<\/li><li class=\"cb\">☐ 이모지 때문에 글자수가 늘어난 상태(트윗 글자수 표시 참고)에서도 280 이하인지 확인<\/li><li class=\"cb\">☐ 발행은 직접 수동으로<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>1330 여행안내·통역·불만접수, +82-2-1330<\/td><td>VISITKOREA(한국관광공사) <a href=\"https://english.visitkorea.or.kr/svc/contents/contentsView.do?vcontsId=140632\" target=\"_blank\" rel=\"noopener noreferrer\">https://english.visitkorea.or.kr/svc/contents/contentsView.do?vcontsId=140632<\/a><\/td><td>공식<\/td><\/tr><tr><td>112 경찰, 119 소방, 1330은 비응급 여행 문의용<\/td><td>VISITKOREA FAQ <a href=\"https://english.visitkorea.or.kr/svc/faq/faqMainView.do?menuSn=404&amp; e exact day it was published", "The world's most-discussed alphabet has a birthday puzzle. Here's why Korea celebrates it on October 9.", "28 letters became 24: the short story behind Hangul Day (Oct 9)"], "cat": "흥미로운 사실", "kw": ["Hangul", "Hangul Day", "Hunminjeongeum", "King Sejong", "UNESCO"], "summary": "한글날(10월 9일)의 날짜가 정해진 과정, 28자→24자, 훈민정음 유네스코 기록유산(1997), 세종대왕 문해상, 공휴일 복원(2013) 이야기를 6개 트윗으로 정리", "status": "초안", "created": "2026-10-05 12:36", "base": "2026-10-05", "format": "thread", "hashtags": "#HangulDay", "tags": ["#HangulDay"], "ko": "한글날(10월 9일)의 날짜가 정해진 과정, 28자→24자, 훈민정음 해례본의 유네스코 세계기록유산 등재(1997), 유네스코 세종대왕 문해상(1989 제정, 2025 수상 기관), 공휴일 복원(2013) 이야기를 6개 트윗으로 정리했어요.", "need": 0, "chars": 252, "imgs": 0, "tweets": [{"n": 1, "total": 6, "text": "Korea has a public holiday for an alphabet — and the exact day it was \"published\" is still a bit of a puzzle.\n\nOctober 9 is Hangul Day. Here's the story 🧵 #HangulDay (1/6)", "len": 172, "need": 0, "media": []}, {"n": 2, "total": 6, "text": "King Sejong completed the alphabet in the 12th lunar month of 1443, according to the Korea Heritage Service.\n\nIts first name: Hunminjeongeum — \"proper sounds to instruct the people.\" (2/6)", "len": 188, "need": 0, "media": []}, {"n": 3, "total": 6, "text": "It started with 28 letters. Today's Hangul uses 24 — four were dropped along the way.\n\nThe Korea Heritage Service describes the system as both original and scientific. (3/6)", "len": 173, "need": 0, "media": []}, {"n": 4, "total": 6, "text": "The date puzzle 🧩\n\nAn explanatory book came out in the 9th lunar month of 1446, and its postface was written in the first ten days — so it was judged to be out by day 10. Converted to the solar calendar: October 9.\n\nThe exact date isn't certain. (4/6)", "len": 252, "need": 0, "media": []}, {"n": 5, "total": 6, "text": "That manuscript (the Haerye edition) joined UNESCO's Memory of the World Register in 1997.\n\nUNESCO also has a King Sejong Literacy Prize, established in 1989. The 2025 winners came from Senegal, Ecuador and Thailand. (5/6)", "len": 222, "need": 0, "media": []}, {"n": 6, "total": 6, "text": "As for the holiday: Hangul Day lost its public-holiday status in 1990. A 2012 amendment to Korea's rules on public-agency holidays brought it back from 2013.\n\nHappy Hangul Day! (6/6)", "len": 182, "need": 0, "media": []}], "replies": [{"text": "Sources: Korea Heritage Service on the Hunminjeongeum Manuscript https://english.khs.go.kr/cop/bbs/selectBoardArticle.do?bbsId=BBSMSTR_1205&ctgryLrcls=CTGRY211&mn=EN_03_03&nttId=57977&uniq=0 · UNESCO Memory of the World https://www.unesco.org/en/memory-world/hunminjeongum-manuscript", "len": 141, "need": 0}, {"text": "More: Ministry of Culture, Sports and Tourism on the UNESCO King Sejong Literacy Prize https://www.mcst.go.kr/english/policy/pressView.jsp?pSeq=548 · National Archives of Korea on Hangul Day's return as a public holiday https://theme.archives.go.kr/next/hangeulPolicy/holiday2013.do", "len": 206, "need": 0}], "plain": "Korea has a public holiday for an alphabet — and the exact day it was \"published\" is still a bit of a puzzle.\n\nOctober 9 is Hangul Day. Here's the story 🧵 #HangulDay (1/6)\n\n---\n\nKing Sejong completed the alphabet in the 12th lunar month of 1443, according to the Korea Heritage Service.\n\nIts first name: Hunminjeongeum — \"proper sounds to instruct the people.\" (2/6)\n\n---\n\nIt started with 28 letters. Today's Hangul uses 24 — four were dropped along the way.\n\nThe Korea Heritage Service describes the system as both original and scientific. (3/6)\n\n---\n\nThe date puzzle 🧩\n\nAn explanatory book came out in the 9th lunar month of 1446, and its postface was written in the first ten days — so it was judged to be out by day 10. Converted to the solar calendar: October 9.\n\nThe exact date isn't certain. (4/6)\n\n---\n\nThat manuscript (the Haerye edition) joined UNESCO's Memory of the World Register in 1997.\n\nUNESCO also has a King Sejong Literacy Prize, established in 1989. The 2025 winners came from Senegal, Ecuador and Thailand. (5/6)\n\n---\n\nAs for the holiday: Hangul Day lost its public-holiday status in 1990. A 2012 amendment to Korea's rules on public-agency holidays brought it back from 2013.\n\nHappy Hangul Day! (6/6)", "copyAll": "Korea has a public holiday for an alphabet — and the exact day it was \"published\" is still a bit of a puzzle.\n\nOctober 9 is Hangul Day. Here's the story 🧵 #HangulDay (1/6)\n\n---\n\nKing Sejong completed the alphabet in the 12th lunar month of 1443, according to the Korea Heritage Service.\n\nIts first name: Hunminjeongeum — \"proper sounds to instruct the people.\" (2/6)\n\n---\n\nIt started with 28 letters. Today's Hangul uses 24 — four were dropped along the way.\n\nThe Korea Heritage Service describes the system as both original and scientific. (3/6)\n\n---\n\nThe date puzzle 🧩\n\nAn explanatory book came out in the 9th lunar month of 1446, and its postface was written in the first ten days — so it was judged to be out by day 10. Converted to the solar calendar: October 9.\n\nThe exact date isn't certain. (4/6)\n\n---\n\nThat manuscript (the Haerye edition) joined UNESCO's Memory of the World Register in 1997.\n\nUNESCO also has a King Sejong Literacy Prize, established in 1989. The 2025 winners came from Senegal, Ecuador and Thailand. (5/6)\n\n---\n\nAs for the holiday: Hangul Day lost its public-holiday status in 1990. A 2012 amendment to Korea's rules on public-agency holidays brought it back from 2013.\n\nHappy Hangul Day! (6/6)", "extras": [{"title": "이미지·미디어 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>트윗 1<\/td><td>직접 만든 텍스트 카드(\"Oct 9 · Hangul Day\") 또는 CC0/공공누리 1유형 이미지<\/td><td>라이선스 확인된 이미지만. 이미지에 핵심 정보를 넣지 말고 본문에 둘 것<\/td><\/tr><tr><td>트윗 3<\/td><td>한글 자모 24자 표(직접 제작)<\/td><td>폰트 라이선스(상업 이용 가능 여부) 확인<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 트윗 2·3·4의 1443년·28자→24자·1446년 9월 관련 서술이 출처(Korea Heritage Service)와 일치하는지 확인<\/li><li class=\"cb\">☐ 트윗 5의 유네스코 세종대왕 문해상 설명을 UNESCO 문해상 페이지(<a href=\"https://www.unesco.org/en/prizes/literacy\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.unesco.org/en/prizes/literacy<\/a>)에서 한 번 더 확인 (이 박스에서는 해당 페이지가 열리지 않아 문화체육관광부 보도자료로 확인함)<\/li><li class=\"cb\">☐ 트윗 6: 1990년 공휴일 제외·2013년 복원 서술을 국가기록원 페이지에서 확인<\/li><li class=\"cb\">☐ 게시 직전 글자수(트윗별 280 이하)와 해시태그를 확인하고, 링크는 본문이 아니라 답글에만 넣기<\/li><li class=\"cb\">☐ 발행은 직접 수동으로. 경험담·사진은 직접 만든 것만 사용<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>1443년 12월 완성, 훈민정음, 28자→24자, 1446년 9월 간행, 10일 이전 간행 판단, 양력 10월 9일 환산<\/td><td>Korea Heritage Service <a href=\"https://english.khs.go.kr/cop/bbs/selectBoardArticle.do?bbsId=BBSMSTR_1205&amp;ctgryLrcls=CTGRY211&amp;mn=EN_03_03&amp;nttId=57977&amp;uniq=0\" target=\"_blank\" rel=\"noopener noreferrer\">https://english.khs.go.kr/cop/bbs/selectBoardArticle.do?bbsId=BBSMSTR_1205&amp;ctgryLrcls=CTGRY211&amp;mn=EN_03_03&amp;nttId=57977&amp;uniq=0<\/a><\/td><td>공식<\/td><\/tr><tr><td>훈민정음(해례본) 유네스코 세계기록유산 등재 1997<\/td><td>UNESCO <a href=\"https://www.unesco.org/en/memory-world/hunminjeongum-manuscript\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.unesco.org/en/memory-world/hunminjeongum-manuscript<\/a><\/td><td>공식<\/td><\/tr><tr><td>한글날 지정 경위와 날짜 불확실성<\/td><td>국립국어원 <a href=\"https://www.korean.go.kr/eng_hangeul/origin/001.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korean.go.kr/eng_hangeul/origin/001.html<\/a><\/td><td>공식<\/td><\/tr><tr><td>유네스코 세종대왕 문해상 1989 제정, 2025 수상 기관(세네갈·에콰도르·태국)<\/td><td>문화체육관광부 보도자료(2025-09-12) <a href=\"https://www.mcst.go.kr/english/policy/pressView.jsp?pSeq=548\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.mcst.go.kr/english/policy/pressView.jsp?pSeq=548<\/a><\/td><td>공식<\/td><\/tr><tr><td>1990년 공휴일 제외, 2013년부터 다시 공휴일(관보 2012-12-28, 대통령령 24273호)<\/td><td>국가기록원 <a href=\"https://theme.archives.go.kr/next/hangeulPolicy/holiday2013.do\" target=\"_blank\" rel=\"noopener noreferrer\">https://theme.archives.go.kr/next/hangeulPolicy/holiday2013.do<\/a><\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>X는 AI 활용 표기가 필수는 아니지만, 원하면 프로필이나 스레드 끝 답글에 쓸 수 있는 문구: \"Drafted with AI assistance; facts checked against official sources before posting. Dates and rules can change.\"<\/blockquote>", "open": false}], "search": "016 Korea has a public holiday for an alphabet — and nobody knows the exact day it was published 흥미로운 사실 Hangul, Hangul Day, Hunminjeongeum, King Sejong, UNESCO #HangulDay 한글날(10월 9일)의 날짜가 정해진 과정, 28자→24자, 훈민정음 유네스코 기록유산(1997), 세종대왕 문해상, 공휴일 복원(2013) 이야기를 6개 트윗으로 정리 한글날(10월 9일)의 날짜가 정해진 과정, 28자→24자, 훈민정음 해례본의 유네스코 세계기록유산 등재(1997), 유네스코 세종대왕 문해상(1989 제정, 2025 수상 기관), 공휴일 복원(2013) 이야기를 6개 트윗으로 정리했어요. Korea has a public holiday for an alphabet — and the exact day it was \"published\" is still a bit of a puzzle. October 9 is Hangul Day. Here's the story 🧵 #HangulDay (1/6) --- King Sejong completed the alphabet in the 12th lunar month of 1443, according to the Korea Heritage Service. Its first name: Hunminjeongeum — \"proper sounds to instruct the people.\" (2/6) --- It started with 28 letters. Today's Hangul uses 24 — four were dropped along the way. The Korea Heritage Service describes the system as both original and scientific. (3/6) --- The date puzzle 🧩 An explanatory book came out in the 9th lunar month of 1446, and its postface was written in the first ten days — so it was judged to be out by day 10. Converted to the solar calendar: October 9. The exact date isn't certain. (4/6) --- That manuscript (the Haerye edition) joined UNESCO's Memory of the World Register in 1997. UNESCO also has a King Sejong Literacy Prize, established in 1989. The 2025 winners came from Senegal, Ecuador and Thailand. (5/6) --- As for the holiday: Hangul Day lost its public-holiday status in 1990. A 2012 amendment to Korea's rules on public-agency holidays brought it back from 2013. Happy Hangul Day! (6/6) X 일반"}, {"id": "015", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "015_mobile-id-issuance.md", "title": "모바일 주민등록증·운전면허증 발급, IC 신분증 태그와 주민센터 QR 무엇이 다를까", "cands": ["지갑 없이 신분증 쓰기: 모바일 신분증 발급 방법 두 가지 비교 (2026년)", "모바일 신분증 8월 28일부터 법으로 보호받는다는데, 무엇이 달라졌을까?", "모바일 운전면허증 발급 준비물과 수수료, IC 면허증 방식 vs QR 방식"], "cat": "민원·디지털", "kw": ["모바일 신분증", "모바일 주민등록증", "모바일 운전면허증", "IC 주민등록증", "전자정부법 시행령"], "summary": "모바일 주민등록증·운전면허증의 두 가지 발급 방식(IC 태그/QR), 준비물과 수수료, 2026년 8월 28일 시행된 전자정부법 시행령의 핵심을 정리", "status": "초안", "created": "2026-10-05 12:28", "base": "2026-10-05", "need": 3, "chars": 1850, "chars_ns": 1418, "imgs": 1, "slots": 1, "html": "<p>외출했는데 지갑을 놓고 나왔고, 하필 신분증이 필요한 상황이 생기면 난감하죠. 그럴 때 쓸 수 있는 모바일 신분증은 어떻게 발급받는지 궁금해서 정부 모바일 신분증 사이트의 발급 안내를 살펴봤어요. 행정안전부가 올해 8월에 낸 시행령 소식도 함께 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<figure class=\"ph\"><img loading=\"lazy\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wgARCAHgAtADASIAAhEBAxEB/8QAGwAAAwEBAQEBAAAAAAAAAAAAAAECAwQFBgf/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAfjnLhiBiAAAAABAFOaWqmpW05UAJNCTLEmgTVjqXLVS5qnNSsTlpzUracqTVIBBgAAgBJqxtMGnKJggaFJq2nLTTG0xtMQCAAJilJla5aM6XFVTlghFVFWfLlHTmhghghggBACAR1NLVTUracqGhJoE1Yk0CasbTldS5qmnK2nK6TlbRKJlIBAAABDkEFjExtOUAATG5ZTmpXUspyxtMASAAwFbVD0jRLqasYgEIq4qz5sZvCGCAENWIaEAiGh1NLTmpaacqAEmCTViTQAWDTlbTlppzTactVNTQDhACAoAQAEhWCYDTG05QEAFjacrqKWhOHUsbTAEg0FCauporSNLmqmqABS1FVF2fPAt4ABAAmIkwSpUhpCppXU1LTTlQAhoSasQIAAaoKRNU5qVtOWnLlpy5QRQAgACaEmrAAGAwJWmgAoacNpjqXLTTG5Y0AAIxNaqLL0z0uapMAVJOYqouz50T3zAagwQxUqCRpEmrBpjqalppyiaBNCTViTBADaasHK2nKNBTly0JSsTsYnKAAAJNWAAxMYnK 법 시행령이 2026년 8월 28일부터 시행된다고 밝혔어요.<\/p>\n<ul><li>법적 근거가 분명해진 종류: 주민등록증, 운전면허증, 장애인등록증, 국가보훈등록증, 외국인등록증, 영주증, 외국국적동포 국내거소신고증, 공무원증이에요.<\/li><li>발급기관이 지켜야 할 조치: 본인 명의 스마트폰 중 1대에만 발급하고, 신청자가 본인인지 확인한 뒤 발급하며, 신원정보를 암호화하는 전자적 정보의 유효기간을 3년 이내로 정해야 해요. 유효기간이 지난 뒤 이용자가 어떻게 하면 되는지는 보도자료에서 확인하지 못했어요. <mark class=\"need\">[확인 필요: 전자적 정보 유효기간 만료 후 이용자 절차]<\/mark><\/li><li>부정 사용과 위·변조를 처벌하는 개정 전자정부법 규정도 함께 시행돼요.<\/li><\/ul>\n<h3>어디서 쓸 수 있고, 어떤 앱으로?<\/h3>\n<p>정부가 제공하는 모바일 신분증 앱 외에 민간 앱으로도 쓸 수 있도록 개방이 진행 중이에요. 안내 사이트에는 현재 이용 가능한 민간 앱으로 삼성월렛(구 삼성페이)이 적혀 있고, 국민은행·네이버·농협은행·토스·카카오 등은 앞으로 제공할 예정이라고 되어 있어요. 이 목록은 바뀔 수 있으니 <mark class=\"need\">[확인 필요: 현재 이용 가능한 민간 앱]<\/mark> 발급 전에 사이트에서 직접 확인해 주세요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>방식 두 가지: IC 신분증 태그 또는 방문 후 QR 발급<\/li><li>필요한 것: 사진, 실물 신분증, 수수료(주민증 1만 원·운전면허증 1만 5천 원은 IC 신분증 발급용)<\/li><li>2026년 8월 28일부터 본인 명의 스마트폰 1대에만 발급<\/li><\/ul>\n<p>절차와 수수료는 바뀔 수 있으니 발급 전에 모바일 신분증 사이트와 해당 기관 안내를 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래(대표)<\/td><td>스마트폰 사진 (images/draft_5/d5_wm_Smartphone_Use.jpg)<\/td><td>모바일 신분증 앱 화면이 아닌 일반 스마트폰 사진임을 캡션에 표시<\/td><\/tr><tr><td>발급 방식 표 아래<\/td><td>모바일 신분증 사이트(mobileid.go.kr) 발급 안내 화면 직접 캡처<\/td><td>개인 신분증 화면·QR 코드는 절대 캡처 금지<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 주민센터 QR 발급 수수료 여부를 모바일 신분증 사이트 또는 행정복지센터에서 확인하고 <mark class=\"need\">[확인 필요]<\/mark> 문장 정리<\/li><li class=\"cb\">☐ 현재 이용 가능한 민간 앱 목록을 모바일 신분증 사이트에서 확인해 본문 수정 (삼성월렛 외 추가 여부)<\/li><li class=\"cb\">☐ 전자적 정보 유효기간(3년 이내) 만료 후 절차를 행안부 안내로 확인하거나 해당 문장 삭제<\/li><li class=\"cb\">☐ 이미지가 모바일 신분증 앱의 실제 화면이 아니라는 캡션 유지<\/li><li class=\"cb\">☐ 본인이 발급해 본 경험이 있을 때만 경험 문장 추가, 신분증 내용·QR은 가리기<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>모바일 신분증 소개, 법적 효력, 민간 , "subLabel": "네이버", "file": "014_parental-benefit-child-allowance.md", "title": "부모급여와 아동수당, 나이·금액·신청 시기 비교 (2026년 달라진 점 포함)", "cands": ["부모급여랑 아동수당은 뭐가 다를까? 한 표로 정리한 2026년 육아 지원금", "아동수당 만 9세 미만으로 확대! 지역별 금액과 소급 지급 정리", "출생 후 60일 안에 신청하세요: 부모급여·아동수당 신청 기한과 지급일"], "cat": "육아·가족", "kw": ["부모급여", "아동수당", "아동수당 확대", "출생 60일 신청", "어린이집 차액"], "summary": "부모급여와 아동수당의 대상 연령·금액·지급일·신청 방법을 표로 비교하고 2026년 아동수당 확대(만 9세 미만, 지역별 금액)를 정리", "status": "초안", "created": "2026-10-05 12:27", "base": "2026-10-05", "need": 2, "chars": 1924, "chars_ns": 1477, "imgs": 0, "slots": 0, "html": "<p>\"부모급여랑 아동수당, 둘 다 받을 수 있나요?\" 육아를 시작하면 가장 먼저 헷갈리는 질문 중 하나예요. 두 제도는 이름이 비슷하지만 대상 나이와 금액, 지급일이 달라서 표로 나란히 비교해 봤어요. 보건복지부 안내와 정책브리핑을 바탕으로 했고, 아동수당은 올해 바뀐 부분도 반영했습니다. (2026년 10월 5일 기준)<\/p>\n<h3>한 표로 비교하기<\/h3>\n<div class=\"tw\"><table><thead><tr><th>구분<\/th><th>부모급여<\/th><th>아동수당<\/th><\/tr><\/thead><tbody><tr><td>대상<\/td><td>만 2세 미만(0~23개월) 아동<\/td><td>2026년은 만 9세 미만 아동<\/td><\/tr><tr><td>금액<\/td><td>0세 월 100만 원, 1세 월 50만 원<\/td><td>수도권 월 10만 원, 비수도권 월 10만 5천 원, 인구감소지역 월 11만~12만 원<\/td><\/tr><tr><td>지급일<\/td><td>가정 양육은 매월 25일, 어린이집 이용 차액은 다음 달 20일<\/td><td>매월 25일(휴일이면 그 전날)<\/td><\/tr><tr><td>신청<\/td><td>읍·면·동 행정복지센터, 복지로, 정부24<\/td><td>읍·면·동 행정복지센터, 복지로(앱 포함), 정부24<\/td><\/tr><tr><td>소급<\/td><td>출생일로부터 60일 이내 신청하면 출생한 달부터<\/td><td>출생일 포함 60일 이내 신청하면 출생한 달부터<\/td><\/tr><\/tbody><\/table><\/div>\n<p>정부24의 아동수당 안내에는 아동수당이 보육료나 양육수당 같은 다른 복지급여를 받는지와 상관없이 나이·국적·주민등록 요건만 맞으면 지급된다고 적혀 있어요. 부모급여는 출생신고와 함께 한 번에 신청하는 원스톱 신청도 가능하다고 해요.<\/p>\n<h3>어린이집에 보내면 부모급여는 어떻게 될까?<\/h3>\n<p>어린이집을 이용하면 영유아 기본보육료를 뺀 차액을 현금으로 받아요. 2026년 기준 0세(0~11개월)는 100만 원에서 보육료 58만 4천 원을 뺀 41만 6천 원이고, 1세(12~23개월)는 50만 원보다 보육료 51만 5천 원이 커서 차액이 없다고 안내돼 있어요. 어린이집이나 종일제 아이돌봄은 부모급여와 별개로 신청해야 한다는 점도 함께 나와 있어요.<\/p>\n<h3>올해 아동수당이 달라진 점<\/h3>\n<ul><li>대상 확대: 아동수당법이 개정되어 지급 대상이 13세 미만까지 단계적으로 넓어져요. 2025년 8세 미만, 2026년 9세 미만, 2027년 10세 미만으로 이어져 2030년에 13세 미만이 돼요.<\/li><li>지역별 금액: 거주 지역에 따라 금액이 달라요. 인구감소지역은 우대 지역이 11만 원, 특별 지역이 12만 원이에요. 내가 사는 시·군·구가 어디에 속하는지는 복지부 정책브리핑의 지역 목록으로 확인할 수 있어요. <mark class=\"need\">[확인 필요: 내가 사는 시·군·구의 지급 구분]<\/mark><\/li><li>상품권 추가 지원: 인구감소지역에서 지역사랑상품권으로 받으면 월 1만 원 상당이 더해지는데, 2026년 하반기부터 지역별로 조례 등을 거쳐 추진한다고 해요. 실제 시행 여부는 지자체마다 다를 수 있어서 시행 지역은 제가 확인하지 못했어요. <mark class=\"need\">[확인 필요: 해당 지자체의 상품권 지급 시행 여부]<\/mark><\/li><li>적용 시점: 확대분은 4월 지급분부터이고 1월분까지 소급돼요. 이미 지급이 끝났던 2017년 1월~2018년 3월생 아동은 지자체가 직권 신청 절차를 거쳐 순차적으로 지급한다고 해요.<\/li><\/ul>\n<h3>정보가 서로 달라 보일 때<\/h3>\n<p>정부24 아동수당 서비스 페이지(최종 수정 2026년 2월 20일)에는 아직 만 8세 미만, 월 10만 원으로 적혀 있어요. 반면 보건복지부 정책 페이지(2026년 3월 31일 수정)와 정책브리핑(2026년 3월 30일)은 개정된 만 9세 미만과 지역별 금액을 안내해요. 개정 이후 날짜의 자료를 기준으로 삼는 게 안전합니다.<\/p>\n<h3>한 가지 더, 피싱 주의<\/h3>\n<p>복지부는 아동수당 확대와 관련해 신청을 요구하는 문자나 링크는 피싱일 수 있다며 주의하라고 안내했어요. 직권 신청으로 순차 지급하는 대상이 있기 때문이에요. 문의는 보건복지상담센터 129로 하면 돼요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>부모급여는 만 2세 미만, 아동수당은 2026년 만 9세 미만<\/li><li>둘 다 출생 후 60일 안에 신청하면 출생한 달부터 소급<\/li><li>아동수당은 거주 지역에 따라 월 10만~12만 원<\/li><\/ul>\n<p>금액과 대상은 해마다 바뀌니 신청 전 복지로나 129에서 다시 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래<\/td><td>복지로의 부모급여·아동수당 안내 화면(로그인 전) 직접 캡처<\/td><td>아동·보호자 정보가 보이는 화면은 캡처 금지<\/td><\/tr><tr><td>비교표 아래<\/td><td>본문 표를 그대로 이미지화하지 말고 텍스트 표 유지<\/td><td>이미지 속 글자는 검색에 잡히지 않을 수 있음<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 본인 거주 시·군·구가 아동수당 어느 구분에 속하는지(수도권·비수도권·인구감소지역) 정책브리핑 목록으로 확인하고 <mark class=\"need\">[확인 필요]<\/mark> 문장 정리<\/li><li class=\"cb\">☐ 지역사랑상품권 추가 지급이 시행 중인 지자체를 쓰고 싶다면 해당 지자체 공지로 확인 (확인 전에는 일반론만 유지)<\/li><li class=\"cb\">☐ 정책브리핑·복지부 문장은 공공누리 4유형일 수 있으므로 문장을 그대로 복사하지 않기<\/li><li class=\"cb\">☐ 정부24 아동수당 페이지가 개정 내용으로 갱신됐는지 발행 전에 확인 (갱신됐다면 '정보가 서로 달라 보일 때' 문단 삭제)<\/li><li class=\"cb\">☐ 육아 경험담은 실제 경험이 있을 때만, 아이 사진·정보는 넣지 않기<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>부모급여 대상·금액·신청 방식(최종수정 2026-03-25)<\/td><td>보건복지부 <a href=\"https://www.mohw.go.kr/menu.es?mid=a10711030600\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.mohw.go.kr/menu.es?mid=a10711030600<\/a><\/td><td>공식<\/td><\/tr><tr><td>부모급여 어린이집 차액, 지급일, 60일 소급, 원스톱<\/td><td>대한민국 정책브리핑 정책포커스(2026-01-14) <a href=\"https://www.korea.kr/news/policyFocusView.do?newsId=148957936&amp;pkgId=49500831\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyFocusView.do?newsId=148957936&amp;pkgId=49500831<\/a><\/td><td>공식<\/td><\/tr><tr><td>아동수당 지급 대상·지역별 금액·신청 방식(최종수정 2026-03-31)<\/td><td>보건복지부 <a href=\"https://www.mohw.go.kr/menu.es?mid=a10711030100\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.mohw.go.kr/menu.es?mid=a10711030100<\/a><\/td><td>공식<\/td><\/tr><tr><td>아동수당 단계적 확대 일정, 지역 구분, 상품권, 소급, 피싱 주의<\/td><td>대한민국 정책브리핑 정책뉴스(2026-03-30) <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148961693\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyNewsView.do?newsId=148961693<\/a><\/td><td>공식<\/td><\/tr><tr><td>아동수당 신청 방법, 60일 소급, 다른 급여와 무관, 매월 25일(만 8세 미만 표기는 개정 전 정보)<\/td><td>정부24 보조금24 <a href=\"https://www.gov.kr/portal/rcvfvrSvc/dtlEx/135200000120\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.kr/portal/rcvfvrSvc/dtlEx/135200000120<\/a> (최종수정 2026-02-20)<\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "\"부모급여랑 아동수당, 둘 다 받을 수 있나요?\" 육아를 시작하면 가장 먼저 헷갈리는 질문 중 하나예요. 두 제도는 이름이 비슷하지만 대상 나이와 금액, 지급일이 달라서 표로 나란히 비교해 봤어요. 보건복지부 안내와 정책브리핑을 바탕으로 했고, 아동수당은 올해 바뀐 부분도 반영했습니다. (2026년 10월 5일 기준)\n\n한 표로 비교하기\n\n• 대상 — 부모급여: 만 2세 미만(0~23개월) 아동 / 아동수당: 2026년은 만 9세 미만 아동\n• 금액 — 부모급여: 0세 월 100만 원, 1세 월 50만 원 / 아동수당: 수도권 월 10만 원, 비수도권 월 10만 5천 원, 인구감소지역 월 11만~12만 원\n• 지급일 — 부모급여: 가정 양육은 매월 25일, 어린이집 이용 차액은 다음 달 20일 / 아동수당: 매월 25일(휴일이면 그 전날)\n• 신청 — 부모급여: 읍·면·동 행정복지센터, 복지로, 정부24 / 아동수당: 읍·면·동 행정복지센터, 복지로(앱 포함), 정부24\n• 소급 — 부모급여: 출생일로부터 60일 이내 신청하면 출생한 달부터 / 아동수당: 출생일 포함 60일 이내 신청하면 출생한 달부터\n\n정부24의 아동수당 안내에는 아동수당이 보육료나 양육수당 같은 다른 복지급여를 받는지와 상관없이 나이·국적·주민등록 요건만 맞으면 지급된다고 적혀 있어요. 부모급여는 출생신고와 함께 한 번에 신청하는 원스톱 신청도 가능하다고 해요.\n\n어린이집에 보내면 부모급여는 어떻게 될까?\n\n어린이집을 이용하면 영유아 기본보육료를 뺀 차액을 현금으로 받아요. 2026년 기준 0세(0~11개월)는 100만 원에서 보육료 58만 4천 원을 뺀 41만 6천 원이고, 1세(12~23개월)는 50만 원보다 보육료 51만 5천 원이 커서 차액이 없다고 안내돼 있어요. 어린이집이나 종일제 아이돌봄은 부모급여와 별개로 신청해야 한다는 점도 함께 나와 있어요.\n\n올해 아동수당이 달라진 점\n\n- 대상 확대: 아동수당법이 개정되어 지급 대상이 13세 미만까지 단계적으로 넓어져요. 2025년 8세 미만, 2026년 9세 미만, 2027년 10세 미만으로 이어져 2030년에 13세 미만이 돼요.\n- 지역별 금액: 거주 지역에 따라 금액이 달라요. 인구감소지역은 우대 지역이 11만 원, 특별 지역이 12만 원이에요. 내가 사는 시·군·구가 어디에 속하는지는 복지부 정책브리핑의 지역 목록으로 확인할 수 있어요. [확인 필요: 내가 사는 시·군·구의 지급 구분]\n- 상품권 추가 지원: 인구감소지역에서 지역사랑상품권으로 받으면 월 1만 원 상당이 더해지는데, 2026년 하반기부터 지역별로 조례 등을 거쳐 추진한다고 해요. 실제 시행 여부는 지자체마다 다를 수 있어서 시행 지역은 제가 확인하지 못했어요. [확인 필요: 해당 지자체의 상품권 지급 시행 여부]\n- 적용 시점: 확대분은 4월 지급분부터이고 1월분까지 소급돼요. 이미 지급이 끝났던 2017년 1월~2018년 3월생 아동은 지자체가 직권 신청 절차를 거쳐 순차적으로 지급한다고 해요.\n\n정보가 서로 달라 보일 때\n\n정부24 아동수당 서비스 페이지(최종 수정 2026년 2월 20일)에는 아직 만 8세 미만, 월 10만 원으로 적혀 있어요. 반면 보건복지부 정책 페이지(2026년 3월 31일 수정)와 정책브리핑(2026년 3월 30일)은 개정된 만 9세 미만과 지역별 금액을 안내해요. 개정 이후 날짜의 자료를 기준으로 삼는 게 안전합니다.\n\n한 가지 더, 피싱 주의\n\n복지부는 아동수당 확대와 관련해 신청을 요구하는 문자나 링크는 피싱일 수 있다며 주의하라고 안내했어요. 직권 신청으로 순차 지급하는 대상이 있기 때문이에요. 문의는 보건복지상담센터 129로 하면 돼요.\n\n한눈에 정리\n\n- 부모급여는 만 2세 미만, 아동수당은 2026년 만 9세 미만\n- 둘 다 출생 후 60일 안에 신청하면 출생한 달부터 소급\n- 아동수당은 거주 지역에 따라 월 10만~12만 원\n\n금액과 대상은 해마다 바뀌니 신청 전 복지로나 129에서 다시 확인해 주세요.", "copyAll": "\"부모급여랑 아동수당, 둘 다 받을 수 있나요?\" 육아를 시작하면 가장 먼저 헷갈리는 질문 중 하나예요. 두 제도는 이름이 비슷하지만 대상 나이와 금액, 지급일이 달라서 표로 나란히 비교해 봤어요. 보건복지부 안내와 정책브리핑을 바탕으로 했고, 아동수당은 올해 바뀐 부분도 반영했습니다. (2026년 10월 5일 기준)\n\n한 표로 비교하기\n\n• 대상 — 부모급여: 만 2세 미만(0~23개월) 아동 / 아동수당: 2026년은 만 9세 미만 아동\n• 금액 — 부모급여: 0세 월 100만 원, 1세 월 50만 원 / 아동수당: 수도권 월 정리 \"부모급여랑 아동수당, 둘 다 받을 수 있나요?\" 육아를 시작하면 가장 먼저 헷갈리는 질문 중 하나예요. 두 제도는 이름이 비슷하지만 대상 나이와 금액, 지급일이 달라서 표로 나란히 비교해 봤어요. 보건복지부 안내와 정책브리핑을 바탕으로 했고, 아동수당은 올해 바뀐 부분도 반영했습니다. (2026년 10월 5일 기준) 한 표로 비교하기 • 대상 — 부모급여: 만 2세 미만(0~23개월) 아동 / 아동수당: 2026년은 만 9세 미만 아동 • 금액 — 부모급여: 0세 월 100만 원, 1세 월 50만 원 / 아동수당: 수도권 월 10만 원, 비수도권 월 10만 5천 원, 인구감소지역 월 11만~12만 원 • 지급일 — 부모급여: 가정 양육은 매월 25일, 어린이집 이용 차액은 다음 달 20일 / 아동수당: 매월 25일(휴일이면 그 전날) • 신청 — 부모급여: 읍·면·동 행정복지센터, 복지로, 정부24 / 아동수당: 읍·면·동 행정복지센터, 복지로(앱 포함), 정부24 • 소급 — 부모급여: 출생일로부터 60일 이내 신청하면 출생한 달부터 / 아동수당: 출생일 포함 60일 이내 신청하면 출생한 달부터 정부24의 아동수당 안내에는 아동수당이 보육료나 양육수당 같은 다른 복지급여를 받는지와 상관없이 나이·국적·주민등록 요건만 맞으면 지급된다고 적혀 있어요. 부모급여는 출생신고와 함께 한 번에 신청하는 원스톱 신청도 가능하다고 해요. 어린이집에 보내면 부모급여는 어떻게 될까? 어린이집을 이용하면 영유아 기본보육료를 뺀 차액을 현금으로 받아요. 2026년 기준 0세(0~11개월)는 100만 원에서 보육료 58만 4천 원을 뺀 41만 6천 원이고, 1세(12~23개월)는 50만 원보다 보육료 51만 5천 원이 커서 차액이 없다고 안내돼 있어요. 어린이집이나 종일제 아이돌봄은 부모급여와 별개로 신청해야 한다는 점도 함께 나와 있어요. 올해 아동수당이 달라진 점 - 대상 확대: 아동수당법이 개정되어 지급 대상이 13세 미만까지 단계적으로 넓어져요. 2025년 8세 미만, 2026년 9세 미만, 2027년 10세 미만으로 이어져 2030년에 13세 미만이 돼요. - 지역별 금액: 거주 지역에 따라 금액이 달라요. 인구감소지역은 우대 지역이 11만 원, 특별 지역이 12만 원이에요. 내가 사는 시·군·구가 어디에 속하는지는 복지부 정책브리핑의 지역 목록으로 확인할 수 있어요. [확인 필요: 내가 사는 시·군·구의 지급 구분] - 상품권 추가 지원: 인구감소지역에서 지역사랑상품권으로 받으면 월 1만 원 상당이 더해지는데, 2026년 하반기부터 지역별로 조례 등을 거쳐 추진한다고 해요. 실제 시행 여부는 지자체마다 다를 수 있어서 시행 지역은 제가 확인하지 못했어요. [확인 필요: 해당 지자체의 상품권 지급 시행 여부] - 적용 시점: 확대분은 4월 지급분부터이고 1월분까지 소급돼요. 이미 지급이 끝났던 2017년 1월~2018년 3월생 아동은 지자체가 직권 신청 절차를 거쳐 순차적으로 지급한다고 해요. 정보가 서로 달라 보일 때 정부24 아동수당 서비스 페이지(최종 수정 2026년 2월 20일)에는 아직 만 8세 미만, 월 10만 원으로 적혀 있어요. 반면 보건복지부 정책 페이지(2026년 3월 31일 수정)와 정책브리핑(2026년 3월 30일)은 개정된 만 9세 미만과 지역별 금액을 안내해요. 개정 이후 날짜의 자료를 기준으로 삼는 게 안전합니다. 한 가지 더, 피싱 주의 복지부는 아동수당 확대와 관련해 신청을 요구하는 문자나 링크는 피싱일 수 있다며 주의하라고 안내했어요. 직권 신청으로 순차 지급하는 대상이 있기 때문이에요. 문의는 보건복지상담센터 129로 하면 돼요. 한눈에 정리 - 부모급여는 만 2세 미만, 아동수당은 2026년 만 9세 미만 - 둘 다 출생 후 60일 안에 신청하면 출생한 달부터 소급 - 아동수당은 거주 지역에 따라 월 10만~12만 원 금액과 대상은 해마다 바뀌니 신청 전 복지로나 129에서 다시 확인해 주세요. 네이버"}, {"id": "013", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "013_unemployment-benefit-steps.md", "title": "퇴사 후 실업급여(구직급여) 신청 순서, 이직확인서부터 실업인정까지 한 번에", "cands": ["실업급여는 '고용센터 방문'이 핵심! 퇴사 후 신청 순서와 준비할 것 (2026년)", "구직급여 지급일수는 얼마나? 가입기간·나이별 표와 신청 절차 정리", "실업급여 받다가 일을 하면 신고해야 할까? 신청 후 지켜야 할 것"], "cat": "고용·노동", "kw": ["실업급여", "구직급여", "이직확인서", "고용24", "실업인정"], "summary": "퇴사 후 구직급여 신청 순서, 지급일수·금액 구조, 신청 후 지켜야 할 신고 의무를 고용24·고용노동부 안내 기준으로 정리", "status": "초안", "created": "2026-10-05 12:26", "base": "2026-10-05", "need": 2, "chars": 1904, "chars_ns": 1461, "imgs": 0, "slots": 0, "html": "<p>결론부터 말씀드리면 실업급여(구직급여) 신청의 핵심은 세 가지예요. 회사가 제출하는 이직확인서, 고용24 구직 등록과 사전 교육, 그리고 신분증을 들고 고용복지센터를 방문하는 수급자격 인정 신청이에요. 고용24 제도 안내와 고용노동부 자료를 기준으로 순서와 주의점을 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<h3>어떤 조건이 필요할까?<\/h3>\n<p>정부24의 구직급여 안내에는 이직일 이전 18개월 동안 피보험단위기간이 180일 이상일 것, 회사 사정 등 본인 뜻과 무관한 이직일 것, 일할 의사와 능력이 있는데도 취업하지 못한 상태일 것, 적극적으로 재취업 활동을 할 것이 요건으로 나와 있어요. 스스로 그만둔 경우에 인정되는 예외 사유는 제가 공식 자료로 확인하지 못했어요. <mark class=\"need\">[확인 필요: 자발적 이직 시 정당한 사유 인정 범위]<\/mark><\/p>\n<h3>신청 순서<\/h3>\n<ol><li>퇴사한 회사에 서류 요청: 회사가 고용보험 피보험자격 상실 신고서와 이직확인서를 제출해야 해요. 사업주는 이직확인서 발급 요청을 받으면 10일 이내에 발급해야 하고, 처리 현황은 고용24 마이페이지에서 볼 수 있어요. 퇴직할 때 미리 요청해 두는 것을 고용24가 권하고 있어요.<\/li><li>구직 등록: 고용24에서 구직 등록을 해요.<\/li><li>사전 교육: 온라인 교육을 먼저 듣는 게 좋고, 못 들었다면 센터에서 현장 교육을 받아요.<\/li><li>수급자격 인정 신청: 신분증을 지참해 고용복지센터를 방문해 신청서를 내요. 서류가 모두 처리된 상용근로자로서 180일 이상 비자발적 이직이고 이직일 기준 만 65세 미만이라면 인터넷으로 신청서를 먼저 제출하는 서비스를 쓸 수 있어요.<\/li><li>재취업 활동과 실업인정: 1~4주마다 취업하지 못한 상태인지, 구직 활동을 했는지 인정받아야 해요. 특정 회차를 빼면 온라인으로 가능하고, 통상 인정 다음 날 지정 계좌로 입금돼요.<\/li><\/ol>\n<h3>얼마나, 얼마 동안 받을까?<\/h3>\n<p>구직급여는 이직 전 평균임금의 60%에 소정급여일수를 곱해 계산하고, 상한액과 하한액이 있어요. 고용노동부는 2025년 12월 시행령 개정안을 의결하면서 상한액을 66,000원에서 68,100원으로 올린다고 밝혔어요. 하한액은 최저임금의 80%에 1일 소정근로시간 8시간을 곱한 값인데, 고용보험 제도 안내 페이지는 2024년 금액까지만 나와 있어 2026년 금액은 공식 화면으로 확인하지 못했어요. <mark class=\"need\">[확인 필요: 2026년 하한액]<\/mark><\/p>\n<p>지급일수는 이직일 2019년 10월 1일 이후 기준으로 아래와 같아요.<\/p>\n<div class=\"tw\"><table><thead><tr><th>가입기간<\/th><th>50세 미만<\/th><th>50세 이상·장애인<\/th><\/tr><\/thead><tbody><tr><td>1년 미만<\/td><td>120일<\/td><td>120일<\/td><\/tr><tr><td>1~3년 미만<\/td><td>150일<\/td><td>180일<\/td><\/tr><tr><td>3~5년 미만<\/td><td>180일<\/td><td>210일<\/td><\/tr><tr><td>5~10년 미만<\/td><td>210일<\/td><td>240일<\/td><\/tr><tr><td>10년 이상<\/td><td>240일<\/td><td>270일<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>받으면서 꼭 지켜야 할 것<\/h3>\n<ul><li>일을 했다면 하루 소득이 얼마든, 임금을 못 받았더라도 실업인정 때 근로 사실을 신고해야 해요. 신고하지 않으면 부정수급이 될 수 있고 1년 이하 징역 또는 300만 원 이하 벌금 대상이라고 안내돼 있어요.<\/li><li>재취업하면 취업한 날부터 2개월 이내에 신고해야 해요.<\/li><li>실업인정은 본인이 직접 신청해야 해요. 다른 사람이 대신 쓰면 부정수급이에요.<\/li><li>입사 지원을 한 것처럼 꾸미는 허위 구직활동은 지급 제한 대상이에요.<\/li><li>마지막 근무일 다음 날부터 1년이 지나면 지급일수가 남아 있어도 끝나요. 그래서 퇴사 후 너무 미루지 않는 게 중요해요.<\/li><li>결정에 이의가 있으면 통지를 받은 날부터 90일 안에 심사 청구를 할 수 있어요.<\/li><\/ul>\n<h3>한눈에 정리<\/h3>\n<ul><li>순서: 이직확인서 → 구직 등록 → 사전 교육 → 고용센터 방문 → 실업인정<\/li><li>지급: 평균임금 60% × 지급일수(120~270일), 상한·하한액 존재<\/li><li>일한 사실 신고와 본인 직접 신청이 필수<\/li><\/ul>\n<p>개인 사정에 따라 인정 여부가 달라질 수 있으니 고용노동부 고객상담센터(1350)나 관할 고용복지센터에 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래<\/td><td>고용24 '실업급여' 제도 안내 화면(로그인 전) 직접 캡처<\/td><td>마이페이지 화면은 개인정보가 많아 캡처 금지<\/td><\/tr><tr><td>지급일수 표 아래<\/td><td>표를 이미지로 만들 경우에도 본문 텍스트 표는 유지<\/td><td>이미지 속 글자는 검색에 잡히지 않을 수 있음<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 2026년 구직급여 하한액을 고용24(ei.work24.go.kr) 구직급여액 안내 또는 고용노동부 공지에서 확인해 문장 추가·대체<\/li><li class=\"cb\">☐ 자발적 이직 시 정당한 사유 범위는 공식 안내로 확인하기 전에는 쓰지 말고, <mark class=\"need\">[확인 필요]<\/mark> 문장을 삭제하거나 확인된 내용으로 대체<\/li><li class=\"cb\">☐ 상한액 68,100원이 2026년 이직자에게 적용되는지(시행일) 고용노동부 자료에서 한 번 더 확인<\/li><li class=\"cb\">☐ 본문은 제도 안내일 뿐 개별 수급 가능 여부를 단정하는 표현이 없는지 확인<\/li><li class=\"cb\">☐ 실제 수급 경험담을 쓰고 싶으면 사실만 쓰고, 사업장·금액 정보는 가리기<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>신청 절차, 이직확인서·상실신고, 인터넷 제출 요건, 실업인정, 신고 의무, 부정수급 처벌, 1년 종료, 이의신청 90일<\/td><td>고용24 제도안내 <a href=\"https://www.work24.go.kr/cm/c/f/1100/selecSystInfo.do?systId=SI00000411\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.work24.go.kr/cm/c/f/1100/selecSystInfo.do?systId=SI00000411<\/a><\/td><td>공식<\/td><\/tr><tr><td>지급액 계산식(평균임금 60%), 하한액 계산식, 소정급여일수 표<\/td><td>고용보험 제도 구직급여액 <a href=\"https://ei.work24.go.kr/ei/eih/eg/pb/pbPersonBnef/retrievePb0203Info.do\" target=\"_blank\" rel=\"noopener noreferrer\">https://ei.work24.go.kr/ei/eih/eg/pb/pbPersonBnef/retrievePb0203Info.do<\/a><\/td><td>공식<\/td><\/tr><tr><td>상한액 66,000원→68,100원 인상<\/td><td>고용노동부 보도자료(2025-12-16) <a href=\"https://www.moel.go.kr/news/enews/report/enewsView.do?news_seq=18736\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.moel.go.kr/news/enews/report/enewsView.do?news_seq=18736<\/a><\/td><td>공식<\/td><\/tr><tr><td>수급 요건(18개월 중 180일 등)<\/td><td>정부24 구직급여 <a href=\"https://www.gov.kr/portal/service/serviceInfo/SD0000015536\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.kr/portal/service/serviceInfo/SD0000015536<\/a> (검색 요약으로 확인, 박스에서 페이지 직접 열람은 접근 제한)<\/td><td>공식(검색 요약)<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "결론부터 말씀드리면 실업급여(구직급여) 신청의 핵심은 세 가지예요. 회사가 제출하는 이직확인서, 고용24 구직 등록과 사전 교육, 그리고 신분증을 들고 고용복지센터를 방문하는 수급자격 인정 신청이에요. 고용24 제도 안내와 고용노동부 자료를 기준으로 순서와 주의점을 정리했습니다. (2026년 10월 5일 기준)\n\n어떤 조건이 필요할까?\n\n정부24의 구직급여 안내에는 이직일 이전 18개월 동안 피보험단위기간이 180일 이상일 것, 회사 사정 등 본인 뜻과 무관한 이직일 것, 일할 의사와 능력이 있는데도 취업하지 못한 상태일 것, 적극적으로 재취업 활동을 할 것이 요건으로 나와 있어요. 스스로 그만둔 경우에 인정되는 예외 사유는 제가 공식 자료로 확인하지 못했어요. [확인 필요: 자발적 이직 시 정당한 사유 인정 범위]\n\n신청 순서\n\n1. 퇴사한 회사에 서류 요청: 회사가 고용보험 피보험자격 상실 신고서와 이직확인서를 제출해야 해요. 사업주는 이직확인서 발급 요청을 받으면 10일 이내에 발급해야 하고, 처리 현황은 고용24 마이페이지에서 볼 수 있어요. 퇴직할 때 미리 요청해 두는 것을 고용24가 권하고 있어요.\n2. 구직 등록: 고용24에서 구직 등록을 해요.\n3. 사전 교육: 온라인 교육을 먼저 듣는 게 좋고, 못 들었다면 센터에서 현장 교육을 받아요.\n4. 수급자격 인정 신청: 신분증을 지참해 고용복지센터를 방문해 신청서를 내요. 서류가 모두 처리된 상용근로자로서 180일 이상 비자발적 이직이고 이직일 기준 만 65세 미만이라면 인터넷으로 신청서를 먼저 제출하는 서비스를 쓸 수 있어요.\n5. 재취업 활동과 실업인정: 1~4주마다 취업하지 못한 상태인지, 구직 활동을 했는지 인정받아야 해요. 특정 회차를 빼면 온라인으로 가능하고, 통상 인정 다음 날 지정 계좌로 입금돼요.\n\n얼마나, 얼마 동안 받을까?\n\n구직급여는 이직 전 평균임금의 60%에 소정급여일수를 곱해 계산하고, 상한액과 하한액이 있어요. 고용노동부는 2025년 12월 시행령 개정안을 의결하면서 상한액을 66,000원에서 68,100원으로 올린다고 밝혔어요. 하한액은 최저임금의 80%에 1일 소정근로시간 8시간을 곱한 값인데, 고용보험 제도 안내 페이지는 2024년 금액까지만 나와 있어 2026년 금액은 공식 화면으로 확인하지 못했어요. [확인 필요: 2026년 하한액]\n\n지급일수는 이직일 2019년 10월 1일 이후 기준으로 아래와 같아요.\n\n• 1년 미만 — 50세 미만: 120일 / 50세 이상·장애인: 120일\n• 1~3년 미만 — 50세 미만: 150일 / 50세 이상·장애인: 180일\n• 3~5년 미만 — 50세 미만: 180일 / 50세 이상·장애인: 210일\n• 5~10년 미만 — 50세 미만: 210일 / 50세 이상·장애인: 240일\n• 10년 이상 — 50세 미만: 240일 / 50세 이상·장애인: 270일\n\n받으면서 꼭 지켜야 할 것\n\n- 일을 했다면 하루 소득이 얼마든, 임금을 못 받았더라도 실업인정 때 근로 사실을 신고해야 해요. 신고하지 않으면 부정수급이 될 수 있고 1년 이하 징역 또는 300만 원 이하 벌금 대상이라고 안내돼 있어요.\n- 재취업하면 취업한 날부터 2개월 이내에 신고해야 해요.\n- 실업인정은 본인이 직접 신청해야 해요. 다른 사람이 대신 쓰면 부정수급이에요.\n- 입사 지원을 한 것처럼 꾸미는 허위 구직활동은 지급 제한 대상이에요.\n- 마지막 근무일 다음 날부터 1년이 지나면 지급일수가 남아 있어도 끝나요. 그래서 퇴사 후 너무 미루지 않는 게 중요해요.\n- 결정에 이의가 있으면 통지를 받은 날부터 90일 안에 심사 청구를 할 수 있어요.\n\n한눈에 정리\n\n- 순서: 이직확인서 → 구직 등록 → 사전 교육 → 고용센터 방문 → 실업인정\n- 지급: 평균임금 60% × 지급일수(120~270일), 상한·하한액 존재\n- 일한 사실 신고와 본인 직접 신청이 필수\n\n개인 사정에 따라 인정 여부가 달라질 수 있으니 고용노동부 고객상담센터(1350)나 관할 고용복지센터에 확인해 주세요.", "copyAll": "결론부터 말씀드리면 실업급여(구직급여) 신청의 핵심은 세 가지예요. 회사가 제출하는 이직확인서, 고용24 구직 등록과 사전 교육, 그리고 신분증을 들고 고용복지센터를 방문하는 수급자격 인정 신청이에요. 고용24 제도 안내와 고용노동부 자료를 기준으로 순서와 주의점을 정리했습니다. (2026년 10월 5일 기준)\n\n어떤 조건이 필요할까?\n\n정부24의 구직급여 안내에는 이직일 이전 18개월 동안 피보험단위기간이 180일 이상일 것, 회사 사정 등 본인 뜻과 무관한 이직일 것, 일할 의사와 능력이 있는데도 취업하지 못한 상태일 것, 적극적으로 재취업 활동을 할 것이 요건으로 나와 있어요. 스스로 그만둔 경우에 인정되는 예외 사유는 제가 공식 자료로 확인하지 못했어요. [확인 필요: 자발적 이직 시 정당한 사유 인정 범위]\n\n신청 순서\n\n1. 퇴사한 회사에 서류 요청: 회사가 고용보험 피보험자격 상실 신고서와 이직확인서를 제출해야 해요. 사
