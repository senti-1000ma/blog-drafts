h-checkup.md", "title": "영유아 건강검진 우리 아이는 지금 몇 차? 검진표 못 찾을 때 확인하는 순서 (2026년)", "cands": ["영유아 건강검진 우리 아이는 지금 몇 차? 검진표 못 찾을 때 확인하는 순서 (2026년)", "생후 14일부터 71개월까지, 영유아 건강검진 1~8차 시기표 한 장 정리", "영유아 구강검진은 언제? 건강검진과 기간이 다른 차수 정리"], "cat": "건강·보건", "kw": ["영유아 건강검진", "검진 시기", "국민건강보험공단", "구강검진", "검진유효기간"], "summary": "국민건강보험공단 안내 기준으로 영유아 건강검진(생후 14일~71개월) 1~8차와 구강검진 4회의 검진유효기간, 검진표 전자문서 발송, 검진 항목, 비용(본인부담 없음)을 번호 단계로 정리", "status": "초안", "created": "2026-10-05 15:07", "base": "2026-10-05", "need": 0, "chars": 1724, "chars_ns": 1341, "imgs": 3, "slots": 2, "filled": 2, "thumb": "img/040/040_0_thumb.png", "seHtml": "<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/040/040_0_thumb.png\" alt=\"대표 이미지\" width=\"720\"><\/p>\n<p>아이 키우다 보면 \"저번 검진이 몇 차였더라?\", \"검진표가 왔다는데 어디 있지?\" 하는 순간이 꼭 오지요. 영유아 건강검진은 차수마다 받을 수 있는 기간이 정해져 있어서, 지금 아이 월령이 어느 구간인지부터 알면 훨씬 쉬워져요. 국민건강보험공단 안내를 바탕으로 확인 순서를 단계별로 정리했어요. (2026년 10월 5일 기준)<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>1단계. 월령으로 '지금 몇 차'인지 찾기<\/b><\/span><\/p>\n<p>공단은 생후 14일부터 71개월까지의 영유아를 검진 시기별로 대상자로 정해요. 건강검진 8번, 구강검진 4번이고, 구강검진은 같은 차수 건강검진보다 기간이 더 길어요.<\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>차수<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>건강검진<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>구강검진<\/b><\/td><\/tr><tr><td>1차<\/td><td>생후 14~35일<\/td><td>-<\/td><\/tr><tr><td>2차<\/td><td>생후 4~6개월<\/td><td>-<\/td><\/tr><tr><td>3차<\/td><td>생후 9~12개월<\/td><td>-<\/td><\/tr><tr><td>4차<\/td><td>생후 18~24개월<\/td><td>생후 18~29개월<\/td><\/tr><tr><td>5차<\/td><td>생후 30~36개월<\/td><td>생후 30~41개월<\/td><\/tr><tr><td>6차<\/td><td>생후 42~48개월<\/td><td>생후 42~53개월<\/td><\/tr><tr><td>7차<\/td><td>생후 54~60개월<\/td><td>생후 54~65개월<\/td><\/tr><tr><td>8차<\/td><td>생후 66~71개월<\/td><td>-<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/040/040_1_capture.png\" alt=\"&#x27;건강검진 실시안내 &gt; 영유아건강검진&#x27;의 차수별 대상자 선정 기준 (2026-10-05 확인)\" width=\"720\"><\/p><p style=\"text-align:center\"><span style=\"font-size:13px;color:#888888\">출처: 국민건강보험공단 홈페이지<\/span><\/p>\n<p>공단 정책 안내에서는 이 기간을 '검진유효기간'이라고 표기해요. 1차는 생후 3주 남짓한 짧은 구간이라 출생 직후부터 챙기는 게 좋아요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>2단계. 검진표가 어디로 왔는지 확인하기<\/b><\/span><\/p>\n<p>영유아 건강검진표는 공단이 <b>직장가입자 또는 세대주에게 전자문서로<\/b> 보내요. 전자문서를 열어보지 않으면 우편으로 추가 발송한다고 안내돼 있어요. 그러니 검진표가 안 보인다면 아이 부모 본인이 아니라 건강보험 직장가입자나 세대주 앞으로 온 전자문서함부터 살펴보세요. 국민건강보험 누리집 '건강모아'에는 영유아 검진일자 조회와 문진표 서식 메뉴도 마련돼 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>3단계. 차수별로 무엇을 하는지 알아두기<\/b><\/span><\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>항목<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>내용<\/b><\/td><\/tr><tr><td>문진 및 진찰<\/td><td>문진표, 진찰, 청각·시각 문진 등(6차 귓속말검사, 8차 예방접종 확인 포함)<\/td><\/tr><tr><td>신체계측<\/td><td>키, 몸무게(체질량지수), 머리둘레<\/td><\/tr><tr><td>발달평가<\/td><td>3차부터 한국 영유아 발달선별검사(K-DST)로 평가·상담<\/td><\/tr><tr><td>건강교육<\/td><td>안전사고 예방, 영양, 수면, 전자미디어 노출, 대소변 가리기, 취학 전 준비 등<\/td><\/tr><tr><td>구강검진<\/td><td>구강 문진·진찰, 보호자·유아 구강보건교육<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p>4~7차는 건강검진과 구강검진이 같은 차수로 묶여 있지만 받을 수 있는 기간이 서로 달라요. 예를 들어 4차 건강검진은 생후 24개월까지지만 4차 구강검진은 29개월까지라, 두 기간을 각각 달력에 적어 두면 놓치지 않아요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>4단계. 비용과 검진 기관 확인하기<\/b><\/span><\/p>\n<p>본인부담은 <b>없어요<\/b>. 건강보험 가입자는 공단이 전액 부담하고, 의료급여수급권자는 국가와 지자체가 부담해요. 검진은 전국의 영유아 검진기관에서 받을 수 있어요.<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/040/040_2_card.png\" alt=\"영유아 건강검진 한눈에 정리\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>5단계. 결과는 검진 기관에서 받기<\/b><\/span><\/p>\n<p>검진 결과는 검진이 끝난 뒤 검진 기관이 보호자에게 직접 알려줘요. 결과 내용에 대한 해석이나 이후 진료가 필요한지는 검진한 의료진과 상담하세요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>생후 14일~71개월, 건강검진 8회 + 구강검진 4회<\/li><li>차수마다 검진유효기간이 정해져 있음(1차는 생후 14~35일)<\/li><li>검진표는 직장가입자·세대주에게 전자문서로, 미열람 시 우편<\/li><li>본인부담 없음, 전국 영유아 검진기관에서 가능<\/li><\/ul>\n<p>기간과 항목은 바뀔 수 있으니 검진 전 국민건강보험공단 누리집이나 고객센터(1577-1000)에서 다시 확인해 주세요.<\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/040/040_0_thumb.png\n\n아이 키우다 보면 \"저번 검진이 몇 차였더라?\", \"검진표가 왔다는데 어디 있지?\" 하는 순간이 꼭 오지요. 영유아 건강검진은 차수마다 받을 수 있는 기간이 정해져 있어서, 지금 아이 월령이 어느 구간인지부터 알면 훨씬 쉬워져요. 국민건강보험공단 안내를 바탕으로 확인 순서를 단계별로 정리했어요. (2026년 10월 5일 기준)\n\n1단계. 월령으로 '지금 몇 차'인지 찾기\n\n공단은 생후 14일부터 71개월까지의 영유아를 검진 시기별로 대상자로 정해요. 건강검진 8번, 구강검진 4번이고, 구강검진은 같은 차수 건강검진보다 기간이 더 길어요.\n\n• 1차 — 건강검진: 생후 14~35일 / 구강검진: -\n• 2차 — 건강검진: 생후 4~6개월 / 구강검진: -\n• 3차 — 건강검진: 생후 9~12개월 / 구강검진: -\n• 4차 — 건강검진: 생후 18~24개월 / 구강검진: 생후 18~29개월\n• 5차 — 건강검진: 생후 30~36개월 / 구강검진: 생후 30~41개월\n• 6차 — 건강검진: 생후 42~48개월 / 구강검진: 생후 42~53개월\n• 7차 — 건강검진: 생후 54~60개월 / 구강검진: 생후 54~65개월\n• 8차 — 건강검진: 생후 66~71개월 / 구강검진: -\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/040/040_1_capture.png\n출처: 국민건강보험공단 홈페이지\n\n공단 정책 안내에서는 이 기간을 '검진유효기간'이라고 표기해요. 1차는 생후 3주 남짓한 짧은 구간이라 출생 직후부터 챙기는 게 좋아요.\n\n2단계. 검진표가 어디로 왔는지 확인하기\n\n영유아 건강검진표는 공단이 직장가입자 또는 세대주에게 전자문서로 보내요. 전자문서를 열어보지 않으면 우편으로 추가 발송한다고 안내돼 있어요. 그러니 검진표가 안 보인다면 아이 부모 본인이 아니라 건강보험 직장가입자나 세대주 앞으로 온 전자문서함부터 살펴보세요. 국민건강보험 누리집 '건강모아'에는 영유아 검진일자 조회와 문진표 서식 메뉴도 마련돼 있어요.\n\n3단계. 차수별로 무엇을 하는지 알아두기\n\n• 문진 및 진찰 — 내용: 문진표, 진찰, 청각·시각 문진 등(6차 귓속말검사, 8차 예방접종 확인 포함)\n• 신체계측 — 내용: 키, 몸무게(체질량지수), 머리둘레\n• 발달평가 — 내용: 3차부터 한국 영유아 발달선별검사(K-DST)로 평가·상담\n• 건강교육 — 내용: 안전사고 예방, 영양, 수면, 전자미디어 노출, 대소변 가리기, 취학 전 준비 등\n• 구강검진 — 내용: 구강 문진·진찰, 보호자·유아 구강보건교육\n\n4~7차는 건강검진과 구강검진이 같은 차수로 묶여 있지만 받을 수 있는 기간이 서로 달라요. 예를 들어 4차 건강검진은 생후 24개월까지지만 4차 구강검진은 29개월까지라, 두 기간을 각각 달력에 적어 두면 놓치지 않아요.\n\n4단계. 비용과 검진 기관 확인하기\n\n본인부담은 없어요. 건강보험 가입자는 공단이 전액 부담하고, 의료급여수급권자는 국가와 지자체가 부담해요. 검진은 전국의 영유아 검진기관에서 받을 수 있어요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/040/040_2_card.png\n\n5단계. 결과는 검진 기관에서 받기\n\n검진 결과는 검진이 끝난 뒤 검진 기관이 보호자에게 직접 알려줘요. 결과 내용에 대한 해석이나 이후 진료가 필요한지는 검진한 의료진과 상담하세요.\n\n한눈에 정리\n\n- 생후 14일~71개월, 건강검진 8회 + 구강검진 4회\n- 차수마다 검진유효기간이 정해져 있음(1차는 생후 14~35일)\n- 검진표는 직장가입자·세대주에게 전자문서로, 미열람 시 우편\n- 본인부담 없음, 전국 영유아 검진기관에서 가능\n\n기간과 항목은 바뀔 수 있으니 검진 전 국민건강보험공단 누리집이나 고객센터(1577-1000)에서 다시 확인해 주세요.", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/040/040_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/040/040_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "040_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/040/040_1_capture.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/040/040_1_capture.png", "cap": "출처: 국민건강보험공단 홈페이지", "alt": "'건강검진 실시안내 > 영유아건강검진'의 차수별 대상자 선정 기준 (2026-10-05 확인)", "name": "040_1_capture.png", "w": 1080, "h": 1224}, {"n": 2, "label": "사진 2", "uri": "img/040/040_2_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/040/040_2_card.png", "cap": "", "alt": "영유아 건강검진 한눈에 정리", "name": "040_2_card.png", "w": 1080, "h": 840}], "zip": "img/040/040_images.zip", "html": "<figure class=\"ph thumbfig\" data-n=\"0\"><img src=\"img/040/040_0_thumb.png\" alt=\"대표 이미지\"><\/figure>\n<p>아이 키우다 보면 \"저번 검진이 몇 차였더라?\", \"검진표가 왔다는데 어디 있지?\" 하는 순간이 꼭 오지요. 영유아 건강검진은 차수마다 받을 수 있는 기간이 정해져 있어서, 지금 아이 월령이 어느 구간인지부터 알면 훨씬 쉬워져요. 국민건강보험공단 안내를 바탕으로 확인 순서를 단계별로 정리했어요. (2026년 10월 5일 기준)<\/p>\n<h3>1단계. 월령으로 '지금 몇 차'인지 찾기<\/h3>\n<p>공단은 생후 14일부터 71개월까지의 영유아를 검진 시기별로 대상자로 정해요. 건강검진 8번, 구강검진 4번이고, 구강검진은 같은 차수 건강검진보다 기간이 더 길어요.<\/p>\n<div class=\"tw\"><table><thead><tr><th>차수<\/th><th>건강검진<\/th><th>구강검진<\/th><\/tr><\/thead><tbody><tr><td>1차<\/td><td>생후 14~35일<\/td><td>-<\/td><\/tr><tr><td>2차<\/td><td>생후 4~6개월<\/td><td>-<\/td><\/tr><tr><td>3차<\/td><td>생후 9~12개월<\/td><td>-<\/td><\/tr><tr><td>4차<\/td><td>생후 18~24개월<\/td><td>생후 18~29개월<\/td><\/tr><tr><td>5차<\/td><td>생후 30~36개월<\/td><td>생후 30~41개월<\/td><\/tr><tr><td>6차<\/td><td>생후 42~48개월<\/td><td>생후 42~53개월<\/td><\/tr><tr><td>7차<\/td><td>생후 54~60개월<\/td><td>생후 54~65개월<\/td><\/tr><tr><td>8차<\/td><td>생후 66~71개월<\/td><td>-<\/td><\/tr><\/tbody><\/table><\/div>\n<figure class=\"ph\" data-n=\"1\"><img loading=\"lazy\" src=\"img/040/040_1_capture.png\" alt=\"&#x27;건강검진 실시안내 &gt; 영유아건강검진&#x27;의 차수별 대상자 선정 기준 (2026-10-05 확인)\"><figcaption>출처: 국민건강보험공단 홈페이지<\/figcaption><\/figure>\n<p>공단 정책 안내에서는 이 기간을 '검진유효기간'이라고 표기해요. 1차는 생후 3주 남짓한 짧은 구간이라 출생 직후부터 챙기는 게 좋아요.<\/p>\n<h3>2단계. 검진표가 어디로 왔는지 확인하기<\/h3>\n<p>영유아 건강검진표는 공단이 <strong>직장가입자 또는 세대주에게 전자문서로<\/strong> 보내요. 전자문서를 열어보지 않으면 우편으로 추가 발송한다고 안내돼 있어요. 그러니 검진표가 안 보인다면 아이 부모 본인이 아니라 건강보험 직장가입자나 세대주 앞으로 온 전자문서함부터 살펴보세요. 국민건강보험 누리집 '건강모아'에는 영유아 검진일자 조회와 문진표 서식 메뉴도 마련돼 있어요.<\/p>\n<h3>3단계. 차수별로 무엇을 하는지 알아두기<\/h3>\n<div class=\"tw\"><table><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>문진 및 진찰<\/td><td>문진표, 진찰, 청각·시각 문진 등(6차 귓속말검사, 8차 예방접종 확인 포함)<\/td><\/tr><tr><td>신체계측<\/td><td>키, 몸무게(체질량지수), 머리둘레<\/td><\/tr><tr><td>발달평가<\/td><td>3차부터 한국 영유아 발달선별검사(K-DST)로 평가·상담<\/td><\/tr><tr><td>건강교육<\/td><td>안전사고 예방, 영양, 수면, 전자미디어 노출, 대소변 가리기, 취학 전 준비 등<\/td><\/tr><tr><td>구강검진<\/td><td>구강 문진·진찰, 보호자·유아 구강보건교육<\/td><\/tr><\/tbody><\/table><\/div>\n<p>4~7차는 건강검진과 구강검진이 같은 차수로 묶여 있지만 받을 수 있는 기간이 서로 달라요. 예를 들어 4차 건강검진은 생후 24개월까지지만 4차 구강검진은 29개월까지라, 두 기간을 각각 달력에 적어 두면 놓치지 않아요.<\/p>\n<h3>4단계. 비용과 검진 기관 확인하기<\/h3>\n<p>본인부담은 <strong>없어요<\/strong>. 건강보험 가입자는 공단이 전액 부담하고, 의료급여수급권자는 국가와 지자체가 부담해요. 검진은 전국의 영유아 검진기관에서 받을 수 있어요.<\/p>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/040/040_2_card.png\" alt=\"영유아 건강검진 한눈에 정리\"><\/figure>\n<h3>5단계. 결과는 검진 기관에서 받기<\/h3>\n<p>검진 결과는 검진이 끝난 뒤 검진 기관이 보호자에게 직접 알려줘요. 결과 내용에 대한 해석이나 이후 진료가 필요한지는 검진한 의료진과 상담하세요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>생후 14일~71개월, 건강검진 8회 + 구강검진 4회<\/li><li>차수마다 검진유효기간이 정해져 있음(1차는 생후 14~35일)<\/li><li>검진표는 직장가입자·세대주에게 전자문서로, 미열람 시 우편<\/li><li>본인부담 없음, 전국 영유아 검진기관에서 가능<\/li><\/ul>\n<p>기간과 항목은 바뀔 수 있으니 검진 전 국민건강보험공단 누리집이나 고객센터(1577-1000)에서 다시 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 공식 화면 캡처 · 사진 2 자체 제작 카드 — 파일 images/posts/040/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>1단계 아래<\/td><td>직접 만든 차수 타임라인 카드(14일 → 71개월)<\/td><td>아이 얼굴·이름·검진표 실물 촬영 금지<\/td><\/tr><tr><td>2단계<\/td><td>전자문서함 화면은 캡처하지 말고 텍스트로만 안내<\/td><td>개인 계정·주민번호 노출 금지<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 1~8차 건강검진·4~7차 구강검진 기간을 국민건강보험 '영유아 건강검진 안내' 표와 다시 대조<\/li><li class=\"cb\">☐ 검진표 발송 대상(직장가입자·세대주, 전자문서 후 우편)을 재확인<\/li><li class=\"cb\">☐ '건강모아' 영유아 검진일자 조회 메뉴명은 직접 확인한 경우 그대로, 바뀌었다면 수정<\/li><li class=\"cb\">☐ (선택) 구강검진 가능 기관 찾는 방법은 직접 확인한 경우에만 추가<\/li><li class=\"cb\">☐ 검진 경험담은 실제 있었던 경우에만, 아이 개인정보 없이<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>대상(생후 14일~71개월), 1~8차·구강검진 기간표, 검진표 전자문서 발송·미열람 시 우편, 전국 영유아 검진기관, 차수별 검진항목, 결과 보호자 직접 통보, 본인부담 없음(공단 전액·의료급여는 국가·지자체), 1577-1000<\/td><td>국민건강보험 '영유아 건강검진 안내' <a href=\"https://www.nhis.or.kr/nhis/healthin/wbhaca04800m01.do\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nhis.or.kr/nhis/healthin/wbhaca04800m01.do<\/a><\/td><td>공식<\/td><\/tr><tr><td>'검진유효기간' 표기, 차수별 검진방법<\/td><td>국민건강보험 정책센터 '영유아건강검진' <a href=\"https://www.nhis.or.kr/nhis/policy/wbhada19900m01.do\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nhis.or.kr/nhis/policy/wbhada19900m01.do<\/a><\/td><td>공식<\/td><\/tr><tr><td>영유아 검진일자 조회·문진표 서식 메뉴<\/td><td>국민건강보험 <a href=\"https://www.nhis.or.kr/nhis/healthin/retrieveInfntExmdDtInq.do\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nhis.or.kr/nhis/healthin/retrieveInfntExmdDtInq.do<\/a> (검색 요약 확인, 원문 미열람)<\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "<ul><li>사진 1: 국민건강보험공단 홈페이지 공개 화면 캡처(2026-10-05 확인, 로그인 전 화면) <a href=\"https://www.nhis.or.kr/nhis/healthin/wbhaca04800m01.do\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nhis.or.kr/nhis/healthin/wbhaca04800m01.do<\/a><\/li><\/ul>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "아이 키우다 보면 \"저번 검진이 몇 차였더라?\", \"검진표가 왔다는데 어디 있지?\" 하는 순간이 꼭 오지요. 영유아 건강검진은 차수마다 받을 수 있는 기간이 정해져 있어서, 지금 아이 월령이 어느 구간인지부터 알면 훨씬 쉬워져요. 국민건강보험공단 안내를 바탕으로 확인 순서를 단계별로 정리했어요. (2026년 10월 5일 기준)\n\n1단계. 월령으로 '지금 몇 차'인지 찾기\n\n공단은 생후 14일부터 71개월까지의 영유아를 검진 시기별로 대상자로 정해요. 건강검진 8번, 구강검진 4번이고, 구강검진은 같은 차수 건강검진보다 기간이 더 길어요.\n\n• 1차 — 건강검진: 생후 14~35일 / 구강검진: -\n• 2차 — 건강검진: 생후 4~6개월 / 구강검진: -\n• 3차 — 건강검진: 생후 9~12개월 / 구강검진: -\n• 4차 — 건강검진: 생후 18~24개월 / 구강검진: 생후 18~29개월\n• 5차 — 건강검진: 생후 30~36개월 / 구강검진: 생후 30~41개월\n• 6차 — 건강검진: 생후 42~48개월 / 구강검진: 생후 42~53개월\n• 7차 — 건강검진: 생후 54~60개월 / 구강검진: 생후 54~65개월\n• 8차 — 건강검진: 생후 66~71개월 / 구강검진: -\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/040/040_1_capture.png\n출처: 국민건강보험공단 홈페이지\n\n공단 정책 안내에서는 이 기간을 '검진유효기간'이라고 표기해요. 1차는 생후 3주 남짓한 짧은 구간이라 출생 직후부터 챙기는 게 좋아요.\n\n2단계. 검진표가 어디로 왔는지 확인하기\n\n영유아 건강검진표는 공단이 직장가입자 또는 세대주에게 전자문서로 보내요. 전자문서를 열어보지 않으면 우편으로 추가 발송한다고 안내돼 있어요. 그러니 검진표가 안 보인다면 아이 부모 본인이 아니라 건강보험 직장가입자나 세대주 앞으로 온 전자문서함부터 살펴보세요. 국민건강보험 누리집 '건강모아'에는 영유아 검진일자 조회와 문진표 서식 메뉴도 마련돼 있어요.\n\n3단계. 차수별로 무엇을 하는지 알아두기\n\n• 문진 및 진찰 — 내용: 문진표, 진찰, 청각·시각 문진 등(6차 귓속말검사, 8차 예방접종 확인 포함)\n• 신체계측 — 내용: 키, 몸무게(체질량지수), 머리둘레\n• 발달평가 — 내용: 3차부터 한국 영유아 발달선별검사(K-DST)로 평가·상담\n• 건강교육 — 내용: 안전사고 예방, 영양, 수면, 전자미디어 노출, 대소변 가리기, 취학 전 준비 등\n• 구강검진 — 내용: 구강 문진·진찰, 보호자·유아 구강보건교육\n\n4~7차는 건강검진과 구강검진이 같은 차수로 묶여 있지만 받을 수 있는 기간이 서로 달라요. 예를 들어 4차 건강검진은 생후 24개월까지지만 4차 구강검진은 29개월까지라, 두 기간을 각각 달력에 적어 두면 놓치지 않아요.\n\n4단계. 비용과 검진 기관 확인하기\n\n본인부담은 없어요. 건강보험 가입자는 공단이 전액 부담하고, 의료급여수급권자는 국가와 지자체가 부담해요. 검진은 전국의 영유아 검진기관에서 받을 수 있어요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/040/040_2_card.png\n\n5단계. 결과는 검진 기관에서 받기\n\n검진 결과는 검진이 끝난 뒤 검진 기관이 보호자에게 직접 알려줘요. 결과 내용에 대한 해석이나 이후 진료가 필요한지는 검진한 의료진과 상담하세요.\n\n한눈에 정리\n\n- 생후 14일~71개월, 건강검진 8회 + 구강검진 4회\n- 차수마다 검진유효기간이 정해져 있음(1차는 생후 14~35일)\n- 검진표는 직장가입자·세대주에게 전자문서로, 미열람 시 우편\n- 본인부담 없음, 전국 영유아 검진기관에서 가능\n\n기간과 항목은 바뀔 수 있으니 검진 전 국민건강보험공단 누리집이나 고객센터(1577-1000)에서 다시 확인해 주세요.", "copyAll": "아이 키우다 보면 \"저번 검진이 몇 차였더라?\", \"검진표가 왔다는데 어디 있지?\" 하는 순간이 꼭 오지요. 영유아 건강검진은 차수마다 받을 수 있는 기간이 정해져 있어서, 지금 아이 월령이 어느 구간인지부터 알면 훨씬 쉬워져요. 국민건강보험공단 안내를 바탕으로 확인 순서를 단계별로 정리했어요. (2026년 10월 5일 기준)\n\n1단계. 월령으로 '지금 몇 차'인지 찾기\n\n공단은 생후 14일부터 71개월까지의 영유아를 검진 시기별로 대상자로 정해요. 건강검진 8번, 구강검진 4번이고, 구강검진은 같은 차수 건강검진보다 기간이 더 길어요.\n\n• 1차 — 건강검진: 생후 14~35일 / 구강검진: -\n• 2차 — 건강검진: 생후 4~6개월 / 구강검진: -\n• 3차 — 건강검진: 생후 9~12개월 / 구강검진: -\n• 4차 — 건강검진: 생후 18~24개월 / 구강검진: 생후 18~29개월\n• 5차 — 건강검진: 생후 30~36개월 / 구강검진: 생후 30~41개월\n• 6차 — 건강검진: 생후 42~48개월 / 구강검진: 생후 42~53개월\n• 7차 — 건강검진: 생후 54~60개월 / 구강검진: 생후 54~65개월\n• 8차 — 건강검진: 생후 66~71개월 / 구강검진: -\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/040/040_1_capture.png\n출처: 국민건강보험공단 홈페이지\n\n공단 정책 안내에서는 이 기간을 '검진유효기간'이라고 표기해요. 1차는 생후 3주 남짓한 짧은 구간이라 출생 직후부터 챙기는 게 좋아요.\n\n2단계. 검진표가 어디로 왔는지 확인하기\n\n영유아 건강검진표는 공단이 직장가입자 또는 세대주에게 전자문서로 보내요. 전자문서를 열어보지 않으면 우편으로 추가 발송한다고 안내돼 있어요. 그러니 검진표가 안 보인다면 아이 부모 본인이 아니라 건강보험 직장가입자나 세대주 앞으로 온 전자문서함부터 살펴보세요. 국민건강보험 누리집 '건강모아'에는 영유아 검진일자 조회와 문진표 서식 메뉴도 마련돼 있어요.\n\n3단계. 차수별로 무엇을 하는지 알아두기\n\n• 문진 및 진찰 — 내용: 문진표, 진찰, 청각·시각 문진 등(6차 귓속말검사, 8차 예방접종 확인 포함)\n• 신체계측 — 내용: 키, 몸무게(체질량지수), 머리둘레\n• 발달평가 — 내용: 3차부터 한국 영유아 발달선별검사(K-DST)로 평가·상담\n• 건강교육 — 내용: 안전사고 예방, 영양, 수면, 전자미디어 노출, 대소변 가리기, 취학 전 준비 등\n• 구강검진 — 내용: 구강 문진·진찰, 보호자·유아 구강보건교육\n\n4~7차는 건강검진과 구강검진이 같은 차수로 묶여 있지만 받을 수 있는 기간이 서로 달라요. 예를 들어 4차 건강검진은 생후 24개월까지지만 4차 구강검진은 29개월까지라, 두 기간을 각각 달력에 적어 두면 놓치지 않아요.\n\n4단계. 비용과 검진 기관 확인하기\n\n본인부담은 없어요. 건강보험 가입자는 공단이 전액 부담하고, 의료급여수급권자는 국가와 지자체가 부담해요. 검진은 전국의 영유아 검진기관에서 받을 수 있어요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/040/040_2_card.png\n\n5단계. 결과는 검진 기관에서 받기\n\n검진 결과는 검진이 끝난 뒤 검진 기관이 보호자에게 직접 알려줘요. 결과 내용에 대한 해석이나 이후 진료가 필요한지는 검진한 의료진과 상담하세요.\n\n한눈에 정리\n\n- 생후 14일~71개월, 건강검진 8회 + 구강검진 4회\n- 차수마다 검진유효기간이 정해져 있음(1차는 생후 14~35일)\n- 검진표는 직장가입자·세대주에게 전자문서로, 미열람 시 우편\n- 본인부담 없음, 전국 영유아 검진기관에서 가능\n\n기간과 항목은 바뀔 수 있으니 검진 전 국민건강보험공단 누리집이나 고객센터(1577-1000)에서 다시 확인해 주세요.", "search": "040 영유아 건강검진 우리 아이는 지금 몇 차? 검진표 못 찾을 때 확인하는 순서 (2026년) 건강·보건 영유아 건강검진, 검진 시기, 국민건강보험공단, 구강검진, 검진유효기간 국민건강보험공단 안내 기준으로 영유아 건강검진(생후 14일~71개월) 1~8차와 구강검진 4회의 검진유효기간, 검진표 전자문서 발송, 검진 항목, 비용(본인부담 없음)을 번호 단계로 정리 아이 키우다 보면 \"저번 검진이 몇 차였더라?\", \"검진표가 왔다는데 어디 있지?\" 하는 순간이 꼭 오지요. 영유아 건강검진은 차수마다 받을 수 있는 기간이 정해져 있어서, 지금 아이 월령이 어느 구간인지부터 알면 훨씬 쉬워져요. 국민건강보험공단 안내를 바탕으로 확인 순서를 단계별로 정리했어요. (2026년 10월 5일 기준) 1단계. 월령으로 '지금 몇 차'인지 찾기 공단은 생후 14일부터 71개월까지의 영유아를 검진 시기별로 대상자로 정해요. 건강검진 8번, 구강검진 4번이고, 구강검진은 같은 차수 건강검진보다 기간이 더 길어요. • 1차 — 건강검진: 생후 14~35일 / 구강검진: - • 2차 — 건강검진: 생후 4~6개월 / 구강검진: - • 3차 — 건강검진: 생후 9~12개월 / 구강검진: - • 4차 — 건강검진: 생후 18~24개월 / 구강검진: 생후 18~29개월 • 5차 — 건강검진: 생후 30~36개월 / 구강검진: 생후 30~41개월 • 6차 — 건강검진: 생후 42~48개월 / 구강검진: 생후 42~53개월 • 7차 — 건강검진: 생후 54~60개월 / 구강검진: 생후 54~65개월 • 8차 — 건강검진: 생후 66~71개월 / 구강검진: - [사진 1] https://senti-1000ma.github.io/blog-drafts/img/040/040_1_capture.png 출처: 국민건강보험공단 홈페이지 공단 정책 안내에서는 이 기간을 '검진유효기간'이라고 표기해요. 1차는 생후 3주 남짓한 짧은 구간이라 출생 직후부터 챙기는 게 좋아요. 2단계. 검진표가 어디로 왔는지 확인하기 영유아 건강검진표는 공단이 직장가입자 또는 세대주에게 전자문서로 보내요. 전자문서를 열어보지 않으면 우편으로 추가 발송한다고 안내돼 있어요. 그러니 검진표가 안 보인다면 아이 부모 본인이 아니라 건강보험 직장가입자나 세대주 앞으로 온 전자문서함부터 살펴보세요. 국민건강보험 누리집 '건강모아'에는 영유아 검진일자 조회와 문진표 서식 메뉴도 마련돼 있어요. 3단계. 차수별로 무엇을 하는지 알아두기 • 문진 및 진찰 — 내용: 문진표, 진찰, 청각·시각 문진 등(6차 귓속말검사, 8차 예방접종 확인 포함) • 신체계측 — 내용: 키, 몸무게(체질량지수), 머리둘레 • 발달평가 — 내용: 3차부터 한국 영유아 발달선별검사(K-DST)로 평가·상담 • 건강교육 — 내용: 안전사고 예방, 영양, 수면, 전자미디어 노출, 대소변 가리기, 취학 전 준비 등 • 구강검진 — 내용: 구강 문진·진찰, 보호자·유아 구강보건교육 4~7차는 건강검진과 구강검진이 같은 차수로 묶여 있지만 받을 수 있는 기간이 서로 달라요. 예를 들어 4차 건강검진은 생후 24개월까지지만 4차 구강검진은 29개월까지라, 두 기간을 각각 달력에 적어 두면 놓치지 않아요. 4단계. 비용과 검진 기관 확인하기 본인부담은 없어요. 건강보험 가입자는 공단이 전액 부담하고, 의료급여수급권자는 국가와 지자체가 부담해요. 검진은 전국의 영유아 검진기관에서 받을 수 있어요. [사진 2] https://senti-1000ma.github.io/blog-drafts/img/040/040_2_card.png 5단계. 결과는 검진 기관에서 받기 검진 결과는 검진이 끝난 뒤 검진 기관이 보호자에게 직접 알려줘요. 결과 내용에 대한 해석이나 이후 진료가 필요한지는 검진한 의료진과 상담하세요. 한눈에 정리 - 생후 14일~71개월, 건강검진 8회 + 구강검진 4회 - 차수마다 검진유효기간이 정해져 있음(1차는 생후 14~35일) - 검진표는 직장가입자·세대주에게 전자문서로, 미열람 시 우편 - 본인부담 없음, 전국 영유아 검진기관에서 가능 기간과 항목은 바뀔 수 있으니 검진 전 국민건강보험공단 누리집이나 고객센터(1577-1000)에서 다시 확인해 주세요. 네이버"}, {"id": "039", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "039_naeil-learning-card.md", "title": "국민내일배움카드 '누구나 발급'인 줄 알았는데? 제외 대상과 5년 300만 원 한도 정리 (2026년)", "cands": ["국민내일배움카드 '누구나 발급'인 줄 알았는데? 제외 대상과 5년 300만 원 한도 정리 (2026년)", "내일배움카드 300만 원 다 쓰면 끝? 200만 원 추가 지원 대상 확인하기", "내일배움카드 훈련비 vs 훈련장려금, 무엇이 다를까"], "cat": "고용·노동", "kw": ["국민내일배움카드", "직업훈련", "고용24", "훈련비 지원", "훈련장려금"], "summary": "고용24 제도 안내 기준으로 국민내일배움카드의 발급 제외 대상, 5년 300만 원 기본 한도와 200만 원 추가 지원, 훈련비 자부담과 훈련장려금 차이, 신청 순서와 주의사항을 비교 정리", "status": "초안", "created": "2026-10-05 15:06", "base": "2026-10-05", "need": 0, "chars": 1941, "chars_ns": 1477, "imgs": 3, "slots": 2, "filled": 2, "thumb": "img/039/039_0_thumb.png", "seHtml": "<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/039/039_0_thumb.png\" alt=\"대표 이미지\" width=\"720\"><\/p>\n<p>\"내일배움카드는 아무나 다 만들 수 있다\"는 말을 자주 듣는데, 정확히는 <b>원칙은 누구나, 다만 제외 대상이 따로 있다<\/b>가 맞아요. 고용24 제도 안내(최종 수정 2026년 7월 27일)를 기준으로 발급이 안 되는 경우, 한도, 그리고 많이 헷갈리는 '훈련비'와 '훈련장려금'을 나란히 비교했어요. (확인 기준일 2026년 10월 5일)<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>이런 경우는 발급이 안 돼요<\/b><\/span><\/p>\n<p>고용24는 업무 능력을 키우려는 사람이면 누구나 발급받을 수 있다고 하면서도, 아래와 같은 제외 대상을 두고 있어요(주요 항목만 추림).<\/p>\n<ul><li>공무원, 사립학교 교직원, 75세 이상<\/li><li>대규모 기업 근로자 중 월 임금 300만 원 이상이면서 만 45세 미만<\/li><li>월 소득 500만 원 이상 특수형태근로종사자<\/li><li>사업 기간 1년 미만이거나 연 매출 4억 원 이상인 자영업자<\/li><li>졸업까지 남은 수업 연한이 2년 이상인 대학·대학원생, 고등학교 1~2학년생<\/li><li>생계급여 수급자(조건부 수급자·조건부과 유예자는 가능)<\/li><li>다른 부처나 지자체에서 훈련비를 지원받고 있는 사람, 지원 제한 기간 중인 부정수급자 등<\/li><\/ul>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한도 비교: 기본 300만 원 vs 추가 200만 원<\/b><\/span><\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>구분<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>기본 지원<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>추가 지원<\/b><\/td><\/tr><tr><td>금액<\/td><td>300만 원<\/td><td>200만 원(유효기간 안 1회)<\/td><\/tr><tr><td>조건<\/td><td>발급 대상이면 누구나<\/td><td>300만 원을 모두 쓴 뒤, 기간제·파견·단시간·일용근로자로 재직 중인 피보험자, 기초생활수급자·차상위계층, 장애인, 한부모가족, 자립준비청년 등에 해당<\/td><\/tr><tr><td>신청<\/td><td>고용24 또는 고용센터<\/td><td>대상 증빙 서류를 갖춰 고용센터 방문<\/td><\/tr><tr><td>총한도<\/td><td>최대 500만 원을 넘을 수 없음<\/td><td><\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/039/039_1_card.png\" alt=\"기본 300만 원 vs 추가 200만 원\" width=\"720\"><\/p>\n<p>카드 유효기간은 <b>5년<\/b>이고, 5년이 지나면 남은 잔액은 모두 사라져요. 이후에도 훈련이 필요하면 카드를 새로 발급받아야 해요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>훈련비 vs 훈련장려금<\/b><\/span><\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>구분<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>훈련비(수강료)<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>훈련장려금<\/b><\/td><\/tr><tr><td>성격<\/td><td>카드 한도에서 결제하는 수강료 지원<\/td><td>훈련 기간에 매달 받는 돈<\/td><\/tr><tr><td>본인 부담<\/td><td>직종 평균 취업률, 근로장려금 수급 여부 등에 따라 정부 승인 훈련비의 0~55%<\/td><td>없음(별도 신청 없이 등록 계좌로 지급)<\/td><\/tr><tr><td>조건<\/td><td>카드 발급 후 훈련과정 수강<\/td><td>실업 상태이거나 15시간 미만 근로하는 고용보험 피보험자 등이 140시간 이상 훈련을 받을 때, 출석률 80% 이상<\/td><\/tr><tr><td>금액<\/td><td>과정마다 다름<\/td><td>하루 훈련 5시간 미만 일 2,500원(월 최대 5만 원), 5시간 이상 일 5,800원(월 최대 11만 6천 원)<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p>실업급여를 받는 중이면 훈련장려금이 지급되지 않을 수 있어요. 자영업자인 피보험자는 월 최대 36만 원 기준이 따로 안내돼 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>신청 순서<\/b><\/span><\/p>\n<ol><li>(실업 상태라면) 고용24에 구직 신청 — 재직자·자영업자는 원칙적으로 필요 없음<\/li><li>고용24 온라인 또는 관할 고용센터에서 카드 발급 신청<\/li><li>심사 후 우편이나 은행 방문으로 실물 카드 수령<\/li><li>고용24에서 과정 검색·수강 신청(140시간 이상 과정은 훈련 진단·상담 먼저)<\/li><li>수강 종료 후 30일 안에 만족도 조사 — 안 하면 마지막 달 훈련장려금이 지급되지 않아요<\/li><\/ol>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/039/039_2_card.png\" alt=\"국민내일배움카드 한눈에 정리\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>꼭 알아둘 주의점<\/b><\/span><\/p>\n<p>불가피한 사정 없이 중도에 그만두면 횟수에 따라 한도가 20만 원(1회)·50만 원(2회)·100만 원(3회) 차감돼요. 거짓으로 지원을 받으면 지급이 중지되고, 받은 지원금의 최대 5배를 반환해야 해요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>원칙은 누구나, 하지만 공무원·75세 이상·월 임금 300만 원 이상인 45세 미만 대기업 근로자 등은 제외<\/li><li>5년간 기본 300만 원, 요건이 되면 200만 원 추가(총 500만 원 이내)<\/li><li>수강료 자부담 0~55%, 장려금은 별도 조건<\/li><li>중도 포기·부정수급은 불이익<\/li><\/ul>\n<p>세부 기준은 바뀔 수 있으니 신청 전 고용24 제도 안내와 고용노동부 고객상담센터(1350)에서 다시 확인해 주세요.<\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/039/039_0_thumb.png\n\n\"내일배움카드는 아무나 다 만들 수 있다\"는 말을 자주 듣는데, 정확히는 원칙은 누구나, 다만 제외 대상이 따로 있다가 맞아요. 고용24 제도 안내(최종 수정 2026년 7월 27일)를 기준으로 발급이 안 되는 경우, 한도, 그리고 많이 헷갈리는 '훈련비'와 '훈련장려금'을 나란히 비교했어요. (확인 기준일 2026년 10월 5일)\n\n이런 경우는 발급이 안 돼요\n\n고용24는 업무 능력을 키우려는 사람이면 누구나 발급받을 수 있다고 하면서도, 아래와 같은 제외 대상을 두고 있어요(주요 항목만 추림).\n\n- 공무원, 사립학교 교직원, 75세 이상\n- 대규모 기업 근로자 중 월 임금 300만 원 이상이면서 만 45세 미만\n- 월 소득 500만 원 이상 특수형태근로종사자\n- 사업 기간 1년 미만이거나 연 매출 4억 원 이상인 자영업자\n- 졸업까지 남은 수업 연한이 2년 이상인 대학·대학원생, 고등학교 1~2학년생\n- 생계급여 수급자(조건부 수급자·조건부과 유예자는 가능)\n- 다른 부처나 지자체에서 훈련비를 지원받고 있는 사람, 지원 제한 기간 중인 부정수급자 등\n\n한도 비교: 기본 300만 원 vs 추가 200만 원\n\n• 금액 — 기본 지원: 300만 원 / 추가 지원: 200만 원(유효기간 안 1회)\n• 조건 — 기본 지원: 발급 대상이면 누구나 / 추가 지원: 300만 원을 모두 쓴 뒤, 기간제·파견·단시간·일용근로자로 재직 중인 피보험자, 기초생활수급자·차상위계층, 장애인, 한부모가족, 자립준비청년 등에 해당\n• 신청 — 기본 지원: 고용24 또는 고용센터 / 추가 지원: 대상 증빙 서류를 갖춰 고용센터 방문\n• 총한도 — 기본 지원: 최대 500만 원을 넘을 수 없음 / 추가 지원: \n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/039/039_1_card.png\n\n카드 유효기간은 5년이고, 5년이 지나면 남은 잔액은 모두 사라져요. 이후에도 훈련이 필요하면 카드를 새로 발급받아야 해요.\n\n훈련비 vs 훈련장려금\n\n• 성격 — 훈련비(수강료): 카드 한도에서 결제하는 수강료 지원 / 훈련장려금: 훈련 기간에 매달 받는 돈\n• 본인 부담 — 훈련비(수강료): 직종 평균 취업률, 근로장려금 수급 여부 등에 따라 정부 승인 훈련비의 0~55% / 훈련장려금: 없음(별도 신청 없이 등록 계좌로 지급)\n• 조건 — 훈련비(수강료): 카드 발급 후 훈련과정 수강 / 훈련장려금: 실업 상태이거나 15시간 미만 근로하는 고용보험 피보험자 등이 140시간 이상 훈련을 받을 때, 출석률 80% 이상\n• 금액 — 훈련비(수강료): 과정마다 다름 / 훈련장려금: 하루 훈련 5시간 미만 일 2,500원(월 최대 5만 원), 5시간 이상 일 5,800원(월 최대 11만 6천 원)\n\n실업급여를 받는 중이면 훈련장려금이 지급되지 않을 수 있어요. 자영업자인 피보험자는 월 최대 36만 원 기준이 따로 안내돼 있어요.\n\n신청 순서\n\n1. (실업 상태라면) 고용24에 구직 신청 — 재직자·자영업자는 원칙적으로 필요 없음\n2. 고용24 온라인 또는 관할 고용센터에서 카드 발급 신청\n3. 심사 후 우편이나 은행 방문으로 실물 카드 수령\n4. 고용24에서 과정 검색·수강 신청(140시간 이상 과정은 훈련 진단·상담 먼저)\n5. 수강 종료 후 30일 안에 만족도 조사 — 안 하면 마지막 달 훈련장려금이 지급되지 않아요\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/039/039_2_card.png\n\n꼭 알아둘 주의점\n\n불가피한 사정 없이 중도에 그만두면 횟수에 따라 한도가 20만 원(1회)·50만 원(2회)·100만 원(3회) 차감돼요. 거짓으로 지원을 받으면 지급이 중지되고, 받은 지원금의 최대 5배를 반환해야 해요.\n\n한눈에 정리\n\n- 원칙은 누구나, 하지만 공무원·75세 이상·월 임금 300만 원 이상인 45세 미만 대기업 근로자 등은 제외\n- 5년간 기본 300만 원, 요건이 되면 200만 원 추가(총 500만 원 이내)\n- 수강료 자부담 0~55%, 장려금은 별도 조건\n- 중도 포기·부정수급은 불이익\n\n세부 기준은 바뀔 수 있으니 신청 전 고용24 제도 안내와 고용노동부 고객상담센터(1350)에서 다시 확인해 주세요.", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/039/039_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/039/039_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "039_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/039/039_1_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/039/039_1_card.png", "cap": "", "alt": "기본 300만 원 vs 추가 200만 원", "name": "039_1_card.png", "w": 1080, "h": 1144}, {"n": 2, "label": "사진 2", "uri": "img/039/039_2_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/039/039_2_card.png", "cap": "", "alt": "국민내일배움카드 한눈에 정리", "name": "039_2_card.png", "w": 1080, "h": 936}], "zip": "img/039/039_images.zip", "html": "<figure class=\"ph thumbfig\" data-n=\"0\"><img src=\"img/039/039_0_thumb.png\" alt=\"대표 이미지\"><\/figure>\n<p>\"내일배움카드는 아무나 다 만들 수 있다\"는 말을 자주 듣는데, 정확히는 <strong>원칙은 누구나, 다만 제외 대상이 따로 있다<\/strong>가 맞아요. 고용24 제도 안내(최종 수정 2026년 7월 27일)를 기준으로 발급이 안 되는 경우, 한도, 그리고 많이 헷갈리는 '훈련비'와 '훈련장려금'을 나란히 비교했어요. (확인 기준일 2026년 10월 5일)<\/p>\n<h3>이런 경우는 발급이 안 돼요<\/h3>\n<p>고용24는 업무 능력을 키우려는 사람이면 누구나 발급받을 수 있다고 하면서도, 아래와 같은 제외 대상을 두고 있어요(주요 항목만 추림).<\/p>\n<ul><li>공무원, 사립학교 교직원, 75세 이상<\/li><li>대규모 기업 근로자 중 월 임금 300만 원 이상이면서 만 45세 미만<\/li><li>월 소득 500만 원 이상 특수형태근로종사자<\/li><li>사업 기간 1년 미만이거나 연 매출 4억 원 이상인 자영업자<\/li><li>졸업까지 남은 수업 연한이 2년 이상인 대학·대학원생, 고등학교 1~2학년생<\/li><li>생계급여 수급자(조건부 수급자·조건부과 유예자는 가능)<\/li><li>다른 부처나 지자체에서 훈련비를 지원받고 있는 사람, 지원 제한 기간 중인 부정수급자 등<\/li><\/ul>\n<h3>한도 비교: 기본 300만 원 vs 추가 200만 원<\/h3>\n<div class=\"tw\"><table><thead><tr><th>구분<\/th><th>기본 지원<\/th><th>추가 지원<\/th><\/tr><\/thead><tbody><tr><td>금액<\/td><td>300만 원<\/td><td>200만 원(유효기간 안 1회)<\/td><\/tr><tr><td>조건<\/td><td>발급 대상이면 누구나<\/td><td>300만 원을 모두 쓴 뒤, 기간제·파견·단시간·일용근로자로 재직 중인 피보험자, 기초생활수급자·차상위계층, 장애인, 한부모가족, 자립준비청년 등에 해당<\/td><\/tr><tr><td>신청<\/td><td>고용24 또는 고용센터<\/td><td>대상 증빙 서류를 갖춰 고용센터 방문<\/td><\/tr><tr><td>총한도<\/td><td>최대 500만 원을 넘을 수 없음<\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n<figure class=\"ph\" data-n=\"1\"><img loading=\"lazy\" src=\"img/039/039_1_card.png\" alt=\"기본 300만 원 vs 추가 200만 원\"><\/figure>\n<p>카드 유효기간은 <strong>5년<\/strong>이고, 5년이 지나면 남은 잔액은 모두 사라져요. 이후에도 훈련이 필요하면 카드를 새로 발급받아야 해요.<\/p>\n<h3>훈련비 vs 훈련장려금<\/h3>\n<div class=\"tw\"><table><thead><tr><th>구분<\/th><th>훈련비(수강료)<\/th><th>훈련장려금<\/th><\/tr><\/thead><tbody><tr><td>성격<\/td><td>카드 한도에서 결제하는 수강료 지원<\/td><td>훈련 기간에 매달 받는 돈<\/td><\/tr><tr><td>본인 부담<\/td><td>직종 평균 취업률, 근로장려금 수급 여부 등에 따라 정부 승인 훈련비의 0~55%<\/td><td>없음(별도 신청 없이 등록 계좌로 지급)<\/td><\/tr><tr><td>조건<\/td><td>카드 발급 후 훈련과정 수강<\/td><td>실업 상태이거나 15시간 미만 근로하는 고용보험 피보험자 등이 140시간 이상 훈련을 받을 때, 출석률 80% 이상<\/td><\/tr><tr><td>금액<\/td><td>과정마다 다름<\/td><td>하루 훈련 5시간 미만 일 2,500원(월 최대 5만 원), 5시간 이상 일 5,800원(월 최대 11만 6천 원)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>실업급여를 받는 중이면 훈련장려금이 지급되지 않을 수 있어요. 자영업자인 피보험자는 월 최대 36만 원 기준이 따로 안내돼 있어요.<\/p>\n<h3>신청 순서<\/h3>\n<ol><li>(실업 상태라면) 고용24에 구직 신청 — 재직자·자영업자는 원칙적으로 필요 없음<\/li><li>고용24 온라인 또는 관할 고용센터에서 카드 발급 신청<\/li><li>심사 후 우편이나 은행 방문으로 실물 카드 수령<\/li><li>고용24에서 과정 검색·수강 신청(140시간 이상 과정은 훈련 진단·상담 먼저)<\/li><li>수강 종료 후 30일 안에 만족도 조사 — 안 하면 마지막 달 훈련장려금이 지급되지 않아요<\/li><\/ol>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/039/039_2_card.png\" alt=\"국민내일배움카드 한눈에 정리\"><\/figure>\n<h3>꼭 알아둘 주의점<\/h3>\n<p>불가피한 사정 없이 중도에 그만두면 횟수에 따라 한도가 20만 원(1회)·50만 원(2회)·100만 원(3회) 차감돼요. 거짓으로 지원을 받으면 지급이 중지되고, 받은 지원금의 최대 5배를 반환해야 해요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>원칙은 누구나, 하지만 공무원·75세 이상·월 임금 300만 원 이상인 45세 미만 대기업 근로자 등은 제외<\/li><li>5년간 기본 300만 원, 요건이 되면 200만 원 추가(총 500만 원 이내)<\/li><li>수강료 자부담 0~55%, 장려금은 별도 조건<\/li><li>중도 포기·부정수급은 불이익<\/li><\/ul>\n<p>세부 기준은 바뀔 수 있으니 신청 전 고용24 제도 안내와 고용노동부 고객상담센터(1350)에서 다시 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 자체 제작 카드 · 사진 2 자체 제작 카드 — 파일 images/posts/039/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>한도 비교 아래<\/td><td>직접 만든 비교 카드(300만 + 200만 = 최대 500만, 5년)<\/td><td>카드 실물 사진은 카드번호·이름이 보이지 않게, 가능하면 사용하지 않기<\/td><\/tr><tr><td>신청 순서<\/td><td>단계 텍스트 카드<\/td><td>고용24 로그인·개인정보 화면 캡처 금지<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 제외 대상(월 300만 원·45세 미만 대기업 근로자, 연 매출 4억 원 자영업자 등)을 고용24 '국민내일배움카드' 제도 안내에서 재확인<\/li><li class=\"cb\">☐ 자부담 0~55%, 훈련장려금 금액(일 2,500원/5,800원, 월 5만/11만 6천 원, 자영업자 36만 원)이 게시 시점과 같은지 확인<\/li><li class=\"cb\">☐ 200만 원 추가 지원 대상 목록이 바뀌었는지 확인<\/li><li class=\"cb\">☐ (선택) 특정 훈련기관·과정 이름은 광고로 보일 수 있으니 넣지 않기<\/li><li class=\"cb\">☐ 수강 경험담은 실제 있었던 경우에만 추가<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>5년간 30 대상이면 누구나 / 추가 지원: 300만 원을 모두 쓴 뒤, 기간제·파견·단시간·일용근로자로 재직 중인 피보험자, 기초생활수급자·차상위계층, 장애인, 한부모가족, 자립준비청년 등에 해당\n• 신청 — 기본 지원: 고용24 또는 고용센터 / 추가 지원: 대상 증빙 서류를 갖춰 고용센터 방문\n• 총한도 — 기본 지원: 최대 500만 원을 넘을 수 없음 / 추가 지원: \n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/039/039_1_card.png\n\n카드 유효기간은 5년이고, 5년이 지나면 남은 잔액은 모두 사라져요. 이후에도 훈련이 필요하면 카드를 새로 발급받아야 해요.\n\n훈련비 vs 훈련장려금\n\n• 성격 — 훈련비(수강료): 카드 한도에서 결제하는 수강료 지원 / 훈련장려금: 훈련 기간에 매달 받는 돈\n• 본인 부담 — 훈련비(수강료): 직종 평균 취업률, 근로장려금 수급 여부 등에 따라 정부 승인 훈련비의 0~55% / 훈련장려금: 없음(별도 신청 없이 등록 계좌로 지급)\n• 조건 — 훈련비(수강료): 카드 발급 후 훈련과정 수강 / 훈련장려금: 실업 상태이거나 15시간 미만 근로하는 고용보험 피보험자 등이 140시간 이상 훈련을 받을 때, 출석률 80% 이상\n• 금액 — 훈련비(수강료): 과정마다 다름 / 훈련장려금: 하루 훈련 5시간 미만 일 2,500원(월 최대 5만 원), 5시간 이상 일 5,800원(월 최대 11만 6천 원)\n\n실업급여를 받는 중이면 훈련장려금이 지급되지 않을 수 있어요. 자영업자인 피보험자는 월 최대 36만 원 기준이 따로 안내돼 있어요.\n\n신청 순서\n\n1. (실업 상태라면) 고용24에 구직 신청 — 재직자·자영업자는 원칙적으로 필요 없음\n2. 고용24 온라인 또는 관할 고용센터에서 카드 발급 신청\n3. 심사 후 우편이나 은행 방문으로 실물 카드 수령\n4. 고용24에서 과정 검색·수강 신청(140시간 이상 과정은 훈련 진단·상담 먼저)\n5. 수강 종료 후 30일 안에 만족도 조사 — 안 하면 마지막 달 훈련장려금이 지급되지 않아요\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/039/039_2_card.png\n\n꼭 알아둘 주의점\n\n불가피한 사정 없이 중도에 그만두면 횟수에 따라 한도가 20만 원(1회)·50만 원(2회)·100만 원(3회) 차감돼요. 거짓으로 지원을 받으면 지급이 중지되고, 받은 지원금의 최대 5배를 반환해야 해요.\n\n한눈에 정리\n\n- 원칙은 누구나, 하지만 공무원·75세 이상·월 임금 300만 원 이상인 45세 미만 대기업 근로자 등은 제외\n- 5년간 기본 300만 원, 요건이 되면 200만 원 추가(총 500만 원 이내)\n- 수강료 자부담 0~55%, 장려금은 별도 조건\n- 중도 포기·부정수급은 불이익\n\n세부 기준은 바뀔 수 있으니 신청 전 고용24 제도 안내와 고용노동부 고객상담센터(1350)에서 다시 확인해 주세요.", "copyAll": "\"내일배움카드는 아무나 다 만들 수 있다\"는 말을 자주 듣는데, 정확히는 원칙은 누구나, 다만 제외 대상이 따로 있다가 맞아요. 고용24 제도 안내(최종 수정 2026년 7월 27일)를 기준으로 발급이 안 되는 경우, 한도, 그리고 많이 헷갈리는 '훈련비'와 '훈련장려금'을 나란히 비교했어요. (확인 기준일 2026년 10월 5일)\n\n이런 경우는 발급이 안 돼요\n\n고용24는 업무 능력을 키우려는 사람이면 누구나 발급받을 수 있다고 하면서도, 아래와 같은 제외 대상을 두고 있어요(주요 항목만 추림).\n\n- 공무원, 사립학교 교직원, 75세 이상\n- 대규모 기업 근로자 중 월 임금 300만 원 이상이면서 만 45세 미만\n- 월 소득 500만 원 이상 특수형태근로종사자\n- 사업 기간 1년 미만이거나 연 매출 4억 원 이상인 자영업자\n- 졸업까지 남은 수업 연한이 2년 이상인 대학·대학원생, 고등학교 1~2학년생\n- 생계급여 수급자(조건부 수급 으로 발급이 안 되는 경우, 한도, 그리고 많이 헷갈리는 '훈련비'와 '훈련장려금'을 나란히 비교했어요. (확인 기준일 2026년 10월 5일) 이런 경우는 발급이 안 돼요 고용24는 업무 능력을 키우려는 사람이면 누구나 발급받을 수 있다고 하면서도, 아래와 같은 제외 대상을 두고 있어요(주요 항목만 추림). - 공무원, 사립학교 교직원, 75세 이상 - 대규모 기업 근로자 중 월 임금 300만 원 이상이면서 만 45세 미만 - 월 소득 500만 원 이상 특수형태근로종사자 - 사업 기간 1년 미만이거나 연 매출 4억 원 이상인 자영업자 - 졸업까지 남은 수업 연한이 2년 이상인 대학·대학원생, 고등학교 1~2학년생 - 생계급여 수급자(조건부 수급자·조건부과 유예자는 가능) - 다른 부처나 지자체에서 훈련비를 지원받고 있는 사람, 지원 제한 기간 중인 부정수급자 등 한도 비교: 기본 300만 원 vs 추가 200만 원 • 금액 — 기본 지원: 300만 원 / 추가 지원: 200만 원(유효기간 안 1회) • 조건 — 기본 지원: 발급 대상이면 누구나 / 추가 지원: 300만 원을 모두 쓴 뒤, 기간제·파견·단시간·일용근로자로 재직 중인 피보험자, 기초생활수급자·차상위계층, 장애인, 한부모가족, 자립준비청년 등에 해당 • 신청 — 기본 지원: 고용24 또는 고용센터 / 추가 지원: 대상 증빙 서류를 갖춰 고용센터 방문 • 총한도 — 기본 지원: 최대 500만 원을 넘을 수 없음 / 추가 지원: [사진 1] https://senti-1000ma.github.io/blog-drafts/img/039/039_1_card.png 카드 유효기간은 5년이고, 5년이 지나면 남은 잔액은 모두 사라져요. 이후에도 훈련이 필요하면 카드를 새로 발급받아야 해요. 훈련비 vs 훈련장려금 • 성격 — 훈련비(수강료): 카드 한도에서 결제하는 수강료 지원 / 훈련장려금: 훈련 기간에 매달 받는 돈 • 본인 부담 — 훈련비(수강료): 직종 평균 취업률, 근로장려금 수급 여부 등에 따라 정부 승인 훈련비의 0~55% / 훈련장려금: 없음(별도 신청 없이 등록 계좌로 지급) • 조건 — 훈련비(수강료): 카드 발급 후 훈련과정 수강 / 훈련장려금: 실업 상태이거나 15시간 미만 근로하는 고용보험 피보험자 등이 140시간 이상 훈련을 받을 때, 출석률 80% 이상 • 금액 — 훈련비(수강료): 과정마다 다름 / 훈련장려금: 하루 훈련 5시간 미만 일 2,500원(월 최대 5만 원), 5시간 이상 일 5,800원(월 최대 11만 6천 원) 실업급여를 받는 중이면 훈련장려금이 지급되지 않을 수 있어요. 자영업자인 피보험자는 월 최대 36만 원 기준이 따로 안내돼 있어요. 신청 순서 1. (실업 상태라면) 고용24에 구직 신청 — 재직자·자영업자는 원칙적으로 필요 없음 2. 고용24 온라인 또는 관할 고용센터에서 카드 발급 신청 3. 심사 후 우편이나 은행 방문으로 실물 카드 수령 4. 고용24에서 과정 검색·수강 신청(140시간 이상 과정은 훈련 진단·상담 먼저) 5. 수강 종료 후 30일 안에 만족도 조사 — 안 하면 마지막 달 훈련장려금이 지급되지 않아요 [사진 2] https://senti-1000ma.github.io/blog-drafts/img/039/039_2_card.png 꼭 알아둘 주의점 불가피한 사정 없이 중도에 그만두면 횟수에 따라 한도가 20만 원(1회)·50만 원(2회)·100만 원(3회) 차감돼요. 거짓으로 지원을 받으면 지급이 중지되고, 받은 지원금의 최대 5배를 반환해야 해요. 한눈에 정리 - 원칙은 누구나, 하지만 공무원·75세 이상·월 임금 300만 원 이상인 45세 미만 대기업 근로자 등은 제외 - 5년간 기본 300만 원, 요건이 되면 200만 원 추가(총 500만 원 이내) - 수강료 자부담 0~55%, 장려금은 별도 조건 - 중도 포기·부정수급은 불이익 세부 기준은 바뀔 수 있으니 신청 전 고용24 제도 안내와 고용노동부 고객상담센터(1350)에서 다시 확인해 주세요. 네이버"}, {"id": "038", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "038_first-meeting-voucher.md", "title": "아이 태어나면 확인할 첫만남이용권 4가지: 금액·신청 기한·사용처·잔액 조회 (2026년)", "cands": ["아이 태어나면 확인할 첫만남이용권 4가지: 금액·신청 기한·사용처·잔액 조회 (2026년)", "첫만남이용권 첫째 200만 원·둘째 300만 원, 신청은 언제까지?", "첫만남이용권 잔액이 앱마다 다르게 보일 때, 어디 기준으로 봐야 할까"], "cat": "육아·가족", "kw": ["첫만남이용권", "국민행복카드", "출생 바우처", "사용기한", "잔액 조회"], "summary": "출생아에게 국민행복카드 바우처로 주는 첫만남이용권의 금액(첫째 200만·둘째 이상 300만 원), 신청 대상 기간, 사용기한 2년 연장, 사용처 제한, 잔액 조회 방법을 국민행복카드·보건복지부 자료로 정리", "status": "초안", "created": "2026-10-05 15:05", "base": "2026-10-05", "need": 0, "chars": 1644, "chars_ns": 1292, "imgs": 3, "slots": 2, "filled": 2, "thumb": "img/038/038_0_thumb.png", "seHtml": "<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/038/038_0_thumb.png\" alt=\"대표 이미지\" width=\"720\"><\/p>\n<p>핵심부터 말하면, 첫만남이용권은 출생신고를 마친 아기에게 국민행복카드 바우처로 주는 지원이고 금액은 <b>첫째 200만 원, 둘째 이상 300만 원<\/b>이에요(2024년 1월 1일 이후 출생아 기준). 출생 직후 정신없는 시기라 놓치기 쉬운 네 가지를 순서대로 확인해 보세요. (2026년 10월 5일 기준, 국민행복카드·보건복지부 안내)<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/038/038_1_card.png\" alt=\"첫만남이용권 한눈에 정리\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>확인 1. 우리 아이가 대상인지<\/b><\/span><\/p>\n<p>국민행복카드 안내에 따르면 대상은 출생신고가 되어 정상적으로 주민등록번호를 받은 아동이에요. 단, <b>주민등록상 생년월일로부터 1년이 지나지 않은<\/b> 출생아여야 해요. 신청을 미루다 돌잔치 무렵이 되면 대상에서 벗어날 수 있다는 뜻이니, 출생신고와 함께 챙기는 편이 안전해요.<\/p>\n<p>금액은 원래 출생 순서와 상관없이 200만 원이었는데, 2024년 1월 1일 이후 태어난 아동부터 둘째 이상은 300만 원으로 올랐어요. 보건복지부는 이 내용을 담은 「저출산·고령사회기본법 시행령」 개정안이 2024년 3월 19일 국무회의에서 의결됐다고 밝혔어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>확인 2. 어디서 신청하는지<\/b><\/span><\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>방법<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>안내 내용<\/b><\/td><\/tr><tr><td>방문<\/td><td>보호자나 대리인이 아동의 주민등록상 주소지 읍·면·동 행정복지센터에 신청<\/td><\/tr><tr><td>온라인<\/td><td>온라인 신청 가능(국민행복카드 안내), 정부24에도 '첫만남이용권 지원' 서비스 안내가 있음<\/td><\/tr><tr><td>우편·팩스<\/td><td>여성 수용자가 교정시설에서 아동을 양육하는 경우에만 가능<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/038/038_2_card.png\" alt=\"첫만남이용권 신청 방법\" width=\"720\"><\/p>\n<p>신청 뒤에는 국민행복카드를 발급받아, 정부지원금으로 결제할 수 있는 유통점에서 지원금으로 살 수 있는 물품을 자유롭게 구매하는 방식이에요. 이미 다른 바우처용 국민행복카드가 있는 집이라면, 어느 카드로 첫만남이용권이 들어오는지 신청할 때 함께 확인해 두면 헷갈리지 않아요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>확인 3. 언제까지, 어디에 쓸 수 있는지<\/b><\/span><\/p>\n<p>같은 2024년 3월 시행령 개정으로 첫만남이용권 <b>사용기한이 1년에서 2년으로<\/b> 늘었어요(보건복지부 보도자료, 공포 즉시 시행). 아이별 정확한 사용종료일은 카드사나 사회서비스 전자바우처에서 확인하는 것이 가장 정확해요.<\/p>\n<p>쓸 수 있는 곳은 꽤 넓어요. 유흥·사행업종처럼 지급 목적에서 벗어난 업종을 빼면 온라인 구매를 포함한 전 업종에서 사용할 수 있다고 안내돼 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>확인 4. 잔액은 어디서 보는지<\/b><\/span><\/p>\n<p>잔액은 사회서비스 전자바우처나 카드사 홈페이지·앱·문자·알림톡·상담센터에서 확인할 수 있어요. 다만 국민행복카드 안내는 <b>전자바우처에 보이는 잔액은 실시간이 아니므로<\/b>, 정확한 잔액과 이용 내역은 카드사에서 확인하라고 해요. 두 곳 숫자가 다르게 보이면 카드사 쪽을 기준으로 보면 돼요.<\/p>\n<p>사용종료 1개월 전에는 미사용 금액이 많은 보호자에게 한국사회보장정보원(1566-3232)이 문자와 전화로 안내한다고 해요. 모르는 번호라고 넘기지 말고 내용을 확인해 보세요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>금액: 첫째 200만 원, 둘째 이상 300만 원(2024년 이후 출생아)<\/li><li>대상: 출생신고 후 생년월일로부터 1년 이내 출생아<\/li><li>사용기한: 2024년 3월 개정으로 1년 → 2년<\/li><li>사용처: 유흥·사행업종 등 제외 전 업종, 온라인 포함<\/li><li>잔액: 카드사 기준이 가장 정확<\/li><\/ul>\n<p>지원 내용은 바뀔 수 있으니 신청 전 국민행복카드 누리집과 보건복지상담센터(129) 안내를 다시 확인해 주세요.<\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/038/038_0_thumb.png\n\n핵심부터 말하면, 첫만남이용권은 출생신고를 마친 아기에게 국민행복카드 바우처로 주는 지원이고 금액은 첫째 200만 원, 둘째 이상 300만 원이에요(2024년 1월 1일 이후 출생아 기준). 출생 직후 정신없는 시기라 놓치기 쉬운 네 가지를 순서대로 확인해 보세요. (2026년 10월 5일 기준, 국민행복카드·보건복지부 안내)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/038/038_1_card.png\n\n확인 1. 우리 아이가 대상인지\n\n국민행복카드 안내에 따르면 대상은 출생신고가 되어 정상적으로 주민등록번호를 받은 아동이에요. 단, 주민등록상 생년월일로부터 1년이 지나지 않은 출생아여야 해요. 신청을 미루다 돌잔치 무렵이 되면 대상에서 벗어날 수 있다는 뜻이니, 출생신고와 함께 챙기는 편이 안전해요.\n\n금액은 원래 출생 순서와 상관없이 200만 원이었는데, 2024년 1월 1일 이후 태어난 아동부터 둘째 이상은 300만 원으로 올랐어요. 보건복지부는 이 내용을 담은 「저출산·고령사회기본법 시행령」 개정안이 2024년 3월 19일 국무회의에서 의결됐다고 밝혔어요.\n\n확인 2. 어디서 신청하는지\n\n• 방문 — 안내 내용: 보호자나 대리인이 아동의 주민등록상 주소지 읍·면·동 행정복지센터에 신청\n• 온라인 — 안내 내용: 온라인 신청 가능(국민행복카드 안내), 정부24에도 '첫만남이용권 지원' 서비스 안내가 있음\n• 우편·팩스 — 안내 내용: 여성 수용자가 교정시설에서 아동을 양육하는 경우에만 가능\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/038/038_2_card.png\n\n신청 뒤에는 국민행복카드를 발급받아, 정부지원금으로 결제할 수 있는 유통점에서 지원금으로 살 수 있는 물품을 자유롭게 구매하는 방식이에요. 이미 다른 바우처용 국민행복카드가 있는 집이라면, 어느 카드로 첫만남이용권이 들어오는지 신청할 때 함께 확인해 두면 헷갈리지 않아요.\n\n확인 3. 언제까지, 어디에 쓸 수 있는지\n\n같은 2024년 3월 시행령 개정으로 첫만남이용권 사용기한이 1년에서 2년으로 늘었어요(보건복지부 보도자료, 공포 즉시 시행). 아이별 정확한 사용종료일은 카드사나 사회서비스 전자바우처에서 확인하는 것이 가장 정확해요.\n\n쓸 수 있는 곳은 꽤 넓어요. 유흥·사행업종처럼 지급 목적에서 벗어난 업종을 빼면 온라인 구매를 포함한 전 업종에서 사용할 수 있다고 안내돼 있어요.\n\n확인 4. 잔액은 어디서 보는지\n\n잔액은 사회서비스 전자바우처나 카드사 홈페이지·앱·문자·알림톡·상담센터에서 확인할 수 있어요. 다만 국민행복카드 안내는 전자바우처에 보이는 잔액은 실시간이 아니므로, 정확한 잔액과 이용 내역은 카드사에서 확인하라고 해요. 두 곳 숫자가 다르게 보이면 카드사 쪽을 기준으로 보면 돼요.\n\n사용종료 1개월 전에는 미사용 금액이 많은 보호자에게 한국사회보장정보원(1566-3232)이 문자와 전화로 안내한다고 해요. 모르는 번호라고 넘기지 말고 내용을 확인해 보세요.\n\n한눈에 정리\n\n- 금액: 첫째 200만 원, 둘째 이상 300만 원(2024년 이후 출생아)\n- 대상: 출생신고 후 생년월일로부터 1년 이내 출생아\n- 사용기한: 2024년 3월 개정으로 1년 → 2년\n- 사용처: 유흥·사행업종 등 제외 전 업종, 온라인 포함\n- 잔액: 카드사 기준이 가장 정확\n\n지원 내용은 바뀔 수 있으니 신청 전 국민행복카드 누리집과 보건복지상담센터(129) 안내를 다시 확인해 주세요.", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/038/038_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/038/038_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "038_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/038/038_1_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/038/038_1_card.png", "cap": "", "alt": "첫만남이용권 한눈에 정리", "name": "038_1_card.png", "w": 1080, "h": 1036}, {"n": 2, "label": "사진 2", "uri": "img/038/038_2_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/038/038_2_card.png", "cap": "", "alt": "첫만남이용권 신청 방법", "name": "038_2_card.png", "w": 1080, "h": 863}], "zip": "img/038/038_images.zip", "html": "<figure class=\"ph thumbfig\" data-n=\"0\"><img src=\"img/038/038_0_thumb.png\" alt=\"대표 이미지\"><\/figure>\n<p>핵심부터 말하면, 첫만남이용권은 출생신고를 마친 아기에게 국민행복카드 바우처로 주는 지원이고 금액은 <strong>첫째 200만 원, 둘째 이상 300만 원<\/strong>이에요(2024년 1월 1일 이후 출생아 기준). 출생 직후 정신없는 시기라 놓치기 쉬운 네 가지를 순서대로 확인해 보세요. (2026년 10월 5일 기준, 국민행복카드·보건복지부 안내)<\/p>\n<figure class=\"ph\" data-n=\"1\"><img loading=\"lazy\" src=\"img/038/038_1_card.png\" alt=\"첫만남이용권 한눈에 정리\"><\/figure>\n<h3>확인 1. 우리 아이가 대상인지<\/h3>\n<p>국민행복카드 안내에 따르면 대상은 출생신고가 되어 정상적으로 주민등록번호를 받은 아동이에요. 단, <strong>주민등록상 생년월일로부터 1년이 지나지 않은<\/strong> 출생아여야 해요. 신청을 미루다 돌잔치 무렵이 되면 대상에서 벗어날 수 있다는 뜻이니, 출생신고와 함께 챙기는 편이 안전해요.<\/p>\n<p>금액은 원래 출생 순서와 상관없이 200만 원이었는데, 2024년 1월 1일 이후 태어난 아동부터 둘째 이상은 300만 원으로 올랐어요. 보건복지부는 이 내용을 담은 「저출산·고령사회기본법 시행령」 개정안이 2024년 3월 19일 국무회의에서 의결됐다고 밝혔어요.<\/p>\n<h3>확인 2. 어디서 신청하는지<\/h3>\n<div class=\"tw\"><table><thead><tr><th>방법<\/th><th>안내 내용<\/th><\/tr><\/thead><tbody><tr><td>방문<\/td><td>보호자나 대리인이 아동의 주민등록상 주소지 읍·면·동 행정복지센터에 신청<\/td><\/tr><tr><td>온라인<\/td><td>온라인 신청 가능(국민행복카드 안내), 정부24에도 '첫만남이용권 지원' 서비스 안내가 있음<\/td><\/tr><tr><td>우편·팩스<\/td><td>여성 수용자가 교정시설에서 아동을 양육하는 경우에만 가능<\/td><\/tr><\/tbody><\/table><\/div>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/038/038_2_card.png\" alt=\"첫만남이용권 신청 방법\"><\/figure>\n<p>신청 뒤에는 국민행복카드를 발급받아, 정부지원금으로 결제할 수 있는 유통점에서 지원금으로 살 수 있는 물품을 자유롭게 구매하는 방식이에요. 이미 다른 바우처용 국민행복카드가 있는 집이라면, 어느 카드로 첫만남이용권이 들어오는지 신청할 때 함께 확인해 두면 헷갈리지 않아요.<\/p>\n<h3>확인 3. 언제까지, 어디에 쓸 수 있는지<\/h3>\n<p>같은 2024년 3월 시행령 개정으로 첫만남이용권 <strong>사용기한이 1년에서 2년으로<\/strong> 늘었어요(보건복지부 보도자료, 공포 즉시 시행). 아이별 정확한 사용종료일은 카드사나 사회서비스 전자바우처에서 확인하는 것이 가장 정확해요.<\/p>\n<p>쓸 수 있는 곳은 꽤 넓어요. 유흥·사행업종처럼 지급 목적에서 벗어난 업종을 빼면 온라인 구매를 포함한 전 업종에서 사용할 수 있다고 안내돼 있어요.<\/p>\n<h3>확인 4. 잔액은 어디서 보는지<\/h3>\n<p>잔액은 사회서비스 전자바우처나 카드사 홈페이지·앱·문자·알림톡·상담센터에서 확인할 수 있어요. 다만 국민행복카드 안내는 <strong>전자바우처에 보이는 잔액은 실시간이 아니므로<\/strong>, 정확한 잔액과 이용 내역은 카드사에서 확인하라고 해요. 두 곳 숫자가 다르게 보이면 카드사 쪽을 기준으로 보면 돼요.<\/p>\n<p>사용종료 1개월 전에는 미사용 금액이 많은 보호자에게 한국사회보장정보원(1566-3232)이 문자와 전화로 안내한다고 해요. 모르는 번호라고 넘기지 말고 내용을 확인해 보세요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>금액: 첫째 200만 원, 둘째 이상 300만 원(2024년 이후 출생아)<\/li><li>대상: 출생신고 후 생년월일로부터 1년 이내 출생아<\/li><li>사용기한: 2024년 3월 개정으로 1년 → 2년<\/li><li>사용처: 유흥·사행업종 등 제외 전 업종, 온라인 포함<\/li><li>잔액: 카드사 기준이 가장 정확<\/li><\/ul>\n<p>지원 내용은 바뀔 수 있으니 신청 전 국민행복카드 누리집과 보건복지상담센터(129) 안내를 다시 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 자체 제작 카드 · 사진 2 자체 제작 카드 — 파일 images/posts/038/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래<\/td><td>직접 만든 요약 카드(200만/300만 원 · 1년 내 대상 · 2년 사용)<\/td><td>아기 얼굴·출생증명서·주민등록번호 노출 사진 금지<\/td><\/tr><tr><td>확인 4<\/td><td>잔액 조회는 텍스트로만 안내<\/td><td>카드번호·앱 계정 화면 캡처 금지<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 금액(200만/300만 원), 대상 기간(생년월일로부터 1년), 사용 범위를 국민행복카드 '첫만남 이용권' 페이지에서 재확인<\/li><li class=\"cb\">☐ 사용기한 1년→2년 연장이 적용되는 출생일 기준을 게시 전 한 번 더 확인(직접 확인했다면 본문에 날짜 기준 추가)<\/li><li class=\"cb\">☐ 온라인 신청 경로(정부24·복지로 메뉴명)는 직접 확인한 경우에만 구체적으로 추가<\/li><li class=\"cb\">☐ 1566-3232·129 번호를 공식 페이지와 대조<\/li><li class=\"cb\">☐ 사용 경험담은 실제 있었던 경우에만, 개인정보 없이<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>대상(출생신고·주민번호, 생년월일로부터 1년 이내), 200만 원 이상·2024.1.1. 이후 첫째 200만/둘째 이상 300만 원, 사용 범위(유흥·사행 제외, 온라인 포함), 방문·온라인·우편 신청, 국민행복카드 사용, 잔액 조회처·전자바우처 비실시간, 종료 1개월 전 안내(1566-3232), 129<\/td><td>국민행복카드 '첫만남 이용권 지원' <a href=\"http://www.voucher.go.kr/voucher/firstEncounter.do\" target=\"_blank\" rel=\"noopener noreferrer\">http://www.voucher.go.kr/voucher/firstEncounter.do<\/a><\/td><td>공식<\/td><\/tr><tr><td>2024.3.19. 시행령 개정 의결, 둘째 이상 300만 원, 사용기한 1년→2년, 공포 즉시 시행<\/td><td>보건복지부 보도자료(2024-03-19) <a href=\"https://www.mohw.go.kr/board.es?act=view&amp;bid=0027&amp;list_no=1480691&amp;mid=a10503010100\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.mohw.go.kr/board.es?act=view&amp;bid=0027&amp;list_no=1480691&amp;mid=a10503010100<\/a><\/td><td>공식<\/td><\/tr><tr><td>정부24 '첫만남이용권 지원' 서비스 안내 존재<\/td><td>정부24 <a href=\"https://www.gov.kr/portal/service/serviceInfo/135200005015\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.kr/portal/service/serviceInfo/135200005015<\/a> (검색 요약 확인, 원문 미열람)<\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "핵심부터 말하면, 첫만남이용권은 출생신고를 마친 아기에게 국민행복카드 바우처로 주는 지원이고 금액은 첫째 200만 원, 둘째 이상 300만 원이에요(2024년 1월 1일 이후 출생아 기준). 출생 직후 정신없는 시기라 놓치기 쉬운 네 가지를 순서대로 확인해 보세요. (2026년 10월 5일 기준, 국민행복카드·보건복지부 안내)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/038/038_1_card.png\n\n확인 1. 우리 아이가 대상인지\n\n국민행복카드 안내에 따르면 대상은 출생신고가 되어 정상적으로 주민등록번호를 받은 아동이에요. 단, 주민등록상 생년월일로부터 1년이 지나지 않은 출생아여야 해요. 신청을 미루다 돌잔치 무렵이 되면 대상에서 벗어날 수 있다는 뜻이니, 출생신고와 함께 챙기는 편이 안전해요.\n\n금액은 원래 출생 순서와 상관없이 200만 원이었는데, 2024년 1월 1일 이후 태어난 아동부터 둘째 이상은 300만 원으로 올랐어요. 보건복지부는 이 내용을 담은 「저출산·고령사회기본법 시행령」 개정안이 2024년 3월 19일 국무회의에서 의결됐다고 밝혔어요.\n\n확인 2. 어디서 신청하는지\n\n• 방문 — 안내 내용: 보호자나 대리인이 아동의 주민등록상 주소지 읍·면·동 행정복지센터에 신청\n• 온라인 — 안내 내용: 온라인 신청 가능(국민행복카드 안내), 정부24에도 '첫만남이용권 지원' 서비스 안내가 있음\n• 우편·팩스 — 안내 내용: 여성 수용자가 교정시설에서 아동을 양육하는 경우에만 가능\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/038/038_2_card.png\n\n신청 뒤에는 국민행복카드를 발급받아, 정부지원금으로 결제할 수 있는 유통점에서 지원금으로 살 수 있는 물품을 자유롭게 구매하는 방식이에요. 이미 다른 바우처용 국민행복카드가 있는 집이라면, 어느 카드로 첫만남이용권이 들어오는지 신청할 때 함께 확인해 두면 헷갈리지 않아요.\n\n확인 3. 언제까지, 어디에 쓸 수 있는지\n\n같은 2024년 3월 시행령 개정으로 첫만남이용권 사용기한이 1년에서 2년으로 늘었어요(보건복지부 보도자료, 공포 즉시 시행). 아이별 정확한 사용종료일은 카드사나 사회서비스 전자바우처에서 확인하는 것이 가장 정확해요.\n\n쓸 수 있는 곳은 꽤 넓어요. 유흥·사행업종처럼 지급 목적에서 벗어난 업종을 빼면 온라인 구매를 포함한 전 업종에서 사용할 수 있다고 안내돼 있어요.\n\n확인 4. 잔액은 어디서 보는지\n\n잔액은 사회서비스 전자바우처나 카드사 홈페이지·앱·문자·알림톡·상담센터에서 확인할 수 있어요. 다만 국민행복카드 안내는 전자바우처에 보이는 잔액은 실시간이 아니므로, 정확한 잔액과 이용 내역은 카드사에서 확인하라고 해요. 두 곳 숫자가 다르게 보이면 카드사 쪽을 기준으로 보면 돼요.\n\n사용종료 1개월 전에는 미사용 금액이 많은 보호자에게 한국사회보장정보원(1566-3232)이 문자와 전화로 안내한다고 해요. 모르는 번호라고 넘기지 말고 내용을 확인해 보세요.\n\n한눈에 정리\n\n- 금액: 첫째 200만 원, 둘째 이상 300만 원(2024년 이후 출생아)\n- 대상: 출생신고 후 생년월일로부터 1년 이내 출생아\n- 사용기한: 2024년 3월 개정으로 1년 → 2년\n- 사용처: 유흥·사행업종 등 제외 전 업종, 온라인 포함\n- 잔액: 카드사 기준이 가장 정확\n\n지원 내용은 바뀔 수 있으니 신청 전 국민행복카드 누리집과 보건복지상담센터(129) 안내를 다시 확인해 주세요.", "copyAll": "핵심부터 말하면, 첫만남이용권은 출생신고를 마친 아기에게 국민행복카드 바우처로 주는 지원이고 금액은 첫째 200만 원, 둘째 이상 300만 원이에요(2024년 1월 1일 이후 출생아 기준). 출생 직후 정신없는 시기라 놓치기 쉬운 네 가지를 순서대로 확인해 보세요. (2026년 10월 5일 기준, 국민행복카드·보건복지부 안내)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/038/038_1_card.png\n\n확인 1. 우리 아이가 대상인지\n\n국민행복카드 안내에 따르면 대상은 출생신고가 되어 정상적으로 주민등록번호를 받은 아동이에요. 단, 주민등록상 생년월일로부터 1년이 지나지 않은 출생아여야 해요. 신청을 미루다 돌잔치 무렵이 되면 대상에서 벗어날 수 있다는 뜻이니, 출생신고와 함께 챙기는 편이 안전해요.\n\n금액은 원래 출생 순서와 상관없이 200만 원이었는데, 2024년 1월 1일 이후 태어난 아동부터 둘째 이상은 300만 원으로 올랐어요. 보건복지부는 이 내용을 담은 「저출산·고령사회기본법 시행령」 개정안이 2024년 3월 19일 국무회의에서 의결됐다고 밝혔어요.\n\n확인 2. 어디서 신청하는지\n\n• 방문 — 안내 내용: 보호자나 대리인이 아동의 주민등록상 주소지 읍·면·동 행정복지센터에 신청\n• 온라인 — 안내 내용: 온라인 신청 가능(국민행복카드 안내), 정부24에도 '첫만남이용권 지원' 서비스 안내가 있음\n• 우편·팩스 — 안내 내용: 여성 수용자가 교정시설에서 아동을 양육하는 경우에만 가능\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/038/038_2_card.png\n\n신청 뒤에는 국민행복카드를 발급받아, 정부지원금으로 결제할 수 있는 유통점에서 지원금으로 살 수 있는 물품을 자유롭게 구매하는 방식이에요. 이미 다른 바우처용 국민행복카드가 있는 집이라면, 어느 카드로 첫만남이용권이 들어오는지 신청할 때 함께 확인해 두면 헷갈리지 않아요.\n\n확인 3. 언제까지, 어디에 쓸 수 있는지\n\n같은 2024년 3월 시행령 개정으로 첫만남이용권 사용기한이 1년에서 2년으로 늘었어요(보건복지부 보도자료, 공포 즉시 시행). 아이별 정확한 사용종료일은 카드사나 사회서비스 전자바우처에서 확인하는 것이 가장 정확해요.\n\n쓸 수 있는 곳은 꽤 넓어요. 유흥·사행업종처럼 지급 목적에서 벗어난 업종을 빼면 온라인 구매를 포함한 전 업종에서 사용할 수 있다고 안내돼 있어요.\n\n확인 4. 잔액은 어디서 보는지\n\n잔액은 사회서비스 전자바우처나 카드사 홈페이지·앱·문자·알림톡·상담센터에서 확인할 수 있어요. 다만 국민행  잔액과 이용 내역은 카드사에서 확인하라고 해요. 두 곳 숫자가 다르게 보이면 카드사 쪽을 기준으로 보면 돼요. 사용종료 1개월 전에는 미사용 금액이 많은 보호자에게 한국사회보장정보원(1566-3232)이 문자와 전화로 안내한다고 해요. 모르는 번호라고 넘기지 말고 내용을 확인해 보세요. 한눈에 정리 - 금액: 첫째 200만 원, 둘째 이상 300만 원(2024년 이후 출생아) - 대상: 출생신고 후 생년월일로부터 1년 이내 출생아 - 사용기한: 2024년 3월 개정으로 1년 → 2년 - 사용처: 유흥·사행업종 등 제외 전 업종, 온라인 포함 - 잔액: 카드사 기준이 가장 정확 지원 내용은 바뀔 수 있으니 신청 전 국민행복카드 누리집과 보건복지상담센터(129) 안내를 다시 확인해 주세요. 네이버"}, {"id": "037", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "037_used-car-transfer-registration.md", "title": "중고차 샀다면 '15일' 안에 이전등록, 늦으면 하루 1만 원씩 붙는 과태료 (2026년 기준)", "cands": ["중고차 샀다면 '15일' 안에 이전등록, 늦으면 하루 1만 원씩 붙는 과태료 (2026년 기준)", "중고차 직거래 후 명의이전은 누가? 이전등록 기한·서류·과태료 정리", "이전등록 20일 늦으면 과태료 얼마? 10만 원부터 최고 50만 원까지 계산법"], "cat": "자동차·운전", "kw": ["자동차 이전등록", "중고차 직거래", "이전등록 과태료", "자동차등록령", "명의이전"], "summary": "중고차를 산 사람이 15일 안에 해야 하는 소유권 이전등록의 의무 주체, 직거래·매매업자 거래별 서류, 지연 과태료(10만~50만 원) 계산법을 찾기쉬운 생활법령정보 기준으로 정리", "status": "초안", "created": "2026-10-05 15:05", "base": "2026-10-05", "need": 0, "chars": 1580, "chars_ns": 1218, "imgs": 3, "slots": 2, "filled": 2, "thumb": "img/037/037_0_thumb.png", "seHtml": "<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/037/037_0_thumb.png\" alt=\"대표 이미지\" width=\"720\"><\/p>\n<p>\"명의 이전은 차 판 사람이 알아서 해 주는 거 아니야?\"라고 생각하기 쉬운데, 법에서 이전등록 의무를 지는 사람은 <b>중고차를 산 사람<\/b>이에요. 직거래로 차를 샀다면 15일이라는 기한부터 기억해 두세요. 기한, 서류, 늦었을 때 과태료를 규칙과 표로 정리했어요. 확인 기준일은 2026년 10월 5일이고, 법제처 찾기쉬운 생활법령정보의 중고차 이전등록 안내를 바탕으로 했어요.<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/037/037_1_card.png\" alt=\"중고차 이전등록 한눈에 정리\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>규칙 1. 산 날부터 15일 안에<\/b><\/span><\/p>\n<p>찾기쉬운 생활법령정보는 「자동차관리법」 제12조와 「자동차등록령」 제26조를 근거로, 중고차를 산 사람은 <b>15일 이내<\/b>에 소유권 이전등록을 해야 한다고 안내해요. 신청은 가까운 차량등록사무소에서 하면 돼요.<\/p>\n<p>판 사람 입장에서도 손 놓고 있을 일은 아니에요. 산 사람이 이전등록을 신청하지 않으면, 신청 당시 자동차등록원부에 소유자로 적힌 사람(판 사람)이 이전등록을 신청할 수 있다고 안내돼 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>규칙 2. 거래 방식에 따라 서류가 달라요<\/b><\/span><\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>거래 방식<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>준비 서류(생활법령정보 안내)<\/b><\/td><\/tr><tr><td>개인 간 직접 매매<\/td><td>이전등록신청서, 자동차양도증명서, 판 사람의 인감증명서·본인서명확인서·전자본인서명확인서 발급증 중 하나<\/td><\/tr><tr><td>자동차매매업자를 통한 매매<\/td><td>이전등록신청서, 자동차양도증명서<\/td><\/tr><tr><td>대리인이 신청<\/td><td>위 서류 + 위임장, 위임한 사람의 신분증명서 사본<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p>판 사람이 차량등록사무소에 함께 가서 매매 사실을 직접 확인하면 인감증명서 등은 내지 않아도 된다고 안내돼 있어요. 매매업자에게 산 경우에는 매매업자가 이전등록을 대신할 수 있는데, 이때는 실제 비용에 해당하는 등록신청 대행수수료를 내야 해요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>규칙 3. 늦으면 과태료, 계산은 이렇게<\/b><\/span><\/p>\n<p>정당한 사유 없이 이전등록을 늦게 신청하면 「자동차관리법 시행령」 별표에 따라 과태료가 부과돼요.<\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>신청 지연 기간<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>과태료<\/b><\/td><\/tr><tr><td>10일 이내<\/td><td>10만 원<\/td><\/tr><tr><td>10일 초과 ~ 49일 이내<\/td><td>10만 원 + 11일째부터 하루 1만 원씩<\/td><\/tr><tr><td>50일 이상<\/td><td>50만 원<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/037/037_2_card.png\" alt=\"이전등록이 늦으면 과태료\" width=\"720\"><\/p>\n<p>예를 들어 기한보다 20일 늦었다면 10만 원에 11~20일째 10일분(10만 원)이 더해져 20만 원이 되는 구조예요. 49일 늦으면 49만 원, 50일부터는 50만 원이에요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>규칙 4. 직거래라면 이 순서로<\/b><\/span><\/p>\n<ol><li>계약하면서 양도증명서 내용(차량, 금액, 날짜)을 함께 확인하기<\/li><li>판 사람에게서 인감증명서 등 필요한 서류를 받거나, 함께 차량등록사무소 가기<\/li><li>산 날부터 15일 안에 이전등록 신청하기<\/li><li>보험·세금 같은 다른 절차는 각 기관 안내를 따로 확인하기<\/li><\/ol>\n<p>이 밖에 취득세 등 세금은 이전등록과 별개로 정해진 기준이 있으니, 금액은 관할 지자체나 위택스 안내를 확인하세요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>이전등록 의무는 산 사람에게, 기한은 15일<\/li><li>직거래는 양도증명서 + 판 사람 인감증명서 등이 핵심<\/li><li>지연 과태료 10만 원에서 시작해 최고 50만 원<\/li><li>산 사람이 안 하면 판 사람도 신청 가능<\/li><\/ul>\n<p>생활법령정보 페이지에는 12월 3일 시행되는 「자동차관리법」 개정 사항을 반영할 예정이라는 안내가 있으니, 거래 직전에 최신 안내를 다시 확인해 주세요.<\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/037/037_0_thumb.png\n\n\"명의 이전은 차 판 사람이 알아서 해 주는 거 아니야?\"라고 생각하기 쉬운데, 법에서 이전등록 의무를 지는 사람은 중고차를 산 사람이에요. 직거래로 차를 샀다면 15일이라는 기한부터 기억해 두세요. 기한, 서류, 늦었을 때 과태료를 규칙과 표로 정리했어요. 확인 기준일은 2026년 10월 5일이고, 법제처 찾기쉬운 생활법령정보의 중고차 이전등록 안내를 바탕으로 했어요.\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/037/037_1_card.png\n\n규칙 1. 산 날부터 15일 안에\n\n찾기쉬운 생활법령정보는 「자동차관리법」 제12조와 「자동차등록령」 제26조를 근거로, 중고차를 산 사람은 15일 이내에 소유권 이전등록을 해야 한다고 안내해요. 신청은 가까운 차량등록사무소에서 하면 돼요.\n\n판 사람 입장에서도 손 놓고 있을 일은 아니에요. 산 사람이 이전등록을 신청하지 않으면, 신청 당시 자동차등록원부에 소유자로 적힌 사람(판 사람)이 이전등록을 신청할 수 있다고 안내돼 있어요.\n\n규칙 2. 거래 방식에 따라 서류가 달라요\n\n• 개인 간 직접 매매 — 준비 서류(생활법령정보 안내): 이전등록신청서, 자동차양도증명서, 판 사람의 인감증명서·본인서명확인서·전자본인서명확인서 발급증 중 하나\n• 자동차매매업자를 통한 매매 — 준비 서류(생활법령정보 안내): 이전등록신청서, 자동차양도증명서\n• 대리인이 신청 — 준비 서류(생활법령정보 안내): 위 서류 + 위임장, 위임한 사람의 신분증명서 사본\n\n판 사람이 차량등록사무소에 함께 가서 매매 사실을 직접 확인하면 인감증명서 등은 내지 않아도 된다고 안내돼 있어요. 매매업자에게 산 경우에는 매매업자가 이전등록을 대신할 수 있는데, 이때는 실제 비용에 해당하는 등록신청 대행수수료를 내야 해요.\n\n규칙 3. 늦으면 과태료, 계산은 이렇게\n\n정당한 사유 없이 이전등록을 늦게 신청하면 「자동차관리법 시행령」 별표에 따라 과태료가 부과돼요.\n\n• 10일 이내 — 과태료: 10만 원\n• 10일 초과 ~ 49일 이내 — 과태료: 10만 원 + 11일째부터 하루 1만 원씩\n• 50일 이상 — 과태료: 50만 원\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/037/037_2_card.png\n\n예를 들어 기한보다 20일 늦었다면 10만 원에 11~20일째 10일분(10만 원)이 더해져 20만 원이 되는 구조예요. 49일 늦으면 49만 원, 50일부터는 50만 원이에요.\n\n규칙 4. 직거래라면 이 순서로\n\n1. 계약하면서 양도증명서 내용(차량, 금액, 날짜)을 함께 확인하기\n2. 판 사람에게서 인감증명서 등 필요한 서류를 받거나, 함께 차량등록사무소 가기\n3. 산 날부터 15일 안에 이전등록 신청하기\n4. 보험·세금 같은 다른 절차는 각 기관 안내를 따로 확인하기\n\n이 밖에 취득세 등 세금은 이전등록과 별개로 정해진 기준이 있으니, 금액은 관할 지자체나 위택스 안내를 확인하세요.\n\n한눈에 정리\n\n- 이전등록 의무는 산 사람에게, 기한은 15일\n- 직거래는 양도증명서 + 판 사람 인감증명서 등이 핵심\n- 지연 과태료 10만 원에서 시작해 최고 50만 원\n- 산 사람이 안 하면 판 사람도 신청 가능\n\n생활법령정보 페이지에는 12월 3일 시행되는 「자동차관리법」 개정 사항을 반영할 예정이라는 안내가 있으니, 거래 직전에 최신 안내를 다시 확인해 주세요.", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/037/037_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/037/037_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "037_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/037/037_1_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/037/037_1_card.png", "cap": "", "alt": "중고차 이전등록 한눈에 정리", "name": "037_1_card.png", "w": 1080, "h": 840}, {"n": 2, "label": "사진 2", "uri": "img/037/037_2_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/037/037_2_card.png", "cap": "", "alt": "이전등록이 늦으면 과태료", "name": "037_2_card.png", "w": 1080, "h": 818}], "zip": "img/037/037_images.zip", "html": "<figure class=\"ph thumbfig\" data-n=\"0\"><img src=\"img/037/037_0_thumb.png\" alt=\"대표 이미지\"><\/figure>\n<p>\"명의 이전은 차 판 사람이 알아서 해 주는 거 아니야?\"라고 생각하기 쉬운데, 법에서 이전등록 의무를 지는 사람은 <strong>중고차를 산 사람<\/strong>이에요. 직거래로 차를 샀다면 15일이라는 기한부터 기억해 두세요. 기한, 서류, 늦었을 때 과태료를 규칙과 표로 정리했어요. 확인 기준일은 2026년 10월 5일이고, 법제처 찾기쉬운 생활법령정보의 중고차 이전등록 안내를 바탕으로 했어요.<\/p>\n<figure class=\"ph\" data-n=\"1\"><img loading=\"lazy\" src=\"img/037/037_1_card.png\" alt=\"중고차 이전등록 한눈에 정리\"><\/figure>\n<h3>규칙 1. 산 날부터 15일 안에<\/h3>\n<p>찾기쉬운 생활법령정보는 「자동차관리법」 제12조와 「자동차등록령」 제26조를 근거로, 중고차를 산 사람은 <strong>15일 이내<\/strong>에 소유권 이전등록을 해야 한다고 안내해요. 신청은 가까운 차량등록사무소에서 하면 돼요.<\/p>\n<p>판 사람 입장에서도 손 놓고 있을 일은 아니에요. 산 사람이 이전등록을 신청하지 않으면, 신청 당시 자동차등록원부에 소유자로 적힌 사람(판 사람)이 이전등록을 신청할 수 있다고 안내돼 있어요.<\/p>\n<h3>규칙 2. 거래 방식에 따라 서류가 달라요<\/h3>\n<div class=\"tw\"><table><thead><tr><th>거래 방식<\/th><th>준비 서류(생활법령정보 안내)<\/th><\/tr><\/thead><tbody><tr><td>개인 간 직접 매매<\/td><td>이전등록신청서, 자동차양도증명서, 판 사람의 인감증명서·본인서명확인서·전자본인서명확인서 발급증 중 하나<\/td><\/tr><tr><td>자동차매매업자를 통한 매매<\/td><td>이전등록신청서, 자동차양도증명서<\/td><\/tr><tr><td>대리인이 신청<\/td><td>위 서류 + 위임장, 위임한 사람의 신분증명서 사본<\/td><\/tr><\/tbody><\/table><\/div>\n<p>판 사람이 차량등록사무소에 함께 가서 매매 사실을 직접 확인하면 인감증명서 등은 내지 않아도 된다고 안내돼 있어요. 매매업자에게 산 경우에는 매매업자가 이전등록을 대신할 수 있는데, 이때는 실제 비용에 해당하는 등록신청 대행수수료를 내야 해요.<\/p>\n<h3>규칙 3. 늦으면 과태료, 계산은 이렇게<\/h3>\n<p>정당한 사유 없이 이전등록을 늦게 신청하면 「자동차관리법 시행령」 별표에 따라 과태료가 부과돼요.<\/p>\n<div class=\"tw\"><table><thead><tr><th>신청 지연 기간<\/th><th>과태료<\/th><\/tr><\/thead><tbody><tr><td>10일 이내<\/td><td>10만 원<\/td><\/tr><tr><td>10일 초과 ~ 49일 이내<\/td><td>10만 원 + 11일째부터 하루 1만 원씩<\/td><\/tr><tr><td>50일 이상<\/td><td>50만 원<\/td><\/tr><\/tbody><\/table><\/div>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/037/037_2_card.png\" alt=\"이전등록이 늦으면 과태료\"><\/figure>\n<p>예를 들어 기한보다 20일 늦었다면 10만 원에 11~20일째 10일분(10만 원)이 더해져 20만 원이 되는 구조예요. 49일 늦으면 49만 원, 50일부터는 50만 원이에요.<\/p>\n<h3>규칙 4. 직거래라면 이 순서로<\/h3>\n<ol><li>계약하면서 양도증명서 내용(차량, 금액, 날짜)을 함께 확인하기<\/li><li>판 사람에게서 인감증명서 등 필요한 서류를 받거나, 함께 차량등록사무소 가기<\/li><li>산 날부터 15일 안에 이전등록 신청하기<\/li><li>보험·세금 같은 다른 절차는 각 기관 안내를 따로 확인하기<\/li><\/ol>\n<p>이 밖에 취득세 등 세금은 이전등록과 별개로 정해진 기준이 있으니, 금액은 관할 지자체나 위택스 안내를 확인하세요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>이전등록 의무는 산 사람에게, 기한은 15일<\/li><li>직거래는 양도증명서 + 판 사람 인감증명서 등이 핵심<\/li><li>지연 과태료 10만 원에서 시작해 최고 50만 원<\/li><li>산 사람이 안 하면 판 사람도 신청 가능<\/li><\/ul>\n<p>생활법령정보 페이지에는 12월 3일 시행되는 「자동차관리법」 개정 사항을 반영할 예정이라는 안내가 있으니, 거래 직전에 최신 안내를 다시 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 자체 제작 카드 · 사진 2 자체 제작 카드 — 파일 images/posts/037/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>규칙 3 아래<\/td><td>직접 만든 과태료 계산 카드(10일 이내 10만 원 → 하루 1만 원 → 최고 50만 원)<\/td><td>기관 서식 이미지 캡처 대신 텍스트 카드<\/td><\/tr><tr><td>규칙 4<\/td><td>차량 사진을 쓸 경우 번호판·VIN이 보이지 않게<\/td><td>실제 양도증명서·인감증명서·신분증 촬영 금지<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ '15일 이내', 직거래·매매업자별 서류, 판 사람 신청 가능 여부를 찾기쉬운 생활법령정보 '자동차 이전등록하기'에서 재확인<\/li><li class=\"cb\">☐ 과태료 표(10만 원 / 하루 1만 원 / 50만 원)가 12월 3일 시행 개정 이후 바뀌었는지 게시 시점에 확인<\/li><li class=\"cb\">☐ 취득세·보험 금액은 직접 확인한 경우에만 숫자로 추가<\/li><li class=\"cb\">☐ (선택) 차량등록사무소 온라인 신청 경로는 직접 확인한 경우에만 추가<\/li><li class=\"cb\">☐ 거래 경험담은 실제 있었던 경우에만, 개인정보 없이<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>15일 이내 이전등록 의무(자동차관리법 제12조, 자동차등록령 제26조), 차량등록사무소 신청, 거래 방식별 서류, 판 사람 직접 확인 시 인감증명서 등 면제, 매매업자 대행·대행수수료, 판 사람 신청 가능, 지연 과태료(10만 원 / 11일째부터 1일 1만 원 / 50일 이상 50만 원), 12월 3일 시행 개정 반영 예정 안내<\/td><td>찾기쉬운 생활법령정보 '자동차 이전등록하기' <a href=\"https://www.easylaw.go.kr/CSP/CnpClsMain.laf?ccfNo=2&amp;cciNo=3&amp;cnpClsNo=1&amp;csmSeq=1000&amp;popMenu=ov\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.easylaw.go.kr/CSP/CnpClsMain.laf?ccfNo=2&amp;cciNo=3&amp;cnpClsNo=1&amp;csmSeq=1000&amp;popMenu=ov<\/a><\/td><td>공식<\/td><\/tr><tr><td>근거 법령<\/td><td>국가법령정보센터 자동차관리법 <a href=\"https://www.law.go.kr/법령/자동차관리법\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.law.go.kr/법령/자동차관리법<\/a><\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "\"명의 이전은 차 판 사람이 알아서 해 주는 거 아니야?\"라고 생각하기 쉬운데, 법에서 이전등록 의무를 지는 사람은 중고차를 산 사람이에요. 직거래로 차를 샀다면 15일이라는 기한부터 기억해 두세요. 기한, 서류, 늦었을 때 과태료를 규칙과 표로 정리했어요. 확인 기준일은 2026년 10월 5일이고, 법제처 찾기쉬운 생활법령정보의 중고차 이전등록 안내를 바탕으로 했어요.\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/037/037_1_card.png\n\n규칙 1. 산 날부터 15일 안에\n\n찾기쉬운 생활법령정보는 「자동차관리법」 제12조와 「자동차등록령」 제26조를 근거로, 중고차를 산 사람은 15일 이내에 소유권 이전등록을 해야 한다고 안내해요. 신청은 가까운 차량등록사무소에서 하면 돼요.\n\n판 사람 입장에서도 손 놓고 있을 일은 아니에요. 산 사람이 이전등록을 신청하지 않으면, 신청 당시 자동차등록원부에 소유자로 적힌 사람(판 사람)이 이전등록을 신청할 수 있다고 안내돼 있어요.\n\n규칙 2. 거래 방식에 따라 서류가 달라요\n\n• 개인 간 직접 매매 — 준비 서류(생활법령정보 안내): 이전등록신청서, 자동차양도증명서, 판 사람의 인감증명서·본인서명확인서·전자본인서명확인서 발급증 중 하나\n• 자동차매매업자를 통한 매매 — 준비 서류(생활법령정보 안내): 이전등록신청서, 자동차양도증명서\n• 대리인이 신청 — 준비 서류(생활법령정보 안내): 위 서류 + 위임장, 위임한 사람의 신분증명서 사본\n\n판 사람이 차량등록사무소에 함께 가서 매매 사실을 직접 확인하면 인감증명서 등은 내지 않아도 된다고 안내돼 있어요. 매매업자에게 산 경우에는 매매업자가 이전등록을 대신할 수 있는데, 이때는 실제 비용에 해당하는 등록신청 대행수수료를 내야 해요.\n\n규칙 3. 늦으면 과태료, 계산은 이렇게\n\n정당한 사유 없이 이전등록을 늦게 신청하면 「자동차관리법 시행령」 별표에 따라 과태료가 부과돼요.\n\n• 10일 이내 — 과태료: 10만 원\n• 10일 초과 ~ 49일 이내 — 과태료: 10만 원 + 11일째부터 하루 1만 원씩\n• 50일 이상 — 과태료: 50만 원\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/037/037_2_card.png\n\n예를 들어 기한보다 20일 늦었다면 10만 원에 11~20일째 10일분(10만 원)이 더해져 20만 원이 되는 구조예요. 49일 늦으면 49만 원, 50일부터는 50만 원이에요.\n\n규칙 4. 직거래라면 이 순서로\n\n1. 계약하면서 양도증명서 내용(차량, 금액, 날짜)을 함께 확인하기\n2. 판 사람에게서 인감증명서 등 필요한 서류를 받거나, 함께 차량등록사무소 가기\n3. 산 날부터 15일 안에 이전등록 신청하기\n4. 보험·세금 같은 다른 절차는 각 기관 안내를 따로 확인하기\n\n이 밖에 취득세 등 세금은 이전등록과 별개로 정해진 기준이 있으니, 금액은 관할 지자체나 위택스 안내를 확인하세요.\n\n한눈에 정리\n\n- 이전등록 의무는 산 사람에게, 기한은 15일\n- 직거래는 양도증명서 + 판 사람 인감증명서 등이 핵심\n- 지연 과태료 10만 원에서 시작해 최고 50만 원\n- 산 사람이 안 하면 판 사람도 신청 가능\n\n생활법령정보 페이지에는 12월 3일 시행되는 「자동차관리법」 개정 사항을 반영할 예정이라는 안내가 있으니, 거래 직전에 최신 안내를 다시 확인해 주세요.", "copyAll": "\"명의 이전은 차 판 사람이 알아서 해 주는 거 아니야?\"라고 생각하기 쉬운데, 법에서 이전등록 의무를 지는 사람은 중고차를 산 사람이에요. 직거래로 차를 샀다면 15일이라는 기한부터 기억해 두세요. 기한, 서류, 늦었을 때 과태료를 규칙과 표로 정리했어요. 확인 기준일은 2026년 10월 5일이고, 법제처 찾기쉬운 생활법령정보의 중고차 이전등록 안내를 바탕으로 했어요.\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/037/037_1_card.png\n\n규칙 1. 산 날부터 15일 안에\n\n찾기쉬운 생활법령정보는 「자동차관리법」 제12조와 「자동차등록령」 제26조를 근거로, 중고차를 산 사람은 15일 이내에 소유권 이전등록을 해야 한다고 안내해요. 신청은 가까운 차량등록사무소에서 하면 돼요.\n\n판 사람 입장에서도 손 놓고 있을 일은 아니에요. 산 사람이 이전등록을 신청하지 않으면, 신청 당시 자동차등록원부에 소유자로 적힌 사람(판 사람)이 이전등록을 신청할 수 있다고 안내돼 있어요.\n\n규칙 2. 거래 방식에 따라 서류가 달라요\n\n• 개인 간 직접 매매 — 준비 서류(생활법령정보 안내): 이전등록신청서, 자동차양도증명서, 판 사람의 인감증명서·본인서명확인서·전자본인서명확인서 발급증 중 하나\n• 자동차매매업자를 통한 매매 — 준비 서류(생활법령정보 안내): 이전등록신청서, 자동차양도증명서\n• 대리인이 신청 — 준비 서류(생활법령정보 안내): 위 서류 + 위임장, 위임한 사람의 신분증명서 사본\n\n판 사람이 차량등록사무소에 함께 가서 매매 사실을 직접 확인하면 인감증명서 등은 내지 않아도 된다고 안내돼 있어요. 매매업자에게 산 경우에는 매매업자가 이전등록을 대신할 수 있는데, 이때는 실제 비용에 해당하는 등록신청 대행수수료를 내야 해요.\n\n규칙 3. 늦으면 과태료, 계산은  — 과태료: 10만 원 • 10일 초과 ~ 49일 이내 — 과태료: 10만 원 + 11일째부터 하루 1만 원씩 • 50일 이상 — 과태료: 50만 원 [사진 2] https://senti-1000ma.github.io/blog-drafts/img/037/037_2_card.png 예를 들어 기한보다 20일 늦었다면 10만 원에 11~20일째 10일분(10만 원)이 더해져 20만 원이 되는 구조예요. 49일 늦으면 49만 원, 50일부터는 50만 원이에요. 규칙 4. 직거래라면 이 순서로 1. 계약하면서 양도증명서 내용(차량, 금액, 날짜)을 함께 확인하기 2. 판 사람에게서 인감증명서 등 필요한 서류를 받거나, 함께 차량등록사무소 가기 3. 산 날부터 15일 안에 이전등록 신청하기 4. 보험·세금 같은 다른 절차는 각 기관 안내를 따로 확인하기 이 밖에 취득세 등 세금은 이전등록과 별개로 정해진 기준이 있으니, 금액은 관할 지자체나 위택스 안내를 확인하세요. 한눈에 정리 - 이전등록 의무는 산 사람에게, 기한은 15일 - 직거래는 양도증명서 + 판 사람 인감증명서 등이 핵심 - 지연 과태료 10만 원에서 시작해 최고 50만 원 - 산 사람이 안 하면 판 사람도 신청 가능 생활법령정보 페이지에는 12월 3일 시행되는 「자동차관리법」 개정 사항을 반영할 예정이라는 안내가 있으니, 거래 직전에 최신 안내를 다시 확인해 주세요. 네이버"}, {"id": "036", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "036_lease-renewal-right.md", "title": "전세·월세 계약갱신요구권, 언제까지 말해야 하고 집주인은 언제 거절할 수 있을까? (2026년 기준)", "cands": ["전세·월세 계약갱신요구권, 언제까지 말해야 하고 집주인은 언제 거절할 수 있을까? (2026년 기준)", "계약 끝나기 2개월 전이 마지노선? 계약갱신요구권 Q&A 7가지", "갱신요구권 쓰면 보증금은 얼마까지 오를 수 있을까, 5% 상한과 거절 사유 정리"], "cat": "주거·임대차", "kw": ["계약갱신요구권", "주택임대차보호법", "5% 상한", "갱신 거절", "묵시적 갱신"], "summary": "주택임대차보호법상 계약갱신요구권의 행사 기간(만료 6개월~2개월 전), 1회·2년, 5% 증액 상한, 임대인의 거절 사유와 손해배상, 갱신 후 해지를 찾기쉬운 생활법령정보 기준으로 Q&A 정리", "status": "초안", "created": "2026-10-05 15:04", "base": "2026-10-05", "need": 0, "chars": 1933, "chars_ns": 1479, "imgs": 3, "slots": 2, "filled": 2, "thumb": "img/036/036_0_thumb.png", "seHtml": "<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/036/036_0_thumb.png\" alt=\"대표 이미지\" width=\"720\"><\/p>\n<p>전세나 월세 만기가 다가오는데 집주인에게서 아무 연락이 없으면, 내가 먼저 \"더 살겠다\"고 말해야 하는지 헷갈리지요. 이럴 때 쓰는 권리가 「주택임대차보호법」의 계약갱신요구권이에요. 언제까지 말해야 하는지, 보증금은 얼마나 오를 수 있는지, 집주인이 거절할 수 있는 경우는 무엇인지 질문 순서대로 정리했어요. (2026년 10월 5일 기준, 찾기쉬운 생활법령정보 안내 기준)<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>Q1. 언제 요구해야 하나요?<\/b><\/span><\/p>\n<p>임대차 기간이 끝나기 <b>6개월 전부터 2개월 전까지<\/b> 임대인에게 갱신을 요구하면, 임대인은 정당한 사유 없이 거절하지 못해요. 이 '2개월 전' 기준은 2020년 12월 10일 이후 처음 맺거나 갱신한 계약부터 적용되고, 그 전에 맺은 계약은 '1개월 전'까지였어요. 나중에 다툼이 생기지 않도록 문자나 내용증명처럼 요구한 날짜가 남는 방법을 쓰는 편이 좋아요.<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/036/036_1_card.png\" alt=\"계약갱신요구권 한눈에 정리\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>Q2. 몇 번, 몇 년 쓸 수 있나요?<\/b><\/span><\/p>\n<p>갱신요구권은 <b>1회<\/b>만 쓸 수 있고, 갱신된 계약의 기간은 <b>2년<\/b>으로 봐요. 생활법령정보 Q&amp;A에 따르면 이전 계약이 묵시적으로 갱신된 적이 있더라도, 갱신요구권을 아직 쓰지 않았다면 행사할 수 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>Q3. 보증금·월세는 얼마까지 오르나요?<\/b><\/span><\/p>\n<p>갱신되는 계약은 기존과 같은 조건으로 다시 맺은 것으로 보되, 차임과 보증금은 법 제7조 범위 안에서만 올릴 수 있어요. 상한은 기존 금액의 <b>20분의 1(5%)<\/b>이고, 시·도가 조례로 이보다 낮게 정할 수 있어요. 5%는 '최대한'일 뿐이라 반드시 5%를 올려줘야 하는 건 아니고, 범위 안에서 협의하면 돼요. 또 계약이나 증액 후 1년 안에는 증액 청구를 할 수 없어요.<\/p>\n<p>전세를 월세로 바꾸는 건 임차인이 동의하지 않으면 어렵고, 동의해서 바꾸더라도 법정 전환율(연 10%와 한국은행 기준금리+2% 중 낮은 비율)이 적용돼요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>Q4. 집주인이 거절할 수 있는 경우는?<\/b><\/span><\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>거절 사유(요약)<\/b><\/td><\/tr><tr><td>2기의 차임액에 이르도록 월세를 연체한 사실이 있는 경우<\/td><\/tr><tr><td>거짓이나 부정한 방법으로 임차한 경우<\/td><\/tr><tr><td>합의해서 임대인이 상당한 보상을 해 준 경우<\/td><\/tr><tr><td>임대인 동의 없이 전대한 경우<\/td><\/tr><tr><td>고의나 중대한 과실로 주택을 파손했거나 주택이 멸실된 경우<\/td><\/tr><tr><td>법이 정한 요건의 철거·재건축으로 점유 회복이 필요한 경우<\/td><\/tr><tr><td>임대인(직계존속·직계비속 포함)이 실제 거주하려는 경우<\/td><\/tr><tr><td>그 밖에 임차인 의무를 현저히 위반하는 등 계속하기 어려운 중대한 사유<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/036/036_2_card.png\" alt=\"집주인이 거절할 수 있는 경우(요약)\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>Q5. 실거주한다더니 다른 사람에게 세를 주면요?<\/b><\/span><\/p>\n<p>실거주 등을 이유로 거절해 놓고, 갱신됐다면 끝났을 기간이 지나기 전에 정당한 사유 없이 제3자에게 임대하면 임대인은 손해를 배상해야 해요. 미리 정한 배상액이 없으면 ① 거절 당시 환산월차임 3개월분 ② 새 임대로 얻은 환산월차임과의 차액 2년분 ③ 실제 손해액 중 <b>큰 금액<\/b>이 기준이에요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>Q6. 갱신했으면 2년을 꼭 채워야 하나요?<\/b><\/span><\/p>\n<p>아니에요. 임차인은 갱신된 계약 기간 중에도 언제든 해지를 통지할 수 있고, 임대인이 통지를 받은 날부터 <b>3개월<\/b>이 지나면 효력이 생겨요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>Q7. 아무도 말을 안 하면요?<\/b><\/span><\/p>\n<p>임대인이 만료 6개월~2개월 전 사이에 갱신 거절이나 조건 변경을 통지하지 않고, 임차인도 2개월 전까지 통지하지 않으면 같은 조건으로 다시 계약한 것으로 봐요(묵시적 갱신). 이때 기간은 2년이고 임차인은 언제든 해지를 통지할 수 있어요(3개월 후 효력).<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>갱신 요구는 만료 6개월 전 ~ 2개월 전, 1회·2년<\/li><li>증액 상한 5%(조례로 더 낮을 수 있음), 협의 가능<\/li><li>실거주 등 법이 정한 사유가 있어야 거절 가능, 허위면 손해배상<\/li><li>갱신 후에도 임차인은 해지 통지 가능(3개월 후 효력)<\/li><\/ul>\n<p>개별 계약 사정에 따라 결과가 달라질 수 있으니, 분쟁이 생기면 찾기쉬운 생활법령정보와 주택임대차분쟁조정위원회 안내를 다시 확인해 주세요.<\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/036/036_0_thumb.png\n\n전세나 월세 만기가 다가오는데 집주인에게서 아무 연락이 없으면, 내가 먼저 \"더 살겠다\"고 말해야 하는지 헷갈리지요. 이럴 때 쓰는 권리가 「주택임대차보호법」의 계약갱신요구권이에요. 언제까지 말해야 하는지, 보증금은 얼마나 오를 수 있는지, 집주인이 거절할 수 있는 경우는 무엇인지 질문 순서대로 정리했어요. (2026년 10월 5일 기준, 찾기쉬운 생활법령정보 안내 기준)\n\nQ1. 언제 요구해야 하나요?\n\n임대차 기간이 끝나기 6개월 전부터 2개월 전까지 임대인에게 갱신을 요구하면, 임대인은 정당한 사유 없이 거절하지 못해요. 이 '2개월 전' 기준은 2020년 12월 10일 이후 처음 맺거나 갱신한 계약부터 적용되고, 그 전에 맺은 계약은 '1개월 전'까지였어요. 나중에 다툼이 생기지 않도록 문자나 내용증명처럼 요구한 날짜가 남는 방법을 쓰는 편이 좋아요.\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/036/036_1_card.png\n\nQ2. 몇 번, 몇 년 쓸 수 있나요?\n\n갱신요구권은 1회만 쓸 수 있고, 갱신된 계약의 기간은 2년으로 봐요. 생활법령정보 Q&A에 따르면 이전 계약이 묵시적으로 갱신된 적이 있더라도, 갱신요구권을 아직 쓰지 않았다면 행사할 수 있어요.\n\nQ3. 보증금·월세는 얼마까지 오르나요?\n\n갱신되는 계약은 기존과 같은 조건으로 다시 맺은 것으로 보되, 차임과 보증금은 법 제7조 범위 안에서만 올릴 수 있어요. 상한은 기존 금액의 20분의 1(5%)이고, 시·도가 조례로 이보다 낮게 정할 수 있어요. 5%는 '최대한'일 뿐이라 반드시 5%를 올려줘야 하는 건 아니고, 범위 안에서 협의하면 돼요. 또 계약이나 증액 후 1년 안에는 증액 청구를 할 수 없어요.\n\n전세를 월세로 바꾸는 건 임차인이 동의하지 않으면 어렵고, 동의해서 바꾸더라도 법정 전환율(연 10%와 한국은행 기준금리+2% 중 낮은 비율)이 적용돼요.\n\nQ4. 집주인이 거절할 수 있는 경우는?\n\n• 2기의 차임액에 이르도록 월세를 연체한 사실이 있는 경우\n• 거짓이나 부정한 방법으로 임차한 경우\n• 합의해서 임대인이 상당한 보상을 해 준 경우\n• 임대인 동의 없이 전대한 경우\n• 고의나 중대한 과실로 주택을 파손했거나 주택이 멸실된 경우\n• 법이 정한 요건의 철거·재건축으로 점유 회복이 필요한 경우\n• 임대인(직계존속·직계비속 포함)이 실제 거주하려는 경우\n• 그 밖에 임차인 의무를 현저히 위반하는 등 계속하기 어려운 중대한 사유\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/036/036_2_card.png\n\nQ5. 실거주한다더니 다른 사람에게 세를 주면요?\n\n실거주 등을 이유로 거절해 놓고, 갱신됐다면 끝났을 기간이 지나기 전에 정당한 사유 없이 제3자에게 임대하면 임대인은 손해를 배상해야 해요. 미리 정한 배상액이 없으면 ① 거절 당시 환산월차임 3개월분 ② 새 임대로 얻은 환산월차임과의 차액 2년분 ③ 실제 손해액 중 큰 금액이 기준이에요.\n\nQ6. 갱신했으면 2년을 꼭 채워야 하나요?\n\n아니에요. 임차인은 갱신된 계약 기간 중에도 언제든 해지를 통지할 수 있고, 임대인이 통지를 받은 날부터 3개월이 지나면 효력이 생겨요.\n\nQ7. 아무도 말을 안 하면요?\n\n임대인이 만료 6개월~2개월 전 사이에 갱신 거절이나 조건 변경을 통지하지 않고, 임차인도 2개월 전까지 통지하지 않으면 같은 조건으로 다시 계약한 것으로 봐요(묵시적 갱신). 이때 기간은 2년이고 임차인은 언제든 해지를 통지할 수 있어요(3개월 후 효력).\n\n한눈에 정리\n\n- 갱신 요구는 만료 6개월 전 ~ 2개월 전, 1회·2년\n- 증액 상한 5%(조례로 더 낮을 수 있음), 협의 가능\n- 실거주 등 법이 정한 사유가 있어야 거절 가능, 허위면 손해배상\n- 갱신 후에도 임차인은 해지 통지 가능(3개월 후 효력)\n\n개별 계약 사정에 따라 결과가 달라질 수 있으니, 분쟁이 생기면 찾기쉬운 생활법령정보와 주택임대차분쟁조정위원회 안내를 다시 확인해 주세요.", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/036/036_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/036/036_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "036_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/036/036_1_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/036/036_1_card.png", "cap": "", "alt": "계약갱신요구권 한눈에 정리", "name": "036_1_card.png", "w": 1080, "h": 888}, {"n": 2, "label": "사진 2", "uri": "img/036/036_2_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/036/036_2_card.png", "cap": "", "alt": "집주인이 거절할 수 있는 경우(요약)", "name": "036_2_card.png", "w": 1080, "h": 1130}], "zip": "img/036/036_images.zip", "html": "<figure class=\"ph thumbfig\" data-n=\"0\"><img src=\"img/036/036_0_thumb.png\" alt=\"대표 이미지\"><\/figure>\n<p>전세나 월세 만기가 다가오는데 집주인에게서 아무 연락이 없으면, 내가 먼저 \"더 살겠다\"고 말해야 하는지 헷갈리지요. 이럴 때 쓰는 권리가 「주택임대차보호법」의 계약갱신요구권이에요. 언제까지 말해야 하는지, 보증금은 얼마나 오를 수 있는지, 집주인이 거절할 수 있는 경우는 무엇인지 질문 순서대로 정리했어요. (2026년 10월 5일 기준, 찾기쉬운 생활법령정보 안내 기준)<\/p>\n<h3>Q1. 언제 요구해야 하나요?<\/h3>\n<p>임대차 기간이 끝나기 <strong>6개월 전부터 2개월 전까지<\/strong> 임대인에게 갱신을 요구하면, 임대인은 정당한 사유 없이 거절하지 못해요. 이 '2개월 전' 기준은 2020년 12월 10일 이후 처음 맺거나 갱신한 계약부터 적용되고, 그 전에 맺은 계약은 '1개월 전'까지였어요. 나중에 다툼이 생기지 않도록 문자나 내용증명처럼 요구한 날짜가 남는 방법을 쓰는 편이 좋아요.<\/p>\n<figure class=\"ph\" data-n=\"1\"><img loading=\"lazy\" src=\"img/036/036_1_card.png\" alt=\"계약갱신요구권 한눈에 정리\"><\/figure>\n<h3>Q2. 몇 번, 몇 년 쓸 수 있나요?<\/h3>\n<p>갱신요구권은 <strong>1회<\/strong>만 쓸 수 있고, 갱신된 계약의 기간은 <strong>2년<\/strong>으로 봐요. 생활법령정보 Q&amp;A에 따르면 이전 계약이 묵시적으로 갱신된 적이 있더라도, 갱신요구권을 아직 쓰지 않았다면 행사할 수 있어요.<\/p>\n<h3>Q3. 보증금·월세는 얼마까지 오르나요?<\/h3>\n<p>갱신되는 계약은 기존과 같은 조건으로 다시 맺은 것으로 보되, 차임과 보증금은 법 제7조 범위 안에서만 올릴 수 있어요. 상한은 기존 금액의 <strong>20분의 1(5%)<\/strong>이고, 시·도가 조례로 이보다 낮게 정할 수 있어요. 5%는 '최대한'일 뿐이라 반드시 5%를 올려줘야 하는 건 아니고, 범위 안에서 협의하면 돼요. 또 계약이나 증액 후 1년 안에는 증액 청구를 할 수 없어요.<\/p>\n<p>전세를 월세로 바꾸는 건 임차인이 동의하지 않으면 어렵고, 동의해서 바꾸더라도 법정 전환율(연 10%와 한국은행 기준금리+2% 중 낮은 비율)이 적용돼요.<\/p>\n<h3>Q4. 집주인이 거절할 수 있는 경우는?<\/h3>\n<div class=\"tw\"><table><thead><tr><th>거절 사유(요약)<\/th><\/tr><\/thead><tbody><tr><td>2기의 차임액에 이르도록 월세를 연체한 사실이 있는 경우<\/td><\/tr><tr><td>거짓이나 부정한 방법으로 임차한 경우<\/td><\/tr><tr><td>합의해서 임대인이 상당한 보상을 해 준 경우<\/td><\/tr><tr><td>임대인 동의 없이 전대한 경우<\/td><\/tr><tr><td>고의나 중대한 과실로 주택을 파손했거나 주택이 멸실된 경우<\/td><\/tr><tr><td>법이 정한 요건의 철거·재건축으로 점유 회복이 필요한 경우<\/td><\/tr><tr><td>임대인(직계존속·직계비속 포함)이 실제 거주하려는 경우<\/td><\/tr><tr><td>그 밖에 임차인 의무를 현저히 위반하는 등 계속하기 어려운 중대한 사유<\/td><\/tr><\/tbody><\/table><\/div>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/036/036_2_card.png\" alt=\"집주인이 거절할 수 있는 경우(요약)\"><\/figure>\n<h3>Q5. 실거주한다더니 다른 사람에게 세를 주면요?<\/h3>\n<p>실거주 등을 이유로 거절해 놓고, 갱신됐다면 끝났을 기간이 지나기 전에 정당한 사유 없이 제3자에게 임대하면 임대인은 손해를 배상해야 해요. 미리 정한 배상액이 없으면 ① 거절 당시 환산월차임 3개월분 ② 새 임대로 얻은 환산월차임과의 차액 2년분 ③ 실제 손해액 중 <strong>큰 금액<\/strong>이 기준이에요.<\/p>\n<h3>Q6. 갱신했으면 2년을 꼭 채워야 하나요?<\/h3>\n<p>아니에요. 임차인은 갱신된 계약 기간 중에도 언제든 해지를 통지할 수 있고, 임대인이 통지를 받은 날부터 <strong>3개월<\/strong>이 지나면 효력이 생겨요.<\/p>\n<h3>Q7. 아무도 말을 안 하면요?<\/h3>\n<p>임대인이 만료 6개월~2개월 전 사이에 갱신 거절이나 조건 변경을 통지하지 않고, 임차인도 2개월 전까지 통지하지 않으면 같은 조건으로 다시 계약한 것으로 봐요(묵시적 갱신). 이때 기간은 2년이고 임차인은 언제든 해지를 통지할 수 있어요(3개월 후 효력).<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>갱신 요구는 만료 6개월 전 ~ 2개월 전, 1회·2년<\/li><li>증액 상한 5%(조례로 더 낮을 수 있음), 협의 가능<\/li><li>실거주 등 법이 정한 사유가 있어야 거절 가능, 허위면 손해배상<\/li><li>갱신 후에도 임차인은 해지 통지 가능(3개월 후 효력)<\/li><\/ul>\n<p>개별 계약 사정에 따라 결과가 달라질 수 있으니, 분쟁이 생기면 찾기쉬운 생활법령정보와 주택임대차분쟁조정위원회 안내를 다시 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 자체 제작 카드 · 사진 2 자체 제작 카드 — 파일 images/posts/036/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>Q1 아래<\/td><td>직접 만든 타임라인 카드(만료 6개월 전 ~ 2개월 전 = 갱신 요구 기간)<\/td><td>실제 계약서·주소·이름이 보이는 사진 금지<\/td><\/tr><tr><td>Q3 아래<\/td><td>직접 만든 계산 예시 카드(가상의 금액으로 5% 상한 표시)<\/td><td>실제 거래 금액·단지명 사용 금지<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 행사 기간 '6개월 전~2개월 전'(2020.12.10. 이후 계약), 1회·2년을 찾기쉬운 생활법령정보 '임대차계약의 갱신'에서 재확인<\/li><li class=\"cb\">☐ 5%(20분의 1) 상한·1년 내 증액 금지·법정 전환율(10%와 기준금리+2% 중 낮은 비율)을 '차임 또는 보증금의 증감청구'에서 재확인<\/li><li class=\"cb\">☐ 거주 지역 시·도에 별도 조례 상한이 있는지(있을 때만 본문에 추가)<\/li><li class=\"cb\">☐ 분쟁조정 기관 연락처는 직접 확인한 경우에만 추가<\/li><li class=\"cb\">☐ 개인 경험담은 실제 있었던 경우에만, 개인정보 없이<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>갱신요구 기간(6개월~2개월 전, 2020.12.10. 이후 계약), 1회·2년, 동일 조건·제7조 범위 증감, 거절 사유, 허위 거절 시 손해배상 기준, 갱신 후 해지(3개월), 묵시적 갱신, 묵시 갱신 이력 있어도 행사 가능<\/td><td>찾기쉬운 생활법령정보 '임대차계약의 갱신' <a href=\"https://www.easylaw.go.kr/CSP/CnpClsMain.laf?ccfNo=4&amp;cciNo=4&amp;cnpClsNo=1&amp;csmSeq=629&amp;popMenu=ov\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.easylaw.go.kr/CSP/CnpClsMain.laf?ccfNo=4&amp;cciNo=4&amp;cnpClsNo=1&amp;csmSeq=629&amp;popMenu=ov<\/a><\/td><td>공식<\/td><\/tr><tr><td>20분의 1(5%) 상한, 시·도 조례, 1년 내 증액 청구 불가, 5%는 상한·협의 가능, 전세→월세 전환 제한·법정 전환율<\/td><td>찾기쉬운 생활법령정보 '차임 또는 보증금의 증감청구' <a href=\"https://www.easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&amp;csmSeq=629&amp;ccfNo=4&amp;cciNo=1&amp;cnpClsNo=2\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&amp;csmSeq=629&amp;ccfNo=4&amp;cciNo=1&amp;cnpClsNo=2<\/a><\/td><td>공식<\/td><\/tr><tr><td>근거 법령(제6조, 제6조의2, 제6조의3, 제7조, 제7조의2)<\/td><td>국가법령정보센터 주택임대차보호법 <a href=\"https://www.law.go.kr/법령/주택임대차보호법\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.law.go.kr/법령/주택임대차보호법<\/a><\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "전세나 월세 만기가 다가오는데 집주인에게서 아무 연락이 없으면, 내가 먼저 \"더 살겠다\"고 말해야 하는지 헷갈리지요. 이럴 때 쓰는 권리가 「주택임대차보호법」의 계약갱신요구권이에요. 언제까지 말해야 하는지, 보증금은 얼마나 오를 수 있는지, 집주인이 거절할 수 있는 경우는 무엇인지 질문 순서대로 정리했어요. (2026년 10월 5일 기준, 찾기쉬운 생활법령정보 안내 기준)\n\nQ1. 언제 요구해야 하나요?\n\n임대차 기간이 끝나기 6개월 전부터 2개월 전까지 임대인에게 갱신을 요구하면, 임대인은 정당한 사유 없이 거절하지 못해요. 이 '2개월 전' 기준은 2020년 12월 10일 이후 처음 맺거나 갱신한 계약부터 적용되고, 그 전에 맺은 계약은 '1개월 전'까지였어요. 나중에 다툼이 생기지 않도록 문자나 내용증명처럼 요구한 날짜가 남는 방법을 쓰는 편이 좋아요.\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/036/036_1_card.png\n\nQ2. 몇 번, 몇 년 쓸 수 있나요?\n\n갱신요구권은 1회만 쓸 수 있고, 갱신된 계약의 기간은 2년으로 봐요. 생활법령정보 Q&A에 따르면 이전 계약이 묵시적으로 갱신된 적이 있더라도, 갱신요구권을 아직 쓰지 않았다면 행사할 수 있어요.\n\nQ3. 보증금·월세는 얼마까지 오르나요?\n\n갱신되는 계약은 기존과 같은 조건으로 다시 맺은 것으로 보되, 차임과 보증금은 법 제7조 범위 안에서만 올릴 수 있어요. 상한은 기존 금액의 20분의 1(5%)이고, 시·도가 조례로 이보다 낮게 정할 수 있어요. 5%는 '최대한'일 뿐이라 반드시 5%를 올려줘야 하는 건 아니고, 범위 안에서 협의하면 돼요. 또 계약이나 증액 후 1년 안에는 증액 청구를 할 수 없어요.\n\n전세를 월세로 바꾸는 건 임차인이 동의하지 않으면 어렵고, 동의해서 바꾸더라도 법정 전환율(연 10%와 한국은행 기준금리+2% 중 낮은 비율)이 적용돼요.\n\nQ4. 집주인이 거절할 수 있는 경우는?\n\n• 2기의 차임액에 이르도록 월세를 연체한 사실이 있는 경우\n• 거짓이나 부정한 방법으로 임차한 경우\n• 합의해서 임대인이 상당한 보상을 해 준 경우\n• 임대인 동의 없이 전대한 경우\n• 고의나 중대한 과실로 주택을 파손했거나 주택이 멸실된 경우\n• 법이 정한 요건의 철거·재건축으로 점유 회복이 필요한 경우\n• 임대인(직계존속·직계비속 포함)이 실제 거주하려는 경우\n• 그 밖에 임차인 의무를 현저히 위반하는 등 계속하기 어려운 중대한 사유\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/036/036_2_card.png\n\nQ5. 실거주한다더니 다른 사람에게 세를 주면요?\n\n실거주 등을 이유로 거절해 놓고, 갱신됐다면 끝났을 기간이 지나기 전에 정당한 사유 없이 제3자에게 임대하면 임대인은 손해를 배상해야 해요. 미리 정한 배상액이 없으면 ① 거절 당시 환산월차임 3개월분 ② 새 임대로 얻은 환산월차임과의 차액 2년분 ③ 실제 손해액 중 큰 금액이 기준이에요.\n\nQ6. 갱신했으면 2년을 꼭 채워야 하나요?\n\n아니에요. 임차인은 갱신된 계약 기간 중에도 언제든 해지를 통지할 수 있고, 임대인이 통지를 받은 날부터 3개월이 지나면 효력이 생겨요.\n\nQ7. 아무도 말을 안 하면요?\n\n임대인이 만료 6개월~2개월 전 사이에 갱신 거절이나 조건 변경을 통지하지 않고, 임차인도 2개월 전까지 통지하지 않으면 같은 조건으로 다시 계약한 것으로 봐요(묵시적 갱신). 이때 기간은 2년이고 임차인은 언제든 해지를 통지할 수 있어요(3개월 후 효력).\n\n한눈에 정리\n\n- 갱신 요구는 만료 6개월 전 ~ 2개월 전, 1회·2년\n- 증액 상한 5%(조례로 더 낮을 수 있음), 협의 가능\n- 실거주 등 법이 정한 사유가 있어야 거절 가능, 허위면 손해배상\n- 갱신 후에도 임차인은 해지 통지 가능(3개월 후 효력)\n\n개별 계약 사정에 따라 결과가 달라질 수 있으니, 분쟁이 생기면 찾기쉬운 생활법령정보와 주택임대차분쟁조정위원회 안내를 다시 확인해 주세요.", "copyAll": "전세나 월세 만기가 다가오는데 집주인에게서 아무 연락이 없으면, 내가 먼저 \"더 살겠다\"고 말해야 하는지 헷갈리지요. 이럴 때 쓰는 권리가 「주택임대차보호법」의 계약갱신요구권이에요. 언제까지 말해야 하는지, 보증금은 얼마나 오를 수 있는지, 집주인이 거절할 수 있는 경우는 무엇인지 질문 순서대로 정리했어요. (2026년 10월 5일 기준, 찾기쉬운 생활법령정보 안내 기준)\n\nQ1. 언제 요구해야 하나요?\n\n임대차 기간이 끝나기 6개월 전부터 2개월 전까지 임대인에게 갱신을 요구하면, 임대인은 정당한 사유 없이 거절하지 못해요. 이 '2개월 전' 기준은 2020년 12월 10일 이후 처음 맺거나 갱신한 계약부터 적용되고, 그 전에 맺은 계약은 '1개월 전'까지였어요. 나중에 다툼이 생기지 않도록 문자나 내용증명처럼 요구한 날짜가 남는 방법을 쓰는 편이 좋아요.\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/036/036_1_card.png\n\nQ2. 몇 번, 몇 년 쓸 수 있나요?\n\n갱신요구권은 1회만 쓸 수 있고, 갱신된 계약의 기간은 2년으로 봐요. 생활법령정보 Q&A에 따르면 이전 계약이 묵시적으로 갱신된 적이 있더라도, 갱신요구권을 아직 쓰지 않았다면 행사할 수 있어요.\n\nQ3. 보증금·월세는 얼마까지 오르나요?\n\n갱신되는 계약은 기존과 같은 조건으로 다시 맺은 것으로 보되, 차임과 보증금은 법 제7조 범위 안에서만 올릴 수 있어요. 상한은 기존 금액의 20분의 1(5%)이고, 시·도가 조례로 이보다 낮게 정할 수 있어요. 5%는 '최대한'일 뿐이라 반드시 5%를 올려줘야 하는 건 아니고, 범위 안에서 협의하면 돼요. 또 계약이나 증액 후 1년 안에는 증액 청구를 할 수 없어요.\n\n전세를 월세로 바꾸는 건 임차인이 동의하지 않으면 어렵고, 동의해서 바꾸더라도 법정 전환율(연 10%와 한국은행 기준금리+2% 중 낮은 비율)이 적용돼요.\n\nQ4. 집주인이 거절할 수 있는 경우는?\n\n• 2기의 차임액에 이르도록 월세를 연체한  조례로 이보다 낮게 정할 수 있어요. 5%는 '최대한'일 뿐이라 반드시 5%를 올려줘야 하는 건 아니고, 범위 안에서 협의하면 돼요. 또 계약이나 증액 후 1년 안에는 증액 청구를 할 수 없어요. 전세를 월세로 바꾸는 건 임차인이 동의하지 않으면 어렵고, 동의해서 바꾸더라도 법정 전환율(연 10%와 한국은행 기준금리+2% 중 낮은 비율)이 적용돼요. Q4. 집주인이 거절할 수 있는 경우는? • 2기의 차임액에 이르도록 월세를 연체한 사실이 있는 경우 • 거짓이나 부정한 방법으로 임차한 경우 • 합의해서 임대인이 상당한 보상을 해 준 경우 • 임대인 동의 없이 전대한 경우 • 고의나 중대한 과실로 주택을 파손했거나 주택이 멸실된 경우 • 법이 정한 요건의 철거·재건축으로 점유 회복이 필요한 경우 • 임대인(직계존속·직계비속 포함)이 실제 거주하려는 경우 • 그 밖에 임차인 의무를 현저히 위반하는 등 계속하기 어려운 중대한 사유 [사진 2] https://senti-1000ma.github.io/blog-drafts/img/036/036_2_card.png Q5. 실거주한다더니 다른 사람에게 세를 주면요? 실거주 등을 이유로 거절해 놓고, 갱신됐다면 끝났을 기간이 지나기 전에 정당한 사유 없이 제3자에게 임대하면 임대인은 손해를 배상해야 해요. 미리 정한 배상액이 없으면 ① 거절 당시 환산월차임 3개월분 ② 새 임대로 얻은 환산월차임과의 차액 2년분 ③ 실제 손해액 중 큰 금액이 기준이에요. Q6. 갱신했으면 2년을 꼭 채워야 하나요? 아니에요. 임차인은 갱신된 계약 기간 중에도 언제든 해지를 통지할 수 있고, 임대인이 통지를 받은 날부터 3개월이 지나면 효력이 생겨요. Q7. 아무도 말을 안 하면요? 임대인이 만료 6개월~2개월 전 사이에 갱신 거절이나 조건 변경을 통지하지 않고, 임차인도 2개월 전까지 통지하지 않으면 같은 조건으로 다시 계약한 것으로 봐요(묵시적 갱신). 이때 기간은 2년이고 임차인은 언제든 해지를 통지할 수 있어요(3개월 후 효력). 한눈에 정리 - 갱신 요구는 만료 6개월 전 ~ 2개월 전, 1회·2년 - 증액 상한 5%(조례로 더 낮을 수 있음), 협의 가능 - 실거주 등 법이 정한 사유가 있어야 거절 가능, 허위면 손해배상 - 갱신 후에도 임차인은 해지 통지 가능(3개월 후 효력) 개별 계약 사정에 따라 결과가 달라질 수 있으니, 분쟁이 생기면 찾기쉬운 생활법령정보와 주택임대차분쟁조정위원회 안내를 다시 확인해 주세요. 네이버"}, {"id": "035", "platform": "x", "sub": "x_crypto", "subLabel": "X 크립토", "file": "035_bank-of-russia-crypto-register.md", "title": "[크립토 뉴스] 러시아 중앙은행, 10월 5일부터 암호화폐 거래소·디지털 예탁기관 등록 규정 시행", "cands": ["[크립토 뉴스] 러시아 중앙은행, 10월 5일부터 암호화폐 거래소·디지털 예탁기관 등록 규정 시행", "러시아, 암호화폐 거래소 '등록제' 신청 접수 시작 (10월 5일)", "러시아 중앙은행 암호화폐 시장 진입 규정 발효: 거래소·예탁기관 레지스트리"], "cat": "규제·정책", "kw": ["러시아 중앙은행", "암호화폐 거래소", "등록제", "디지털 예탁기관"], "summary": "러시아 중앙은행이 9월 24일 발표한 암호화폐 거래소·디지털 예탁기관 등록(레지스트리) 규정이 10월 5일 시행된다는 소식을 단일 포스트로 요약", "status": "초안", "created": "2026-10-05 14:03", "base": "2026-10-05", "format": "single", "hashtags": "#크립토뉴스", "tags": ["#크립토뉴스"], "ko": "러시아 중앙은행은 9월 24일, 디지털 예탁기관·암호화폐 거래소·디지털 금융자산 정보시스템 운영자의 시장 진입(레지스트리 등록) 절차를 정한 규정과 레지스트리 운영 지침이 법무부 등록을 마쳐 10월 5일부터 시행된다고 발표했어요. 로이
