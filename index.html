용하지 않음(직접 캡처 권장)<\/li><\/ul>", "open": true}, {"title": "팩트체크 결과", "html": "<div class=\"tw\"><table><thead><tr><th>#<\/th><th>원본 <mark class=\"need\">[확인 필요]<\/mark>·확인 요청 항목<\/th><th>판정<\/th><th>확인 내용 · 출처<\/th><\/tr><\/thead><tbody><tr><td>4-1<\/td><td>파인 문구·payinfo.or.kr·금감원 콜센터 1332<\/td><td>확인됨<\/td><td><a href=\"https://fine.fss.or.kr/fine/main/contents.do?menuNo=900029\" target=\"_blank\" rel=\"noopener noreferrer\">https://fine.fss.or.kr/fine/main/contents.do?menuNo=900029<\/a><\/td><\/tr><tr><td>4-2<\/td><td>장기미거래 = 3년 이상 거래 없음 / 휴면 = 소멸시효 완성<\/td><td>확인됨<\/td><td>금융위 보도자료 2023-11-13 <a href=\"https://www.fsc.go.kr/no010101/81065\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsc.go.kr/no010101/81065<\/a><\/td><\/tr><tr><td>4-3<\/td><td>카드포인트 유효기간 5년<\/td><td>확인됨(표현 정정: '소멸시효 5년')<\/td><td>금융위 2021-01-05 \"카드회원약관상 소멸시효 5년\" <a href=\"https://www.fsc.go.kr/no010101/75079\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsc.go.kr/no010101/75079<\/a><\/td><\/tr><tr><td>4-4<\/td><td>'잠자는 내 돈 찾기 12종'<\/td><td>불일치(정정)<\/td><td>파인 '업권별 계좌 조회 및 관리'(<a href=\"https://fine.fss.or.kr/fine/main/contents.do?menuNo=900032\" target=\"_blank\" rel=\"noopener noreferrer\">https://fine.fss.or.kr/fine/main/contents.do?menuNo=900032<\/a>) 2026-10-05 확인 시 13개 항목 → 개수 표기 삭제. '새마을금고중앙회'는 파인 표기 '새마을금고'(휴면예금·휴면공제금)로 정정, 민원24(미환급공과금) 등 추가<\/td><\/tr><tr><td>4-5<\/td><td>즉시 환급 기준(초안 미포함 → 근거 확인)<\/td><td>확인됨(정정 사전방지)<\/td><td>1년 이상 거래 없고 잔고 100만 원 이하 예금·적금·투자자예탁금·신탁 — 금융위 <a href=\"https://www.fsc.go.kr/no010101/81065\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsc.go.kr/no010101/81065<\/a> , <a href=\"https://www.fsc.go.kr/no010101/85281\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsc.go.kr/no010101/85281<\/a><\/td><\/tr><tr><td>4-6<\/td><td>내계좌 한눈에로 조회 안 되는 자산<\/td><td>확인됨(본문 추가)<\/td><td>미청구 보험금은 '내 보험 찾아줌', 실기주과실은 한국예탁결제원 개별 조회, '대부분의' 장기미거래만 조회 — 금융위 85281 및 파인<\/td><\/tr><tr><td>4-7<\/td><td>조회 순서(PC·앱)<\/td><td>부분 확인 / 현재 화면은 확인 불가<\/td><td>금융위 카드뉴스 2023-11-13 <a href=\"https://www.fsc.go.kr/no040101?cnId=1968\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsc.go.kr/no040101?cnId=1968<\/a> 의 순서 반영. payinfo.or.kr은 박스에서 접속 시 오류 응답, 로그인 이후 화면은 확인 불가 → <mark class=\"need\">[확인 필요]<\/mark> 유지<\/td><\/tr><tr><td>4-8<\/td><td>어카운트인포 앱<\/td><td>확인됨<\/td><td>금융위 2025-09-15 정책브리핑 <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148949284\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyNewsView.do?newsId=148949284<\/a><\/td><\/tr><tr><td>4-9<\/td><td>피싱 주의 문구<\/td><td>확인됨(본문 추가)<\/td><td>금융위 안내(금융회사는 이메일·문자로 신분증·계좌 비밀번호 요구 안 함 등) — 위 금융위 자료<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>내계좌 한눈에 정의·조회 대상 예시, payinfo.or.kr, 금감원콜센터 1332<\/td><td>금융소비자 정보포털 파인 <a href=\"https://fine.fss.or.kr/fine/main/contents.do?menuNo=900029\" target=\"_blank\" rel=\"noopener noreferrer\">https://fine.fss.or.kr/fine/main/contents.do?menuNo=900029<\/a><\/td><td>공식<\/td><\/tr><tr><td>업권별 계좌 조회 및 관리(기관별 조회 링크)<\/td><td>파인 <a href=\"https://fine.fss.or.kr/fine/main/contents.do?menuNo=900032\" target=\"_blank\" rel=\"noopener noreferrer\">https://fine.fss.or.kr/fine/main/contents.do?menuNo=900032<\/a><\/td><td>공식<\/td><\/tr><tr><td>휴면·장기미거래 정의, 즉시환급(1년·100만 원 이하), 내 카드 한눈에<\/td><td>금융위원회 보도자료 2023-11-13 <a href=\"https://www.fsc.go.kr/no010101/81065\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsc.go.kr/no010101/81065<\/a> ; 후속 <a href=\"https://www.fsc.go.kr/no010101/85281\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsc.go.kr/no010101/85281<\/a><\/td><td>공식<\/td><\/tr><tr><td>카드포인트 소멸시효 5년<\/td><td>금융위원회 보도자료 2021-01-05 <a href=\"https://www.fsc.go.kr/no010101/75079\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsc.go.kr/no010101/75079<\/a><\/td><td>공식<\/td><\/tr><tr><td>조회 순서(PC·앱)<\/td><td>금융위원회 카드뉴스 2023-11-13 <a href=\"https://www.fsc.go.kr/no040101?cnId=1968\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsc.go.kr/no040101?cnId=1968<\/a><\/td><td>공식(2023, 화면 변경 가능)<\/td><\/tr><tr><td>어카운트인포 앱 안내(2025-09-15)<\/td><td>정책브리핑(금융위원회) <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148949284\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyNewsView.do?newsId=148949284<\/a><\/td><td>공식<\/td><\/tr><tr><td>(보조·미사용) 장기미거래 3년 등<\/td><td>IBK기업은행 블로그 <a href=\"https://blog.ibk.co.kr/2902\" target=\"_blank\" rel=\"noopener noreferrer\">https://blog.ibk.co.kr/2902<\/a> (2023-12-13)<\/td><td>2차 → 금융위 자료로 대체<\/td><\/tr><tr><td>payinfo.or.kr 직접 접속<\/td><td>박스 접속 시 오류 응답 → 서비스 화면 직접 확인 불가<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "<p>사진: stevepb / Wikimedia Commons (CC0, 표기 의무 없음 — 출처 병기 권장) <a href=\"https://commons.wikimedia.org/wiki/File:Piggy-bank-968302.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">https://commons.wikimedia.org/wiki/File:Piggy-bank-968302.jpg<\/a><br>본 저작물은 한국관광공사에서 2015년 작성하여 공공누리 제1유형으로 개방한 '한국은행화폐박물관'을 이용하였으며, 해당 저작물은 공공누리(<a href=\"https://www.kogl.or.kr\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.kogl.or.kr<\/a>)에서 무료로 다운받으실 수 있습니다.<\/p>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 금융감독원 공식 안내를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 서비스 구성은 바뀔 수 있으니 이용 전 공식 안내를 다시 확인해 주세요.<\/blockquote>\n<p>(참고: 광고·제휴·협찬·대가성 요소 없음. 금융상품·대출·카드 연결 없음.)<\/p>", "open": false}], "plain": "오래전에 만든 통장이나 한동안 쓰지 않은 계좌, 한두 개쯤은 있으시죠? 그런 계좌에 돈이 남아 있는지 한 번에 확인할 수 있는 공식 서비스가 있어요. 금융감독원 금융소비자 정보포털 '파인'에서 안내하는 '내계좌 한눈에'입니다. 어떤 서비스인지, 어떻게 조회하는지 공식 안내를 중심으로 정리했어요. (2026년 10월 5일 기준)\n\n(사진 1 자리)\n\n'내계좌 한눈에'가 뭐예요?\n\n파인 안내에 따르면 '내계좌 한눈에(계좌정보통합관리 서비스)'는 내 장기 미거래·휴면 금융자산을 간편하게 조회하는 서비스예요. 조회 대상으로 예·적금, 신탁, 투자자 예탁금, 휴면예금, 보험금 등이 안내되어 있어요. 문의는 금감원 콜센터(1332)에서 받는다고 되어 있고요.\n\n접속 경로는 파인(fine.fss.or.kr)의 '내 돈 관리' 메뉴에서 '내계좌 통합조회 및 관리'를 찾아 들어가면 돼요. 공식 안내 화면에는 서비스 주소로 payinfo.or.kr이 표시되어 있어요. 검색 결과의 광고나 문자로 받은 링크 대신, 공식 주소를 직접 입력하거나 파인에서 들어가는 방법을 권해 드려요. (이 부분은 제 개인적인 권고예요.)\n\n어떤 자산을 찾을 수 있나?\n\n금융위원회 보도자료(2023년 11월 13일)를 참고하면 대략 이런 구분이 있어요.\n\n- 휴면금융자산: 소멸시효가 완성된 예금·보험금 등(휴면예금, 휴면보험금 등)\n- 장기미거래 금융자산: 3년 이상 거래(입출금 등)가 없는 예·적금, 투자자예탁금, 보험금, 신탁 등\n- 미사용 카드 포인트: 카드회원약관상 소멸시효가 5년이라서, 5년이 지나면 소멸할 수 있어요(금융위 2021년 1월 보도자료). 카드 포인트는 같은 경로의 '내 카드 한눈에'에서 조회·현금화할 수 있다고 안내돼요.\n\n금융위는 1년 이상 거래가 없고 잔고가 100만 원 이하인 예금·적금·투자자예탁금·신탁계좌는 즉시 환급받을 수도 있다고 안내해요. 다만 '내계좌 통합조회'로는 대부분의 장기미거래 금융자산만 조회된다고 하니, 모든 자산이 한 번에 나온다고 기대하기는 어려워요.\n\n내계좌 한눈에로 조회되지 않는 자산도 있어요. 미청구 보험금은 '내 보험 찾아줌'(생명·손해보험협회), 실기주과실은 한국예탁결제원에서 따로 조회해야 한다고 안내돼요. 파인의 '업권별 계좌 조회 및 관리' 페이지에는 2026년 10월 5일 확인 기준으로 은행연합회(휴면예금·휴면보험금), 저축은행, 새마을금고(휴면예금·휴면공제금), 서민금융진흥원, 금융투자협회(휴면성증권), 한국예탁결제원(미수령주식·실기주과실), 내 보험 찾아줌, 보험개발원(자동차보험 과납보험료), 여신금융협회(카드포인트), 예금보험공사(파산금융기관 미수령금), 민원24(미환급공과금) 등 기관별 조회 링크가 모여 있어요. 항목 수와 구성은 바뀔 수 있어서 개수는 따로 적지 않을게요.\n\n조회 순서 (금융위원회 안내 기준)\n\n1. PC는 파인(fine.fss.or.kr) 또는 payinfo.or.kr에 접속하고, 모바일은 '어카운트인포' 앱을 설치\n2. '내계좌 한눈에'(파인에서는 '내계좌 통합조회 및 관리') 선택\n3. 본인 인증(휴대폰 인증 등) 진행\n4. 본인 명의 계좌와 휴면·장기미거래 자산 확인(앱에서는 하단 '계좌' 또는 더보기 메뉴에서 찾을 수 있다고 안내)\n5. 필요한 경우 잔고 이전이나 미사용 계좌 해지 등 처리\n\n이 순서는 금융위원회 2023년 카드뉴스 안내를 바탕으로 한 것이라 현재 화면과 메뉴 이름이 조금 다를 수 있어요. [확인 필요: 현재 화면 구성은 직접 접속해 확인] 어카운트인포 앱은 금융위원회가 2025년 9월 휴면·장기미거래 금융자산 찾기 캠페인에서 안내한 공식 앱이에요.\n\n(사진 2 자리)\n\n어떤 분들이 한 번 확인해 보면 좋을까?\n\n이 부분은 공식 자료가 아니라 제 생각이에요. 학생 때나 첫 직장 시절에 급여 통장을 여러 개 만들었던 분, 이사나 이직을 하면서 쓰던 은행이 바뀐 분, 자동이체를 정리하지 않고 방치한 계좌가 있는 분이라면 한 번쯤 조회해 볼 만해요. 내 명의로 어떤 계좌가 남아 있는지 파악해 두면 쓰지 않는 계좌를 정리하는 데도 도움이 되고요. 다만 조회 결과가 어떻게 나올지는 사람마다 다르고, 돈이 남아 있을 것이라고 장담할 수는 없어요.\n\n조회할 때 주의할 점\n\n- 조회 화면에는 계좌번호와 잔액이 나오니 캡처나 공유 전에 반드시 가려 주세요.\n- 인증서·휴대폰 인증 정보는 공식 사이트에서만 입력하세요.\n- 금융위원회는 금융회사가 이메일이나 문자로 신분증·계좌 비밀번호를 요구하지 않고, 환급을 이유로 수수료 이체를 요구하지 않으며, 별도 URL을 보내지 않는다고 안내해요. 이런 연락은 피싱을 의심하세요.\n- 어떤 금융상품을 가입하라거나 대출을 받으라는 안내와는 관계없는 조회 서비스예요.\n\n한눈에 정리\n\n- 공식 서비스: 파인 '내계좌 한눈에'(장기 미거래·휴면 금융자산 조회)\n- 접속은 공식 주소로, 인증은 공식 화면에서만\n- 세부 대상 기준은 시기에 따라 달라질 수 있으니 공식 안내 재확인\n\n제도와 화면은 바뀔 수 있으니 이용 전 금융감독원 공식 안내를 꼭 다시 확인해 주세요.", "copyAll": "오래전에 만든 통장이나 한동안 쓰지 않은 계좌, 한두 개쯤은 있으시죠? 그런 계좌에 돈이 남아 있는지 한 번에 확인할 수 있는 공식 서비스가 있어요. 금융감독원 금융소비자 정보포털 '파인'에서 안내하는 '내계좌 한눈에'입니다. 어떤 서비스인지, 어떻게 조회하는지 공식 안내를 중심으로 정리했어요. (2026년 10월 5일 기준)\n\n(사진 1 자리)\n\n'내계좌 한눈에'가 뭐예요?\n\n파인 안내에 따르면 '내계좌 한눈에(계좌정보통합관리 서비스)'는 내 장기 미거래·휴면 금융자산을 간편하게 조회하는 서비스예요. 조회 대상으로 예·적금, 신탁, 투자자 예탁금, 휴면예금, 보험금 등이 안내되어 있어요. 문의는 금감원 콜센터(1332)에서 받는다고 되어 있고요.\n\n접속 경로는 파인(fine.fss.or.kr)의 '내 돈 관리' 메뉴에서 '내계좌 통합조회 및 관리'를 찾아 들어가면 돼요. 공식 안내 화면에는 서비스 주소로 payinfo.or.kr이 표시되어 있어요. 검색 결과의 광고나 문자로 받은 링크 대신, 공식 주소를 직접 입력하거나 파인에서 들어가는 방법을 권해 드려요. (이 부분은 제 개인적인 권고예요.)\n\n어떤 자산을 찾을 수 있나?\n\n금융위원회 보도자료(2023년 11월 13일)를 참고하면 대략 이런 구분이 있어요.\n\n- 휴면금융자산: 소멸시효가 완성된 예금·보험금 등(휴면예금, 휴면보험금 등)\n- 장기미거래 금융자산: 3년 이상 거래(입출금 등)가 없는 예·적금, 투자자예탁금, 보험금, 신탁 등\n- 미사용 카드 포인트: 카드회원약관상 소멸시효가 5년이라서, 5년이 지나면 소멸할 수 있어요(금융위 2021년 1월 보도자료). 카드 포인트는 같은 경로의 '내 카드 한눈에'에서 조회·현금화할 수 있다고 안내돼요.\n\n금융위는 1년 이상 거래가 없고 잔고가 100만 원 이하인 예금·적금·투자자예탁금·신탁계좌는 즉시 환급받을 수도 있다고 안내해요. 다만 '내계좌 통합조회'로는 대부분의 장기미거래 금융자산만 조회된다고 하니, 모든 자산이 한 번에 나온다고 기대하기는 어려워요.\n\n내계좌 한눈에로 조회되지 않는 자산도 있어요. 미청구 보험금은 '내 보험 찾아줌'(생명·손해보험협회), 실기주과실은 한국예탁결제원에서 따로 조회해야 한다고 안내돼요. 파인의 '업권별 계좌 조회 및 관리' 페이지에는 2026년 10월 5일 확인 기준으로 은행연합회(휴면예금·휴면보험금), 저축은행, 새마을금고(휴면예금·휴면공제금), 서민금융진흥원, 금융투자협회(휴면성증권), 한국예탁결제원(미수령주식·실기주과실), 내 보험 찾아줌, 보험개발원(자동차보험 과납보험료), 여신금융협회(카드포인트), 예금보험공사(파산금융기관 미수령금), 민원24(미환급공과금) 등 기관별 조회 링크가 모여 있어요. 항목 수와 구성은 바뀔 수 있어서 개수는 따로 적지 않을게요.\n\n조회 순서 (금융위원회 안내 기준)\n\n1. PC는 파인(fine.fss.or.kr) 또는 payinfo.or.kr에 접속하고, 모바일은 '어카운트인포' 앱을 설치\n2. '내계좌 한눈에'(파인에서는 '내계좌 통합조회 및 관리') 선택\n3. 본인 인증(휴대폰 인증 등) 진행\n4. 본인 명의 계좌와 휴면·장기미거래 자산 확인(앱에서는 하단 '계좌' 또는 더보기 메뉴에서 찾을 수 있다고 안내)\n5. 필요한 경우 잔고 이전이나 미사용 계좌 해지 등 처리\n\n이 순서는 금융위원회 2023년 카드뉴스 안내를 바탕으로 한 것이라 현재 화면과 메뉴 이름이 조금 다를 수 있어요. [확인 필요: 현재 화면 구성은 직접 접속해 확인] 어카운트인포 앱은 금융위원회가 2025년 9월 휴면·장기미거래 금융자산 찾기 캠페인에서 안내한 공식 앱이에요.\n\n(사진 2 자리)\n\n어떤 분들이 한 번 확인해 보면 좋을까?\n\n이 부분은 공식 자료가 아니라 제 생각이에요. 학생 때나 첫 직장 시절에 급여 통장을 여러 개 만들었던 분, 이사나 이직을 하면서 쓰던 은행이 바뀐 분, 자동이체를 정리하지 않고 방치한 계좌가 있는 분이라면 한 번쯤 조회해 볼 만해요. 내 명의로 어떤 계좌가 남아 있는지 파악해 두면 쓰지 않는 계좌를 정리하는 데도 도움이 되고요. 다만 조회 결과가 어떻게 나올지는 사람마다 다르고, 돈이 남아 있을 것이라고 장담할 수는 없어요.\n\n조회할 때 주의할 점\n\n- 조회 화면에는 계좌번호와 잔액이 나오니 캡처나 공유 전에 반드시 가려 주세요.\n- 인증서·휴대폰 인증 정보는 공식 사이트에서만 입력하세요.\n- 금융위원회는 금융회사가 이메일이나 문자로 신분증·계좌 비밀번호를 요구하지 않고, 환급을 이유로 수수료 이체를 요구하지 않으며, 별도 URL을 보내지 않는다고 안내해요. 이런 연락은 피싱을 의심하세요.\n- 어떤 금융상품을 가입하라거나 대출을 받으라는 안내와는 관계없는 조회 서비스예요.\n\n한눈에 정리\n\n- 공식 서비스: 파인 '내계좌 한눈에'(장기 미거래·휴면 금융자산 조회)\n- 접속은 공식 주소로, 인증은 공식 화면에서만\n- 세부 대상 기준은 시기에 따라 달라질 수 있으니 공식 안내 재확인\n\n제도와 화면은 바뀔 수 있으니 이용 전 금융감독원 공식 안내를 꼭 다시 확인해 주세요.\n\n사진: stevepb / Wikimedia Commons (CC0, 표기 의무 없음 — 출처 병기 권장) https://commons.wikimedia.org/wiki/File:Piggy-bank-968302.jpg\n본 저작물은 한국관광공사에서 2015년 작성하여 공공누리 제1유형으로 개방한 '한국은행화폐박물관'을 이용하였으며, 해당 저작물은 공공누리(https://www.kogl.or.kr)에서 무료로 다운받으실 수 있습니다.\n\n이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 금융감독원 공식 안내를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 서비스 구성은 바뀔 수 있으니 이용 전 공식 안내를 다시 확인해 주세요.\n\n(참고: 광고·제휴·협찬·대가성 요소 없음. 금융상품·대출·카드 연결 없음.)", "search": "004 안 쓰는 계좌에 내 돈이 남아 있을지도? '내계좌 한눈에' 조회 방법 금융·자산조회 내계좌 한눈에, 휴면계좌, 장기미거래, 잠자는 내 돈 찾기 금감원 파인 '내계좌 한눈에'로 휴면·장기미거래 금융자산을 조회하는 방법과 피싱 주의점 정리 오래전에 만든 통장이나 한동안 쓰지 않은 계좌, 한두 개쯤은 있으시죠? 그런 계좌에 돈이 남아 있는지 한 번에 확인할 수 있는 공식 서비스가 있어요. 금융감독원 금융소비자 정보포털 '파인'에서 안내하는 '내계좌 한눈에'입니다. 어떤 서비스인지, 어떻게 조회하는지 공식 안내를 중심으로 정리했어요. (2026년 10월 5일 기준) (사진 1 자리) '내계좌 한눈에'가 뭐예요? 파인 안내에 따르면 '내계좌 한눈에(계좌정보통합관리 서비스)'는 내 장기 미거래·휴면 금융자산을 간편하게 조회하는 서비스예요. 조회 대상으로 예·적금, 신탁, 투자자 예탁금, 휴면예금, 보험금 등이 안내되어 있어요. 문의는 금감원 콜센터(1332)에서 받는다고 되어 있고요. 접속 경로는 파인(fine.fss.or.kr)의 '내 돈 관리' 메뉴에서 '내계좌 통합조회 및 관리'를 찾아 들어가면 돼요. 공식 안내 화면에는 서비스 주소로 payinfo.or.kr이 표시되어 있어요. 검색 결과의 광고나 문자로 받은 링크 대신, 공식 주소를 직접 입력하거나 파인에서 들어가는 방법을 권해 드려요. (이 부분은 제 개인적인 권고예요.) 어떤 자산을 찾을 수 있나? 금융위원회 보도자료(2023년 11월 13일)를 참고하면 대략 이런 구분이 있어요. - 휴면금융자산: 소멸시효가 완성된 예금·보험금 등(휴면예금, 휴면보험금 등) - 장기미거래 금융자산: 3년 이상 거래(입출금 등)가 없는 예·적금, 투자자예탁금, 보험금, 신탁 등 - 미사용 카드 포인트: 카드회원약관상 소멸시효가 5년이라서, 5년이 지나면 소멸할 수 있어요(금융위 2021년 1월 보도자료). 카드 포인트는 같은 경로의 '내 카드 한눈에'에서 조회·현금화할 수 있다고 안내돼요. 금융위는 1년 이상 거래가 없고 잔고가 100만 원 이하인 예금·적금·투자자예탁금·신탁계좌는 즉시 환급받을 수도 있다고 안내해요. 다만 '내계좌 통합조회'로는 대부분의 장기미거래 금융자산만 조회된다고 하니, 모든 자산이 한 번에 나온다고 기대하기는 어려워요. 내계좌 한눈에로 조회되지 않는 자산도 있어요. 미청구 보험금은 '내 보험 찾아줌'(생명·손해보험협회), 실기주과실은 한국예탁결제원에서 따로 조회해야 한다고 안내돼요. 파인의 '업권별 계좌 조회 및 관리' 페이지에는 2026년 10월 5일 확인 기준으로 은행연합회(휴면예금·휴면보험금), 저축은행, 새마을금고(휴면예금·휴면공제금), 서민금융진흥원, 금융투자협회(휴면성증권), 한국예탁결제원(미수령주식·실기주과실), 내 보험 찾아줌, 보험개발원(자동차보험 과납보험료), 여신금융협회(카드포인트), 예금보험공사(파산금융기관 미수령금), 민원24(미환급공과금) 등 기관별 조회 링크가 모여 있어요. 항목 수와 구성은 바뀔 수 있어서 개수는 따로 적지 않을게요. 조회 순서 (금융위원회 안내 기준) 1. PC는 파인(fine.fss.or.kr) 또는 payinfo.or.kr에 접속하고, 모바일은 '어카운트인포' 앱을 설치 2. '내계좌 한눈에'(파인에서는 '내계좌 통합조회 및 관리') 선택 3. 본인 인증(휴대폰 인증 등) 진행 4. 본인 명의 계좌와 휴면·장기미거래 자산 확인(앱에서는 하단 '계좌' 또는 더보기 메뉴에서 찾을 수 있다고 안내) 5. 필요한 경우 잔고 이전이나 미사용 계좌 해지 등 처리 이 순서는 금융위원회 2023년 카드뉴스 안내를 바탕으로 한 것이라 현재 화면과 메뉴 이름이 조금 다를 수 있어요. [확인 필요: 현재 화면 구성은 직접 접속해 확인] 어카운트인포 앱은 금융위원회가 2025년 9월 휴면·장기미거래 금융자산 찾기 캠페인에서 안내한 공식 앱이에요. (사진 2 자리) 어떤 분들이 한 번 확인해 보면 좋을까? 이 부분은 공식 자료가 아니라 제 생각이에요. 학생 때나 첫 직장 시절에 급여 통장을 여러 개 만들었던 분, 이사나 이직을 하면서 쓰던 은행이 바뀐 분, 자동이체를 정리하지 않고 방치한 계좌가 있는 분이라면 한 번쯤 조회해 볼 만해요. 내 명의로 어떤 계좌가 남아 있는지 파악해 두면 쓰지 않는 계좌를 정리하는 데도 도움이 되고요. 다만 조회 결과가 어떻게 나올지는 사람마다 다르고, 돈이 남아 있을 것이라고 장담할 수는 없어요. 조회할 때 주의할 점 - 조회 화면에는 계좌번호와 잔액이 나오니 캡처나 공유 전에 반드시 가려 주세요. - 인증서·휴대폰 인증 정보는 공식 사이트에서만 입력하세요. - 금융위원회는 금융회사가 이메일이나 문자로 신분증·계좌 비밀번호를 요구하지 않고, 환급을 이유로 수수료 이체를 요구하지 않으며, 별도 URL을 보내지 않는다고 안내해요. 이런 연락은 피싱을 의심하세요. - 어떤 금융상품을 가입하라거나 대출을 받으라는 안내와는 관계없는 조회 서비스예요. 한눈에 정리 - 공식 서비스: 파인 '내계좌 한눈에'(장기 미거래·휴면 금융자산 조회) - 접속은 공식 주소로, 인증은 공식 화면에서만 - 세부 대상 기준은 시기에 따라 달라질 수 있으니 공식 안내 재확인 제도와 화면은 바뀔 수 있으니 이용 전 금융감독원 공식 안내를 꼭 다시 확인해 주세요. 네이버"}, {"id": "003", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "003_car-inspection.md", "title": "자동차 정기검사 기간 놓치면 과태료 얼마? 예전 글과 달라진 기준 정리", "cands": ["자동차 정기검사 기간 놓치면 과태료 얼마? 예전 글과 달라진 기준 정리", "검사 만료일 '90일 전부터 31일 후까지', 이 숫자만 기억하세요", "자동차검사 예약부터 재검사 기간까지, 헷갈리는 날짜 한 번에 정리"], "cat": "자동차·운전", "kw": ["자동차 정기검사", "검사 기간", "과태료", "재검사"], "summary": "자동차 정기검사 기간(만료 전 90일~후 31일)·과태료·재검사 기간을 공단 FAQ 기준으로 정리", "status": "초안", "created": "2026-10-05 01:33", "base": "2026-10-05", "need": 0, "chars": 2048, "chars_ns": 1586, "imgs": 1, "slots": 2, "html": "<p>자동차검사 기간을 깜빡해서 과태료 고지서를 받았다는 이야기, 주변에서 한 번쯤 들어보셨을 거예요. 그런데 인터넷에는 예전 기준의 과태료 금액이 아직 많이 남아 있어서 헷갈리기 쉬워요. 그래서 TS한국교통안전공단의 공식 FAQ를 기준으로 기간과 과태료를 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<div class=\"ph-empty\"><b>사진 1 자리<\/b>대표 이미지: 사이버검사소(cyberts.kr) 예약 화면 또는 본인 자동차 검사유효기간 표시 화면 (차량번호 가림)<small>직접 찍거나 캡처한 사진을 넣는 위치 (개인정보 가림)<\/small><\/div>\n<h3>검사는 만료일 당일에만 받는 게 아니에요<\/h3>\n<p>정기검사는 검사유효기간 만료일 전 90일부터 후 31일까지를 검사기간으로 봐요. 이 기간 안에 적합 판정을 받으면 만료일에 검사를 받은 것으로 인정됩니다. 그러니 달력에 만료일 하나만 적어 두기보다, 만료일 약 3개월 전부터 여유 있게 예약해 두는 게 편해요. 기간 안에 검사를 마쳤다면 과태료 부과 대상이 아니라고 공단은 안내하고 있어요.<\/p>\n<p>예약은 사이버검사소(www.cyberts.kr)나 모바일, 또는 고객콜센터 1577-0990으로 할 수 있어요.<\/p>\n<h3>날짜로 감 잡기 (가상의 예시예요)<\/h3>\n<p>내 차의 검사유효기간 만료일이 2026년 11월 30일이라고 가정해 볼게요. 이때 정기검사기간은 90일 전인 2026년 9월 1일부터 31일 후인 12월 31일까지로 계산돼요. 이 기간 안에만 검사를 마치면 되는 거죠. 실제 내 차의 만료일과 검사기간은 자동차등록증이나 사이버검사소에서 꼭 확인해 주세요.<\/p>\n<h3>유효기간은 얼마나 될까?<\/h3>\n<p>공단 FAQ 기준으로 비사업용 승용차의 정기검사 유효기간은 2년이에요. 신조차로서 신규검사를 받은 것으로 보는 차량의 최초 검사유효기간은 5년이라고 되어 있고요. 사업용 승용차나 승합·화물차는 차종과 차령에 따라 다르니, 본인 차량이 어디에 해당하는지는 자동차등록증과 공단 안내에서 확인하셔야 해요. 다만 종합검사 대상지역(서울 전역, 인천 대부분, 경기 일부 시, 대전, 세종 등 — 정확한 목록은 한국교통안전공단 안내표 참조)에 등록된 비사업용 승용차는 차령이 4년을 넘으면 정기검사 대신 종합검사(정기검사+배출가스 정밀검사 통합)를 받고, 이때 검사 유효기간은 2년이라고 안내돼요. 내 차의 지역이 대상인지는 공단 종합검사 안내표에서 확인해 주세요.<\/p>\n<h3>기간을 넘기면 과태료는 얼마?<\/h3>\n<p>공단 FAQ에는 자동차관리법 시행령 별표 2의 부과기준이 이렇게 정리되어 있어요.<\/p>\n<div class=\"tw\"><table><thead><tr><th>검사 지연 기간<\/th><th>과태료<\/th><\/tr><\/thead><tbody><tr><td>30일 이내<\/td><td>4만 원<\/td><\/tr><tr><td>30일 초과 114일 이내<\/td><td>4만 원에 31일째부터 3일 초과할 때마다 2만 원 가산<\/td><\/tr><tr><td>115일 이상<\/td><td>60만 원<\/td><\/tr><\/tbody><\/table><\/div>\n<p>과태료는 공단이 아니라 차량이 등록된 지자체에서 부과해요. 그래서 고지서를 받았다면 정확한 금액과 계산 방식은 해당 지자체에 문의하는 게 가장 확실합니다. 가산 금액을 직접 계산하는 방법은 해석이 갈릴 수 있어서 이 글에서는 따로 예시를 만들지 않았어요.<\/p>\n<p>참고로 예전에 쓰인 글에는 \"2만 원부터 시작해 최대 30만 원\"이라고 적힌 경우가 많은데, 이는 2022년 4월 13일까지의 종전 기준이에요. 서울시 안내에 따르면 2022년 4월 14일부터 검사 지연 30일 이내 과태료가 2만 원에서 4만 원, 31일째부터 3일마다 가산 금액이 1만 원에서 2만 원, 115일 이상 최고액이 30만 원에서 60만 원으로 2배 올랐어요.<\/p>\n<h3>부적합이 나왔다면 재검사<\/h3>\n<p>검사에서 부적합 판정을 받으면 재검사를 받아야 하는데, 공단 안내에 따르면 재검사기간은 검사기간 만료 후 10일 이내예요(기간을 셀 때 토·일요일, 공휴일·대체공휴일, 근로자의 날은 제외한다고 안내돼요). 이 기간 안에 재검사를 신청하지 않거나 적합 판정을 받지 못하면 검사를 받지 않은 것으로 처리되고, 재검사기간 연장은 불가능하다고 해요.<\/p>\n<div class=\"ph-empty\"><b>사진 2 자리<\/b>검사유효기간·검사기간이 표시된 화면 또는 자동차등록증의 해당 부분 (개인정보 가림)<small>직접 찍거나 캡처한 사진을 넣는 위치 (개인정보 가림)<\/small><\/div>\n<h3>한눈에 정리<\/h3>\n<ul><li>검사기간은 만료일 전 90일 ~ 후 31일<\/li><li>기간 안에 받으면 과태료 없음<\/li><li>지연 시 30일 이내 4만 원, 115일 이상 60만 원 (사이 구간은 가산)<\/li><li>과태료 문의는 등록 지자체로<\/li><\/ul>\n<p>제도는 바뀔 수 있으니 검사 전에 TS한국교통안전공단 공식 안내를 한 번 더 확인해 주세요.<\/p><div class=\"gallery\"><div class=\"gl\">참고 이미지 (본문 하단·분위기용)<\/div><figure class=\"ph\"><img loading=\"lazy\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wgARCAHhAtADASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAIBAwQFBgf/xAAYAQEBAQEBAAAAAAAAAAAAAAAAAQIDBP/aAAwDAQACEAMQAAAB8iMCjBBIEgPZQGy3nTHVv4lp3H4bx1k59q31WXHPXruceevSnPW/OtOhQyJuisbabSm3qc+SclfVpvbNZSDgg4IOCDgg4IOCDgg4VlgVjgg4VlgVlgVFoVRaFUXBTFwUxeRQXhnm+DgeW+i+Fm880tjp0bcV+NxFNZ0bee8vQOfJwAn0+SJAkAJiQmAkAmVkmVmGeqS587LqMzSar8LHUOaGvJLLRLIM9e8bl6Zss95F1AABJBIQEkEhEgABBIAAAEEhBIQSEEhAARIQSEEhAAQtZb57N5zTp8qc9Xq6cumxLL+XXmtozaxqv5+mavnTpxvx4T6fIABMBJAERI0kkM22MB0g5hZVTSklj54NRlmNJRJc2WTTdTrl00Z0ss+g17KAAACYkAAAAAAAAAAAAAAAAAAAAIAAAAAAK+f5s3cynHuIkRLNUrF9uTTjfZ1Lv8/p5OPs86sDLfvGnVmt59PMST6vFBMkSSQlqFbQxG3DuLtBGU5oQqTZFYY15qrgkgYIYclWrNbZ5h/oVXUoAAACQAAAAAAAAAAAAAAAAAAAAACAAAAjmG7znO51WtSpFSpSikSRI92TRNei6nD6fm9bZqqYx07828Xa+Tol4pJ6PJAwQSEDyVBAPDE20BfFbwxFRroiCuBqWZ r\">https://main.kotsa.or.kr/portal/bbs/faq_list.do?menuCode=04010100<\/a><\/td><td>공식<\/td><\/tr><tr><td>정기검사 유효기간 표·재검사기간 산정<\/td><td>TS한국교통안전공단 정기검사 <a href=\"https://main.kotsa.or.kr/portal/contents.do?menuCode=01010200\" target=\"_blank\" rel=\"noopener noreferrer\">https://main.kotsa.or.kr/portal/contents.do?menuCode=01010200<\/a><\/td><td>공식<\/td><\/tr><tr><td>종합검사 대상지역·차종·유효기간<\/td><td>TS한국교통안전공단 종합검사 <a href=\"https://main.kotsa.or.kr/portal/contents.do?menuCode=01010300\" target=\"_blank\" rel=\"noopener noreferrer\">https://main.kotsa.or.kr/portal/contents.do?menuCode=01010300<\/a><\/td><td>공식<\/td><\/tr><tr><td>2022-04-14 과태료 상향<\/td><td>서울특별시 <a href=\"https://news.seoul.go.kr/traffic/archives/507609\" target=\"_blank\" rel=\"noopener noreferrer\">https://news.seoul.go.kr/traffic/archives/507609<\/a> ; 법률신문 <a href=\"https://www.lawtimes.co.kr/news/articleView.html?idxno=177520\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.lawtimes.co.kr/news/articleView.html?idxno=177520<\/a> ; 매일경제 <a href=\"https://www.mk.co.kr/news/society/10289630\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.mk.co.kr/news/society/10289630<\/a><\/td><td>공식(지자체)·2차(언론)<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "<p>사진: Shixart1985 / Wikimedia Commons / CC BY 2.0 (<a href=\"https://creativecommons.org/licenses/by/2.0\" target=\"_blank\" rel=\"noopener noreferrer\">https://creativecommons.org/licenses/by/2.0<\/a>) — 변경 시 변경 사실 표시 <a href=\"https://commons.wikimedia.org/wiki/File:Mechanic_works_on_car_engine_performing_routine_maintenance_and_inspections_on_vehicle_parts.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">https://commons.wikimedia.org/wiki/File:Mechanic_works_on_car_engine_performing_routine_maintenance_and_inspections_on_vehicle_parts.jpg<\/a> (사이즈 축소 외 변경 없음)<\/p>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 한국교통안전공단 공식 안내를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 과태료·기간은 바뀔 수 있으니 검사 전에 공식 안내를 다시 확인해 주세요.<\/blockquote>\n<p>(참고: 광고·제휴·협찬·대가성 요소 없음. 정비소·검사소 홍보나 특정 업체 추천은 넣지 않았습니다.)<\/p>", "open": false}], "plain": "자동차검사 기간을 깜빡해서 과태료 고지서를 받았다는 이야기, 주변에서 한 번쯤 들어보셨을 거예요. 그런데 인터넷에는 예전 기준의 과태료 금액이 아직 많이 남아 있어서 헷갈리기 쉬워요. 그래서 TS한국교통안전공단의 공식 FAQ를 기준으로 기간과 과태료를 정리했습니다. (2026년 10월 5일 기준)\n\n(사진 1 자리)\n\n검사는 만료일 당일에만 받는 게 아니에요\n\n정기검사는 검사유효기간 만료일 전 90일부터 후 31일까지를 검사기간으로 봐요. 이 기간 안에 적합 판정을 받으면 만료일에 검사를 받은 것으로 인정됩니다. 그러니 달력에 만료일 하나만 적어 두기보다, 만료일 약 3개월 전부터 여유 있게 예약해 두는 게 편해요. 기간 안에 검사를 마쳤다면 과태료 부과 대상이 아니라고 공단은 안내하고 있어요.\n\n예약은 사이버검사소(www.cyberts.kr)나 모바일, 또는 고객콜센터 1577-0990으로 할 수 있어요.\n\n날짜로 감 잡기 (가상의 예시예요)\n\n내 차의 검사유효기간 만료일이 2026년 11월 30일이라고 가정해 볼게요. 이때 정기검사기간은 90일 전인 2026년 9월 1일부터 31일 후인 12월 31일까지로 계산돼요. 이 기간 안에만 검사를 마치면 되는 거죠. 실제 내 차의 만료일과 검사기간은 자동차등록증이나 사이버검사소에서 꼭 확인해 주세요.\n\n유효기간은 얼마나 될까?\n\n공단 FAQ 기준으로 비사업용 승용차의 정기검사 유효기간은 2년이에요. 신조차로서 신규검사를 받은 것으로 보는 차량의 최초 검사유효기간은 5년이라고 되어 있고요. 사업용 승용차나 승합·화물차는 차종과 차령에 따라 다르니, 본인 차량이 어디에 해당하는지는 자동차등록증과 공단 안내에서 확인하셔야 해요. 다만 종합검사 대상지역(서울 전역, 인천 대부분, 경기 일부 시, 대전, 세종 등 — 정확한 목록은 한국교통안전공단 안내표 참조)에 등록된 비사업용 승용차는 차령이 4년을 넘으면 정기검사 대신 종합검사(정기검사+배출가스 정밀검사 통합)를 받고, 이때 검사 유효기간은 2년이라고 안내돼요. 내 차의 지역이 대상인지는 공단 종합검사 안내표에서 확인해 주세요.\n\n기간을 넘기면 과태료는 얼마?\n\n공단 FAQ에는 자동차관리법 시행령 별표 2의 부과기준이 이렇게 정리되어 있어요.\n\n• 30일 이내 — 과태료: 4만 원\n• 30일 초과 114일 이내 — 과태료: 4만 원에 31일째부터 3일 초과할 때마다 2만 원 가산\n• 115일 이상 — 과태료: 60만 원\n\n과태료는 공단이 아니라 차량이 등록된 지자체에서 부과해요. 그래서 고지서를 받았다면 정확한 금액과 계산 방식은 해당 지자체에 문의하는 게 가장 확실합니다. 가산 금액을 직접 계산하는 방법은 해석이 갈릴 수 있어서 이 글에서는 따로 예시를 만들지 않았어요.\n\n참고로 예전에 쓰인 글에는 \"2만 원부터 시작해 최대 30만 원\"이라고 적힌 경우가 많은데, 이는 2022년 4월 13일까지의 종전 기준이에요. 서울시 안내에 따르면 2022년 4월 14일부터 검사 지연 30일 이내 과태료가 2만 원에서 4만 원, 31일째부터 3일마다 가산 금액이 1만 원에서 2만 원, 115일 이상 최고액이 30만 원에서 60만 원으로 2배 올랐어요.\n\n부적합이 나왔다면 재검사\n\n검사에서 부적합 판정을 받으면 재검사를 받아야 하는데, 공단 안내에 따르면 재검사기간은 검사기간 만료 후 10일 이내예요(기간을 셀 때 토·일요일, 공휴일·대체공휴일, 근로자의 날은 제외한다고 안내돼요). 이 기간 안에 재검사를 신청하지 않거나 적합 판정을 받지 못하면 검사를 받지 않은 것으로 처리되고, 재검사기간 연장은 불가능하다고 해요.\n\n(사진 2 자리)\n\n한눈에 정리\n\n- 검사 래서 고지서를 받았다면 정확한 금액과 계산 방식은 해당 지자체에 문의하는 게 가장 확실합니다. 가산 금액을 직접 계산하는 방법은 해석이 갈릴 수 있어서 이 글에서는 따로 예시를 만들지 않았어요. 참고로 예전에 쓰인 글에는 \"2만 원부터 시작해 최대 30만 원\"이라고 적힌 경우가 많은데, 이는 2022년 4월 13일까지의 종전 기준이에요. 서울시 안내에 따르면 2022년 4월 14일부터 검사 지연 30일 이내 과태료가 2만 원에서 4만 원, 31일째부터 3일마다 가산 금액이 1만 원에서 2만 원, 115일 이상 최고액이 30만 원에서 60만 원으로 2배 올랐어요. 부적합이 나왔다면 재검사 검사에서 부적합 판정을 받으면 재검사를 받아야 하는데, 공단 안내에 따르면 재검사기간은 검사기간 만료 후 10일 이내예요(기간을 셀 때 토·일요일, 공휴일·대체공휴일, 근로자의 날은 제외한다고 안내돼요). 이 기간 안에 재검사를 신청하지 않거나 적합 판정을 받지 못하면 검사를 받지 않은 것으로 처리되고, 재검사기간 연장은 불가능하다고 해요. (사진 2 자리) 한눈에 정리 - 검사기간은 만료일 전 90일 ~ 후 31일 - 기간 안에 받으면 과태료 없음 - 지연 시 30일 이내 4만 원, 115일 이상 60만 원 (사이 구간은 가산) - 과태료 문의는 등록 지자체로 제도는 바뀔 수 있으니 검사 전에 TS한국교통안전공단 공식 안내를 한 번 더 확인해 주세요. 네이버"}, {"id": "002", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "002_k-pass-oct-2026.md", "title": "K-패스 10월 이용분부터 뭐가 달라질까? 반값 정액형은 끝, 시차시간 혜택은 12월까지", "cands": ["K-패스 10월 이용분부터 뭐가 달라질까? 반값 정액형은 끝, 시차시간 혜택은 12월까지", "출퇴근 시간대에 따라 환급률이 달라진다고요? 모두의카드 시차시간 정리", "9월에 반값 모두의카드 쓰셨다면, 10월 전에 확인할 것 3가지"], "cat": "교통·모빌리티", "kw": ["K-패스", "모두의카드", "시차시간 인센티브", "정액형 환급"], "summary": "K-패스(모두의카드) 10월 이용분부터 정액형 반값 종료·시차시간 혜택 12월 연장 등 달라지는 점 정리", "status": "초안", "created": "2026-10-05 01:33", "base": "2026-10-05", "need": 0, "chars": 2124, "chars_ns": 1658, "imgs": 2, "slots": 2, "html": "<p>9월까지 '반값 모두의카드' 혜택을 받고 계셨다면, 10월부터 달라지는 부분이 있어요. 국토교통부가 2026년 9월 28일에 발표한 내용을 기준으로, 무엇이 끝나고 무엇이 이어지는지 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<div class=\"ph-empty\"><b>사진 1 자리<\/b>대표 이미지: K-패스(모두의카드) 앱의 월별 환급 내역 화면 (카드번호·이름 가림)<small>직접 찍거나 캡처한 사진을 넣는 위치 (개인정보 가림)<\/small><\/div>\n<h3>먼저 용어부터: 정액형과 정률형<\/h3>\n<p>모두의카드는 올해 초 도입된 K-패스 확대 개편 제도예요. 크게 두 가지 방식이 있어요.<\/p>\n<ul><li>정률형(기본형): 이용금액의 일정 비율을 돌려받는 방식이에요. 기본 환급률은 유형에 따라 일반 20%, 청년·2자녀·어르신 30%, 3자녀 이상 50%, 저소득층 53.3%입니다. (국토교통부 안내 기준)<\/li><li>정액형(일반형·플러스형): 한 달 대중교통비가 정해진 환급 기준금액을 넘으면, 넘은 금액을 전액 돌려주는 방식이에요. 일반형은 3천 원 미만 이용내역, 플러스형은 전체 이용내역이 대상이라고 한국교통안전공단이 안내해요.<\/li><li>월 1일~말일 기준으로 대중교통을 15회 이상 이용하면 기본형·일반형·플러스형 중 가장 유리한 유형이 자동 적용되고 다음 달에 환급된다고 한국교통안전공단이 안내하고 있어요.<\/li><\/ul>\n<h3>끝나는 것: 정액형 기준금액 50% 인하<\/h3>\n<p>정부는 올해 추경으로 4월부터 6개월간 두 가지 추가 혜택을 시행했어요. 하나는 정액형 환급 기준금액을 50% 낮춘 것, 다른 하나는 출퇴근 혼잡시간 전후에 이용하면 정률형 환급률에 30%포인트를 더해 주는 것이었죠. 이 중 기준금액 인하, 이른바 '반값 정액형'은 예정대로 9월 이용분까지만 적용되고 끝납니다. 그러니 10월 이용분부터는 원래 기준금액이 적용돼요. 기준금액은 지역과 유형마다 다르기 때문에 내 금액은 앱이나 카드사 안내에서 꼭 확인하셔야 해요. 예를 들어 수도권 일반 국민의 정액형 일반형 기준금액은 원래 6만 2천 원(플러스형 10만 원)인데, 추경 기간(4~9월 이용분)에는 3만 원(플러스형 5만 원)이었다고 국토교통부와 한국교통안전공단이 안내했어요. 10월 이용분부터는 원래 금액으로 돌아가는 구조예요. 지역·유형별 전체 금액표는 공식 홈페이지에서 확인해 주세요.<\/p>\n<h3>이어지는 것: 시차시간 인센티브는 12월까지<\/h3>\n<p>반대로 시차시간 인센티브는 올해 말까지 연장됩니다. 적용 시간대는 아래 네 구간이에요.<\/p>\n<ul><li>오전 5:30~6:30<\/li><li>오전 9:00~10:00<\/li><li>오후 16:00~17:00<\/li><li>오후 19:00~20:00<\/li><\/ul>\n<p>이 시간대에 대중교통을 이용하면 환급률이 이렇게 올라가요.<\/p>\n<div class=\"tw\"><table><thead><tr><th>구분<\/th><th>기본 환급률<\/th><th>시차시간 환급률<\/th><\/tr><\/thead><tbody><tr><td>일반<\/td><td>20%<\/td><td>50%<\/td><\/tr><tr><td>청년·2자녀·어르신<\/td><td>30%<\/td><td>60%<\/td><\/tr><tr><td>3자녀 이상<\/td><td>50%<\/td><td>80%<\/td><\/tr><tr><td>저소득층<\/td><td>53.3%<\/td><td>83.3%<\/td><\/tr><\/tbody><\/table><\/div>\n<p>국토부는 내년에도 이어가기 위해 2027년 정부 예산안에 관련 예산을 반영했다고 밝혔어요. 다만 예산안은 국회 심의를 거쳐야 하니 내년 시행이 확정이라고 단정하기는 어렵습니다. (국토부 보도자료는 '예산안 반영'까지만 언급하고, 확정 여부는 밝히지 않았어요.)<\/p>\n<h3>숫자로 이해해 보기 (가상의 예시예요)<\/h3>\n<p>실제 내 환급액은 아니고 계산을 위한 가상 예시예요. 일반 이용자가 한 달에 시차시간대로 대중교통비 5만 원을 썼다고 가정해 볼게요. 기본 환급률 20%라면 1만 원이지만, 시차시간 환급률 50%가 적용되면 2만 5천 원이 됩니다. 같은 금액을 써도 이용 시간대에 따라 돌려받는 금액이 달라질 수 있다는 뜻이에요. 다만 실제 환급은 이용 횟수, 카드, 정액형 적용 여부 등에 따라 달라질 수 있어서 정확한 금액은 앱 안내를 기준으로 봐야 해요.<\/p>\n<h3>효과는 어땠을까<\/h3>\n<p>국토부 자료에 따르면 추경 혜택 시행 이후 모두의카드 이용자의 1인당 월평균 환급액은 2만 700원에서 4만 1,300원으로 약 두 배가 됐고, 월평균 환급자는 283만 명에서 346만 명으로 늘었다고 해요.<\/p>\n<h3>10월 전에 확인할 것 3가지<\/h3>\n<ol><li>내 유형(일반·청년 등)과 거주 지역이 앱에 맞게 등록되어 있는지<\/li><li>카드사·모두의카드 앱 알림으로 오는 변경 안내가 있는지<\/li><li>월 15회 이상 이용 같은 기본 조건은 한국교통안전공단 안내 기준으로 다시 보기<\/li><\/ol>\n<div class=\"ph-empty\"><b>사진 2 자리<\/b>내 환급률/시간대별 혜택 안내 화면 (본인 앱 캡처)<small>직접 찍거나 캡처한 사진을 넣는 위치 (개인정보 가림)<\/small><\ , <a href=\"https://main.kotsa.or.kr/portal/contents.do?menuCode=01080300\" target=\"_blank\" rel=\"noopener noreferrer\">https://main.kotsa.or.kr/portal/contents.do?menuCode=01080300<\/a><\/td><\/tr><tr><td>2-2<\/td><td>월 15회 이상 이용 조건 / 유리한 유형 자동 적용<\/td><td>확인됨<\/td><td>한국교통안전공단: 월 15회 이상 시 기본형/일반형/플러스형 중 가장 유리한 유형 자동 적용, 익월 환급 — 위 공단 URL<\/td><\/tr><tr><td>2-3<\/td><td>시차시간 4구간(05:30~06:30, 09:00~10:00, 16:00~17:00, 19:00~20:00)<\/td><td>확인됨<\/td><td>국토부 2026-04-23 안내에 동일 시간대 명시, 9/28 보도(아주경제)도 12월까지 동일 — 위 정책브리핑 URL<\/td><\/tr><tr><td>2-4<\/td><td>유형별 환급률(시차 50/60/80/83.3%, 기본 20/30/50/53.3%)<\/td><td>확인됨<\/td><td>국토부 2026-04-23 안내(일반 50/20, 청년·2자녀·어르신 60/30, 3자녀 50→80, 저소득 83.3/53.3). 9/28 정책브리핑: \"20~53.3%에서 30%p 추가, 최대 83.3%\" — <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148972677\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyNewsView.do?newsId=148972677<\/a><\/td><\/tr><tr><td>2-5<\/td><td>국토부 원문 수치(1인당 월평균 환급 2만 700→4만 1,300원, 환급자 283만→346만 명, 반값 정액형 9월 이용분까지, 시차 혜택 12월까지, 2027 예산안 반영)<\/td><td>확인됨<\/td><td>정책브리핑 원문 2026-09-28 대조 일치(원문에 '20207년'이라는 오타가 있으나 2027년 예산안 취지)<\/td><\/tr><tr><td>2-6<\/td><td>내년(2027) 시행 확정 여부<\/td><td>확인 불가<\/td><td>원문은 \"예산안 반영\"까지만 기재. 국회 심의 결과는 확인 불가 → 본문에 단정 안 함<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>정액형 기준금액 50% 인하는 9월 이용분까지, 시차시간 인센티브 12월까지 연장, 2027 예산안 반영, 수치(2만 700→4만 1,300원 등), 정률형 기본 20~53.3%+30%p, 최대 83.3%<\/td><td>대한민국 정책브리핑(국토교통부) <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148972677\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyNewsView.do?newsId=148972677<\/a> (2026-09-28)<\/td><td>공식<\/td><\/tr><tr><td>추경 후 기준금액(수도권·일반지방권·우대·특별지원지역별), 시차시간 4구간, 유형별 환급률<\/td><td>정책브리핑(국토교통부) <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148963193\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyNewsView.do?newsId=148963193<\/a> (2026-04-23)<\/td><td>공식<\/td><\/tr><tr><td>원래 기준금액 표, 월 15회 이상·유리한 유형 자동 적용, 기본형 환급 비율<\/td><td>TS한국교통안전공단 <a href=\"https://main.kotsa.or.kr/portal/contents.do?menuCode=01080300\" target=\"_blank\" rel=\"noopener noreferrer\">https://main.kotsa.or.kr/portal/contents.do?menuCode=01080300<\/a><\/td><td>공식<\/td><\/tr><tr><td>보도 해설(교차 확인용)<\/td><td>아주경제 <a href=\"https://www.ajunews.com/view/20260928093805116\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.ajunews.com/view/20260928093805116<\/a> (2026-09-28)<\/td><td>2차(언론, 국토부 인용)<\/td><\/tr><tr><td>(참고) \"10월부터 전부 원래대로\" 주장<\/td><td>moneyroan 등 일부 글<\/td><td>국토부 9/28 보도와 불일치(시차시간 혜택은 12월까지 유지) → 사용 안 함<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "<p>사진: MonasteryInwang / Wikimedia Commons (CC0, 표기 의무 없음 — 출처 병기 권장) <a href=\"https://commons.wikimedia.org/wiki/File:Jongno_Sports_and_Culture_Center_Bus_stop.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">https://commons.wikimedia.org/wiki/File:Jongno_Sports_and_Culture_Center_Bus_stop.jpg<\/a><br>사진: LandAndTree / Wikimedia Commons / CC BY 4.0 (<a href=\"https://creativecommons.org/licenses/by/4.0\" target=\"_blank\" rel=\"noopener noreferrer\">https://creativecommons.org/licenses/by/4.0<\/a>) — 변경 시 변경 사실 표시 <a href=\"https://commons.wikimedia.org/wiki/File:Suin%E2%80%93Bundang_Line_(Korail_Class_319000\" target=\"_blank\" rel=\"noopener noreferrer\">https://commons.wikimedia.org/wiki/File:Suin%E2%80%93Bundang_Line_(Korail_Class_319000<\/a>)_20240713_(01).jpg (사이즈 축소 외 변경 없음)<\/p>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 국토교통부 보도자료 등 공식 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 환급 조건은 바뀔 수 있으니 공식 홈페이지·앱 공지를 다시 확인해 주세요.<\/blockquote>\n<p>(참고: 광고·제휴·협찬·대가성 요소 없음. 카드 발급 링크나 카드사 혜택 안내는 넣지 않았습니다.)<\/p>", "open": false}], "plain": "9월까지 '반값 모두의카드' 혜택을 받고 계셨다면, 10월부터 달라지는 부분이 있어요. 국토교통부가 2026년 9월 28일에 발표한 내용을 기준으로, 무엇이 끝나고 무엇이 이어지는지 정리했습니다. (2026년 10월 5일 기준)\n\n(사진 1 자리)\n\n먼저 용어부터: 정액형과 정률형\n\n모두의카드는 올해 초 도입된 K-패스 확대 개편 제도예요. 크게 두 가지 방식이 있어요.\n\n- 정률형(기본형): 이용금액의 일정 비율을 돌려받는 방식이에요. 기본 환급률은 유형에 따라 일반 20%, 청년·2자녀·어르신 30%, 3자녀 이상 50%, 저소득층 53.3%입니다. (국토교통부 안내 기준)\n- 정액형(일반형·플러스형): 한 달 대중교통비가 정해진 환급 기준금액을 넘으면, 넘은 금액을 전액 돌려주는 방식이에요. 일반형은 3천 원 미만 이용내역, 플러스형은 전체 이용내역이 대상이라고 한국교통안전공단이 안내해요.\n- 월 1일~말일 기준으로 대중교통을 15회 이상 이용하면 기본형·일반형·플러스형 중 가장 유리한 유형이 자동 적용되고 다음 달에 환급된다고 한국교통안전공단이 안내하고 있어요.\n\n끝나는 것: 정액형 기준금액 50% 인하\n\n정부는 올해 추경으로 4월부터 6개월간 두 가지 추가 혜택을 시행했어요. 하나는 정액형 환급 기준금액을 50% 낮춘 것, 다른 하나는 출퇴근 혼잡시간 전후에 이용하면 정률형 환급률에 30%포인트를 더해 주는 것이었죠. 이 중 기준금액 인하, 이른바 '반값 정액형'은 예정대로 9월 이용분까지만 적용되고 끝납니다. 그러니 10월 이용분부터는 원래 기준금액이 적용돼요. 기준금액은 지역과 유형마다 다르기 때문에 내 금액은 앱이나 카드사 안내에서 꼭 확인하셔야 해요. 예를 들어 수도권 일반 국민의 정액형 일반형 기준금액은 원래 6만 2천 원(플러스형 10만 원)인데, 추경 기간(4~9월 이용분)에는 3만 원(플러스형 5만 원)이었다고 국토교통부와 한국교통안전공단이 안내했어요. 10월 이용분부터는 원래 금액으로 돌아가는 구조예요. 지역·유형별 전체 금액표는 공식 홈페이지에서 확인해 주세요.\n\n이어지는 것: 시차시간 인센티브는 12월까지\n\n반대로 시차시간 인센티브는 올해 말까지 연장됩니다. 적용 시간대는 아래 네 구간이에요.\n\n- 오전 5:30~6:30\n- 오전 9:00~10:00\n- 오후 16:00~17:00\n- 오후 19:00~20:00\n\n이 시간대에 대중교통을 이용하면 환급률이 이렇게 올라가요.\n\n• 일반 — 기본 환급률: 20% / 시차시간 환급률: 50%\n• 청년·2자녀·어르신 — 기본 환급률: 30% / 시차시간 환급률: 60%\n• 3자녀 이상 — 기본 환급률: 50% / 시차시간 환급률: 80%\n• 저소득층 — 기본 환급률: 53.3% / 시차시간 환급률: 83.3%\n\n국토부는 내년에도 이어가기 위해 2027년 정부 예산안에 관련 예산을 반영했다고 밝혔어요. 다만 예산안은 국회 심의를 거쳐야 하니 내년 시행이 확정이라고 단정하기는 어렵습니다. (국토부 보도자료는 '예산안 반영'까지만 언급하고, 확정 여부는 밝히지 않았어요.)\n\n숫자로 이해해 보기 (가상의 예시예요)\n\n실제 내 환급액은 아니고 계산을 위한 가상 예시예요. 일반 이용자가 한 달에 시차시간대로 대중교통비 5만 원을 썼다고 가정해 볼게요. 기본 환급률 20%라면 1만 원이지만, 시차시간 환급률 50%가 적용되면 2만 5천 원이 됩니다. 같은 금액을 써도 이용 시간대에 따라 돌려받는 금액이 달라질 수 있다는 뜻이에요. 다만 실제 환급은 이용 횟수, 카드, 정액형 적용 여부 등에 따라 달라질 수 있어서 정확한 금액은 앱 안내를 기준으로 봐야 해요.\n\n효과는 어땠을까\n\n국토부 자료에 따르면 추경 혜택 시행 이후 모두의카드 이용자의 1인당 월평균 환급액은 2만 700원에서 4만 1,300원으로 약 두 배가 됐고, 월평균 환급자는 283만 명에서 346만 명으로 늘었다고 해요.\n\n10월 전에 확인할 것 3가지\n\n1. 내 유형(일반·청년 등)과 거주 지역이 앱에 맞게 등록되어 있는지\n2. 카드사·모두의카드 앱 알림으로 오는 변경 안내가 있는지\n3. 월 15회 이상 이용 같은 기본 조건은 한국교통안전공단 안내 기준으로 다시 보기\n\n(사진 2 자리)\n\n제도는 바뀔 수 있으니 최종 내용은 모두의카드 공식 홈페이지와 앱 공지를 꼭 확인해 주세요.", "copyAll": "9월까지 '반값 모두의카드' 혜택을 받고 계셨다면, 10월부터 달라지는 부분이 있어요. 국토교통부가 2026년 9월 28일에 발표한 내용을 기준으로, 무엇이 끝나고 무엇이 이어지는지 정리했습니다. (2026년 10월 5일 기준)\n\n(사진 1 자리)\n\n먼저 용어부터: 정액형과 정률형\n\n모두의카드는 올해 초 도입된 K-패스 확대 개편 제도예요. 크게 두 가지 방식이 있어요.\n\n- 정률형(기본형): 이용금액의 일정 비율을 돌려받는 방식이에요. 기본 환급률은 유형에 따라 일반 20%, 청년·2자녀·어르신 30%, 3자녀 이상 50%, 저소득층 53.3%입니다. (국토교통부 안내 기준)\n- 정액형(일반형·플러스형): 한 달 대중교통비가 정해진 환급 기준금액을 넘으면, 넘은 금액을 전액 돌려주는 방식이에요. 일반형은 3천 원 미만 이용내역, 플러스형은 전체 이용내역이 대상이라고 한국교통안전공단이 안내해요.\n- 월 1일~말일 기준으로 대중교통을 15회 이상 이용하면 기본형·일반형·플러스형 중 가장 유리한 유형이 자동 적용되고 다음 달에 환급된다고 한국교통안전공단이 안내하고 있어요.\n\n끝나는 것: 정액형 기준금액 50% 인하\n\n정부는 올해 추경으로 4월부터 6개월간 두 가지 추가 혜택을 시행했어요. 하나는 정액형 환급 기준금액을 50% 낮춘 것, 다른 하나는 출퇴근 혼잡시간 전후에 이용하면 정률형 환급률에 30%포인트를 더해 주는 것이었죠. 이 중 기준금액 인하, 이른바 '반값 정액형'은 예정대로 9월 이용분까지만 적용되고 끝납니다. 그러니 10월 이용분부터는 원래 기준금액이 적용돼요. 기준금액은 지역과 유형마다 다르기 때문에 내 금액은 앱이나 카드사 안내에서 꼭 확인하셔야 해요. 예를 들어 수도권 일반 국민의 정액형 일반형 기준금액은 원래 6만 2천 원(플러스형 10만 원)인데, 추경 기간(4~9월 이용분)에는 3만 원(플러스형 5만 원)이었다고 국토교통부와 한국교통안전공단이 안내했어요. 10월 이용분부터는 원래 금액으로 돌아가는 구조예요. 지역·유형별 전체 금액표는 공식 홈페이지에서 확인해 주세요.\n\n이어지는 것: 시차시간 인센티브는 12월까지\n\n반대로 시차시간 인센티브는 올해 말까지 연장됩니다. 적용 시간대는 아래 네 구간이에요.\n\n- 오전 5:30~6:30\n- 오전 9:00~10:00\n- 오후 16:00~17:00\n- 오후 19:00~20:00\n\n이 시간대에 대중교통을 이용하면 환급률이 이렇게 올라가요.\n\n• 일반 — 기본 환급률: 20% / 시차시간 환급률: 50%\n• 청년·2자녀·어르신 — 기본 환급률: 30% / 시차시간 환급률: 60%\n• 3자녀 이상 — 기본 환급률: 50% / 시차시간 환급률: 80%\n• 저소득층 — 기본 환급률: 53.3% / 시차시간 환급률: 83.3%\n\n국토부는 내년에도 이어가기 위해 2027년 정부 예산안에 관련 예산을 반영했다고 밝혔어요. 다만 예산안은 국회 심의를 거쳐야 하니 내년 시행이 확정이라고 단정하기는 어렵습니다. (국토부 보도자료는 '예산안 반영'까지만 언급하고, 확정 여부는 밝히지 않았어요.)\n\n숫자로 이해해 보기 (가상의 예시예요)\n\n실제 내 환급액은 아니고 계산을 위한 가상 예시예요. 일반 이용자가 한 달에 시차시간대로 대중교통비 5만 원을 썼다고 가정해 볼게요. 기본 환급률 20%라면 1만 원이지만, 시차시간 환급률 50%가 적용되면 2만 5천 원이 됩니다. 같은 금액을 써도 이용 시간대에 따라 돌려받는 금액이 달라질 수 있다는 뜻이에요. 다만 실제 환급은 이용 횟수, 카드, 정액형 적용 여부 등에 따라 달라질 수 있어서 정확한 금액은 앱 안내를 기준으로 봐야 해요.\n\n효과는 어땠을까\n\n국토부 자료에 따르면 추경 혜택 시행 이후 모두의카드 이용자의 1인당 월평균 환급액은 2만 700원에서 4만 1,300원으로 약 두 배가 됐고, 월평균 환급자는 283만 명에서 346만 명으로 늘었다고 해요.\n\n10월 전에 확인할 것 3가지\n\n1. 내 유형(일반·청년 등)과 거주 지역이 앱에 맞게 등록되어 있는지\n2. 카드사·모두의카드 앱 알림으로 오는 변경 안내가 있는지\n3. 월 15회 이상 이용 같은 기본 조건은 한국교통안전공단 안내 기준으로 다시 보기\n\n(사진 2 자리)\n\n제도는 바뀔 수 있으니 최종 내용은 모두의카드 공식 홈페이지와 앱 공지를 꼭 확인해 주세요.\n\n사진: MonasteryInwang / Wikimedia Commons (CC0, 표기 의무 없음 — 출처 병기 권장) https://commons.wikimedia.org/wiki/File:Jongno_Sports_and_Culture_Center_Bus_stop.jpg\n사진: LandAndTree / Wikimedia Commons / CC BY 4.0 (https://creativecommons.org/licenses/by/4.0) — 변경 시 변경 사실 표시 https://commons.wikimedia.org/wiki/File:Suin%E2%80%93Bundang_Line_(Korail_Class_319000)_20240713_(01).jpg (사이즈 축소 외 변경 없음)\n\n이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 국토교통부 보도자료 등 공식 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 환급 조건은 바뀔 수 있으니 공식 홈페이지·앱 공지를 다시 확인해 주세요.\n\n(참고: 광고·제휴·협찬·대가성 요소 없음. 카드 발급 링크나 카드사 혜택 안내는 넣지 않았습니다.)", "search": "002 K-패스 10월 이용분부터 뭐가 달라질까? 반값 정액형은 끝, 시차시간 혜택은 12월까지 교통·모빌리티 K-패스, 모두의카드, 시차시간 인센티브, 정액형 환급 K-패스(모두의카드) 10월 이용분부터 정액형 반값 종료·시차시간 혜택 12월 연장 등 달라지는 점 정리 9월까지 '반값 모두의카드' 혜택을 받고 계셨다면, 10월부터 달라지는 부분이 있어요. 국토교통부가 2026년 9월 28일에 발표한 내용을 기준으로, 무엇이 끝나고 무엇이 이어지는지 정리했습니다. (2026년 10월 5일 기준) (사진 1 자리) 먼저 용어부터: 정액형과 정률형 모두의카드는 올해 초 도입된 K-패스 확대 개편 제도예요. 크게 두 가지 방식이 있어요. - 정률형(기본형): 이용금액의 일정 비율을 돌려받는 방식이에요. 기본 환급률은 유형에 따라 일반 20%, 청년·2자녀·어르신 30%, 3자녀 이상 50%, 저소득층 53.3%입니다. (국토교통부 안내 기준) - 정액형(일반형·플러스형): 한 달 대중교통비가 정해진 환급 기준금액을 넘으면, 넘은 금액을 전액 돌려주는 방식이에요. 일반형은 3천 원 미만 이용내역, 플러스형은 전체 이용내역이 대상이라고 한국교통안전공단이 안내해요. - 월 1일~말일 기준으로 대중교통을 15회 이상 이용하면 기본형·일반형·플러스형 중 가장 유리한 유형이 자동 적용되고 다음 달에 환급된다고 한국교통안전공단이 안내하고 있어요. 끝나는 것: 정액형 기준금액 50% 인하 정부는 올해 추경으로 4월부터 6개월간 두 가지 추가 혜택을 시행했어요. 하나는 정액형 환급 기준금액을 50% 낮춘 것, 다른 하나는 출퇴근 혼잡시간 전후에 이용하면 정률형 환급률에 30%포인트를 더해 주는 것이었죠. 이 중 기준금액 인하, 이른바 '반값 정액형'은 예정대로 9월 이용분까지만 적용되고 끝납니다. 그러니 10월 이용분부터는 원래 기준금액이 적용돼요. 기준금액은 지역과 유형마다 다르기 때문에 내 금액은 앱이나 카드사 안내에서 꼭 확인하셔야 해요. 예를 들어 수도권 일반 국민의 정액형 일반형 기준금액은 원래 6만 2천 원(플러스형 10만 원)인데, 추경 기간(4~9월 이용분)에는 3만 원(플러스형 5만 원)이었다고 국토교통부와 한국교통안전공단이 안내했어요. 10월 이용분부터는 원래 금액으로 돌아가는 구조예요. 지역·유형별 전체 금액표는 공식 홈페이지에서 확인해 주세요. 이어지는 것: 시차시간 인센티브는 12월까지 반대로 시차시간 인센티브는 올해 말까지 연장됩니다. 적용 시간대는 아래 네 구간이에요. - 오전 5:30~6:30 - 오전 9:00~10:00 - 오후 16:00~17:00 - 오후 19:00~20:00 이 시간대에 대중교통을 이용하면 환급률이 이렇게 올라가요. • 일반 — 기본 환급률: 20% / 시차시간 환급률: 50% • 청년·2자녀·어르신 — 기본 환급률: 30% / 시차시간 환급률: 60% • 3자녀 이상 — 기본 환급률: 50% / 시차시간 환급률: 80% • 저소득층 — 기본 환급률: 53.3% / 시차시간 환급률: 83.3% 국토부는 내년에도 이어가기 위해 2027년 정부 예산안에 관련 예산을 반영했다고 밝혔어요. 다만 예산안은 국회 심의를 거쳐야 하니 내년 시행이 확정이라고 단정하기는 어렵습니다. (국토부 보도자료는 '예산안 반영'까지만 언급하고, 확정 여부는 밝히지 않았어요.) 숫자로 이해해 보기 (가상의 예시예요) 실제 내 환급액은 아니고 계산을 위한 가상 예시예요. 일반 이용자가 한 달에 시차시간대로 대중교통비 5만 원을 썼다고 가정해 볼게요. 기본 환급률 20%라면 1만 원이지만, 시차시간 환급률 50%가 적용되면 2만 5천 원이 됩니다. 같은 금액을 써도 이용 시간대에 따라 돌려받는 금액이 달라질 수 있다는 뜻이에요. 다만 실제 환급은 이용 횟수, 카드, 정액형 적용 여부 등에 따라 달라질 수 있어서 정확한 금액은 앱 안내를 기준으로 봐야 해요. 효과는 어땠을까 국토부 자료에 따르면 추경 혜택 시행 이후 모두의카드 이용자의 1인당 월평균 환급액은 2만 700원에서 4만 1,300원으로 약 두 배가 됐고, 월평균 환급자는 283만 명에서 346만 명으로 늘었다고 해요. 10월 전에 확인할 것 3가지 1. 내 유형(일반·청년 등)과 거주 지역이 앱에 맞게 등록되어 있는지 2. 카드사·모두의카드 앱 알림으로 오는 변경 안내가 있는지 3. 월 15회 이상 이용 같은 기본 조건은 한국교통안전공단 안내 기준으로 다시 보기 (사진 2 자리) 제도는 바뀔 수 있으니 최종 내용은 모두의카드 공식 홈페이지와 앱 공지를 꼭 확인해 주세요. 네이버"}, {"id": "001", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "001_health-checkup.md", "title": "국가건강검진 안 받으면 정말 불이익이 있을까? 2026년 기준으로 확인해 봤어요", "cands": ["국가건강검진 안 받으면 정말 불이익이 있을까? 2026년 기준으로 확인해 봤어요", "건강검진 대상인지 직접 조회하는 법, 검진표 못 받았을 때 대처법까지", "작년에 건강검진 놓쳤다면? '전년도 미수검자 추가신청' 방법 정리"], "cat": "건강·보건", "kw": ["국가건강검진", "건강검진 대상 조회", "전년도 미수검자 추가신청"], "summary": "국가건강검진 대상 조회, 미수검 시 불이익(법령 근거)·전년도 미수검자 추가신청 방법 정리", "status": "초안", "created": "2026-10-05 01:32", "base": "2026-10-05", "need": 1, "chars": 2811, "chars_ns": 2207, "imgs": 2, "slots": 2, "html": "<p>국가건강검진을 안 받으면 벌금이 나온다는 이야기, 한 번쯤 들어보셨죠? 저도 궁금해서 공식 자료부터 찾아봤어요. 결론부터 말씀드리면, 제가 확인한 국민건강보험법 과태료 조항(제119조)에서는 건강검진을 받지 않은 개인에게 부과하는 과태료를 찾지 못했어요. 다만 직장에 다니는 분은 산업안전보건법에 따른 근로자 건강진단 규정이 따로 있어서 아래에 나눠 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<div class=\"ph-empty\"><b>사진 1 자리<\/b>대표 이미지: 국민건강보험 &#x27;건강검진 대상 조회&#x27; 화면 (개인정보 가림)<small>직접 찍거나 캡처한 사진을 넣는 위치 (개인정보 가림)<\/small><\/div>\n<h3>먼저, 올해 내가 대상인지 확인하기<\/h3>\n<p>일반건강검진은 기본적으로 2년에 한 번 받는 검진이에요. 질병관리청 국가건강정보포털에는 보통 짝수년에 태어난 분은 짝수년에, 홀수년에 태어난 분은 홀수년에 대상이 된다고 나와 있어요. 다만 비사무직(생산직) 직장가입자는 매년 대상이고, 가입 유형에 따라 대상 연령도 조금씩 달라요. 그래서 출생연도만 보고 판단하기보다 직접 조회하는 게 가장 정확합니다.<\/p>\n<p>조회는 국민건강보험공단 홈페이지(건강모아 → 나의 건강 → 검진대상 조회)나 '건강보험25시' 앱에서 할 수 있어요. 공단 안내에 따르면 직장가입자의 일반건강검진 대상 여부는 소속 사업장으로 통보돼서, 검진표를 못 받았다고 해서 대상이 아니라고 단정하기는 어려워요. 검진표는 전자문서로 발송되고 열람하지 않으면 우편으로 보내진다고 해요(직장가입자 중 일반검진만 해당하면 사업장 명부 발송으로 대체). 검진표를 잃어버렸거나 받지 못했다면 공단(1577-1000)이나 가까운 지사에 신청해 다시 받거나 홈페이지에서 검진대상 확인서를 출력할 수 있고, 신분증(주민등록증·운전면허증·여권)으로 검진기관에서 대상자 확인을 받고 검진을 받을 수도 있다고 안내되어 있어요.<\/p>\n<h3>비용은 얼마나 들까?<\/h3>\n<p>일반건강검진 비용은 국민건강보험공단이 전액 부담해서 본인 부담이 없다고 질병관리청 자료에 나와 있어요. 다만 공단 안내에는 확진검사 단계에서 안내된 항목 외의 검사(당화혈색소 등 추가 피검사, CT 등)를 하면 비용이 발생한다고 되어 있어요. 일반검진 때 검진기관에서 추가로 고르는 항목의 금액은 기관마다 달라서 공식 자료로 확인하지 못했고, 이 글에서는 금액을 쓰지 않았어요. <mark class=\"need\">[확인 필요: 기관별 추가 항목 비용]<\/mark><\/p>\n<h3>안 받으면 정말 불이익이 있을까?<\/h3>\n<p>제일 궁금한 부분이죠. 제가 확인한 내용은 이렇습니다.<\/p>\n<ul><li>직장인(산업안전보건법): 사업주는 근로자에게 건강진단을 실시해야 하고(법 제129조), 하지 않으면 1천만 원 이하의 과태료가 있어요(법 제175조 제4항). 근로자도 사업주가 실시하는 건강진단을 받아야 하고(법 제133조) 받지 않으면 300만 원 이하의 과태료 대상이에요(법 제175조 제6항). 고용노동부 안내에는 근로자 1명당 사업주 1차 10만 원·2차 20만 원·3차 30만 원, 근로자 1차 5만 원·2차 10만 원·3차 15만 원으로 단계별 금액이 나와 있어요. 이 건강진단은 국민건강보험법에 따른 건강검진으로 대체할 수 있다고 고용노동부가 안내하고 있어요. 즉 이 과태료는 국민건강보험법이 아니라 산업안전보건법에 따른 것이라, 실제 부과 여부는 사업장 상황에 따라 달라요.<\/li><li>암환자 의료비 지원: 예전에는 국가암검진을 받은 뒤 암을 진단받으면 의료비를 지원받는 길이 있었지만, 보건소 안내(2026년)에 따르면 성인 건강보험가입자 신규 지원은 2021년 7월부터 중단되었어요. '검진을 안 받으면 암 의료비 지원에서 빠진다'는 식의 설명은 지금 기준과 맞지 않아 이 글에서는 쓰지 않았어요.<\/li><li>'개인 과태료 10만 원'이라는 글이 인터넷에 돌지만, 공단이나 법령 원문에서는 확인하지 못해서 이 글에서는 사실로 쓰지 않았어요.<\/li><\/ul>\n<h3>작년에 놓쳤다면: 전년도 미수검자 추가신청<\/h3>\n<p>작년에 대상이었는데 시기를 놓쳤다면, 비용을 추가로 내지 않고 올해 검진을 받을 수 있는 '전년도 미수검자 추가신청' 서비스가 있어요. 방법은 세 가지예요.<\/p>\n<ol><li>보이는 ARS: 1577-1000 전화 → 9번 → 문자로 받은 URL 접속 → 건강검진 → 전년도 미수검자 검진 신청<\/li><li>공단 홈페이지: 건강모아 → 나의 건강관리 → 국가건강검진정보 → 전년도 미수검자 추가 신청<\/li><li>모바일 앱(건강보험25시): 건강모아 → 나의건강 → 검진신청 → 전년도 미수검자 추가 신청<\/li><\/ol>\n<div class=\"ph-empty\"><b>사진 2 자리<\/b>추가신청 메뉴 경로 화면 캡처 (개인정보 가림)<small>직접 찍거나 캡처한 사진을 넣는 위치 (개인정보 가림)<\/small><\/div>\n<h3>검진을 받은 뒤에는<\/h3>\n<p>결과는 검진 후 15일 이내에 우편이나 이메일로 받을 수 있고, 앱에서도 조회할 수 있어요. 고혈압·당뇨병·이상지질혈증·폐결핵·우울증 또는 조기정신증·C형간염 질환의심자라면 병·의원에서 확진검사(진료)를 받을 수 있고, 최초 1회는 본인부담이 면제돼요. 국민건강보험공단 안내(2026년)에는 이 기한이 검진 다음 연도 3월 31일까지로 되어 있어요. 예를 들어 2026년에 검진을 받았다면 2027년 3월 31일까지예요. 기존 1월 31일에서 3월 31일로 늘어났다고 공단 리플릿에 나와 있고, 2026년 1월부터 이상지질혈증과 당뇨병 당화혈색소 검사도 대상에 추가됐다고 해요. 질병관리청 건강정보 포털에는 아직 1월 31일로 적혀 있으니 헷갈리지 않게 공단 안내를 기준으로 보세요. 참고로 C형간염은 본인부담금이 생길 수 있고 별도 정산 신청이 필요하다고 안내돼 있어요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>대상 여부는 공단 홈페이지·앱에서 직접 조회하기<\/li><li>검진표가 없어도 1577-1000 문의, 신분증으로 검진 가능<\/li><li>놓쳤다면 전년도 미수검자 추가신청 활용하기<\/li><li>일반건강검진 기간은 매년 1월 1일~12월 31일이고, 확진검사는 다음 연도 3월 31일까지(국민건강보험공단 안내, 보건복지부 고시 제2026-6호 건강검진 실시기준)<\/li><\/ul>\n<p>제도는 바뀔 수 있으니 신청 전에 국민건강보험공단 공식 안내를 꼭 한 번 더 확인해 주세요.<\/p><div class=\"gallery\"><div class=\"gl\">참고 이미지 (본문 하단·분위기용)<\/div><figure class=\"ph\"><img loading=\"lazy\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wgARCAGqAtADASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAQIAAwQFBgf/xAAYAQEBAQEBAAAAAAAAAAAAAAAAAQIDBP/aAAwDAQACEAMQAAAB78g6cpICSRIJCAgAK2RSBVYAaQbzfo/P464SDw9MDCarrurZpDrvHU38frd/NeUa5Wi6mKKNFOdUrYmdwoRhbmWwxByrIQSVhwVpZQZXp3qrGXMaxtYw2rbvzvfXd087JJcVxhN7tDvOvm8PXwef3YNFQa7Hd81q1n1hSzXMmFYwMQyKZJBIgxUjMjLnkFkkhIIkkhBBUEAAVQSAJUqeF3ORnfJIbz+qGNnSVX1pQlle8Wdjidjt59TI2sCqyuK6bq5qmu2qaHV59PPv2eXTpnXo+a6Vtzhtyad+a0hkVbEKsO7mrpvYopayyw3DfPkXpbvzWOrb4Mplihma7RtTl7ePz+zzcdOZk6ePO692C9fS93xHr989JBRpCskkGSEIgxUjFStEksEkSSQggICtQEIBAQEEIKzn788vmbKbPP67GV8bldqRmq0Z94Xr8frdvPteqzXMI6lVdiTVNVy50unq8vl7Of3OU0rZ+jms4mvZzN8ehbTo1xVLazHTNC2sXRb10azZTp51mW5dOYrwdvIQuebX0Pnv \/td><td>확인됨 + 정정(법적 근거)<\/td><td>근거는 국민건강보험법이 아니라 산업안전보건법 제129·133·175조(시행 2026-08-01). 국민건강보험법 제119조에는 미수검 과태료 없음. 고용노동부: 1인당 사업주 10/20/30만 원, 근로자 5/10/15만 원, 건보 검진으로 대체 가능 — <a href=\"https://www.moel.go.kr/minwon/fastcounsel/fastcounselView.do?inetDcssMngId=202210251754485021000\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.moel.go.kr/minwon/fastcounsel/fastcounselView.do?inetDcssMngId=202210251754485021000<\/a> , <a href=\"https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&amp;joBrNo=00&amp;joNo=0175&amp;lsiSeq=283449&amp;urlMode=lsScJoRltInfoR\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&amp;joBrNo=00&amp;joNo=0175&amp;lsiSeq=283449&amp;urlMode=lsScJoRltInfoR<\/a><\/td><\/tr><tr><td>1-3<\/td><td>암환자 의료비 지원 제외(헬스경향 2023)<\/td><td>불일치(정정)<\/td><td>성인 건강보험가입자 신규 지원은 2021-07부터 중단(2021-06-30까지 국가암검진 수검·진단자만 해당). \"미수검 시 제외\" 문구는 현재 기준과 맞지 않아 삭제 — <a href=\"https://www.wonju.go.kr/health/contents.do?key=1752\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.wonju.go.kr/health/contents.do?key=1752<\/a> , <a href=\"https://sb.go.kr/bogunso/contents.do?key=255\" target=\"_blank\" rel=\"noopener noreferrer\">https://sb.go.kr/bogunso/contents.do?key=255<\/a> (지자체 보건소)<\/td><\/tr><tr><td>1-4<\/td><td>확진검사 면제 기한 1/31 vs 3/31<\/td><td>불일치(정정: 3/31)<\/td><td>검진 다음 연도 3월 31일까지(2026-01부터 연장). 질병관리청 포털(업데이트 2026-06-01)은 1/31로 남아 있어 상충 — <a href=\"https://www.nhis.or.kr/renewal_popup/poster/20260204_poster_longdesc_1.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nhis.or.kr/renewal_popup/poster/20260204_poster_longdesc_1.html<\/a> , <a href=\"https://www.nhis.or.kr/nhis/healthin/wbhaca04500m01.do\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nhis.or.kr/nhis/healthin/wbhaca04500m01.do<\/a><\/td><\/tr><tr><td>1-5<\/td><td>2026 일반검진 실시기한 12/31<\/td><td>확인됨<\/td><td>공단: 검진기간 매년 1.1~12.31. 보건복지부 고시 제2026-6호(2026-01-07) 제8조①\"건강검진은 해당연도에 실시\" — <a href=\"https://www.nhis.or.kr/lm/lmxsrv/law/lawFullContent.do?SEQ=80&amp;SEQ_HISTORY=595068\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nhis.or.kr/lm/lmxsrv/law/lawFullContent.do?SEQ=80&amp;SEQ_HISTORY=595068<\/a><\/td><\/tr><tr><td>1-6<\/td><td>대상 조회 메뉴명·경로<\/td><td>확인됨<\/td><td>건강모아 → 나의 건강 → 검진대상 조회(홈페이지), 앱 '건강보험25시' — 공단·질병관리청(<a href=\"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6671\" target=\"_blank\" rel=\"noopener noreferrer\">https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6671<\/a> ). 화면 실제 일치는 사용자가 직접 재확인<\/td><\/tr><tr><td>1-7<\/td><td>직장가입자 검진표 없어도 대상일 수 있음<\/td><td>확인됨<\/td><td>공단: 직장가입자 대상 여부는 소속 사업장으로 통보 — nhis.or.kr 위 페이지<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>비용 전액 공단 부담, 2년 주기·비사무직 매년, 조회 경로, 검진표 분실 시 1577-1000, 신분증으로 검진, 결과 15일, 전년도 미수검자 추가신청 방법<\/td><td>질병관리청 국가건강정보포털 <a href=\"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6671\" target=\"_blank\" rel=\"noopener noreferrer\">https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6671<\/a> (업데이트 2026-06-01; 확진검사 기한은 1/31로 남아 있어 사용 안 함)<\/td><td>공식<\/td><\/tr><tr><td>검진 절차, 전자문서 검진표, 검진기간 1.1~12.31, 확진검사 대상·기한(다음 연도 3.31), C형간염 본인부담, 추가 검사 비용, 전년도 미수검자 추가등록<\/td><td>국민건강보험공단 일반건강검진 안내 <a href=\"https://www.nhis.or.kr/nhis/healthin/wbhaca04500m01.do\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nhis.or.kr/nhis/healthin/wbhaca04500m01.do<\/a><\/td><td>공식<\/td><\/tr><tr><td>확진검사 수검기한 1/31→3/31 연장, 이상지질혈증·당화혈색소 추가(2026-01)<\/td><td>공단 '2026년 달라지는 건강보험' 리플릿 <a href=\"https://www.nhis.or.kr/renewal_popup/poster/20260204_poster_longdesc_1.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nhis.or.kr/renewal_popup/poster/20260204_poster_longdesc_1.html<\/a><\/td><td>공식<\/td><\/tr><tr><td>건강검진 실시기준(고시 제2026-6호, 제8조①)<\/td><td>공단 법령 DB <a href=\"https://www.nhis.or.kr/lm/lmxsrv/law/lawFullContent.do?SEQ=80&amp;SEQ_HISTORY=595068\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nhis.or.kr/lm/lmxsrv/law/lawFullContent.do?SEQ=80&amp;SEQ_HISTORY=595068<\/a><\/td><td>공식<\/td><\/tr><tr><td>직장인 건강진단 의무·과태료<\/td><td>산업안전보건법 제129·133·175조(국가법령정보센터) <a href=\"https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&amp;joBrNo=00&amp;joNo=0175&amp;lsiSeq=283449&amp;urlMode=lsScJoRltInfoR\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&amp;joBrNo=00&amp;joNo=0175&amp;lsiSeq=283449&amp;urlMode=lsScJoRltInfoR<\/a> ; 고용노동부 빠른상담 <a href=\"https://www.moel.go.kr/minwon/fastcounsel/fastcounselView.do?inetDcssMngId=202210251754485021000\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.moel.go.kr/minwon/fastcounsel/fastcounselView.do?inetDcssMngId=202210251754485021000<\/a><\/td><td>공식<\/td><\/tr><tr><td>암환자 의료비 지원 대상<\/td><td>지자체 보건소 안내 <a href=\"https://www.wonju.go.kr/health/contents.do?key=1752\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.wonju.go.kr/health/contents.do?key=1752<\/a><\/td><td>공식(지자체)<\/td><\/tr><tr><td>(참고·미사용) 정책브리핑 카드뉴스 2019 <a href=\"https://www.korea.kr/multi/visualNewsView.do?newsId=148865937\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/multi/visualNewsView.do?newsId=148865937<\/a><\/td><td>직장 미수검 과태료 상한 소개(법적 근거 명시 없음) → 위 법령으로 대체<\/td><td>공식이나 오래됨<\/td><\/tr><tr><td>'개인 과태료 10만 원' 주장(사용 안 함)<\/td><td><a href=\"https://asiatop.co.kr/public-services/health-checkup-mandatory-fine-exemption/\" target=\"_blank\" rel=\"noopener noreferrer\">https://asiatop.co.kr/public-services/health-checkup-mandatory-fine-exemption/<\/a><\/td><td>비공식·근거 미확인 → 본문 미사용<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "<p>사진: rawpixel.com / Wikimedia Commons (CC0, 표기 의무 없음 — 출처 병기 권장) <a href=\"https://commons.wikimedia.org/wiki/File:Blood_pressure_monitoring.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">https://commons.wikimedia.org/wiki/File:Blood_pressure_monitoring.jpg<\/a><br>본 저작물은 국립소록도병원 한센병박물관에서 2018년 작성하여 공공누리 제1유형으로 개방한 '청진기'를 이용하였으며, 해당 저작물은 공공누리(<a href=\"https://www.kogl.or.kr\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.kogl.or.kr<\/a>)에서 무료로 다운받으실 수 있습니다.<\/p>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>\n<p>(참고: 이 글에는 광고·제휴·협찬·대가성 요소가 없습니다. 클릭 유도 문구도 넣지 않았습니다.)<\/p>", "open": false}], "plain": "국가건강검진을 안 받으면 벌금이 나온다는 이야기, 한 번쯤 들어보셨죠? 저도 궁금해서 공식 자료부터 찾아봤어요. 결론부터 말씀드리면, 제가 확인한 국민건강보험법 과태료 조항(제119조)에서는 건강검진을 받지 않은 개인에게 부과하는 과태료를 찾지 못했어요. 다만 직장에 다니는 분은 산업안전보건법에 따른 근로자 건강진단 규정이 따로 있어서 아래에 나눠 정리했습니다. (2026년 10월 5일 기준)\n\n(사진 1 자리)\n\n먼저, 올해 내가 대상인지 확인하기\n\n일반건강검진은 기본적으로 2년에 한 번 받는 검진이에요. 질병관리청 국가건강정보포털에는 보통 짝수년에 태어난 분은 짝수년에, 홀수년에 태어난 분은 홀수년에 대상이 된다고 나와 있어요. 다만 비사무직(생산직) 직장가입자는 매년 대상이고, 가입 유형에 따라 대상 연령도 조금씩 달라요. 그래서 출생연도만 보고 판단하기보다 직접 조회하는 게 가장 정확합니다.\n\n조회는 국민건강보험공단 홈페이지(건강모아 → 나의 건강 → 검진대상 조회)나 '건강보험25시' 앱에서 할 수 있어요. 공단 안내에 따르면 직장가입자의 일반건강검진 대상 여부는 소속 사업장으로 통보돼서, 검진표를 못 받았다고 해서 대상이 아니라고 단정하기는 어려워요. 검진표는 전자문서로 발송되고 열람하지 않으면 우편으로 보내진다고 해요(직장가입자 중 일반검진만 해당하면 사업장 명부 발송으로 대체). 검진표를 잃어버렸거나 받지 못했다면 공단(1577-1000)이나 가까운 지사에 신청해 다시 받거나 홈페이지에서 검진대상 확인서를 출력할 수 있고, 신분증(주민등록증·운전면허증·여권)으로 검진기관에서 대상자 확인을 받고 검진을 받을 수도 있다고 안내되어 있어요.\n\n비용은 얼마나 들까?\n\n일반건강검진 비용은 국민건강보험공단이 전액 부담해서 본인 부담이 없다고 질병관리청 자료에 나와 있어요. 다만 공단 안내에는 확진검사 단계에서 안내된 항목 외의 검사(당화혈색소 등 추가 피검사, CT 등)를 하면 비용이 발생한다고 되어 있어요. 일반검진 때 검진기관에서 추가로 고르는 항목의 금액은 기관마다 달라서 공식 자료로 확인하지 못했고, 이 글에서는 금액을 쓰지 않았어요. [확인 필요: 기관별 추가 항목 비용]\n\n안 받으면 정말 불이익이 있을까?\n\n제일 궁금한 부분이죠. 제가 확인한 내용은 이렇습니다.\n\n- 직장인(산업안전보건법): 사업주는 근로자에게 건강진단을 실시해야 하고(법 제129조), 하지 않으면 1천만 원 이하의 과태료가 있어요(법 제175조 제4항). 근로자도 사업주가 실시하는 건강진단을 받아야 하고(법 제133조) 받지 않으면 300만 원 이하의 과태료 대상이에요(법 제175조 제6항). 고용노동부 안내에는 근로자 1명당 사업주 1차 10만 원·2차 20만 원·3차 30만 원, 근로자 1차 5만 원·2차 10만 원·3차 15만 원으로 단계별 금액이 나와 있어요. 이 건강진단은 국민건강보험법에 따른 건강검진으로 대체할 수 있다고 고용노동부가 안내하고 있어요. 즉 이 과태료는 국민건강보험법이 아니라 산업안전보건법에 따른 것이라, 실제 부과 여부는 사업장 상황에 따라 달라요.\n- 암환자 의료비 지원: 예전에는 국가암검진을 받은 뒤 암을 진단받으면 의료비를 지원받는 길이 있었지만, 보건소 안내(2026년)에 따르면 성인 건강보험가입자 신규 지원은 2021년 7월부터 중단되었어요. '검진을 안 받으면 암 의료비 지원에서 빠진다'는 식의 설명은 지금 기준과 맞지 않아 이 글에서는 쓰지 않았어요.\n- '개인 과태료 10만 원'이라는 글이 인터넷에 돌지만, 공단이나 법령 원문에서는 확인하지 못해서 이 글에서는 사실로 쓰지 않았어요.\n\n작년에 놓쳤다면: 전년도 미수검자 추가신청\n\n작년에 대상이었는데 시기를 놓쳤다면, 비용을 추가로 내지 않고 올해 검진을 받을 수 있는 '전년도 미수검자 추가신청' 서비스가 있어요. 방법은 세 가지예요.\n\n1. 보이는 ARS: 1577-1000 전화 → 9번 → 문자로 받은 URL 접속 → 건강검진 → 전년도 미수검자 검진 신청\n2. 공단 홈페이지: 건강모아 → 나의 건강관리 → 국가건강검진정보 → 전년도 미수검자 추가 신청\n3. 모바일 앱(건강보험25시): 건강모아 → 나의건강 → 검진신청 → 전년도 미수검자 추가 신청\n\n(사진 2 자리)\n\n검진을 받은 뒤에는\n\n결과는 검진 후 15일 이내에 우편이나 이메일로 받을 수 있고, 앱에서도 조회할 수 있어요. 고혈압·당뇨병·이상지질혈증·폐결핵·우울증 또는 조기정신증·C형간염 질환의심자라면 병·의원에서 확진검사(진료)를 받을 수 있고, 최초 1회는 본인부담이 면제돼요. 국민건강보험공단 안내(2026년)에는 이 기한이 검진 다음 연도 3월 31일까지로 되어 있어요. 예를 들어 2026년에 검진을 받았다면 2027년 3월 31일까지예요. 기존 1월 31일에서 3월 31일로 늘어났다고 공단 리플릿에 나와 있고, 2026년 1월부터 이상지질혈증과 당뇨병 당화혈색소 검사도 대상에 추가됐다고 해요. 질병관리청 건강정보 포털에는 아직 1월 31일로 적혀 있으니 헷갈리지 않게 공단 안내를 기준으로 보세요. 참고로 C형간염은 본인부담금이 생길 수 있고 별도 정산 신청이 필요하다고 안내돼 있어요.\n\n한눈에 정리\n\n- 대상 여부는 공단 홈페이지·앱에서 직접 조회하기\n- 검진표가 없어도 1577-1000 문의, 신분증으로 검진 가능\n- 놓쳤다면 전년도 미수검자 추가신청 활용하기\n- 일반건강검진 기간은 매년 1월 1일~12월 31일이고, 확진검사는 다음 연도 3월 31일까지(국민건강보험공단 안내, 보건복지부 고시 제2026-6호 건강검진 실시기준)\n\n제도는 바뀔 수 있으니 신청 전에 국민건강보험공단 공식 안내를 꼭 한 번 더 확인해 주세요.", "copyAll": "국가건강검진을 안 받으면 벌금이 나온다는 이야기, 한 번쯤 들어보셨죠? 저도 궁금해서 공식 자료부터 찾아봤어요. 결론부터 말씀드리면, 제가 확인한 국민건강보험법 과태료 조항(제119조)에서는 건강검진을 받지 않은 개인에게 부과하는 과태료를 찾지 못했어요. 다만 직장에 다니는 분은 산업안전보건법에 따른 근로자 건강진단 규정이 따로 있어서 아래에 나눠 정리했습니다. (2026년 10월 5일 기준)\n\n(사진 1 자리)\n\n먼저, 올해 내가 대상인지 확인하기\n\n일반건강검진은 기본적으로 2년에 한 번 받는 검진이에요. 질병관리청 국가건강정보포털에는 보통 짝수년에 태어난 분은 짝수년에, 홀수년에 태어난 분은 홀수년에 대상이 된다고 나와 있어요. 다만 비사무직(생산직) 직장가입자는 매년 대상이고, 가입 유형에 따라 대상 연령도 조금씩 달라요. 그래서 출생연도만 보고 판단하기보다 직접 조회하는 게 가장 정확합니다.\n\n조회는 국민건강보험공단 홈페이지(건강모아 → 나의 건강 → 검진대상 조회)나 '건강보험25시' 앱에서 할 수 있어요. 공단 안내에 따르면 직장가입자의 일반건강검진 대상 여부는 소속 사업장으로 통보돼서, 검진표를 못 받았다고 해서 대상이 아니라고 단정하기는 어려워요. 검진표는 전자문서로 발송되고 열람하지 않으면 우편으로 보내진다고 해요(직장가입자 중 일반검진만 해당하면 사업장 명부 발송으로 대체). 검진표를 잃어버렸거나 받지 못했다면 공단(1577-1000)이나 가까운 지사에 신청해 다시 받거나 홈페이지에서 검진대상 확인서를 출력할 수 있고, 신분증(주민등록증·운전면허증·여권)으로 검진기관에서 대상자 확인을 받고 검진을 받을 수도 있다고 안내되어 있어요.\n\n비용은 얼마나 들까?\n\n일반건강검진 비용은 국민건강보험공단이 전액 부담해서 본인 부담이 없다고 질병관리청 자료에 나와 있어요. 다만 공단 안내에는 확진검사 단계에서 안내된 항목 외의 검사(당화혈색소 등 추가 피검사, CT 등)를 하면 비용이 발생한다고 되어 있어요. 일반검진 때 검진기관에서 추가로 고르는 항목의 금액은 기관마다 달라서 공식 자료로 확인하지 못했고, 이 글에서는 금액을 쓰지 않았어요. [확인 필요: 기관별 추가 항목 비용]\n\n안 받으면 정말 불이익이 있을까?\n\n제일 궁금한 부분이죠. 제가 확인한 내용은 이렇습니다.\n\n- 직장인(산업안전보건법): 사업주는 근로자에게 건강진단을 실시해야 하고(법 제129조), 하지 않으면 1천만 원 이하의 과태료가 있어요(법 제175조 제4항). 근로자도 사업주가 실시하는 건강진단을 받아야 하고(법 제133조) 받지 않으면 300만 원 이하의 과태료 대상이에요(법 제175조 제6항). 고용노동부 안내에는 근로자 1명당 사업주 1차 10만 원·2차 20만 원·3차 30만 원, 근로자 1차 5만 원·2차 10만 원·3차 15만 원으로 단계별 금액이 나와 있어요. 이 건강진단은 국민건강보험법에 따른 건강검진으로 대체할 수 있다고 고용노동부가 안내하고 있어요. 즉 이 과태료는 국민건강보험법이 아니라 산업안전보건법에 따른 것이라, 실제 부과 여부는 사업장 상황에 따라 달라요.\n- 암환자 의료비 지원: 예전에는 국가암검진을 받은 뒤 암을 진단받으면 의료비를 지원받는 길이 있었지만, 보건소 안내(2026년)에 따르면 성인 건강보험가입자 신규 지원은 2021년 7월부터 중단되었어요. '검진을 안 받으면 암 의료비 지원에서 빠진다'는 식의 설명은 지금 기준과 맞지 않아 이 글에서는 쓰지 않았어요.\n- '개인 과태료 10만 원'이라는 글이 인터넷에 돌지만, 공단이나 법령 원문에서는 확인하지 못해서 이 글에서는 사실로 쓰지 않았어요.\n\n작년에 놓쳤다면: 전년도 미수검자 추가신청\n\n작년에 대상이었는데 시기를 놓쳤다면, 비용을 추가로 내지 않고 올해 검진을 받을 수 있는 '전년도 미수검자 추가신청' 서비스가 있어요. 방법은 세 가지예요.\n\n1. 보이는 ARS: 1577-1000 전화 → 9번 → 문자로 받은 URL 접속 → 건강검진 → 전년도 미수검자 검진 신청\n2. 공단 홈페이지: 건강모아 → 나의 건강관리 → 국가건강검진정보 → 전년도 미수검자 추가 신청\n3. 모바일 앱(건강보험25시): 건강모아 → 나의건강 → 검진신청 → 전년도 미수검자 추가 신청\n\n(사진 2 자리)\n\n검진을 받은 뒤에는\n\n결과는 검진 후 15일 이내에 우편이나 이메일로 받을 수 있고, 앱에서도 조회할 수 있어요. 고혈압·당뇨병·이상지질혈증·폐결핵·우울증 또는 조기정신증·C형간염 질환의심자라면 병·의원에서 확진검사(진료)를 받을 수 있고, 최초 1회는 본인부담이 면제돼요. 국민건강보험공단 안내(2026년)에는 이 기한이 검진 다음 연도 3월 31일까지로 되어 있어요. 예를 들어 2026년에 검진을 받았다면 2027년 3월 31일까지예요. 기존 1월 31일에서 3월 31일로 늘어났다고 공단 리플릿 /* clipboard: 기존 동작 유지 — [확인 필요] 남아 있으면 확인 후 복사 */
async function writeClip(text){
 try{await navigator.clipboard.writeText(text);return true}catch(e){
  const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;top:-1000px;opacity:0";document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand("copy")}catch(_){}ta.remove();return ok}
}
async function copy(text,msg,p,needWarn,btn){
 if(needWarn&&p&&p.need>0&&!confirm(`아직 [확인 필요] 표시가 ${p.need}곳 남아 있어요. 공식 자료로 확인해 고친 뒤 발행하세요.\n그래도 복사할까요?`))return;
 const ok=await writeClip(text);done(btn,ok);toast(ok?msg:"복사에 실패했어요. 원고 상자에서 직접 선택해 복사하세요.")
}
async function copyTxt(text,msg,btn){
 if(text.includes("[확인 필요")&&!confirm("이 텍스트에 [확인 필요] 표시가 남아 있어요. 공식 자료로 확인해 고친 뒤 게시하세요.\n그래도 복사할까요?"))return;
 const ok=await writeClip(text);done(btn,ok);toast(ok?msg:"복사에 실패했어요. 직접 선택해 복사하세요.")

function done(btn,ok){if(!btn||!ok)return;btn.classList.add("done");const h=btn.dataset.h||btn.innerHTML;btn.dataset.h=h;btn.innerHTML=ic("check")+"복사됨";clearTimeout(btn._t);btn._t=setTimeout(()=>{btn.classList.remove("done");btn.innerHTML=h},1600)}
const markNeed = s => s.replace(/\[확인 필요[^\]]*\]/g, m => `<mark class="need">${m}</mark>`);
/* X 본문: 링크·해시태그·멘션·캐시태그 파란색, [확인 필요] 노란색 */
const XTOK = /(https?:\/\/[^\s]+)|(\[확인 필요[^\]]*\])|(?<![\p{L}\p{N}_&\/])([#＃][\p{L}\p{N}_]+|\$[A-Za-z]{2,10}\b)|(?<![\p{L}\p{N}_])(@[A-Za-z0-9_]{1,15})/gu;
function fmtTweet(s){
 let out="",last=0;
 for(const m of s.matchAll(XTOK)){
  out+=esc(s.slice(last,m.index));last=m.index+m[0].length;
  if(m[1]){let u=m[1].replace(/[.,;:!?)\]]+$/,"");const trail=m[1].slice(u.length);const d=u.replace(/^https?:\/\/(www\.)?/,"");out+=`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(d.length>28?d.slice(0,27)+"…":d)}</a>`+esc(trail)}
  else if(m[2])out+=`<mark class="need">${esc(m[2])}</mark>`;
  else out+=`<span class="ht">${esc(m[3]||m[4])}</span>`;
 }
 return out+esc(s.slice(last));
}
/* 원고 탭: 전체 텍스트 그대로(링크 축약 없음) + 해시태그·[확인 필요] 강조 */
const rawX = s => markNeed(esc(s)).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>').replace(/(^|[\s(])(#[\p{L}\p{N}_]+)/gu,'$1<span style="color:var(--xb)">$2</span>');
function gauge(n,size=20){
 const r=size/2-2,c=2*Math.PI*r,pct=Math.min(n/280,1),cls=n>280?"bad":n>260?"warn":"ok";
 const col=n>280?"#f4212e":n>260?"#ffd400":"#1d9bf0";
 return `<span class="gauge ${cls}" title="X 가중 글자수(근사)"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--tw-thread)" stroke-width="2"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="${(c*pct).toFixed(2)} ${c.toFixed(2)}"/></svg>${n}/280</span>`;
}

 return L.sort(cmp);

  ${p.ko||p.summary?`<div class="ko"><b>한국어 요약</b><br>${esc(p.ko||p.summary)}</div>`:""}
  <div class="sec"><h5>훅 후보</h5><div class="cands">${p.cands.map((c,i)=>`<div class="cand"><span class="no">${i+1}</span><span class="tx">${esc(c)}</span><button class="btn sm" data-t="${i}">${ic("copy")}복사</button></div>`).join("")||'<div class="note">없음</div>'}</div></div>
  <div class="sec"><h5>${single?"포스트":"스레드"}</h5><div style="display:flex;flex-direction:column;gap:10px">${p.tweets.map((t,i)=>`<div class="blk"><div class="bh">${single?"단일 포스트":`트윗 ${t.n}/${t.total}`}${t.need?`<span class="b need">확인 필요 ${t.need}</span>`:""}<span class="r">${lenB(t.len)}<button class="btn sm" data-tw="${i}">${ic("copy")}${single?"포스트 복사":"이 트윗 복사"}</button></span></div><pre class="raw short">${rawX(t.text)}</pre></div>`).join("")}</div></div>
  ${p.replies.length?`<div class="sec"><h5>답글용 출처 (본문 뒤에 답글로)</h5><div style="display:flex;flex-direction:column;gap:10px">${p.replies.map((r,i)=>`<div class="blk"><div class="bh">답글 ${i+1}${r.need?`<span class="b need">확인 필요 ${r.need}</span>`:""}<span class="r">${lenB(r.len)}<button class="btn sm" data-rp="${i}">${ic("copy")}답글 복사</button></span></div><pre class="raw short">${rawX(r.text)}</pre></div>`).join("")}</div></div>`:""}
 </div>`;
}
function show(id,tab){
 const p=P.find(x=>x.id===id);if(!p){location.hash="";return}
 S.tab=tab==="copy"?"copy":"preview";
 const isX=p.platform==="x";
 $("#content").innerHTML=`
  <div class="dhead"><button class="back" id="back">${ic("back")}목록</button><div class="ttl">${esc(p.title)}</div>
   <div class="tabs" role="tablist"><button data-tab="preview" class="${S.tab==="preview"?"on":""}">${ic("eye")}프리뷰</button><button data-tab="copy" class="${S.tab==="copy"?"on":""}">${ic("copy")}원고/복사</button></div></div>
  <div class="dgrid"><div id="pane">${S.tab==="preview"?(isX?xPreview(p):naverPreview(p)):(isX?xCopy(p):naverCopy(p))}</div>${infoPanel(p)}</div>`;
 $("#back").onclick=()=>{location.hash=""};
 $$(".tabs button").forEach(b=>b.onclick=()=>{location.replace("#"+p.id+(b.dataset.tab==="copy"?"/copy":""))});
 $("#mys").onchange=e=>{localStorage.setItem(stKey(p.id),e.target.value);renderSide();show(p.id,S.tab);toast("표시를 바꿨어요(이 브라우저에만 저장)")};
 if(S.tab==="copy"){
  if(isX){
   $("#x1").onclick=e=>copyTxt(p.tweets[0].text,"복사했어요",e.currentTarget);
   if($("#x2"))$("#x2").onclick=e=>copyTxt(p.plain,"스레드 전체를 복사했어요(트윗 사이 --- 구분)",e.currentTarget);
   $$("button[data-tw]").forEach(b=>b.onclick=()=>copyTxt(p.tweets[+b.dataset.tw].text,`트윗 ${+b.dataset.tw+1}을 복사했어요`,b));
   $$("button[data-rp]").forEach(b=>b.onclick=()=>copyTxt(p.replies[+b.dataset.rp].text,"답글을 복사했어요",b));
   $$("button[data-t]").forEach(b=>b.onclick=()=>copyTxt(p.cands[+b.dataset.t],"훅 후보를 복사했어요",b));
  }else{
   $("#c1").onclick=e=>copy(p.copyAll,"본문+이미지 출처+AI 표기를 복사했어요",p,true,e.currentTarget);
   $("#c2").onclick=e=>copy(p.plain,"본문만 복사했어요",p,true,e.currentTarget);
   $("#c3").onclick=e=>copy(p.title,"제목을 복사했어요",p,false,e.currentTarget);
   $$("button[data-t]").forEach(b=>b.onclick=()=>copy(p.cands[+b.dataset.t],"제목 후보를 복사했어요",p,false,b));
  }
 }
}
/* ---------- routing / chrome ---------- */
let lastWasList=true;
function route(){
 const [id,tab]=decodeURIComponent(location.hash.slice(1)).split("/");
 renderSide();
 if(id&&P.some(p=>p.id===id)){const same=!lastWasList&&$("#content .dhead");show(id,tab);if(!same)scrollTo(0,0);lastWasList=false}
 else{renderList();if(!lastWasList)requestAnimationFrame(()=>scrollTo(0,S.listY||0));lastWasList=true}
}
function closeDrawer(){document.body.classList.remove("drawer")}
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem("dash_theme",t);$("#themeBtn").innerHTML=ic(t==="dark"?"sun":"moon");$("#themeBtn").title=t==="dark"?"라이트 모드":"다크 모드"}
$("#menuBtn").innerHTML=ic("menu");$("#sIco").innerHTML=ic("search");
$("#menuBtn").onclick=()=>document.body.classList.toggle("drawer");
$("#scrim").onclick=closeDrawer;
$("#themeBtn").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
$("#themeBtn").innerHTML=ic(document.documentElement.dataset.theme==="dark"?"sun":"moon");
$("#q").oninput=e=>{S.q=e.target.value;if(location.hash){S.listY=0;location.hash=""}else renderList()};
$("#sortSel").value=S.sort;$("#sortSel").onchange=e=>{S.sort=e.target.value;go()};
$("#needOnly").onchange=e=>{S.need=e.target.checked;go()};
document.addEventListener("keydown",e=>{
 if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$("#q").focus()}
 else if(e.key==="Escape"){if(document.body.classList.contains("drawer"))closeDrawer();else if(document.activeElement===$("#q")&&S.q){$("#q").value="";S.q="";renderList()}else if(location.hash)location.hash=""}
});
$("#foot").innerHTML=`빌드 ${esc(DATA.built)} · 총 ${P.length}편<br>게시·발행은 직접 수동으로 해요.`;
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
