보건복지상담센터 129로 하면 돼요.<\/li><\/ul>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/006/006_2_capture.png\" alt=\"&#x27;신청안내 &gt; 신청방법&#x27;의 신청 대상·장소·기간 (2026-10-05 확인)\"><figcaption>출처: 보건복지부 기초연금 누리집<\/figcaption><\/figure>\n<h3>지급은 신청한 달부터<\/h3>\n<p>기초연금은 신청한 날이 속한 달부터 지급되고, 매월 25일에 입금돼요. 25일이 토요일이나 공휴일이면 그 전날이에요. 예를 들어 7월에 신청해서 8월에 대상자로 결정되면, 8월 25일에 7월분까지 2개월 치를 받는다고 안내돼 있어요. 심사가 늦어져도 손해가 없다는 뜻이니, 생일 한 달 전에 맞춰 신청하는 게 가장 유리해요.<\/p>\n<h3>미리 가늠해 보고 싶다면<\/h3>\n<p>국민연금공단 FAQ에는 '내 곁에 국민연금' 앱의 노후준비 메뉴에 '기초연금 모의계산'과 '기초연금 신청하기'가 있다고 나와 있어요. 다만 모의계산 결과는 참고용이고 실제 결정은 심사에서 나와요. 메뉴 이름과 위치는 앱 업데이트에 따라 바뀔 수 있어요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>기준은 소득이 아니라 소득인정액(소득평가액 + 재산 환산액)<\/li><li>2026년 선정기준액: 단독 247만 원, 부부 395만 2천 원<\/li><li>신청: 생일 속한 달의 한 달 전부터, 지급은 신청한 달부터 매월 25일<\/li><\/ul>\n<p>제도는 해마다 바뀌니 신청 전에 복지로나 129에서 한 번 더 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 자체 제작 카드 · 사진 2 공식 화면 캡처 — 파일 images/posts/006/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래<\/td><td>복지로(bokjiro.go.kr) 기초연금 안내 화면 직접 캡처<\/td><td>로그인 전 공개 화면만, 캡처일 표기<\/td><\/tr><tr><td>'미리 가늠해 보고 싶다면'<\/td><td>'내 곁에 국민연금' 앱 모의계산 메뉴 화면<\/td><td>직접 해본 경우에만. 입력한 소득·재산 수치와 이름은 가림<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 농어촌 기본재산액 7,250만 원(정부24 '기초연금' 안내, 2026-10-05 검색 요약으로 확인)이 발행 시점에도 같은지 확인<\/li><li class=\"cb\">☐ '내 곁에 국민연금' 앱 메뉴 이름(기초연금 모의계산)이 현재 앱 화면과 같은지 확인 (같지 않으면 문장 수정)<\/li><li class=\"cb\">☐ 부부가구 559,520원은 정부24 표기를 그대로 옮긴 최고액이므로, 부부 감액 등 세부 계산은 쓰지 않았음을 유지<\/li><li class=\"cb\">☐ 직접 신청해 본 경험이 있다면 한두 문장만 추가 (없으면 '공식 안내 기준' 유지)<\/li><li class=\"cb\">☐ 보건복지부 보도자료 문장을 그대로 복사하지 않았는지 훑어보기<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>2026년 선정기준액(247만/395.2만), 2025년 비교, 70% 수준 설명, 수급자 86% 통계, 신청 3곳, 찾아뵙는 서비스, 1961년생<\/td><td>보건복지부 보도자료(2026-01-01) <a href=\"https://www.mohw.go.kr/board.es?act=view&amp;bid=0027&amp;list_no=1488478&amp;mid=a10503010100\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.mohw.go.kr/board.es?act=view&amp;bid=0027&amp;list_no=1488478&amp;mid=a10503010100<\/a><\/td><td>공식<\/td><\/tr><tr><td>소득인정액 계산식, 기본재산액(대도시 1억 3,500만·중소도시 8,500만·농어촌 7,250만 원 — 농어촌 값은 2026-10-05 검색 요약 확인), 단독 349,700원·부부 559,520원, 직역연금 제외, 신청 시기<\/td><td>정부24 기초연금 <a href=\"https://www.gov.kr/portal/service/serviceInfo/SSE000000170\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.kr/portal/service/serviceInfo/SSE000000170<\/a><\/td><td>공식<\/td><\/tr><tr><td>지급 기준(신청한 달부터), 매월 25일, 예시<\/td><td>기초연금 누리집 <a href=\"https://basicpension.mohw.go.kr/menu.es?mid=a10202020000\" target=\"_blank\" rel=\"noopener noreferrer\">https://basicpension.mohw.go.kr/menu.es?mid=a10202020000<\/a><\/td><td>공식<\/td><\/tr><tr><td>2026년 기준연금액 349,700원<\/td><td>찾기쉬운 생활법령정보 <a href=\"https://www.easylaw.go.kr/CSP/CnpClsMainBtr.laf?ccfNo=4&amp;cciNo=1&amp;cnpClsNo=1&amp;csmSeq=2056&amp;popMenu=ov\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.easylaw.go.kr/CSP/CnpClsMainBtr.laf?ccfNo=4&amp;cciNo=1&amp;cnpClsNo=1&amp;csmSeq=2056&amp;popMenu=ov<\/a><\/td><td>공식<\/td><\/tr><tr><td>'내 곁에 국민연금' 앱 기초연금 모의계산·신청 메뉴<\/td><td>국민연금공단 FAQ <a href=\"https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0095M0.do?menuId=MN24001131\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0095M0.do?menuId=MN24001131<\/a><\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "<ul><li>사진 2: 보건복지부 기초연금 누리집 공개 화면 캡처(2026-10-05 확인, 로그인 전 화면) <a href=\"https://basicpension.mohw.go.kr/menu.es?mid=a10201000000\" target=\"_blank\" rel=\"noopener noreferrer\">https://basicpension.mohw.go.kr/menu.es?mid=a10201000000<\/a><\/li><\/ul>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "\"월 소득이 247만 원을 넘으면 기초연금은 못 받는다\"는 말, 주변에서 들어보신 적 있으신가요? 공식 자료를 확인해 보니 기준은 '소득'이 아니라 '소득인정액'이에요. 보건복지부와 정부24 안내를 바탕으로 2026년 기준을 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/006/006_1_card.png\n\n먼저 숫자부터: 2026년 선정기준액\n\n보건복지부는 2026년 선정기준액을 단독가구 월 247만 원, 부부가구 월 395만 2천 원으로 정했다고 밝혔어요. 2025년(228만 원, 364만 8천 원)보다 단독가구 기준 19만 원, 8.3% 오른 금액이에요. 가구의 월 소득인정액이 이 기준액 이하면 기초연금을 받을 수 있어요. 선정기준액은 65세 이상 어르신 중 수급자가 70% 수준이 되도록 정하는 기준선이라고 설명되어 있고요.\n\n'소득인정액'은 어떻게 계산할까?\n\n소득인정액은 '월 소득평가액'과 '재산의 월 소득환산액'을 더한 값이에요. 그래서 월급이나 연금 수입이 같아도 재산이 얼마냐에 따라 결과가 달라질 수 있어요.\n\n- 근로소득은 116만 원을 뺀 뒤 30%를 더 공제해서 반영해요. 사업·재산·공적이전소득 같은 기타 소득은 따로 더해요.\n- 재산은 기본재산액(대도시 1억 3,500만 원, 중소도시 8,500만 원, 농어촌 7,250만 원)을 빼고, 금융재산은 2,000만 원을 공제한 뒤 부채를 차감해 월 소득으로 환산해요.\n- 고급 자동차와 회원권은 일반재산에서 빼고 따로 계산한다고 안내돼 있어요.\n\n얼마나 받을까?\n\n2026년 기준연금액은 월 349,700원이에요. 정부24에는 단독가구 최고 349,700원, 부부가구 최고 559,520원으로 안내되어 있고, 국민연금 가입기간과 급여액, 가구 유형, 소득인정액 수준에 따라 감액될 수 있다고 해요. 복지부 보도자료에 따르면 2025년 9월 통계 기준 실제 수급자의 약 86%는 소득인정액이 150만 원 미만이라고 해요.\n\n제외되는 경우도 있어요\n\n공무원연금, 사학연금, 군인연금, 별정우체국연금의 수급권자와 그 배우자는 원칙적으로 제외돼요. 다만 퇴직일시금을 받은 경우처럼 예외적으로 받을 수 있는 경우도 있어서, 해당될 것 같다면 창구에 꼭 문의해 보세요.\n\n신청은 어디서, 언제부터?\n\n- 신청 장소: 읍·면·동 행정복지센터, 국민연금공단 지사, 복지로(bokjiro.go.kr). 주소지 관할과 상관없이 신청할 수 있어요.\n- 신청 시기: 만 65세 생일이 속한 달의 한 달 전부터예요. 2026년에는 1961년생이 새로 대상이 돼요.\n- 거동이 불편하시면 국민연금공단(1355)에 '찾아뵙는 서비스'를 요청할 수 있고, 일반 문의는 보건복지상담센터 129로 하면 돼요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/006/006_2_capture.png\n출처: 보건복지부 기초연금 누리집\n\n지급은 신청한 달부터\n\n기초연금은 신청한 날이 속한 달부터 지급되고, 매월 25일에 입금돼요. 25일이 토요일이나 공휴일이면 그 전날이에요. 예를 들어 7월에 신청해서 8월에 대상자로 결정되면, 8월 25일에 7월분까지 2개월 치를 받는다고 안내돼 있어요. 심사가 늦어져도 손해가 없다는 뜻이니, 생일 한 달 전에 맞춰 신청하는 게 가장 유리해요.\n\n미리 가늠해 보고 싶다면\n\n국민연금공단 FAQ에는 '내 곁에 국민연금' 앱의 노후준비 메뉴에 '기초연금 모의계산'과 '기초연금 신청하기'가 있다고 나와 있어요. 다만 모의계산 결과는 참고용이고 실제 결정은 심사에서 나와요. 메뉴 이름과 위치는 앱 업데이트에 따라 바뀔 수 있어요.\n\n한눈에 정리\n\n- 기준은 소득이 아니라 소득인정액(소득평가액 + 재산 환산액)\n- 2026년 선정기준액: 단독 247만 원, 부부 395만 2천 원\n- 신청: 생일 속한 달의 한 달 전부터, 지급은 신청한 달부터 매월 25일\n\n제도는 해마다 바뀌니 신청 전에 복지로나 129에서 한 번 더 확인해 주세요.", "copyAll": "\"월 소득이 247만 원을 넘으면 기초연금은 못 받는다\"는 말, 주변에서 들어보신 적 있으신가요? 공식 자료를 확인해 보니 기준은 '소득'이 아니라 '소득인정액'이에요. 보건복지부와 정부24 안내를 바탕으로 2026년 기준을 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/006/006_1_card.png\n\n먼저 숫자부터: 2026년 선정기준액\n\n보건복지부는 2026년 선정기준액을 단독가구 월 247만 원, 부부가구 월 395만 2천 원으로 정했다고 밝혔어요. 2025년(228만 원, 364만 8천 원)보다 단독가구 기준 19만 원, 8.3% 오른 금액이에요. 가구의 월 소득인정액이 이 기준액 이하면 기초연금을 받을 수 있어요. 선정기준액은 65세 이상 어르신 중 수급자가 70% 수준이 되도록 정하는 기준선이라고 설명되어 있고요.\n\n'소득인정액'은 어떻게 계산할까?\n\n소득인정액은 '월 소득평가액'과 '재산의 월 소득환산액'을 더한 값이에요. 그래서 월급이나 연금 수입이 같아도 재산이 얼마냐에 따라 결과가 달라질 수 있어요.\n\n- 근로소득은 116만 원을 뺀 뒤 30%를 더 공제해서 반영해요. 사업·재산·공적이전소득 같은 기타 소득은 따로 더해요.\n- 재산은 기본재산액(대도시 1억 3,500만 원, 중소도시 8,500만 원, 농어촌 7,250만 원)을 빼고, 금융재산은 2,000만 원을 공제한 뒤 부채를 차감해 월 소득으로 환산해요.\n- 고급 자동차와 회원권은 일반재산에서 빼고 따로 계산한다고 안내돼 있어요.\n\n얼마나 받을까?\n\n2026년 기준연금액은 월 349,700원이에요. 정부24에는 단독가구 최고 349,700원, 부부가구 최고 559,520원으로 안내되어 있고, 국민연금 가입기간과 급여액, 가구 유형, 소득인정액 수준에 따라 감액될 수 있다고 해요. 복지부 보도자료에 따르면 2025년 9월 통계 기준 실제 수급자의 약 86%는 소득인정액이 150만 원 미만이라고 해요.\n\n제외되는 경우도 있어요\n\n공무원연금, 사학연금, 군인연금, 별정우체국연금의 수급권자와 그 배우자는 원칙적으로 제외돼요. 다만 퇴직일시금을 받은 경우처럼 예외적으로 받을 수 있는 경우도 있어서, 해당될 것 같다면 창구에 꼭 문의해 보세요.\n\n신청은 어디서, 언제부터?\n\n- 신청 장소: 읍·면·동 행정복지센터, 국민연금공단 지사, 복지로(bokjiro.go.kr). 주소지 관할과 상관없이 신청할 수 있어요.\n- 신청 시기: 만 65세 생일이 속한 달의 한 달 전부터예요. 2026년에는 1961년생이 새로 대상이 돼요.\n- 거동이 불편하시면 국민연금공단(1355)에 '찾아뵙는 서비스'를 요청할 수 있고, 일반 문의는 보건복지상담센터 129로 하면 돼요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/006/006_2_capture.png\n출처: 보건복지부 기초연금 누리집\n\n지급은 신청한 달부터\n\n기초연금은 신청한 날이 속한 달부터 지급되고, 매월 25일에 입금돼요. 25일이 토요일이나 공휴일이면 그 전날이에요. 예를 들어 7월에 신청해서 8월에 대상자로 결정되면, 8월 25일에 7월분까지 2개월 치를 받는다고 안내돼 있어요. 심사가 늦어져도 손해가 없다는 뜻이니, 생일 한 달 전에 맞춰 신청하는 게 가장 유리해요.\n\n미리 가늠해 보고 싶다면\n\n국민연금공단 FAQ에는 '내 일이나 공휴일이면 그 전날이에요. 예를 들어 7월에 신청해서 8월에 대상자로 결정되면, 8월 25일에 7월분까지 2개월 치를 받는다고 안내돼 있어요. 심사가 늦어져도 손해가 없다는 뜻이니, 생일 한 달 전에 맞춰 신청하는 게 가장 유리해요. 미리 가늠해 보고 싶다면 국민연금공단 FAQ에는 '내 곁에 국민연금' 앱의 노후준비 메뉴에 '기초연금 모의계산'과 '기초연금 신청하기'가 있다고 나와 있어요. 다만 모의계산 결과는 참고용이고 실제 결정은 심사에서 나와요. 메뉴 이름과 위치는 앱 업데이트에 따라 바뀔 수 있어요. 한눈에 정리 - 기준은 소득이 아니라 소득인정액(소득평가액 + 재산 환산액) - 2026년 선정기준액: 단독 247만 원, 부부 395만 2천 원 - 신청: 생일 속한 달의 한 달 전부터, 지급은 신청한 달부터 매월 25일 제도는 해마다 바뀌니 신청 전에 복지로나 129에서 한 번 더 확인해 주세요. 네이버"}, {"id": "005", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "005_benefit-notifier.md", "title": "정부24 '혜택알리미'로 내가 받을 수 있는 정부 혜택 확인하는 순서", "cands": ["정부24 '혜택알리미'로 내가 받을 수 있는 정부 혜택 확인하는 순서", "혜택알리미 '신청하세요'와 '확인하세요'는 뭐가 다를까?", "몰라서 못 받는 공공서비스, 가족 것까지 확인하는 방법 (피싱 주의점 포함)"], "cat": "복지·지원금", "kw": ["혜택알리미", "정부24", "정부 혜택 조회", "가족 맞춤안내"], "summary": "정부24 혜택알리미로 내가 받을 수 있는 공공서비스를 확인하는 순서와 비슷한 이름 앱·피싱 주의점 정리", "status": "초안", "created": "2026-10-05 01:34", "base": "2026-10-05", "need": 0, "chars": 2224, "chars_ns": 1723, "imgs": 4, "slots": 2, "filled": 2, "thumb": "img/005/005_0_thumb.png", "seHtml": "<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/005/005_0_thumb.png\" alt=\"대표 이미지\" width=\"720\"><\/p>\n<p>나라에서 주는 혜택이 많다는데, 정작 내가 받을 수 있는 게 뭔지는 알기 어렵잖아요. 행정안전부가 운영하는 '혜택알리미'는 소득, 거주지 같은 내 상황에 맞는 공공서비스를 찾아 알려주는 서비스예요. 어떤 서비스인지, 어떻게 쓰는지, 그리고 조심할 점까지 공식 발표와 정책브리핑 기사를 바탕으로 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/005/005_1_card.png\" alt=\"혜택알리미 한눈에 정리\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>혜택알리미는 어떤 서비스?<\/b><\/span><\/p>\n<p>행정안전부는 2025년 12월 9일, 혜택알리미를 10일부터 본격 운영한다고 밝혔어요. 한 번 가입하면 행정·공공기관의 공공서비스를 개인 맞춤형으로 알려주는 알림 서비스예요. 처음에는 청년·구직·임신·전입 등 4개 분야 1,500종을 안내했고, 본격 운영부터는 전 분야 6,000여 종으로 넓어졌다고 해요. 시범운영 기간에 93만 명이 가입했고 650만 건 이상의 공공서비스가 안내됐다는 설명도 있었어요.<\/p>\n<p>2025년 12월 발표 당시 이용 채널은 정부24와 기업은행·신한은행·하나은행·우리은행·웰로 등 5개 민간 앱이었고, 농협은행 앱도 12월 중 추가될 예정이라고 했어요. 이후 제공 채널이 늘었어요. 서울신문(2026년 9월 29일, 행정안전부 자료 인용)에 따르면 현재 정부24와 민간 앱 10곳을 합쳐 11개 앱에서 이용할 수 있고, 2026년 8월 말 기준 이용자가 약 416만 명, 안내 가능한 혜택은 7,075종이라고 해요. 지금 쓸 수 있는 앱의 전체 목록은 정부24 혜택알리미 안내 화면에서 확인해 주세요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>어떻게 이용하나요? (정책기자단 이용기 기준)<\/b><\/span><\/p>\n<p>대상은 국민 누구나(만 14세 미만 제외)라고 행정안전부 카드뉴스에 안내돼 있어요.<\/p>\n<ol><li>정부24에 로그인해요. 모바일 신분증, 간편인증, 공동·금융인증서로 로그인하면 추가 인증 없이 쓸 수 있다고 해요.<\/li><li>혜택알리미 홈에서 맞춤 조건을 설정해요.<\/li><li>서비스 이용에 동의해요. 연령, 소득, 가족 구성 같은 정보를 종합해서 분석하기 때문이에요.<\/li><li>결과 목록을 확인해요.<\/li><\/ol>\n<p>행정안전부 안내에는 정부24에서 혜택알리미에 가입하고 이용 동의를 한 뒤 '맞춤 혜택 알림 받기'를 선택하는 흐름으로 나와 있어요. 정부24 화면의 메뉴 이름은 바뀔 수 있으니 실제 화면은 직접 확인해 보세요.<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/005/005_2_card.png\" alt=\"혜택알리미 이용 흐름\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>'신청하세요'와 '확인하세요'의 차이<\/b><\/span><\/p>\n<p>결과 목록은 두 가지로 나뉘어요. '신청하세요'는 내 상황과 자격이 행정정보로 모두 확인되어 바로 신청할 수 있는 혜택이고, '확인하세요'는 일부 정보가 확인되지 않아 신청 조건을 직접 살펴봐야 하는 혜택이라고 설명돼요. 그러니 '확인하세요'에 있는 항목은 조건을 한 번 더 읽어 보는 게 좋겠죠.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>가족 혜택도 볼 수 있어요<\/b><\/span><\/p>\n<p>가족 맞춤안내 기능으로 가족의 혜택도 함께 확인할 수 있어요. 가족을 추가하고 그 가족의 정보제공 동의를 받아야 하고, 등록 대상은 주민등록등본상 같은 세대원이거나 가족관계등록부상 배우자 또는 직계 존속·비속이라고 안내돼요. 정부24 FAQ에 따르면 동의를 한 뒤에는 '맞춤안내 조회(재조회)'를 해야 가족 정보가 반영돼요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>꼭 알아둘 주의사항: 비슷한 이름의 앱<\/b><\/span><\/p>\n<p>행정안전부는 정부와 기업이 '혜택알리미'라는 별도 앱이나 개별 누리집을 운영하고 있지 않다고 밝혔어요. 그래서 같은 이름을 내세운 앱이나 링크를 이용한 피싱에 주의해야 해요. 정부24나 위에서 안내된 민간 앱 안에서 접속하는 것이 안전하다고 이해하시면 돼요.<\/p>\n<p>참고로 정부24 일부 화면에는 예전 이름인 '보조금24 맞춤안내' 표기가 보일 수 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>이런 점은 기억해 두세요<\/b><\/span><\/p>\n<p>혜택알리미가 보여 주는 결과는 행정정보와 내가 입력한 조건을 바탕으로 한 안내예요. 그래서 목록에 있다고 해서 자동으로 지급되는 것은 아니고, 신청 기간과 제출 서류, 접수 기관은 혜택마다 달라요. 정책기자단 이용기에서도 정책명을 누르면 서비스 대상, 신청 기간과 방법, 제출 서류, 접수 홈페이지까지 확인할 수 있었다고 소개돼 있어요. 신청 전에는 이 상세 화면과 해당 기관 공고를 꼭 읽어 보세요. 행정안전부 보도자료(2025년 12월)에는 가입하면 국민비서 서비스와 가입한 앱에서 알림을 받을 수 있다고 나와 있어요. 알림 세부 설정 화면은 앱마다 다를 수 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>혜택알리미는 정부24 등 공식 채널에서 이용하기<\/li><li>'신청하세요'는 바로 신청, '확인하세요'는 조건 확인<\/li><li>가족 혜택은 동의 절차가 필요<\/li><li>같은 이름의 별도 앱·링크는 피싱 주의<\/li><\/ul>\n<p>혜택 내용과 이용 채널은 바뀔 수 있으니 신청 전 해당 기관의 공식 안내를 꼭 확인해 주세요.<\/p><p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/lib/draft_5/d5_wm_Smartphone_Use.jpg\" alt=\"스마트폰 사용 사진(분위기 이미지, 혜택알리미 화면 아님)\" width=\"720\"><\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/005/005_0_thumb.png\n\n나라에서 주는 혜택이 많다는데, 정작 내가 받을 수 있는 게 뭔지는 알기 어렵잖아요. 행정안전부가 운영하는 '혜택알리미'는 소득, 거주지 같은 내 상황에 맞는 공공서비스를 찾아 알려주는 서비스예요. 어떤 서비스인지, 어떻게 쓰는지, 그리고 조심할 점까지 공식 발표와 정책브리핑 기사를 바탕으로 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/005/005_1_card.png\n\n혜택알리미는 어떤 서비스?\n\n행정안전부는 2025년 12월 9일, 혜택알리미를 10일부터 본격 운영한다고 밝혔어요. 한 번 가입하면 행정·공공기관의 공공서비스를 개인 맞춤형으로 알려주는 알림 서비스예요. 처음에는 청년·구직·임신·전입 등 4개 분야 1,500종을 안내했고, 본격 운영부터는 전 분야 6,000여 종으로 넓어졌다고 해요. 시범운영 기간에 93만 명이 가입했고 650만 건 이상의 공공서비스가 안내됐다는 설명도 있었어요.\n\n2025년 12월 발표 당시 이용 채널은 정부24와 기업은행·신한은행·하나은행·우리은행·웰로 등 5개 민간 앱이었고, 농협은행 앱도 12월 중 추가될 예정이라고 했어요. 이후 제공 채널이 늘었어요. 서울신문(2026년 9월 29일, 행정안전부 자료 인용)에 따르면 현재 정부24와 민간 앱 10곳을 합쳐 11개 앱에서 이용할 수 있고, 2026년 8월 말 기준 이용자가 약 416만 명, 안내 가능한 혜택은 7,075종이라고 해요. 지금 쓸 수 있는 앱의 전체 목록은 정부24 혜택알리미 안내 화면에서 확인해 주세요.\n\n어떻게 이용하나요? (정책기자단 이용기 기준)\n\n대상은 국민 누구나(만 14세 미만 제외)라고 행정안전부 카드뉴스에 안내돼 있어요.\n\n1. 정부24에 로그인해요. 모바일 신분증, 간편인증, 공동·금융인증서로 로그인하면 추가 인증 없이 쓸 수 있다고 해요.\n2. 혜택알리미 홈에서 맞춤 조건을 설정해요.\n3. 서비스 이용에 동의해요. 연령, 소득, 가족 구성 같은 정보를 종합해서 분석하기 때문이에요.\n4. 결과 목록을 확인해요.\n\n행정안전부 안내에는 정부24에서 혜택알리미에 가입하고 이용 동의를 한 뒤 '맞춤 혜택 알림 받기'를 선택하는 흐름으로 나와 있어요. 정부24 화면의 메뉴 이름은 바뀔 수 있으니 실제 화면은 직접 확인해 보세요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/005/005_2_card.png\n\n'신청하세요'와 '확인하세요'의 차이\n\n결과 목록은 두 가지로 나뉘어요. '신청하세요'는 내 상황과 자격이 행정정보로 모두 확인되어 바로 신청할 수 있는 혜택이고, '확인하세요'는 일부 정보가 확인되지 않아 신청 조건을 직접 살펴봐야 하는 혜택이라고 설명돼요. 그러니 '확인하세요'에 있는 항목은 조건을 한 번 더 읽어 보는 게 좋겠죠.\n\n가족 혜택도 볼 수 있어요\n\n가족 맞춤안내 기능으로 가족의 혜택도 함께 확인할 수 있어요. 가족을 추가하고 그 가족의 정보제공 동의를 받아야 하고, 등록 대상은 주민등록등본상 같은 세대원이거나 가족관계등록부상 배우자 또는 직계 존속·비속이라고 안내돼요. 정부24 FAQ에 따르면 동의를 한 뒤에는 '맞춤안내 조회(재조회)'를 해야 가족 정보가 반영돼요.\n\n꼭 알아둘 주의사항: 비슷한 이름의 앱\n\n행정안전부는 정부와 기업이 '혜택알리미'라는 별도 앱이나 개별 누리집을 운영하고 있지 않다고 밝혔어요. 그래서 같은 이름을 내세운 앱이나 링크를 이용한 피싱에 주의해야 해요. 정부24나 위에서 안내된 민간 앱 안에서 접속하는 것이 안전하다고 이해하시면 돼요.\n\n참고로 정부24 일부 화면에는 예전 이름인 '보조금24 맞춤안내' 표기가 보일 수 있어요.\n\n이런 점은 기억해 두세요\n\n혜택알리미가 보여 주는 결과는 행정정보와 내가 입력한 조건을 바탕으로 한 안내예요. 그래서 목록에 있다고 해서 자동으로 지급되는 것은 아니고, 신청 기간과 제출 서류, 접수 기관은 혜택마다 달라요. 정책기자단 이용기에서도 정책명을 누르면 서비스 대상, 신청 기간과 방법, 제출 서류, 접수 홈페이지까지 확인할 수 있었다고 소개돼 있어요. 신청 전에는 이 상세 화면과 해당 기관 공고를 꼭 읽어 보세요. 행정안전부 보도자료(2025년 12월)에는 가입하면 국민비서 서비스와 가입한 앱에서 알림을 받을 수 있다고 나와 있어요. 알림 세부 설정 화면은 앱마다 다를 수 있어요.\n\n한눈에 정리\n\n- 혜택알리미는 정부24 등 공식 채널에서 이용하기\n- '신청하세요'는 바로 신청, '확인하세요'는 조건 확인\n- 가족 혜택은 동의 절차가 필요\n- 같은 이름의 별도 앱·링크는 피싱 주의\n\n혜택 내용과 이용 채널은 바뀔 수 있으니 신청 전 해당 기관의 공식 안내를 꼭 확인해 주세요.\n\n[사진] https://senti-1000ma.github.io/blog-drafts/img/lib/draft_5/d5_wm_Smartphone_Use.jpg", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/005/005_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/005/005_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "005_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/005/005_1_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/005/005_1_card.png", "cap": "", "alt": "혜택알리미 한눈에 정리", "name": "005_1_card.png", "w": 1080, "h": 840}, {"n": 2, "label": "사진 2", "uri": "img/005/005_2_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/005/005_2_card.png", "cap": "", "alt": "혜택알리미 이용 흐름", "name": "005_2_card.png", "w": 1080, "h": 1129}, {"n": -1, "label": "추가 사진", "uri": "img/lib/draft_5/d5_wm_Smartphone_Use.jpg", "abs": "https://senti-1000ma.github.io/blog-drafts/img/lib/draft_5/d5_wm_Smartphone_Use.jpg", "cap": "", "alt": "스마트폰 사용 사진(분위기 이미지, 혜택알리미 화면 아님)", "name": "d5_wm_Smartphone_Use.jpg", "w": 1080, "h": 720}], "zip": "img/005/005_images.zip", "html": "<figure class=\"ph thumbfig\" data-n=\"0\"><img src=\"img/005/005_0_thumb.png\" alt=\"대표 이미지\"><\/figure>\n<p>나라에서 주는 혜택이 많다는데, 정작 내가 받을 수 있는 게 뭔지는 알기 어렵잖아요. 행정안전부가 운영하는 '혜택알리미'는 소득, 거주지 같은 내 상황에 맞는 공공서비스를 찾아 알려주는 서비스예요. 어떤 서비스인지, 어떻게 쓰는지, 그리고 조심할 점까지 공식 발표와 정책브리핑 기사를 바탕으로 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<figure class=\"ph\" data-n=\"1\"><img loading=\"lazy\" src=\"img/005/005_1_card.png\" alt=\"혜택알리미 한눈에 정리\"><\/figure>\n<h3>혜택알리미는 어떤 서비스?<\/h3>\n<p>행정안전부는 2025년 12월 9일, 혜택알리미를 10일부터 본격 운영한다고 밝혔어요. 한 번 가입하면 행정·공공기관의 공공서비스를 개인 맞춤형으로 알려주는 알림 서비스예요. 처음에는 청년·구직·임신·전입 등 4개 분야 1,500종을 안내했고, 본격 운영부터는 전 분야 6,000여 종으로 넓어졌다고 해요. 시범운영 기간에 93만 명이 가입했고 650만 건 이상의 공공서비스가 안내됐다는 설명도 있었어요.<\/p>\n<p>2025년 12월 발표 당시 이용 채널은 정부24와 기업은행·신한은행·하나은행·우리은행·웰로 등 5개 민간 앱이었고, 농협은행 앱도 12월 중 추가될 예정이라고 했어요. 이후 제공 채널이 늘었어요. 서울신문(2026년 9월 29일, 행정안전부 자료 인용)에 따르면 현재 정부24와 민간 앱 10곳을 합쳐 11개 앱에서 이용할 수 있고, 2026년 8월 말 기준 이용자가 약 416만 명, 안내 가능한 혜택은 7,075종이라고 해요. 지금 쓸 수 있는 앱의 전체 목록은 정부24 혜택알리미 안내 화면에서 확인해 주세요.<\/p>\n<h3>어떻게 이용하나요? (정책기자단 이용기 기준)<\/h3>\n<p>대상은 국민 누구나(만 14세 미만 제외)라고 행정안전부 카드뉴스에 안내돼 있어요.<\/p>\n<ol><li>정부24에 로그인해요. 모바일 신분증, 간편인증, 공동·금융인증서로 로그인하면 추가 인증 없이 쓸 수 있다고 해요.<\/li><li>혜택알리미 홈에서 맞춤 조건을 설정해요.<\/li><li>서비스 이용에 동의해요. 연령, 소득, 가족 구성 같은 정보를 종합해서 분석하기 때문이에요.<\/li><li>결과 목록을 확인해요.<\/li><\/ol>\n<p>행정안전부 안내에는 정부24에서 혜택알리미에 가입하고 이용 동의를 한 뒤 '맞춤 혜택 알림 받기'를 선택하는 흐름으로 나와 있어요. 정부24 화면의 메뉴 이름은 바뀔 수 있으니 실제 화면은 직접 확인해 보세요.<\/p>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/005/005_2_card.png\" alt=\"혜택알리미 이용 흐름\"><\/figure>\n<h3>'신청하세요'와 '확인하세요'의 차이<\/h3>\n<p>결과 목록은 두 가지로 나뉘어요. '신청하세요'는 내 상황과 자격이 행정정보로 모두 확인되어 바로 신청할 수 있는 혜택이고, '확인하세요'는 일부 정보가 확인되지 않아 신청 조건을 직접 살펴봐야 하는 혜택이라고 설명돼요. 그러니 '확인하세요'에 있는 항목은 조건을 한 번 더 읽어 보는 게 좋겠죠.<\/p>\n<h3>가족 혜택도 볼 수 있어요<\/h3>\n<p>가족 맞춤안내 기능으로 가족의 혜택도 함께 확인할 수 있어요. 가족을 추가하고 그 가족의 정보제공 동의를 받아야 하고, 등록 대상은 주민등록등본상 같은 세대원이거나 가족관계등록부상 배우자 또는 직계 존속·비속이라고 안내돼요. 정부24 FAQ에 따르면 동의를 한 뒤에는 '맞춤안내 조회(재조회)'를 해야 가족 정보가 반영돼요.<\/p>\n<h3>꼭 알아둘 주의사항: 비슷한 이름의 앱<\/h3>\n<p>행정안전부는 정부와 기업이 '혜택알리미'라는 별도 앱이나 개별 누리집을 운영하고 있지 않다고 밝혔어요. 그래서 같은 이름을 내세운 앱이나 링크를 이용한 피싱에 주의해야 해요. 정부24나 위에서 안내된 민간 앱 안에서 접속하는 것이 안전하다고 이해하시면 돼요.<\/p>\n<p>참고로 정부24 일부 화면에는 예전 이름인 '보조금24 맞춤안내' 표기가 보일 수 있어요.<\/p>\n<h3>이런 점은 기억해 두세요<\/h3>\n<p>혜택알리미가 보여 주는 결과는 행정정보와 내가 입력한 조건을 바탕으로 한 안내예요. 그래서 목록에 있다고 해서 자동으로 지급되는 것은 아니고, 신청 기간과 제출 서류, 접수 기관은 혜택마다 달라요. 정책기자단 이용기에서도 정책명을 누르면 서비스 대상, 신청 기간과 방법, 제출 서류, 접수 홈페이지까지 확인할 수 있었다고 소개돼 있어요. 신청 전에는 이 상세 화면과 해당 기관 공고를 꼭 읽어 보세요. 행정안전부 보도자료(2025년 12월)에는 가입하면 국민비서 서비스와 가입한 앱에서 알림을 받을 수 있다고 나와 있어요. 알림 세부 설정 화면은 앱마다 다를 수 있어요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>혜택알리미는 정부24 등 공식 채널에서 이용하기<\/li><li>'신청하세요'는 바로 신청, '확인하세요'는 조건 확인<\/li><li>가족 혜택은 동의 절차가 필요<\/li><li>같은 이름의 별도 앱·링크는 피싱 주의<\/li><\/ul>\n<p>혜택 내용과 이용 채널은 바뀔 수 있으니 신청 전 해당 기관의 공식 안내를 꼭 확인해 주세요.<\/p><div class=\"gallery\"><figure class=\"ph\"><img loading=\"lazy\" src=\"img/lib/draft_5/d5_wm_Smartphone_Use.jpg\" alt=\"스마트폰 사용 사진(분위기 이미지, 혜택알리미 화면 아님)\"><\/figure><\/div>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 자체 제작 카드 · 사진 2 자체 제작 카드 — 파일 images/posts/005/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>첫 화면(사진 1, 썸네일)<\/td><td>정부24 혜택알리미 홈 화면<\/td><td>로그인 전 공개 화면 권장. 개인 혜택 목록·이름이 보이면 가림<\/td><\/tr><tr><td>'이용 방법' 아래(사진 2)<\/td><td>조건 설정/결과 화면<\/td><td>직접 이용한 단계만 캡처. 가족 정보·소득 정보 가림<\/td><\/tr><tr><td>피싱 주의 문단 근처<\/td><td>행정안전부 보도 제목 캡처(출처 표기)<\/td><td>공식 문구를 이미지에만 넣지 말고 본문 텍스트도 유지<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 정부24 혜택알리미 안내 화면에서 현재 이용 가능한 앱 목록과 메뉴 이름을 직접 확인(본문은 '정부24에서 확인' 안내로 정리됨)<\/li><li class=\"cb\">☐ '보조금24' 표기 문장은 화면에서 더 이상 보이지 않으면 삭제<\/li><li class=\"cb\">☐ 직접 이용했다면 \"내 조건에서 몇 건 안내됐다\" 정도만 추가(개별 혜택명·금액·가족 정보는 가림)<\/li><li class=\"cb\">☐ 은행·민간 앱 홍보로 읽히지 않게 중립 표현 유지, 특정 지원금 금액·자격은 해당 부처 공고 링크와 기준일 필수<\/li><li class=\"cb\">☐ 행안부 카드뉴스·정책브리핑 이미지/텍스트는 공공누리 4유형 또는 협의 필요 대상이라 복사 금지(사실만 재서술)<\/li><\/ul>", "open": true}, {"title": "팩트체크 결과", "html": "<div class=\"tw\"><table><thead><tr><th>#<\/th><th>원본 '확인 필요'·확인 요청 항목<\/th><th>판정<\/th><th>확인 내용 · 출처<\/th><\/tr><\/thead><tbody><tr><td>5-1<\/td><td>본문 수치(2025-12-10 본격 운영, 6,000여 종, 시범 93만 명·650만 건, 5개 민간 앱, 농협 12월 추가, 별도 앱·누리집 없음/피싱 주의)<\/td><td>확인됨<\/td><td>행정안전부 정책브리핑 2025-12-09 <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148956160\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyNewsView.do?newsId=148956160<\/a><\/td><\/tr><tr><td>5-2<\/td><td>현재 제공 채널<\/td><td>불일치(정정/업데이트)<\/td><td>서울신문 2026-09-29(행안부 자료): 정부24 + 민간 앱 10곳 = 11개 앱, 이용자 415만 9,614명(2026-08말), 혜택 7,075종. 전자신문 2026-07-30: 농협 도입 완료, 카카오뱅크·모니모 하반기 도입 예정. 구체 앱 목록은 2차 보도뿐 → 2026-10-05 재조사에도 공식 목록 없음, 본문은 '정부24에서 확인' 안내로 재작성<\/td><\/tr><tr><td>5-3<\/td><td>이용 대상<\/td><td>확인됨(본문 추가)<\/td><td>국민 누구나(만 14세 미만 제외) — 행안부 카드뉴스 2025-12-18 <a href=\"https://www.korea.kr/multi/visualNewsView.do?newsId=148956713\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/multi/visualNewsView.do?newsId=148956713<\/a><\/td><\/tr><tr><td>5-4<\/td><td>가족 맞춤안내 등록 대상·동의·재조회<\/td><td>확인됨<\/td><td>정부24 FAQ <a href=\"https://www.gov.kr/portal/faq/3304\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.kr/portal/faq/3304<\/a> ; 정책기자단 <a href=\"https://www.korea.kr/news/reporterView.do?newsId=148957084\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/reporterView.do?newsId=148957084<\/a> (주민등록등본상 세대원·배우자·직계존비속)<\/td><\/tr><tr><td>5-5<\/td><td>가족 14세 이상 조건<\/td><td>확인 불가<\/td><td>2024 보조금24 시기 기사뿐, 현재 공식 근거 없음 → 2026-10-05 재조사에도 없음, 해당 문장 삭제<\/td><\/tr><tr><td>5-6<\/td><td>'보조금24 → 혜택알리미' 명칭<\/td><td>확인 불가(공식 개명 발표 없음) → 개명 주장 삭제, 표기 잔존만 서술<\/td><td>정부24 동의 화면이 아직 '보조금24 맞춤안내' 표기, 같은 rcvfvrSvc 경로 — <a href=\"https://www.gov.kr/mw/EgovPageLink.do?gubun=rcvfvrSvc&amp;link=etc%2FAA040_multi_icfrm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.kr/mw/EgovPageLink.do?gubun=rcvfvrSvc&amp;link=etc%2FAA040_multi_icfrm<\/a><\/td><\/tr><tr><td>5-7<\/td><td>알림 방식(국민비서 앱/문자)<\/td><td>확인됨(2026-10-05): 행안부 보도자료 '국민비서 서비스와 가입한 앱에서 알림' / 설정 절차는 쓰지 않음<\/td><td>행안부 카드뉴스·정책기자단에 \"국민비서 등\" 알림 언급. 채널 선택 설정 절차는 공식 자료 미확인<\/td><\/tr><tr><td>5-8<\/td><td>'신청하세요/확인하세요' 정의<\/td><td>확인됨<\/td><td>정책기자단 이용기 + 서울신문(2026-09-29) 설명 일치<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>2025-12-10 본격 운영, 6,000여 종, 5개 민간 앱, 농협 12월, 피싱 주의(별도 앱·누리집 없음), 시범 93만 명·650만 건<\/td><td>대한민국 정책브리핑(행정안전부) <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148956160\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyNewsView.do?newsId=148956160<\/a> (2025-12-09)<\/td><td>공식<\/td><\/tr><tr><td>이용 대상(만 14세 미만 제외), 이용 흐름<\/td><td>행정안전부 카드뉴스 <a href=\"https://www.korea.kr/multi/visualNewsView.do?newsId=148956713\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/multi/visualNewsView.do?newsId=148956713<\/a> (2025-12-18, 공공누리 4유형)<\/td><td>공식<\/td><\/tr><tr><td>이용 방법, 신청하세요/확인하세요, 가족 맞춤안내 조건<\/td><td>정책브리핑 정책기자단 이용기 <a href=\"https://www.korea.kr/news/reporterView.do?newsId=148957084\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/reporterView.do?newsId=148957084<\/a> (2026-01-05)<\/td><td>2차(정책기자단 후기)<\/td><\/tr><tr><td>가족 맞춤안내 동의 후 재조회<\/td><td>정부24 FAQ <a href=\"https://www.gov.kr/portal/faq/3304\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.kr/portal/faq/3304<\/a><\/td><td>공식<\/td><\/tr><tr><td>현재 채널·이용자·혜택 수(11개 앱, 415만 9,614명, 7,075종)<\/td><td>서울신문 2026-09-29 (행정안전부 자료 인용)<\/td><td>2차(언론)<\/td><\/tr><tr><td>농협 도입, 카카오뱅크·모니모 예정<\/td><td>전자신문 2026-07-30<\/td><td>2차(언론)<\/td><\/tr><tr><td>보조금24 표기 잔존<\/td><td>정부24 동의 화면 <a href=\"https://www.gov.kr/mw/EgovPageLink.do?gubun=rcvfvrSvc&amp;link=etc%2FAA040_multi_icfrm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.kr/mw/EgovPageLink.do?gubun=rcvfvrSvc&amp;link=etc%2FAA040_multi_icfrm<\/a><\/td><td>공식<\/td><\/tr><tr><td>(참고·오래됨) 가족 14세 이상 조건(보조금24 시기)<\/td><td>정책기자단 <a href=\"https://www.korea.kr/news/reporterView.do?newsId=148927130\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/reporterView.do?newsId=148927130<\/a> (2024-03-25)<\/td><td>2차·오래됨 → 본문에서 삭제<\/td><\/tr><tr><td>이용 채널(정부24+5개 민간 앱), 국민비서·가입 앱 알림, 별도 앱 없음·피싱 주의<\/td><td>행정안전부 보도자료(2025-12-09) <a href=\"https://mois.go.kr/frt/bbs/type010/commonSelectBoardArticle.do?bbsId=BBSMSTR_000000000008&amp;nttId=122292\" target=\"_blank\" rel=\"noopener noreferrer\">https://mois.go.kr/frt/bbs/type010/commonSelectBoardArticle.do?bbsId=BBSMSTR_000000000008&amp;nttId=122292<\/a> (첨부 PDF 열람)<\/td><td>공식<\/td><\/tr><tr><td>정부24 혜택알리미 홈<\/td><td><a href=\"https://www.gov.kr/portal/rcvfvrSvc/main\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.kr/portal/rcvfvrSvc/main<\/a> (박스에서 본문이 비어 화면 내용 확인 불가)<\/td><td>공식(내용 미확인)<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "<p>사진: Océanos y dados / Wikimedia Commons (CC0, 표기 의무 없음 — 출처 병기 권장) <a href=\"https://commons.wikimedia.org/wiki/File:Smartphone_Use.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">https://commons.wikimedia.org/wiki/File:Smartphone_Use.jpg<\/a><\/p>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 행정안전부 등 공식 발표 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 혜택 내용과 이용 채널은 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>\n<p>(참고: 광고·제휴·협찬·대가성 요소 없음. 특정 민간 앱·금융사 홍보 없음.)<\/p>", "open": false}], "plain": "나라에서 주는 혜택이 많다는데, 정작 내가 받을 수 있는 게 뭔지는 알기 어렵잖아요. 행정안전부가 운영하는 '혜택알리미'는 소득, 거주지 같은 내 상황에 맞는 공공서비스를 찾아 알려주는 서비스예요. 어떤 서비스인지, 어떻게 쓰는지, 그리고 조심할 점까지 공식 발표와 정책브리핑 기사를 바탕으로 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/005/005_1_card.png\n\n혜택알리미는 어떤 서비스?\n\n행정안전부는 2025년 12월 9일, 혜택알리미를 10일부터 본격 운영한다고 밝혔어요. 한 번 가입하면 행정·공공기관의 공공서비스를 개인 맞춤형으로 알려주는 알림 서비스예요. 처음에는 청년·구직·임신·전입 등 4개 분야 1,500종을 안내했고, 본격 운영부터는 전 분야 6,000여 종으로 넓어졌다고 해요. 시범운영 기간에 93만 명이 가입했고 650만 건 이상의 공공서비스가 안내됐다는 설명도 있었어요.\n\n2025년 12월 발표 당시 이용 채널은 정부24와 기업은행·신한은행·하나은행·우리은행·웰로 등 5개 민간 앱이었고, 농협은행 앱도 12월 중 추가될 예정이라고 했어요. 이후 제공 채널이 늘었어요. 서울신문(2026년 9월 29일, 행정안전부 자료 인용)에 따르면 현재 정부24와 민간 앱 10곳을 합쳐 11개 앱에서 이용할 수 있고, 2026년 8월 말 기준 이용자가 약 416만 명, 안내 가능한 혜택은 7,075종이라고 해요. 지금 쓸 수 있는 앱의 전체 목록은 정부24 혜택알리미 안내 화면에서 확인해 주세요.\n\n어떻게 이용하나요? (정책기자단 이용기 기준)\n\n대상은 국민 누구나(만 14세 미만 제외)라고 행정안전부 카드뉴스에 안내돼 있어요.\n\n1. 정부24에 로그인해요. 모바일 신분증, 간편인증, 공동·금융인증서로 로그인하면 추가 인증 없이 쓸 수 있다고 해요.\n2. 혜택알리미 홈에서 맞춤 조건을 설정해요.\n3. 서비스 이용에 동의해요. 연령, 소득, 가족 구성 같은 정보를 종합해서 분석하기 때문이에요.\n4. 결과 목록을 확인해요.\n\n행정안전부 안내에는 정부24에서 혜택알리미에 가입하고 이용 동의를 한 뒤 '맞춤 혜택 알림 받기'를 선택하는 흐름으로 나와 있어요. 정부24 화면의 메뉴 이름은 바뀔 수 있으니 실제 화면은 직접 확인해 보세요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/005/005_2_card.png\n\n'신청하세요'와 '확인하세요'의 차이\n\n결과 목록은 두 가지로 나뉘어요. '신청하세요'는 내 상황과 자격이 행정정보로 모두 확인되어 바로 신청할 수 있는 혜택이고, '확인하세요'는 일부 정보가 확인되지 않아 신청 조건을 직접 살펴봐야 하는 혜택이라고 설명돼요. 그러니 '확인하세요'에 있는 항목은 조건을 한 번 더 읽어 보는 게 좋겠죠.\n\n가족 혜택도 볼 수 있어요\n\n가족 맞춤안내 기능으로 가족의 혜택도 함께 확인할 수 있어요. 가족을 추가하고 그 가족의 정보제공 동의를 받아야 하고, 등록 대상은 주민등록등본상 같은 세대원이거나 가족관계등록부상 배우자 또는 직계 존속·비속이라고 안내돼요. 정부24 FAQ에 따르면 동의를 한 뒤에는 '맞춤안내 조회(재조회)'를 해야 가족 정보가 반영돼요.\n\n꼭 알아둘 주의사항: 비슷한 이름의 앱\n\n행정안전부는 정부와 기업이 '혜택알리미'라는 별도 앱이나 개별 누리집을 운영하고 있지 않다고 밝혔어요. 그래서 같은 이름을 내세운 앱이나 링크를 이용한 피싱에 주의해야 해요. 정부24나 위에서 안내된 민간 앱 안에서 접속하는 것이 안전하다고 이해하시면 돼요.\n\n참고로 정부24 일부 화면에는 예전 이름인 '보조금24 맞춤안내' 표기가 보일 수 있어요.\n\n이런 점은 기억해 두세요\n\n혜택알리미가 보여 주는 결과는 행정정보와 내가 입력한 조건을 바탕으로 한 안내예요. 그래서 목록에 있다고 해서 자동으로 지급되는 것은 아니고, 신청 기간과 제출 서류, 접수 기관은 혜택마다 달라요. 정책기자단 이용기에서도 정책명을 누르면 서비스 대상, 신청 기간과 방법, 제출 서류, 접수 홈페이지까지 확인할 수 있었다고 소개돼 있어요. 신청 전에는 이 상세 화면과 해당 기관 공고를 꼭 읽어 보세요. 행정안전부 보도자료(2025년 12월)에는 가입하면 국민비서 서비스와 가입한 앱에서 알림을 받을 수 있다고 나와 있어요. 알림 세부 설정 화면은 앱마다 다를 수 있어요.\n\n한눈에 정리\n\n- 혜택알리미는 정부24 등 공식 채널에서 이용하기\n- '신청하세요'는 바로 신청, '확인하세요'는 조건 확인\n- 가족 혜택은 동의 절차가 필요\n- 같은 이름의 별도 앱·링크는 피싱 주의\n\n혜택 내용과 이용 채널은 바뀔 수 있으니 신청 전 해당 기관의 공식 안내를 꼭 확인해 주세요.", "copyAll": "나라에서 주는 혜택이 많다는데, 정작 내가 받을 수 있는 게 뭔지는 알기 어렵잖아요. 행정안전부가 운영하는 '혜택알리미'는 소득, 거주지 같은 내 상황에 맞는 공공서비스를 찾아 알려주는 서비스예요. 어떤 서비스인지, 어떻게 쓰는지, 그리고 조심할 점까지 공식 발표와 정책브리핑 기사를 바탕으로 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/005/005_1_card.png\n\n혜택알리미는 어떤 서비스?\n\n행정안전부는 2025년 12월 9일, 혜택알리미를 10일부터 본격 운영한다고 밝혔어요. 한 번 가입하면 행정·공공기관의 공공서비스를 개인 맞춤형으로 알려주는 알림 서비스예요. 처음에는 청년·구직·임신·전입 등 4개 분야 1,500종을 안내했고, 본격 운영부터는 전 분야 6,000여 종으로 넓어졌다고 해요. 시범운영 기간에 93만 명이 가입했고 650만 건 이상의 공공서비스가 안내됐다는 설명도 있었어요.\n\n2025년 12월 발표 당시 이용 채널은 정부24와 기업은행·신한은행·하나은행·우리은행·웰로 등 5개 민간 앱이었고, 농협은행 앱도 12월 중 추가될 예정이라고 했어요. 이후 제공 채널이 늘었어요. 서울신문(2026년 9월 29일, 행정안전부 자료 인용)에 따르면 현재 정부24와 민간 앱 10곳을 합쳐 11개 앱에서 이용할 수 있고, 2026년 8월 말 기준 이용자가 약 416만 명, 안내 가능한 혜택은 7,075종이라고 해요. 지금 쓸 수 있는 앱의 전체 목록은 정부24 혜택알리미 안내 화면에서 확인해 주세요.\n\n어떻게 이용하나요? (정책기자단 이용기 기준)\n\n대상은 국민 누구나(만 14세 미만 제외)라고 행정안전부 카드뉴스에 안내돼 있어요.\n\n1. 정부24에 로그인해요. 모바일 신분증, 간편인증, 공동·금융인증서로 로그인하면 추가 인증 없이 쓸 수 있다고 해요.\n2. 혜택알리미 홈에서 맞춤 조건을 설정해요.\n3. 서비스 이용에 동의해요. 연령, 소득, 가족 구성 같은 정보를 종합해서 분석하기 때문이에요.\n4. 결과 목록을 확인해요.\n\n행정안전부 안내에는 정부24에서 혜택알리미에 가입하고 이용 동의를 한 뒤 '맞춤 혜택 알림 받기'를 선택하는 흐름으로 나와 있어요. 정부24 화면의 메뉴 이름은 바뀔 수 있으니 실제 화면은 직접 확인해 보세요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/005/005_2_card.png\n\n'신청하세요'와 '확인하세요'의 차이\n\n결과 목록은 두 가지로 나뉘어요. '신청하세요'는 내 상황과 자격이 행정정보로 모두 확인되어 바로 신청할 수 있는 혜택이고, '확인하세요'는 일부 정보가 확인되지 않아 신청 조건을 직접 살펴봐야 하는 혜택이라고 설명돼요. 그러니 '확인하세요'에 있는 항목은 조건을 한 번 더 읽어 보는 게 좋겠죠.\n\n가족 혜택도 볼 수 있어요\n\n가족 맞춤안내 기능으로 가족의 혜택도 함께 확인할 수 있어요. 가족을 추가하고 그 가족의 정보제공 동의를 받아야 하고, 등록 대상은 주민등록등본상 같은 세대원이거나 가족관계등록부상 배우자 또는 직계 존속·비속이라고 안내돼요. 정부24 FAQ에 따르면 동의를 한 뒤에는 '맞춤안내 조회(재조회)'를 해야 가족 정보가 반영돼요.\n\n꼭 알아둘 주의사항: 비슷한 이름의 앱\n\n행정안전부는 정부와 기업이 '혜택알리미'라는 별도 앱이나 개별 누리집을 운영하고 있지 않다고 밝혔어요. 그래서 같은 fts/img/005/005_2_card.png '신청하세요'와 '확인하세요'의 차이 결과 목록은 두 가지로 나뉘어요. '신청하세요'는 내 상황과 자격이 행정정보로 모두 확인되어 바로 신청할 수 있는 혜택이고, '확인하세요'는 일부 정보가 확인되지 않아 신청 조건을 직접 살펴봐야 하는 혜택이라고 설명돼요. 그러니 '확인하세요'에 있는 항목은 조건을 한 번 더 읽어 보는 게 좋겠죠. 가족 혜택도 볼 수 있어요 가족 맞춤안내 기능으로 가족의 혜택도 함께 확인할 수 있어요. 가족을 추가하고 그 가족의 정보제공 동의를 받아야 하고, 등록 대상은 주민등록등본상 같은 세대원이거나 가족관계등록부상 배우자 또는 직계 존속·비속이라고 안내돼요. 정부24 FAQ에 따르면 동의를 한 뒤에는 '맞춤안내 조회(재조회)'를 해야 가족 정보가 반영돼요. 꼭 알아둘 주의사항: 비슷한 이름의 앱 행정안전부는 정부와 기업이 '혜택알리미'라는 별도 앱이나 개별 누리집을 운영하고 있지 않다고 밝혔어요. 그래서 같은 이름을 내세운 앱이나 링크를 이용한 피싱에 주의해야 해요. 정부24나 위에서 안내된 민간 앱 안에서 접속하는 것이 안전하다고 이해하시면 돼요. 참고로 정부24 일부 화면에는 예전 이름인 '보조금24 맞춤안내' 표기가 보일 수 있어요. 이런 점은 기억해 두세요 혜택알리미가 보여 주는 결과는 행정정보와 내가 입력한 조건을 바탕으로 한 안내예요. 그래서 목록에 있다고 해서 자동으로 지급되는 것은 아니고, 신청 기간과 제출 서류, 접수 기관은 혜택마다 달라요. 정책기자단 이용기에서도 정책명을 누르면 서비스 대상, 신청 기간과 방법, 제출 서류, 접수 홈페이지까지 확인할 수 있었다고 소개돼 있어요. 신청 전에는 이 상세 화면과 해당 기관 공고를 꼭 읽어 보세요. 행정안전부 보도자료(2025년 12월)에는 가입하면 국민비서 서비스와 가입한 앱에서 알림을 받을 수 있다고 나와 있어요. 알림 세부 설정 화면은 앱마다 다를 수 있어요. 한눈에 정리 - 혜택알리미는 정부24 등 공식 채널에서 이용하기 - '신청하세요'는 바로 신청, '확인하세요'는 조건 확인 - 가족 혜택은 동의 절차가 필요 - 같은 이름의 별도 앱·링크는 피싱 주의 혜택 내용과 이용 채널은 바뀔 수 있으니 신청 전 해당 기관의 공식 안내를 꼭 확인해 주세요. 네이버"}, {"id": "004", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "004_hidden-financial-assets.md", "title": "안 쓰는 계좌에 내 돈이 남아 있을지도? '내계좌 한눈에' 조회 방법", "cands": ["안 쓰는 계좌에 내 돈이 남아 있을지도? '내계좌 한눈에' 조회 방법", "잠자는 내 돈 찾기, 어디서 조회하는지 헷갈릴 때 (금융감독원 파인 기준)", "휴면·장기미거래 계좌, 순서대로 따라 하면 되는 조회 방법"], "cat": "금융·자산조회", "kw": ["내계좌 한눈에", "휴면계좌", "장기미거래", "잠자는 내 돈 찾기"], "summary": "금감원 파인 '내계좌 한눈에'로 휴면·장기미거래 금융자산을 조회하는 방법과 피싱 주의점 정리", "status": "초안", "created": "2026-10-05 01:34", "base": "2026-10-05", "need": 0, "chars": 2455, "chars_ns": 1938, "imgs": 5, "slots": 2, "filled": 2, "thumb": "img/004/004_0_thumb.png", "seHtml": "<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/004/004_0_thumb.png\" alt=\"대표 이미지\" width=\"720\"><\/p>\n<p>오래전에 만든 통장이나 한동안 쓰지 않은 계좌, 한두 개쯤은 있으시죠? 그런 계좌에 돈이 남아 있는지 한 번에 확인할 수 있는 공식 서비스가 있어요. 금융감독원 금융소비자 정보포털 '파인'에서 안내하는 '내계좌 한눈에'입니다. 어떤 서비스인지, 어떻게 조회하는지 공식 안내를 중심으로 정리했어요. (2026년 10월 5일 기준)<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/004/004_1_capture.png\" alt=\"&#x27;내 돈 관리 &gt; 내계좌 통합조회 및 관리&#x27; 안내 (2026-10-05 확인)\" width=\"720\"><\/p><p style=\"text-align:center\"><span style=\"font-size:13px;color:#888888\">출처: 금융감독원 파인(금융소비자 정보포털) 홈페이지<\/span><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>'내계좌 한눈에'가 뭐예요?<\/b><\/span><\/p>\n<p>파인 안내에 따르면 '내계좌 한눈에(계좌정보통합관리 서비스)'는 내 장기 미거래·휴면 금융자산을 간편하게 조회하는 서비스예요. 조회 대상으로 예·적금, 신탁, 투자자 예탁금, 휴면예금, 보험금 등이 안내되어 있어요. 문의는 금감원 콜센터(1332)에서 받는다고 되어 있고요.<\/p>\n<p>접속 경로는 파인(fine.fss.or.kr)의 '내 돈 관리' 메뉴에서 '내계좌 통합조회 및 관리'를 찾아 들어가면 돼요. 공식 안내 화면에는 서비스 주소로 payinfo.or.kr이 표시되어 있어요. 검색 결과의 광고나 문자로 받은 링크 대신, 공식 주소를 직접 입력하거나 파인에서 들어가는 방법을 권해 드려요. (이 부분은 제 개인적인 권고예요.)<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>어떤 자산을 찾을 수 있나?<\/b><\/span><\/p>\n<p>금융위원회 보도자료(2023년 11월 13일)를 참고하면 대략 이런 구분이 있어요.<\/p>\n<ul><li>휴면금융자산: 소멸시효가 완성된 예금·보험금 등(휴면예금, 휴면보험금 등)<\/li><li>장기미거래 금융자산: 3년 이상 거래(입출금 등)가 없는 예·적금, 투자자예탁금, 보험금, 신탁 등<\/li><li>미사용 카드 포인트: 카드회원약관상 소멸시효가 5년이라서, 5년이 지나면 소멸할 수 있어요(금융위 2021년 1월 보도자료). 카드 포인트는 같은 경로의 '내 카드 한눈에'에서 조회·현금화할 수 있다고 안내돼요.<\/li><\/ul>\n<p>금융위는 1년 이상 거래가 없고 잔고가 100만 원 이하인 예금·적금·투자자예탁금·신탁계좌는 즉시 환급받을 수도 있다고 안내해요. 다만 '내계좌 통합조회'로는 대부분의 장기미거래 금융자산만 조회된다고 하니, 모든 자산이 한 번에 나온다고 기대하기는 어려워요.<\/p>\n<p>내계좌 한눈에로 조회되지 않는 자산도 있어요. 미청구 보험금은 '내 보험 찾아줌'(생명·손해보험협회), 실기주과실은 한국예탁결제원에서 따로 조회해야 한다고 안내돼요. 파인의 '업권별 계좌 조회 및 관리' 페이지에는 2026년 10월 5일 확인 기준으로 은행연합회(휴면예금·휴면보험금), 저축은행, 새마을금고(휴면예금·휴면공제금), 서민금융진흥원, 금융투자협회(휴면성증권), 한국예탁결제원(미수령주식·실기주과실), 내 보험 찾아줌, 보험개발원(자동차보험 과납보험료), 여신금융협회(카드포인트), 예금보험공사(파산금융기관 미수령금), 민원24(미환급공과금) 등 기관별 조회 링크가 모여 있어요. 항목 수와 구성은 바뀔 수 있어서 개수는 따로 적지 않을게요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>조회 순서 (금융위원회 안내 기준)<\/b><\/span><\/p>\n<ol><li>PC는 파인(fine.fss.or.kr) 또는 payinfo.or.kr에 접속하고, 모바일은 '어카운트인포' 앱을 설치<\/li><li>'내계좌 한눈에'(파인에서는 '내계좌 통합조회 및 관리') 선택<\/li><li>본인 인증(휴대폰 인증 등) 진행<\/li><li>본인 명의 계좌와 휴면·장기미거래 자산 확인(앱에서는 하단 '계좌' 또는 더보기 메뉴에서 찾을 수 있다고 안내)<\/li><li>필요한 경우 잔고 이전이나 미사용 계좌 해지 등 처리<\/li><\/ol>\n<p>이 순서는 금융위원회의 2023년 카드뉴스 안내를 바탕으로 정리한 것이라, 지금 화면에서는 메뉴 이름이나 배치가 다를 수 있어요. 어카운트인포 앱은 금융위원회가 2025년 9월 휴면·장기미거래 금융자산 찾기 캠페인에서 안내한 공식 앱이에요.<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/004/004_2_card.png\" alt=\"&#x27;내계좌 한눈에&#x27; 한눈에 정리\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>어떤 분들이 한 번 확인해 보면 좋을까?<\/b><\/span><\/p>\n<p>이 부분은 공식 자료가 아니라 제 생각이에요. 학생 때나 첫 직장 시절에 급여 통장을 여러 개 만들었던 분, 이사나 이직을 하면서 쓰던 은행이 바뀐 분, 자동이체를 정리하지 않고 방치한 계좌가 있는 분이라면 한 번쯤 조회해 볼 만해요. 내 명의로 어떤 계좌가 남아 있는지 파악해 두면 쓰지 않는 계좌를 정리하는 데도 도움이 되고요. 다만 조회 결과가 어떻게 나올지는 사람마다 다르고, 돈이 남아 있을 것이라고 장담할 수는 없어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>조회할 때 주의할 점<\/b><\/span><\/p>\n<ul><li>조회 화면에는 계좌번호와 잔액이 나오니 캡처나 공유 전에 반드시 가려 주세요.<\/li><li>인증서·휴대폰 인증 정보는 공식 사이트에서만 입력하세요.<\/li><li>금융위원회는 금융회사가 이메일이나 문자로 신분증·계좌 비밀번호를 요구하지 않고, 환급을 이유로 수수료 이체를 요구하지 않으며, 별도 URL을 보내지 않는다고 안내해요. 이런 연락은 피싱을 의심하세요.<\/li><li>어떤 금융상품을 가입하라거나 대출을 받으라는 안내와는 관계없는 조회 서비스예요.<\/li><\/ul>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>공식 서비스: 파인 '내계좌 한눈에'(장기 미거래·휴면 금융자산 조회)<\/li><li>접속은 공식 주소로, 인증은 공식 화면에서만<\/li><li>세부 대상 기준은 시기에 따라 달라질 수 있으니 공식 안내 재확인<\/li><\/ul>\n<p>제도와 화면은 바뀔 수 있으니 이용 전 금융감독원 공식 안내를 꼭 다시 확인해 주세요.<\/p><p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/lib/draft_4/d4_wm_Piggy_bank_968302.jpg\" alt=\"저축 이미지(분위기 이미지)\" width=\"720\"><\/p><p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/lib/draft_4/d4_kogl3146_bok_money_museum_01.jpg\" alt=\"한국은행 화폐박물관(분위기 이미지)\" width=\"720\"><\/p><p style=\"text-align:center\"><span style=\"font-size:13px;color:#888888\">출처: 한국관광공사(공공누리)<\/span><\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/004/004_0_thumb.png\n\n오래전에 만든 통장이나 한동안 쓰지 않은 계좌, 한두 개쯤은 있으시죠? 그런 계좌에 돈이 남아 있는지 한 번에 확인할 수 있는 공식 서비스가 있어요. 금융감독원 금융소비자 정보포털 '파인'에서 안내하는 '내계좌 한눈에'입니다. 어떤 서비스인지, 어떻게 조회하는지 공식 안내를 중심으로 정리했어요. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/004/004_1_capture.png\n출처: 금융감독원 파인(금융소비자 정보포털) 홈페이지\n\n'내계좌 한눈에'가 뭐예요?\n\n파인 안내에 따르면 '내계좌 한눈에(계좌정보통합관리 서비스)'는 내 장기 미거래·휴면 금융자산을 간편하게 조회하는 서비스예요. 조회 대상으로 예·적금, 신탁, 투자자 예탁금, 휴면예금, 보험금 등이 안내되어 있어요. 문의는 금감원 콜센터(1332)에서 받는다고 되어 있고요.\n\n접속 경로는 파인(fine.fss.or.kr)의 '내 돈 관리' 메뉴에서 '내계좌 통합조회 및 관리'를 찾아 들어가면 돼요. 공식 안내 화면에는 서비스 주소로 payinfo.or.kr이 표시되어 있어요. 검색 결과의 광고나 문자로 받은 링크 대신, 공식 주소를 직접 입력하거나 파인에서 들어가는 방법을 권해 드려요. (이 부분은 제 개인적인 권고예요.)\n\n어떤 자산을 찾을 수 있나?\n\n금융위원회 보도자료(2023년 11월 13일)를 참고하면 대략 이런 구분이 있어요.\n\n- 휴면금융자산: 소멸시효가 완성된 예금·보험금 등(휴면예금, 휴면보험금 등)\n- 장기미거래 금융자산: 3년 이상 거래(입출금 등)가 없는 예·적금, 투자자예탁금, 보험금, 신탁 등\n- 미사용 카드 포인트: 카드회원약관상 소멸시효가 5년이라서, 5년이 지나면 소멸할 수 있어요(금융위 2021년 1월 보도자료). 카드 포인트는 같은 경로의 '내 카드 한눈에'에서 조회·현금화할 수 있다고 안내돼요.\n\n금융위는 1년 이상 거래가 없고 잔고가 100만 원 이하인 예금·적금·투자자예탁금·신탁계좌는 즉시 환급받을 수도 있다고 안내해요. 다만 '내계좌 통합조회'로는 대부분의 장기미거래 금융자산만 조회된다고 하니, 모든 자산이 한 번에 나온다고 기대하기는 어려워요.\n\n내계좌 한눈에로 조회되지 않는 자산도 있어요. 미청구 보험금은 '내 보험 찾아줌'(생명·손해보험협회), 실기주과실은 한국예탁결제원에서 따로 조회해야 한다고 안내돼요. 파인의 '업권별 계좌 조회 및 관리' 페이지에는 2026년 10월 5일 확인 기준으로 은행연합회(휴면예금·휴면보험금), 저축은행, 새마을금고(휴면예금·휴면공제금), 서민금융진흥원, 금융투자협회(휴면성증권), 한국예탁결제원(미수령주식·실기주과실), 내 보험 찾아줌, 보험개발원(자동차보험 과납보험료), 여신금융협회(카드포인트), 예금보험공사(파산금융기관 미수령금), 민원24(미환급공과금) 등 기관별 조회 링크가 모여 있어요. 항목 수와 구성은 바뀔 수 있어서 개수는 따로 적지 않을게요.\n\n조회 순서 (금융위원회 안내 기준)\n\n1. PC는 파인(fine.fss.or.kr) 또는 payinfo.or.kr에 접속하고, 모바일은 '어카운트인포' 앱을 설치\n2. '내계좌 한눈에'(파인에서는 '내계좌 통합조회 및 관리') 선택\n3. 본인 인증(휴대폰 인증 등) 진행\n4. 본인 명의 계좌와 휴면·장기미거래 자산 확인(앱에서는 하단 '계좌' 또는 더보기 메뉴에서 찾을 수 있다고 안내)\n5. 필요한 경우 잔고 이전이나 미사용 계좌 해지 등 처리\n\n이 순서는 금융위원회의 2023년 카드뉴스 안내를 바탕으로 정리한 것이라, 지금 화면에서는 메뉴 이름이나 배치가 다를 수 있어요. 어카운트인포 앱은 금융위원회가 2025년 9월 휴면·장기미거래 금융자산 찾기 캠페인에서 안내한 공식 앱이에요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/004/004_2_card.png\n\n어떤 분들이 한 번 확인해 보면 좋을까?\n\n이 부분은 공식 자료가 아니라 제 생각이에요. 학생 때나 첫 직장 시절에 급여 통장을 여러 개 만들었던 분, 이사나 이직을 하면서 쓰던 은행이 바뀐 분, 자동이체를 정리하지 않고 방치한 계좌가 있는 분이라면 한 번쯤 조회해 볼 만해요. 내 명의로 어떤 계좌가 남아 있는지 파악해 두면 쓰지 않는 계좌를 정리하는 데도 도움이 되고요. 다만 조회 결과가 어떻게 나올지는 사람마다 다르고, 돈이 남아 있을 것이라고 장담할 수는 없어요.\n\n조회할 때 주의할 점\n\n- 조회 화면에는 계좌번호와 잔액이 나오니 캡처나 공유 전에 반드시 가려 주세요.\n- 인증서·휴대폰 인증 정보는 공식 사이트에서만 입력하세요.\n- 금융위원회는 금융회사가 이메일이나 문자로 신분증·계좌 비밀번호를 요구하지 않고, 환급을 이유로 수수료 이체를 요구하지 않으며, 별도 URL을 보내지 않는다고 안내해요. 이런 연락은 피싱을 의심하세요.\n- 어떤 금융상품을 가입하라거나 대출을 받으라는 안내와는 관계없는 조회 서비스예요.\n\n한눈에 정리\n\n- 공식 서비스: 파인 '내계좌 한눈에'(장기 미거래·휴면 금융자산 조회)\n- 접속은 공식 주소로, 인증은 공식 화면에서만\n- 세부 대상 기준은 시기에 따라 달라질 수 있으니 공식 안내 재확인\n\n제도와 화면은 바뀔 수 있으니 이용 전 금융감독원 공식 안내를 꼭 다시 확인해 주세요.\n\n[사진] https://senti-1000ma.github.io/blog-drafts/img/lib/draft_4/d4_wm_Piggy_bank_968302.jpg\n\n[사진] https://senti-1000ma.github.io/blog-drafts/img/lib/draft_4/d4_kogl3146_bok_money_museum_01.jpg\n출처: 한국관광공사(공공누리)", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/004/004_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/004/004_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "004_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/004/004_1_capture.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/004/004_1_capture.png", "cap": "출처: 금융감독원 파인(금융소비자 정보포털) 홈페이지", "alt": "'내 돈 관리 > 내계좌 통합조회 및 관리' 안내 (2026-10-05 확인)", "name": "004_1_capture.png", "w": 1080, "h": 817}, {"n": 2, "label": "사진 2", "uri": "img/004/004_2_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/004/004_2_card.png", "cap": "", "alt": "'내계좌 한눈에' 한눈에 정리", "name": "004_2_card.png", "w": 1080, "h": 826}, {"n": -1, "label": "추가 사진", "uri": "img/lib/draft_4/d4_wm_Piggy_bank_968302.jpg", "abs": "https://senti-1000ma.github.io/blog-drafts/img/lib/draft_4/d4_wm_Piggy_bank_968302.jpg", "cap": "", "alt": "저축 이미지(분위기 이미지)", "name": "d4_wm_Piggy_bank_968302.jpg", "w": 1080, "h": 720}, {"n": -1, "label": "추가 사진", "uri": "img/lib/draft_4/d4_kogl3146_bok_money_museum_01.jpg", "abs": "https://senti-1000ma.github.io/blog-drafts/img/lib/draft_4/d4_kogl3146_bok_money_museum_01.jpg", "cap": "출처: 한국관광공사(공공누리)", "alt": "한국은행 화폐박물관(분위기 이미지)", "name": "d4_kogl3146_bok_money_museum_01.jpg", "w": 760, "h": 507}], "zip": "img/004/004_images.zip", "html": "<figure class=\"ph thumbfig\" data-n=\"0\"><img src=\"img/004/004_0_thumb.png\" alt=\"대표 이미지\"><\/figure>\n<p>오래전에 만든 통장이나 한동안 쓰지 않은 계좌, 한두 개쯤은 있으시죠? 그런 계좌에 돈이 남아 있는지 한 번에 확인할 수 있는 공식 서비스가 있어요. 금융감독원 금융소비자 정보포털 '파인'에서 안내하는 '내계좌 한눈에'입니다. 어떤 서비스인지, 어떻게 조회하는지 공식 안내를 중심으로 정리했어요. (2026년 10월 5일 기준)<\/p>\n<figure class=\"ph\" data-n=\"1\"><img loading=\"lazy\" src=\"img/004/004_1_capture.png\" alt=\"&#x27;내 돈 관리 &gt; 내계좌 통합조회 및 관리&#x27; 안내 (2026-10-05 확인)\"><figcaption>출처: 금융감독원 파인(금융소비자 정보포털) 홈페이지<\/figcaption><\/figure>\n<h3>'내계좌 한눈에'가 뭐예요?<\/h3>\n<p>파인 안내에 따르면 '내계좌 한눈에(계좌정보통합관리 서비스)'는 내 장기 미거래·휴면 금융자산을 간편하게 조회하는 서비스예요. 조회 대상으로 예·적금, 신탁, 투자자 예탁금, 휴면예금, 보험금 등이 안내되어 있어요. 문의는 금감원 콜센터(1332)에서 받는다고 되어 있고요.<\/p>\n<p>접속 경로는 파인(fine.fss.or.kr)의 '내 돈 관리' 메뉴에서 '내계좌 통합조회 및 관리'를 찾아 들어가면 돼요. 공식 안내 화면에는 서비스 주소로 payinfo.or.kr이 표시되어 있어요. 검색 결과의 광고나 문자로 받은 링크 대신, 공식 주소를 직접 입력하거나 파인에서 들어가는 방법을 권해 드려요. (이 부분은 제 개인적인 권고예요.)<\/p>\n<h3>어떤 자산을 찾을 수 있나?<\/h3>\n<p>금융위원회 보도자료(2023년 11월 13일)를 참고하면 대략 이런 구분이 있어요.<\/p>\n<ul><li>휴면금융자산: 소멸시효가 완성된 예금·보험금 등(휴면예금, 휴면보험금 등)<\/li><li>장기미거래 금융자산: 3년 이상 거래(입출금 등)가 없는 예·적금, 투자자예탁금, 보험금, 신탁 등<\/li><li>미사용 카드 포인트: 카드회원약관상 소멸시효가 5년이라서, 5년이 지나면 소멸할 수 있어요(금융위 2021년 1월 보도자료). 카드 포인트는 같은 경로의 '내 카드 한눈에'에서 조회·현금화할 수 있다고 안내돼요.<\/li><\/ul>\n<p>금융위는 1년 이상 거래가 없고 잔고가 100만 원 이하인 예금·적금·투자자예탁금·신탁계좌는 즉시 환급받을 수도 있다고 안내해요. 다만 '내계좌 통합조회'로는 대부분의 장기미거래 금융자산만 조회된다고 하니, 모든 자산이 한 번에 나온다고 기대하기는 어려워요.<\/p>\n<p>내계좌 한눈에로 조회되지 않는 자산도 있어요. 미청구 보험금은 '내 보험 찾아줌'(생명·손해보험협회), 실기주과실은 한국예탁결제원에서 따로 조회해야 한다고 안내돼요. 파인의 '업권별 계좌 조회 및 관리' 페이지에는 2026년 10월 5일 확인 기준으로 은행연합회(휴면예금·휴면보험금), 저축은행, 새마을금고(휴면예금·휴면공제금), 서민금융진흥원, 금융투자협회(휴면성증권), 한국예탁결제원(미수령주식·실기주과실), 내 보험 찾아줌, 보험개발원(자동차보험 과납보험료), 여신금융협회(카드포인트), 예금보험공사(파산금융기관 미수령금), 민원24(미환급공과금) 등 기관별 조회 링크가 모여 있어요. 항목 수와 구성은 바뀔 수 있어서 개수는 따로 적지 않을게요.<\/p>\n<h3>조회 순서 (금융위원회 안내 기준)<\/h3>\n<ol><li>PC는 파인(fine.fss.or.kr) 또는 payinfo.or.kr에 접속하고, 모바일은 '어카운트인포' 앱을 설치<\/li><li>'내계좌 한눈에'(파인에서는 '내계좌 통합조회 및 관리') 선택<\/li><li>본인 인증(휴대폰 인증 등) 진행<\/li><li>본인 명의 계좌와 휴면·장기미거래 자산 확인(앱에서는 하단 '계좌' 또는 더보기 메뉴에서 찾을 수 있다고 안내)<\/li><li>필요한 경우 잔고 이전이나 미사용 계좌 해지 등 처리<\/li><\/ol>\n<p>이 순서는 금융위원회의 2023년 카드뉴스 안내를 바탕으로 정리한 것이라, 지금 화면에서는 메뉴 이름이나 배치가 다를 수 있어요. 어카운트인포 앱은 금융위원회가 2025년 9월 휴면·장기미거래 금융자산 찾기 캠페인에서 안내한 공식 앱이에요.<\/p>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/004/004_2_card.png\" alt=\"&#x27;내계좌 한눈에&#x27; 한눈에 정리\"><\/figure>\n<h3>어떤 분들이 한 번 확인해 보면 좋을까?<\/h3>\n<p>이 부분은 공식 자료가 아니라 제 생각이에요. 학생 때나 첫 직장 시절에 급여 통장을 여러 개 만들었던 분, 이사나 이직을 하면서 쓰던 은행이 바뀐 분, 자동이체를 정리하지 않고 방치한 계좌가 있는 분이라면 한 번쯤 조회해 볼 만해요. 내 명의로 어떤 계좌가 남아 있는지 파악해 두면 쓰지 않는 계좌를 정리하는 데도 도움이 되고요. 다만 조회 결과가 어떻게 나올지는 사람마다 다르고, 돈이 남아 있을 것이라고 장담할 수는 없어요.<\/p>\n<h3>조회할 때 주의할 점<\/h3>\n<ul><li>조회 화면에는 계좌번호와 잔액이 나오니 캡처나 공유 전에 반드시 가려 주세요.<\/li><li>인증서·휴대폰 인증 정보는 공식 사이트에서만 입력하세요.<\/li><li>금융위원회는 금융회사가 이메일이나 문자로 신분증·계좌 비밀번호를 요구하지 않고, 환급을 이유로 수수료 이체를 요구하지 않으며, 별도 URL을 보내지 않는다고 안내해요. 이런 연락은 피싱을 의심하세요.<\/li><li>어떤 금융상품을 가입하라거나 대출을 받으라는 안내와는 관계없는 조회 서비스예요.<\/li><\/ul>\n<h3>한눈에 정리<\/h3>\n<ul><li>공식 서비스: 파인 '내계좌 한눈에'(장기 미거래·휴면 금융자산 조회)<\/li><li>접속은 공식 주소로, 인증은 공식 화면에서만<\/li><li>세부 대상 기준은 시기에 따라 달라질 수 있으니 공식 안내 재확인<\/li><\/ul>\n<p>제도와 화면은 바뀔 수 있으니 이용 전 금융감독원 공식 안내를 꼭 다시 확인해 주세요.<\/p><div class=\"gallery\"><figure class=\"ph\"><img loading=\"lazy\" src=\"img/lib/draft_4/d4_wm_Piggy_bank_968302.jpg\" alt=\"저축 이미지(분위기 이미지)\"><\/figure><figure class=\"ph\"><img loading=\"lazy\" src=\"img/lib/draft_4/d4_kogl3146_bok_money_museum_01.jpg\" alt=\"한국은행 화폐박물관(분위기 이미지)\"><figcaption>출처: 한국관광공사(공공누리)<\/figcaption><\/figure><\/div>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 공식 화면 캡처 · 사진 2 자체 제작 카드 — 파일 images/posts/004/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>첫 화면(사진 1, 썸네일)<\/td><td>파인 '내계좌 통합조회 및 관리' 공식 안내 화면<\/td><td>공식 화면 캡처 시 출처·캡처일 표기. 개인 계좌 화면은 절대 썸네일로 쓰지 않기<\/td><\/tr><tr><td>'조회 순서' 아래(사진 2)<\/td><td>인증 전 단계 화면(개인정보 없는 화면)<\/td><td>계좌번호·잔액·이름·인증번호 노출 금지. 직접 진행한 단계만 캡처<\/td><\/tr><tr><td>(선택) 정리 표<\/td><td>자산 구분 표는 이미지가 아니라 텍스트<\/td><td>핵심 정보는 본문 텍스트로 유지<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 파인 '내계좌 통합조회 및 관리' 현재 화면에서 메뉴 위치('내 돈 관리' 등)와 인증 단계를 직접 확인(다르면 조회 순서 문장만 고치기)<\/li><li class=\"cb\">☐ 앱스토어/구글플레이에서 '어카운트인포' 공식 앱(개발사 확인) 표기 확인, 사칭 앱 주의 문구 유지<\/li><li class=\"cb\">☐ 직접 조회를 해 본 경우에만 \"조회해 보니 ~\" 경험 문장 추가. 조회 결과 수치(건수·금액)는 공개하지 않기 권장<\/li><li class=\"cb\">☐ 특정 은행·증권사·상품 추천, 대출·카드 안내를 덧붙이지 않기(애드포스트 정책 리스크)<\/li><li class=\"cb\">☐ 금융위·금감원 카드뉴스/포스터 이미지는 개별 공공누리 유형이 확인되지 않아 사용하지 않음(직접 캡처 권장)<\/li><\/ul>", "open": true}, {"title": "팩트체크 결과", "html": "<div class=\"tw\"><table><thead><tr><th>#<\/th><th>원본 '확인 필요'·확인 요청 항목<\/th><th>판정<\/th><th>확인 내용 · 출처<\/th><\/tr><\/thead><tbody><tr><td>4-1<\/td><td>파인 문구·payinfo.or.kr·금감원 콜센터 1332<\/td><td>확인됨<\/td><td><a href=\"https://fine.fss.or.kr/fine/main/contents.do?menuNo=900029\" target=\"_blank\" rel=\"noopener noreferrer\">https://fine.fss.or.kr/fine/main/contents.do?menuNo=900029<\/a><\/td><\/tr><tr><td>4-2<\/td><td>장기미거래 = 3년 이상 거래 없음 / 휴면 = 소멸시효 완성<\/td><td>확인됨<\/td><td>금융위 보도자료 2023-11-13 <a href=\"https://www.fsc.go.kr/no010101/81065\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsc.go.kr/no010101/81065<\/a><\/td><\/tr><tr><td>4-3<\/td><td>카드포인트 유효기간 5년<\/td><td>확인됨(표현 정정: '소멸시효 5년')<\/td><td>금융위 2021-01-05 \"카드회원약관상 소멸시효 5년\" <a href=\"https://www.fsc.go.kr/no010101/75079\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsc.go.kr/no010101/75079<\/a><\/td><\/tr><tr><td>4-4<\/td><td>'잠자는 내 돈 찾기 12종'<\/td><td>불일치(정정)<\/td><td>파인 '업권별 계좌 조회 및 관리'(<a href=\"https://fine.fss.or.kr/fine/main/contents.do?menuNo=900032\" target=\"_blank\" rel=\"noopener noreferrer\">https://fine.fss.or.kr/fine/main/contents.do?menuNo=900032<\/a>) 2026-10-05 확인 시 13개 항목 → 개수 표기 삭제. '새마을금고중앙회'는 파인 표기 '새마을금고'(휴면예금·휴면공제금)로 정정, 민원24(미환급공과금) 등 추가<\/td><\/tr><tr><td>4-5<\/td><td>즉시 환급 기준(초안 미포함 → 근거 확인)<\/td><td>확인됨(정정 사전방지)<\/td><td>1년 이상 거래 없고 잔고 100만 원 이하 예금·적금·투자자예탁금·신탁 — 금융위 <a href=\"https://www.fsc.go.kr/no010101/81065\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsc.go.kr/no010101/81065<\/a> , <a href=\"https://www.fsc.go.kr/no010101/85281\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsc.go.kr/no010101/85281<\/a><\/td><\/tr><tr><td>4-6<\/td><td>내계좌 한눈에로 조회 안 되는 자산<\/td><td>확인됨(본문 추가)<\/td><td>미청구 보험금은 '내 보험 찾아줌', 실기주과실은 한국예탁결제원 개별 조회, '대부분의' 장기미거래만 조회 — 금융위 85281 및 파인<\/td><\/tr><tr><td>4-7<\/td><td>조회 순서(PC·앱)<\/td><td>부분 확인 / 현재 화면은 확인 불가<\/td><td>금융위 카드뉴스 2023-11-13 <a href=\"https://www.fsc.go.kr/no040101?cnId=1968\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsc.go.kr/no040101?cnId=1968<\/a> 의 순서 반영. payinfo.or.kr은 박스에서 접속 시 오류 응답, 로그인 이후 화면은 확인 불가 → 본문은 '화면이 다를 수 있다'는 확인된 범위로 재작성(2026-10-05, 표시 제거)<\/td><\/tr><tr><td>4-8<\/td><td>어카운트인포 앱<\/td><td>확인됨<\/td><td>금융위 2025-09-15 정책브리핑 <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148949284\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyNewsView.do?newsId=148949284<\/a><\/td><\/tr><tr><td>4-9<\/td><td>피싱 주의 문구<\/td><td>확인됨(본문 추가)<\/td><td>금융위 안내(금융회사는 이메일·문자로 신분증·계좌 비밀번호 요구 안 함 등) — 위 금융위 자료<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>내계좌 한눈에 정의·조회 대상 예시, payinfo.or.kr, 금감원콜센터 1332<\/td><td>금융소비자 정보포털 파인 <a href=\"https://fine.fss.or.kr/fine/main/contents.do?menuNo=900029\" target=\"_blank\" rel=\"noopener noreferrer\">https://fine.fss.or.kr/fine/main/contents.do?menuNo=900029<\/a><\/td><td>공식<\/td><\/tr><tr><td>업권별 계좌 조회 및 관리(기관별 조회 링크)<\/td><td>파인 <a href=\"https://fine.fss.or.kr/fine/main/contents.do?menuNo=900032\" target=\"_blank\" rel=\"noopener noreferrer\">https://fine.fss.or.kr/fine/main/contents.do?menuNo=900032<\/a><\/td><td>공식<\/td><\/tr><tr><td>휴면·장기미거래 정의, 즉시환급(1년·100만 원 이하), 내 카드 한눈에<\/td><td>금융위원회 보도자료 2023-11-13 <a href=\"https://www.fsc.go.kr/no010101/81065\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsc.go.kr/no010101/81065<\/a> ; 후속 <a href=\"https://www.fsc.go.kr/no010101/85281\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsc.go.kr/no010101/85281<\/a><\/td><td>공식<\/td><\/tr><tr><td>카드포인트 소멸시효 5년<\/td><td>금융위원회 보도자료 2021-01-05 <a href=\"https://www.fsc.go.kr/no010101/75079\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsc.go.kr/no010101/75079<\/a><\/td><td>공식<\/td><\/tr><tr><td>조회 순서(PC·앱)<\/td><td>금융위원회 카드뉴스 2023-11-13 <a href=\"https://www.fsc.go.kr/no040101?cnId=1968\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.fsc.go.kr/no040101?cnId=1968<\/a><\/td><td>공식(2023, 화면 변경 가능)<\/td><\/tr><tr><td>어카운트인포 앱 안내(2025-09-15)<\/td><td>정책브리핑(금융위원회) <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148949284\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyNewsView.do?newsId=148949284<\/a><\/td><td>공식<\/td><\/tr><tr><td>(보조·미사용) 장기미거래 3년 등<\/td><td>IBK기업은행 블로그 <a href=\"https://blog.ibk.co.kr/2902\" target=\"_blank\" rel=\"noopener noreferrer\">https://blog.ibk.co.kr/2902<\/a> (2023-12-13)<\/td><td>2차 → 금융위 자료로 대체<\/td><\/tr><tr><td>payinfo.or.kr 직접 접속<\/td><td>박스 접속 시 오류 응답 → 서비스 화면 직접 확인 불가<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "<ul><li>사진 1: 금융감독원 파인(금융소비자 정보포털) 홈페이지 공개 화면 캡처(2026-10-05 확인, 로그인 전 화면) <a href=\"https://fine.fss.or.kr/fine/main/contents.do?menuNo=900029\" target=\"_blank\" rel=\"noopener noreferrer\">https://fine.fss.or.kr/fine/main/contents.do?menuNo=900029<\/a><\/li><\/ul>\n<p>사진: stevepb / Wikimedia Commons (CC0, 표기 의무 없음 — 출처 병기 권장) <a href=\"https://commons.wikimedia.org/wiki/File:Piggy-bank-968302.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">https://commons.wikimedia.org/wiki/File:Piggy-bank-968302.jpg<\/a><br>본 저작물은 한국관광공사에서 2015년 작성하여 공공누리 제1유형으로 개방한 '한국은행화폐박물관'을 이용하였으며, 해당 저작물은 공공누리(<a href=\"https://www.kogl.or.kr\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.kogl.or.kr<\/a>)에서 무료로 다운받으실 수 있습니다.<\/p>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 금융감독원 공식 안내를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 서비스 구성은 바뀔 수 있으니 이용 전 공식 안내를 다시 확인해 주세요.<\/blockquote>\n<p>(참고: 광고·제휴·협찬·대가성 요소 없음. 금융상품·대출·카드 연결 없음.)<\/p>", "open": false}], "plain": "오래전에 만든 통장이나 한동안 쓰지 않은 계좌, 한두 개쯤은 있으시죠? 그런 계좌에 돈이 남아 있는지 한 번에 확인할 수 있는 공식 서비스가 있어요. 금융감독원 금융소비자 정보포털 '파인'에서 안내하는 '내계좌 한눈에'입니다. 어떤 서비스인지, 어떻게 조회하는지 공식 안내를 중심으로 정리했어요. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/004/004_1_capture.png\n출처: 금융감독원 파인(금융소비자 정보포털) 홈페이지\n\n'내계좌 한눈에'가 뭐예요?\n\n파인 안내에 따르면 '내계좌 한눈에(계좌정보통합관리 서비스)'는 내 장기 미거래·휴면 금융자산을 간편하게 조회하는 서비스예요. 조회 대상으로 예·적금, 신탁, 투자자 예탁금, 휴면예금, 보험금 등이 안내되어 있어요. 문의는 금감원 콜센터(1332)에서 받는다고 되어 있고요.\n\n접속 경로는 파인(fine.fss.or.kr)의 '내 돈 관리' 메뉴에서 '내계좌 통합조회 및 관리'를 찾아 들어가면 돼요. 공식 안내 화면에는 서비스 주소로 payinfo.or.kr이 표시되어 있어요. 검색 결과의 광고나 문자로 받은 링크 대신, 공식 주소를 직접 입력하거나 파인에서 들어가는 방법을 권해 드려요. (이 부분은 제 개인적인 권고예요.)\n\n어떤 자산을 찾을 수 있나?\n\n금융위원회 보도자료(2023년 11월 13일)를 참고하면 대략 이런 구분이 있어요.\n\n- 휴면금융자산: 소멸시효가 완성된 예금·보험금 등(휴면예금, 휴면보험금 등)\n- 장기미거래 금융자산: 3년 이상 거래(입출금 등)가 없는 예·적금, 투자자예탁금, 보험금, 신탁 등\n- 미사용 카드 포인트: 카드회원약관상 소멸시효가 5년이라서, 5년이 지나면 소멸할 수 있어요(금융위 2021년 1월 보도자료). 카드 포인트는 같은 경로의 '내 카드 한눈에'에서 조회·현금화할 수 있다고 안내돼요.\n\n금융위는 1년 이상 거래가 없고 잔고가 100만 원 이하인 예금·적금·투자자예탁금·신탁계좌는 즉시 환급받을 수도 있다고 안내해요. 다만 '내계좌 통합조회'로는 대부분의 장기미거래 금융자산만 조회된다고 하니, 모든 자산이 한 번에 나온다고 기대하기는 어려워요.\n\n내계좌 한눈에로 조회되지 않는 자산도 있어요. 미청구 보험금은 '내 보험 찾아줌'(생명·손해보험협회), 실기주과실은 한국예탁결제원에서 따로 조회해야 한다고 안내돼요. 파인의 '업권별 계좌 조회 및 관리' 페이지에는 2026년 10월 5일 확인 기준으로 은행연합회(휴면예금·휴면보험금), 저축은행, 새마을금고(휴면예금·휴면공제금), 서민금융진흥원, 금융투자협회(휴면성증권), 한국예탁결제원(미수령주식·실기주과실), 내 보험 찾아줌, 보험개발원(자동차보험 과납보험료), 여신금융협회(카드포인트), 예금보험공사(파산금융기관 미수령금), 민원24(미환급공과금) 등 기관별 조회 링크가 모여 있어요. 항목 수와 구성은 바뀔 수 있어서 개수는 따로 적지 않을게요.\n\n조회 순서 (금융위원회 안내 기준)\n\n1. PC는 파인(fine.fss.or.kr) 또는 payinfo.or.kr에 접속하고, 모바일은 '어카운트인포' 앱을 설치\n2. '내계좌 한눈에'(파인에서는 '내계좌 통합조회 및 관리') 선택\n3. 본인 인증(휴대폰 인증 등) 진행\n4. 본인 명의 계좌와 휴면·장기미거래 자산 확인(앱에서는 하단 '계좌' 또는 더보기 메뉴에서 찾을 수 있다고 안내)\n5. 필요한 경우 잔고 이전이나 미사용 계좌 해지 등 처리\n\n이 순서는 금융위원회의 2023년 카드뉴스 안내를 바탕으로 정리한 것이라, 지금 화면에서는 메뉴 이름이나 배치가 다를 수 있어요. 어카운트인포 앱은 금융위원회가 2025년 9월 휴면·장기미거래 금융자산 찾기 캠페인에서 안내한 공식 앱이에요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/004/004_2_card.png\n\n어떤 분들이 한 번 확인해 보면 좋을까?\n\n이 부분은 공식 자료가 아니라 제 생각이에요. 학생 때나 첫 직장 시절에 급여 통장을 여러 개 만들었던 분, 이사나 이직을 하면서 쓰던 은행이 바뀐 분, 자동이체를 정리하지 않고 방치한 계좌가 있는 분이라면 한 번쯤 조회해 볼 만해요. 내 명의로 어떤 계좌가 남아 있는지 파악해 두면 쓰지 않는 계좌를 정리하는 데도 도움이 되고요. 다만 조회 결과가 어떻게 나올지는 사람마다 다르고, 돈이 남아 있을 것이라고 장담할 수는 없어요.\n\n조회할 때 주의할 점\n\n- 조회 화면에는 계좌번호와 잔액이 나오니 캡처나 공유 전에 반드시 가려 주세요.\n- 인증서·휴대폰 인증 정보는 공식 사이트에서만 입력하세요.\n- 금융위원회는 금융회사가 이메일이나 문자로 신분증·계좌 비밀번호를 요구하지 않고, 환급을 이유로 수수료 이체를 요구하지 않으며, 별도 URL을 보내지 않는다고 안내해요. 이런 연락은 피싱을 의심하세요.\n- 어떤 금융상품을 가입하라거나 대출을 받으라는 안내와는 관계없는 조회 서비스예요.\n\n한눈에 정리\n\n- 공식 서비스: 파인 '내계좌 한눈에'(장기 미거래·휴면 금융자산 조회)\n- 접속은 공식 주소로, 인증은 공식 화면에서만\n- 세부 대상 기준은 시기에 따라 달라질 수 있으니 공식 안내 재확인\n\n제도와 화면은 바뀔 수 있으니 이용 전 금융감독원 공식 안내를 꼭 다시 확인해 주세요.", "copyAll": "오래전에 만든 통장이나 한동안 쓰지 않은 계좌, 한두 개쯤은 있으시죠? 그런 계좌에 돈이 남아 있는지 한 번에 확인할 수 있는 공식 서비스가 있어요. 금융감독원 금융소비자 정보포털 '파인'에서 안내하는 '내계좌 한눈에'입니다. 어떤 서비스인지, 어떻게 조회하는지 공식 안내를 중심으로 정리했어요. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/004/004_1_capture.png\n출처: 금융감독원 파인(금융소비자 정보포털) 홈페이지\n\n'내계좌 한눈에'가 뭐예요?\n\n파인 안내에 따르면 '내계좌 한눈에(계좌정보통합관리 서비스)'는 내 장기 미거래·휴면 금융자산을 간편하게 조회하는 서비스예요. 조회 대상으로 예·적금, 신탁, 투자자 예탁금, 휴면예금, 보험금 등이 안내되어 있어요. 문의는 금감원 콜센터(1332)에서 받는다고 되어 있고요.\n\n접속 경로는 파인(fine.fss.or.kr)의 '내 돈 관리' 메뉴에서 '내계좌 통합조회 및 관리'를 찾아 들어가면 돼요. 공식 안내 화면에는 서비스 주소로 payinfo.or.kr이 표시되어 있어요. 검색 결과의 광고나 문자로 받은 링크 대신, 공식 주소를 직접 입력하거나 파인에서 들어가는 방법을 권해 드려요. (이 부분은 제 개인적인 권고예요.)\n\n어떤 자산을 찾을 수 있나?\n\n금융위원회 보도자료(2023년 11월 13일)를 참고하면 대략 이런 구분이 있어요.\n\n- 휴면금융자산: 소멸시효가 완성된 예금·보험금 등(휴면예금, 휴면보험금 등)\n- 장기미거래 금융자산: 3년 이상 거래(입출금 등)가 없는 예·적금, 투자자예탁금, 보험금, 신탁 등\n- 미사용 카드 포인트: 카드회원약관상 소멸시효가 5년이라서, 5년이 지나면 소멸할 수 있어요(금융위 2021년 1월 보도자료). 카드 포인트는 같은 경로의 '내 카드 한눈에'에서 조회·현금화할 수 있다고 안내돼요.\n\n금융위는 1년 이상 거래가 없고 잔고가 100만 원 이하인 예금·적금·투자자예탁금·신탁계좌는 즉시 환급받을 수도 있다고 안내해요. 다만 '내계좌 통합조회'로는 대부분의 장기미거래 금융자산만 조회된다고 하니, 모든 자산이 한 번에 나온다고 기대하기는 어려워요.\n\n내계좌 한눈에로 조회되지 않는 자산도 있어요. 미청구 보험금은 '내 보험 찾아줌'(생명·손해보험협회), 실기주과실은 한국예탁결제원에서 따로 조회해야 한다고 안내돼요. 파인의 '업권별 계좌 조회 및 관리' 페이지에는 2026년 10월 5일 확인 기준으로 은행연합회(휴면예금·휴면보험금), 저축은행, 새마을금고(휴면예금·휴면공제금), 서민금융진흥원, 금융투자협회(휴면성증권), 한국예탁결제원(미수령주식·실기주과실), 내 보험 찾아줌, 보험개발원(자동차보험 과납보험료), 여신금융협회(카드포인트), 예금보험공사(파산금융기관 미수령금), 민원24(미환급공과금) 등 기관별 조회 링크가 모여 있어요. 항목 수와 구성은 바뀔 수 있어서 개수는 따로 적지 않을게요.\n\n조회 순서 (금융위원회 안내 기준)\n\n1. PC는 파인(fine.fss.or.kr) 또는 payinfo.or.kr에 접속하고, 모바일은 '어카운트인포' 앱을 설치\n2. '내계좌 한눈에'(파인에서는 '내계좌 통합조회 및 관리') 선택\n3. 본인 인증(휴대폰 인증 등) 진행\n4. 본인 명의 계좌와 휴면·장기미거래 자산 확인(앱에서는 하단 '계좌' 또는 더보기 메뉴에서 찾을 수 있다고 안내)\n5. 필요한 경우 잔고 이전이나 미사용 계좌 해지 등 처리\n\n이 순서는 금융위원회의 2023년 카드뉴스 안내를 바탕으로 정리한 것이라, 지금 화면에서는 메뉴 이름이나 배치가 다를 수 있어요. 어카운트인포 앱은 금융위원회가 2025년 9월 휴면·장기미거래 금융자산 찾기 캠페인에서 안내한 공식 앱이에요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/004/004_2_card.png\n\n어떤 분들이 한 번 확인해 보면 좋을까?\n\n이 부분은 공식 자료가 아니라 제 생각이에요. 학생 때나 첫 직장 시절에 급여 통장을 여러 개 만들었던 분, 이사나 이직을 하면서 쓰던 은행이 바뀐 분, 자동이체를 정리하지 않고 방치한 계좌가 있는 분이라면 한 번쯤 조회해 볼 만해요. 내 명의로 어떤 계좌가 남아 있는지 파악해 두면 쓰지 않는 계좌를 정리하는 데도 도움이 되고요. 다만 조회 결과가 어떻게 나올지는 사람마다 다르고, 돈이 남아 있을 것이라고 장담할 수는 없어요.\n\n조회할 때 주의할 점\n\n- 조회 화면에는 계좌번호와 잔액이 나오니 캡처나 공유 전에 반드시 가려 주세요.\n- 인증서·휴대폰 인증 정보는 공식 사이트에서만 입력하세요.\n- 금융위원회는 금융회사가 이메일이나 문자로 신분증·계좌 비밀번호를 요구하지 않고, 환급을 이유로 수수료 이체를 요구하지 않으며, 별도 URL을 보내지 않는다고 안내해요. 이런 연락은 피싱을 의심하세요.\n- 어떤 금융상품을 가입하라거나 대출을 받으라는 안내와는 관계없는 조회 서비스예요.\n\n한눈에 정리\n\n- 공식 서비스: 파인 '내계좌 한눈에'(장기 미거래·휴면 금융자산 조회)\n- 접속은 공식 주소로, 인증은 공식 화면에서만\n- 세부 대상 기준은 시기에 따라 달라질 수 있으니 공식 안내 재확인\n\n제도와 화면은 바뀔 수 있으니 이용 전 금융감독원 공식 안내를 꼭 다시 확인해 주세요.", "search": "004 안 쓰는 계좌에 내 돈이 남아 있을지도? '내계좌 한눈에' 조회 방법 금융·자산조회 내계좌 한눈에, 휴면계좌, 장기미거래, 잠자는 내 돈 찾기 금감원 파인 '내계좌 한눈에'로 휴면·장기미거래 금융자산을 조회하는 방법과 피싱 주의점 정리 오래전에 만든 통장이나 한동안 쓰지 않은 계좌, 한두 개쯤은 있으시죠? 그런 계좌에 돈이 남아 있는지 한 번에 확인할 수 있는 공식 서비스가 있어요. 금융감독원 금융소비자 정보포털 '파인'에서 안내하는 '내계좌 한눈에'입니다. 어떤 서비스인지, 어떻게 조회하는지 공식 안내를 중심으로 정리했어요. (2026년 10월 5일 기준) [사진 1] https://senti-1000ma.github.io/blog-drafts/img/004/004_1_capture.png 출처: 금융감독원 파인(금융소비자 정보포털) 홈페이지 '내계좌 한눈에'가 뭐예요? 파인 안내에 따르면 '내계좌 한눈에(계좌정보통합관리 서비스)'는 내 장기 미거래·휴면 금융자산을 간편하게 조회하는 서비스예요. 조회 대상으로 예·적금, 신탁, 투자자 예탁금, 휴면예금, 보험금 등이 안내되어 있어요. 문의는 금감원 콜센터(1332)에서 받는다고 되어 있고요. 접속 경로는 파인(fine.fss.or.kr)의 '내 돈 관리' 메뉴에서 '내계좌 통합조회 및 관리'를 찾아 들어가면 돼요. 공식 안내 화면에는 서비스 주소로 payinfo.or.kr이 표시되어 있어요. 검색 결과의 광고나 문자로 받은 링크 대신, 공식 주소를 직접 입력하거나 파인에서 들어가는 방법을 권해 드려요. (이 부분은 제 개인적인 권고예요.) 어떤 자산을 찾을 수 있나? 금융위원회 보도자료(2023년 11월 13일)를 참고하면 대략 이런 구분이 있어요. - 휴면금융자산: 소멸시효가 완성된 예금·보험금 등(휴면예금, 휴면보험금 등) - 장기미거래 금융자산: 3년 이상 거래(입출금 등)가 없는 예·적금, 투자자예탁금, 보험금, 신탁 등 - 미사용 카드 포인트: 카드회원약관상 소멸시효가 5년이라서, 5년이 지나면 소멸할 수 있어요(금융위 2021년 1월 보도자료). 카드 포인트는 같은 경로의 '내 카드 한눈에'에서 조회·현금화할 수 있다고 안내돼요. 금융위는 1년 이상 거래가 없고 잔고가 100만 원 이하인 예금·적금·투자자예탁금·신탁계좌는 즉시 환급받을 수도 있다고 안내해요. 다만 '내계좌 통합조회'로는 대부분의 장기미거래 금융자산만 조회된다고 하니, 모든 자산이 한 번에 나온다고 기대하기는 어려워요. 내계좌 한눈에로 조회되지 않는 자산도 있어요. 미청구 보험금은 '내 보험 찾아줌'(생명·손해보험협회), 실기주과실은 한국예탁결제원에서 따로 조회해야 한다고 안내돼요. 파인의 '업권별 계좌 조회 및 관리' 페이지에는 2026년 10월 5일 확인 기준으로 은행연합회(휴면예금·휴면보험금), 저축은행, 새마을금고(휴면예금·휴면공제금), 서민금융진흥원, 금융투자협회(휴면성증권), 한국예탁결제원(미수령주식·실기주과실), 내 보험 찾아줌, 보험개발원(자동차보험 과납보험료), 여신금융협회(카드포인트), 예금보험공사(파산금융기관 미수령금), 민원24(미환급공과금) 등 기관별 조회 링크가 모여 있어요. 항목 수와 구성은 바뀔 수 있어서 개수는 따로 적지 않을게요. 조회 순서 (금융위원회 안내 기준) 1. PC는 파인(fine.fss.or.kr) 또는 payinfo.or.kr에 접속하고, 모바일은 '어카운트인포' 앱을 설치 2. '내계좌 한눈에'(파인에서는 '내계좌 통합조회 및 관리') 선택 3. 본인 인증(휴대폰 인증 등) 진행 4. 본인 명의 계좌와 휴면·장기미거래 자산 확인(앱에서는 하단 '계좌' 또는 더보기 메뉴에서 찾을 수 있다고 안내) 5. 필요한 경우 잔고 이전이나 미사용 계좌 해지 등 처리 이 순서는 금융위원회의 2023년 카드뉴스 안내를 바탕으로 정리한 것이라, 지금 화면에서는 메뉴 이름이나 배치가 다를 수 있어요. 어카운트인포 앱은 금융위원회가 2025년 9월 휴면·장기미거래 금융자산 찾기 캠페인에서 안내한 공식 앱이에요. [사진 2] https://senti-1000ma.github.io/blog-drafts/img/004/004_2_card.png 어떤 분들이 한 번 확인해 보면 좋을까? 이 부분은 공식 자료가 아니라 제 생각이에요. 학생 때나 첫 직장 시절에 급여 통장을 여러 개 만들었던 분, 이사나 이직을 하면서 쓰던 은행이 바뀐 분, 자동이체를 정리하지 않고 방치한 계좌가 있는 분이라면 한 번쯤 조회해 볼 만해요. 내 명의로 어떤 계좌가 남아 있는지 파악해 두면 쓰지 않는 계좌를 정리하는 데도 도움이 되고요. 다만 조회 결과가 어떻게 나올지는 사람마다 다르고, 돈이 남아 있을 것이라고 장담할 수는 없어요. 조회할 때 주의할 점 - 조회 화면에는 계좌번호와 잔액이 나오니 캡처나 공유 전에 반드시 가려 주세요. - 인증서·휴대폰 인증 정보는 공식 사이트에서만 입력하세요. - 금융위원회는 금융회사가 이메일이나 문자로 신분증·계좌 비밀번호를 요구하지 않고, 환급을 이유로 수수료 이체를 요구하지 않으며, 별도 URL을 보내지 않는다고 안내해요. 이런 연락은 피싱을 의심하세요. - 어떤 금융상품을 가입하라거나 대출을 받으라는 안내와는 관계없는 조회 서비스예요. 한눈에 정리 - 공식 서비스: 파인 '내계좌 한눈에'(장기 미거래·휴면 금융자산 조회) - 접속은 공식 주소로, 인증은 공식 화면에서만 - 세부 대상 기준은 시기에 따라 달라질 수 있으니 공식 안내 재확인 제도와 화면은 바뀔 수 있으니 이용 전 금융감독원 공식 안내를 꼭 다시 확인해 주세요. 네이버"}, {"id": "003", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "003_car-inspection.md", "title": "자동차 정기검사 기간 놓치면 과태료 얼마? 예전 글과 달라진 기준 정리", "cands": ["자동차 정기검사 기간 놓치면 과태료 얼마? 예전 글과 달라진 기준 정리", "검사 만료일 '90일 전부터 31일 후까지', 이 숫자만 기억하세요", "자동차검사 예약부터 재검사 기간까지, 헷갈리는 날짜 한 번에 정리"], "cat": "자동차·운전", "kw": ["자동차 정기검사", "검사 기간", "과태료", "재검사"], "summary": "자동차 정기검사 기간(만료 전 90일~후 31일)·과태료·재검사 기간을 공단 FAQ 기준으로 정리", "status": "초안", "created": "2026-10-05 01:33", "base": "2026-10-05", "need": 0, "chars": 1977, "chars_ns": 1525, "imgs": 4, "slots": 2, "filled": 2, "thumb": "img/003/003_0_thumb.png", "seHtml": "<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/003/003_0_thumb.png\" alt=\"대표 이미지\" width=\"720\"><\/p>\n<p>자동차검사 기간을 깜빡해서 과태료 고지서를 받았다는 이야기, 주변에서 한 번쯤 들어보셨을 거예요. 그런데 인터넷에는 예전 기준의 과태료 금액이 아직 많이 남아 있어서 헷갈리기 쉬워요. 그래서 TS한국교통안전공단의 공식 FAQ를 기준으로 기간과 과태료를 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/003/003_1_capture.png\" alt=\"첫 화면의 &#x27;자동차 검사 예약&#x27; 메뉴 (2026-10-05 확인)\" width=\"720\"><\/p><p style=\"text-align:center\"><span style=\"font-size:13px;color:#888888\">출처: 한국교통안전공단 사이버검사소 홈페이지<\/span><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>검사는 만료일 당일에만 받는 게 아니에요<\/b><\/span><\/p>\n<p>정기검사는 검사유효기간 만료일 전 90일부터 후 31일까지를 검사기간으로 봐요. 이 기간 안에 적합 판정을 받으면 만료일에 검사를 받은 것으로 인정됩니다. 그러니 달력에 만료일 하나만 적어 두기보다, 만료일 약 3개월 전부터 여유 있게 예약해 두는 게 편해요. 기간 안에 검사를 마쳤다면 과태료 부과 대상이 아니라고 공단은 안내하고 있어요.<\/p>\n<p>예약은 사이버검사소(www.cyberts.kr)나 모바일, 또는 고객콜센터 1577-0990으로 할 수 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>날짜로 감 잡기 (가상의 예시예요)<\/b><\/span><\/p>\n<p>내 차의 검사유효기간 만료일이 2026년 11월 30일이라고 가정해 볼게요. 이때 정기검사기간은 90일 전인 2026년 9월 1일부터 31일 후인 12월 31일까지로 계산돼요. 이 기간 안에만 검사를 마치면 되는 거죠. 실제 내 차의 만료일과 검사기간은 자동차등록증이나 사이버검사소에서 꼭 확인해 주세요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>유효기간은 얼마나 될까?<\/b><\/span><\/p>\n<p>공단 FAQ 기준으로 비사업용 승용차의 정기검사 유효기간은 2년이에요. 신조차로서 신규검사를 받은 것으로 보는 차량의 최초 검사유효기간은 5년이라고 되어 있고요. 사업용 승용차나 승합·화물차는 차종과 차령에 따라 다르니, 본인 차량이 어디에 해당하는지는 자동차등록증과 공단 안내에서 확인하셔야 해요. 다만 종합검사 대상지역(서울 전역, 인천 대부분, 경기 일부 시, 대전, 세종 등 — 정확한 목록은 한국교통안전공단 안내표 참조)에 등록된 비사업용 승용차는 차령이 4년을 넘으면 정기검사 대신 종합검사(정기검사+배출가스 정밀검사 통합)를 받고, 이때 검사 유효기간은 2년이라고 안내돼요. 내 차의 지역이 대상인지는 공단 종합검사 안내표에서 확인해 주세요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>기간을 넘기면 과태료는 얼마?<\/b><\/span><\/p>\n<p>공단 FAQ에는 자동차관리법 시행령 별표 2의 부과기준이 이렇게 정리되어 있어요.<\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>검사 지연 기간<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>과태료<\/b><\/td><\/tr><tr><td>30일 이내<\/td><td>4만 원<\/td><\/tr><tr><td>30일 초과 114일 이내<\/td><td>4만 원에 31일째부터 3일 초과할 때마다 2만 원 가산<\/td><\/tr><tr><td>115일 이상<\/td><td>60만 원<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p>과태료는 공단이 아니라 차량이 등록된 지자체에서 부과해요. 그래서 고지서를 받았다면 정확한 금액과 계산 방식은 해당 지자체에 문의하는 게 가장 확실합니다. 가산 금액을 직접 계산하는 방법은 해석이 갈릴 수 있어서 이 글에서는 따로 예시를 만들지 않았어요.<\/p>\n<p>참고로 예전에 쓰인 글에는 \"2만 원부터 시작해 최대 30만 원\"이라고 적힌 경우가 많은데, 이는 2022년 4월 13일까지의 종전 기준이에요. 서울시 안내에 따르면 2022년 4월 14일부터 검사 지연 30일 이내 과태료가 2만 원에서 4만 원, 31일째부터 3일마다 가산 금액이 1만 원에서 2만 원, 115일 이상 최고액이 30만 원에서 60만 원으로 2배 올랐어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>부적합이 나왔다면 재검사<\/b><\/span><\/p>\n<p>검사에서 부적합 판정을 받으면 재검사를 받아야 하는데, 공단 안내에 따르면 재검사기간은 검사기간 만료 후 10일 이내예요(기간을 셀 때 토·일요일, 공휴일·대체공휴일, 근로자의 날은 제외한다고 안내돼요). 이 기간 안에 재검사를 신청하지 않거나 적합 판정을 받지 못하면 검사를 받지 않은 것으로 처리되고, 재검사기간 연장은 불가능하다고 해요.<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/003/003_2_card.png\" alt=\"정기검사 지연 과태료\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>검사기간은 만료일 전 90일 ~ 후 31일<\/li><li>기간 안에 받으면 과태료 없음<\/li><li>지연 시 30일 이내 4만 원, 115일 이상 60만 원 (사이 구간은 가산)<\/li><li>과태료 문의는 등록 지자체로<\/li><\/ul>\n<p>제도는 바뀔 수 있으니 검사 전에 TS한국교통안전공단 공식 안내를 한 번 더 확인해 주세요.<\/p><p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/lib/draft_3/d3_wm_Mechanic_works_on_car_engine.jpg\" alt=\"자동차 점검 이미지(한국 정기검사 현장 아님)\" width=\"720\"><\/p><p style=\"text-align:center\"><span style=\"font-size:13px;color:#888888\">사진: Shixart1985, CC BY 2.0<\/span><\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/003/003_0_thumb.png\n\n자동차검사 기간을 깜빡해서 과태료 고지서를 받았다는 이야기, 주변에서 한 번쯤 들어보셨을 거예요. 그런데 인터넷에는 예전 기준의 과태료 금액이 아직 많이 남아 있어서 헷갈리기 쉬워요. 그래서 TS한국교통안전공단의 공식 FAQ를 기준으로 기간과 과태료를 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/003/003_1_capture.png\n출처: 한국교통안전공단 사이버검사소 홈페이지\n\n검사는 만료일 당일에만 받는 게 아니에요\n\n정기검사는 검사유효기간 만료일 전 90일부터 후 31일까지를 검사기간으로 봐요. 이 기간 안에 적합 판정을 받으면 만료일에 검사를 받은 것으로 인정됩니다. 그러니 달력에 만료일 하나만 적어 두기보다, 만료일 약 3개월 전부터 여유 있게 예약해 두는 게 편해요. 기간 안에 검사를 마쳤다면 과태료 부과 대상이 아니라고 공단은 안내하고 있어요.\n\n예약은 사이버검사소(www.cyberts.kr)나 모바일, 또는 고객콜센터 1577-0990으로 할 수 있어요.\n\n날짜로 감 잡기 (가상의 예시예요)\n\n내 차의 검사유효기간 만료일이 2026년 11월 30일이라고 가정해 볼게요. 이때 정기검사기간은 90일 전인 2026년 9월 1일부터 31일 후인 12월 31일까지로 계산돼요. 이 기간 안에만 검사를 마치면 되는 거죠. 실제 내 차의 만료일과 검사기간은 자동차등록증이나 사이버검사소에서 꼭 확인해 주세요.\n\n유효기간은 얼마나 될까?\n\n공단 FAQ 기준으로 비사업용 승용차의 정기검사 유효기간은 2년이에요. 신조차로서 신규검사를 받은 것으로 보는 차량의 최초 검사유효기간은 5년이라고 되어 있고요. 사업용 승용차나 승합·화물차는 차종과 차령에 따라 다르니, 본인 차량이 어디에 해당하는지는 자동차등록증과 공단 안내에서 확인하셔야 해요. 다만 종합검사 대상지역(서울 전역, 인천 대부분, 경기 일부 시, 대전, 세종 등 — 정확한 목록은 한국교통안전공단 안내표 참조)에 등록된 비사업용 승용차는 차령이 4년을 넘으면 정기검사 대신 종합검사(정기검사+배출가스 정밀검사 통합)를 받고, 이때 검사 유효기간은 2년이라고 안내돼요. 내 차의 지역이 대상인지는 공단 종합검사 안내표에서 확인해 주세요.\n\n기간을 넘기면 과태료는 얼마?\n\n공단 FAQ에는 자동차관리법 시행령 별표 2의 부과기준이 이렇게 정리되어 있어요.\n\n• 30일 이내 — 과태료: 4만 원\n• 30일 초과 114일 이내 — 과태료: 4만 원에 31일째부터 3일 초과할 때마다 2만 원 가산\n• 115일 이상 — 과태료: 60만 원\n\n과태료는 공단이 아니라 차량이 등록된 지자체에서 부과해요. 그래서 고지서를 받았다면 정확한 금액과 계산 방식은 해당 지자체에 문의하는 게 가장 확실합니다. 가산 금액을 직접 계산하는 방법은 해석이 갈릴 수 있어서 이 글에서는 따로 예시를 만들지 않았어요.\n\n참고로 예전에 쓰인 글에는 \"2만 원부터 시작해 최대 30만 원\"이라고 적힌 경우가 많은데, 이는 2022년 4월 13일까지의 종전 기준이에요. 서울시 안내에 따르면 2022년 4월 14일부터 검사 지연 30일 이내 과태료가 2만 원에서 4만 원, 31일째부터 3일마다 가산 금액이 1만 원에서 2만 원, 115일 이상 최고액이 30만 원에서 60만 원으로 2배 올랐어요.\n\n부적합이 나왔다면 재검사\n\n검사에서 부적합 판정을 받으면 재검사를 받아야 하는데, 공단 안내에 따르면 재검사기간은 검사기간 만료 후 10일 이내예요(기간을 셀 때 토·일요일, 공휴일·대체공휴일, 근로자의 날은 제외한다고 안내돼요). 이 기간 안에 재검사를 신청하지 않거나 적합 판정을 받지 못하면 검사를 받지 않은 것으로 처리되고, 재검사기간 연장은 불가능하다고 해요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/003/003_2_card.png\n\n한눈에 정리\n\n- 검사기간은 만료일 전 90일 ~ 후 31일\n- 기간 안에 받으면 과태료 없음\n- 지연 시 30일 이내 4만 원, 115일 이상 60만 원 (사이 구간은 가산)\n- 과태료 문의는 등록 지자체로\n\n제도는 바뀔 수 있으니 검사 전에 TS한국교통안전공단 공식 안내를 한 번 더 확인해 주세요.\n\n[사진] https://senti-1000ma.github.io/blog-drafts/img/lib/draft_3/d3_wm_Mechanic_works_on_car_engine.jpg\n사진: Shixart1985, CC BY 2.0", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/003/003_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/003/003_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "003_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/003/003_1_capture.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/003/003_1_capture.png", "cap": "출처: 한국교통안전공단 사이버검사소 홈페이지", "alt": "첫 화면의 '자동차 검사 예약' 메뉴 (2026-10-05 확인)", "name": "003_1_capture.png", "w": 802, "h": 표에서 확인해 주세요.<\/p>\n<h3>기간을 넘기면 과태료는 얼마?<\/h3>\n<p>공단 FAQ에는 자동차관리법 시행령 별표 2의 부과기준이 이렇게 정리되어 있어요.<\/p>\n<div class=\"tw\"><table><thead><tr><th>검사 지연 기간<\/th><th>과태료<\/th><\/tr><\/thead><tbody><tr><td>30일 이내<\/td><td>4만 원<\/td><\/tr><tr><td>30일 초과 114일 이내<\/td><td>4만 원에 31일째부터 3일 초과할 때마다 2만 원 가산<\/td><\/tr><tr><td>115일 이상<\/td><td>60만 원<\/td><\/tr><\/tbody><\/table><\/div>\n<p>과태료는 공단이 아니라 차량이 등록된 지자체에서 부과해요. 그래서 고지서를 받았다면 정확한 금액과 계산 방식은 해당 지자체에 문의하는 게 가장 확실합니다. 가산 금액을 직접 계산하는 방법은 해석이 갈릴 수 있어서 이 글에서는 따로 예시를 만들지 않았어요.<\/p>\n<p>참고로 예전에 쓰인 글에는 \"2만 원부터 시작해 최대 30만 원\"이라고 적힌 경우가 많은데, 이는 2022년 4월 13일까지의 종전 기준이에요. 서울시 안내에 따르면 2022년 4월 14일부터 검사 지연 30일 이내 과태료가 2만 원에서 4만 원, 31일째부터 3일마다 가산 금액이 1만 원에서 2만 원, 115일 이상 최고액이 30만 원에서 60만 원으로 2배 올랐어요.<\/p>\n<h3>부적합이 나왔다면 재검사<\/h3>\n<p>검사에서 부적합 판정을 받으면 재검사를 받아야 하는데, 공단 안내에 따르면 재검사기간은 검사기간 만료 후 10일 이내예요(기간을 셀 때 토·일요일, 공휴일·대체공휴일, 근로자의 날은 제외한다고 안내돼요). 이 기간 안에 재검사를 신청하지 않거나 적합 판정을 받지 못하면 검사를 받지 않은 것으로 처리되고, 재검사기간 연장은 불가능하다고 해요.<\/p>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/003/003_2_card.png\" alt=\"정기검사 지연 과태료\"><\/figure>\n<h3>한눈에 정리<\/h3>\n<ul><li>검사기간은 만료일 전 90일 ~ 후 31일<\/li><li>기간 안에 받으면 과태료 없음<\/li><li>지연 시 30일 이내 4만 원, 115일 이상 60만 원 (사이 구간은 가산)<\/li><li>과태료 문의는 등록 지자체로<\/li><\/ul>\n<p>제도는 바뀔 수 있으니 검사 전에 TS한국교통안전공단 공식 안내를 한 번 더 확인해 주세요.<\/p><div class=\"gallery\"><figure class=\"ph\"><img loading=\"lazy\" src=\"img/lib/draft_3/d3_wm_Mechanic_works_on_car_engine.jpg\" alt=\"자동차 점검 이미지(한국 정기검사 현장 아님)\"><figcaption>사진: Shixart1985, CC BY 2.0<\/figcaption><\/figure><\/div>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 공식 화면 캡처 · 사진 2 자체 제작 카드 — 파일 images/posts/003/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>첫 화면(사진 1, 썸네일)<\/td><td>사이버검사소 예약 화면 또는 본인 차량의 검사유효기간 확인 화면<\/td><td>차량번호·소유자 정보 가림. 예약을 실제로 해 보지 않았다면 공식 사이트 첫 화면만 캡처(예약 경험처럼 서술 금지)<\/td><\/tr><tr><td>과태료 표 아래<\/td><td>표는 텍스트로 이미 제공 → 이미지는 공단 FAQ 화면 캡처(출처 표기)<\/td><td>캡처 이미지에 날짜 표시 필요(최종수정일 2026-08-04 확인)<\/td><\/tr><tr><td>마무리 위(사진 2)<\/td><td>검사 유효기간 표시 부분<\/td><td>자동차등록증 전체 촬영 금지<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 사이버검사소 예약 화면 메뉴 위치를 직접 접속해 확인(화면 캡처 시)<\/li><li class=\"cb\">☐ 직접 검사를 받은 경험이 있다면 시기·소요시간·불편했던 점을 사실대로 추가(없으면 쓰지 말 것)<\/li><li class=\"cb\">☐ 차량번호, 소유자 정보, 고지서 내용이 사진에 보이지 않는지 점검<\/li><li class=\"cb\">☐ 발행 직전 FAQ 최종수정일이 바뀌었는지 재확인<\/li><\/ul>", "open": true}, {"title": "팩트체크 결과", "html": "<div class=\"tw\"><table><thead><tr><th>#<\/th><th>원본 '확인 필요'·확인 요청 항목<\/th><th>판정<\/th><th>확인 내용 · 출처<\/th><\/tr><\/thead><tbody><tr><td>3-1<\/td><td>과태료 구간(30일 이내 4만 원 / 31~114일 4만 원+3일마다 2만 원 / 115일 이상 60만 원), 지자체 부과<\/td><td>확인됨<\/td><td>TS한국교통안전공단 FAQ(해당 항목 최종수정 2026-08-04) — <a href=\"https://main.kotsa.or.kr/portal/bbs/faq_list.do?menuCode=04010100.\" target=\"_blank\" rel=\"noopener noreferrer\">https://main.kotsa.or.kr/portal/bbs/faq_list.do?menuCode=04010100.<\/a> 계산 방식 세부는 지자체 문의 안내 유지<\/td><\/tr><tr><td>3-2<\/td><td>검사기간(만료일 전 90일~후 31일), 기간 내 검사 시 과태료 대상 아님, 가상 날짜 예시 계산<\/td><td>확인됨<\/td><td>공단 FAQ(과태료 항목 최종수정 2026-08-04). 예시 계산(11/30 만료 → 9/1~12/31) 검산 일치<\/td><\/tr><tr><td>3-3<\/td><td>종합검사 대상(지역·차종)<\/td><td>확인됨(본문 구체화)<\/td><td>공단 종합검사 안내: 대상지역 표, 비사업용 승용 차령 4년 초과·유효기간 2년 — <a href=\"https://main.kotsa.or.kr/portal/contents.do?menuCode=01010300\" target=\"_blank\" rel=\"noopener noreferrer\">https://main.kotsa.or.kr/portal/contents.do?menuCode=01010300<\/a><\/td><\/tr><tr><td>3-4<\/td><td>2022-04-13 종전 기준 / 개정 시점<\/td><td>확인됨<\/td><td>2022-04-14 시행(30일 이내 2→4만 원, 가산 1→2만 원, 최고 30→60만 원) — 서울시 <a href=\"https://news.seoul.go.kr/traffic/archives/507609\" target=\"_blank\" rel=\"noopener noreferrer\">https://news.seoul.go.kr/traffic/archives/507609<\/a> , 법률신문 <a href=\"https://www.lawtimes.co.kr/news/articleView.html?idxno=177520\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.lawtimes.c w.lawtimes.co.kr/news/articleView.html?idxno=177520\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.lawtimes.co.kr/news/articleView.html?idxno=177520<\/a> ; 매일경제 <a href=\"https://www.mk.co.kr/news/society/10289630\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.mk.co.kr/news/society/10289630<\/a><\/td><td>공식(지자체)·2차(언론)<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "<ul><li>사진 1: 한국교통안전공단 사이버검사소 홈페이지 공개 화면 캡처(2026-10-05 확인, 로그인 전 화면) <a href=\"https://www.cyberts.kr/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.cyberts.kr/<\/a><\/li><\/ul>\n<p>사진: Shixart1985 / Wikimedia Commons / CC BY 2.0 (<a href=\"https://creativecommons.org/licenses/by/2.0\" target=\"_blank\" rel=\"noopener noreferrer\">https://creativecommons.org/licenses/by/2.0<\/a>) — 변경 시 변경 사실 표시 <a href=\"https://commons.wikimedia.org/wiki/File:Mechanic_works_on_car_engine_performing_routine_maintenance_and_inspections_on_vehicle_parts.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">https://commons.wikimedia.org/wiki/File:Mechanic_works_on_car_engine_performing_routine_maintenance_and_inspections_on_vehicle_parts.jpg<\/a> (사이즈 축소 외 변경 없음)<\/p>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 한국교통안전공단 공식 안내를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 과태료·기간은 바뀔 수 있으니 검사 전에 공식 안내를 다시 확인해 주세요.<\/blockquote>\n<p>(참고: 광고·제휴·협찬·대가성 요소 없음. 정비소·검사소 홍보나 특정 업체 추천은 넣지 않았습니다.)<\/p>", "open": false}], "plain": "자동차검사 기간을 깜빡해서 과태료 고지서를 받았다는 이야기, 주변에서 한 번쯤 들어보셨을 거예요. 그런데 인터넷에는 예전 기준의 과태료 금액이 아직 많이 남아 있어서 헷갈리기 쉬워요. 그래서 TS한국교통안전공단의 공식 FAQ를 기준으로 기간과 과태료를 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/003/003_1_capture.png\n출처: 한국교통안전공단 사이버검사소 홈페이지\n\n검사는 만료일 당일에만 받는 게 아니에요\n\n정기검사는 검사유효기간 만료일 전 90일부터 후 31일까지를 검사기간으로 봐요. 이 기간 안에 적합 판정을 받으면 만료일에 검사를 받은 것으로 인정됩니다. 그러니 달력에 만료일 하나만 적어 두기보다, 만료일 약 3개월 전부터 여유 있게 예약해 두는 게 편해요. 기간 안에 검사를 마쳤다면 과태료 부과 대상이 아니라고 공단은 안내하고 있어요.\n\n예약은 사이버검사소(www.cyberts.kr)나 모바일, 또는 고객콜센터 1577-0990으로 할 수 있어요.\n\n날짜로 감 잡기 (가상의 예시예요)\n\n내 차의 검사유효기간 만료일이 2026년 11월 30일이라고 가정해 볼게요. 이때 정기검사기간은 90일 전인 2026년 9월 1일부터 31일 후인 12월 31일까지로 계산돼요. 이 기간 안에만 검사를 마치면 되는 거죠. 실제 내 차의 만료일과 검사기간은 자동차등록증이나 사이버검사소에서 꼭 확인해 주세요.\n\n유효기간은 얼마나 될까?\n\n공단 FAQ 기준으로 비사업용 승용차의 정기검사 유효기간은 2년이에요. 신조차로서 신규검사를 받은 것으로 보는 차량의 최초 검사유효기간은 5년이라고 되어 있고요. 사업용 승용차나 승합·화물차는 차종과 차령에 따라 다르니, 본인 차량이 어디에 해당하는지는 자동차등록증과 공단 안내에서 확인하셔야 해요. 다만 종합검사 대상지역(서울 전역, 인천 대부분, 경기 일부 시, 대전, 세종 등 — 정확한 목록은 한국교통안전공단 안내표 참조)에 등록된 비사업용 승용차는 차령이 4년을 넘으면 정기검사 대신 종합검사(정기검사+배출가스 정밀검사 통합)를 받고, 이때 검사 유효기간은 2년이라고 안내돼요. 내 차의 지역이 대상인지는 공단 종합검사 안내표에서 확인해 주세요.\n\n기간을 넘기면 과태료는 얼마?\n\n공단 FAQ에는 자동차관리법 시행령 별표 2의 부과기준이 이렇게 정리되어 있어요.\n\n• 30일 이내 — 과태료: 4만 원\n• 30일 초과 114일 이내 — 과태료: 4만 원에 31일째부터 3일 초과할 때마다 2만 원 가산\n• 115일 이상 — 과태료: 60만 원\n\n과태료는 공단이 아니라 차량이 등록된 지자체에서 부과해요. 그래서 고지서를 받았다면 정확한 금액과 계산 방식은 해당 지자체에 문의하는 게 가장 확실합니다. 가산 금액을 직접 계산하는 방법은 해석이 갈릴 수 있어서 이 글에서는 따로 예시를 만들지 않았어요.\n\n참고로 예전에 쓰인 글에는 \"2만 원부터 시작해 최대 30만 원\"이라고 적힌 경우가 많은데, 이는 2022년 4월 13일까지의 종전 기준이에요. 서울시 안내에 따르면 2022년 4월 14일부터 검사 지연 30일 이내 과태료가 2만 원에서 4만 원, 31일째부터 3일마다 가산 금액이 1만 원에서 2만 원, 115일 이상 최고액이 30만 원에서 60만 원으로 2배 올랐어요.\n\n부적합이 나왔다면 재검사\n\n검사에서 부적합 판정을 받으면 재검사를 받아야 하는데, 공단 안내에 따르면 재검사기간은 검사기간 만료 후 10일 이내예요(기간을 셀 때 토·일요일, 공휴일·대체공휴일, 근로자의 날은 제외한다고 안내돼요). 이 기간 안에 재검사를 신청하지 않거나 적합 판정을 받지 못하면 검사를 받지 않은 것으로 처리되고, 재검사기간 연장은 불가능하다고 해요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/003/003_2_card.png\n\n한눈에 정리\n\n- 검사기간은 만료일 전 90일 ~ 후 31일\n- 기간 안에 받으면 과태료 없음\n- 지연 시 30일 이내 4만 원, 115일 이상 60만 원 (사이 구간은 가산)\n- 과태료 문의는 등록 지자체로\n\n제도는 바뀔 수 있으니 검사 전에 TS한국교통안전공단 공식 안내를 한 번 더 확인해 주세요.", "copyAll": "자동차검사 기간을 깜빡해서 과태료 고지서를 받았다는 이야기, 주변에서 한 번쯤 들어보셨을 거예요. 그런데 인터넷에는 예전 기준의 과태료 금액이 아직 많이 남아 있어서 헷갈리기 쉬워요. 그래서 TS한국교통안전공단의 공식 FAQ를 기준으로 기간과 과태료를 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/003/003_1_capture.png\n출처: 한국교통안전공단 사이버검사소 홈페이지\n\n검사는 만료일 당일에만 받는 게 아니에요\n\n정기검사는 검사유효기간 만료일 전 90일부터 후
