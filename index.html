있으니 검사 전에 TS한국교통안전공단 공식 안내를 한 번 더 확인해 주세요. 네이버"}, {"id": "002", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "002_k-pass-oct-2026.md", "title": "K-패스 10월 이용분부터 뭐가 달라질까? 반값 정액형은 끝, 시차시간 혜택은 12월까지", "cands": ["K-패스 10월 이용분부터 뭐가 달라질까? 반값 정액형은 끝, 시차시간 혜택은 12월까지", "출퇴근 시간대에 따라 환급률이 달라진다고요? 모두의카드 시차시간 정리", "9월에 반값 모두의카드 쓰셨다면, 10월 전에 확인할 것 3가지"], "cat": "교통·모빌리티", "kw": ["K-패스", "모두의카드", "시차시간 인센티브", "정액형 환급"], "summary": "K-패스(모두의카드) 10월 이용분부터 정액형 반값 종료·시차시간 혜택 12월 연장 등 달라지는 점 정리", "status": "초안", "created": "2026-10-05 01:33", "base": "2026-10-05", "need": 0, "chars": 2077, "chars_ns": 1620, "imgs": 5, "slots": 2, "filled": 2, "thumb": "img/002/002_0_thumb.png", "seHtml": "<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/002/002_0_thumb.png\" alt=\"대표 이미지\" width=\"720\"><\/p>\n<p>9월까지 '반값 모두의카드' 혜택을 받고 계셨다면, 10월부터 달라지는 부분이 있어요. 국토교통부가 2026년 9월 28일에 발표한 내용을 기준으로, 무엇이 끝나고 무엇이 이어지는지 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/002/002_1_card.png\" alt=\"K-패스 환급률 한눈에\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>먼저 용어부터: 정액형과 정률형<\/b><\/span><\/p>\n<p>모두의카드는 올해 초 도입된 K-패스 확대 개편 제도예요. 크게 두 가지 방식이 있어요.<\/p>\n<ul><li>정률형(기본형): 이용금액의 일정 비율을 돌려받는 방식이에요. 기본 환급률은 유형에 따라 일반 20%, 청년·2자녀·어르신 30%, 3자녀 이상 50%, 저소득층 53.3%입니다. (국토교통부 안내 기준)<\/li><li>정액형(일반형·플러스형): 한 달 대중교통비가 정해진 환급 기준금액을 넘으면, 넘은 금액을 전액 돌려주는 방식이에요. 일반형은 3천 원 미만 이용내역, 플러스형은 전체 이용내역이 대상이라고 한국교통안전공단이 안내해요.<\/li><li>월 1일~말일 기준으로 대중교통을 15회 이상 이용하면 기본형·일반형·플러스형 중 가장 유리한 유형이 자동 적용되고 다음 달에 환급된다고 한국교통안전공단이 안내하고 있어요.<\/li><\/ul>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>끝나는 것: 정액형 기준금액 50% 인하<\/b><\/span><\/p>\n<p>정부는 올해 추경으로 4월부터 6개월간 두 가지 추가 혜택을 시행했어요. 하나는 정액형 환급 기준금액을 50% 낮춘 것, 다른 하나는 출퇴근 혼잡시간 전후에 이용하면 정률형 환급률에 30%포인트를 더해 주는 것이었죠. 이 중 기준금액 인하, 이른바 '반값 정액형'은 예정대로 9월 이용분까지만 적용되고 끝납니다. 그러니 10월 이용분부터는 원래 기준금액이 적용돼요. 기준금액은 지역과 유형마다 다르기 때문에 내 금액은 앱이나 카드사 안내에서 꼭 확인하셔야 해요. 예를 들어 수도권 일반 국민의 정액형 일반형 기준금액은 원래 6만 2천 원(플러스형 10만 원)인데, 추경 기간(4~9월 이용분)에는 3만 원(플러스형 5만 원)이었다고 국토교통부와 한국교통안전공단이 안내했어요. 10월 이용분부터는 원래 금액으로 돌아가는 구조예요. 지역·유형별 전체 금액표는 공식 홈페이지에서 확인해 주세요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>이어지는 것: 시차시간 인센티브는 12월까지<\/b><\/span><\/p>\n<p>반대로 시차시간 인센티브는 올해 말까지 연장됩니다. 적용 시간대는 아래 네 구간이에요.<\/p>\n<ul><li>오전 5:30~6:30<\/li><li>오전 9:00~10:00<\/li><li>오후 16:00~17:00<\/li><li>오후 19:00~20:00<\/li><\/ul>\n<p>이 시간대에 대중교통을 이용하면 환급률이 이렇게 올라가요.<\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>구분<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>기본 환급률<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>시차시간 환급률<\/b><\/td><\/tr><tr><td>일반<\/td><td>20%<\/td><td>50%<\/td><\/tr><tr><td>청년·2자녀·어르신<\/td><td>30%<\/td><td>60%<\/td><\/tr><tr><td>3자녀 이상<\/td><td>50%<\/td><td>80%<\/td><\/tr><tr><td>저소득층<\/td><td>53.3%<\/td><td>83.3%<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p>국토부는 내년에도 이어가기 위해 2027년 정부 예산안에 관련 예산을 반영했다고 밝혔어요. 다만 예산안은 국회 심의를 거쳐야 하니 내년 시행이 확정이라고 단정하기는 어렵습니다. (국토부 보도자료는 '예산안 반영'까지만 언급하고, 확정 여부는 밝히지 않았어요.)<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>숫자로 이해해 보기 (가상의 예시예요)<\/b><\/span><\/p>\n<p>실제 내 환급액은 아니고 계산을 위한 가상 예시예요. 일반 이용자가 한 달에 시차시간대로 대중교통비 5만 원을 썼다고 가정해 볼게요. 기본 환급률 20%라면 1만 원이지만, 시차시간 환급률 50%가 적용되면 2만 5천 원이 됩니다. 같은 금액을 써도 이용 시간대에 따라 돌려받는 금액이 달라질 수 있다는 뜻이에요. 다만 실제 환급은 이용 횟수, 카드, 정액형 적용 여부 등에 따라 달라질 수 있어서 정확한 금액은 앱 안내를 기준으로 봐야 해요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>효과는 어땠을까<\/b><\/span><\/p>\n<p>국토부 자료에 따르면 추경 혜택 시행 이후 모두의카드 이용자의 1인당 월평균 환급액은 2만 700원에서 4만 1,300원으로 약 두 배가 됐고, 월평균 환급자는 283만 명에서 346만 명으로 늘었다고 해요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>10월 전에 확인할 것 3가지<\/b><\/span><\/p>\n<ol><li>내 유형(일반·청년 등)과 거주 지역이 앱에 맞게 등록되어 있는지<\/li><li>카드사·모두의카드 앱 알림으로 오는 변경 안내가 있는지<\/li><li>월 15회 이상 이용 같은 기본 조건은 한국교통안전공단 안내 기준으로 다시 보기<\/li><\/ol>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/002/002_2_card.png\" alt=\"K-패스 10월 변경 한눈에\" width=\"720\"><\/p>\n<p>제도는 바뀔 수 있으니 최종 내용은 모두의카드 공식 홈페이지와 앱 공지를 꼭 확인해 주세요.<\/p><p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/lib/draft_2/d2_wm_Jongno_Sports_and_Culture_Center_Bus_stop.jpg\" alt=\"서울 버스정류장(분위기 이미지)\" width=\"720\"><\/p><p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/lib/draft_2/d2_wm_Suin_Bundang_Line_train_interior.jpg\" alt=\"수도권 전철 객실 내부(분위기 이미지)\" width=\"720\"><\/p><p style=\"text-align:center\"><span style=\"font-size:13px;color:#888888\">사진: LandAndTree, CC BY 4.0<\/span><\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/002/002_0_thumb.png\n\n9월까지 '반값 모두의카드' 혜택을 받고 계셨다면, 10월부터 달라지는 부분이 있어요. 국토교통부가 2026년 9월 28일에 발표한 내용을 기준으로, 무엇이 끝나고 무엇이 이어지는지 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/002/002_1_card.png\n\n먼저 용어부터: 정액형과 정률형\n\n모두의카드는 올해 초 도입된 K-패스 확대 개편 제도예요. 크게 두 가지 방식이 있어요.\n\n- 정률형(기본형): 이용금액의 일정 비율을 돌려받는 방식이에요. 기본 환급률은 유형에 따라 일반 20%, 청년·2자녀·어르신 30%, 3자녀 이상 50%, 저소득층 53.3%입니다. (국토교통부 안내 기준)\n- 정액형(일반형·플러스형): 한 달 대중교통비가 정해진 환급 기준금액을 넘으면, 넘은 금액을 전액 돌려주는 방식이에요. 일반형은 3천 원 미만 이용내역, 플러스형은 전체 이용내역이 대상이라고 한국교통안전공단이 안내해요.\n- 월 1일~말일 기준으로 대중교통을 15회 이상 이용하면 기본형·일반형·플러스형 중 가장 유리한 유형이 자동 적용되고 다음 달에 환급된다고 한국교통안전공단이 안내하고 있어요.\n\n끝나는 것: 정액형 기준금액 50% 인하\n\n정부는 올해 추경으로 4월부터 6개월간 두 가지 추가 혜택을 시행했어요. 하나는 정액형 환급 기준금액을 50% 낮춘 것, 다른 하나는 출퇴근 혼잡시간 전후에 이용하면 정률형 환급률에 30%포인트를 더해 주는 것이었죠. 이 중 기준금액 인하, 이른바 '반값 정액형'은 예정대로 9월 이용분까지만 적용되고 끝납니다. 그러니 10월 이용분부터는 원래 기준금액이 적용돼요. 기준금액은 지역과 유형마다 다르기 때문에 내 금액은 앱이나 카드사 안내에서 꼭 확인하셔야 해요. 예를 들어 수도권 일반 국민의 정액형 일반형 기준금액은 원래 6만 2천 원(플러스형 10만 원)인데, 추경 기간(4~9월 이용분)에는 3만 원(플러스형 5만 원)이었다고 국토교통부와 한국교통안전공단이 안내했어요. 10월 이용분부터는 원래 금액으로 돌아가는 구조예요. 지역·유형별 전체 금액표는 공식 홈페이지에서 확인해 주세요.\n\n이어지는 것: 시차시간 인센티브는 12월까지\n\n반대로 시차시간 인센티브는 올해 말까지 연장됩니다. 적용 시간대는 아래 네 구간이에요.\n\n- 오전 5:30~6:30\n- 오전 9:00~10:00\n- 오후 16:00~17:00\n- 오후 19:00~20:00\n\n이 시간대에 대중교통을 이용하면 환급률이 이렇게 올라가요.\n\n• 일반 — 기본 환급률: 20% / 시차시간 환급률: 50%\n• 청년·2자녀·어르신 — 기본 환급률: 30% / 시차시간 환급률: 60%\n• 3자녀 이상 — 기본 환급률: 50% / 시차시간 환급률: 80%\n• 저소득층 — 기본 환급률: 53.3% / 시차시간 환급률: 83.3%\n\n국토부는 내년에도 이어가기 위해 2027년 정부 예산안에 관련 예산을 반영했다고 밝혔어요. 다만 예산안은 국회 심의를 거쳐야 하니 내년 시행이 확정이라고 단정하기는 어렵습니다. (국토부 보도자료는 '예산안 반영'까지만 언급하고, 확정 여부는 밝히지 않았어요.)\n\n숫자로 이해해 보기 (가상의 예시예요)\n\n실제 내 환급액은 아니고 계산을 위한 가상 예시예요. 일반 이용자가 한 달에 시차시간대로 대중교통비 5만 원을 썼다고 가정해 볼게요. 기본 환급률 20%라면 1만 원이지만, 시차시간 환급률 50%가 적용되면 2만 5천 원이 됩니다. 같은 금액을 써도 이용 시간대에 따라 돌려받는 금액이 달라질 수 있다는 뜻이에요. 다만 실제 환급은 이용 횟수, 카드, 정액형 적용 여부 등에 따라 달라질 수 있어서 정확한 금액은 앱 안내를 기준으로 봐야 해요.\n\n효과는 어땠을까\n\n국토부 자료에 따르면 추경 혜택 시행 이후 모두의카드 이용자의 1인당 월평균 환급액은 2만 700원에서 4만 1,300원으로 약 두 배가 됐고, 월평균 환급자는 283만 명에서 346만 명으로 늘었다고 해요.\n\n10월 전에 확인할 것 3가지\n\n1. 내 유형(일반·청년 등)과 거주 지역이 앱에 맞게 등록되어 있는지\n2. 카드사·모두의카드 앱 알림으로 오는 변경 안내가 있는지\n3. 월 15회 이상 이용 같은 기본 조건은 한국교통안전공단 안내 기준으로 다시 보기\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/002/002_2_card.png\n\n제도는 바뀔 수 있으니 최종 내용은 모두의카드 공식 홈페이지와 앱 공지를 꼭 확인해 주세요.\n\n[사진] https://senti-1000ma.github.io/blog-drafts/img/lib/draft_2/d2_wm_Jongno_Sports_and_Culture_Center_Bus_stop.jpg\n\n[사진] https://senti-1000ma.github.io/blog-drafts/img/lib/draft_2/d2_wm_Suin_Bundang_Line_train_interior.jpg\n사진: LandAndTree, CC BY 4.0", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/002/002_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/002/002_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "002_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/002/002_1_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/002/002_1_card.png", "cap": "", "alt": "K-패스 환급률 한눈에", "name": "002_1_card.png", "w": 1080, "h": 897}, {"n": 2, "label": "사진 2", "uri": "img/002/002_2_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/002/002_2_card.png", "cap": "", "alt": "K-패스 10월 변경 한눈에", "name": "002_2_card.png", "w": 1080, "h": 826}, {"n": -1, "label": "추가 사진", "uri": "img/lib/draft_2/d2_wm_Jongno_Sports_and_Culture_Center_Bus_stop.jpg", "abs": "https://senti-1000ma.github.io/blog-drafts/img/lib/draft_2/d2_wm_Jongno_Sports_and_Culture_Center_Bus_stop.jpg", "cap": "", "alt": "서울 버스정류장(분위기 이미지)", "name": "d2_wm_Jongno_Sports_and_Culture_Center_Bus_stop.jpg", "w": 1080, "h": 608}, {"n": -1, "label": "추가 사진", "uri": "img/lib/draft_2/d2_wm_Suin_Bundang_Line_train_interior.jpg", "abs": "https://senti-1000ma.github.io/blog-drafts/img/lib/draft_2/d2_wm_Suin_Bundang_Line_train_interior.jpg", "cap": "사진: LandAndTree, CC BY 4.0", "alt": "수도권 전철 객실 내부(분위기 이미지)", "name": "d2_wm_Suin_Bundang_Line_train_interior.jpg", "w": 1080, "h": 811}], "zip": "img/002/002_images.zip", "html": "<figure class=\"ph thumbfig\" data-n=\"0\"><img src=\"img/002/002_0_thumb.png\" alt=\"대표 이미지\"><\/figure>\n<p>9월까지 '반값 모두의카드' 혜택을 받고 계셨다면, 10월부터 달라지는 부분이 있어요. 국토교통부가 2026년 9월 28일에 발표한 내용을 기준으로, 무엇이 끝나고 무엇이 이어지는지 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<figure class=\"ph\" data-n=\"1\"><img loading=\"lazy\" src=\"img/002/002_1_card.png\" alt=\"K-패스 환급률 한눈에\"><\/figure>\n<h3>먼저 용어부터: 정액형과 정률형<\/h3>\n<p>모두의카드는 올해 초 도입된 K-패스 확대 개편 제도예요. 크게 두 가지 방식이 있어요.<\/p>\n<ul><li>정률형(기본형): 이용금액의 일정 비율을 돌려받는 방식이에요. 기본 환급률은 유형에 따라 일반 20%, 청년·2자녀·어르신 30%, 3자녀 이상 50%, 저소득층 53.3%입니다. (국토교통부 안내 기준)<\/li><li>정액형(일반형·플러스형): 한 달 대중교통비가 정해진 환급 기준금액을 넘으면, 넘은 금액을 전액 돌려주는 방식이에요. 일반형은 3천 원 미만 이용내역, 플러스형은 전체 이용내역이 대상이라고 한국교통안전공단이 안내해요.<\/li><li>월 1일~말일 기준으로 대중교통을 15회 이상 이용하면 기본형·일반형·플러스형 중 가장 유리한 유형이 자동 적용되고 다음 달에 환급된다고 한국교통안전공단이 안내하고 있어요.<\/li><\/ul>\n<h3>끝나는 것: 정액형 기준금액 50% 인하<\/h3>\n<p>정부는 올해 추경으로 4월부터 6개월간 두 가지 추가 혜택을 시행했어요. 하나는 정액형 환급 기준금액을 50% 낮춘 것, 다른 하나는 출퇴근 혼잡시간 전후에 이용하면 정률형 환급률에 30%포인트를 더해 주는 것이었죠. 이 중 기준금액 인하, 이른바 '반값 정액형'은 예정대로 9월 이용분까지만 적용되고 끝납니다. 그러니 10월 이용분부터는 원래 기준금액이 적용돼요. 기준금액은 지역과 유형마다 다르기 때문에 내 금액은 앱이나 카드사 안내에서 꼭 확인하셔야 해요. 예를 들어 수도권 일반 국민의 정액형 일반형 기준금액은 원래 6만 2천 원(플러스형 10만 원)인데, 추경 기간(4~9월 이용분)에는 3만 원(플러스형 5만 원)이었다고 국토교통부와 한국교통안전공단이 안내했어요. 10월 이용분부터는 원래 금액으로 돌아가는 구조예요. 지역·유형별 전체 금액표는 공식 홈페이지에서 확인해 주세요.<\/p>\n<h3>이어지는 것: 시차시간 인센티브는 12월까지<\/h3>\n<p>반대로 시차시간 인센티브는 올해 말까지 연장됩니다. 적용 시간대는 아래 네 구간이에요.<\/p>\n<ul><li>오전 5:30~6:30<\/li><li>오전 9:00~10:00<\/li><li>오후 16:00~17:00<\/li><li>오후 19:00~20:00<\/li><\/ul>\n<p>이 시간대에 대중교통을 이용하면 환급률이 이렇게 올라가요.<\/p>\n<div class=\"tw\"><table><thead><tr><th>구분<\/th><th>기본 환급률<\/th><th>시차시간 환급률<\/th><\/tr><\/thead><tbody><tr><td>일반<\/td><td>20%<\/td><td>50%<\/td><\/tr><tr><td>청년·2자녀·어르신<\/td><td>30%<\/td><td>60%<\/td><\/tr><tr><td>3자녀 이상<\/td><td>50%<\/td><td>80%<\/td><\/tr><tr><td>저소득층<\/td><td>53.3%<\/td><td>83.3%<\/td><\/tr><\/tbody><\/table><\/div>\n<p>국토부는 내년에도 이어가기 위해 2027년 정부 예산안에 관련 예산을 반영했다고 밝혔어요. 다만 예산안은 국회 심의를 거쳐야 하니 내년 시행이 확정이라고 단정하기는 어렵습니다. (국토부 보도자료는 '예산안 반영'까지만 언급하고, 확정 여부는 밝히지 않았어요.)<\/p>\n<h3>숫자로 이해해 보기 (가상의 예시예요)<\/h3>\n<p>실제 내 환급액은 아니고 계산을 위한 가상 예시예요. 일반 이용자가 한 달에 시차시간대로 대중교통비 5만 원을 썼다고 가정해 볼게요. 기본 환급률 20%라면 1만 원이지만, 시차시간 환급률 50%가 적용되면 2만 5천 원이 됩니다. 같은 금액을 써도 이용 시간대에 따라 돌려받는 금액이 달라질 수 있다는 뜻이에요. 다만 실제 환급은 이용 횟수, 카드, 정액형 적용 여부 등에 따라 달라질 수 있어서 정확한 금액은 앱 안내를 기준으로 봐야 해요.<\/p>\n<h3>효과는 어땠을까<\/h3>\n<p>국토부 자료에 따르면 추경 혜택 시행 이후 모두의카드 이용자의 1인당 월평균 환급액은 2만 700원에서 4만 1,300원으로 약 두 배가 됐고, 월평균 환급자는 283만 명에서 346만 명으로 늘었다고 해요.<\/p>\n<h3>10월 전에 확인할 것 3가지<\/h3>\n<ol><li>내 유형(일반·청년 등)과 거주 지역이 앱에 맞게 등록되어 있는지<\/li><li>카드사·모두의카드 앱 알림으로 오는 변경 안내가 있는지<\/li><li>월 15회 이상 이용 같은 기본 조건은 한국교통안전공단 안내 기준으로 다시 보기<\/li><\/ol>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/002/002_2_card.png\" alt=\"K-패스 10월 변경 한눈에\"><\/figure>\n<p>제도는 바뀔 수 있으니 최종 내용은 모두의카드 공식 홈페이지와 앱 공지를 꼭 확인해 주세요.<\/p><div class=\"gallery\"><figure class=\"ph\"><img loading=\"lazy\" src=\"img/lib/draft_2/d2_wm_Jongno_Sports_and_Culture_Center_Bus_stop.jpg\" alt=\"서울 버스정류장(분위기 이미지)\"><\/figure><figure class=\"ph\"><img loading=\"lazy\" src=\"img/lib/draft_2/d2_wm_Suin_Bundang_Line_train_interior.jpg\" alt=\"수도권 전철 객실 내부(분위기 이미지)\"><figcaption>사진: LandAndTree, CC BY 4.0<\/figcaption><\/figure><\/div>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 자체 제작 카드 · 사진 2 자체 제작 카드 — 파일 images/posts/002/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>첫 화면(사진 1, 썸네일)<\/td><td>본인 K-패스 앱의 환급 내역 화면<\/td><td>카드번호·이름·정확한 이용 내역 일부 가림. 제목이 \"달라지는 점\"이므로 국토부 보도 제목 화면을 보조로 쓰는 것도 가능(출처 표기)<\/td><\/tr><tr><td>'이어지는 것' 표 바로 아래<\/td><td>시차시간 4구간을 텍스트 표로 이미 제공 → 이미지는 보조<\/td><td>핵심 수치는 이미지가 아니라 본문 텍스트/표로 유지<\/td><\/tr><tr><td>마지막 확인 항목 아래(사진 2)<\/td><td>앱 내 혜택 안내/환급률 화면<\/td><td>직접 캡처한 경우에만<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 본인 지역(수도권/일반 지방권/우대·특별지원지역)·유형별 기준금액은 모두의카드 공식 표로 확인해 필요 시 추가<\/li><li class=\"cb\">☐ 정책브리핑 원문을 열어 숫자 재대조(발행 직전 변경 가능성)<\/li><li class=\"cb\">☐ 직접 K-패스/모두의카드를 쓰는 경우에만 '9월 환급액 vs 10월 환급액' 같은 경험 문장 추가(수치는 본인 앱 기준, 없으면 쓰지 않기)<\/li><li class=\"cb\">☐ 카드번호·이름·이용내역이 캡처에 보이지 않는지 점검<\/li><li class=\"cb\">☐ 정책브리핑 사진·카드뉴스 이미지는 공공누리가 붙어 있어도 사진/이미지 사용은 담당자 협의가 필요하다고 정책브리핑 저작권 정책에 명시되어 있으므로 사용하지 말 것<\/li><\/ul>", "open": true}, {"title": "팩트체크 결과", "html": "<div class=\"tw\"><table><thead><tr><th>#<\/th><th>원본 '확인 필요'·확인 요청 항목<\/th><th>판정<\/th><th>확인 내용 · 출처<\/th><\/tr><\/thead><tbody><tr><td>2-1<\/td><td>추경 기간 기준금액(수도권 일반 6.2만→3만 원)<\/td><td>확인됨<\/td><td>국토부 2026-04-23: 수도권 일반 국민 일반형 3만/플러스 5만(50% 인하, 4~9월 이용분). 원래 금액: 한국교통안전공단 표 일반형 6.2/플러스 10(만 원). 초안의 6.2만→3만은 '일반형' 기준임을 본문에 명시 — <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148963193\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyNewsView.do?newsId=148963193<\/a> , <a href=\"https://main.kotsa.or.kr/portal/contents.do?menuCode=01080300\" target=\"_blank\" rel=\"noopener noreferrer\">https://main.kotsa.or.kr/portal/contents.do?menuCode=01080300<\/a><\/td><\/tr><tr><td>2-2<\/td><td>월 15회 이상 이용 조건 / 유리한 유형 자동 적용<\/td><td>확인됨<\/td><td>한국교통안전공단: 월 15회 이상 시 기본형/일반형/플러스형 중 가장 유리한 유형 자동 적용, 익월 환급 — 위 공단 URL<\/td><\/tr><tr><td>2-3<\/td><td>시차시간 4구간(05:30~06:30, 09:00~10:00, 16:00~17:00, 19:00~20:00)<\/td><td>확인됨<\/td><td>국토부 2026-04-23 안내에 동일 시간대 명시, 9/28 보도(아주경제)도 12월까지 동일 — 위 정책브리핑 URL<\/td><\/tr><tr><td>2-4<\/td><td>유형별 환급률(시차 50/60/80/83.3%, 기본 20/30/50/53.3%)<\/td><td>확인됨<\/td><td>국토부 2026-04-23 안내(일반 50/20, 청년·2자녀·어르신 60/30, 3자녀 50→80, 저소득 83.3/53.3). 9/28 정책브리핑: \"20~53.3%에서 30%p 추가, 최대 83.3%\" — <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148972677\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyNewsView.do?newsId=148972677<\/a><\/td><\/tr><tr><td>2-5<\/td><td>국토부 원문 수치(1인당 월평균 환급 2만 700→4만 1,300원, 환급자 283만→346만 명, 반값 정액형 9월 이용분까지, 시차 혜택 12월까지, 2027 예산안 반영)<\/td><td>확인됨<\/td><td>정책브리핑 원문 2026-09-28 대조 일치(원문에 '20207년'이라는 오타가 있으나 2027년 예산안 취지)<\/td><\/tr><tr><td>2-6<\/td><td>내년(2027) 시행 확정 여부<\/td><td>확인 불가<\/td><td>원문은 \"예산안 반영\"까지만 기재. 국회 심의 결과는 확인 불가 → 본문에 단정 안 함<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>정액형 기준금액 50% 인하는 9월 이용분까지, 시차시간 인센티브 12월까지 연장, 2027 예산안 반영, 수치(2만 700→4만 1,300원 등), 정률형 기본 20~53.3%+30%p, 최대 83.3%<\/td><td>대한민국 정책브리핑(국토교통부) <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148972677\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyNewsView.do?newsId=148972677<\/a> (2026-09-28)<\/td><td>공식<\/td><\/tr><tr><td>추경 후 기준금액(수도권·일반지방권·우대·특별지원지역별), 시차시간 4구간, 유형별 환급률<\/td><td>정책브리핑(국토교통부) <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148963193\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyNewsView.do?newsId=148963193<\/a> (2026-04-23)<\/td><td>공식<\/td><\/tr><tr><td>원래 기준금액 표, 월 15회 이상·유리한 유형 자동 적용, 기본형 환급 비율<\/td><td>TS한국교통안전공단 <a href=\"https://main.kotsa.or.kr/portal/contents.do?menuCode=01080300\" target=\"_blank\" rel=\"noopener noreferrer\">https://main.kotsa.or.kr/portal/contents.do?menuCode=01080300<\/a><\/td><td>공식<\/td><\/tr><tr><td>보도 해설(교차 확인용)<\/td><td>아주경제 <a href=\"https://www.ajunews.com/view/20260928093805116\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.ajunews.com/view/20260928093805116<\/a> (2026-09-28)<\/td><td>2차(언론, 국토부 인용)<\/td><\/tr><tr><td>(참고) \"10월부터 전부 원래대로\" 주장<\/td><td>moneyroan 등 일부 글<\/td><td>국토부 9/28 보도와 불일치(시차시간 혜택은 12월까지 유지) → 사용 안 함<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "<p>사진: MonasteryInwang / Wikimedia Commons (CC0, 표기 의무 없음 — 출처 병기 권장) <a href=\"https://commons.wikimedia.org/wiki/File:Jongno_Sports_and_Culture_Center_Bus_stop.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">https://commons.wikimedia.org/wiki/File:Jongno_Sports_and_Culture_Center_Bus_stop.jpg<\/a><br>사진: LandAndTree / Wikimedia Commons / CC BY 4.0 (<a href=\"https://creativecommons.org/licenses/by/4.0\" target=\"_blank\" rel=\"noopener noreferrer\">https://creativecommons.org/licenses/by/4.0<\/a>) — 변경 시 변경 사실 표시 <a href=\"https://commons.wikimedia.org/wiki/File:Suin%E2%80%93Bundang_Line_(Korail_Class_319000\" target=\"_blank\" rel=\"noopener noreferrer\">https://commons.wikimedia.org/wiki/File:Suin%E2%80%93Bundang_Line_(Korail_Class_319000<\/a>)_20240713_(01).jpg (사이즈 축소 외 변경 없음)<\/p>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 국토교통부 보도자료 등 공식 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 환급 조건은 바뀔 수 있으니 공식 홈페이지·앱 공지를 다시 확인해 주세요.<\/blockquote>\n<p>(참고: 광고·제휴·협찬·대가성 요소 없음. 카드 발급 링크나 카드사 혜택 안내는 넣지 않았습니다.)<\/p>", "open": false}], "plain": "9월까지 '반값 모두의카드' 혜택을 받고 계셨다면, 10월부터 달라지는 부분이 있어요. 국토교통부가 2026년 9월 28일에 발표한 내용을 기준으로, 무엇이 끝나고 무엇이 이어지는지 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/002/002_1_card.png\n\n먼저 용어부터: 정액형과 정률형\n\n모두의카드는 올해 초 도입된 K-패스 확대 개편 제도예요. 크게 두 가지 방식이 있어요.\n\n- 정률형(기본형): 이용금액의 일정 비율을 돌려받는 방식이에요. 기본 환급률은 유형에 따라 일반 20%, 청년·2자녀·어르신 30%, 3자녀 이상 50%, 저소득층 53.3%입니다. (국토교통부 안내 기준)\n- 정액형(일반형·플러스형): 한 달 대중교통비가 정해진 환급 기준금액을 넘으면, 넘은 금액을 전액 돌려주는 방식이에요. 일반형은 3천 원 미만 이용내역, 플러스형은 전체 이용내역이 대상이라고 한국교통안전공단이 안내해요.\n- 월 1일~말일 기준으로 대중교통을 15회 이상 이용하면 기본형·일반형·플러스형 중 가장 유리한 유형이 자동 적용되고 다음 달에 환급된다고 한국교통안전공단이 안내하고 있어요.\n\n끝나는 것: 정액형 기준금액 50% 인하\n\n정부는 올해 추경으로 4월부터 6개월간 두 가지 추가 혜택을 시행했어요. 하나는 정액형 환급 기준금액을 50% 낮춘 것, 다른 하나는 출퇴근 혼잡시간 전후에 이용하면 정률형 환급률에 30%포인트를 더해 주는 것이었죠. 이 중 기준금액 인하, 이른바 '반값 정액형'은 예정대로 9월 이용분까지만 적용되고 끝납니다. 그러니 10월 이용분부터는 원래 기준금액이 적용돼요. 기준금액은 지역과 유형마다 다르기 때문에 내 금액은 앱이나 카드사 안내에서 꼭 확인하셔야 해요. 예를 들어 수도권 일반 국민의 정액형 일반형 기준금액은 원래 6만 2천 원(플러스형 10만 원)인데, 추경 기간(4~9월 이용분)에는 3만 원(플러스형 5만 원)이었다고 국토교통부와 한국교통안전공단이 안내했어요. 10월 이용분부터는 원래 금액으로 돌아가는 구조예요. 지역·유형별 전체 금액표는 공식 홈페이지에서 확인해 주세요.\n\n이어지는 것: 시차시간 인센티브는 12월까지\n\n반대로 시차시간 인센티브는 올해 말까지 연장됩니다. 적용 시간대는 아래 네 구간이에요.\n\n- 오전 5:30~6:30\n- 오전 9:00~10:00\n- 오후 16:00~17:00\n- 오후 19:00~20:00\n\n이 시간대에 대중교통을 이용하면 환급률이 이렇게 올라가요.\n\n• 일반 — 기본 환급률: 20% / 시차시간 환급률: 50%\n• 청년·2자녀·어르신 — 기본 환급률: 30% / 시차시간 환급률: 60%\n• 3자녀 이상 — 기본 환급률: 50% / 시차시간 환급률: 80%\n• 저소득층 — 기본 환급률: 53.3% / 시차시간 환급률: 83.3%\n\n국토부는 내년에도 이어가기 위해 2027년 정부 예산안에 관련 예산을 반영했다고 밝혔어요. 다만 예산안은 국회 심의를 거쳐야 하니 내년 시행이 확정이라고 단정하기는 어렵습니다. (국토부 보도자료는 '예산안 반영'까지만 언급하고, 확정 여부는 밝히지 않았어요.)\n\n숫자로 이해해 보기 (가상의 예시예요)\n\n실제 내 환급액은 아니고 계산을 위한 가상 예시예요. 일반 이용자가 한 달에 시차시간대로 대중교통비 5만 원을 썼다고 가정해 볼게요. 기본 환급률 20%라면 1만 원이지만, 시차시간 환급률 50%가 적용되면 2만 5천 원이 됩니다. 같은 금액을 써도 이용 시간대에 따라 돌려받는 금액이 달라질 수 있다는 뜻이에요. 다만 실제 환급은 이용 횟수, 카드, 정액형 적용 여부 등에 따라 달라질 수 있어서 정확한 금액은 앱 안내를 기준으로 봐야 해요.\n\n효과는 어땠을까\n\n국토부 자료에 따르면 추경 혜택 시행 이후 모두의카드 이용자의 1인당 월평균 환급액은 2만 700원에서 4만 1,300원으로 약 두 배가 됐고, 월평균 환급자는 283만 명에서 346만 명으로 늘었다고 해요.\n\n10월 전에 확인할 것 3가지\n\n1. 내 유형(일반·청년 등)과 거주 지역이 앱에 맞게 등록되어 있는지\n2. 카드사·모두의카드 앱 알림으로 오는 변경 안내가 있는지\n3. 월 15회 이상 이용 같은 기본 조건은 한국교통안전공단 안내 기준으로 다시 보기\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/002/002_2_card.png\n\n제도는 바뀔 수 있으니 최종 내용은 모두의카드 공식 홈페이지와 앱 공지를 꼭 확인해 주세요.", "copyAll": "9월까지 '반값 모두의카드' 혜택을 받고 계셨다면, 10월부터 달라지는 부분이 있어요. 국토교통부가 2026년 9월 28일에 발 드사·모두의카드 앱 알림으로 오는 변경 안내가 있는지\n3. 월 15회 이상 이용 같은 기본 조건은 한국교통안전공단 안내 기준으로 다시 보기\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/002/002_2_card.png\n\n제도는 바뀔 수 있으니 최종 내용은 모두의카드 공식 홈페이지와 앱 공지를 꼭 확인해 주세요.", "search": "002 K-패스 10월 이용분부터 뭐가 달라질까? 반값 정액형은 끝, 시차시간 혜택은 12월까지 교통·모빌리티 K-패스, 모두의카드, 시차시간 인센티브, 정액형 환급 K-패스(모두의카드) 10월 이용분부터 정액형 반값 종료·시차시간 혜택 12월 연장 등 달라지는 점 정리 9월까지 '반값 모두의카드' 혜택을 받고 계셨다면, 10월부터 달라지는 부분이 있어요. 국토교통부가 2026년 9월 28일에 발표한 내용을 기준으로, 무엇이 끝나고 무엇이 이어지는지 정리했습니다. (2026년 10월 5일 기준) [사진 1] https://senti-1000ma.github.io/blog-drafts/img/002/002_1_card.png 먼저 용어부터: 정액형과 정률형 모두의카드는 올해 초 도입된 K-패스 확대 개편 제도예요. 크게 두 가지 방식이 있어요. - 정률형(기본형): 이용금액의 일정 비율을 돌려받는 방식이에요. 기본 환급률은 유형에 따라 일반 20%, 청년·2자녀·어르신 30%, 3자녀 이상 50%, 저소득층 53.3%입니다. (국토교통부 안내 기준) - 정액형(일반형·플러스형): 한 달 대중교통비가 정해진 환급 기준금액을 넘으면, 넘은 금액을 전액 돌려주는 방식이에요. 일반형은 3천 원 미만 이용내역, 플러스형은 전체 이용내역이 대상이라고 한국교통안전공단이 안내해요. - 월 1일~말일 기준으로 대중교통을 15회 이상 이용하면 기본형·일반형·플러스형 중 가장 유리한 유형이 자동 적용되고 다음 달에 환급된다고 한국교통안전공단이 안내하고 있어요. 끝나는 것: 정액형 기준금액 50% 인하 정부는 올해 추경으로 4월부터 6개월간 두 가지 추가 혜택을 시행했어요. 하나는 정액형 환급 기준금액을 50% 낮춘 것, 다른 하나는 출퇴근 혼잡시간 전후에 이용하면 정률형 환급률에 30%포인트를 더해 주는 것이었죠. 이 중 기준금액 인하, 이른바 '반값 정액형'은 예정대로 9월 이용분까지만 적용되고 끝납니다. 그러니 10월 이용분부터는 원래 기준금액이 적용돼요. 기준금액은 지역과 유형마다 다르기 때문에 내 금액은 앱이나 카드사 안내에서 꼭 확인하셔야 해요. 예를 들어 수도권 일반 국민의 정액형 일반형 기준금액은 원래 6만 2천 원(플러스형 10만 원)인데, 추경 기간(4~9월 이용분)에는 3만 원(플러스형 5만 원)이었다고 국토교통부와 한국교통안전공단이 안내했어요. 10월 이용분부터는 원래 금액으로 돌아가는 구조예요. 지역·유형별 전체 금액표는 공식 홈페이지에서 확인해 주세요. 이어지는 것: 시차시간 인센티브는 12월까지 반대로 시차시간 인센티브는 올해 말까지 연장됩니다. 적용 시간대는 아래 네 구간이에요. - 오전 5:30~6:30 - 오전 9:00~10:00 - 오후 16:00~17:00 - 오후 19:00~20:00 이 시간대에 대중교통을 이용하면 환급률이 이렇게 올라가요. • 일반 — 기본 환급률: 20% / 시차시간 환급률: 50% • 청년·2자녀·어르신 — 기본 환급률: 30% / 시차시간 환급률: 60% • 3자녀 이상 — 기본 환급률: 50% / 시차시간 환급률: 80% • 저소득층 — 기본 환급률: 53.3% / 시차시간 환급률: 83.3% 국토부는 내년에도 이어가기 위해 2027년 정부 예산안에 관련 예산을 반영했다고 밝혔어요. 다만 예산안은 국회 심의를 거쳐야 하니 내년 시행이 확정이라고 단정하기는 어렵습니다. (국토부 보도자료는 '예산안 반영'까지만 언급하고, 확정 여부는 밝히지 않았어요.) 숫자로 이해해 보기 (가상의 예시예요) 실제 내 환급액은 아니고 계산을 위한 가상 예시예요. 일반 이용자가 한 달에 시차시간대로 대중교통비 5만 원을 썼다고 가정해 볼게요. 기본 환급률 20%라면 1만 원이지만, 시차시간 환급률 50%가 적용되면 2만 5천 원이 됩니다. 같은 금액을 써도 이용 시간대에 따라 돌려받는 금액이 달라질 수 있다는 뜻이에요. 다만 실제 환급은 이용 횟수, 카드, 정액형 적용 여부 등에 따라 달라질 수 있어서 정확한 금액은 앱 안내를 기준으로 봐야 해요. 효과는 어땠을까 국토부 자료에 따르면 추경 혜택 시행 이후 모두의카드 이용자의 1인당 월평균 환급액은 2만 700원에서 4만 1,300원으로 약 두 배가 됐고, 월평균 환급자는 283만 명에서 346만 명으로 늘었다고 해요. 10월 전에 확인할 것 3가지 1. 내 유형(일반·청년 등)과 거주 지역이 앱에 맞게 등록되어 있는지 2. 카드사·모두의카드 앱 알림으로 오는 변경 안내가 있는지 3. 월 15회 이상 이용 같은 기본 조건은 한국교통안전공단 안내 기준으로 다시 보기 [사진 2] https://senti-1000ma.github.io/blog-drafts/img/002/002_2_card.png 제도는 바뀔 수 있으니 최종 내용은 모두의카드 공식 홈페이지와 앱 공지를 꼭 확인해 주세요. 네이버"}, {"id": "001", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "001_health-checkup.md", "title": "국가건강검진 안 받으면 정말 불이익이 있을까? 2026년 기준으로 확인해 봤어요", "cands": ["국가건강검진 안 받으면 정말 불이익이 있을까? 2026년 기준으로 확인해 봤어요", "건강검진 대상인지 직접 조회하는 법, 검진표 못 받았을 때 대처법까지", "작년에 건강검진 놓쳤다면? '전년도 미수검자 추가신청' 방법 정리"], "cat": "건강·보건", "kw": ["국가건강검진", "건강검진 대상 조회", "전년도 미수검자 추가신청"], "summary": "국가건강검진 대상 조회, 미수검 시 불이익(법령 근거)·전년도 미수검자 추가신청 방법 정리", "status": "초안", "created": "2026-10-05 01:32", "base": "2026-10-05", "need": 0, "chars": 2748, "chars_ns": 2160, "imgs": 5, "slots": 2, "filled": 2, "thumb": "img/001/001_0_thumb.png", "seHtml": "<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/001/001_0_thumb.png\" alt=\"대표 이미지\" width=\"720\"><\/p>\n<p>국가건강검진을 안 받으면 벌금이 나온다는 이야기, 한 번쯤 들어보셨죠? 저도 궁금해서 공식 자료부터 찾아봤어요. 결론부터 말씀드리면, 제가 확인한 국민건강보험법 과태료 조항(제119조)에서는 건강검진을 받지 않은 개인에게 부과하는 과태료를 찾지 못했어요. 다만 직장에 다니는 분은 산업안전보건법에 따른 근로자 건강진단 규정이 따로 있어서 아래에 나눠 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/001/001_1_capture.png\" alt=\"&#x27;건강검진 실시안내 &gt; 일반건강검진&#x27; 검진 절차 안내 (2026-10-05 확인)\" width=\"720\"><\/p><p style=\"text-align:center\"><span style=\"font-size:13px;color:#888888\">출처: 국민건강보험공단 홈페이지<\/span><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>먼저, 올해 내가 대상인지 확인하기<\/b><\/span><\/p>\n<p>일반건강검진은 기본적으로 2년에 한 번 받는 검진이에요. 질병관리청 국가건강정보포털에는 보통 짝수년에 태어난 분은 짝수년에, 홀수년에 태어난 분은 홀수년에 대상이 된다고 나와 있어요. 다만 비사무직(생산직) 직장가입자는 매년 대상이고, 가입 유형에 따라 대상 연령도 조금씩 달라요. 그래서 출생연도만 보고 판단하기보다 직접 조회하는 게 가장 정확합니다.<\/p>\n<p>조회는 국민건강보험공단 홈페이지(건강모아 → 나의 건강 → 검진대상 조회)나 '건강보험25시' 앱에서 할 수 있어요. 공단 안내에 따르면 직장가입자의 일반건강검진 대상 여부는 소속 사업장으로 통보돼서, 검진표를 못 받았다고 해서 대상이 아니라고 단정하기는 어려워요. 검진표는 전자문서로 발송되고 열람하지 않으면 우편으로 보내진다고 해요(직장가입자 중 일반검진만 해당하면 사업장 명부 발송으로 대체). 검진표를 잃어버렸거나 받지 못했다면 공단(1577-1000)이나 가까운 지사에 신청해 다시 받거나 홈페이지에서 검진대상 확인서를 출력할 수 있고, 신분증(주민등록증·운전면허증·여권)으로 검진기관에서 대상자 확인을 받고 검진을 받을 수도 있다고 안내되어 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>비용은 얼마나 들까?<\/b><\/span><\/p>\n<p>일반건강검진 비용은 국민건강보험공단이 전액 부담해서 본인 부담이 없다고 질병관리청 자료에 나와 있어요. 다만 공단 안내에는 확진검사 단계에서 안내된 항목 외의 검사(당화혈색소 등 추가 피검사, CT 등)를 하면 비용이 발생한다고 되어 있어요. 일반검진 때 검진기관에서 추가로 고르는 항목의 금액은 기관마다 다르니, 검진 전에 해당 기관에 직접 물어보세요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>안 받으면 정말 불이익이 있을까?<\/b><\/span><\/p>\n<p>제일 궁금한 부분이죠. 제가 확인한 내용은 이렇습니다.<\/p>\n<ul><li>직장인(산업안전보건법): 사업주는 근로자에게 건강진단을 실시해야 하고(법 제129조), 하지 않으면 1천만 원 이하의 과태료가 있어요(법 제175조 제4항). 근로자도 사업주가 실시하는 건강진단을 받아야 하고(법 제133조) 받지 않으면 300만 원 이하의 과태료 대상이에요(법 제175조 제6항). 고용노동부 안내에는 근로자 1명당 사업주 1차 10만 원·2차 20만 원·3차 30만 원, 근로자 1차 5만 원·2차 10만 원·3차 15만 원으로 단계별 금액이 나와 있어요. 이 건강진단은 국민건강보험법에 따른 건강검진으로 대체할 수 있다고 고용노동부가 안내하고 있어요. 즉 이 과태료는 국민건강보험법이 아니라 산업안전보건법에 따른 것이라, 실제 부과 여부는 사업장 상황에 따라 달라요.<\/li><li>암환자 의료비 지원: 예전에는 국가암검진을 받은 뒤 암을 진단받으면 의료비를 지원받는 길이 있었지만, 보건소 안내(2026년)에 따르면 성인 건강보험가입자 신규 지원은 2021년 7월부터 중단되었어요. '검진을 안 받으면 암 의료비 지원에서 빠진다'는 식의 설명은 지금 기준과 맞지 않아 이 글에서는 쓰지 않았어요.<\/li><li>'개인 과태료 10만 원'이라는 글이 인터넷에 돌지만, 공단이나 법령 원문에서는 확인하지 못해서 이 글에서는 사실로 쓰지 않았어요.<\/li><\/ul>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>작년에 놓쳤다면: 전년도 미수검자 추가신청<\/b><\/span><\/p>\n<p>작년에 대상이었는데 시기를 놓쳤다면, 비용을 추가로 내지 않고 올해 검진을 받을 수 있는 '전년도 미수검자 추가신청' 서비스가 있어요. 방법은 세 가지예요.<\/p>\n<ol><li>보이는 ARS: 1577-1000 전화 → 9번 → 문자로 받은 URL 접속 → 건강검진 → 전년도 미수검자 검진 신청<\/li><li>공단 홈페이지: 건강모아 → 나의 건강관리 → 국가건강검진정보 → 전년도 미수검자 추가 신청<\/li><li>모바일 앱(건강보험25시): 건강모아 → 나의건강 → 검진신청 → 전년도 미수검자 추가 신청<\/li><\/ol>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/001/001_2_card.png\" alt=\"국가건강검진 한눈에 정리\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>검진을 받은 뒤에는<\/b><\/span><\/p>\n<p>결과는 검진 후 15일 이내에 우편이나 이메일로 받을 수 있고, 앱에서도 조회할 수 있어요. 고혈압·당뇨병·이상지질혈증·폐결핵·우울증 또는 조기정신증·C형간염 질환의심자라면 병·의원에서 확진검사(진료)를 받을 수 있고, 최초 1회는 본인부담이 면제돼요. 국민건강보험공단 안내(2026년)에는 이 기한이 검진 다음 연도 3월 31일까지로 되어 있어요. 예를 들어 2026년에 검진을 받았다면 2027년 3월 31일까지예요. 기존 1월 31일에서 3월 31일로 늘어났다고 공단 리플릿에 나와 있고, 2026년 1월부터 이상지질혈증과 당뇨병 당화혈색소 검사도 대상에 추가됐다고 해요. 질병관리청 건강정보 포털에는 아직 1월 31일로 적혀 있으니 헷갈리지 않게 공단 안내를 기준으로 보세요. 참고로 C형간염은 본인부담금이 생길 수 있고 별도 정산 신청이 필요하다고 안내돼 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>대상 여부는 공단 홈페이지·앱에서 직접 조회하기<\/li><li>검진표가 없어도 1577-1000 문의, 신분증으로 검진 가능<\/li><li>놓쳤다면 전년도 미수검자 추가신청 활용하기<\/li><li>일반건강검진 기간은 매년 1월 1일~12월 31일이고, 확진검사는 다음 연도 3월 31일까지(국민건강보험공단 안내, 보건복지부 고시 제2026-6호 건강검진 실시기준)<\/li><\/ul>\n<p>제도는 바뀔 수 있으니 신청 전에 국민건강보험공단 공식 안내를 꼭 한 번 더 확인해 주세요.<\/p><p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/lib/draft_1/d1_wm_Blood_pressure_monitoring.jpg\" alt=\"혈압 측정 장면(분위기 이미지)\" width=\"720\"><\/p><p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/lib/draft_1/d1_kogl6488_stethoscope_01.jpg\" alt=\"옛 청진기 사진(분위기 이미지)\" width=\"720\"><\/p><p style=\"text-align:center\"><span style=\"font-size:13px;color:#888888\">출처: 국립소록도병원 한센병박물관(공공누리)<\/span><\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/001/001_0_thumb.png\n\n국가건강검진을 안 받으면 벌금이 나온다는 이야기, 한 번쯤 들어보셨죠? 저도 궁금해서 공식 자료부터 찾아봤어요. 결론부터 말씀드리면, 제가 확인한 국민건강보험법 과태료 조항(제119조)에서는 건강검진을 받지 않은 개인에게 부과하는 과태료를 찾지 못했어요. 다만 직장에 다니는 분은 산업안전보건법에 따른 근로자 건강진단 규정이 따로 있어서 아래에 나눠 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/001/001_1_capture.png\n출처: 국민건강보험공단 홈페이지\n\n먼저, 올해 내가 대상인지 확인하기\n\n일반건강검진은 기본적으로 2년에 한 번 받는 검진이에요. 질병관리청 국가건강정보포털에는 보통 짝수년에 태어난 분은 짝수년에, 홀수년에 태어난 분은 홀수년에 대상이 된다고 나와 있어요. 다만 비사무직(생산직) 직장가입자는 매년 대상이고, 가입 유형에 따라 대상 연령도 조금씩 달라요. 그래서 출생연도만 보고 판단하기보다 직접 조회하는 게 가장 정확합니다.\n\n조회는 국민건강보험공단 홈페이지(건강모아 → 나의 건강 → 검진대상 조회)나 '건강보험25시' 앱에서 할 수 있어요. 공단 안내에 따르면 직장가입자의 일반건강검진 대상 여부는 소속 사업장으로 통보돼서, 검진표를 못 받았다고 해서 대상이 아니라고 단정하기는 어려워요. 검진표는 전자문서로 발송되고 열람하지 않으면 우편으로 보내진다고 해요(직장가입자 중 일반검진만 해당하면 사업장 명부 발송으로 대체). 검진표를 잃어버렸거나 받지 못했다면 공단(1577-1000)이나 가까운 지사에 신청해 다시 받거나 홈페이지에서 검진대상 확인서를 출력할 수 있고, 신분증(주민등록증·운전면허증·여권)으로 검진기관에서 대상자 확인을 받고 검진을 받을 수도 있다고 안내되어 있어요.\n\n비용은 얼마나 들까?\n\n일반건강검진 비용은 국민건강보험공단이 전액 부담해서 본인 부담이 없다고 질병관리청 자료에 나와 있어요. 다만 공단 안내에는 확진검사 단계에서 안내된 항목 외의 검사(당화혈색소 등 추가 피검사, CT 등)를 하면 비용이 발생한다고 되어 있어요. 일반검진 때 검진기관에서 추가로 고르는 항목의 금액은 기관마다 다르니, 검진 전에 해당 기관에 직접 물어보세요.\n\n안 받으면 정말 불이익이 있을까?\n\n제일 궁금한 부분이죠. 제가 확인한 내용은 이렇습니다.\n\n- 직장인(산업안전보건법): 사업주는 근로자에게 건강진단을 실시해야 하고(법 제129조), 하지 않으면 1천만 원 이하의 과태료가 있어요(법 제175조 제4항). 근로자도 사업주가 실시하는 건강진단을 받아야 하고(법 제133조) 받지 않으면 300만 원 이하의 과태료 대상이에요(법 제175조 제6항). 고용노동부 안내에는 근로자 1명당 사업주 1차 10만 원·2차 20만 원·3차 30만 원, 근로자 1차 5만 원·2차 10만 원·3차 15만 원으로 단계별 금액이 나와 있어요. 이 건강진단은 국민건강보험법에 따른 건강검진으로 대체할 수 있다고 고용노동부가 안내하고 있어요. 즉 이 과태료는 국민건강보험법이 아니라 산업안전보건법에 따른 것이라, 실제 부과 여부는 사업장 상황에 따라 달라요.\n- 암환자 의료비 지원: 예전에는 국가암검진을 받은 뒤 암을 진단받으면 의료비를 지원받는 길이 있었지만, 보건소 안내(2026년)에 따르면 성인 건강보험가입자 신규 지원은 2021년 7월부터 중단되었어요. '검진을 안 받으면 암 의료비 지원에서 빠진다'는 식의 설명은 지금 기준과 맞지 않아 이 글에서는 쓰지 않았어요.\n- '개인 과태료 10만 원'이라는 글이 인터넷에 돌지만, 공단이나 법령 원문에서는 확인하지 못해서 이 글에서는 사실로 쓰지 않았어요.\n\n작년에 놓쳤다면: 전년도 미수검자 추가신청\n\n작년에 대상이었는데 시기를 놓쳤다면, 비용을 추가로 내지 않고 올해 검진을 받을 수 있는 '전년도 미수검자 추가신청' 서비스가 있어요. 방법은 세 가지예요.\n\n1. 보이는 ARS: 1577-1000 전화 → 9번 → 문자로 받은 URL 접속 → 건강검진 → 전년도 미수검자 검진 신청\n2. 공단 홈페이지: 건강모아 → 나의 건강관리 → 국가건강검진정보 → 전년도 미수검자 추가 신청\n3. 모바일 앱(건강보험25시): 건강모아 → 나의건강 → 검진신청 → 전년도 미수검자 추가 신청\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/001/001_2_card.png\n\n검진을 받은 뒤에는\n\n결과는 검진 후 15일 이내에 우편이나 이메일로 받을 수 있고, 앱에서도 조회할 수 있어요. 고혈압·당뇨병·이상지질혈증·폐결핵·우울증 또는 조기정신증·C형간염 질환의심자라면 병·의원에서 확진검사(진료)를 받을 수 있고, 최초 1회는 본인부담이 면제돼요. 국민건강보험공단 안내(2026년)에는 이 기한이 검진 다음 연도 3월 31일까지로 되어 있어요. 예를 들어 2026년에 검진을 받았다면 2027년 3월 31일까지예요. 기존 1월 31일에서 3월 31일로 늘어났다고 공단 리플릿에 나와 있고, 2026년 1월부터 이상지질혈증과 당뇨병 당화혈색소 검사도 대상에 추가됐다고 해요. 질병관리청 건강정보 포털에는 아직 1월 31일로 적혀 있으니 헷갈리지 않게 공단 안내를 기준으로 보세요. 참고로 C형간염은 본인부담금이 생길 수 있고 별도 정산 신청이 필요하다고 안내돼 있어요.\n\n한눈에 정리\n\n- 대상 여부는 공단 홈페이지·앱에서 직접 조회하기\n- 검진표가 없어도 1577-1000 문의, 신분증으로 검진 가능\n- 놓쳤다면 전년도 미수검자 추가신청 활용하기\n- 일반건강검진 기간은 매년 1월 1일~12월 31일이고, 확진검사는 다음 연도 3월 31일까지(국민건강보험공단 안내, 보건복지부 고시 제2026-6호 건강검진 실시기준)\n\n제도는 바뀔 수 있으니 신청 전에 국민건강보험공단 공식 안내를 꼭 한 번 더 확인해 주세요.\n\n[사진] https://senti-1000ma.github.io/blog-drafts/img/lib/draft_1/d1_wm_Blood_pressure_monitoring.jpg\n\n[사진] https://senti-1000ma.github.io/blog-drafts/img/lib/draft_1/d1_kogl6488_stethoscope_01.jpg\n출처: 국립소록도병원 한센병박물관(공공누리)", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/001/001_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/001/001_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "001_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/001/001_1_capture.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/001/001_1_capture.png", "cap": "출처: 국민건강보험공단 홈페이지", "alt": "'건강검진 실시안내 > 일반건강검진' 검진 절차 안내 (2026-10-05 확인)", "name": "001_1_capture.png", "w": 1080, "h": 755}, {"n": 2, "label": "사진 2", "uri": "img/001/001_2_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/001/001_2_card.png", "cap": "", "alt": "국가건강검진 한눈에 정리", "name": "001_2_card.png", "w": 1080, "h": 974}, {"n": -1, "label": "추가 사진", "uri": "img/lib/draft_1/d1_wm_Blood_pressure_monitoring.jpg", "abs": "https://senti-1000ma.github.io/blog-drafts/img/lib/draft_1/d1_wm_Blood_pressure_monitoring.jpg", "cap": "", "alt": "혈압 측정 장면(분위기 이미지)", "name": "d1_wm_Blood_pressure_monitoring.jpg", "w": 1080, "h": 638}, {"n": -1, "label": "추가 사진", "uri": "img/lib/draft_1/d1_kogl6488_stethoscope_01.jpg", "abs": "https://senti-1000ma.github.io/blog-drafts/img/lib/draft_1/d1_kogl6488_stethoscope_01.jpg", "cap": "출처: 국립소록도병원 한센병박물관(공공누리)", "alt": "옛 청진기 사진(분위기 이미지)", "name": "d1_kogl6488_stethoscope_01.jpg", "w": 760, "h": 507}], "zip": "img/001/001_images.zip", "html": "<figure class=\"ph thumbfig\" data-n=\"0\"><img src=\"img/001/001_0_thumb.png\" alt=\"대표 이미지\"><\/figure>\n<p>국가건강검진을 안 받으면 벌금이 나온다는 이야기, 한 번쯤 들어보셨죠? 저도 궁금해서 공식 자료부터 찾아봤어요. 결론부터 말씀드리면, 제가 확인한 국민건강보험법 과태료 조항(제119조)에서는 건강검진을 받지 않은 개인에게 부과하는 과태료를 찾지 못했어요. 다만 직장에 다니는 분은 산업안전보건법에 따른 근로자 건강진단 규정이 따로 있어서 아래에 나눠 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<figure class=\"ph\" data-n=\"1\"><img loading=\"lazy\" src=\"img/001/001_1_capture.png\" alt=\"&#x27;건강검진 실시안내 &gt; 일반건강검진&#x27; 검진 절차 안내 (2026-10-05 확인)\"><figcaption>출처: 국민건강보험공단 홈페이지<\/figcaption><\/figure>\n<h3>먼저, 올해 내가 대상인지 확인하기<\/h3>\n<p>일반건강검진은 기본적으로 2년에 한 번 받는 검진이에요. 질병관리청 국가건강정보포털에는 보통 짝수년에 태어난 분은 짝수년에, 홀수년에 태어난 분은 홀수년에 대상이 된다고 나와 있어요. 다만 비사무직(생산직) 직장가입자는 매년 대상이고, 가입 유형에 따라 대상 연령도 조금씩 달라요. 그래서 출생연도만 보고 판단하기보다 직접 조회하는 게 가장 정확합니다.<\/p>\n<p>조회는 국민건강보험공단 홈페이지(건강모아 → 나의 건강 → 검진대상 조회)나 '건강보험25시' 앱에서 할 수 있어요. 공단 안내에 따르면 직장가입자의 일반건강검진 대상 여부는 소속 사업장으로 통보돼서, 검진표를 못 받았다고 해서 대상이 아니라고 단정하기는 어려워요. 검진표는 전자문서로 발송되고 열람하지 않으면 우편으로 보내진다고 해요(직장가입자 중 일반검진만 해당하면 사업장 명부 발송으로 대체). 검진표를 잃어버렸거나 받지 못했다면 공단(1577-1000)이나 가까운 지사에 신청해 다시 받거나 홈페이지에서 검진대상 확인서를 출력할 수 있고, 신분증(주민등록증·운전면허증·여권)으로 검진기관에서 대상자 확인을 받고 검진을 받을 수도 있다고 안내되어 있어요.<\/p>\n<h3>비용은 얼마나 들까?<\/h3>\n<p>일반건강검진 비용은 국민건강보험공단이 전액 부담해서 본인 부담이 없다고 질병관리청 자료에 나와 있어요. 다만 공단 안내에는 확진검사 단계에서 안내된 항목 외의 검사(당화혈색소 등 추가 피검사, CT 등)를 하면 비용이 발생한다고 되어 있어요. 일반검진 때 검진기관에서 추가로 고르는 항목의 금액은 기관마다 다르니, 검진 전에 해당 기관에 직접 물어보세요.<\/p>\n<h3>안 받으면 정말 불이익이 있을까?<\/h3>\n<p>제일 궁금한 부분이죠. 제가 확인한 내용은 이렇습니다.<\/p>\n<ul><li>직장인(산업안전보건법): 사업주는 근로자에게 건강진단을 실시해야 하고(법 제129조), 하지 않으면 1천만 원 이하의 과태료가 있어요(법 제175조 제4항). 근로자도 사업주가 실시하는 건강진단을 받아야 하고(법 제133조) 받지 않으면 300만 원 이하의 과태료 대상이에요(법 제175조 제6항). 고용노동부 안내에는 근로자 1명당 사업주 1차 10만 원·2차 20만 원·3차 30만 원, 근로자 1차 5만 원·2차 10만 원·3차 15만 원으로 단계별 금액이 나와 있어요. 이 건강진단은 국민건강보험법에 따른 건강검진으로 대체할 수 있다고 고용노동부가 안내하고 있어요. 즉 이 과태료는 국민건강보험법이 아니라 산업안전보건법에 따른 것이라, 실제 부과 여부는 사업장 상황에 따라 달라요.<\/li><li>암환자 의료비 지원: 예전에는 국가암검진을 받은 뒤 암을 진단받으면 의료비를 지원받는 길이 있었지만, 보건소 안내(2026년)에 따르면 성인 건강보험가입자 신규 지원은 2021년 7월부터 중단되었어요. '검진을 안 받으면 암 의료비 지원에서 빠진다'는 식의 설명은 지금 기준과 맞지 않아 이 글에서는 쓰지 않았어요.<\/li><li>'개인 과태료 10만 원'이라는 글이 인터넷에 돌지만, 공단이나 법령 원문에서는 확인하지 못해서 이 글에서는 사실로 쓰지 않았어요.<\/li><\/ul>\n<h3>작년에 놓쳤다면: 전년도 미수검자 추가신청<\/h3>\n<p>작년에 대상이었는데 시기를 놓쳤다면, 비용을 추가로 내지 않고 올해 검진을 받을 수 있는 '전년도 미수검자 추가신청' 서비스가 있어요. 방법은 세 가지예요.<\/p>\n<ol><li>보이는 ARS: 1577-1000 전화 → 9번 → 문자로 받은 URL 접속 → 건강검진 → 전년도 미수검자 검진 신청<\/li><li>공단 홈페이지: 건강모아 → 나의 건강관리 → 국가건강검진정보 → 전년도 미수검자 추가 신청<\/li><li>모바일 앱(건강보험25시): 건강모아 → 나의건강 → 검진신청 → 전년도 미수검자 추가 신청<\/li><\/ol>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/001/001_2_card.png\" alt=\"국가건강검진 한눈에 정리\"><\/figure>\n<h3>검진을 받은 뒤에는<\/h3>\n<p>결과는 검진 후 15일 이내에 우편이나 이메일로 받을 수 있고, 앱에서도 조회할 수 있어요. 고혈압·당뇨병·이상지질혈증·폐결핵·우울증 또는 조기정신증·C형간염 질환의심자라면 병·의원에서 확진검사(진료)를 받을 수 있고, 최초 1회는 본인부담이 면제돼요. 국민건강보험공단 안내(2026년)에는 이 기한이 검진 다음 연도 3월 31일까지로 되어 있어요. 예를 들어 2026년에 검진을 받았다면 2027년 3월 31일까지예요. 기존 1월 31일에서 3월 31일로 늘어났다고 공단 리플릿에 나와 있고, 2026년 1월부터 이상지질혈증과 당뇨병 당화혈색소 검사도 대상에 추가됐다고 해요. 질병관리청 건강정보 포털에는 아직 1월 31일로 적혀 있으니 헷갈리지 않게 공단 안내를 기준으로 보세요. 참고로 C형간염은 본인부담금이 생길 수 있고 별도 정산 신청이 필요하다고 안내돼 있어요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>대상 여부는 공단 홈페이지·앱에서 직접 조회하기<\/li><li>검진표가 없어도 1577-1000 문의, 신분증으로 검진 가능<\/li><li>놓쳤다면 전년도 미수검자 추가신청 활용하기<\/li><li>일반건강검진 기간은 매년 1월 1일~12월 31일이고, 확진검사는 다음 연도 3월 31일까지(국민건강보험공단 안내, 보건복지부 고시 제2026-6호 건강검진 실시기준)<\/li><\/ul>\n<p>제도는 바뀔 수 있으니 신청 전에 국민건강보험공단 공식 안내를 꼭 한 번 더 확인해 주세요.<\/p><div class=\"gallery\"><figure class=\"ph\"><img loading=\"lazy\" src=\"img/lib/draft_1/d1_wm_Blood_pressure_monitoring.jpg\" alt=\"혈압 측정 장면(분위기 이미지)\"><\/figure><figure class=\"ph\"><img loading=\"lazy\" src=\"img/lib/draft_1/d1_kogl6488_stethoscope_01.jpg\" alt=\"옛 청진기 사진(분위기 이미지)\"><figcaption>출처: 국립소록도병원 한센병박물관(공공누리)<\/figcaption><\/figure><\/div>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 공식 화면 캡처 · 사진 2 자체 제작 카드 — 파일 images/posts/001/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>첫 화면(썸네일 겸 사진 1)<\/td><td>공단 '건강검진 대상 조회' 화면<\/td><td>이름·주민번호·검진표 번호 모자이크. 제목의 약속(불이익 여부)과 관련 있는 화면이어야 낚시 인상 방지<\/td><\/tr><tr><td>'전년도 미수검자 추가신청' 소제목 아래(사진 2)<\/td><td>앱/홈페이지 메뉴 경로 캡처<\/td><td>직접 해본 경로만 캡처. 단계 설명은 이미지가 아니라 본문 텍스트로도 유지(텍스트 안내는 검색·가독성 모두 유리)<\/td><\/tr><tr><td>(선택) 결과 조회 화면<\/td><td>앱의 결과 조회 화면<\/td><td>결과 수치·개인 건강정보는 반드시 가림<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 공단 홈페이지·앱의 '검진대상 조회' 실제 화면이 본문 경로와 같은지 직접 확인(사진 1·2 캡처 시)<\/li><li class=\"cb\">☐ 일반검진 때 검진기관 추가 항목 금액을 쓰려면 해당 기관 공지로 확인(현재 본문엔 금액 없음)<\/li><li class=\"cb\">☐ 직장인 과태료 문단은 \"사업장 상황에 따라 다르다\"는 취지를 유지(개별 사업장 부과 사례는 확인 불가)<\/li><li class=\"cb\">☐ 본인/가족이 실제로 대상 조회를 해 본 경험이 있다면 한두 문장 추가. 없으면 지어내지 말고 '공식 안내 기준' 유지<\/li><li class=\"cb\">☐ 질병관리청 국가건강정보포털 문장은 공공누리 제4유형(상업적 이용금지·변경금지)이므로 문장을 그대로 옮기지 말 것(애드포스트는 수익 활동)<\/li><\/ul>", "open": true}, {"title": "팩트체크 결과", "html": "<div class=\"tw\"><table><thead><tr><th>#<\/th><th>원본 '확인 필요' 항목<\/th><th>판정<\/th><th>확인 내용 · 출처<\/th><\/tr><\/thead><tbody><tr><td>1-1<\/td><td>검진기관 추가 항목 비용<\/td><td>부분 확인 / 일부 확인 불가<\/td><td>공단 안내: 확진검사 시 안내 항목 외 검사(CT 등)는 비용 발생 — <a href=\"https://www.nhis.or.kr/nhis/healthin/wbhaca04500m01.do\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nhis.or.kr/nhis/healthin/wbhaca04500m01.do<\/a> . 일반검진 때 기관별 추가 항목 금액은 확인 불가 → 2026-10-05 재조사 후에도 공식 금액 없음, 본문은 '기관에 문의' 안내로 재작성(표시 없음)<\/td><\/tr><tr><td>1-2<\/td><td>직장 미수검 과태료(사업주 1,000만 원 이하/근로자 300만 원 이하) 현행 여부<\/td><td>확인됨 + 정정(법적 근거)<\/td><td>근거는 국민건강보험법이 아니라 산업안전보건법 제129·133·175조(시행 2026-08-01). 국민건강보험법 제119조에는 미수검 과태료 없음. 고용노동부: 1인당 사업주 10/20/30만 원, 근로자 5/10/15만 원, 건보 검진으로 대체 가능 — <a href=\"https://www.moel.go.kr/minwon/fastcounsel/fastcounselView.do?inetDcssMngId=202210251754485021000\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.moel.go.kr/minwon/fastcounsel/fastcounselView.do?inetDcssMngId=202210251754485021000<\/a> , <a href=\"https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&amp;joBrNo=00&amp;joNo=0175&amp;lsiSeq=283449&amp;urlMode=lsScJoRltInfoR\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&amp;joBrNo=00&amp;joNo=0175&amp;lsiSeq=283449&amp;urlMode=lsScJoRltInfoR<\/a><\/td><\/tr><tr><td>1-3<\/td><td>암환자 의료비 지원 제외(헬스경향 2023)<\/td><td>불일치(정정)<\/td><td>성인 건강보험가입자 신규 지원은 2021-07부터 중단(2021-06-30까지 국가암검진 수검·진단자만 해당). \"미수검 시 제외\" 문구는 현재 기준과 맞지 않아 삭제 — <a href=\"https://www.wonju.go.kr/health/contents.do?key=1752\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.wonju.go.kr/health/contents.do?key=1752<\/a> , <a href=\"https://sb.go.kr/bogunso/contents.do?key=255\" target=\"_blank\" rel=\"noopener noreferrer\">https://sb.go.kr/bogunso/contents.do?key=255<\/a> (지자체 보건소)<\/td><\/tr><tr><td>1-4<\/td><td>확진검사 면제 기한 1/31 vs 3/31<\/td><td>불일치(정정: 3/31)<\/td><td>검진 다음 연도 3월 31일까지(2026-01부터 연장). 질병관리청 포털(업데이트 2026-06-01)은 1/31로 남아 있어 상충 — <a href=\"https://www.nhis.or.kr/renewal_popup/poster/20260204_poster_longdesc_1.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nhis.or.kr/renewal_popup/poster/20260204_poster_longdesc_1.html<\/a> , <a href=\"https://www.nhis.or.kr/nhis/healthin/wbhaca04500m01.do\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nhis.or.kr/nhis/healthin/wbhaca04500m01.do<\/a><\/td><\/tr><tr><td>1-5<\/td><td>2026 일반검진 실시기한 12/31<\/td><td>확인됨<\/td><td>공단: 검진기간 매년 1.1~12.31. 보건복지부 고시 제2026-6호(2026-01-07) 제8조①\"건강검진은 해당연도에 실시\" — <a href=\"https://www.nhis.or.kr/lm/lmxsrv/law/lawFullContent.do?SEQ=80&amp;SEQ_HISTORY=595068\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nhis.or.kr/lm/lmxsrv/law/lawFullContent.do?SEQ=80&amp;SEQ_HISTORY=595068<\/a><\/td><\/tr><tr><td>1-6<\/td><td>대상 조회 메뉴명·경로<\/td><td>확인됨<\/td><td>건강모아 → 나의 건강 → 검진대상 조회(홈페이지), 앱 '건강보험25시' — 공단·질병관리청(<a href=\"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6671\" target=\"_blank\" rel=\"noopener noreferrer\">https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6671<\/a> ). 화면 실제 일치는 사용자가 직접 재확인<\/td><\/tr><tr><td>1-7<\/td><td>직장가입자 검진표 없어도 대상일 수 있음<\/td><td>확인됨<\/td><td>공단: 직장가입자 대상 여부는 소속 사업장으로 통보 — nhis.or.kr 위 페이지<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>비용 전액 공단 부담, 2년 주기·비사무직 매년, 조회 경로, 검진표 분실 시 1577-1000, 신분증으로 검진, 결과 15일, 전년도 미수검자 추가신청 방법<\/td><td>질병관리청 국가건강정보포털 <a href=\"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6671\" target=\"_blank\" rel=\"noopener noreferrer\">https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6671<\/a> (업데이트 2026-06-01; 확진검사 기한은 1/31로 남아 있어 사용 안 함)<\/td><td>공식<\/td><\/tr><tr><td>검진 절차, 전자문서 검진표, 검진기간 1.1~12.31, 확진검사 대상·기한(다음 연도 3.31), C형간염 본인부담, 추가 검사 비용, 전년도 미수검자 추가등록<\/td><td>국민건강보험공단 일반건강검진 안내 <a href=\"https://www.nhis.or.kr/nhis/healthin/wbhaca04500m01.do\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nhis.or.kr/nhis/healthin/wbhaca04500m01.do<\/a><\/td><td>공식<\/td><\/tr><tr><td>확진검사 수검기한 1/31→3/31 연장, 이상지질혈증·당화혈색소 추가(2026-01)<\/td><td>공단 '2026년 달라지는 건강보험' 리플릿 <a href=\"https://www.nhis.or.kr/renewal_popup/poster/20260204_poster_longdesc_1.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nhis.or.kr/renewal_popup/poster/20260204_poster_longdesc_1.html<\/a><\/td><td>공식<\/td><\/tr><tr><td>건강검진 실시기준(고시 제2026-6호, 제8조①)<\/td><td>공단 법령 DB <a href=\"https://www.nhis.or.kr/lm/lmxsrv/law/lawFullContent.do?SEQ=80&amp;SEQ_HISTORY=595068\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nhis.or.kr/lm/lmxsrv/law/lawFullContent.do?SEQ=80&amp;SEQ_HISTORY=595068<\/a><\/td><td>공식<\/td><\/tr><tr><td>직장인 건강진단 의무·과태료<\/td><td>산업안전보건법 제129·133·175조(국가법령정보센터) <a href=\"https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&amp;joBrNo=00&amp;joNo=0175&amp;lsiSeq=283449&amp;urlMode=lsScJoRltInfoR\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&amp;joBrNo=00&amp;joNo=0175&amp;lsiSeq=283449&amp;urlMode=lsScJoRltInfoR<\/a> ; 고용노동부 빠른상담 <a href=\"https://www.moel.go.kr/minwon/fastcounsel/fastcounselView.do?inetDcssMngId=202210251754485021000\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.moel.go.kr/minwon/fastcounsel/fastcounselView.do?inetDcssMngId=202210251754485021000<\/a><\/td><td>공식<\/td><\/tr><tr><td>암환자 의료비 지원 대상<\/td><td>지자체 보건소 안내 <a href=\"https://www.wonju.go.kr/health/contents.do?key=1752\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.wonju.go.kr/health/contents.do?key=1752<\/a><\/td><td>공식(지자체)<\/td><\/tr><tr><td>(참고·미사용) 정책브리핑 카드뉴스 2019 <a href=\"https://www.korea.kr/multi/visualNewsView.do?newsId=148865937\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/multi/visualNewsView.do?newsId=148865937<\/a><\/td><td>직장 미수검 과태료 상한 소개(법적 근거 명시 없음) → 위 법령으로 대체<\/td><td>공식이나 오래됨<\/td><\/tr><tr><td>'개인 과태료 10만 원' 주장(사용 안 함)<\/td><td><a href=\"https://asiatop.co.kr/public-services/health-checkup-mandatory-fine-exemption/\" target=\"_blank\" rel=\"noopener noreferrer\">https://asiatop.co.kr/public-services/health-checkup-mandatory-fine-exemption/<\/a><\/td><td>비공식·근거 미확인 → 본문 미사용<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "<ul><li>사진 1: 국민건강보험공단 홈페이지 공개 화면 캡처(2026-10-05 확인, 로그인 전 화면) <a href=\"https://www.nhis.or.kr/nhis/healthin/wbhaca04500m01.do\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nhis.or.kr/nhis/healthin/wbhaca04500m01.do<\/a><\/li><\/ul>\n<p>사진: rawpixel.com / Wikimedia Commons (CC0, 표기 의무 없음 — 출처 병기 권장) <a href=\"https://commons.wikimedia.org/wiki/File:Blood_pressure_monitoring.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">https://commons.wikimedia.org/wiki/File:Blood_pressure_monitoring.jpg<\/a><br>본 저작물은 국립소록도병원 한센병박물관에서 2018년 작성하여 공공누리 제1유형으로 개방한 '청진기'를 이용하였으며, 해당 저작물은 공공누리(<a href=\"https://www.kogl.or.kr\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.kogl.or.kr<\/a>)에서 무료로 다운받으실 수 있습니다.<\/p>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>\n<p>(참고: 이 글에는 광고·제휴·협찬·대가성 요소가 없습니다. 클릭 유도 문구도 넣지 않았습니다.)<\/p>", "open": false}], "plain": "국가건강검진을 안 받으면 벌금이 나온다는 이야기, 한 번쯤 들어보셨죠? 저도 궁금해서 공식 자료부터 찾아봤어요. 결론부터 말씀드리면, 제가 확인한 국민건강보험법 과태료 조항(제119조)에서는 건강검진을 받지 않은 개인에게 부과하는 과태료를 찾지 못했어요. 다만 직장에 다니는 분은 산업안전보건법에 따른 근로자 건강진단 규정이 따로 있어서 아래에 나눠 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/001/001_1_capture.png\n출처: 국민건강보험공단 홈페이지\n\n먼저, 올해 내가 대상인지 확인하기\n\n일반건강검진은 기본적으로 2년에 한 번 받는 검진이에요. 질병관리청 국가건강정보포털에는 보통 짝수년에 태어난 분은 짝수년에, 홀수년에 태어난 분은 홀수년에 대상이 된다고 나와 있어요. 다만 비사무직(생산직) 직장가입자는 매년 대상이고, 가입 유형에 따라 대상 연령도 조금씩 달라요. 그래서 출생연도만 보고 판단하기보다 직접 조회하는 게 가장 정확합니다.\n\n조회는 국민건강보험공단 홈페이지(건강모아 → 나의 건강 → 검진대상 조회)나 '건강보험25시' 앱에서 할 수 있어요. 공단 안내에 따르면 직장가입자의 일반건강검진 대상 여부는 소속 사업장으로 통보돼서, 검진표를 못 받았다고 해서 대상이 아니라고 단정하기는 어려워요. 검진표는 전자문서로 발송되고 열람하지 않으면 우편으로 보내진다고 해요(직장가입자 중 일반검진만 해당하면 사업장 명부 발송으로 대체). 검진표를 잃어버렸거나 받지 못했다면 공단(1577-1000)이나 가까운 지사에 신청해 다시 받거나 홈페이지에서 검진대상 확인서를 출력할 수 있고, 신분증(주민등록증·운전면허증·여권)으로 검진기관에서 대상자 확인을 받고 검진을 받을 수도 있다고 안내되어 있어요.\n\n비용은 얼마나 들까?\n\n일반건강검진 비용은 국민건강보험공단이 전액 부담해서 본인 부담이 없다고 질병관리청 자료에 나와 있어요. 다만 공단 안내에는 확진검사 단계에서 안내된 항목 외의 검사(당화혈색소 등 추가 피검사, CT 등)를 하면 비용이 발생한다고 되어 있어요. 일반검진 때 검진기관에서 추가로 고르는 항목의 금액은 기관마다 다르니, 검진 전에 해당 기관에 직접 물어보세요.\n\n안 받으면 정말 불이익이 있을까?\n\n제일 궁금한 부분이죠. 제가 확인한 내용은 이렇습니다.\n\n- 직장인(산업안전보건법): 사업주는 근로자에게 건강진단을 실시해야 하고(법 제129조), 하지 않으면 1천만 원 이하의 과태료가 있어요(법 제175조 제4항). 근로자도 사업주가 실시하는 건강진단을 받아야 하고(법 제133조) 받지 않으면 300만 원 이하의 과태료 대상이에요(법 제175조 제6항). 고용노동부 안내에는 근로자 1명당 사업주 1차 10만 원·2차 20만 원·3차 30만 원, 근로자 1차 5만 원·2차 10만 원·3차 15만 원으로 단계별 금액이 나와 있어요. 이 건강진단은 국민건강보험법에 따른 건강검진으로 대체할 수 있다고 고용노동부가 안내하고 있어요. 즉 이 과태료는 국민건강보험법이 아니라 산업안전보건법에 따른 것이라, 실제 부과 여부는 사업장 상황에 따라 달라요.\n- 암환자 의료비 지원: 예전에는 국가암검진을 받은 뒤 암을 진단받으면 의료비를 지원받는 길이 있었지만, 보건소 안내(2026년)에 따르면 성인 건강보험가입자 신규 지원은 2021년 7월부터 중단되었어요. '검진을 안 받으면 암 의료비 지원에서 빠진다'는 식의 설명은 지금 기준과 맞지 않아 이 글에서는 쓰지 않았어요.\n- '개인 과태료 10만 원'이라는 글이 인터넷에 돌지만, 공단이나 법령 원문에서는 확인하지 못해서 이 글에서는 사실로 쓰지 않았어요.\n\n작년에 놓쳤다면: 전년도 미수검자 추가신청\n\n작년에 대상이었는데 시기를 놓쳤다면, 비용을 추가로 내지 않고 올해 검진을 받을 수 있는 '전년도 미수검자 추가신청' 서비스가 있어요. 방법은 세 가지예요.\n\n1. 보이는 ARS: 1577-1000 전화 → 9번 → 문자로 받은 URL 접속 → 건강검진 → 전년도 미수검자 검진 신청\n2. 공단 홈페이지: 건강모아 → 나의 건강관리 → 국가건강검진정보 → 전년도 미수검자 추가 신청\n3. 모바일 앱(건강보험25시): 건강모아 → 나의건강 → 검진신청 → 전년도 미수검자 추가 신청\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/001/001_2_card.png\n\n검진을 받은 뒤에는\n\n결과는 검진 후 15일 이내에 우편이나 이메일로 받을 수 있고, 앱에서도 조회할 수 있어요. 고혈압·당뇨병·이상지질혈증·폐결핵·우울증 또는 조기정신증·C형간염 질환의심자라면 병·의원에서 확진검사(진료)를 받을 수 있고, 최초 1회는 본인부담이 면제돼요. 국민건강보험공단 안내(2026년)에는 이 기한이 검진 다음 연도 3월 31일까지로 되어 있어요. 예를 들어 2026년에 검진을 받았다면 2027년 3월 31일까지예요. 기존 1월 31일에서 3월 31일로 늘어났다고 공단 리플릿에 나와 있고, 2026년 1월부터 이상지질혈증과 당뇨병 당화혈색소 검사도 대상에 추가됐다고 해요. 질병관리청 건강정보 포털에는 아직 1월 31일로 적혀 있으니 헷갈리지 않게 공단 안내를 기준으로 보세요. 참고로 C형간염은 본인부담금이 생길 수 있고 별도 정산 신청이 필요하다고 안내돼 있어요.\n\n한눈에 정리\n\n- 대상 여부는 공단 홈페이지·앱에서 직접 조회하기\n- 검진표가 없어도 1577-1000 문의, 신분증으로 검진 가능\n- 놓쳤다면 전년도 미수검자 추가신청 활용하기\n- 일반건강검진 기간은 매년 1월 1일~12월 31일이고, 확진검사는 다음 연도 3월 31일까지(국민건강보험공단 안내, 보건복지부 고시 제2026-6호 건강검진 실시기준)\n\n제도는 바뀔 수 있으니 신청 전에 국민건강보험공단 공식 안내를 꼭 한 번 더 확인해 주세요.", "copyAll": "국가건강검진을 안 받으면 벌금이 나온다는 이야기, 한 번쯤 들어보셨죠? 저도 궁금해서 공식 자료부터 찾아봤어요. 결론부터 말씀드리면, 제가 확인한 국민건강보험법 과태료 조항(제119조)에서는 건강검진을 받지 않은 개인에게 부과하는 과태료를 찾지 못했어요. 다만 직장에 다니는 분은 산업안전보건법에 따른 근로자 건강진단 규정이 따로 있어서 아래에 나눠 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/001/001_1_capture.png\n출처: 국민건강보험공단 홈페이지\n\n먼저, 올해 내가 대상인지 확인하기\n\n일반건강검진은 기본적으로 2년에 한 번 받는 검진이에요. 질병관리청 국가건강정보포털에는 보통 짝수년에 태어난 분은 짝수년에, 홀수년에 태어난 분은 홀수년에 대상이 된다고 나와 있어요. 다만 비사무직(생산직) 직장가입자는 매년 대상이고, 가입 유형에 따라 대상 연령도 조금씩 달라요. 그래서 출생연도만 보고 판단하기보다 직접 조회하는 게 가장 정확합니다.\n\n조회는 국민건강보험공단 홈페이지(건강모아 → 나의 건강 → 검진대상 조회)나 '건강보험25시' 앱에서 할 수 있어요. 공단 안내에 따르면 직장가입자의 일반건강검진 대상 여부는 소속 사업장으로 통보돼서, 검진표를 못 받았다고 해서 대상이 아니라고 단정하기는 어려워요. 검진표는 전자문서로 발송되고 열람하지 않으면 우편으로 보내진다고 해요(직장가입자 중 일반검진만 해당하면 사업장 명부 발송으로 대체). 검진표를 잃어버렸거나 받지 못했다면 공단(1577-1000)이나 가까운 지사에 신청해 다시 받거나 홈페이지에서 검진대상 확인서를 출력할 수 있고, 신분증(주민등록증·운전면허증·여권)으로 검진기관에서 대상자 확인을 받고 검진을 받을 수도 있다고 안내되어 있어요.\n\n비용은 얼마나 들까?\n\n일반건강검진 비용은 국민건강보험공단이 전액 부담해서 본인 부담이 없다고 질병관리청 자료에 나와 있어요. 다만 공단 안내에는 확진검사 단계에서 안내된 항목 외의 검사(당화혈색소 등 추가 피검사, CT 등)를 하면 비용이 발생한다고 되어 있어요. 일반검진 때 검진기관에서 추가로 고르는 항목의 금액은 기관마다 다르니, 검진 전에 해당 기관에 직접 물어보세요.\n\n안 받으면 정말 불이익이 있을까?\n\n제일 궁금한 부분이죠. 제가 확인한 내용은 이렇습니다.\n\n- 직장인(산업안전보건법): 사업주는 근로자에게 건강진단을 실시해야 하고(법 제129조), 하지 않으면 1천만 원 이하의 과태료가 있어요(법 제175조 제4항). 근로자도 사업주가 실시하는 건강진단을 받아야 하고(법 제133조) 받지 않으면 300만 원 이하의 과태료 대상이에요(법 제175조 제6항). 고용노동부 안내에는 근로자 1명당 사업주 1차 10만 원·2차 20만 원·3차 30만 원, 근로자 1차 5만 원·2차 10만 원·3차 15만 원으로 단계별 금액이 나와 있어요. 이 건강진단은 국민건강보험법에 따른 건강검진으로 대체할 수 있다고 고용노동부가 안내하고 있어요. 즉 이 과태료는 국민건강보험법이 아니라 산업안전보건법에 따른 것이라, 실제 부과 여부는 사업장 상황에 따라 달라요.\n- 암환자 의료비 지원: 예전에는 국가암검진을 받은 뒤 암을 진단받으면 의료비를 지원받는 길이 있었지만, 보건소 안내(2026년)에 따르면 성인 건강보험가입자 신규 지원은 2021년 7월부터 중단되었어요. '검진을 안 받으면 암 의료비 지원에서 빠진다'는 식의 설명은 지금 기준과 맞지 않아 이 글에서는 쓰지 않았어요.\n- '개인 과태료 10만 원'이라는 글이 인터넷에 돌지만, 공단이나 법령 원문에서는 확인하지 못해서 이 글에서는 사실로 쓰지 않았어요.\n\n작년에 놓쳤다면: 전년도 미수검자 추가신청\n\n작년에 대상이었는데 시기를 놓쳤다면, 비용을 추가로 내지 않고 올해 검진을 받을 수 있는 '전년도 미수검자 추가신청' 서비스가 있어요. 방법은 세 가지예요.\n\n1. 보이는 ARS: 1577-1000 전화 → 9번 → 문자로 받은 URL 접속 → 건강검진 → 전년도 미수검자 검진 신청\n2. 공단 홈페이지: 건강모아 → 나의 건강관리 → 국가건강검진정보 → 전년도 미수검자 추가 신청\n3. 모바일 앱(건강보험25시): 건강모아 → 나의건강 → 검진신청 → 전년도 미수검자 추가 신청\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/001/001_2_card.png\n\n검진을 받은 뒤에는\n\n결과는 검진 후 15일 이내에 우편이나 이메일로 받을 수 있고, 앱에서도 조회할 수 있어요. 고혈압·당뇨병·이상지질혈증·폐결핵·우울증 또는 조기정신증·C형간염 질환의심자라면 병·의원에서 확진검사(진료)를 받을 수 있고, 최초 1회는 본인부담이 면제돼요. 국민건강보험공단 안내(2026년)에는 이 기한이 검진 다음 연도 3월 31일까지로 되어 있어요. 예를 들어 2026년에 검진을 받았다면 2027년 3월 31일까지예요. 기존 1월 31일에서 3월 31일로 늘어났다고 공단 리플릿에 나와 있고, 2026년 1월부터 이상지질혈증과 당뇨병 당화혈색소 검사도 대상에 추가됐다고 해요. 질병관리청 건강정보 포털에는 아직 1월 31일로 적혀 있으니 헷갈리지 않게 공단 안내를 기준으로 보세요. 참고로 C형간염은 본인부담금이 생길 수 있고 별도 정산 신청이 필요하다고 안내돼 있어요.\n\n한눈에 정리\n\n- 대상 여부는 공단 홈페이지·앱에서 직접 조회하기\n- 검진표가 없어도 1577-1000 문의, 신분증으로 검진 가능\n- 놓쳤다면 전년도 미수검자 추가신청 활용하기\n- 일반건강검진 기간은 매년 1월 1일~12월 31일이고, 확진검사는 다음 연도 3월 31일까지(국민건강보험공단 안내, 보건복지부 고시 제2026-6호 건강검진 실시기준)\n\n제도는 바뀔 수 있으니 신청 전에 국민건강보험공단 공식 안내를 꼭 한 번 더 확인해 주세요.", "search": "001 국가건강검진 안 받으면 정말 불이익이 있을까? 2026년 기준으로 확인해 봤어요 건강·보건 국가건강검진, 건강검진 대상 조회, 전년도 미수검자 추가신청 국가건강검진 대상 조회, 미수검 시 불이익(법령 근거)·전년도 미수검자 추가신청 방법 정리 국가건강검진을 안 받으면 벌금이 나온다는 이야기, 한 번쯤 들어보셨죠? 저도 궁금해서 공식 자료부터 찾아봤어요. 결론부터 말씀드리면, 제가 확인한 국민건강보험법 과태료 조항(제119조)에서는 건강검진을 받지 않은 개인에게 부과하는 과태료를 찾지 못했어요. 다만 직장에 다니는 분은 산업안전보건법에 따른 근로자 건강진단 규정이 따로 있어서 아래에 나눠 정리했습니다. (2026년 10월 5일 기준) [사진 1] https://senti-1000ma.github.io/blog-drafts/img/001/001_1_capture.png 출처: 국민건강보험공단 홈페이지 먼저, 올해 내가 대상인지 확인하기 일반건강검진은 기본적으로 2년에 한 번 받는 검진이에요. 질병관리청 국가건강정보포털에는 보통 짝수년에 태어난 분은 짝수년에, 홀수년에 태어난 분은 홀수년에 대상이 된다고 나와 있어요. 다만 비사무직(생산직) 직장가입자는 매년 대상이고, 가입 유형에 따라 대상 연령도 조금씩 달라요. 그래서 출생연도만 보고 판단하기보다 직접 조회하는 게 가장 정확합니다. 조회는 국민건강보험공단 홈페이지(건강모아 → 나의 건강 → 검진대상 조회)나 '건강보험25시' 앱에서 할 수 있어요. 공단 안내에 따르면 직장가입자의 일반건강검진 대상 여부는 소속 사업장으로 통보돼서, 검진표를 못 받았다고 해서 대상이 아니라고 단정하기는 어려워요. 검진표는 전자문서로 발송되고 열람하지 않으면 우편으로 보내진다고 해요(직장가입자 중 일반검진만 해당하면 사업장 명부 발송으로 대체). 검진표를 잃어버렸거나 받지 못했다면 공단(1577-1000)이나 가까운 지사에 신청해 다시 받거나 홈페이지에서 검진대상 확인서를 출력할 수 있고, 신분증(주민등록증·운전면허증·여권)으로 검진기관에서 대상자 확인을 받고 검진을 받을 수도 있다고 안내되어 있어요. 비용은 얼마나 들까? 일반건강검진 비용은 국민건강보험공단이 전액 부담해서 본인 부담이 없다고 질병관리청 자료에 나와 있어요. 다만 공단 안내에는 확진검사 단계에서 안내된 항목 외의 검사(당화혈색소 등 추가 피검사, CT 등)를 하면 비용이 발생한다고 되어 있어요. 일반검진 때 검진기관에서 추가로 고르는 항목의 금액은 기관마다 다르니, 검진 전에 해당 기관에 직접 물어보세요. 안 받으면 정말 불이익이 있을까? 제일 궁금한 부분이죠. 제가 확인한 내용은 이렇습니다. - 직장인(산업안전보건법): 사업주는 근로자에게 건강진단을 실시해야 하고(법 제129조), 하지 않으면 1천만 원 이하의 과태료가 있어요(법 제175조 제4항). 근로자도 사업주가 실시하는 건강진단을 받아야 하고(법 제133조) 받지 않으면 300만 원 이하의 과태료 대상이에요(법 제175조 제6항). 고용노동부 안내에는 근로자 1명당 사업주 1차 10만 원·2차 20만 원·3차 30만 원, 근로자 1차 5만 원·2차 10만 원·3차 15만 원으로 단계별 금액이 나와 있어요. 이 건강진단은 국민건강보험법에 따른 건강검진으로 대체할 수 있다고 고용노동부가 안내하고 있어요. 즉 이 과태료는 국민건강보험법이 아니라 산업안전보건법에 따른 것이라, 실제 부과 여부는 사업장 상황에 따라 달라요. - 암환자 의료비 지원: 예전에는 국가암검진을 받은 뒤 암을 진단받으면 의료비를 지원받는 길이 있었지만, 보건소 안내(2026년)에 따르면 성인 건강보험가입자 신규 지원은 2021년 7월부터 중단되었어요. '검진을 안 받으면 암 의료비 지원에서 빠진다'는 식의 설명은 지금 기준과 맞지 않아 이 글에서는 쓰지 않았어요. - '개인 과태료 10만 원'이라는 글이 인터넷에 돌지만, 공단이나 법령 원문에서는 확인하지 못해서 이 글에서는 사실로 쓰지 않았어요. 작년에 놓쳤다면: 전년도 미수검자 추가신청 작년에 대상이었는데 시기를 놓쳤다면, 비용을 추가로 내지 않고 올해 검진을 받을 수 있는 '전년도 미수검자 추가신청' 서비스가 있어요. 방법은 세 가지예요. 1. 보이는 ARS: 1577-1000 전화 → 9번 → 문자로 받은 URL 접속 → 건강검진 → 전년도 미수검자 검진 신청 2. 공단 홈페이지: 건강모아 → 나의 건강관리 → 국가건강검진정보 → 전년도 미수검자 추가 신청 3. 모바일 앱(건강보험25시): 건강모아 → 나의건강 → 검진신청 → 전년도 미수검자 추가 신청 [사진 2] https://senti-1000ma.github.io/blog-drafts/img/001/001_2_card.png 검진을 받은 뒤에는 결과는 검진 후 15일 이내에 우편이나 이메일로 받을 수 있고, 앱에서도 조회할 수 있어요. 고혈압·당뇨병·이상지질혈증·폐결핵·우울증 또는 조기정신증·C형간염 질환의심자라면 병·의원에서 확진검사(진료)를 받을 수 있고, 최초 1회는 본인부담이 면제돼요. 국민건강보험공단 안내(2026년)에는 이 기한이 검진 다음 연도 3월 31일까지로 되어 있어요. 예를 들어 2026년에 검진을 받았다면 2027년 3월 31일까지예요. 기존 1월 31일에서 3월 31일로 늘어났다고 공단 리플릿에 나와 있고, 2026년 1월부터 이상지질혈증과 당뇨병 당화혈색소 검사도 대상에 추가됐다고 해요. 질병관리청 건강정보 포털에는 아직 1월 31일로 적혀 있으니 헷갈리지 않게 공단 안내를 기준으로 보세요. 참고로 C형간염은 본인부담금이 생길 수 있고 별도 정산 신청이 필요하다고 안내돼 있어요. 한눈에 정리 - 대상 여부는 공단 홈페이지·앱에서 직접 조회하기 - 검진표가 없어도 1577-1000 문의, 신분증으로 검진 가능 - 놓쳤다면 전년도 미수검자 추가신청 활용하기 - 일반건강검진 기간은 매년 1월 1일~12월 31일이고, 확진검사는 다음 연도 3월 31일까지(국민건강보험공단 안내, 보건복지부 고시 제2026-6호 건강검진 실시기준) 제도는 바뀔 수 있으니 신청 전에 국민건강보험공단 공식 안내를 꼭 한 번 더 확인해 주세요. 네이버"}], "cats": {"naver": ["건강·보건", "고용·노동", "교통·모빌리티", "금융·자산조회", "민원·디지털", "복지·지원금", "세금·연금", "육아·가족", "자동차·운전", "주거·임대차"], "x_general": ["디지털·보안", "밈·유머", "방한·체류 실용", "일상 공감", "한국 제도·문화", "화제 영상·이슈", "흥미로운 사실"], "x_crypto": ["규제·정책", "기업·거래소", "보안·사고", "시장·ETF"]}, "statuses": ["선정", "작성중", "초안", "사용자확인중", "발행완료", "보류"], "profile": {"naver": {"name": "1000MA", "blog": " /* clipboard: 기존 동작 유지 — [확인 필요] 남아 있으면 확인 후 복사 */
async function writeClip(text){
 try{await navigator.clipboard.writeText(text);return true}catch(e){
  const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;top:-1000px;opacity:0";document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand("copy")}catch(_){}ta.remove();return ok}
}
async function copy(text,msg,p,needWarn,btn){
 if(needWarn&&p&&p.need>0&&!confirm(`아직 [확인 필요] 표시가 ${p.need}곳 남아 있어요. 공식 자료로 확인해 고친 뒤 발행하세요.\n그래도 복사할까요?`))return;
 const ok=await writeClip(text);done(btn,ok);toast(ok?msg:"복사에 실패했어요. 원고 상자에서 직접 선택해 복사하세요.")
}

}
/* 스마트에디터 ONE 용: text/html + text/plain ClipboardItem. 이미지 src 는 공개 HTTPS 절대 URL */
function seDoc(h){return `<html><head><meta charset="utf-8"></head><body><!--StartFragment-->${h}<!--EndFragment--></body></html>`}
async function copySE(p,btn){
 if(p.need>0&&!confirm(`아직 [확인 필요] 표시가 ${p.need}곳 남아 있어요. 공식 자료로 확인해 고친 뒤 발행하세요.\n그래도 복사할까요?`))return;
 const wt=$("#seTitle")&&$("#seTitle").checked;
 const h=(wt?`<p><span style="font-size:26px"><b>${esc(p.title)}</b></span></p><p><br></p>`:"")+p.seHtml;
 const t=(wt?p.title+"\n\n":"")+p.sePlain;
 let ok=false;
 try{
  if(!window.ClipboardItem||!navigator.clipboard||!navigator.clipboard.write)throw new Error("no ClipboardItem");
  await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([seDoc(h)],{type:"text/html"}),"text/plain":new Blob([t],{type:"text/plain"})})]);ok=true;
 }catch(e){ /* 보조: 선택 영역 복사 */
  const d=document.createElement("div");d.contentEditable="true";d.innerHTML=h;d.style.cssText="position:fixed;left:-99999px;top:0;width:700px";document.body.appendChild(d);
  const r=document.createRange();r.selectNodeContents(d);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
  try{ok=document.execCommand("copy")}catch(_){}sel.removeAllRanges();d.remove();
 }
 done(btn,ok);toast(ok?"스마트에디터용으로 복사했어요(이미지 포함). 에디터 본문에 붙여넣으세요":"복사에 실패했어요. 아래 미리보기를 드래그해 복사하세요.");
}
async function toPngBlob(b){
 if(b.type==="image/png")return b;
 const bm=await createImageBitmap(b);const c=document.createElement("canvas");c.width=bm.width;c.height=bm.height;c.getContext("2d").drawImage(bm,0,0);
 return await new Promise(r=>c.toBlob(r,"image/png"));
}
async function copyImg(m,btn){
 let ok=false;
 try{
  const pr=fetch(m.uri).then(r=>{if(!r.ok)throw new Error(r.status);return r.blob()}).then(toPngBlob);
  await navigator.clipboard.write([new ClipboardItem({"image/png":pr})]);ok=true;
 }catch(e){console.warn("copyImg",e)}
 done(btn,ok);toast(ok?`${m.label} 이미지를 복사했어요. 에디터에 붙여넣으세요`:"이미지 복사에 실패했어요(브라우저 권한·파일 열기 방식 확인). ‘다운로드’를 쓰세요.");
}
function done(btn,ok){if(!btn||!ok)return;btn.classList.add("done");const h=btn.dataset.h||btn.innerHTML;btn.dataset.h=h;btn.innerHTML=ic("check")+"복사됨";clearTimeout(btn._t);btn._t=setTimeout(()=>{btn.classList.remove("done");btn.innerHTML=h},1600)}
const markNeed = s => s.replace(/\[확인 필요[^\]]*\]/g, m => `<mark class="need">${m}</mark>`);
/* X 본문: 링크·해시태그·멘션·캐시태그 파란색, [확인 필요] 노란색 */
const XTOK = /(https?:\/\/[^\s]+)|(\[확인 필요[^\]]*\])|(?<![\p{L}\p{N}_&\/])([#＃][\p{L}\p{N}_]+|\$[A-Za-z]{2,10}\b)|(?<![\p{L}\p{N}_])(@[A-Za-z0-9_]{1,15})/gu;
function fmtTweet(s){
 let out="",last=0;
 for(const m of s.matchAll(XTOK)){
  out+=esc(s.slice(last,m.index));last=m.index+m[0].length;
  if(m[1]){let u=m[1].replace(/[.,;:!?)\]]+$/,"");const trail=m[1].slice(u.length);const d=u.replace(/^https?:\/\/(www\.)?/,"");out+=`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(d.length>28?d.slice(0,27)+"…":d)}</a>`+esc(trail)}
  else if(m[2])out+=`<mark class="need">${esc(m[2])}</mark>`;
  else out+=`<span class="ht">${esc(m[3]||m[4])}</span>`;
 }
 return out+esc(s.slice(last));
}
/* 원고 탭: 전체 텍스트 그대로(링크 축약 없음) + 해시태그·[확인 필요] 강조 */
const rawX = s => markNeed(esc(s)).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>').replace(/(^|[\s(])(#[\p{L}\p{N}_]+)/gu,'$1<span style="color:var(--xb)">$2</span>');
function gauge(n,size=20){
 const r=size/2-2,c=2*Math.PI*r,pct=Math.min(n/280,1),cls=n>280?"bad":n>260?"warn":"ok";
 const col=n>280?"#f4212e":n>260?"#ffd400":"#1d9bf0";
 return `<span class="gauge ${cls}" title="X 가중 글자수(근사)"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--tw-thread)" stroke-width="2"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="${(c*pct).toFixed(2)} ${c.toFixed(2)}"/></svg>${n}/280</span>`;
}
const lenB = n => `<span class="lenb ${n>280?"bad":n>260?"warn":""}">${n}/280</span>`;

 return L.sort(cmp);

  ${all.map(([t,k],i)=>tweetHTML(p,t,i,i===all.length-1,k)).join("")}
 </div>
 <div class="xnote">미리보기용 화면이에요. 프로필·날짜는 표시용이며 반응 수는 표시하지 않아요. 글자수 원은 X 가중치 근사값.</div>`;
}
function naverCopy(p){
 return `<div class="panel cpane">
  <div class="cbar"><button class="btn nv" id="c0">${ic("copy")}스마트에디터용 복사(이미지 포함)</button><label class="seopt"><input type="checkbox" id="seTitle"> 본문 맨 위에 제목도 넣기</label></div>
  <div class="note">네이버 스마트에디터 ONE 본문에 그대로 붙여넣기(Ctrl+V)용이에요. 소제목·굵게·표·목록·인용과 이미지(공개 주소 ${esc((DATA.base||"").replace(/^https?:\/\//,""))}img/…)가 함께 복사돼요. 제목은 에디터 제목 칸에 따로 넣는 걸 권장해요. 이미지가 안 들어오면 아래 ‘이미지 전체 다운로드’나 ‘이 이미지 복사’를 쓰세요.</div>
  <div class="cbar"><button class="btn" id="c1">${ic("copy")}평문 복사</button><button class="btn" id="c3">${ic("copy")}제목 복사</button></div>
  <div class="note">‘평문 복사’는 텍스트만 복사해요. 표는 ‘• 셀 — 셀’ 형태, 사진 자리는 ‘[사진 N] 캡션 — 이미지 주소’로 바뀌어요.</div>
  ${(p.images||[]).length?`<div class="sec"><h5>이미지 ${p.images.length}장 ${p.zip?`<a class="btn sm" id="zipA" href="${esc(p.zip)}" download>${ic("down")}이미지 전체 다운로드 (zip)</a>`:""}</h5><div class="imgs">${p.images.map((m,i)=>`<div class="imc"><div class="im" style="background-image:url('${m.uri}')"></div><div class="lb">${esc(m.label)}</div><div class="cp" title="${esc(m.alt||m.cap||"")}">${m.cap?esc(m.cap):"<span style='opacity:.6'>캡션 없음</span>"}</div><div class="ac"><button class="btn" data-ci="${i}">${ic("copy")}이 이미지 복사</button><a class="btn" href="${m.uri}" download="${esc(p.id+"_"+m.name)}">${ic("down")}다운로드</a></div></div>`).join("")}</div></div>`:""}
  ${p.seHtml?`<div class="sec"><h5>스마트에디터용 복사 미리보기 (붙여넣으면 이렇게 들어가요)</h5><div class="sebox" id="sebox">${p.seHtml}</div></div>`:""}
  <div class="sec"><h5>제목 후보</h5><div class="cands">${p.cands.map((c,i)=>`<div class="cand"><span class="no">${i+1}</span><span class="tx">${esc(c)}</span><button class="btn sm" data-t="${i}">${ic("copy")}복사</button></div>`).join("")||'<div class="note">없음</div>'}</div></div>
  <div class="sec"><h5>키워드</h5><div class="chips">${p.kw.map(k=>`<span class="chip">${esc(k)}</span>`).join("")}</div></div>
  <div class="sec"><h5>원고 (붙여넣기용 평문)</h5><pre class="raw">${markNeed(esc(p.copyAll))}</pre></div>
 </div>`;
}
function xCopy(p){
 const single=p.format==="single"||p.tweets.length===1;
 return `<div class="panel cpane">
  <div class="cbar"><button class="btn xx" id="x1">${ic("copy")}${single?"포스트 복사":"첫 트윗 복사"}</button>${single?"":`<button class="btn" id="x2">${ic("copy")}스레드 전체 복사</button>`}</div>
  ${p.ko||p.summary?`<div class="ko"><b>한국어 요약</b><br>${esc(p.ko||p.summary)}</div>`:""}
  <div class="sec"><h5>훅 후보</h5><div class="cands">${p.cands.map((c,i)=>`<div class="cand"><span class="no">${i+1}</span><span class="tx">${esc(c)}</span><button class="btn sm" data-t="${i}">${ic("copy")}복사</button></div>`).join("")||'<div class="note">없음</div>'}</div></div>
  <div class="sec"><h5>${single?"포스트":"스레드"}</h5><div style="display:flex;flex-direction:column;gap:10px">${p.tweets.map((t,i)=>`<div class="blk"><div class="bh">${single?"단일 포스트":`트윗 ${t.n}/${t.total}`}${t.need?`<span class="b need">확인 필요 ${t.need}</span>`:""}<span class="r">${lenB(t.len)}<button class="btn sm" data-tw="${i}">${ic("copy")}${single?"포스트 복사":"이 트윗 복사"}</button></span></div><pre class="raw short">${rawX(t.text)}</pre></div>`).join("")}</div></div>
  ${p.replies.length?`<div class="sec"><h5>답글용 출처 (본문 뒤에 답글로)</h5><div style="display:flex;flex-direction:column;gap:10px">${p.replies.map((r,i)=>`<div class="blk"><div class="bh">답글 ${i+1}${r.need?`<span class="b need">확인 필요 ${r.need}</span>`:""}<span class="r">${lenB(r.len)}<button class="btn sm" data-rp="${i}">${ic("copy")}답글 복사</button></span></div><pre class="raw short">${rawX(r.text)}</pre></div>`).join("")}</div></div>`:""}
 </div>`;
}
function show(id,tab){
 const p=P.find(x=>x.id===id);if(!p){location.hash="";return}
 S.tab=tab==="copy"?"copy":"preview";
 const isX=p.platform==="x";
 $("#content").innerHTML=`
  <div class="dhead"><button class="back" id="back">${ic("back")}목록</button><div class="ttl">${esc(p.title)}</div>
   <div class="tabs" role="tablist"><button data-tab="preview" class="${S.tab==="preview"?"on":""}">${ic("eye")}프리뷰</button><button data-tab="copy" class="${S.tab==="copy"?"on":""}">${ic("copy")}원고/복사</button></div></div>
  <div class="dgrid"><div id="pane">${S.tab==="preview"?(isX?xPreview(p):naverPreview(p)):(isX?xCopy(p):naverCopy(p))}</div>${infoPanel(p)}</div>`;
 $("#back").onclick=()=>{location.hash=""};
 $$(".tabs button").forEach(b=>b.onclick=()=>{location.replace("#"+p.id+(b.dataset.tab==="copy"?"/copy":""))});
 $("#mys").onchange=e=>{localStorage.setItem(stKey(p.id),e.target.value);renderSide();show(p.id,S.tab);toast("표시를 바꿨어요(이 브라우저에만 저장)")};
 if(S.tab==="copy"){
  if(isX){
   $("#x1").onclick=e=>copyTxt(p.tweets[0].text,"복사했어요",e.currentTarget);
   if($("#x2"))$("#x2").onclick=e=>copyTxt(p.plain,"스레드 전체를 복사했어요(트윗 사이 --- 구분)",e.currentTarget);
   $$("button[data-tw]").forEach(b=>b.onclick=()=>copyTxt(p.tweets[+b.dataset.tw].text,`트윗 ${+b.dataset.tw+1}을 복사했어요`,b));
   $$("button[data-rp]").forEach(b=>b.onclick=()=>copyTxt(p.replies[+b.dataset.rp].text,"답글을 복사했어요",b));
   $$("button[data-t]").forEach(b=>b.onclick=()=>copyTxt(p.cands[+b.dataset.t],"훅 후보를 복사했어요",b));
  }else{
   $("#c0").onclick=e=>copySE(p,e.currentTarget);
   $$("button[data-ci]").forEach(b=>b.onclick=()=>copyImg(p.images[+b.dataset.ci],b));
   $("#c1").onclick=e=>copy(p.copyAll,"평문을 복사했어요",p,true,e.currentTarget);
   $("#c3").onclick=e=>copy(p.title,"제목을 복사했어요",p,false,e.currentTarget);
   $$("button[data-t]").forEach(b=>b.onclick=()=>copy(p.cands[+b.dataset.t],"제목 후보를 복사했어요",p,false,b));
  }
 }
}
/* ---------- routing / chrome ---------- */
let lastWasList=true;
function route(){
 const [id,tab]=decodeURIComponent(location.hash.slice(1)).split("/");
 renderSide();
 if(id&&P.some(p=>p.id===id)){const same=!lastWasList&&$("#content .dhead");show(id,tab);if(!same)scrollTo(0,0);lastWasList=false}
 else{renderList();if(!lastWasList)requestAnimationFrame(()=>scrollTo(0,S.listY||0));lastWasList=true}
}
function closeDrawer(){document.body.classList.remove("drawer")}
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem("dash_theme",t);$("#themeBtn").innerHTML=ic(t==="dark"?"sun":"moon");$("#themeBtn").title=t==="dark"?"라이트 모드":"다크 모드"}
$("#menuBtn").innerHTML=ic("menu");$("#sIco").innerHTML=ic("search");
$("#menuBtn").onclick=()=>document.body.classList.toggle("drawer");
$("#scrim").onclick=closeDrawer;
$("#themeBtn").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
$("#themeBtn").innerHTML=ic(document.documentElement.dataset.theme==="dark"?"sun":"moon");
$("#q").oninput=e=>{S.q=e.target.value;if(location.hash){S.listY=0;location.hash=""}else renderList()};
$("#sortSel").value=S.sort;$("#sortSel").onchange=e=>{S.sort=e.target.value;go()};
$("#needOnly").onchange=e=>{S.need=e.target.checked;go()};
document.addEventListener("keydown",e=>{
 if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$("#q").focus()}
 else if(e.key==="Escape"){if(document.body.classList.contains("drawer"))closeDrawer();else if(document.activeElement===$("#q")&&S.q){$("#q").value="";S.q="";renderList()}else if(location.hash)location.hash=""}
});
$("#foot").innerHTML=`빌드 ${esc(DATA.built)} · 총 ${P.length}편<br>게시·발행은 직접 수동으로 해요.`;
window.addEventListener("hashchange",route);
route();
</script>
</body>
