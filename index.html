<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>콘텐츠 초안 대시보드 · 네이버 · X</title>
<script>(function(){try{var u=new URLSearchParams(location.search).get("theme");var t=u||localStorage.getItem("dash_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="light"}})()</script>
<style>
:root{
 --bg:#f4f6f9;--panel:#ffffff;--panel2:#f8fafc;--tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;--line:#e5e9f0;--line2:#eef1f5;
 --acc:#4f46e5;--acc-bg:#eef2ff;--nv:#03c75a;--nv-bg:#e6f9ee;--xb:#1d9bf0;--x-bg:#e8f5fd;--cr:#f7931a;--cr-bg:#fff4e5;
 --warn:#b45309;--warn-bg:#fef3c7;--ok:#047857;--ok-bg:#d1fae5;--bad:#dc2626;--bad-bg:#fee2e2;
 --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.06);--shadow-h:0 2px 4px rgba(15,23,42,.06),0 12px 28px rgba(15,23,42,.10);
 --r:14px;--side:264px;--top:64px;
 --font:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif;
 --nvfont:"Nanum Gothic","NanumGothic","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
 /* naver/x preview surfaces */
 --pv-bg:#ffffff;--pv-tx:#222;--pv-tx2:#888;--pv-line:#e8e8e8;
 --tw-bg:#ffffff;--tw-tx:#0f1419;--tw-tx2:#536471;--tw-line:#eff3f4;--tw-thread:#cfd9de;--tw-hover:#f7f9f9;
}
[data-theme=dark]{
 --bg:#0b0f17;--panel:#121826;--panel2:#171e2e;--tx:#e5e9f0;--tx2:#a3adbf;--tx3:#667085;--line:#232b3b;--line2:#1b2232;
 --acc:#818cf8;--acc-bg:#1e2246;--nv-bg:#0f2e1e;--x-bg:#0d2537;--cr-bg:#36240c;
 --warn:#fbbf24;--warn-bg:#3a2a0b;--ok:#34d399;--ok-bg:#0d2d22;--bad:#f87171;--bad-bg:#3b1414;
 --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);--shadow-h:0 2px 4px rgba(0,0,0,.35),0 12px 28px rgba(0,0,0,.4);
 --pv-bg:#1a1d22;--pv-tx:#e4e6ea;--pv-tx2:#9198a1;--pv-line:#2c3036;
 --tw-bg:#000000;--tw-tx:#e7e9ea;--tw-tx2:#71767b;--tw-line:#2f3336;--tw-thread:#333639;--tw-hover:#080808;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.6 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--xb)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
svg.f{fill:currentColor;stroke:none}
/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
aside.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:18px 14px 24px;display:flex;flex-direction:column;gap:18px;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 6px}
.brand .lg{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#03c75a);display:grid;place-items:center;color:#fff;font-size:19px;box-shadow:var(--shadow)}
.brand b{display:block;font-size:15px;line-height:1.25}
.brand small{color:var(--tx3);font-size:12px}
.grp h6{margin:0 0 6px;padding:0 8px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);font-weight:700}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:10px;text-align:left;color:var(--tx2);font-size:14px;font-weight:500}
.nav:hover{background:var(--panel2);color:var(--tx)}
.nav.on{background:var(--acc-bg);color:var(--acc);font-weight:700}
.nav .n{margin-left:auto;font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;background:var(--panel2);border-radius:99px;padding:0 8px;min-width:26px;text-align:center}
.nav.on .n{background:var(--panel);color:var(--acc)}
.nav.zero{opacity:.45}
.nav .dot{width:8px;height:8px;border-radius:50%;flex:none}
.pi{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;color:#fff;font-size:12px;font-weight:800}
.pi svg{width:12px;height:12px}
.pi.all{background:linear-gradient(135deg,#6366f1,#8b5cf6)}.pi.naver{background:var(--nv)}.pi.x{background:#0f1419}.pi.crypto{background:var(--cr)}
[data-theme=dark] .pi.x{background:#e7e9ea;color:#000}
.toggle{display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:13.5px;color:var(--tx2);cursor:pointer;border-radius:10px}
.toggle:hover{background:var(--panel2)}
.toggle input{accent-color:var(--acc);width:16px;height:16px}
.side .foot{margin-top:auto;font-size:12px;color:var(--tx3);padding:0 8px;line-height:1.6}
.scrim{display:none}
main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;height:var(--top);display:flex;align-items:center;gap:10px;padding:0 24px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(12px);-webkit-backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--line)}
.ib{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--tx2);flex:none}
.ib:hover{color:var(--tx);border-color:var(--tx3)}
#menuBtn{display:none}
.search{flex:1;max-width:640px;position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--tx3)}
.search input{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:0 44px 0 40px;font-size:14.5px;outline:none;transition:.15s}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-bg)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:11px/1 var(--font);color:var(--tx3);border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--panel2)}
.topbar .sp{flex:1}
.sel{height:40px;border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:0 10px;font-size:13.5px;color:var(--tx2)}
.content{padding:22px 24px 60px;max-width:1440px;width:100%}
/* ---------- list ---------- */
.lhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.lhead h1{margin:0;font-size:22px;letter-spacing:-.02em}
.lhead .crumb{font-size:13px;color:var(--tx3)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stat .k{font-size:12.5px;color:var(--tx3);display:flex;align-items:center;gap:6px}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;font-weight:500;color:var(--tx3);margin-left:4px}
.seg{display:none;gap:6px;overflow-x:auto;margin:-4px 0 14px;padding-bottom:2px;scrollbar-width:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 13px;font-size:13px;color:var(--tx2)}
.seg button.on{background:var(--tx);color:var(--panel);border-color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;text-align:left;padding:0;color:inherit}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-h);border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.card:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card .thumb{height:132px;background:var(--panel2) center/cover no-repeat;border-bottom:1px solid var(--line2)}
.card .thumb.tw{display:flex;flex-direction:column;justify-content:center;padding:14px 16px;background:linear-gradient(135deg,var(--x-bg),var(--panel2));font-size:13px;line-height:1.5;color:var(--tx2);white-space:pre-line;overflow:hidden}
.card .thumb.tw.crypto{background:linear-gradient(135deg,var(--cr-bg),var(--panel2))}
.card .thumb.tw span{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.card .thumb.nimg{display:grid;place-items:center;color:var(--tx3);background:linear-gradient(135deg,var(--nv-bg),var(--panel2))}
.card .thumb.nimg svg{width:30px;height:30px;stroke-width:1.5}
.card .bd{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .t{font-weight:700;font-size:15.5px;line-height:1.45;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .s{font-size:13px;color:var(--tx2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .ft{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx3);padding-top:6px;border-top:1px dashed var(--line2)}
.card .ft .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.b{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;line-height:1}
.b svg{width:11px;height:11px}
.b.naver{background:var(--nv-bg);color:#02a54b}[data-theme=dark] .b.naver{color:#4ade80}
.b.x_general{background:var(--x-bg);color:#1a8cd8}
.b.x_crypto{background:var(--cr-bg);color:#c26a00}[data-theme=dark] .b.x_crypto{color:#fbbf24}
.b.cat{background:var(--panel2);color:var(--tx2);border:1px solid var(--line);font-weight:600}
.b.st{background:var(--acc-bg);color:var(--acc)}
.b.need{background:var(--warn-bg);color:var(--warn)}
.b.ok{background:var(--ok-bg);color:var(--ok)}
.empty{text-align:center;padding:70px 20px;color:var(--tx3)}
.empty b{display:block;font-size:17px;color:var(--tx2);margin-bottom:4px}
/* ---------- detail ---------- */
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.back{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;font-size:13.5px;color:var(--tx2)}
.back:hover{color:var(--tx)}
.dhead .ttl{flex:1;min-width:200px;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx2)}
.tabs{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.tabs button{border:0;background:none;padding:7px 16px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--tx3);display:flex;align-items:center;gap:6px}
.tabs button.on{background:var(--panel);color:var(--tx);box-shadow:var(--shadow)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.info{position:sticky;top:calc(var(--top) + 18px);padding:16px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - var(--top) - 36px);overflow-y:auto}
.info h4{margin:0;font-size:13px;color:var(--tx3);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--tx3)}.kv dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;word-break:break-all}
.info select{width:100%;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:0 10px}
.note{font-size:12.5px;color:var(--tx3);line-height:1.6}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.55}
.alert.ok{background:var(--ok-bg);color:var(--ok)}
details.ex{border:1px solid var(--line);border-radius:12px;background:var(--panel2);font-size:13.5px}
details.ex summary{cursor:pointer;font-weight:700;padding:10px 12px;list-style:none;display:flex;align-items:center;gap:8px}
details.ex summary::-webkit-details-marker{display:none}
details.ex summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--tx3);border-bottom:2px solid var(--tx3);transform:rotate(45deg);transition:.15s}
details.ex[open] summary::after{transform:rotate(225deg)}
details.ex .xb{padding:0 12px 10px;overflow-x:auto}
details.ex ul{padding-left:18px;margin:6px 0}details.ex li.cb{list-style:none;margin-left:-16px}
details.ex table{border-collapse:collapse;font-size:12.5px;width:100%}
details.ex th,details.ex td{border:1px solid var(--line);padding:5px 7px;vertical-align:top;text-align:left}
details.ex a{word-break:break-all}
mark.need{background:#fde68a;color:#713f12;padding:0 3px;border-radius:4px;font-weight:700}
/* copy tab */
.cpane{padding:18px;display:flex;flex-direction:column;gap:16px}
.cbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 15px;border-radius:11px;border:1px solid var(--line);background:var(--panel);font-size:14px;font-weight:600;color:var(--tx)}
.btn:hover{border-color:var(--tx3)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.p:hover{filter:brightness(1.08)}
.btn.nv{background:var(--nv);border-color:var(--nv);color:#fff}
.btn.xx{background:var(--tx);border-color:var(--tx);color:var(--panel)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.sec h5{margin:0 0 8px;font-size:13px;color:var(--tx3);font-weight:700;display:flex;align-items:center;gap:8px}
.cands{display:flex;flex-direction:column;gap:6px}
.cand{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 8px 8px 12px;font-size:14px}
.cand .no{color:var(--tx3);font-weight:700;font-size:12px;flex:none}
.cand span.tx{flex:1;min-width:0}
.raw{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font:14px/1.75 var(--font);white-space:pre-wrap;word-break:break-word;max-height:560px;overflow:auto;margin:0}
.raw.short{max-height:none}
.blk{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.blk .bh{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--tx2)}
.blk .bh .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.blk .raw{border:0;border-radius:0;background:var(--panel)}
.lenb{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--ok-bg);color:var(--ok);font-variant-numeric:tabular-nums}
.lenb.warn{background:var(--warn-bg);color:var(--warn)}.lenb.bad{background:var(--bad-bg);color:var(--bad)}
.ko{background:var(--acc-bg);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.65}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--tx2)}
/* ---------- NAVER preview ---------- */
.nvwrap{background:var(--pv-bg);color:var(--pv-tx);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);overflow:clip}
.nv-top{display:flex;align-items:center;gap:10px;height:50px;padding:0 20px;border-bottom:1px solid var(--pv-line);font-size:14px}
.nv-top .nlogo{width:20px;height:20px;border-radius:4px;background:var(--nv);display:grid;place-items:center;color:#fff}
.nv-top .nlogo svg{width:10px;height:10px}
.nv-top b{font-weight:800}
.nv-top .bn{color:var(--pv-tx2);font-size:13px}
.nv-top .tr{margin-left:auto;display:flex;gap:14px;color:var(--pv-tx2)}
.nv-post{max-width:740px;margin:0 auto;padding:44px 28px 30px;font-family:var(--nvfont)}
.nv-cat{font-size:13px;color:var(--pv-tx2);margin-bottom:12px}
.nv-cat a{color:var(--pv-tx2);text-decoration:none}
.nv-cat a:hover{text-decoration:underline}
.nv-title{font-size:30px;line-height:1.42;font-weight:400;letter-spacing:-.02em;margin:0 0 26px;word-break:keep-all}
.nv-prof{display:flex;align-items:center;gap:10px;padding-bottom:22px;border-bottom:1px solid var(--pv-line)}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:21px;background:linear-gradient(135deg,#ffe1b5,#ffd0e0);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.av.s{width:34px;height:34px;font-size:18px}
.nv-prof .nm{font-size:14px;font-weight:700}
.nv-prof .dt{font-size:13px;color:var(--pv-tx2);margin-left:8px;font-weight:400}
.nv-prof .tr{margin-left:auto;display:flex;gap:6px}
.nv-prof .tr span{font-size:12px;border:1px solid var(--pv-line);border-radius:4px;padding:3px 8px;color:var(--pv-tx2)}
.nv-body{padding-top:34px;font-size:16px;line-height:1.9;word-break:keep-all;overflow-wrap:anywhere}
.nv-body p{margin:0 0 1.25em}
.nv-body h3{font-size:23px;line-height:1.5;font-weight:700;margin:2.2em 0 .8em;padding-bottom:10px;border-bottom:2px solid var(--pv-tx);letter-spacing:-.02em}
.nv-body h4{font-size:19px;font-weight:700;margin:1.8em 0 .6em}
.nv-body h5{font-size:16.5px;font-weight:700;margin:1.4em 0 .5em}
.nv-body ul,.nv-body ol{padding-left:1.4em;margin:0 0 1.25em}
.nv-body li{margin:.25em 0}
.nv-body li.cb{list-style:none;margin-left:-1.2em}
.nv-body blockquote{margin:1.8em 0;padding:18px 26px;text-align:center;font-size:17px;line-height:1.75;color:var(--pv-tx);position:relative;border:0;background:none}
.nv-body blockquote::before,.nv-body blockquote::after{content:"“";display:block;font:700 46px/1 Georgia,serif;color:var(--nv);height:24px}
.nv-body blockquote::after{content:"”";margin-top:12px}
.nv-body hr{border:0;margin:2.2em auto;width:60px;border-top:2px solid var(--pv-line)}
.nv-body .tw{overflow-x:auto;margin:1.4em 0}
.nv-body table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.6}
.nv-body th,.nv-body td{border:1px solid var(--pv-line);padding:9px 11px;vertical-align:top;text-align:left}
.nv-body th{background:color-mix(in srgb,var(--pv-line) 45%,transparent);font-weight:700}
.nv-body code{background:color-mix(in srgb,var(--pv-line) 60%,transparent);padding:1px 5px;border-radius:4px;font-size:.9em}
.nv-body a{color:#1e6fd9;word-break:break-all}
.nv-body figure.ph{margin:1.8em 0;text-align:center}
.nv-body figure.ph img{max-width:100%;height:auto;display:block;margin:0 auto}
.nv-body figcaption{font-size:13px;color:var(--pv-tx2);margin-top:8px}
.nv-body .ph-empty{margin:1.8em 0;aspect-ratio:16/9;max-height:380px;width:100%;background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--pv-line) 45%,transparent) 0 12px,transparent 12px 24px),color-mix(in srgb,var(--pv-line) 30%,transparent);border:1px dashed color-mix(in srgb,var(--pv-tx2) 50%,transparent);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--pv-tx2);font-size:14px;text-align:center;padding:16px;line-height:1.5}
.nv-body .ph-empty::before{content:"";width:44px;height:44px;background:currentColor;opacity:.55;-webkit-mask:var(--cam) center/contain no-repeat;mask:var(--cam) center/contain no-repeat}
.nv-body .ph-empty b{font-size:14.5px;color:var(--pv-tx)}
.nv-body .ph-empty small{font-size:12px;opacity:.8}

rize.org/prizes/about/prize-announcement-dates/", "len": 34, "need": 0}, {"text": "2026 발표 보도자료: https://www.nobelprize.org/press-release/the-2026-nobel-prize-announcements/", "len": 43, "need": 0}], "plain": "노벨상 발표 주간, 한국 시간으로 언제인지 헷갈리죠.\n\n노벨상 공식 사이트 일정을 KST로 바꿔 저장해 둠 🧵 #노벨상 (1/6)\n\n---\n\n환산 기준: CEST(UTC+2) → KST(UTC+9) = **+7시간**.\n\n공식 문구가 \"at the earliest\"(그 시각 이후)인 분야는 표기 그대로 둠. (2/6)\n\n---\n\n📅 2026 발표 (KST)\n\n· 10/5 월 생리의학 18:30~\n· 10/6 화 물리학 18:45~\n· 10/7 수 화학 18:45~ (3/6)\n\n---\n\n· 10/8 목 문학 20:00~\n· 10/9 금 평화상 18:00 (정시 안내)\n· 10/12 월 경제학 18:45~ (4/6)\n\n---\n\n생리의학·물리·화학·문학·경제는 \"earliest\", 평화는 11:00 CEST로 안내됐어요.\n\n라이브는 노벨상 공식 디지털 채널·유튜브. (5/6)\n\n---\n\n오늘(10/10) 기준으로는 생리의학~평화 발표 구간이 지났고, 경제학상은 12일(월) 남아 있어요.\n\n일정은 공식 페이지가 최종. 발표 직전 공식 사이트에서 다시 ㄱㄱ (6/6)", "copyAll": "노벨상 발표 주간, 한국 시간으로 언제인지 헷갈리죠.\n\n노벨상 공식 사이트 일정을 KST로 바꿔 저장해 둠 🧵 #노벨상 (1/6)\n\n---\n\n환산 기준: CEST(UTC+2) → KST(UTC+9) = **+7시간**.\n\n공식 문구가 \"at the earliest\"(그 시각 이후)인 분야는 표기 그대로 둠. (2/6)\n\n---\n\n📅 2026 발표 (KST)\n\n· 10/5 월 생리의학 18:30~\n· 10/6 화 물리학 18:45~\n· 10/7 수 화학 18:45~ (3/6)\n\n---\n\n· 10/8 목 문학 20:00~\n· 10/9 금 평화상 18:00 (정시 안내)\n· 10/12 월 경제학 18:45~ (4/6)\n\n---\n\n생리의학·물리·화학·문학·경제는 \"earliest\", 평화는 11:00 CEST로 안내됐어요.\n\n라이브는 노벨상 공식 디지털 채널·유튜브. (5/6)\n\n---\n\n오늘(10/10) 기준으로는 생리의학~평화 발표 구간이 지났고, 경제학상은 12일(월) 남아 있어요.\n\n일정은 공식 페이지가 최종. 발표 직전 공식 사이트에서 다시 ㄱㄱ (6/6)", "extras": [{"title": "이미지·미디어 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>트윗 3~4<\/td><td>직접 만든 KST 일정 텍스트 카드<\/td><td>공식 영상·사진은 원본 링크 인용, 첨부 금지<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 게시 전 nobelprize.org에서 시각·earliest 문구 변경 여부 확인<\/li><li class=\"cb\">☐ CEST→KST +7 환산이 서머타임 기간과 맞는지 확인(10월 CEST)<\/li><li class=\"cb\">☐ 수상자 이름·업적을 추측·단정하지 않기<\/li><li class=\"cb\">☐ 게시는 수동으로<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-10)", "html": "<div class=\"tw\"> 24·KB스타뱅킹으로 여권 재발급? 방문만 되는 경우부터 구분해요"], "cat": "민원·디지털", "kw": ["여권 재발급", "여권 수수료", "온라인 여권 신청", "외교부 여권안내"], "summary": "외교부 여권안내 기준 재발급 의미·수수료(10년 복수 58면 52,000원 등)·잔여유효기간 부여(27,000원)·온라인/방문 가능 사유를 비교표로 정리", "status": "초안", "created": "2026-10-10 18:55", "base": "2026-10-10", "need": 0, "chars": 1709, "chars_ns": 1351, "imgs": 3, "slots": 2, "filled": 2, "thumb": "img/050/050_0_thumb.png", "seHtml": "<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/050/050_0_thumb.png\" alt=\"대표 이미지\" width=\"720\"><\/p>\n<p>여권이 곧 만료되거나 페이지가 부족할 때, \"새로 10년을 받을지, 남은 기간만 이어받을지\"부터 정하면 수수료와 서류가 달라져요. 외교부 여권안내 홈페이지 기준으로 비교했어요. (2026년 10월 10일 기준)<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>재발급이란?<\/b><\/span><\/p>\n<p>외교부 안내에 따르면 재발급은 <b>예전에 여권을 한 번이라도 받은 사람<\/b>이 새 여권을 받는 경우예요. 본인 희망에 따라 ① 새 유효기간을 부여하는 재발급 ② 기존 여권의 <b>잔여 유효기간<\/b>만 부여하는 재발급을 고를 수 있습니다. 사유에는 만료·만료 전 희망 재발급, 수록정보 변경, 분실·훼손, 행정기관 착오 등이 포함됩니다.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>수수료 나란히 보기 (국내, 국제교류기여금 포함 합계)<\/b><\/span><\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>구분<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>면수·기간<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>국내 합계<\/b><\/td><\/tr><tr><td>복수여권(18세 이상, 10년)<\/td><td>58면<\/td><td>52,000원<\/td><\/tr><tr><td>복수여권(18세 이상, 10년)<\/td><td>26면<\/td><td>49,000원<\/td><\/tr><tr><td>복수여권(8세 이상~18세 미만, 5년)<\/td><td>58면 / 26면<\/td><td>44,000원 / 41,000원<\/td><\/tr><tr><td>복수여권(8세 미만, 5년)<\/td><td>58면 / 26면<\/td><td>35,000원 / 32,000원<\/td><\/tr><tr><td>단수여권(1년 이내)<\/td><td>-<\/td><td>17,000원<\/td><\/tr><tr><td>남은 유효기간 부여<\/td><td>58면·26면 선택<\/td><td><b>27,000원<\/b><\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/050/050_1_card.png\" alt=\"국내 수수료(합계)\" width=\"720\"><\/p>\n<p>잔여유효기간 부여는 유효기간이 남은 여권을 수록정보 변경·분실·훼손·면수 부족 등으로 바꿀 때, 남은 기간만큼만 주는 방식이라고 수수료 안내 주석에 설명되어 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>온라인 vs 방문<\/b><\/span><\/p>\n<ul><li><b>온라인 가능(국내)<\/b>: 정부24, KB스타뱅킹 등. 기존 전자여권 발급 이력이 있는 경우 등으로 안내되며, 18세 미만 온라인은 정부24·재외동포365 등(KB는 준비중으로 안내).<\/li><li><b>방문만<\/b>: 수록정보 정정·변경, 분실·훼손, 행정기관 착오에 의한 재발급은 온라인 불가.<\/li><li>수령·신청은 원칙적으로 <b>본인 방문<\/b>. 대리신청은 미성년·질병·장애·의전상 필요 등 예외에 한합니다.<\/li><\/ul>\n<p>기본 구비는 신청서, 여권용 사진(6개월 이내) 1매, 신분증, 기존 여권(유효기간 남은 경우) 등이며, 가족관계 서류는 행정정보 공동이용으로 확인되면 제출을 생략할 수 있다고 안내됩니다.<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/050/050_2_card.png\" alt=\"온라인·방문 구분\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>사진·수령·문의<\/b><\/span><\/p>\n<p>여권용 사진은 6개월 이내 촬영분 1매가 기본이에요. 온라인으로 신청하더라도 수령은 지정한 여권사무 대행기관 등에서 본인이 받는 구조로 안내됩니다. 급하면 공항 여권민원실 운영 시간을 확인할 수 있어요. 인천공항 제1터미널은 법정공휴일 휴무, 제2터미널·김해공항 확충터미널은 365일 등으로 외교부가 안내합니다(시간은 변경될 수 있음).<\/p>\n<p>수수료 표의 합계에는 국제교류기여금이 포함된 항목이 있어요. 18세 이상이 복수여권을 신청하면 유효기간 10년으로 발급되고 기간 선택은 불가하다고 여권법 시행령 안내가 있습니다. 잔여유효기간 부여는 수수료가 낮지만, 여행 계획상 긴 유효기간이 필요하면 신규 유효기간 재발급이 맞는지 먼저 따져 보세요.<\/p>\n<p>민원 상담은 영사콜센터(02-3210-0404) 등으로 안내되며, 최종 금액·서류는 신청 직전 외교부 여권안내·정부24 화면이 기준입니다.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>재발급 = 과거 발급 이력 있는 사람의 새 여권(신규 유효기간 또는 잔여기간)<\/li><li>18세 이상 10년 복수 58면 국내 52,000원 / 잔여기간 부여 27,000원<\/li><li>분실·훼손·수록정보 변경은 방문 신청<\/li><li>수수료·메뉴는 바뀔 수 있으니 신청 전 외교부 여권안내·정부24를 다시 확인하세요<\/li><\/ul>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/050/050_0_thumb.png\n\n여권이 곧 만료되거나 페이지가 부족할 때, \"새로 10년을 받을지, 남은 기간만 이어받을지\"부터 정하면 수수료와 서류가 달라져요. 외교부 여권안내 홈페이지 기준으로 비교했어요. (2026년 10월 10일 기준)\n\n재발급이란?\n\n외교부 안내에 따르면 재발급은 예전에 여권을 한 번이라도 받은 사람이 새 여권을 받는 경우예요. 본인 희망에 따라 ① 새 유효기간을 부여하는 재발급 ② 기존 여권의 잔여 유효기간만 부여하는 재발급을 고를 수 있습니다. 사유에는 만료·만료 전 희망 재발급, 수록정보 변경, 분실·훼손, 행정기관 착오 등이 포함됩니다.\n\n수수료 나란히 보기 (국내, 국제교류기여금 포함 합계)\n\n• 복수여권(18세 이상, 10년) — 면수·기간: 58면 / 국내 합계: 52,000원\n• 복수여권(18세 ng", "abs": "https://senti-1000ma.github.io/blog-drafts/img/050/050_2_card.png", "cap": "", "alt": "온라인·방문 구분", "name": "050_2_card.png", "w": 1080, "h": 878}], "zip": "img/050/050_images.zip", "html": "<figure class=\"ph thumbfig\" data-n=\"0\"><img src=\"img/050/050_0_thumb.png\" alt=\"대표 이미지\"><\/figure>\n<p>여권이 곧 만료되거나 페이지가 부족할 때, \"새로 10년을 받을지, 남은 기간만 이어받을지\"부터 정하면 수수료와 서류가 달라져요. 외교부 여권안내 홈페이지 기준으로 비교했어요. (2026년 10월 10일 기준)<\/p>\n<h3>재발급이란?<\/h3>\n<p>외교부 안내에 따르면 재발급은 <strong>예전에 여권을 한 번이라도 받은 사람<\/strong>이 새 여권을 받는 경우예요. 본인 희망에 따라 ① 새 유효기간을 부여하는 재발급 ② 기존 여권의 <strong>잔여 유효기간<\/strong>만 부여하는 재발급을 고를 수 있습니다. 사유에는 만료·만료 전 희망 재발급, 수록정보 변경, 분실·훼손, 행정기관 착오 등이 포함됩니다.<\/p>\n<h3>수수료 나란히 보기 (국내, 국제교류기여금 포함 합계)<\/h3>\n<div class=\"tw\"><table><thead><tr><th>구분<\/th><th>면수·기간<\/th><th>국내 합계<\/th><\/tr><\/thead><tbody><tr><td>복수여권(18세 이상, 10년)<\/td><td>58면<\/td><td>52,000원<\/td><\/tr><tr><td>복수여권(18세 이상, 10년)<\/td><td>26면<\/td><td>49,000원<\/td><\/tr><tr><td>복수여권(8세 이상~18세 미만, 5년)<\/td><td>58면 / 26면<\/td><td>44,000원 / 41,000원<\/td><\/tr><tr><td>복수여권(8세 미만, 5년)<\/td><td>58면 / 26면<\/td><td>35,000원 / 32,000원<\/td><\/tr><tr><td>단수여권(1년 이내)<\/td><td>-<\/td><td>17,000원<\/td><\/tr><tr><td>남은 유효기간 부여<\/td><td>58면·26면 선택<\/td><td><strong>27,000원<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<figure class=\"ph\" data-n=\"1\"><img loading=\"lazy\" src=\"img/050/050_1_card.png\" alt=\"국내 수수료(합계)\"><\/figure>\n<p>잔여유효기간 부여는 유효기간이 남은 여권을 수록정보 변경·분실·훼손·면수 부족 등으로 바꿀 때, 남은 기간만큼만 주는 방식이라고 수수료 안내 주석에 설명되어 있어요.<\/p>\n<h3>온라인 vs 방문<\/h3>\n<ul><li><strong>온라인 가능(국내)<\/strong>: 정부24, KB스타뱅킹 등. 기존 전자여권 발급 이력이 있는 경우 등으로 안내되며, 18세 미만 온라인은 정부24·재외동포365 등(KB는 준비중으로 안내).<\/li><li><strong>방문만<\/strong>: 수록정보 정정·변경, 분실·훼손, 행정기관 착오에 의한 재발급은 온라인 불가.<\/li><li>수령·신청은 원칙적으로 <strong>본인 방문<\/strong>. 대리신청은 미성년·질병·장애·의전상 필요 등 예외에 한합니다.<\/li><\/ul>\n<p>기본 구비는 신청서, 여권용 사진(6개월 이내) 1매, 신분증, 기존 여권(유효기간 남은 경우) 등이며, 가족관계 서류는 행정정보 공동이용으로 확인되면 제출을 생략할 수 있다고 안내됩니다.<\/p>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/050/050_2_card.png\" alt=\"온라인·방문 구분\"><\/figure>\n<h3>사진·수령·문의<\/h3>\n<p>여권용 사진은 6개월 이내 촬영분 1매가 기본이에요. 온라인으로 신청하더라도 수령은 지정한 여권사무 대행기관 등에서 본인이 받는 구조로 안내됩니다. 급하면 공항 여권민원실 운영 시간을 확인할 수 있어요. 인천공항 제1터미널은 법정공휴일 휴무, 제2터미널·김해공항 확충터미널은 365일 등으로 외교부가 안내합니다(시간은 변경될 수 있음).<\/p>\n<p>수수료 표의 합계에는 국제교류기여금이 포함된 항목이 있어요. 18세 이상이 복수여권을 신청하면 유효기간 10년으로 발급되고 기간 선택은 불가하다고 여권법 시행령 안내가 있습니다. 잔여유효기간 부여는 수수료가 낮지만, 여행 계획상 긴 유효기간이 필요하면 신규 유효기간 재발급이 맞는지 먼저 따져 보세요.<\/p>\n<p>민원 상담은 영사콜센터(02-3210-0404) 등으로 안내되며, 최종 금액·서류는 신청 직전 외교부 여권안내·정부24 화면이 기준입니다.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>재발급 = 과거 발급 이력 있는 사람의 새 여권(신규 유효기간 또는 잔여기간)<\/li><li>18세 이상 10년 복수 58면 국내 52,000원 / 잔여기간 부여 27,000원<\/li><li>분실·훼손·수록정보 변경은 방문 신청<\/li><li>수수료·메뉴는 바뀔 수 있으니 신청 전 외교부 여권안내·정부24를 다시 확인하세요<\/li><\/ul>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-10): 대표 썸네일 · 사진 1 자체 제작 카드 · 사진 2 자체 제작 카드 — 파일 images/posts/050/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>수수료 표 아래<\/td><td>수수료 비교 카드<\/td><td>개인 여권·QR·신청 화면 캡처 금지<\/td><\/tr><tr><td>온라인/방문 절 아래<\/td><td>신청 경로 구분 카드<\/td><td><\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 신규 10년 vs 잔여기간 부여 중 선택(수수료·여행 일정)<\/li><li class=\"cb\">☐ 분실·훼손·성명 변경이면 방문 예약·필요 서류 확인<\/li><li class=\"cb\">☐ 온라인 신청 가능 여부(전자여권 이력·나이)를 정부24에서 확인<\/li><li class=\"cb\">☐ 사진 규격·6개월 이내 촬영 여부<\/li><li class=\"cb\">☐ 발행 전 passport.go.kr 수수료표 변경 여부 확인<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-10)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>재발급 정의·사유·온라인/방문·구비서류·연령별 수수료 표<\/td><td>외교부 여권안내 재발급 <a href=\"https://www.passport.go.kr/home/kor/contents.do?menuPos=6\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.passport.go.kr/home/kor/contents.do?menuPos=6<\/a><\/td><td>공식<\/td><\/tr><tr><td>수수료 합계·잔여유효기간 부여 27,000원·주석<\/td><td>외 n수수료 표의 합계에는 국제교류기여금이 포함된 항목이 있어요. 18세 이상이 복수여권을 신청하면 유효기간 10년으로 발급되고 기간 선택은 불가하다고 여권법 시행령 안내가 있습니다. 잔여유효기간 부여는 수수료가 낮지만, 여행 계획상 긴 유효기간이 필요하면 신규 유효기간 재발급이 맞는지 먼저 따져 보세요.\n\n민원 상담은 영사콜센터(02-3210-0404) 등으로 안내되며, 최종 금액·서류는 신청 직전 외교부 여권안내·정부24 화면이 기준입니다.\n\n한눈에 정리\n\n- 재발급 = 과거 발급 이력 있는 사람의 새 여권(신규 유효기간 또는 잔여기간)\n- 18세 이상 10년 복수 58면 국내 52,000원 / 잔여기간 부여 27,000원\n- 분실·훼손·수록정보 변경은 방문 신청\n- 수수료·메뉴는 바뀔 수 있으니 신청 전 외교부 여권안내·정부24를 다시 확인하세요", "copyAll": "여권이 곧 만료되거나 페이지가 부족할 때, \"새로 10년을 받을지, 남은 기간만 이어받을지\"부터 정하면 수수료와 서류가 달라져요. 외교부 여권안내 홈페이지 기준으로 비교했어요. (2026년 10월 10일 기준)\n\n재발급이란?\n\n외교부 안내에 따르면 재발급은 예전에 여권을 한 번이라도 받은 사람이 새 여권을 받는 경우예요. 본인 희망에 따라 ① 새 유효기간을 부여하는 재발급 ② 기존 여권의 잔여 유효기간만 부여하는 재발급을 고를 수 있습니다. 사유에는 만료·만료 전 희망 재발급, 수록정보 변경, 분실·훼손, 행정기관 착오 등이 포함됩니다.\n\n수수료 나란히 보기 (국내, 국제교류기여금 포함 합계)\n\n• 복수여권(18세 이상, 10년) — 면수·기간: 58면 / 국내 합계: 52,000원\n• 복수여권(18세 이상, 10년) — 면수·기간: 26면 / 국내 합계: 49,000원\n• 복수여권(8세 이상~18세 미만, 5년) — 면수·기간: 58면 / 26면 / 국내 합계: 44,000원 / 41,000원\n• 복수여권(8세 미만, 5년) — 면수·기간: 58면 / 26면 / 국내 합계: 35,000원 / 32,000원\n• 단수여권(1년 이내) — 면수·기간: - / 국내 합계: 17,000원\n• 남은 유효기간 부여 — 면수·기간: 58면·26면 선택 / 국내 합계: **27,000원**\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/050/050_1_card.png\n\n잔여유효기간 부여는 유효기간이 남은 여권을 수록정보 변경·분실·훼손·면수 부족 등으로 바꿀 때, 남은 기간만큼만 주는 방식이라고 수수료 안내 주석에 설명되어 있어요.\n\n온라인 vs 방문\n\n- 온라인 가능(국내): 정부24, KB스타뱅킹 등. 기존 전자여권 발급 이력이 있는 경우 등으로 안내되며, 18세 미만 온라인은 정부24·재외동포365 등(KB는 준비중으로 안내).\n- 방문만: 수록정보 정정·변경, 분실·훼손, 행정기관 착오에 의한 재발급은 온라인 불가.\n- 수령·신청은 원칙적으로 본인 방문. 대리신청은 미성년·질병·장애·의전상 필요 등 예외에 한합니다.\n\n기본 구비는 신청서, 여권용 사진(6개월 이내) 1매, 신분증, 기존 여권(유효기간 남은 경우) 등이며, 가족관계 서류는 행정정보 공동이용으로 확인되면 제출을 생략할 수 있다고 안내됩니다.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/050/050_2_card.png\n\n사진·수령·문의\n\n여권용 사진은 6개월 이내 촬영분 1매가 기본이에요. 온라인으로 신청하더라도 수령은 지정한 여권사무 대행기관 등에서 본인이 받는 구조로 안내됩니다. 급하면 공항 여권민원실 운영 시간을 확인할 수 있어요. 인천공항 제1터미널은 법정공휴일 휴무, 제2터미널·김해공항 확충터미널은 365일 등으로 외교부가 안내합니다(시간은 변경될 수 있음).\n\n수수료 표의 합계에는 국제교류기여금이 포함된 항목이 있어요. 18세 이상이 복수여권을 신청하면 유효기간 10년으로 발급되고 기간 선택은 불  근로소득<\/td><td>2027.3.1.~3.15.<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p>근로소득만 있는 사람은 반기·정기 중 선택할 수 있고, 사업·종교인 소득이 있으면 정기신청을 해야 한다고 안내되어 있어요.<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/049/049_1_card.png\" alt=\"기한 후 신청 핵심\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>기한 후에 신청하면 얼마나 받나요?<\/b><\/span><\/p>\n<p>국세청 「심사 및 지급」 표에 따르면 <b>기한 후 신청한 경우 해당 장려금의 95%<\/b>가 지급됩니다. 기한 후 신청분은 <b>신청일로부터 4개월 이내<\/b> 지급이라고 명시되어 있어요. (정기신청분은 9월 말까지 지급)<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>어디서 신청하나요?<\/b><\/span><\/p>\n<p>서비스 이용시간은 6:00~24:00으로 안내됩니다.<\/p>\n<ol><li><b>홈택스(PC·모바일)<\/b>: 장려금·연말정산·전자기부금 → 근로·자녀장려금 → 신청하기. 안내문을 받지 않았다면 본인인증 후 직접입력신청 경로를 씁니다.<\/li><li><b>ARS<\/b>: 1544-9944 (안내문의 개별인증번호 등)<\/li><li><b>QR·모바일 안내문<\/b>, 신청대리(상담센터·세무서, 평일 9~18시) 등<\/li><\/ol>\n<p>근로장려금과 자녀장려금은 요건이 맞으면 함께 신청하는 구조로 안내됩니다. 정확한 소득·재산 요건·최대 지급액은 해마다 공지되므로, 이 글에서는 금액 상한을 단정하지 않고 <b>홈택스·국세청 안내에서 확인<\/b>하도록 안내해요.<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/049/049_2_card.png\" alt=\"신청 경로\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>정기와 반기를 헷갈리지 않기<\/b><\/span><\/p>\n<p>기한 후 신청은 <b>정기신청을 놓친 사람<\/b>을 위한 창구예요. 이미 반기신청을 한 근로소득자라면 반기 일정·정산 규칙을 따로 봐야 하고, 사업·종교인 소득이 있으면 정기 쪽으로 안내됩니다. 국세청은 상반기 반기를 신청하면 하반도 신청한 것으로 본다는 점도 명시하고 있어요.<\/p>\n<p>신청 전에는 홈택스에서 소득·재산 자료를 확인하세요. 안내문을 받지 못했다고 자격이 없는 것은 아닐 수 있어, 직접입력신청으로 요건을 조회해 보는 경로가 안내되어 있습니다. 허위로 신청하면 지급액 환수와 가산세, 일정 기간 지급 제한이 있을 수 있어요. 체납이 있으면 환급금 일부가 충당될 수 있다는 점도 국세청 표에 나옵니다.<\/p>\n<p>최대 지급액·소득 기준은 연도마다 달라지므로, 이 글의 숫자는 <b>기간·95%·4개월<\/b>처럼 국세청이 명시한 절차 정보에 한정했어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>정기 미신청 → 기한 후: 2026.6.2.~12.1.<\/li><li>기한 후: 산정액의 95%, 신청일부터 4개월 이내 지급<\/li><li>홈택스·ARS·안내문 QR 등, 이용시간 6~24시<\/li><li>자격·금액은 바뀌므로 신청 직전 국세청·홈택스 공지를 다시 확인하세요<\/li><\/ul>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/049/049_0_thumb.png\n\n5월 정기신청 기간을 지나버렸다면, 아직 기한 후 신청 창구가 열려 있는지부터 보면 돼요. 국세청 안내에 맞춰 기간·감액·신청 경로만 정리했어요. (2026년 10월 10일 기준)\n\n신청 기간부터 맞춰 보기\n\n국세청 「신청기간 및 방법」 기준입니다.\n\n• 정기신청 — 산정 대상: 2025년 연간 소득 / 신청 시기: 2026.5.1.~6.1.\n• 기한 후 신청 — 산정 대상: (정기 미신청분) / 신청 시기: **2026.6.2.~12.1.**\n• 반기(상반기) — 산정 대상: 2026년 상반기 근로소득 / 신청 시기: 2026.9.1.~9.15.\n• 반기(하반기) — 산정 대상: 2026년 하반기 근로소득 / 신청 시기: 2027.3.1.~3.15.\n\n근로소득만 있는 사람은 반기·정기 중 선택할 수 있고, 사업·종교인 소득이 있으면 정기신청을 해야 한다고 안내되어 있어요.\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/049/049_1_card.png\n\n기한 후에 신청하면 얼마나 받나요?\n\n국세청 「심사 및 지급」 표에 따르면 기한 후 신청한 경우 해당 장려금의 95%가 지급됩니다. 기한 후 신청분은 신청일로부터 4개월 이내 지급이라고 명시되어 있어요. (정기신청분은 9월 말까지 지급)\n\n어디서 신청하나요?\n\n서비스 이용시간은 6:00~24:00으로 안내됩니다.\n\n1. 홈택스(PC·모바일): 장려금·연말정산·전자기부금 → 근로·자녀장려금 → 신청하기. 안내문을 받지 않았다면 본인인증 후 직접입력신청 경로를 씁니다.\n2. ARS: 1544-9944 (안내문의 개별인증번호 등)\n3. QR·모바일 안내문, 신청대리(상담센터·세무서, 평일 9~18시) 등\n\n근로장려금과 자녀장려금은 요건이 맞으면 함께 신청하는 구조로 안내됩니다. 정확한 소득·재산 요건·최대 지급액은 해마다 공지되므로, 이 글에서는 금액 상한을 단정하지 않고 홈택스·국세청 안내에서 확인하도록 안내해요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/049/049_2_card.png\n\n정기와 반기를 헷갈리지 않기\n\n기한 후 신청은 정기신청을 놓친 사람을 위한 창구예요. 이미 반기신청을 한 근로소득자라면 반기 일정·정산 규칙을 따로 봐야 하고, 사업·종교인 소득이 있으면 정기 쪽으로 안내됩니다. 국세청은 상반기 반기를 신청하면 하반도 신청한 것으로 본다는 점도 명시하고 있어요.\n\n신청 전에는 홈택스에서 소득·재산 자료를 확인하세요. 안내문을 받지 못했다고 자격이 없는 것은 아닐 수 있어, 직접입력신청으로 요건을 조회해 보는 경로가 안내되어 있습니다. 허위로 신청하면 지급액 환수와 가산세, 일정 기간 지급 제한이 있을 수 있어요. 체납이 있으면 환급금 일부가 충당될 수 있다는 점도 국세청 표에 나옵니다.\n\n최대 지급액·소득 기준은 연도마다 달라지므로, 이 글의 숫자는 기간·95%·4개월처럼 국세청이 명시한 절차 정보에 한정했어요.\n\n한눈에 정리\n\n- 정기 미신청 → 기한 후: 2026.6.2.~12.1.\n- 기한 후: 산정액의 95%, 신청일부터 4개월 이내 지급\n- 홈택스·ARS·안내문 QR 등, 이용시간 6~24시\n- 자격·금액은 바뀌므로 신청 직전 국세청·홈택스 공지를 다시 확인하세요", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/049/049_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/049/049_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "049_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/049/049_1_card.png", "abs": "https://senti-1000m zy\" src=\"img/049/049_2_card.png\" alt=\"신청 경로\"><\/figure>\n<h3>정기와 반기를 헷갈리지 않기<\/h3>\n<p>기한 후 신청은 <strong>정기신청을 놓친 사람<\/strong>을 위한 창구예요. 이미 반기신청을 한 근로소득자라면 반기 일정·정산 규칙을 따로 봐야 하고, 사업·종교인 소득이 있으면 정기 쪽으로 안내됩니다. 국세청은 상반기 반기를 신청하면 하반도 신청한 것으로 본다는 점도 명시하고 있어요.<\/p>\n<p>신청 전에는 홈택스에서 소득·재산 자료를 확인하세요. 안내문을 받지 못했다고 자격이 없는 것은 아닐 수 있어, 직접입력신청으로 요건을 조회해 보는 경로가 안내되어 있습니다. 허위로 신청하면 지급액 환수와 가산세, 일정 기간 지급 제한이 있을 수 있어요. 체납이 있으면 환급금 일부가 충당될 수 있다는 점도 국세청 표에 나옵니다.<\/p>\n<p>최대 지급액·소득 기준은 연도마다 달라지므로, 이 글의 숫자는 <strong>기간·95%·4개월<\/strong>처럼 국세청이 명시한 절차 정보에 한정했어요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>정기 미신청 → 기한 후: 2026.6.2.~12.1.<\/li><li>기한 후: 산정액의 95%, 신청일부터 4개월 이내 지급<\/li><li>홈택스·ARS·안내문 QR 등, 이용시간 6~24시<\/li><li>자격·금액은 바뀌므로 신청 직전 국세청·홈택스 공지를 다시 확인하세요<\/li><\/ul>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-10): 대표 썸네일 · 사진 1 자체 제작 카드 · 사진 2 자체 제작 카드 — 파일 images/posts/049/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>기간 표 아래<\/td><td>기한 후 95%·4개월 카드<\/td><td>홈택스 로그인 화면 캡처 금지(빈 화면·차단 흔함)<\/td><\/tr><tr><td>신청 경로 아래<\/td><td>경로 요약 카드<\/td><td><\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 오늘 날짜가 2026-12-01 이전인지, 정기 미신청 상태인지 확인<\/li><li class=\"cb\">☐ 홈택스에서 본인 소득·재산 요건·예상액 조회 후 신청<\/li><li class=\"cb\">☐ 환급계좌·연락처 등록, 체납 시 환급금 일부 충당 안내 인지<\/li><li class=\"cb\">☐ 반기신청과 중복·정산 구조를 본인 소득 유형에 맞게 확인<\/li><li class=\"cb\">☐ 허위 신청 시 환수·지급제한 안내 확인<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-10)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>정기·반기·기한 후(6.2~12.1) 신청기간, 홈택스·ARS 방법<\/td><td>국세청 신청기간 및 방법 <a href=\"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=238977&amp;mi=40397\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=238977&amp;mi=40397<\/a><\/td><td>공식<\/td><\/tr><tr><td>기한 후 95% 지급, 신청일부터 4개월 이내, 정기 9월 말<\/td><td>국세청 심사 및 지급 <a href=\"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7784&amp;mi=2453\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7784&amp;mi=2453<\/a><\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 10일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "5월 정기신청 기간을 지나버렸다면, 아직 기한 후 신청 창구가 열려 있는지부터 보면 돼요. 국세청 안내에 맞춰 기간·감액·신청 경로만 정리했어요. (2026년 10월 10일 기준)\n\n신청 기간부터 맞춰 보기\n\n국세청 「신청기간 및 방법」 기준입니다.\n\n• 정기신청 — 산정 대상: 2025년 연간 소득 / 신청 시기: 2026.5.1.~6.1.\n• 기한 후 신청 — 산정 대상: (정기 미신청분) / 신청 시기: **2026.6.2.~12.1.**\n• 반기(상반기) — 산정 대상: 2026년 상반기 근로소득 / 신청 시기: 2026.9.1.~9.15.\n• 반기(하반기) — 산정 대상: 2026년 하반기 근로소득 / 신청 시기: 2027.3.1.~3.15.\n\n근로소득만 있는 사람은 반기·정기 중 선택할 수 있고, 사업·종교인 소득이 있으면 정기신청을 해야 한다고 안내되어 있어요.\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/049/049_1_card.png\n\n기한 후에 신청하면 얼마나 받나요?\n\n국세청 「심사 및 지급」 표에 따르면 기한 후 신청한 경우 해당 장려금의 95%가 지급됩니다. 기한 후 신청분은 신청일로부터 4개월 이내 지급이라고 명시되어 있어요. (정기신청분은 9월 말까지 지급)\n\n어디서 신청하나요?\n\n서비스 이용시간은 6:00~24:00으로 안내됩니다.\n\n1. 홈택스(PC·모바일): 장려금·연말정산·전자기부금 → 근로·자녀장려금 → 신청하기. 안내문을 받지 않았다면 본인인증 후 직접입력신청 경로를 씁니다.\n2. ARS: 1544-9944 (안내문의 개별인증번호 등)\n3. QR·모바일 안내문, 신청대리(상담센터·세무서, 평일 9~18시) 등\n\n근로장려금과 자녀장려금은 요건이 맞으면 함께 신청하는 구조로 안내됩니다. 정확한 소득·재산 요건·최대 지급액은 해마다 공지되므로, 이 글에서는 금액 상한을 단정하지 않고 홈택스·국세청 안내에서 확인하도록 안내해요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/049/049_2_card.png\n\n정기와 반기를 헷갈리지 않기\n\n기한 후 신청은 정기신청을 놓친 사람을 위한 창구예요. 이미 반기신청을 한 근로소득자라면 반기 일정·정산 규칙을 따로 봐야 하고, 사업·종교인 소득이 있으면 정기 쪽으로 안내됩니다. 국세청은 상반기 반기를 신청하면 하반도 신청한 것으로 본다는 점도 명시하고 있어요.\n\n신청 전에는 홈택스에서 소득·재산 자료를 확인하세요. 안내문을 받지 못했다고 자격이 없는 것은 아닐 수 있어, 직접입력신청으로 요건을 조회해 보는 경로가 안내되어 있습니다. 허위로 신청하면 지급액 환수와 가산세, 일정 기간 지급 제한이 있을 수 있어요. 체납이 있으면 환급금 일부가 충당될 수 있다는 점도 국세청 표에 나옵니다.\n\n최대 지급액·소득 기준은 연도마다 달라지므로, 이 글의 숫자는 기간·95%·4개월처럼 국세청이 명시한 절차 정보에 한정했어요.\n\n한눈에 정리\n\n- 정기 미신청 → 기한 후: 2026.6.2.~12.1.\n- 기한 후: 산정액의 95%, 신청일부터 4개월 이내 지급\n- 홈택스·ARS·안내문 QR 등, 이용시간 6~24시\n- 자격·금액은 바뀌므로 신청 직전 국세청·홈택스 공지를 다시 확인하세요", "copyAll": "5월 정기신청 기간을 지나버렸다면, 아직 기한 후 신청 창구가 열려 있는지부터 보면 돼요. 국세청 안내에 맞춰 기간·감액·신청 경로만 정리했어요. (2026년 10월 10일 기준)\n\n신청 기간부터 맞춰 보기\n\n국세청 「신청기간 및 방법」 기준입니다.\n\n• 정기신청 — 산정 대상: 2025년 연간 소득 / 신청 시기: 2026.5.1.~6.1.\n• 기한 후 신청 — 산정 대상: (정기 미신청분) / 신청 시기: **2026.6.2.~12.1.**\n• 반기(상반기) — 산정 대상: 2026년 상반기 근로소득 / 신청 시기: 2026.9.1.~9.15.\n• 반기(하반기) — 산정 대상: 2026년 하반기 근로소득 / 신청 시기: 2027.3.1.~3.15.\n\n근로소득만 있는 사람은 반기·정기 중 선택할 수 있고, 사업·종교인 소득이 있으면 정기신청을 해야 한다고 안내되어 있어요.\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/049/049_1_card.png\n\n기한 후에 신청하면 얼마나 받나요?\n\n국세청 「심사 및 지급」 표에 따르면 기한 후 신청한 경우 해당 장려금의 95%가 지급됩니다. 기한 후 신청분은 신청일로부터 4개월 이내 지급이라고 명시되어 있어요. (정기신청분은 9월 말까지 지급)\n\n어디서 신청하나요?\n\n서비스 이용시간은 6:00~24:00으로 안내됩니다.\n\n1. 홈택스(PC·모바일): 장려금·연말정산·전자기부금 → 근로·자녀장려금 → 신청하기. 안내문을 받지 않았다면 본인인증 후 직접입력신청 경로를 씁니다.\n2. ARS: 1544-9944 (안내문의 개별인증번호 등)\n3. QR·모바일 안내문, 신청대리(상담센터·세무서, 평일 9~18시) 등\n\n근로장려금과 자녀장려금은 요건이 맞으면 함께 신청하는 구조로 안내됩니다. 정확한 소득·재산 요건·최대 지급액은 해마다 공지되므로, 이 글에서는 금액 상한을 단정하지 않고 홈택스·국세청 안내에서 확인하도록 안내해요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/049/049_2_card.png\n\n정기와 반기를 헷갈리지 않기\n\n기한 후 신청은 정기신청을 놓친 사람을 위한 창구예요. 이미 반기신청을 한 근로소득자라면 반기 일정·정산 규칙을 따로 봐야 하고, 사업·종교인 소득이 있으면 정기 쪽으로 안내됩니다. 국세청은 상반기 반기를 신청하면 하반도 신청한 것으로 본다는 점도 명시하고 있어요.\n\n신청 전에는 홈택스에서 소득·재산 자료를 확인하세요. 안내문을 받지 못했다고 자격이 없는 것은 아닐 수 있어, 직접입력신청으로 요건을 조회해 보는 경로가 안내되어 있습니다. 허위로 신청하면 지급액 환수와 가산세, 일정 기간 지급 제한이 있을 수 있어요. 체납이 있으면 환급금 일부가 충당될 수 있다는 점도 국세청 표에 나옵니다.\n\n최대 지급액·소득 기준은 연도마다 달라지므로, 이 글의 숫자는 기간·95%·4개월처럼 국세청이 명시한 절차 정보에 한정했어요.\n\n한눈에 정리\n\n- 정기 미신청 → 기한 후: 2026.6.2.~12.1.\n- 기한 후: 산정액의 95%, 신청일부터 4개월 이내 지급\n- 홈택스·ARS·안내문 QR 등, 이용시간 6~24시\n- 자격·금액은 바뀌므로 신청 직전 국세청·홈택스 공지를 다시 확인하세요", "search": "049 근로·자녀장려금 정기신청 놓쳤다면? 기한 후 신청은 12월 1일 =\"연말 사용 체크\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>자동재충전을 놓쳤다면<\/b><\/span><\/p>\n<p>문화누리 공지에 따르면 2026년에는 전년도에 일정 금액 이상 사용하고 자격을 유지한 경우 자동재충전 대상이 될 수 있어요. 자동재충전이 되지 않았더라도 자격만 되면 11월 30일까지 주민센터·누리집·앱·전화로 신규발급·재충전이 가능하다고 안내되어 있습니다. 주소지 시·군·구 예산이 소진되면 조기 마감될 수 있으니, 아직 카드가 없다면 서두르는 편이 좋아요.<\/p>\n<p>사용처가 맞는지 헷갈리면 결제 전에 누리집·앱의 가맹점 조회를 이용하는 것이 안전해요. 가맹점이 아닌 곳에서 결제하거나, 연말에 취소·환불이 늦어 잔액이 기한 밖으로 돌아오는 경우가 가장 아쉬운 실수예요. 공연·숙박·교통처럼 이용일이 내년인 예약도, 취소 시점이 내년이면 지원금 사용이 어려울 수 있다는 안내가 있으니 예약 전 환불 규정을 확인하세요.<\/p>\n<p>지원금은 문화·관광·체육 가맹점에서만 의미가 있어요. 일상 장보기나 일반 온라인 쇼핑몰 전 품목이 되는 것은 아니므로, 결제 전 가맹점 여부를 확인하는 습관이 필요합니다.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>2026년 기본 15만 원(+생애주기 1만 원 가능)<\/li><li>발급·재충전: 2월 2일~11월 30일(예산 소진 시 조기 마감)<\/li><li>사용: 12월 31일까지, 연말 취소·환불 타이밍 주의<\/li><li>가맹점·잔액은 누리집·앱에서 확인하고, 제도는 바뀔 수 있어요<\/li><\/ul>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/048/048_0_thumb.png\n\n\"내년으로 이월된다\"고 생각하기 쉬운데, 문화누리카드 지원금은 그해 12월 31일이 지나면 쓸 수 없어요. 2026년 기준으로 금액·발급 마감·연말 취소를 순서대로 정리했어요. (2026년 10월 10일 기준)\n\n1단계. 올해 지원금은 얼마인가요?\n\n정책브리핑·문화누리 안내에 따르면 2026년 통합문화이용권은 1인당 연 15만 원이에요. 청소년기(안내 기준 2008~2013년생)와 준고령기(1962~1966년생)는 생애주기별 1만 원 추가(예산 소진 시 조기 마감될 수 있음)가 안내되어 있습니다. 대상은 6세 이상 기초생활수급자·차상위계층(2020.12.31. 이전 출생자)입니다.\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/048/048_1_card.png\n\n2단계. 발급·재충전은 언제까지?\n\n발급·재충전 신청 기간은 2026년 2월 2일 ~ 11월 30일이에요. 주민센터 방문, 문화누리 누리집·모바일 앱, 재충전은 전화(ARS)도 가능하다고 안내됩니다. 시·군·구 예산이 먼저 소진되면 조기 마감될 수 있어요.\n\n3단계. 어디에 쓰나요?\n\n문화예술(영화·공연·전시 등), 도서·음반, 국내 관광(관광지·숙박·철도 등), 체육(관람·용품·시설) 가맹점에서 쓸 수 있어요. 정책브리핑은 전국 약 3만 5천여 가맹점을 안내하며, 구체 목록은 누리집·앱에서 확인합니다. 2024년부터 미성년자 명의 카드로는 숙박 가맹점 이용이 제한된다는 안내가 있습니다.\n\n4단계. 연말 사용·취소 환불 주의\n\n사용기간은 발급일부터 2026년 12월 31일까지입니다. 문화누리 이용안내에는 12월 중 결제 취소 시 환불이 사용기간 이후에 들어오면 지원금을 쓰지 못하고 국고 반납될 수 있다고 명시되어 있어요. 기차·시외버스 등 교통은 당일 환불이 어렵다는 점도 안내됩니다.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/048/048_2_card.png\n\n자동재충전을 놓쳤다 니다. 대상은 6세 이상 기초생활수급자·차상위계층(2020.12.31. 이전 출생자)입니다.\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/048/048_1_card.png\n\n2단계. 발급·재충전은 언제까지?\n\n발급·재충전 신청 기간은 2026년 2월 2일 ~ 11월 30일이에요. 주민센터 방문, 문화누리 누리집·모바일 앱, 재충전은 전화(ARS)도 가능하다고 안내됩니다. 시·군·구 예산이 먼저 소진되면 조기 마감될 수 있어요.\n\n3단계. 어디에 쓰나요?\n\n문화예술(영화·공연·전시 등), 도서·음반, 국내 관광(관광지·숙박·철도 등), 체육(관람·용품·시설) 가맹점에서 쓸 수 있어요. 정책브리핑은 전국 약 3만 5천여 가맹점을 안내하며, 구체 목록은 누리집·앱에서 확인합니다. 2024년부터 미성년자 명의 카드로는 숙박 가맹점 이용이 제한된다는 안내가 있습니다.\n\n4단계. 연말 사용·취소 환불 주의\n\n사용기간은 발급일부터 2026년 12월 31일까지입니다. 문화누리 이용안내에는 12월 중 결제 취소 시 환불이 사용기간 이후에 들어오면 지원금을 쓰지 못하고 국고 반납될 수 있다고 명시되어 있어요. 기차·시외버스 등 교통은 당일 환불이 어렵다는 점도 안내됩니다.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/048/048_2_card.png\n\n자동재충전을 놓쳤다면\n\n문화누리 공지에 따르면 2026년에는 전년도에 일정 금액 이상 사용하고 자격을 유지한 경우 자동재충전 대상이 될 수 있어요. 자동재충전이 되지 않았더라도 자격만 되면 11월 30일까지 주민센터·누리집·앱·전화로 신규발급·재충전이 가능하다고 안내되어 있습니다. 주소지 시·군·구 예산이 소진되면 조기 마감될 수 있으니, 아직 카드가 없다면 서두르는 편이 좋아요.\n\n사용처가 맞는지 헷갈리면 결제 전에 누리집·앱의 가맹점 조회를 이용하는 것이 안전해요. 가맹점이 아닌 곳에서 결제하거나, 연말에 취소·환불이 늦어 잔액이 기한 밖으로 돌아오는 경우가 가장 아쉬운 실수예요. 공연·숙박·교통처럼 이용일이 내년인 예약도, 취소 시점이 내년이면 지원금 사용이 어려울 수 있다는 안내가 있으니 예약 전 환불 규정을 확인하세요.\n\n지원금은 문화·관광·체육 가맹점에서만 의미가 있어요. 일상 장보기나 일반 온라인 쇼핑몰 전 품목이 되는 것은 아니므로, 결제 전 가맹점 여부를 확인하는 습관이 필요합니다.\n\n한눈에 정리\n\n- 2026년 기본 15만 원(+생애주기 1만 원 가능)\n- 발급·재충전: 2월 2일~11월 30일(예산 소진 시 조기 마감)\n- 사용: 12월 31일까지, 연말 취소·환불 타이밍 주의\n- 가맹점·잔액은 누리집·앱에서 확인하고, 제도는 바뀔 수 있어요", "copyAll": "\"내년으로 이월된다\"고 생각하기 쉬운데, 문화누리카드 지원금은 그해 12월 31일이 지나면 쓸 수 없어요. 2026년 기준으로 금액·발급 마감·연말 취소를 순서대로 정리했어요. (2026년 10월 10일 기준)\n\n1단계. 올해 지원금은 얼마인가요?\n\n정책브리핑·문화누리 안내에 따르면 2026년 통합문화이용권은 1인당 연 15만 원이에요. 청소년기(안내 기준 2008~2013년생)와 준고령기(1962~1966년생)는 생애주기별 1만 원 추가(예산 소진 시 조기 마감될 수 있음)가 안내되어 있습니다. 대상은 6세 이상 기초생활수급자·차상위계층(2020.12.31. 이전 출생자)입니다.\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/048/048_1_card.png\n\n2단계. 발급·재충전은 언제까지?\n\n발급·재충전 신청 기간은 2026년 2월 2일 ~ 11월 30일이에요. 주민센터 방문, 문화누리 누리집·모바일 앱, 재충전은 전화(ARS)도 가능하다고 안내됩니다. 시·군·구 예산이 먼저 소진되면 조기 마감될 수 있어요.\n\n3단계. 어디에 쓰나요?\n\n문화예술(영화·공연· 출·연체·보증·보험 계약·지급 정보 등을 한곳에서 볼 수 있다고 안내해요. 인터넷은 본인 명의 휴대폰 또는 공동인증서로 본인인증 후 이용하고, 방문·전화(ARS)·우편 경로도 기관이 안내합니다.<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/047/047_1_card.png\" alt=\"본인신용정보 열람 경로\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>2단계. '이용·제공사실'은 연 1회 이상 무료<\/b><\/span><\/p>\n<p>「신용정보의 이용 및 보호에 관한 법률」과 시행령에 따르면, 신용정보회사등이 개인신용정보조회시스템으로 조회사항을 열어 둔 경우 <b>신용정보주체는 1년에 1회 이상 무료로<\/b> 신용정보 이용·제공사실을 조회할 수 있도록 해야 해요. 찾기쉬운 생활법령정보에도 같은 내용이 정리되어 있습니다. 조회 내용은 최근 3년분 기준이며, 회사는 조회 기록을 3년간 보존해야 합니다.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>3단계. 개인신용평가회사의 무료 열람과 구분하기<\/b><\/span><\/p>\n<p>시중의 '전국민 무료 신용조회'는 개인신용평가회사(예: 올크레딧 등)가 <b>연 3회<\/b> 구간으로 제공하는 서비스로 안내되는 경우가 많아요. 이는 크레딧포유의 '집중기관 정보 열람'과 <b>서비스·제공 주체가 다릅니다.<\/b> 횟수·인증 방식은 각 회사 공지를 따르고, 이 글에서는 특정 상품을 추천하지 않아요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>4단계. 이상 조회가 보이면<\/b><\/span><\/p>\n<p>명의도용·신분증 분실 등이 걱정되면, 법에 따라 개인신용평가회사 등에 <b>조회사실 통지<\/b>를 요청할 수 있어요. 누설·분실 등 사유가 있으면 회사는 제공을 멈추고 통지해야 하는 규정도 있습니다. 구체 절차는 해당 회사·금융감독 안내를 확인하세요.<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/047/047_2_card.png\" alt=\"확인 순서\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>열람할 때 알아둘 점<\/b><\/span><\/p>\n<p>크레딧포유와 개인신용평가회사 사이트는 목적이 달라요. 전자는 신용정보원이 집중 관리하는 대출·연체·보증·보험 등을 본인이 확인하는 창구이고, 후자는 신용조회회사·평가회사가 제공하는 신용정보·평점 열람 서비스인 경우가 많아요. 어느 쪽이든 <b>본인 인증<\/b>이 필요하고, 화면 구성·메뉴 이름은 바뀔 수 있어요.<\/p>\n<p>법상 \"연 1회 이상 무료\"는 개인신용정보조회시스템을 통해 이용·제공사실을 조회할 수 있게 한 경우에 적용되는 최소 보장이에요. 회사가 그 이상으로 무료 횟수를 두는 서비스도 있으니, 이용 전 해당 기관 공지의 횟수·회차 구간을 확인하면 됩니다. 열람 기록은 일정 기간 보존되므로, 나중에 분쟁·명의도용 확인에도 도움이 될 수 있어요.<\/p>\n<p>이 글은 신용점수를 올리는 방법이나 특정 대출·카드를 권하지 않아요. 정보의 위치와 법적 열람 권리만 안내합니다.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>크레딧포유: 대출·연체·보증·보험 등 본인신용정보 열람(한국신용정보원)<\/li><li>이용·제공사실: 조회시스템 이용 시 연 1회 이상 무료(신용정보법 시행령)<\/li><li>평가회사 무료 열람은 별도 서비스 — 횟수는 회사 공지 기준<\/ 보험 등을 본인이 확인하는 창구이고, 후자는 신용조회회사·평가회사가 제공하는 신용정보·평점 열람 서비스인 경우가 많아요. 어느 쪽이든 본인 인증이 필요하고, 화면 구성·메뉴 이름은 바뀔 수 있어요.\n\n법상 \"연 1회 이상 무료\"는 개인신용정보조회시스템을 통해 이용·제공사실을 조회할 수 있게 한 경우에 적용되는 최소 보장이에요. 회사가 그 이상으로 무료 횟수를 두는 서비스도 있으니, 이용 전 해당 기관 공지의 횟수·회차 구간을 확인하면 됩니다. 열람 기록은 일정 기간 보존되므로, 나중에 분쟁·명의도용 확인에도 도움이 될 수 있어요.\n\n이 글은 신용점수를 올리는 방법이나 특정 대출·카드를 권하지 않아요. 정보의 위치와 법적 열람 권리만 안내합니다.\n\n한눈에 정리\n\n- 크레딧포유: 대출·연체·보증·보험 등 본인신용정보 열람(한국신용정보원)\n- 이용·제공사실: 조회시스템 이용 시 연 1회 이상 무료(신용정보법 시행령)\n- 평가회사 무료 열람은 별도 서비스 — 횟수는 회사 공지 기준\n- 화면·메뉴는 바뀔 수 있으니 신청·조회 전 공식 안내를 다시 확인하세요", "copyAll": "대출을 알아보거나 카드 한도를 보기 전에 \"내 정보가 어디에 어떻게 쌓여 있지?\" 궁금할 때가 있어요. 점수 올리는 팁이 아니라, 법과 공공 서비스로 무료로 확인하는 길만 정리했어요. (2026년 10월 10일 기준)\n\n1단계. 크레딧포유에서 집중 정보 보기\n\n한국신용정보원이 제공하는 본인신용정보 열람서비스(크레딧포유)에서는 대출·연체·보증·보험 계약·지급 정보 등을 한곳에서 볼 수 있다고 안내해요. 인터넷은 본인 명의 휴대폰 또는 공동인증서로 본인인증 후 이용하고, 방문·전화(ARS)·우편 경로도 기관이 안내합니다.\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/047/047_1_card.png\n\n2단계. '이용·제공사실'은 연 1회 이상 무료\n\n「신용정보의 이용 및 보호에 관한 법률」과 시행령에 따르면, 신용정보회사등이 개인신용정보조회시스템으로 조회사항을 열어 둔 경우 신용정보주체는 1년에 1회 이상 무료로 신용정보 이용·제공사실을 조회할 수 있도록 해야 해요. 찾기쉬운 생활법령정보에도 같은 내용이 정리되어 있습니다. 조회 내용은 최근 3년분 기준이며, 회사는 조회 기록을 3년간 보존해야 합니다.\n\n3단계. 개인신용평가회사의 무료 열람과 구분하기\n\n시중의 '전국민 무료 신용조회'는 개인신용평가회사(예: 올크레딧 등)가 연 3회 구간으로 제공하는 서비스로 안내되는 경우가 많아요. 이는 크레딧포유의 '집중기관 정보 열람'과 서비스·제공 주체가 다릅니다. 횟수·인증 방식은 각 회사 공지를 따르고, 이 글에서는 특정 상품을 추천하지 않아요.\n\n4단계. 이상 조회가 보이면\n\n명의도용·신분증 분실 등이 걱정되면, 법에 따라 개인신용평가회사 등에 조회사실 통지를 요청할 수 있어요. 누설·분실 등 사유가 있으면 회사는 제공을 멈추고 통지해야 하는 규정도 있습니다. 구체 절차는 해당 회사·금융감독 안내를 확인하세요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/047/047_2_card.png\n\n열람할 때 알아둘 점\n\n크레딧포유와 개인신용평가회사 사이트는 목적이 달라요. 전자는 신용정보원이 집중 관리하는 대출·연체·보증·보험 등을 본인이 확인하는 창구이고, 후자는 신용조회회사·평가회사가 제공하는 신용정보·평점 열람 서비스인 경우가 많아요. 어느 쪽이든 본인 인증이 필요하고, 화면 구성·메뉴 이름은 바뀔 수 있어요.\n\n법상 \"연 1회 이상 무료\"는 개인신용정보조회시스템을 통해 이용·제공사실을 조회할 수 있게 한 경우에 적용되는 최소 보장이에요. 회사가 그 이상으로 무료 횟수를 두는 서비스도 있으니, 이용 전 해당 기관 공지의 횟수·회차 구간을 확인하면 됩니다. 열람 기록은 일정 기간 보존되므로, 나중에 분쟁·명의도용 확인에도 도움이 될 수 있어요.\n\n이 글은 신용점수를 올리는 ma.github.io/blog-drafts/img/046/046_1_card.png\" alt=\"감면·할인 대상\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>경차는 왜 '신청'이 없을까?<\/b><\/span><\/p>\n<p>경형 기준을 충족하는 차는 국토교통부 자동차관리정보시스템의 차종 정보를 하이패스 결제 시스템이 인식해 할인해요. 그래서 별도 신청서 없이, <b>단말기에 등록된 차량번호가 실제와 같고 하이패스 차로로 통과<\/b>하면 됩니다. 현금·통행권 결제에는 할인이 적용되지 않아요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>장애인·유공자는 등록이 필요해요<\/b><\/span><\/p>\n<p>찾기쉬운 생활법령정보에 따르면 장애인 차량 감면 대상은 배기량 2,000cc 이하 승용, 승차정원 6~10명 승용, 12명 이하 승합, 최대적재 1톤 이하 화물, 전기·연료전지차 등(비영업용)이에요. 할인율은 50%입니다.<\/p>\n<p>하이패스 이용 시에는 지문인증(감면단말기, 인증 유지 4시간) 또는 통합복지카드 삽입 + 등록 휴대폰 위치 확인 방식이 안내되어 있어요. 일반차로에서는 통행권과 할인카드·장애인통합복지카드를 함께 제시합니다.<\/p>\n<p>2026년 7월 28일부터는 장애·유공자가 <b>1년 이상 임차·대여한 차량<\/b>도 감면 대상에 포함됐어요. 장애인은 주소지 행정복지센터, 유공자는 보훈지청에서 신청합니다.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>다자녀 주말·공휴일 할인 주의점<\/b><\/span><\/p>\n<p>국토교통부 정책브리핑(2026-07-21) 기준, 다자녀 할인은 한국도로공사 고속도로에만 적용되고 <b>민자고속도로·연계 구간은 제외<\/b>예요. 신청 때 등록한 하이패스카드를 넣고 하이패스차로로 다니며, 출구에서 사전등록 휴대폰 위치로 부·모 탑승을 확인해요. 신청은 통행료 누리집·앱·영업소에서 할 수 있어요.<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/046/046_2_card.png\" alt=\"하이패스 이용 시\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>민자고속도로·명절은?<\/b><\/span><\/p>\n<p>다자녀 할인은 한국도로공사 구간에만 적용된다고 국토부가 밝혔어요. 자주 다니는 길이 민자이거나 민자와 이어지는 구간이면 할인 대상이 아닐 수 있으니, 구간 운영 주체를 먼저 확인하는 편이 안전해요. 설·추석처럼 전 차량 통행료가 면제되는 기간이 있으면 그 기간에는 감면율과 별개로 무료가 적용되는 경우가 있어요. 면제 일정은 해마다 공지되므로 출발 전 한국도로공사 안내를 보면 됩니다.<\/p>\n<p>감면·할인을 받은 뒤 명세서나 통행료 누리집에서 실제 할인 여부를 한 번 더 확인하면, 단말기 번호 오등록이나 카드 미삽입 같은 실수를 줄일 수 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>경차 50%: 크기·배기량 기준 + 하이패스 차로<\/li><li>장애인 50%·유공자 100%/50%: 차량 종류·탑승·등록, 2026-07-28부터 장기 임차·대여도<\/li><li>다자녀 주말·공휴일 10%/20%: 도로공사 구간만, 한시<\/li><li>구간·카드 종류에 따라 적용이 달라질 수 있으니 이용 전 한국도로공사·국토부 안내를 다시 확인하세요<\/li><\/ul>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/046/046_0_thumb.png\n\n고 상은 배기량 2,000cc 이하 승용, 승차정원 6~10명 승용, 12명 이하 승합, 최대적재 1톤 이하 화물, 전기·연료전지차 등(비영업용)이에요. 할인율은 50%입니다.<\/p>\n<p>하이패스 이용 시에는 지문인증(감면단말기, 인증 유지 4시간) 또는 통합복지카드 삽입 + 등록 휴대폰 위치 확인 방식이 안내되어 있어요. 일반차로에서는 통행권과 할인카드·장애인통합복지카드를 함께 제시합니다.<\/p>\n<p>2026년 7월 28일부터는 장애·유공자가 <strong>1년 이상 임차·대여한 차량<\/strong>도 감면 대상에 포함됐어요. 장애인은 주소지 행정복지센터, 유공자는 보훈지청에서 신청합니다.<\/p>\n<h3>다자녀 주말·공휴일 할인 주의점<\/h3>\n<p>국토교통부 정책브리핑(2026-07-21) 기준, 다자녀 할인은 한국도로공사 고속도로에만 적용되고 <strong>민자고속도로·연계 구간은 제외<\/strong>예요. 신청 때 등록한 하이패스카드를 넣고 하이패스차로로 다니며, 출구에서 사전등록 휴대폰 위치로 부·모 탑승을 확인해요. 신청은 통행료 누리집·앱·영업소에서 할 수 있어요.<\/p>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/046/046_2_card.png\" alt=\"하이패스 이용 시\"><\/figure>\n<h3>민자고속도로·명절은?<\/h3>\n<p>다자녀 할인은 한국도로공사 구간에만 적용된다고 국토부가 밝혔어요. 자주 다니는 길이 민자이거나 민자와 이어지는 구간이면 할인 대상이 아닐 수 있으니, 구간 운영 주체를 먼저 확인하는 편이 안전해요. 설·추석처럼 전 차량 통행료가 면제되는 기간이 있으면 그 기간에는 감면율과 별개로 무료가 적용되는 경우가 있어요. 면제 일정은 해마다 공지되므로 출발 전 한국도로공사 안내를 보면 됩니다.<\/p>\n<p>감면·할인을 받은 뒤 명세서나 통행료 누리집에서 실제 할인 여부를 한 번 더 확인하면, 단말기 번호 오등록이나 카드 미삽입 같은 실수를 줄일 수 있어요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>경차 50%: 크기·배기량 기준 + 하이패스 차로<\/li><li>장애인 50%·유공자 100%/50%: 차량 종류·탑승·등록, 2026-07-28부터 장기 임차·대여도<\/li><li>다자녀 주말·공휴일 10%/20%: 도로공사 구간만, 한시<\/li><li>구간·카드 종류에 따라 적용이 달라질 수 있으니 이용 전 한국도로공사·국토부 안내를 다시 확인하세요<\/li><\/ul>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-10): 대표 썸네일 · 사진 1 자체 제작 카드 · 사진 2 자체 제작 카드 — 파일 images/posts/046/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>감면 표 아래<\/td><td>대상별 감면율 요약 카드<\/td><td>개인정보·차량번호 화면 캡처 금지<\/td><\/tr><tr><td>다자녀 절 아래<\/td><td>하이패스 이용 체크 카드<\/td><td>로그인 화면 금지<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 내 차가 경형(배기량·외형) 기준에 해당하는지 자동차등록증으로 확인<\/li><li class=\"cb\">☐ 자주 쓰는 구간이 도로공사인지 민자인지 확인(다자녀 할인 여부)<\/li><li class=\"cb\">☐ 장애인·유공자·다자녀는 사전 등록·휴대폰 등록 상태를 통행료 누리집/영업소에서 확인<\/li><li class=\"cb\">☐ 임차·대여 차량이면 계약 기간이 1년 이 ://senti-1000ma.github.io/blog-drafts/img/046/046_1_card.png\n\n경차는 왜 '신청'이 없을까?\n\n경형 기준을 충족하는 차는 국토교통부 자동차관리정보시스템의 차종 정보를 하이패스 결제 시스템이 인식해 할인해요. 그래서 별도 신청서 없이, 단말기에 등록된 차량번호가 실제와 같고 하이패스 차로로 통과하면 됩니다. 현금·통행권 결제에는 할인이 적용되지 않아요.\n\n장애인·유공자는 등록이 필요해요\n\n찾기쉬운 생활법령정보에 따르면 장애인 차량 감면 대상은 배기량 2,000cc 이하 승용, 승차정원 6~10명 승용, 12명 이하 승합, 최대적재 1톤 이하 화물, 전기·연료전지차 등(비영업용)이에요. 할인율은 50%입니다.\n\n하이패스 이용 시에는 지문인증(감면단말기, 인증 유지 4시간) 또는 통합복지카드 삽입 + 등록 휴대폰 위치 확인 방식이 안내되어 있어요. 일반차로에서는 통행권과 할인카드·장애인통합복지카드를 함께 제시합니다.\n\n2026년 7월 28일부터는 장애·유공자가 1년 이상 임차·대여한 차량도 감면 대상에 포함됐어요. 장애인은 주소지 행정복지센터, 유공자는 보훈지청에서 신청합니다.\n\n다자녀 주말·공휴일 할인 주의점\n\n국토교통부 정책브리핑(2026-07-21) 기준, 다자녀 할인은 한국도로공사 고속도로에만 적용되고 민자고속도로·연계 구간은 제외예요. 신청 때 등록한 하이패스카드를 넣고 하이패스차로로 다니며, 출구에서 사전등록 휴대폰 위치로 부·모 탑승을 확인해요. 신청은 통행료 누리집·앱·영업소에서 할 수 있어요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/046/046_2_card.png\n\n민자고속도로·명절은?\n\n다자녀 할인은 한국도로공사 구간에만 적용된다고 국토부가 밝혔어요. 자주 다니는 길이 민자이거나 민자와 이어지는 구간이면 할인 대상이 아닐 수 있으니, 구간 운영 주체를 먼저 확인하는 편이 안전해요. 설·추석처럼 전 차량 통행료가 면제되는 기간이 있으면 그 기간에는 감면율과 별개로 무료가 적용되는 경우가 있어요. 면제 일정은 해마다 공지되므로 출발 전 한국도로공사 안내를 보면 됩니다.\n\n감면·할인을 받은 뒤 명세서나 통행료 누리집에서 실제 할인 여부를 한 번 더 확인하면, 단말기 번호 오등록이나 카드 미삽입 같은 실수를 줄일 수 있어요.\n\n한눈에 정리\n\n- 경차 50%: 크기·배기량 기준 + 하이패스 차로\n- 장애인 50%·유공자 100%/50%: 차량 종류·탑승·등록, 2026-07-28부터 장기 임차·대여도\n- 다자녀 주말·공휴일 10%/20%: 도로공사 구간만, 한시\n- 구간·카드 종류에 따라 적용이 달라질 수 있으니 이용 전 한국도로공사·국토부 안내를 다시 확인하세요", "copyAll": "고속도로 요금이 부담될 때 먼저 확인할 건 '내가 어떤 감면·할인 대상인지'예요. 경차는 하이패스만 맞게 등록돼 있으면 자동으로 절반이 깎이고, 장애인·유공자·다자녀는 사전 등록이 필요해요. (2026년 10월 10일 기준)\n\n감면·할인 대상 한눈에\n\n• 경형자동차 — 감면·할인: 통행료 50% / 핵심 조건(요약): 배기량 1,000cc 미만 + 길이 3.6m·너비 1.6m·높이 2.0m 이하(유료도로법 시행령)\n• 장애인 — 감면·할인: 50% / 핵심 조건(요약): 등록장애인 또는 동일 세대원 소유·임차 비영업용 차량, 장애인이 탑승\n• 독립·국가유공자(1~5급)·5·18부상자(1~5급) — 감면·할인: 100% / 핵심 조건(요약): 종전 기준과 동일(국토부 안내)\n• 기타 유공자 등 — 감면·할인: 50% / 핵심 조건(요약): 국토부·보훈 안내 기준\n• 다자녀(미성년 자녀 2명) — 감면·할인: 주말·공휴일 10% / 핵심 조건(요약): 한국도로공사 운영 고속도로, 한시(2029-08-21까지)\n• 다자녀(미성년 자녀 3명 이상) — 감면·할인: 주말·공휴일 20% / 핵심 조건(요약): 위와 동일, 민자고속도로·연계 이용은 미적용\n\n )·토큰화 같은 기술을 RBI 내부에서도, 민관협력 방식으로도 쓰고 있다고 말했어요. '코인'과 '기술'을 나눠 본 셈이에요. (2/5)\n\n---\n\n신중한 이유로 든 것 👇\n\n통화주권, 통화정책, 자본 흐름, 그리고 '화폐의 단일성(singleness of money)'.\n\n특히 자본 이동을 제한하는 신흥국에선 더 큰 문제라고 했어요. (3/5)\n\n---\n\n결제 얘기도 했어요.\n\n인도 국내 결제는 이미 빠르고 저렴해서, 진짜 과제는 국경 간 결제라는 것. 그 대안으로 CBDC 등을 언급했다고 보도됐어요. (4/5)\n\n---\n\n이번 발언은 기존 신중 기조를 다시 확인한 것으로, 새 규제나 법안 발표는 아니에요(10월 3일 보도 기준).\n\n※ 정보 제공용, 투자 조언 아님 (5/5)", "copyAll": "[크립토 뉴스] 인도 중앙은행(RBI) 산제이 말호트라 총재가 10월 3일 뉴델리 카우틸랴 경제 콘클라베에서 \"암호화폐에는 신중한 입장\"이라고 밝혔어요.\n\nPTI 보도 🧵 #크립토뉴스 (1/5)\n\n---\n\n반면 기반 기술은 장려한대요.\n\n분산원장기술(DLT)·토큰화 같은 기술을 RBI 내부에서도, 민관협력 방식으로도 쓰고 있다고 말했어요. '코인'과 '기술'을 나눠 본 셈이에요. (2/5)\n\n---\n\n신중한 이유로 든 것 👇\n\n통화주권, 통화정책, 자본 흐름, 그리고 '화폐의 단일성(singleness of money)'.\n\n특히 자본 이동을 제한하는 신흥국에선 더 큰 문제라고 했어요. (3/5)\n\n---\n\n결제 얘기도 했어요.\n\n인도 국내 결제는 이미 빠르고 저렴해서, 진짜 과제는 국경 간 결제라는 것. 그 대안으로 CBDC 등을 언급했다고 보도됐어요. (4/5)\n\n---\n\n이번 발언은 기존 신중 기조를 다시 확인한 것으로, 새 규제나 법안 발표는 아니에요(10월 3일 보도 기준).\n\n※ 정보 제공용, 투자 조언 아님 (5/5)", "extras": [{"title": "이미지·미디어 제안", "html": "<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>트윗 3<\/td><td>직접 만든 텍스트 카드('신중한 이유 4가지: 통화주권·통화정책·자본 흐름·화폐의 단일성')<\/td><td>행사 영상·총재 사진·언론사 이미지는 첨부하지 말고 원본 링크 인용으로만<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 게시 직전 RBI 공식 연설문이 올라왔는지 확인(있다면 Reply에 추가)<\/li><li class=\"cb\">☐ 인도의 암호화폐 과세·등록 제도 등 이번 발언에 없는 내용은 추가하지 않기<\/li><li class=\"cb\">☐ '금지'로 과장하지 않기(발언은 '신중한 접근')<\/li><li class=\"cb\">☐ 게시는 직접 수동으로(자동 게시 금지)<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>10월 3일 카우틸랴 경제 콘클라베, 암호화폐 신중·기반 기술 장려, RBI 내부·민관협력 활용, 통화주권·통화정책·자본 흐름·화폐의 단일성 우려(자본 통제 신흥국), 국내 결제 vs 국경 간 결제, CBDC<\/td><td>더힌두(PTI) 2026-10-03 15:45 IST <a href=\"https://www.thehindu.com/business/rbi-remains-cautious-on-crypto-backs-underlying-technology-governor-malhotra/article71540258.ece\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.thehindu.com/business/rbi-remains-cautious-on-crypto-backs-underlying-technology-governor-malhotra/article71540258.ece<\/a><\/td><td>매체<\/td><\/tr><tr><td>같은 발언 교차 확인<\/td><td>이코노믹타임스(PTI) 2026-10-03 14:30 IST <a href=\"https://economictimes.indiatimes.com/news/economy/policy/rbi-remains-cautious-on-crypto-backs-underlying-technology-governor-sanjay-malhotra/articleshow/134655603.cms\" target=\"_blank\" rel=\"noopener noreferrer\">https://economictimes.indiatimes.com/news/economy/policy/rbi-remains-cautious-on-crypto-backs-underlying-technology-governor-sanjay-malhotra/articleshow/134655603.cms<\/a><\/td><td>매체(교차 확인)<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>(선택) 스레드 끝 답글용: \"AI 도움을 받아 보도를 요약했어요. 정보 제공용이며 투자 조언이 아닙니다.\"<\/blockquote>", "open": false}], "search": "045 [크립토 뉴스] 인도 중앙은행 총재 \"암호화폐엔 신중, 기반 기술은 장려\" (10월 3일 뉴델리 발언) 규제·정책 인도 중앙은행, RBI, 말호트라, CBDC, 토큰화 #크립토뉴스 산제이 말호트라 RBI 총재가 10월 3일(현지) 뉴델리 카우틸랴 경제 콘클라베에서 밝힌 암호화폐 신중론(통화주권·통화정책·자본흐름 우려)과 DLT·토큰화 장려, 국경 간 결제 과제를 PTI 보도로 5개 트윗 요약 산제이 말호트라 인도중앙은행(RBI) 총재는 10월 3일(현지) 뉴델리 카우틸랴 경제 콘클라베에서 암호화폐에는 신중한 접근을 유지하되 분산원장기술·토큰화 등 기반 기술은 장려하며 RBI 내부와 민관협력 방식으로 활용 중이라고 밝혔어요(PTI). 우려 사항으로 통화주권·통화정책·자본 흐름과 '화폐의 단일성'을 들었고, 특히 자본 이동을 제한하는 신흥국에서 문제가 크다고 했어요. 국내 결제는 이미 빠르고 저렴하며 과제는 국경 간 결제로, CBDC 등을 대안으로 언급했어요. 새 규제 발표는 아니었어요. 투자 조언 아님. [크립토 뉴스] 인도 중앙은행(RBI) 산제이 말호트라 총재가 10월 3일 뉴델리 카우틸랴 경제 콘클라베에서 \"암호화폐에는 신중한 입장\"이라고 밝혔어요. PTI 보도 🧵 #크립토뉴스 (1/5) --- 반면 기반 기술은 장려한대요. 분산원장기술(DLT)·토큰화 같은 기술을 RBI 내부에서도, 민관협력 방식으로도 쓰고 있다고 말했어요. '코인'과 '기술'을 나눠 본 셈이에요. (2/5) --- 신중한 이유로 든 것 👇 통화주권, 통화정책, 자본 흐름, 그리고 '화폐의 단일성(singleness of money)'. 특히 자본 이동을 제한하는 신흥국에선 더 큰 문제라고 했어요. (3/5) --- 결제 얘기도 했어요. 인도 국내 결제는 이미 빠르고 저렴해서, 진짜 과제는 국경 간 결제라는 것. 그 대안으로 CBDC 등을 언급했다고 보도됐어요. (4/5) --- 이번 발언은 기존 신중 기조를 다시 확인한 것으로, 새 규제나 법안 발표는 아니에요(10월 3일 보도 기준). ※ 정보 제공용, 투자 조언 아님 (5/5) X 크립토"}, {"id": "044", "platform": "x", "s
