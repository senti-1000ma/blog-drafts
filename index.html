align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/011/011_1_capture.png\" alt=\"&#x27;에너지바우처란?&#x27; 페이지의 지원금액·신청 기간 안내 (2026-10-05 확인)\" width=\"720\"><\/p><p style=\"text-align:center\"><span style=\"font-size:13px;color:#888888\">출처: 에너지바우처 누리집<\/span><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>1단계. 소득 기준부터<\/b><\/span><\/p>\n<p>국민기초생활보장법에 따른 생계급여, 의료급여, 주거급여, 교육급여 수급자여야 해요. 이 조건이 기본이고, 다음 단계의 조건도 함께 충족해야 한다고 안내되어 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>2단계. 세대원 특성 기준<\/b><\/span><\/p>\n<p>주민등록등본상 본인이나 세대원 중 한 명이라도 아래에 해당해야 해요.<\/p>\n<ul><li>노인: 1961년 12월 31일 이전 출생<\/li><li>영유아: 2019년 1월 1일 이후 출생한 7세 이하 취학 전 아동<\/li><li>장애인: 장애인복지법에 따라 등록한 사람<\/li><li>임산부: 임신 중이거나 분만 후 6개월 미만인 여성<\/li><li>중증질환자, 희귀질환자, 중증난치질환자<\/li><li>한부모가족, 소년소녀가정<\/li><li>다자녀 세대: 부 또는 모와 함께 사는 19세 미만 자녀가 2명 이상<\/li><\/ul>\n<p>세대원 모두가 보장시설에서 급여를 받는 경우는 지원에서 제외된다고 해요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>3단계. 신청과 금액<\/b><\/span><\/p>\n<p>신청 기간은 2026년 6월 15일부터 12월 31일까지예요. 읍·면·동 행정복지센터를 방문하거나 복지로에서 신청할 수 있고, 거동이 불편하면 대리 신청이나 공무원의 직권 신청도 가능해요. 문의는 에너지바우처 통합센터(1600-3190)에서 받아요.<\/p>\n<p>지원 금액은 세대원 수에 따라 달라요. 아래 금액은 올해 총액이고 월별 금액이 아니에요.<\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>세대원 수<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>총 지원금액<\/b><\/td><\/tr><tr><td>1인<\/td><td>295,200원<\/td><\/tr><tr><td>2인<\/td><td>407,500원<\/td><\/tr><tr><td>3인<\/td><td>532,700원<\/td><\/tr><tr><td>4인 이상<\/td><td>701,300원<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p>사용기간은 하절기와 동절기 구분 없이 2026년 7월 1일부터 2027년 5월 31일까지 자유롭게 쓸 수 있어요. 에너지바우처 지원금은 수급자의 소득 산정에는 반영되지 않는다고 안내돼 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>겨울에는 어떻게 쓰나요?<\/b><\/span><\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>방식<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>사용 시작<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>사용 가능한 에너지<\/b><\/td><\/tr><tr><td>가상카드(요금 차감)<\/td><td>10월 1일<\/td><td>전기, 도시가스, 지역난방 중 택1<\/td><\/tr><tr><td>실물카드(국민행복카드)<\/td><td>10월 3일<\/td><td>전기, 도시가스, 등유, LPG, 연탄<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p>둘 다 종료일은 2027년 5월 31일이에요. 가상카드는 발행되는 요금 고지서에서 금액이 차감되는 방식이라고 해요. 신청은 2026년 12월 31일까지 받는데, 누리집에는 10월 1~2일과 12월 말 2~3일은 포인트 생성 처리로 신청이 잠시 멈춘다고 나와 있어요. 늦게 신청했을 때 몇 월 고지서부터 차감되는지는 따로 안내돼 있지 않으니 통합 상담센터(1600-3190)에 물어보세요.<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/011/011_2_card.png\" alt=\"에너지바우처 한눈에 정리\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>중복 지원은 안 돼요<\/b><\/span><\/p>\n<p>같은 겨울에 긴급복지지원법에 따른 동절기 연료비(2026년 10월~2027년 3월), 한국광해광업공단의 연탄쿠폰, 연탄전환 에너지바우처를 받은 세대는 동절기 에너지바우처를 중복해서 받을 수 없다고 안내돼 있어요. 이미 다른 지원을 받고 있다면 읍·면·동 행정복지센터에서 어떻게 조정되는지 먼저 물어보세요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>수급자 조건과 세대원 특성 조건을 모두 충족해야 신청 가능<\/li><li>신청은 12월 31일까지, 사용은 2027년 5월 31일까지<\/li><li>가상카드는 요금 차감, 실물카드는 국민행복카드로 에너지 구입<\/li><\/ul>\n<p>대상과 금액은 해마다 달라지니 신청 전에 복지로나 에너지바우처 누리집에서 한 번 더 확인해 주세요.<\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/011/011_0_thumb.png\n\n아침저녁으로 쌀쌀해지면 슬슬 난방비 걱정이 시작되죠. 에너지바우처는 에너지 취약계층의 냉·난방비를 지원하는 제도인데, 올해는 동절기 사용이 10월부터 시작돼서 대상인지 먼저 확인해 보는 게 좋아요. 기후에너지환경부 정책브리핑과 에너지바우처 누리집 안내를 기준으로 세 단계로 나눠 봤습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/011/011_1_capture.png\n출처: 에너지바우처 누리집\n\n1단계. 소득 기준부터\n\n국민기초생활보장법에 따른 생계급여, 의료급여, 주거급여, 교육급여 수급자여야 해요. 이 조건이 기본이고, 다음 단계의 조건도 함께 충족해야 한다고 안내되어 있어요.\n\n2단계. 세대원 특성 기준\n\n주민등록등본상 본인이나 세대원 중 한 명이라도 아래에 해당해야 해요.\n\n- 노인: 1961년 12월 31일 이전 출생\n- 영유아: 2019년 1월 1일 이후 출생한 7세 이하 취학 전 아동\n- 장애인: 장애인복지법에 따라 등록한 사람\n- 임산부: 임신 중이거나 분만 후 6개월 미만인 여성\n- 중증질환자, 희귀질환자, 중증난치질환자\n- 한부모가족, 소년소녀가정\n- 다자녀 세대: 부 또는 모와 함께 사는 19세 미만 자녀가 2명 이상\n\n세대원 모두가 보장시설에서 급여를 받는 경우는 지원에서 제외된다고 해요.\n\n3단계. 신청과 금액\n\n신청 기간은 2026년 6월 15일부터 12월 31일까지예요. 읍·면·동 행정복지센터를 방문하거나 복지로에서 신청할 수 있고, 거동이 불편하면 대리 신청이나 공무원의 직권 신청도 가능해요. 문의는 에너지바우처 통합센터(1600-3190)에서 받아요.\n\n지원 금액은 세대원 수에 따라 달라요. 아래 금액은 올해 총액이고 월별 금액이 아니에요.\n\n• 1인 — 총 지원금액: 295,200원\n• 2인 — 총 지원금액: 407,500원\n• 3인 — 총 지원금액: 532,700원\n• 4인 이상 — 총 지원금액: 701,300원\n\n사용기간은 하절기와 동절기 구분 없이 2026년 7월 1일부터 2027년 5월 31일까지 자유롭게 쓸 수 있어요. 에너지바우처 지원금은 수급자의 소득 산정에는 반영되지 않는다고 안내돼 있어요.\n\n겨울에는 어떻게 쓰나요?\n\n• 가상카드(요금 차감) — 사용 시작: 10월 1일 / 사용 가능한 에너지: 전기, 도시가스, 지역난방 중 택1\n• 실물카드(국민행복카드) — 사용 시작: 10월 3일 / 사용 가능한 에너지: 전기, 도시가스, 등유, LPG, 연탄\n\n둘 다 종료일은 2027년 5월 31일이에요. 가상카드는 발행되는 요금 고지서에서 금액이 차감되는 방식이라고 해요. 신청은 2026년 12월 31일까지 받는데, 누리집에는 10월 1~2일과 12월 말 2~3일은 포인트 생성 처리로 신청이 잠시 멈춘다고 나와 있어요. 늦게 신청했을 때 몇 월 고지서부터 차감되는지는 따로 안내돼 있지 않으니 통합 상담센터(1600-3190)에 물어보세요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/011/011_2_card.png\n\n중복 지원은 안 돼요\n\n같은 겨울에 긴급복지지원법에 따른 동절기 연료비(2026년 10월~2027년 3월), 한국광해광업공단의 연탄쿠폰, 연탄전환 에너지바우처를 받은 세대는 동절기 에너지바우처를 중복해서 받을 수 없다고 안내돼 있어요. 이미 다른 지원을 받고 있다면 읍·면·동 행정복지센터에서 어떻게 조정되는지 먼저 물어보세요.\n\n한눈에 정리\n\n- 수급자 조건과 세대원 특성 조건을 모두 충족해야 신청 가능\n- 신청은 12월 31일까지, 사용은 2027년 5월 31일까지\n- 가상카드는 요금 차감, 실물카드는 국민행복카드로 에너지 구입\n\n대상과 금액은 해마다 달라지니 신청 전에 복지로나 에너지바우처 누리집에서 한 번 더 확인해 주세요.", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/011/011_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/011/011_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "011_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/011/011_1_capture.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/011/011_1_capture.png", "cap": "출처: 에너지바우처 누리집", "alt": "'에너지바우처란?' 페이지의 지원금액·신청 기간 안내 (2026-10-05 확인)", "name": "011_1_capture.png", "w": 1080, "h": 414}, {"n": 2, "label": "사진 2", "uri": "img/011/011_2_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/011/011_2_card.png", "cap": "", "alt": "에너지바우처 한눈에 정리", "name": "011_2_card.png", "w": 1080, "h": 816}], "zip": "img/011/011_images.zip", "html": "<figure class=\"ph thumbfig\" data-n=\"0\"><img src=\"img/011/011_0_thumb.png\" alt=\"대표 이미지\"><\/figure>\n<p>아침저녁으로 쌀쌀해지면 슬슬 난방비 걱정이 시작되죠. 에너지바우처는 에너지 취약계층의 냉·난방비를 지원하는 제도인데, 올해는 동절기 사용이 10월부터 시작돼서 대상인지 먼저 확인해 보는 게 좋아요. 기후에너지환경부 정책브리핑과 에너지바우처 누리집 안내를 기준으로 세 단계로 나눠 봤습니다. (2026년 10월 5일 기준)<\/p>\n<figure class=\"ph\" data-n=\"1\"><img loading=\"lazy\" src=\"img/011/011_1_capture.png\" alt=\"&#x27;에너지바우처란?&#x27; 페이지의 지원금액·신청 기간 안내 (2026-10-05 확인)\"><figcaption>출처: 에너지바우처 누리집<\/figcaption><\/figure>\n<h3>1단계. 소득 기준부터<\/h3>\n<p>국민기초생활보장법에 따른 생계급여, 의료급여, 주거급여, 교육급여 수급자여야 해요. 이 조건이 기본이고, 다음 단계의 조건도 함께 충족해야 한다고 안내되어 있어요.<\/p>\n<h3>2단계. 세대원 특성 기준<\/h3>\n<p>주민등록등본상 본인이나 세대원 중 한 명이라도 아래에 해당해야 해요.<\/p>\n<ul><li>노인: 1961년 12월 31일 이전 출생<\/li><li>영유아: 2019년 1월 1일 이후 출생한 7세 이하 취학 전 아동<\/li><li>장애인: 장애인복지법에 따라 등록한 사람<\/li><li>임산부: 임신 중이거나 분만 후 6개월 미만인 여성<\/li><li>중증질환자, 희귀질환자, 중증난치질환자<\/li><li>한부모가족, 소년소녀가정<\/li><li>다자녀 세대: 부 또는 모와 함께 사는 19세 미만 자녀가 2명 이상<\/li><\/ul>\n<p>세대원 모두가 보장시설에서 급여를 받는 경우는 지원에서 제외된다고 해요.<\/p>\n<h3>3단계. 신청과 금액<\/h3>\n<p>신청 기간은 2026년 6월 15일부터 12월 31일까지예요. 읍·면·동 행정복지센터를 방문하거나 복지로에서 신청할 수 있고, 거동이 불편하면 대리 신청이나 공무원의 직권 신청도 가능해요. 문의는 에너지바우처 통합센터(1600-3190)에서 받아요.<\/p>\n<p>지원 금액은 세대원 수에 따라 달라요. 아래 금액은 올해 총액이고 월별 금액이 아니에요.<\/p>\n<div class=\"tw\"><table><thead><tr><th>세대원 수<\/th><th>총 지원금액<\/th><\/tr><\/thead><tbody><tr><td>1인<\/td><td>295,200원<\/td><\/tr><tr><td>2인<\/td><td>407,500원<\/td><\/tr><tr><td>3인<\/td><td>532,700원<\/td><\/tr><tr><td>4인 이상<\/td><td>701,300원<\/td><\/tr><\/tbody><\/table><\/div>\n<p>사용기간은 하절기와 동절기 구분 없이 2026년 7월 1일부터 2027년 5월 31일까지 자유롭게 쓸 수 있어요. 에너지바우처 지원금은 수급자의 소득 산정에는 반영되지 않는다고 안내돼 있어요.<\/p>\n<h3>겨울에는 어떻게 쓰나요?<\/h3>\n<div class=\"tw\"><table><thead><tr><th>방식<\/th><th>사용 시작<\/th><th>사용 가능한 에너지<\/th><\/tr><\/thead><tbody><tr><td>가상카드(요금 차감)<\/td><td>10월 1일<\/td><td>전기, 도시가스, 지역난방 중 택1<\/td><\/tr><tr><td>실물카드(국민행복카드)<\/td><td>10월 3일<\/td><td>전기, 도시가스, 등유, LPG, 연탄<\/td><\/tr><\/tbody><\/table><\/div>\n<p>둘 다 종료일은 2027년 5월 31일이에요. 가상카드는 발행되는 요금 고지서에서 금액이 차감되는 방식이라고 해요. 신청은 2026년 12월 31일까지 받는데, 누리집에는 10월 1~2일과 12월 말 2~3일은 포인트 생성 처리로 신청이 잠시 멈춘다고 나와 있어요. 늦게 신청했을 때 몇 월 고지서부터 차감되는지는 따로 안내돼 있지 않으니 통합 상담센터(1600-3190)에 물어보세요.<\/p>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/011/011_2_card.png\" alt=\"에너지바우처 한눈에 정리\"><\/figure>\n<h3>중복 지원은 안 돼요<\/h3>\n<p>같은 겨울에 긴급복지지원법에 따른 동절기 연료비(2026년 10월~2027년 3월), 한국광해광업공단의 연탄쿠폰, 연탄전환 에너지바우처를 받은 세대는 동절기 에너지바우처를 중복해서 받을 수 없다고 안내돼 있어요. 이미 다른 지원을 받고 있다면 읍·면·동 행정복지센터에서 어떻게 조정되는지 먼저 물어보세요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>수급자 조건과 세대원 특성 조건을 모두 충족해야 신청 가능<\/li><li>신청은 12월 31일까지, 사용은 2027년 5월 31일까지<\/li><li>가상카드는 요금 차감, 실물카드는 국민행복카드로 에너지 구입<\/li><\/ul>\n<p>대상과 금액은 해마다 달라지니 신청 전에 복지로나 에너지바우처 누리집에서 한 번 더 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 공식 화면 캡처 · 사진 2 자체 제작 카드 — 파일 images/posts/011/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래<\/td><td>에너지바우처 누리집(energyv.or.kr) 첫 화면 직접 캡처<\/td><td>공개 화면만, 캡처일 표기<\/td><\/tr><tr><td>금액 표 아래<\/td><td>복지로 신청 메뉴 화면<\/td><td>본인 신청 화면은 개인정보가 많으니 로그인 전 공개 화면만<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 신청 기간(~2026-12-31)과 신청 일시 중단 기간(10.1~10.2, 12월 말 2~3일)이 누리집 '지원 안내'와 같은지 확인<\/li><li class=\"cb\">☐ 연탄쿠폰 등 중복 조건 문장은 누리집 '지원금액' 각주(일부 금액만 지원되는 경우)와 어긋나지 않는지 확인<\/li><li class=\"cb\">☐ 소관 부처 표기(기후에너지환경부)가 발행 시점에도 맞는지 확인<\/li><li class=\"cb\">☐ 개인 신청 경험이 없다면 경험 문장을 쓰지 않기<\/li><li class=\"cb\">☐ 정책브리핑 카드뉴스 문장(공공누리 4유형)을 그대로 옮기지 않았는지 훑어보기<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>신청 대상, 신청 장소·기간, 금액, 사용 방식<\/td><td>대한민국 정책브리핑 정책뉴스(기후에너지환경부, 2026-06-17) <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148966678\" target=\"_blank\" rel=\"noopen  있어요. 에너지바우처 지원금은 수급자의 소득 산정에는 반영되지 않는다고 안내돼 있어요.\n\n겨울에는 어떻게 쓰나요?\n\n• 가상카드(요금 차감) — 사용 시작: 10월 1일 / 사용 가능한 에너지: 전기, 도시가스, 지역난방 중 택1\n• 실물카드(국민행복카드) — 사용 시작: 10월 3일 / 사용 가능한 에너지: 전기, 도시가스, 등유, LPG, 연탄\n\n둘 다 종료일은 2027년 5월 31일이에요. 가상카드는 발행되는 요금 고지서에서 금액이 차감되는 방식이라고 해요. 신청은 2026년 12월 31일까지 받는데, 누리집에는 10월 1~2일과 12월 말 2~3일은 포인트 생성 처리로 신청이 잠시 멈춘다고 나와 있어요. 늦게 신청했을 때 몇 월 고지서부터 차감되는지는 따로 안내돼 있지 않으니 통합 상담센터(1600-3190)에 물어보세요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/011/011_2_card.png\n\n중복 지원은 안 돼요\n\n같은 겨울에 긴급복지지원법에 따른 동절기 연료비(2026년 10월~2027년 3월), 한국광해광업공단의 연탄쿠폰, 연탄전환 에너지바우처를 받은 세대는 동절기 에너지바우처를 중복해서 받을 수 없다고 안내돼 있어요. 이미 다른 지원을 받고 있다면 읍·면·동 행정복지센터에서 어떻게 조정되는지 먼저 물어보세요.\n\n한눈에 정리\n\n- 수급자 조건과 세대원 특성 조건을 모두 충족해야 신청 가능\n- 신청은 12월 31일까지, 사용은 2027년 5월 31일까지\n- 가상카드는 요금 차감, 실물카드는 국민행복카드로 에너지 구입\n\n대상과 금액은 해마다 달라지니 신청 전에 복지로나 에너지바우처 누리집에서 한 번 더 확인해 주세요.", "copyAll": "아침저녁으로 쌀쌀해지면 슬슬 난방비 걱정이 시작되죠. 에너지바우처는 에너지 취약계층의 냉·난방비를 지원하는 제도인데, 올해는 동절기 사용이 10월부터 시작돼서 대상인지 먼저 확인해 보는 게 좋아요. 기후에너지환경부 정책브리핑과 에너지바우처 누리집 안내를 기준으로 세 단계로 나눠 봤습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/011/011_1_capture.png\n출처: 에너지바우처 누리집\n\n1단계. 소득 기준부터\n\n국민기초생활보장법에 따른 생계급여, 의료급여, 주거급여, 교육급여 수급자여야 해요. 이 조건이 기본이고, 다음 단계의 조건도 함께 충족해야 한다고 안내되어 있어요.\n\n2단계. 세대원 특성 기준\n\n주민등록등본상 본인이나 세대원 중 한 명이라도 아래에 해당해야 해요.\n\n- 노인: 1961년 12월 31일 이전 출생\n- 영유아: 2019년 1월 1일 이후 출생한 7세 이하 취학 전 아동\n- 장애인: 장애인복지법에 따라 등록한 사람\n- 임산부: 임신 중이거나 분만 후 6개월 미만인 여성\n- 중증질환자, 희귀질환자, 중증난치질환자\n- 한부모가족, 소년소녀가정\n- 다자녀 세대: 부 또는 모와 함께 사는 19세 미만 자녀가 2명 이상\n\n세대원 모두가 보장시설에서 급여를 받는 경우는 지원에서 제외된다고 해요.\n\n3단계. 신청과 금액\n\n신청 기간은 2026년 6월 15일부터 12월 31일까지예요. 읍·면·동 행정복지센터를 방문하거나 복지로에서 신청할 수 있고, 거동이 불편하면 대리 신청이나 공무원의 직권 신청도 가능해요. 문의는 에너지바우처 통합센터(1600-3190)에서 받아요.\n\n지원 금액은 세대원 수에 따라 달라요. 아래 금액은 올해 총액이고 월별 금액이 아니에요.\n\n• 1인 — 총 지원금액: 295,200원\n• 2인 — 총 지원금액: 407,500원\n• 3인 — 총 지원금액: 532,700원\n• 4인 이상 — 총 지원금액: 701,300원\n\n사용기간은 하절기와 동절기 구분 없이 2026년 7월 1일부터 2027년 5월 31일까지 자유롭게 쓸 수 있어요. 에너지바우처 지원금은 수급자의 소득 산정에는 반영되지 않는다  갱신일까?\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>무엇이 바뀌었을까?<\/b><\/span><\/p>\n<p>예전에는 갱신 대상이 되는 해의 1월 1일부터 12월 31일까지가 기간이었어요. 개정 후에는 갱신 대상이 되는 해의 생일을 기준으로 앞뒤 6개월씩, 모두 1년이에요. 공단은 연말에 시험장이 붐비는 현상을 줄이고 본인의 기한을 쉽게 알 수 있게 하려는 취지라고 설명했어요.<\/p>\n<p>다만 혼란을 막으려고 법 부칙에서 개정 전 면허 소지자의 첫 갱신에는 예전 기간도 함께 인정해 준다고 해요. 공단이 든 예시를 보면, 생일이 10월 1일인 올해 대상자는 개정 기준으로 2026년 4월 2일부터 2027년 4월 1일까지이고, 예전 기간까지 합치면 2026년 1월 1일부터 2027년 4월 1일까지 가능해요.<\/p>\n<p>정확한 내 기간은 안전운전 통합민원(safedriving.or.kr) 마이페이지나 경찰청 교통민원24(efine.go.kr)에서 확인하라고 안내돼 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>나는 적성검사일까, 갱신일까?<\/b><\/span><\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>구분<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>해야 하는 것<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>참고<\/b><\/td><\/tr><tr><td>1종 면허<\/td><td>정기 적성검사<\/td><td>신체검사 필요<\/td><\/tr><tr><td>2종 면허(70세 미만)<\/td><td>면허 갱신<\/td><td>신체검사 불필요<\/td><\/tr><tr><td>70세 이상 2종 면허<\/td><td>적성검사<\/td><td>갱신 때 적성검사 의무<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p>주기는 2011년 12월 9일 이후 취득·갱신한 분이 10년, 65세 이상이면 5년, 75세 이상이면 3년이에요. 75세 이상은 고령운전자 교육 대상이라는 점도 함께 안내돼 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>어디서 무엇을 준비할까?<\/b><\/span><\/p>\n<ul><li>장소: 전국 운전면허시험장이나 경찰서 교통민원실이에요. 강남경찰서는 이 업무를 하지 않아서 강남면허시험장을 이용해야 해요.<\/li><li>준비물: 운전면허증과 6개월 이내 촬영한 3.5×4.5cm 컬러 사진이에요. 1종 적성검사는 2매, 건강검진 결과나 진단서로 신체검사를 대신하면 1매, 2종 갱신은 1매로 안내돼 있어요.<\/li><li>수수료: 적성검사는 일반 16,000원, 모바일 IC 21,000원이고 신체검사비는 별도예요. 2종 갱신은 일반 10,000원, 모바일 IC 15,000원이에요. 시험장 안의 신체검사비는 1종 대형·특수 8,000원, 그 밖의 면허 7,000원이라고 해요. 금액은 바뀔 수 있으니 방문 전에 공단 안내를 한 번 더 확인하세요.<\/li><li>신체검사 대신: 국민건강보험공단 건강검진 결과가 신청일 2년 이내라면 행정정보공동이용 동의로 갈음할 수 있어요(1종 보통·2종). 검진 후 약 15일 뒤부터 자료가 제공된다고 해요.<\/li><\/ul>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>기간을 놓치면 어떻게 될까?<\/b><\/span><\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>상황<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>과태료<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>그 밖의 내용<\/b><\/td><\/tr><tr><td>1종 적성검사 기간 경과<\/td><td>3만 원<\/td><td>만료일 다음 날부터 1년이 지나면 면허취소<\/td><\/tr><tr><td>2종 갱신 기간 경과<\/td><td>2만 원<\/td><td>갱신 미필 사유의 정지·취소 처분은 2011.12.9. 이후 폐지<\/td><\/tr><tr><td>70세 이상 2종 적성검사 대상<\/td><td>3만 원<\/td><td>만료일 다음 날부터 1년이 지나면 면허취소(면허증에 '적성검사 기간'이라고 표시된 경우)<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/010/010_2_card.png\" alt=\"기간을 놓치면?\" width=\"720\"><\/p>\n<p>과태료를 내지 않으면 가산금 3%에 매달 중가산금 1.2%가 붙어 최대 75%까지 늘어난다고 공단이 안내하고 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>사정이 있을 때는 연기 신청<\/b><\/span><\/p>\n<p>해외 체류, 입원, 군 입대, 수감처럼 기간 안에 갱신하기 어려운 사유가 있으면 연기 신청이 가능하고, 사유가 없어진 날부터 3개월 안에 갱신하면 된다고 해요. 입원이면 퇴원일, 해외 출국이면 귀국일이 기준이에요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>기간은 갱신 대상 해의 생일 전후 6개월, 개정 전 면허는 예전 기간도 함께 인정<\/li><li>1종과 70세 이상 2종은 적성검사, 그 외 2종은 갱신<\/li><li>놓치면 과태료 2만~3만 원, 1년을 넘기면 취소될 수 있는 경우가 있음<\/li><\/ul>\n<p>수수료와 절차는 바뀔 수 있으니 방문 전에 공단 고객센터(1577-1120)나 안전운전 통합민원에서 다시 확인해 주세요.<\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/010/010_0_thumb.png\n\n운전면허증 뒷면에 적힌 갱신 기간, 그대로 믿고 계셨나요? 2026년 1월 1일부터 도로교통법이 바뀌어서, 예전 면허증에 표시된 기간과 법에서 정한 실제 기간이 다를 수 있어요. 한국도로교통공단 안내를 기준으로 달라진 점과 챙길 것을 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/010/010_1_card.png\n\n무엇이 바뀌었을까?\n\n예전에는 갱신 대상이 되는 해의 1월 1일부터 12월 31일까지가 기간이었어요. 개정 후에는 갱신 대상이 되는 해의 생일을 기준으로 앞뒤 6개월씩, 모두 1년이에요. 공단은 연말에 시험장이 붐비는 현상을 줄이고 본인의 기한을 쉽게 알 수 있게 하려는 취지라고 설명했어요.\n\n다만 혼란을 막으려고 법 부칙에서 개정 전 면허 소지자의 첫 갱신에는 예전 기간도 함께 인정해 준다고 해요. 공단이 든 예시를 보면, 생일이 10월 1일인 올해 대상자는 개정 기준으로 2026년 4월 2일부터 2027년 4월 1일까지이고, 예전 기간까지 합치면 2026년 1월 1일부터 2027년 4월 1일까지 가능해요.\n\n정확한 내 기간은 안전운전 통합민원(safedriving.or.kr) 마이페이지나 경찰청 교통민원24(efine.go.kr)에서 확인하라고 안내돼 있어요.\n\n나는 적성검사일까, 갱신일까?\n\n• 1종 면허 — 해야 하는 것: 정기 적성검사 / 참고: 신체검사 필요\n• 2종 면허(70세 미만) — 해야 하는 것: 면허 갱신 / 참고: 신체검사 불필요\n• 70세 이상 2종 면허 — 해야 하는 것: 적성검사 / 참고: 갱신 때 적성검사 의무\n\n주기는 2011년 12월 9일 이후 취득·갱신한 분이 10년, 65세 이상이면 5년, 75세 이상이면 3년이에요. 75세 이상은 고령운전자 교육 대상이라는 점도 함께 안내돼 있어요.\n\n어디서 무엇을 준비할까?\n\n- 장소: 전국 운전면허시험장이나 경찰서 교통민원실이에요. 강남경찰서는 이 업무를 하지 않아서 강남면허시험장을 이용해야 해요.\n- 준비물: 운전면허증과 6개월 이내 촬영한 3.5×4.5cm 컬러 사진이에요. 1종 적성검사는 2매, 건강검진 결과나 진단서로 신체검사를 대신하면 1매, 2종 갱신은 1매로 안내돼 있어요.\n- 수수료: 적성검사는 일반 16,000원, 모바일 IC 21,000원이고 신체검사비는 별도예요. 2종 갱신은 일반 10,000원, 모바일 IC 15,000원이에요. 시험장 안의 신체검사비는 1종 대형·특수 8,000원, 그 밖의 면허 7,000원이라고 해요. 금액은 바뀔 수 있으니 방문 전에 공단 안내를 한 번 더 확인하세요.\n- 신체검사 대신: 국민건강보험공단 건강검진 결과가 신청일 2년 이내라면 행정정보공동이용 동의로 갈음할 수 있어요(1종 보통·2종). 검진 후 약 15일 뒤부터 자료가 제공된다고 해요.\n\n기간을 놓치면 어떻게 될까?\n\n• 1종 적성검사 기간 경과 — 과태료: 3만 원 / 그 밖의 내용: 만료일 다음 날부터 1년이 지나면 면허취소\n• 2종 갱신 기간 경과 — 과태료: 2만 원 / 그 밖의 내용: 갱신 미필 사유의 정지·취소 처분은 2011.12.9. 이후 폐지\n• 70세 이상 2종 적성검사 대상 — 과태료: 3만 원 / 그 밖의 내용: 만료일 다음 날부터 1년이 지나면 면허취소(면허증에 '적성검사 기간'이라고 표시된 경우)\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/010/010_2_card.png\n\n과태료를 내지 않으면 가산금 3%에 매달 중가산금 1.2%가 붙어 최대 75%까지 늘어난다고 공단이 안내하고 있어요.\n\n사정이 있을 때는 연기 신청\n\n해외 체류, 입원, 군 입대, 수감처럼 기간 안에 갱신하기 어려운 사유가 있으면 연기 신청이 가능하고, 사유가 없어진 날부터 3개월 안에 갱신하면 된다고 해요. 입원이면 퇴원일, 해외 출국이면 귀국일이 기준이에요.\n\n한눈에 정리\n\n- 기간은 갱신 대상 해의 생일 전후 6개월, 개정 전 면허는 예전 기간도 함께 인정\n- 1종과 70세 이상 2종은 적성검사, 그 외 2종은 갱신\n- 놓치면 과태료 2만~3만 원, 1년을 넘기면 취소될 수 있는 경우가 있음\n\n수수료와 절차는 바뀔 수 있으니 방문 전에 공단 고객센터(1577-1120)나 안전운전 통합민원에서 다시 확인해 주세요.", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/010/010_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/010/010_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "010_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/010/010_1_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/010/010_1_card.png", "cap": "", "alt": "나는 적성검사일까, 갱신일까?", "name": "010_1_card.png", "w": 1080, "h": 860}, {"n": 2, "label": "사진 2", "uri": "img/010/010_2_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/010/010_2_card.png", "cap": "", "alt": "기간을 놓치면?", "name": "010_2_card.png", "w": 1080, "h": 904}], "zip": "img/010/010_images.zip", "html": "<figure class=\"ph thumbfig\" data-n=\"0\"><img src=\"img/010/010_0_thumb.png\" alt=\"대표 이미지\"><\/figure>\n<p>운전면허증 뒷면에 적힌 갱신 기간, 그대로 믿고 계셨나요? 2026년 1월 1일부터 도로교통법이 바뀌어서, 예전 면허증에 표시된 기간과 법에서 정한 실제 기간이 다를 수 있어요. 한국도로교통공단 안내를 기준으로 달라진 점과 챙길 것을 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<figure class=\"ph\" data-n=\"1\"><img loading=\"lazy\" src=\"img/010/010_1_card.png\" alt=\"나는 적성검사일까, 갱신일까?\"><\/figure>\n<h3>무엇이 바뀌었을까?<\/h3>\n<p>예전에는 갱신 대상이 되는 해의 1월 1일부터 12월 31일까지가 기간이었어요. 개정 후에는 갱신 대상이 되는 해의 생일을 기준으로 앞뒤 6개월씩, 모두 1년이에요. 공단은 연말에 시험장이 붐비는 현상을 줄이고 본인의 기한을 쉽게 알 수 있게 하려는 취지라고 설명했어요.<\/p>\n<p>다만 혼란을 막으려고 법 부칙에서 개정 전 면허 소지자의 첫 갱신에는 예전 기간도 함께 인정해 준다고 해요. 공단이 든 예시를 보면, 생일이 10월 1일인 올해 대상자는 개정 기준으로 2026년 4월 2일부터 2027년 4월 1일까지이고, 예전 기간까지 합치면 2026년 1월 1일부터 2027년 4월 1일까지 가능해요.<\/p>\n<p>정확한 내 기간은 안전운전 통합민원(safedriving.or.kr) 마이페이지나 경찰청 교통민원24(efine.go.kr)에서 확인하라고 안내돼 있어요.<\/p>\n<h3>나는 적성검사일까, 갱신일까?<\/h3>\n<div class=\"tw\"><table><thead><tr><th>구분<\/th><th>해야 하는 것<\/th><th>참고<\/th><\/tr><\/thead><tbody><tr><td>1종 면허<\/td><td>정기 적성검사<\/td><td>신체검사 필요<\/td><\/tr><tr><td>2종 면허(70세 미만)<\/td><td>면허 갱신<\/td><td>신체검사 불필요<\/td><\/tr><tr><td>70세 이상 2종 면허<\/td><td>적성검사<\/td><td>갱신 때 적성검사 의무<\/td><\/tr><\/tbody><\/table><\/div>\n<p>주기는 2011년 12월 9일 이후 취득·갱신한 분이 10년, 65세 이상이면 5년, 75세 이상이면 3년이에요. 75세 이상은 고령운전자 교육 대상이라는 점도 함께 안내돼 있어요.<\/p>\n<h3>어디서 무엇을 준비할까?<\/h3>\n<ul><li>장소: 전국 운전면허시험장이나 경찰서 교통민원실이에요. 강남경찰서는 이 업무를 하지 않아서 강남면허시험장을 이용해야 해요.<\/li><li>준비물: 운전면허증과 6개월 이내 촬영한 3.5×4.5cm 컬러 사진이에요. 1종 적성검사는 2매, 건강검진 결과나 진단서로 신체검사를 대신하면 1매, 2종 갱신은 1매로 안내돼 있어요.<\/li><li>수수료: 적성검사는 일반 16,000원, 모바일 IC 21,000원이고 신체검사비는 별도예요. 2종 갱신은 일반 10,000원, 모바일 IC 15,000원이에요. 시험장 안의 신체검사비는 1종 대형·특수 8,000원, 그 밖의 면허 7,000원이라고 해요. 금액은 바뀔 수 있으니 방문 전에 공단 안내를 한 번 더 확인하세요.<\/li><li>신체검사 대신: 국민건강보험공단 건강검진 결과가 신청일 2년 이내라면 행정정보공동이용 동의로 갈음할 수 있어요(1종 보통·2종). 검진 후 약 15일 뒤부터 자료가 제공된다고 해요.<\/li><\/ul>\n<h3>기간을 놓치면 어떻게 될까?<\/h3>\n<div class=\"tw\"><table><thead><tr><th>상황<\/th><th>과태료<\/th><th>그 밖의 내용<\/th><\/tr><\/thead><tbody><tr><td>1종 적성검사 기간 경과<\/td><td>3만 원<\/td><td>만료일 다음 날부터 1년이 지나면 면허취소<\/td><\/tr><tr><td>2종 갱신 기간 경과<\/td><td>2만 원<\/td><td>갱신 미필 사유의 정지·취소 처분은 2011.12.9. 이후 폐지<\/td><\/tr><tr><td>70세 이상 2종 적성검사 대상<\/td><td>3만 원<\/td><td>만료일 다음 날부터 1년이 지나면 면허취소(면허증에 '적성검사 기간'이라고 표시된 경우)<\/td><\/tr><\/tbody><\/table><\/div>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/010/010_2_card.png\" alt=\"기간을 놓치면?\"><\/figure>\n<p>과태료를 내지 않으면 가산금 3%에 매달 중가산금 1.2%가 붙어 최대 75%까지 늘어난다고 공단이 안내하고 있어요.<\/p>\n<h3>사정이 있을 때는 연기 신청<\/h3>\n<p>해외 체류, 입원, 군 입대, 수감처럼 기간 안에 갱신하기 어려운 사유가 있으면 연기 신청이 가능하고, 사유가 없어진 날부터 3개월 안에 갱신하면 된다고 해요. 입원이면 퇴원일, 해외 출국이면 귀국일이 기준이에요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>기간은 갱신 대상 해의 생일 전후 6개월, 개정 전 면허는 예전 기간도 함께 인정<\/li><li>1종과 70세 이상 2종은 적성검사, 그 외 2종은 갱신<\/li><li>놓치면 과태료 2만~3만 원, 1년을 넘기면 취소될 수 있는 경우가 있음<\/li><\/ul>\n<p>수수료와 절차는 바뀔 수 있으니 방문 전에 공단 고객센터(1577-1120)나 안전운전 통합민원에서 다시 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 자체 제작 카드 · 사진 2 자체 제작 카드 — 파일 images/posts/010/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래<\/td><td>안전운전 통합민원 '정기적성검사/면허갱신' 안내 화면 직접 캡처<\/td><td>공개 안내 화면만. 마이페이지 화면은 개인정보가 있어 캡처 금지<\/td><\/tr><tr><td>준비물 문단<\/td><td>직접 찍은 면허시험장 안내 표지판 등(있는 경우)<\/td><td>사람 얼굴·차량번호 제외<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 수수료(적성검사 16,000/21,000원·갱신 10,000/15,000원·신체검사비 7,000/8,000원)가 공단 안내와 같은지 발행 직전 확인(2026-10-05 공단 안내 검색 요약으로 재확인함)<\/li><li class=\"cb\">☐ 안전운전 통합민원 안내의 과태료·취소 문구가 본문 표와 같은지 확인<\/li><li class=\"cb\">☐ 본인 갱신을 직접 해 본 경험이 있을 때만 경험 문장 추가 (없으면 공식 안내 기준 유지)<\/li><li class=\"cb\">☐ 도로교통법상 과태료 상한(20만 원 이하 등)과 공단의 실제 안내 금액을 혼동해서 쓰지 않기. 본문은 공단 안내 금액만 사용<\/li><li class=\"cb\">☐ 자신의 면허 번호·갱신 기간이 보이는 화면은 공개하지 않기<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>대상, 주기, 신청 장소, 준비물, 수수료, 건강검진내역서 활용, 과태료·취소·가산금, 연기 신청<\/td><td>한국도로교통공단 안전운전 통합민원 <a href=\"https://www.safedriving.or.kr/guide/larGuide011.do?menuCode=MN-PO-1211\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.safedriving.or.kr/guide/larGuide011.do?menuCode=MN-PO-1211<\/a><\/td><td>공식<\/td><\/tr><tr><td>생일 전후 6개월 개정 취지, 예시(생일 10월 1일)<\/td><td>연합뉴스 2026-01-12(공단 발표 인용) <a href=\"https://www.yna.co.kr/view/AKR20260112056000062\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.yna.co.kr/view/AKR20260112056000062<\/a><\/td><td>언론(공식 발표 인용)<\/td><\/tr><tr><td>법적 근거 (도로교통법 제87조)<\/td><td>국가법령정보센터 <a href=\"https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1025450551\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1025450551<\/a><\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "운전면허증 뒷면에 적힌 갱신 기간, 그대로 믿고 계셨나요? 2026년 1월 1일부터 도로교통법이 바뀌어서, 예전 면허증에 표시된 기간과 법에서 정한 실제 기간이 다를 수 있어요. 한국도로교통공단 안내를 기준으로 달라진 점과 챙길 것을 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/010/010_1_card.png\n\n무엇이 바뀌었을까?\n\n예전에는 갱신 대상이 되는 해의 1월 1일부터 12월 31일까지가 기간이었어요. 개정 후에는 갱신 대상이 되는 해의 생일을 기준으로 앞뒤 6개월씩, 모두 1년이에요. 공단은 연말에 시험장이 붐비는 현상을 줄이고 본인의 기한을 쉽게 알 수 있게 하려는 취지라고 설명했어요.\n\n다만 혼란을 막으려고 법 부칙에서 개정 전 면허 소지자의 첫 갱신에는 예전 기간도 함께 인정해 준다고 해요. 공단이 든 예시를 보면, 생일이 10월 1일인 올해 대상자는 개정 기준으로 2026년 4월 2일부터 2027년 4월 1일까지이고, 예전 기간까지 합치면 2026년 1월 1일부터 2027년 4월 1일까지 가능해요.\n\n정확한 내 기간은 안전운전 통합민원(safedriving.or.kr) 마이페이지나 경찰청 교통민원24(efine.go.kr)에서 확인하라고 안내돼 있어요.\n\n나는 적성검사일까, 갱신일까?\n\n• 1종 면허 — 해야 하는 것: 정기 적성검사 / 참고: 신체검사 필요\n• 2종 면허(70세 미만) — 해야 하는 것: 면허 갱신 / 참고: 신체검사 불필요\n• 70세 이상 2종 면허 — 해야 하는 것: 적성검사 / 참고: 갱신 때 적성검사 의무\n\n주기는 2011년 12월 9일 이후 취득·갱신한 분이 10년, 65세 이상이면 5년, 75세 이상이면 3년이에요. 75세 이상은 고령운전자 교육 대상이라는 점도 함께 안내돼 있어요.\n\n어디서 무엇을 준비할까?\n\n- 장소: 전국 운전면허시험장이나 경찰서 교통민원실이에요. 강남경찰서는 이 업무를 하지 않아서 강남면허시험장을 이용해야 해요.\n- 준비물: 운전면허증과 6개월 이내 촬영한 3.5×4.5cm 컬러 사진이에요. 1종 적성검사는 2매, 건강검진 결과나 진단서로 신체검사를 대신하면 1매, 2종 갱신은 1매로 안내돼 있어요.\n- 수수료: 적성검사는 일반 16,000원, 모바일 IC 21,000원이고 신체검사비는 별도예요. 2종 갱신은 일반 10,000원, 모바일 IC 15,000원이에요. 시험장 안의 신체검사비는 1종 대형·특수 8,000원, 그 밖의 면허 7,000원이라고 해요. 금액은 바뀔 수 있으니 방문 전에 공단 안내를 한 번 더 확인하세요.\n- 신체검사 대신: 국민건강보험공단 건강검진 결과가 신청일 2년 이내라면 행정정보공동이용 동의로 갈음할 수 있어요(1종 보통·2종). 검진 후 약 15일 뒤부터 자료가 제공된다고 해요.\n\n기간을 놓치면 어떻게 될까?\n\n• 1종 적성검사 기간 경과 — 과태료: 3만 원 / 그 밖의 내용: 만료일 다음 날부터 1년이 지나면 면허취소\n• 2종 갱신 기간 경과 — 과태료: 2만 원 / 그 밖의 내용: 갱신 미필 사유의 정지·취소 처분은 2011.12.9. 이후 폐지\n• 70세 이상 2종 적성검사 대상 — 과태료: 3만 원 / 그 밖의 내용: 만료일 다음 날부터 1년이 지나면 면허취소(면허증에 '적성검사 기간'이라고 표시된 경우)\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/010/010_2_card.png\n\n과태료를 내지 않으면 가산금 3%에 매달 중가산금 1.2%가 붙어 최대 75%까지 늘어난다고 공단이 안내하고 있어요.\n\n사정이 있을 때는 연기 신청\n\n해외 체류, 입원, 군 입대, 수감처럼 기간 안에 갱신하기 어려운 사유가 있으면 연기 신청이 가능하고, 사유가 없어진 날부터 3개월 안에 갱신하면 된다고 해요. 입원이면 퇴원일, 해외 출국이면 귀국일이 기준이에요.\n\n한눈에 정리\n\n- 기간은 갱신 대상 해의 생일 전후 6개월, 개정 전 면허는 예전 기간도 함께 인정\n- 1종과 70세 이상 2종은 적성검사, 그 외 2종은 갱신\n- 놓치면 과태료 2만~3만 원, 1년을 넘기면 취소될 수 있는 경우가 있음\n\n수수료와 절차는 바뀔 수 있으니 방문 전에 공단 고객센터(1577-1120)나 안전운전 통합민원에서 다시 확인해 주세요.", "copyAll": "운전면허증 뒷면에 적힌 갱신 기간, 그대로 믿고 계셨나요? 2026년 1월 1일부터 도로교통법이 바뀌어서, 예전 면허증에 표시된 기간과 법에서 정한 실제 기간이 다를 수 있어요. 한국도로교통공단 안내를 기준으로 달라진 점과 챙길 것을 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/010/010_1_card.png\n\n무엇이 바뀌었을까?\n\n예전에는 갱신 대상이 되는 해의 1월 1일부터 12월 31일까지가 기간이었어요. 개정 후에는 갱신 대상이 되는 해의 생일을 기준으로 앞뒤 6개월씩, 모두 1년이에요. 공단은 연말에 시  이상 2종은 적성검사, 그 외 2종은 갱신 - 놓치면 과태료 2만~3만 원, 1년을 넘기면 취소될 수 있는 경우가 있음 수수료와 절차는 바뀔 수 있으니 방문 전에 공단 고객센터(1577-1120)나 안전운전 통합민원에서 다시 확인해 주세요. 네이버"}, {"id": "009", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "009_nps-expected-pension.md", "title": "내 국민연금 나중에 얼마 받을까? '예상연금액 조회'와 '내 연금 알아보기' 차이", "cands": ["국민연금 예상 수령액, 인터넷 예시 말고 내 숫자로 확인하는 두 가지 공식 방법", "국민연금만 볼까, 퇴직연금·개인연금까지 볼까? 연금 조회 서비스 비교 (2026년)", "노령연금은 몇 살부터? 출생연도별 수급 시작 나이와 예상연금 조회 순서"], "cat": "세금·연금", "kw": ["국민연금", "예상연금액", "내 연금 알아보기", "노령연금", "노후준비서비스"], "summary": "국민연금 예상연금액 조회와 노후준비서비스의 '내 연금 알아보기'가 무엇이 다른지, 어떤 가정으로 계산되는지, 수급 시작 나이와 함께 정리", "status": "초안", "created": "2026-10-05 12:22", "base": "2026-10-05", "need": 0, "chars": 1807, "chars_ns": 1405, "imgs": 3, "slots": 2, "filled": 2, "thumb": "img/009/009_0_thumb.png", "seHtml": "<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/009/009_0_thumb.png\" alt=\"대표 이미지\" width=\"720\"><\/p>\n<p>국민연금을 나중에 얼마 받는지 검색해 보면 글마다 숫자가 달라서 더 헷갈리죠. 사람마다 가입 기간과 소득이 다르니 당연한 일인데요, 정작 내 숫자를 보여 주는 공식 조회 서비스가 두 갈래라서 어디서 무엇을 볼 수 있는지부터 비교해 봤어요. 국민연금공단과 정부24 안내를 바탕으로 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/009/009_1_card.png\" alt=\"예상연금액 조회 vs 내 연금 알아보기\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>두 서비스를 나란히 놓고 보면<\/b><\/span><\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>구분<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>예상연금액 조회<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>내 연금 알아보기<\/b><\/td><\/tr><tr><td>운영<\/td><td>국민연금공단 홈페이지·앱<\/td><td>NPS 중앙노후준비지원센터(csa.nps.or.kr)<\/td><\/tr><tr><td>보여 주는 것<\/td><td>국민연금의 예상 노령연금 (만 60세 이후 받을 금액)<\/td><td>국민연금, 공무원·사학·군인·별정우체국연금, 농지연금, 개인연금, 퇴직연금, 주택연금<\/td><\/tr><tr><td>로그인<\/td><td>공동인증서 등 본인 인증<\/td><td>공동인증서 로그인<\/td><\/tr><tr><td>특이점<\/td><td>소득·가입기간을 직접 넣어 보는 모의계산도 있음<\/td><td>개인연금·퇴직연금은 신청 후 3영업일 뒤부터 조회<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p>국민연금만 궁금하면 왼쪽, 내가 가진 연금을 한꺼번에 보고 싶다면 오른쪽이 맞아요. 오른쪽은 제3자 정보제공 동의와 개인정보 수집·이용 동의를 거치는 구조라고 안내되어 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>예상연금액은 어떤 가정으로 계산될까?<\/b><\/span><\/p>\n<p>정부24의 서비스 안내에는 다음과 같은 가정이 적혀 있어요.<\/p>\n<ul><li>사업장가입자와 지역(임의)가입자는 지금의 소득으로 만 60세까지 보험료를 낸다고 가정해요.<\/li><li>납부예외 중이거나 자격을 잃은 상태라면 지금까지 낸 내역만으로 계산해요.<\/li><li>결과는 '현재가치 기준'과 '미래가치 기준' 두 가지로 나와요. 미래가치는 소득이 가정된 상승률로 오른다고 보고 연금을 받을 때의 화폐가치로 계산한 값이라 실제 금액과 차이가 날 수 있어요.<\/li><li>법령이 바뀌면 예상 금액도 달라질 수 있어요.<\/li><\/ul>\n<p>상세 조회에서는 부양가족 연금 대상, 지급 희망 연령, 앞으로 낼 소득을 직접 골라 비교해 볼 수 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>몇 살부터 받을 수 있을까?<\/b><\/span><\/p>\n<p>가입 기간이 10년 이상이면 출생연도별 지급개시 연령부터 노령연금을 받을 수 있어요.<\/p>\n<ul><li>1961~1964년생: 63세<\/li><li>1965~1968년생: 64세<\/li><li>1969년생 이후: 65세<\/li><\/ul>\n<p>소득 있는 업무에 종사하지 않는다면 최대 5년 먼저 받는 조기노령연금도 있는데, 청구 연령에 따라 70%에서 99.5%를 받는다고 해요. 반대로 연기연금은 최대 5년까지 늦출 수 있고, 연기한 한 달마다 0.6%가 더해진다고 공단이 안내하고 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>2026년에는 이런 점도 있어요<\/b><\/span><\/p>\n<p>공단 FAQ에는 2025년 연금개혁에 따라 2026년부터 기본연금액 계산식이 달라졌다고 나와요. 그래서 예전 글에 있는 계산 예시는 지금 기준과 다를 수 있어요. 참고로 2025년 12월 기준 가입 20년 이상인 분들의 노령연금 평균 수령액이 월 113만 원 정도라는 통계도 공단이 공개했는데, 내가 받을 금액이 아니라 전체 평균 참고치예요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>조회하는 순서<\/b><\/span><\/p>\n<ol><li>국민연금공단 홈페이지나 '내 곁에 국민연금' 앱에서 본인 인증으로 로그인해요.<\/li><li>예상연금액을 확인하고, 필요하면 모의계산으로 소득이나 가입 기간을 바꿔 봐요.<\/li><li>퇴직연금·개인연금까지 보고 싶다면 중앙노후준비지원센터에서 '내 연금 알아보기'를 신청하고 3영업일 뒤 다시 들어가 조회해요.<\/li><\/ol>\n<p>문의는 국민연금공단 1355(유료)로 하면 돼요.<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/009/009_2_card.png\" alt=\"국민연금 예상액 한눈에 정리\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>국민연금만 보려면 예상연금액 조회, 연금 전체를 보려면 내 연금 알아보기<\/li><li>결과는 가정에 기반한 예상치라서 실제 수령액과 다를 수 있음<\/li><li>지급개시 연령은 1969년생부터 65세<\/li><\/ul>\n<p>조회 화면과 계산 기준은 해마다 바뀔 수 있으니 공단 안내를 한 번 더 확인해 주세요.<\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/009/009_0_thumb.png\n\n국민연금을 나중에 얼마 받는지 검색해 보면 글마다 숫자가 달라서 더 헷갈리죠. 사람마다 가입 기간과 소득이 다르니 당연한 일인데요, 정작 내 숫자를 보여 주는 공식 조회 서비스가 두 갈래라서 어디서 무엇을 볼 수 있는지부터 비교해 봤어요. 국민연금공단과 정부24 안내를 바탕으로 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/009/009_1_card.png\n\n두 서비스를 나란히 놓고 보면\n\n• 운영 — 예상연금액 조회: 국민연금공단 홈페이지·앱 / 내 연금 알아보기: NPS 중앙노후준비지원센터(csa.nps.or.kr)\n• 보여 주는 것 — 예상연금액 조회: 국민연금의 예상 노령연금 (만 60세 이후 받을 금액) / 내 연금 알아보기: 국민연금, 공무원·사학·군인·별정우체국연금, 농지연금, 개인연금, 퇴직연금, 주택연금\n• 로그인 — 예상연금액 조회: 공동인증서 등 본인 인증 / 내 연금 알아보기: 공동인증서 로그인\n• 특이점 — 예상연금액 조회: 소득·가입기간을 직접 넣어 보는 모의계산도 있음 / 내 연금 알아보기: 개인연금·퇴직연금은 신청 후 3영업일 뒤부터 조회\n\n국민연금만 궁금하면 왼쪽, 내가 가진 연금을 한꺼번에 보고 싶다면 오른쪽이 맞아요. 오른쪽은 제3자 정보제공 동의와 개인정보 수집·이용 동의를 거치는 구조라고 안내되어 있어요.\n\n예상연금액은 어떤 가정으로 계산될까?\n\n정부24의 서비스 안내에는 다음과 같은 가정이 적혀 있어요.\n\n- 사업장가입자와 지역(임의)가입자는 지금의 소득으로 만 60세까지 보험료를 낸다고 가정해요.\n- 납부예외 중이거나 자격을 잃은 상태라면 지금까지 낸 내역만으로 계산해요.\n- 결과는 '현재가치 기준'과 '미래가치 기준' 두 가지로 나와요. 미래가치는 소득이 가정된 상승률로 오른다고 보고 연금을 받을 때의 화폐가치로 계산한 값이라 실제 금액과 차이가 날 수 있어요.\n- 법령이 바뀌면 예상 금액도 달라질 수 있어요.\n\n상세 조회에서는 부양가족 연금 대상, 지급 희망 연령, 앞으로 낼 소득을 직접 골라 비교해 볼 수 있어요.\n\n몇 살부터 받을 수 있을까?\n\n가입 기간이 10년 이상이면 출생연도별 지급개시 연령부터 노령연금을 받을 수 있어요.\n\n- 1961~1964년생: 63세\n- 1965~1968년생: 64세\n- 1969년생 이후: 65세\n\n소득 있는 업무에 종사하지 않는다면 최대 5년 먼저 받는 조기노령연금도 있는데, 청구 연령에 따라 70%에서 99.5%를 받는다고 해요. 반대로 연기연금은 최대 5년까지 늦출 수 있고, 연기한 한 달마다 0.6%가 더해진다고 공단이 안내하고 있어요.\n\n2026년에는 이런 점도 있어요\n\n공단 FAQ에는 2025년 연금개혁에 따라 2026년부터 기본연금액 계산식이 달라졌다고 나와요. 그래서 예전 글에 있는 계산 예시는 지금 기준과 다를 수 있어요. 참고로 2025년 12월 기준 가입 20년 이상인 분들의 노령연금 평균 수령액이 월 113만 원 정도라는 통계도 공단이 공개했는데, 내가 받을 금액이 아니라 전체 평균 참고치예요.\n\n조회하는 순서\n\n1. 국민연금공단 홈페이지나 '내 곁에 국민연금' 앱에서 본인 인증으로 로그인해요.\n2. 예상연금액을 확인하고, 필요하면 모의계산으로 소득이나 가입 기간을 바꿔 봐요.\n3. 퇴직연금·개인연금까지 보고 싶다면 중앙노후준비지원센터에서 '내 연금 알아보기'를 신청하고 3영업일 뒤 다시 들어가 조회해요.\n\n문의는 국민연금공단 1355(유료)로 하면 돼요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/009/009_2_card.png\n\n한눈에 정리\n\n- 국민연금만 보려면 예상연금액 조회, 연금 전체를 보려면 내 연금 알아보기\n- 결과는 가정에 기반한 예상치라서 실제 수령액과 다를 수 있음\n- 지급개시 연령은 1969년생부터 65세\n\n조회 화면과 계산 기준은 해마다 바뀔 수 있으니 공단 안내를 한 번 더 확인해 주세요.", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/009/009_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/009/009_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "009_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/009/009_1_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/009/009_1_card.png", "cap": "", "alt": "예상연금액 조회 vs 내 연금 알아보기", "name": "009_1_card.png", "w": 1080, "h": 1103}, {"n": 2, "label": "사진 2", "uri": "img/009/009_2_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/009/009_2_card.png", "cap": "", "alt": "국민연금 예상액 한눈에 정리", "name": "009_2_card.png", "w": 1080, "h": 816}], "zip": "img/009/009_images.zip", "html": "<figure class=\"ph thumbfig\" data-n=\"0\"><img src=\"img/009/009_0_thumb.png\" alt=\"대표 이미지\"><\/figure>\n<p>국민연금을 나중에 얼마 받는지 검색해 보면 글마다 숫자가 달라서 더 헷갈리죠. 사람마다 가입 기간과 소득이 다르니 당연한 일인데요, 정작 내 숫자를 보여 주는 공식 조회 서비스가 두 갈래라서 어디서 무엇을 볼 수 있는지부터 비교해 봤어요. 국민연금공단과 정부24 안내를 바탕으로 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<figure class=\"ph\" data-n=\"1\"><img loading=\"lazy\" src=\"img/009/009_1_card.png\" alt=\"예상연금액 조회 vs 내 연금 알아보기\"><\/figure>\n<h3>두 서비스를 나란히 놓고 보면<\/h3>\n<div class=\"tw\"><table><thead><tr><th>구분<\/th><th>예상연금액 조회<\/th><th>내 연금 알아보기<\/th><\/tr><\/thead><tbody><tr><td>운영<\/td><td>국민연금공단 홈페이지·앱<\/td><td>NPS 중앙노후준비지원센터(csa.nps.or.kr)<\/td><\/tr><tr><td>보여 주는 것<\/td><td>국민연금의 예상 노령연금 (만 60세 이후 받을 금액)<\/td><td>국민연금, 공무원·사학·군인·별정우체국연금, 농지연금, 개인연금, 퇴직연금, 주택연금<\/td><\/tr><tr><td>로그인<\/td><td>공동인증서 등 본인 인증<\/td><td>공동인증서 로그인<\/td><\/tr><tr><td>특이점<\/td><td>소득·가입기간을 직접 넣어 보는 모의계산도 있음<\/td><td>개인연금·퇴직연금은 신청 후 3영업일 뒤부터 조회<\/td><\/tr><\/tbody><\/table><\/div>\n<p>국민연금만 궁금하면 왼쪽, 내가 가진 연금을 한꺼번에 보고 싶다면 오른쪽이 맞아요. 오른쪽은 제3자 정보제공 동의와 개인정보 수집·이용 동의를 거치는 구조라고 안내되어 있어요.<\/p>\n<h3>예상연금액은 어떤 가정으로 계산될까?<\/h3>\n<p>정부24의 서비스 안내에는 다음과 같은 가정이 적혀 있어요.<\/p>\n<ul><li>사업장가입자와 지역(임의)가입자는 지금의 소득으로 만 60세까지 보험료를 낸다고 가정해요.<\/li><li>납부예외 중이거나 자격을 잃은 상태라면 지금까지 낸 내역만으로 계산해요.<\/li><li>결과는 '현재가치 기준'과 '미래가치 기준' 두 가지로 나와요. 미래가치는 소득이 가정된 상승률로 오른다고 보고 연금을 받을 때의 화폐가치로 계산한 값이라 실제 금액과 차이가 날 수 있어요.<\/li><li>법령이 바뀌면 예상 금액도 달라질 수 있어요.<\/li><\/ul>\n<p>상세 조회에서는 부양가족 연금 대상, 지급 희망 연령, 앞으로 낼 소득을 직접 골라 비교해 볼 수 있어요.<\/p>\n<h3>몇 살부터 받을 수 있을까?<\/h3>\n<p>가입 기간이 10년 이상이면 출생연도별 지급개시 연령부터 노령연금을 받을 수 있어요.<\/p>\n<ul><li>1961~1964년생: 63세<\/li><li>1965~1968년생: 64세<\/li><li>1969년생 이후: 65세<\/li><\/ul>\n<p>소득 있는 업무에 종사하지 않는다면 최대 5년 먼저 받는 조기노령연금도 있는데, 청구 연령에 따라 70%에서 99.5%를 받는다고 해요. 반대로 연기연금은 최대 5년까지 늦출 수 있고, 연기한 한 달마다 0.6%가 더해진다고 공단이 안내하고 있어요.<\/p>\n<h3>2026년에는 이런 점도 있어요<\/h3>\n<p>공단 FAQ에는 2025년 연금개혁에 따라 2026년부터 기본연금액 계산식이 달라졌다고 나와요. 그래서 예전 글에 있는 계산 예시는 지금 기준과 다를 수 있어요. 참고로 2025년 12월 기준 가입 20년 이상인 분들의 노령연금 평균 수령액이 월 113만 원 정도라는 통계도 공단이 공개했는데, 내가 받을 금액이 아니라 전체 평균 참고치예요.<\/p>\n<h3>조회하는 순서<\/h3>\n<ol><li>국민연금공단 홈페이지나 '내 곁에 국민연금' 앱에서 본인 인증으로 로그인해요.<\/li><li>예상연금액을 확인하고, 필요하면 모의계산으로 소득이나 가입 기간을 바꿔 봐요.<\/li><li>퇴직연금·개인연금까지 보고 싶다면 중앙노후준비지원센터에서 '내 연금 알아보기'를 신청하고 3영업일 뒤 다시 들어가 조회해요.<\/li><\/ol>\n<p>문의는 국민연금공단 1355(유료)로 하면 돼요.<\/p>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/009/009_2_card.png\" alt=\"국민연금 예상액 한눈에 정리\"><\/figure>\n<h3>한눈에 정리<\/h3>\n<ul><li>국민연금만 보려면 예상연금액 조회, 연금 전체를 보려면 내 연금 알아보기<\/li><li>결과는 가정에 기반한 예상치라서 실제 수령액과 다를 수 있음<\/li><li>지급개시 연령은 1969년생부터 65세<\/li><\/ul>\n<p>조회 화면과 계산 기준은 해마다 바뀔 수 있으니 공단 안내를 한 번 더 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 자체 제작 카드 · 사진 2 자체 제작 카드 — 파일 images/posts/009/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>비교표 아래<\/td><td>국민연금공단 홈페이지 첫 화면 또는 '내 연금 알아보기' 소개 화면(로그인 전)<\/td><td>로그인 후 화면의 금액·가입내역은 절대 공개하지 않기<\/td><\/tr><tr><td>조회 순서 아래<\/td><td>앱 메뉴 위치 화면<\/td><td>직접 해 본 경우에만. 이름·가입내역 가림<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ (선택) 홈페이지 전자민원의 '예상연금액 조회' 메뉴 경로를 직접 확인한 경우에만 본문에 경로 추가<\/li><li class=\"cb\">☐ 비교표의 '로그인' 칸이 현재 인증 수단(공동인증서·간편인증 등)과 맞는지 확인<\/li><li class=\"cb\">☐ 평균 수령액 월 113만 원은 공단 FAQ의 기준 시점(2025년 12월)을 지키고 개인 예상치처럼 쓰지 않기<\/li><li class=\"cb\">☐ 본인의 예상 연금액을 공개하고 싶다면 사진 없이 문장으로, 공개 여부는 직접 판단<\/li><li class=\"cb\">☐ 노후·투자 조언으로 읽히는 문구(어느 쪽이 유리하다는 권유 등)를 추가하지 않기<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>예상연금액 조회의 가정, 현재가치·미래가치, 상세조회, 인증 로그인<\/td><td>정부24 국민연금 예상 연금 조회 <a href=\"https://www.gov.kr/portal/service/serviceInfo/PTR000050236\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.kr/portal/service/serviceInfo/PTR000050236<\/a> (최종수정 2026-08-10)<\/td><td>공식<\/td><\/tr><tr><td>내 연금 알아보기 신청 절차(공동인증서 로그인, 3영업일, 제3자 정보제공 동의)<\/td><td>정부24 내 연금 정보조회 <a href=\"https://www.gov.kr/portal/service/serviceInfo/B55201500014\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.gov.kr/portal/service/serviceInfo/B55201500014<\/a> (최종수정 2026-08-10)<\/td><td>공식<\/td><\/tr><tr><td>내 연금 알아보기 조회 대상 9종, csa.nps.or.kr 경로<\/td><td>국민연금공단 안내 자료 <a href=\"https://www.nps.or.kr/html/download/memberGuide.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nps.or.kr/html/download/memberGuide.pdf<\/a><\/td><td>공식<\/td><\/tr><tr><td>지급개시 연령표, 조기노령연금(70~99.5%), 연기연금(월 0.6%), 2026년 계산식 변경, 평균 수령액, 앱 기능<\/td><td>국민연금공단 FAQ <a href=\"https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0095M0.do?menuId=MN24001131\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0095M0.do?menuId=MN24001131<\/a><\/td><td>공식<\/td><\/tr><tr><td>예상연금액 조회·모의계산 메뉴 존재<\/td><td>국민연금공단 전자민원 안내 <a href=\"https://www.nps.or.kr/elctcvlcpt/comm/getOHAC0000M3.do?menuId=MN24000936\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.nps.or.kr/elctcvlcpt/comm/getOHAC0000M3.do?menuId=MN24000936<\/a> (검색 결과로 확인, 박스에서 페이지 직접 열람은 시간 초과)<\/td><td>공식(검색 요약)<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "국민연금을 나중에 얼마 받는지 검색해 보면 글마다 숫자가 달라서 더 헷갈리죠. 사람마다 가입 기간과 소득이 다르니 당연한 일인데요, 정작 내 숫자를 보여 주는 공식 조회 서비스가 두 갈래라서 어디서 무엇을 볼 수 있는지부터 비교해 봤어요. 국민연금공단과 정부24 안내를 바탕으로 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/009/009_1_card.png\n\n두 서비스를 나란히 놓고 보면\n\n• 운영 — 예상연금액 조회: 국민연금공단 홈페이지·앱 / 내 연금 알아보기: NPS 중앙노후준비지원센터(csa.nps.or.kr)\n• 보여 주는 것 — 예상연금액 조회: 국민연금의 예상 노령연금 (만 60세 이후 받을 금액) / 내 연금 알아보기: 국민연금, 공무원·사학·군인·별정우체국연금, 농지연금, 개인연금, 퇴직연금, 주택연금\n• 로그인 — 예상연금액 조회: 공동인증서 등 본인 인증 / 내 연금 알아보기: 공동인증서 로그인\n• 특이점 — 예상연금액 조회: 소득·가입기간을 직접 넣어 보는 모의계산도 있음 / 내 연금 알아보기: 개인연금·퇴직연금은 신청 후 3영업일 뒤부터 조회\n\n국민연금만 궁금하면 왼쪽, 내가 가진 연금을 한꺼번에 보고 싶다면 오른쪽이 맞아요. 오른쪽은 제3자 정보제공 동의와 개인정보 수집·이용 동의를 거치는 구조라고 안내되어 있어요.\n\n예상연금액은 어떤 가정으로 계산될까?\n\n정부24의 서비스 안내에는 다음과 같은 가정이 적혀 있어요.\n\n- 사업장가입자와 지역(임의)가입자는 지금의 소득으로 만 60세까지 보험료를 낸다고 가정해요.\n- 납부예외 중이거나 자격을 잃은 상태라면 지금까지 낸 내역만으로 계산해요.\n- 결과는 '현재가치 기준'과 '미래가치 기준' 두 가지로 나와요. 미래가치는 소득이 가정된 상승률로 오른다고 보고 연금을 받을 때의 화폐가치로 계산한 값이라 실제 금액과 차이가 날 수 있어요.\n- 법령이 바뀌면 예상 금액도 달라질 수 있어요.\n\n상세 조회에서는 부양가족 연금 대상, 지급 희망 연령, 앞으로 낼 소득을 직접 골라 비교해 볼 수 있어요.\n\n몇 살부터 받을 수 있을까?\n\n가입 기간이 10년 이상이면 출생연도별 지급개시 연령부터 노령연금을 받을 수 있어요.\n\n- 1961~1964년생: 63세\n- 1965~1968년생: 64세\n- 1969년생 이후: 65세\n\n소득 있는 업무에 종사하지 않는다면 최대 5년 먼저 받는 조기노령연금도 있는데, 청구 연령에 따라 70%에서 99.5%를 받는다고 해요. 반대로 연기연금은 최대 5년까지 늦출 수 있고, 연기한 한 달마다 0.6%가 더해진다고 공단이 안내하고 있어요.\n\n2026년에는 이런 점도 있어요\n\n공단 FAQ에는 2025년 연금개혁에 따라 2026년부터 기본연금액 계산식이 달라졌다고 나와요. 그래서 예전 글에 있는 계산 예시는 지금 기준과 다를 수 있어요. 참고로 2025년 12월 기준 가입 20년 이상인 분들의 노령연금 평균 수령액이 월 113만 원 정도라는 통계도 공단이 공개했는데, 내가 받을 금액이 아니라 전체 평균 참고치예요.\n\n조회하는 순서\n\n1. 국민연금공단 홈페이지나 '내 곁에 국민연금' 앱에서 본인 인증으로 로그인해요.\n2. 예상연금액을 확인하고, 필요하면 모의계산으로 소득이나 가입 기간을 바꿔 봐요.\n3. 퇴직연금·개인연금까지 보고 싶다면 중앙노후준비지원센터에서 '내 연금 알아보기'를 신청하고 3영업일 뒤 다시 들어가 조회해요.\n\n문의는 국민연금공단 1355(유료)로 하면 돼요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/009/009_2_card.png\n\n한눈에 정리\n\n- 국민연금만 보려면 예상연금액 조회, 연금 전체를 보려면 내 연금 알아보기\n- 결과는 가정에 기반한 예상치라서 실제 수령액과 다를 수 있음\n- 지급개시 연령은 1969년생부터 65세\n\n조회 화면과 계산 기준은 해마다 바뀔 수 있으니 공단 안내를 한 번 더 확인해 주세요.", "copyAll": "국민연금을 나중에 얼마 받는지 검색해 보면 글마다 숫자가 달라서 더 헷갈리죠. 사람마다 가입 기간과 소득이 다르니 당연한 일인데요, 정작 내 숫자를 보여 주는 공식 조회 서비스가 두 갈래라서 어디서 무엇을 볼 수 있는지부터 비교해 봤어요. 국민연금공단과 정부24 안내를 바탕으로 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/009/009_1_card.png\n\n두 서비스를 나란히 놓고 보면\n\n• 운영 — 예상연금액 조회: 국민연금공단 홈페이지·앱 / 내 연금 알아보기: NPS 중앙노후준비지원센터(csa.nps.or.kr)\n• 보여 주는 것 — 예상연금액 조회: 국민연금의 예상 노령연금 (만 60세 이후 받을 금액) / 내 연금 알아보기: 국민연금, 공무원·사학·군인·별정우체국연금, 농지연금, 개인연금, 퇴직연금, 주택연금\n• 로그인 — 예상연금액 조회: 공동인증서 등 본인 인증 / 내 연금 알아보기: 공동인증서 로그인\n• 특이점 — 예상연금액 조회: 소득·가입기간을 직접 넣어 보는 모의계산도 있음 / 내 연금 알아보기: 개인연금·퇴직연금은 신청 후 3영업일 뒤부터 조회\n\n국민연금만 궁금하면 왼쪽, 내가 가진 연금을 한꺼번에 보고 싶다면 오른쪽이 맞아요. 오른쪽은 제3자 정보제공 동의와 개인정보 수집·이용 동의를 거치는 구조라고 안내되어 있어요.\n\n예상연금액은 어떤 가정으로 계산될까?\n\n정부24의 서비스 안내에는 다음과 같은 가정이 적혀 있어요.\n\n- 사업장가입자와 지역(임의)가입자는 지금의 소득으로 만 60세까지 보험료를 낸다고 가정해요.\n- 납부예외 중이거나 자격을 잃은 상태라면 지금까지 낸 내역만으로 계산해요.\n- 결과는 '현재가치 기준'과 '미래가치 기준' 두 가지로 나와요. 미래가치는 소득이 가정된 상승률로 오른다고 보고 연금을 받을 때의 화폐가치로 계산한 값이라 실제 금액과 차이가 날 수 있어요.\n- 법령이 바뀌면 예상 금액도 달라질 수 있어요.\n\n상세 조회에서는 부양가족 연금 대상, 지급 희망 연령, 앞으로 낼 소득을 직접 골라 비교해 볼 수 있어요.\n\n몇 살부터 받을 수 있을까?\n\n가입 기간이 10년 이상이면 출생연도별 지급개시 연령부터 노령연금을 받을 수 있어요.\n\n- 1961~1964년생: 63세\n- 1965~1968년생: 64세\n- 1969년생 이후: 65세\n\n소득 있는 업무에 종사하지 않는다면 최대 5년 먼저 받는 조기노령연금도 있는데, 청구 연령에 따라 70%에서 99.5%를 받는다고 해요. 반대로 연기연금은 최대 5년까지 늦출 수 있고, 연기한 한 달마다 0.6%가 더해진다고 공단이 안내하고 있어요.\n\n2026년에는 이런 점도 있어요\n\n공단 FAQ에는 2025년 연금개혁에 따라 2026년부터 기본연금액 계산식이 달라졌다고 나와요. 그래서 예전 글에 있는 계산 예시는 지금 기준과 다를 수 있어요. 참고로 2025년 12월 기준 가입 20년 이상인 분들의 노령연금 평균 수령액이 월 113만 원 정도라는 통계도 공단이 공개했는데, 내가 받을 금액이 아니라 전체 평균 참고치예요.\n\n조회하는 순서\n\n1. 국민연금공단 홈페이지나 '내 곁에 국민연금' 앱에서 본인 인증으로 로그인해요.\n2. 예상연금액을 확인하고, 필요하면 모의계산으로 소득이나 가입 기간을 바꿔 봐요.\n3. 퇴직연금·개인연금까지 보고 싶다면 중앙노후준비지원센터에서 '내 연금 알아보기'를 신청하고 3영업일 뒤 다시 들어가 조회해요.\n\n문의는 국민연금공단 1355(유료)로 하면 돼요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/009/009_2_card.png\n\n한눈에 정리\n\n- 국민연금만 보려면 예상연금액 조회, 연금 전체를 보려면 내 연금 알아보기\n- 결과는 가정에 기반한 예상치라서 실제 수령액과 다를 수 있음\n- 지급개시 연령은 1969년생부터 65세\n\n조회 화면과 계산 기준은 해마다 바뀔 수 있으니 공단 안내를 한 번 더 확인해 주세요.", "search": "009 내 국민연금 나중에 얼마 받을까? '예상연금액 조회'와 '내 연금 알아보기' 차이 세금·연금 국민연금, 예상연금액, 내 연금 알아보기, 노령연금, 노후준비서비스 국민연금 예상연금액 조회와 노후준비서비스의 '내 연금 알아보기'가 무엇이 다른지, 어떤 가정으로 계산되는지, 수급 시작 나이와 함께 정리 국민연금을 나중에 얼마 받는지 검색해 보면 글마다 숫자가 달라서 더 헷갈리죠. 사람마다 가입 기간과 소득이 다르니 당연한 일인데요, 정작 내 숫자를 보여 주는 공식 조회 서비스가 두 갈래라서 어디서 무엇을 볼 수 있는지부터 비교해 봤어요. 국민연금공단과 정부24 안내를 바탕으로 정리했습니다. (2026년 10월 5일 기준) [사진 1] https://senti-1000ma.github.io/blog-drafts/img/009/009_1_card.png 두 서비스를 나란히 놓고 보면 • 운영 — 예상연금액 조회: 국민연금공단 홈페이지·앱 / 내 연금 알아보기: NPS 중앙노후준비지원센터(csa.nps.or.kr) • 보여 주는 것 — 예상연금액 조회: 국민연금의 예상 노령연금 (만 60세 이후 받을 금액) / 내 연금 알아보기: 국민연금, 공무원·사학·군인·별정우체국연금, 농지연금, 개인연금, 퇴직연금, 주택연금 • 로그인 — 예상연금액 조회: 공동인증서 등 본인 인증 / 내 연금 알아보기: 공동인증서 로그인 • 특이점 — 예상연금액 조회: 소득·가입기간을 직접 넣어 보는 모의계산도 있음 / 내 연금 알아보기: 개인연금·퇴직연금은 신청 후 3영업일 뒤부터 조회 국민연금만 궁금하면 왼쪽, 내가 가진 연금을 한꺼번에 보고 싶다면 오른쪽이 맞아요. 오른쪽은 제3자 정보제공 동의와 개인정보 수집·이용 동의를 거치는 구조라고 안내되어 있어요. 예상연금액은 어떤 가정으로 계산될까? 정부24의 서비스 안내에는 다음과 같은 가정이 적혀 있어요. - 사업장가입자와 지역(임의)가입자는 지금의 소득으로 만 60세까지 보험료를 낸다고 가정해요. - 납부예외 중이거나 자격을 잃은 상태라면 지금까지 낸 내역만으로 계산해요. - 결과는 '현재가치 기준'과 '미래가치 기준' 두 가지로 나와요. 미래가치는 소득이 가정된 상승률로 오른다고 보고 연금을 받을 때의 화폐가치로 계산한 값이라 실제 금액과 차이가 날 수 있어요. - 법령이 바뀌면 예상 금액도 달라질 수 있어요. 상세 조회에서는 부양가족 연금 대상, 지급 희망 연령, 앞으로 낼 소득을 직접 골라 비교해 볼 수 있어요. 몇 살부터 받을 수 있을까? 가입 기간이 10년 이상이면 출생연도별 지급개시 연령부터 노령연금을 받을 수 있어요. - 1961~1964년생: 63세 - 1965~1968년생: 64세 - 1969년생 이후: 65세 소득 있는 업무에 종사하지 않는다면 최대 5년 먼저 받는 조기노령연금도 있는데, 청구 연령에 따라 70%에서 99.5%를 받는다고 해요. 반대로 연기연금은 최대 5년까지 늦출 수 있고, 연기한 한 달마다 0.6%가 더해진다고 공단이 안내하고 있어요. 2026년에는 이런 점도 있어요 공단 FAQ에는 2025년 연금개혁에 따라 2026년부터 기본연금액 계산식이 달라졌다고 나와요. 그래서 예전 글에 있는 계산 예시는 지금 기준과 다를 수 있어요. 참고로 2025년 12월 기준 가입 20년 이상인 분들의 노령연금 평균 수령액이 월 113만 원 정도라는 통계도 공단이 공개했는데, 내가 받을 금액이 아니라 전체 평균 참고치예요. 조회하는 순서 1. 국민연금공단 홈페이지나 '내 곁에 국민연금' 앱에서 본인 인증으로 로그인해요. 2. 예상연금액을 확인하고, 필요하면 모의계산으로 소득이나 가입 기간을 바꿔 봐요. 3. 퇴직연금·개인연금까지 보고 싶다면 중앙노후준비지원센터에서 '내 연금 알아보기'를 신청하고 3영업일 뒤 다시 들어가 조회해요. 문의는 국민연금공단 1355(유료)로 하면 돼요. [사진 2] https://senti-1000ma.github.io/blog-drafts/img/009/009_2_card.png 한눈에 정리 - 국민연금만 보려면 예상연금액 조회, 연금 전체를 보려면 내 연금 알아보기 - 결과는 가정에 기반한 예상치라서 실제 수령액과 다를 수 있음 - 지급개시 연령은 1969년생부터 65세 조회 화면과 계산 기준은 해마다 바뀔 수 있으니 공단 안내를 한 번 더 확인해 주세요. 네이버"}, {"id": "008", "platform": "naver", "sub": "naver", "subLabel": "네이버", "file": "008_flu-vaccine-2026-2027.md", "title": "독감 무료 접종 언제부터? 2026-2027절기 대상별 시작일 한눈에 정리", "cands": ["75세 이상은 내일부터! 인플루엔자 국가예방접종 대상별 일정 (2026-2027절기)", "올해는 일정이 앞당겨졌어요: 어린이·임신부·65세 이상 독감 무료 접종 달력", "독감 국가예방접종, 어디서 무엇을 챙겨 가야 할까? 접종 전 확인 정리"], "cat": "건강·보건", "kw": ["인플루엔자 국가예방접종", "독감 무료접종", "2026-2027절기", "예방접종도우미", "위탁의료기관"], "summary": "앞당겨진 2026-2027절기 독감 국가예방접종의 대상별 시작일, 접종 장소, 준비물을 공식 일정 기준으로 정리 (의료 조언 아님)", "status": "초안", "created": "2026-10-05 12:21", "base": "2026-10-05", "need": 0, "chars": 1923, "chars_ns": 1515, "imgs": 4, "slots": 3, "filled": 3, "thumb": "img/008/008_0_thumb.png", "seHtml": "<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/008/008_0_thumb.png\" alt=\"대표 이미지\" width=\"720\"><\/p>\n<p>75세 이상 어르신은 바로 내일, 10월 6일(화)부터 독감 국가예방접종을 받을 수 있어요. 올해는 질병관리청이 일정을 앞당겼기 때문에 작년 기억대로 움직이면 날짜가 맞지 않을 수 있습니다. 이 글은 질병관리청 공식 안내를 기준으로 대상별 일정과 챙길 것을 정리한 제도 안내예요. (2026년 10월 5일 기준)<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/lib/draft_1/d1_kogl85400_vaccination_1person.jpg\" alt=\"예방접종 장면 일러스트(분위기 이미지) — 한국건강가정진흥원, 공공누리 제1유형\" width=\"640\"><\/p><p style=\"text-align:center\"><span style=\"font-size:13px;color:#888888\">출처: 한국건강가정진흥원(공공누리)<\/span><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>왜 일정이 앞당겨졌을까?<\/b><\/span><\/p>\n<p>질병관리청은 9월 11일에 인플루엔자 유행주의보가 발령되는 등 예년보다 유행이 빨리 시작되어 접종 시작일을 앞당긴다고 9월 16일에 밝혔어요. 전문위원회 심의와 관계기관 협의를 거쳐 결정했다고 해요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>대상별 접종 기간<\/b><\/span><\/p>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%\"><tbody><tr><td style=\"background-color:#f2f4f7\"><b>대상<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>시작일<\/b><\/td><td style=\"background-color:#f2f4f7\"><b>종료일<\/b><\/td><\/tr><tr><td>생후 6개월~14세 어린이 (2012.1.1.~2026.8.31. 출생)<\/td><td>9월 21일(월)<\/td><td>2027년 4월 30일<\/td><\/tr><tr><td>임신부 (임신 주수 무관)<\/td><td>9월 21일(월)<\/td><td>2027년 4월 30일<\/td><\/tr><tr><td>75세 이상 (1951.12.31. 이전 출생)<\/td><td>10월 6일(화)<\/td><td>2027년 4월 30일<\/td><\/tr><tr><td>70~74세 (1952.1.1.~1956.12.31. 출생)<\/td><td>10월 12일(월)<\/td><td>2027년 4월 30일<\/td><\/tr><tr><td>65~69세 (1957.1.1.~1961.12.31. 출생)<\/td><td>10월 15일(목)<\/td><td>2027년 4월 30일<\/td><\/tr><\/tbody><\/table><p><br><\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/008/008_2_card.png\" alt=\"대상별 인플루엔자 무료 접종 기간\" width=\"720\"><\/p>\n<p>면역저하자 등 고위험군은 연령별 일정과 상관없이 10월 6일부터 의료진과 상담한 뒤 접종할 수 있다고 안내돼 있어요. 어린이 연령 범위는 이번 절기부터 13세에서 14세로 넓어졌어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>어린이는 1회일까, 2회일까?<\/b><\/span><\/p>\n<p>생후 6개월~9세 미만 어린이 중 인플루엔자 접종이 처음이거나 이전 접종력을 모르는 경우, 또는 2026년 6월 30일까지 총 1회만 접종한 경우에는 2회 접종이 지원돼요. 그 외에는 1회예요. 다만 일정과 횟수는 예진 의사와 상담하라고 안내되어 있어서, 우리 아이 횟수는 접종 기관에서 꼭 확인하세요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>어디서, 무엇을 들고 가나?<\/b><\/span><\/p>\n<ul><li>장소: 주소지와 상관없이 전국 위탁의료기관과 보건소에서 무료로 받을 수 있어요. 위탁의료기관은 약 2.3만 개소이고, 예방접종도우미 누리집(nip.kdca.go.kr)의 '지정의료기관 찾기'에서 확인할 수 있어요.<\/li><li>방문 전: 기관마다 접종 가능 여부가 다를 수 있으니 미리 확인하라고 질병관리청이 당부하고 있어요.<\/li><li>준비물: 신분증이 필요해요. 어린이는 주민등록등본이나 건강보험증 등, 임신부는 산모수첩이나 임신확인서 등으로 대상 여부를 확인한대요.<\/li><li>접종 후: 20~30분은 접종 기관에 머물며 이상반응을 살핀 뒤 귀가하라고 안내돼 있어요.<\/li><\/ul>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/008/008_3_capture.png\" alt=\"첫 화면의 위탁의료기관 찾기·접종내역 조회 메뉴 (2026-10-05 확인)\" width=\"720\"><\/p><p style=\"text-align:center\"><span style=\"font-size:13px;color:#888888\">출처: 질병관리청 예방접종도우미 누리집<\/span><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>65세 이상은 코로나19도 같은 시기<\/b><\/span><\/p>\n<p>65세 이상은 코로나19 국가예방접종도 10월에 시작돼요. 70세 이상은 10월 12일(월), 65~69세는 10월 15일(목)부터 2027년 6월 30일까지이고, 인플루엔자 백신과 동시 접종이 가능하다고 안내돼 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>백신 공급, 알아둘 점<\/b><\/span><\/p>\n<p>올해 국가예방접종용으로 확보한 물량은 약 1,233만 도즈라고 해요. 같은 자료에서 질병관리청은 전체 생산·수입 물량이 지난해보다 약 400만 도즈 줄었고, 국가예방접종이 아닌 민간 접종은 공급 여건이 예년만큼 여유롭지 않다고 설명했어요. 국가예방접종 대상이 아닌 분은 이 점을 참고하세요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>어린이·임신부 9/21, 75세 이상 10/6, 70~74세 10/12, 65~69세 10/15 시작<\/li><li>모두 2027년 4월 30일까지, 주소지와 관계없이 위탁의료기관·보건소에서 무료<\/li><li>방문 전 접종 가능 여부 확인, 신분증 지참<\/li><\/ul>\n<p>일정은 상황에 따라 다시 조정될 수 있으니 접종 전에 예방접종도우미 누리집이나 질병관리청 콜센터(1339)에서 한 번 더 확인해 주세요. 이 글은 의료적 조언이 아니며, 접종 여부와 시기는 의료진과 상담해 정하세요.<\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/008/008_0_thumb.png\n\n75세 이상 어르신은 바로 내일, 10월 6일(화)부터 독감 국가예방접종을 받을 수 있어요. 올해는 질병관리청이 일정을 앞당겼기 때문에 작년 기억대로 움직이면 날짜가 맞지 않을 수 있습니다. 이 글은 질병관리청 공식 안내를 기준으로 대상별 일정과 챙길 것을 정리한 제도 안내예요. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/lib/draft_1/d1_kogl85400_vaccination_1person.jpg\n출처: 한국건강가정진흥원(공공누리)\n\n왜 일정이 앞당겨졌을까?\n\n질병관리청은 9월 11일에 인플루엔자 유행주의보가 발령되는 등 예년보다 유행이 빨리 시작되어 접종 시작일을 앞당긴다고 9월 16일에 밝혔어요. 전문위원회 심의와 관계기관 협의를 거쳐 결정했다고 해요.\n\n대상별 접종 기간\n\n• 생후 6개월~14세 어린이 (2012.1.1.~2026.8.31. 출생) — 시작일: 9월 21일(월) / 종료일: 2027년 4월 30일\n• 임신부 (임신 주수 무관) — 시작일: 9월 21일(월) / 종료일: 2027년 4월 30일\n• 75세 이상 (1951.12.31. 이전 출생) — 시작일: 10월 6일(화) / 종료일: 2027년 4월 30일\n• 70~74세 (1952.1.1.~1956.12.31. 출생) — 시작일: 10월 12일(월) / 종료일: 2027년 4월 30일\n• 65~69세 (1957.1.1.~1961.12.31. 출생) — 시작일: 10월 15일(목) / 종료일: 2027년 4월 30일\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/008/008_2_card.png\n\n면역저하자 등 고위험군은 연령별 일정과 상관없이 10월 6일부터 의료진과 상담한 뒤 접종할 수 있다고 안내돼 있어요. 어린이 연령 범위는 이번 절기부터 13세에서 14세로 넓어졌어요.\n\n어린이는 1회일까, 2회일까?\n\n생후 6개월~9세 미만 어린이 중 인플루엔자 접종이 처음이거나 이전 접종력을 모르는 경우, 또는 2026년 6월 30일까지 총 1회만 접종한 경우에는 2회 접종이 지원돼요. 그 외에는 1회예요. 다만 일정과 횟수는 예진 의사와 상담하라고 안내되어 있어서, 우리 아이 횟수는 접종 기관에서 꼭 확인하세요.\n\n어디서, 무엇을 들고 가나?\n\n- 장소: 주소지와 상관없이 전국 위탁의료기관과 보건소에서 무료로 받을 수 있어요. 위탁의료기관은 약 2.3만 개소이고, 예방접종도우미 누리집(nip.kdca.go.kr)의 '지정의료기관 찾기'에서 확인할 수 있어요.\n- 방문 전: 기관마다 접종 가능 여부가 다를 수 있으니 미리 확인하라고 질병관리청이 당부하고 있어요.\n- 준비물: 신분증이 필요해요. 어린이는 주민등록등본이나 건강보험증 등, 임신부는 산모수첩이나 임신확인서 등으로 대상 여부를 확인한대요.\n- 접종 후: 20~30분은 접종 기관에 머물며 이상반응을 살핀 뒤 귀가하라고 안내돼 있어요.\n\n[사진 3] https://senti-1000ma.github.io/blog-drafts/img/008/008_3_capture.png\n출처: 질병관리청 예방접종도우미 누리집\n\n65세 이상은 코로나19도 같은 시기\n\n65세 이상은 코로나19 국가예방접종도 10월에 시작돼요. 70세 이상은 10월 12일(월), 65~69세는 10월 15일(목)부터 2027년 6월 30일까지이고, 인플루엔자 백신과 동시 접종이 가능하다고 안내돼 있어요.\n\n백신 공급, 알아둘 점\n\n올해 국가예방접종용으로 확보한 물량은 약 1,233만 도즈라고 해요. 같은 자료에서 질병관리청은 전체 생산·수입 물량이 지난해보다 약 400만 도즈 줄었고, 국가예방접종이 아닌 민간 접종은 공급 여건이 예년만큼 여유롭지 않다고 설명했어요. 국가예방접종 대상이 아닌 분은 이 점을 참고하세요.\n\n한눈에 정리\n\n- 어린이·임신부 9/21, 75세 이상 10/6, 70~74세 10/12, 65~69세 10/15 시작\n- 모두 2027년 4월 30일까지, 주소지와 관계없이 위탁의료기관·보건소에서 무료\n- 방문 전 접종 가능 여부 확인, 신분증 지참\n\n일정은 상황에 따라 다시 조정될 수 있으니 접종 전에 예방접종도우미 누리집이나 질병관리청 콜센터(1339)에서 한 번 더 확인해 주세요. 이 글은 의료적 조언이 아니며, 접종 여부와 시기는 의료진과 상담해 정하세요.", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/008/008_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/008/008_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "008_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/lib/draft_1/d1_kogl85400_vaccination_1person.jpg", "abs": "https://senti-1000ma.github.io/blog-drafts/img/lib/draft_1/d1_kogl85400_vaccination_1person.jpg", "cap": "출처: 한국건강가정진흥원(공공누리)", "alt": "예방접종 장면 일러스트(분위기 이미지) — 한국건강가정진흥원, 공공누리 제1유형", "name": "d1_kogl85400_vacc 관없이 10월 6일부터 의료진과 상담한 뒤 접종할 수 있다고 안내돼 있어요. 어린이 연령 범위는 이번 절기부터 13세에서 14세로 넓어졌어요.<\/p>\n<h3>어린이는 1회일까, 2회일까?<\/h3>\n<p>생후 6개월~9세 미만 어린이 중 인플루엔자 접종이 처음이거나 이전 접종력을 모르는 경우, 또는 2026년 6월 30일까지 총 1회만 접종한 경우에는 2회 접종이 지원돼요. 그 외에는 1회예요. 다만 일정과 횟수는 예진 의사와 상담하라고 안내되어 있어서, 우리 아이 횟수는 접종 기관에서 꼭 확인하세요.<\/p>\n<h3>어디서, 무엇을 들고 가나?<\/h3>\n<ul><li>장소: 주소지와 상관없이 전국 위탁의료기관과 보건소에서 무료로 받을 수 있어요. 위탁의료기관은 약 2.3만 개소이고, 예방접종도우미 누리집(nip.kdca.go.kr)의 '지정의료기관 찾기'에서 확인할 수 있어요.<\/li><li>방문 전: 기관마다 접종 가능 여부가 다를 수 있으니 미리 확인하라고 질병관리청이 당부하고 있어요.<\/li><li>준비물: 신분증이 필요해요. 어린이는 주민등록등본이나 건강보험증 등, 임신부는 산모수첩이나 임신확인서 등으로 대상 여부를 확인한대요.<\/li><li>접종 후: 20~30분은 접종 기관에 머물며 이상반응을 살핀 뒤 귀가하라고 안내돼 있어요.<\/li><\/ul>\n<figure class=\"ph\" data-n=\"3\"><img loading=\"lazy\" src=\"img/008/008_3_capture.png\" alt=\"첫 화면의 위탁의료기관 찾기·접종내역 조회 메뉴 (2026-10-05 확인)\"><figcaption>출처: 질병관리청 예방접종도우미 누리집<\/figcaption><\/figure>\n<h3>65세 이상은 코로나19도 같은 시기<\/h3>\n<p>65세 이상은 코로나19 국가예방접종도 10월에 시작돼요. 70세 이상은 10월 12일(월), 65~69세는 10월 15일(목)부터 2027년 6월 30일까지이고, 인플루엔자 백신과 동시 접종이 가능하다고 안내돼 있어요.<\/p>\n<h3>백신 공급, 알아둘 점<\/h3>\n<p>올해 국가예방접종용으로 확보한 물량은 약 1,233만 도즈라고 해요. 같은 자료에서 질병관리청은 전체 생산·수입 물량이 지난해보다 약 400만 도즈 줄었고, 국가예방접종이 아닌 민간 접종은 공급 여건이 예년만큼 여유롭지 않다고 설명했어요. 국가예방접종 대상이 아닌 분은 이 점을 참고하세요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>어린이·임신부 9/21, 75세 이상 10/6, 70~74세 10/12, 65~69세 10/15 시작<\/li><li>모두 2027년 4월 30일까지, 주소지와 관계없이 위탁의료기관·보건소에서 무료<\/li><li>방문 전 접종 가능 여부 확인, 신분증 지참<\/li><\/ul>\n<p>일정은 상황에 따라 다시 조정될 수 있으니 접종 전에 예방접종도우미 누리집이나 질병관리청 콜센터(1339)에서 한 번 더 확인해 주세요. 이 글은 의료적 조언이 아니며, 접종 여부와 시기는 의료진과 상담해 정하세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 라이선스 이미지 · 사진 2 자체 제작 카드 · 사진 3 공식 화면 캡처 — 파일 images/posts/008/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래(대표)<\/td><td>예방접종 일러스트 (images/draft_1/d1_kogl85400_vaccination_1person.jpg)<\/td><td>공공누리 제1유형 표기 문구를 글 하단에 넣기. 캡션은 '분위기 이미지'<\/td><\/tr><tr><td>'대상별 접종 기간' 아래<\/td><td>예방접종도우미 누리집 인플루엔자 안내 화면 직접 캡처<\/td><td>캡처일 표기. 개인정보 없는 공개 화면만<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ 발행 당일 예방접종도우미(nip.kdca.go.kr) 인플루엔자 안내에서 대상별 시작일이 본문 표와 같은지 재확인 (일정이 한 번 조정된 이력이 있음)<\/li><li class=\"cb\">☐ 본문에 개인 접종 경험이나 효과·부작용 설명을 추가하지 않기 (의료 조언 금지 원칙)<\/li><li class=\"cb\">☐ 65세 이상 코로나19 일정 문장은 질병관리청 안내(10/12, 10/15)와 맞는지 재확인<\/li><li class=\"cb\">☐ 작성 시점이 10월 6일 이후라면 '내일부터' 문구를 수정<\/li><li class=\"cb\">☐ 질병관리청 국가건강정보포털 문장은 공공누리 4유형이므로 복사하지 않음 (이 글은 예방접종도우미·보도참고자료 내용을 재서술)<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>대상별 접종 기간, 2회 접종 기준, 임신부, 위탁의료기관·보건소<\/td><td>질병관리청 예방접종도우미 <a href=\"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuCd=134&amp;menuLv=1\" target=\"_blank\" rel=\"noopener noreferrer\">https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuCd=134&amp;menuLv=1<\/a><\/td><td>공식<\/td><\/tr><tr><td>일정 앞당김 배경(9/11 유행주의보), 고위험군 10/6, 백신 물량(1,233만 도즈, 약 400만 도즈 감소), 준비물, 20~30분 관찰<\/td><td>질병관리청 보도참고자료(2026-09-16) <a href=\"https://www.kdca.go.kr/bbs/kdca/42/309764/download.do\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.kdca.go.kr/bbs/kdca/42/309764/download.do<\/a><\/td><td>공식<\/td><\/tr><tr><td>어린이 대상 연령 13세→14세 확대<\/td><td>질병관리청 보도자료 <a href=\"https://www.kdca.go.kr/kdca/2848/subview.do?enc=Zm5jdDF8QEB8JTJGYmJzJTJGa2RjYSUyRjQyJTJGMzEyMzA4JTJGYXJ0Y2xWaWV3LmRvJTNG\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.kdca.go.kr/kdca/2848/subview.do?enc=Zm5jdDF8QEB8JTJGYmJzJTJGa2RjYSUyRjQyJTJGMzEyMzA4JTJGYXJ0Y2xWaWV3LmRvJTNG<\/a><\/td><td>공식<\/td><\/tr><tr><td>65세 이상 코로나19·인플루엔자 동시 접종 일정<\/td><td>대한민국 정책브리핑 정책뉴스(2026-08-27) <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148970641\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.korea.kr/news/policyNewsView.do?newsId=148970641<\/a> , 질병관리청 필수예방접종 전환 자료 <a href=\"https://www.kdca.go.kr/bbs/kdca/42/309792/download.do\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.kdca.go.kr/bbs/kdca/42/309792/download.do<\/a><\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "<ul><li>사진 1: 공공누리 제1유형 '예방접종, 1인가구'(한국건강가정진흥원, 2024) — 아래 표기 문구 참고<\/li><li>사진 3: 질병관리청 예방접종도우미 누리집 공개 화면 캡처(2026-10-05 확인, 로그인 전 화면) <a href=\"https://nip.kdca.go.kr/irhp/index.jsp\" target=\"_blank\" rel=\"noopener noreferrer\">https://nip.kdca.go.kr/irhp/index.jsp<\/a><\/li><\/ul>\n<p>본 저작물은 한국건강가정진흥원에서 2024년 작성하여 공공누리 제1유형으로 개방한 '예방접종, 1인가구'를 이용하였으며, 해당 저작물은 공공누리(<a href=\"https://www.kogl.or.kr\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.kogl.or.kr<\/a>)에서 무료로 다운받으실 수 있습니다.<\/p>", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "75세 이상 어르신은 바로 내일, 10월 6일(화)부터 독감 국가예방접종을 받을 수 있어요. 올해는 질병관리청이 일정을 앞당겼기 때문에 작년 기억대로 움직이면 날짜가 맞지 않을 수 있습니다. 이 글은 질병관리청 공식 안내를 기준으로 대상별 일정과 챙길 것을 정리한 제도 안내예요. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/lib/draft_1/d1_kogl85400_vaccination_1person.jpg\n출처: 한국건강가정진흥원(공공누리)\n\n왜 일정이 앞당겨졌을까?\n\n질병관리청은 9월 11일에 인플루엔자 유행주의보가 발령되는 등 예년보다 유행이 빨리 시작되어 접종 시작일을 앞당긴다고 9월 16일에 밝혔어요. 전문위원회 심의와 관계기관 협의를 거쳐 결정했다고 해요.\n\n대상별 접종 기간\n\n• 생후 6개월~14세 어린이 (2012.1.1.~2026.8.31. 출생) — 시작일: 9월 21일(월) / 종료일: 2027년 4월 30일\n• 임신부 (임신 주수 무관) — 시작일: 9월 21일(월) / 종료일: 2027년 4월 30일\n• 75세 이상 (1951.12.31. 이전 출생) — 시작일: 10월 6일(화) / 종료일: 2027년 4월 30일\n• 70~74세 (1952.1.1.~1956.12.31. 출생) — 시작일: 10월 12일(월) / 종료일: 2027년 4월 30일\n• 65~69세 (1957.1.1.~1961.12.31. 출생) — 시작일: 10월 15일(목) / 종료일: 2027년 4월 30일\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/008/008_2_card.png\n\n면역저하자 등 고위험군은 연령별 일정과 상관없이 10월 6일부터 의료진과 상담한 뒤 접종할 수 있다고 안내돼 있어요. 어린이 연령 범위는 이번 절기부터 13세에서 14세로 넓어졌어요.\n\n어린이는 1회일까, 2회일까?\n\n생후 6개월~9세 미만 어린이 중 인플루엔자 접종이 처음이거나 이전 접종력을 모르는 경우, 또는 2026년 6월 30일까지 총 1회만 접종한 경우에는 2회 접종이 지원돼요. 그 외에는 1회예요. 다만 일정과 횟수는 예진 의사와 상담하라고 안내되어 있어서, 우리 아이 횟수는 접종 기관에서 꼭 확인하세요.\n\n어디서, 무엇을 들고 가나?\n\n- 장소: 주소지와 상관없이 전국 위탁의료기관과 보건소에서 무료로 받을 수 있어요. 위탁의료기관은 약 2.3만 개소이고, 예방접종도우미 누리집(nip.kdca.go.kr)의 '지정의료기관 찾기'에서 확인할 수 있어요.\n- 방문 전: 기관마다 접종 가능 여부가 다를 수 있으니 미리 확인하라고 질병관리청이 당부하고 있어요.\n- 준비물: 신분증이 필요해요. 어린이는 주민등록등본이나 건강보험증 등, 임신부는 산모수첩이나 임신확인서 등으로 대상 여부를 확인한대요.\n- 접종 후: 20~30분은 접종 기관에 머물며 이상반응을 살핀 뒤 귀가하라고 안내돼 있어요.\n\n[사진 3] https://senti-1000ma.github.io/blog-drafts/img/008/008_3_capture.png\n출처: 질병관리청 예방접종도우미 누리집\n\n65세 이상은 코로나19도 같은 시기\n\n65세 이상은 코로나19 국가예방접종도 10월에 시작돼요. 70세 이상은 10월 12일(월), 65~69세는 10월 15일(목)부터 2027년 6월 30일까지이고, 인플루엔자 백신과 동시 접종이 가능하다고 안내돼 있어요.\n\n백신 공급, 알아둘 점\n\n올해 국가예방접종용으로 확보한 물량은 약 1,233만 도즈라고 해요. 같은 자료에서 질병관리청은 전체 생산·수입 물량이 지난해보다 약 400만 도즈 줄었고, 국가예방접종이 아닌 민간 접종은 공급 여건이 예년만큼 여유롭지 않다고 설명했어요. 국가예방접종 대상이 아닌 분은 이 점을 참고하세요.\n\n한눈에 정리\n\n- 어린이·임신부 9/21, 75세 이상 10/6, 70~74세 10/12, 65~69세 10/15 시작\n- 모두 2027년 4월 30일까지, 주소지와 관계없이 위탁의료기관·보건소에서 무료\n- 방문 전 접종 가능 여부 확인, 신분증 지참\n\n일정은 상황에 따라 다시 조정될 수 있으니 접종 전에 예방접종도우미 누리집이나 질병관리청 콜센터(1339)에서 한 번 더 확인해 주세요. 이 글은 의료적 조언이 아니며, 접종 여부와 시기는 의료진과 상담해 정하세요.", "copyAll": "75세 이상 어르신은 바로 내일, 10월 6일(화)부터 독감 국가예방접종을 받을 수 있어요. 올해는 질병관리청이 일정을 앞당겼기 때문에 작년 기억대로 움직이면 날짜가 맞지 않을 수 있습니다. 이 글은 질병관리청 공식 안내를 기준으로 대상별 일정과 챙길 것을 정리한 제도 안내예요. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/lib/draft_1/d1_kogl85400_vaccination_1person.jpg\n출처: 한국건강가정진흥원(공공누리)\n\n왜 일정이 앞당겨졌을까?\n\n질병관리청은 9월 11일에 인플루엔자 유행주의보가 발령되는 등 예년보다 유행이 빨리 시작되어 접종 시작일을 앞당긴다고 9월 16일에 밝혔어요. 전문위원회 심의와 관계기관 협의를 거쳐 결정했다고 해요.\n\n대상별 접종 기간\n\n• 생후 6개월~14세 어린이 (2012.1.1.~2026.8.31. 출생) — 시작일: 9월 21일(월) / 종료일: 2027년 4월 30일\n• 임신부 (임신 주수 무관) — 시작일: 9월 21일(월) / 종료일: 2027년 4월 30일\n• 75세 이상 (1951.12.31. 이전 출생) — 시작일: 10월 6일(화) / 종료일: 2027년 4월 30일\n• 70~74세 (1952.1.1.~1956.12.31. 출생) — 시작일: 10월 12일(월) / 종료일: 2027년 4월 30일\n• 65~69세 (1957.1.1.~1961.12.31.  1년과 5년만 기억하면 헷갈리지 않아요", "세금 환급이 결정됐는데 못 받았다면? 국세환급금찾기로 조회하고 받는 3가지 방법", "내 이름으로 남은 국세 환급금이 있는지 홈택스로 확인해 보세요 (2026년 기준)"], "cat": "세금·연금", "kw": ["국세환급금", "홈택스", "미수령 환급금", "환급계좌 신고", "국고 귀속"], "summary": "환급이 결정됐지만 찾아가지 않은 국세 환급금을 홈택스에서 조회하고 계좌 신고로 받는 방법과 1년·5년 기한을 정리", "status": "초안", "created": "2026-10-05 12:20", "base": "2026-10-05", "need": 0, "chars": 1574, "chars_ns": 1232, "imgs": 3, "slots": 2, "filled": 2, "thumb": "img/007/007_0_thumb.png", "seHtml": "<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/007/007_0_thumb.png\" alt=\"대표 이미지\" width=\"720\"><\/p>\n<p>국세 환급금에는 기억해 둘 숫자가 두 개 있어요. 하나는 '1년', 다른 하나는 '5년'입니다. 환급이 결정됐는데 계좌 정보가 맞지 않아 아직 찾아가지 않은 돈이 있을 수 있어서, 국세청 안내를 기준으로 조회 방법과 기한을 정리해 봤어요. (2026년 10월 5일 기준)<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/007/007_1_card.png\" alt=\"국세 환급금 한눈에 정리\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>어떤 환급금이 조회될까?<\/b><\/span><\/p>\n<p>부가가치세나 종합소득세 같은 세금을 신고했거나 근로장려금·자녀장려금을 신청해서 환급이 결정됐는데, 계좌 오류 등의 이유로 찾아가지 않은 국세 환급금이 대상이에요. 환급이 결정된 날부터 최근 5년간의 자료가 조회된다고 안내되어 있어요.<\/p>\n<p>한 가지 구분해 둘 점이 있어요. 연말정산으로 돌려받는 환급금은 이 조회와 별개예요. 홈택스 안내 문구에도 연말정산 관련 환급금은 '조회/발급 &gt; 기타조회 &gt; 근로소득 지급명세서 조회'를 이용하라고 되어 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>조회하는 순서<\/b><\/span><\/p>\n<ol><li>홈택스(PC) 또는 손택스(모바일)에서 '국세환급금찾기'를 열어요.<\/li><li>주민등록번호(사업자는 사업자등록번호)와 성명(상호)을 입력하고 조회해요.<\/li><li>찾아가지 않은 환급금이 있으면 안내 문구와 함께 내역이 보이고, 없으면 \"존재하지 않습니다\"라고 나와요.<\/li><\/ol>\n<p>참고로 은행에서 이미 지급을 마친 환급금이 시차 때문에 잠깐 조회될 수도 있다고 하니, 금액이 보여도 먼저 통장 입금 내역부터 확인해 보세요.<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/007/007_2_card.png\" alt=\"국세환급금 조회 순서\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>찾는 방법은 세 가지<\/b><\/span><\/p>\n<ul><li>홈택스·손택스: 환급금 상세조회에서 본인 인증을 한 뒤 환급계좌 개설(변경) 신고를 하면 돼요. 국세청 통지서에는 '납부·고지·환급 &gt; 국세환급 &gt; 환급계좌개설(변경)신고' 경로가 적혀 있어요.<\/li><li>전화: 미수령 환급금이 500만 원 이하이면 세무서 담당자에게 연락해 본인 계좌를 신고할 수 있어요.<\/li><li>방문: 세무서에서 국세환급금통지서를 받아 우체국에 가는 방법이에요. 우체국에서 직접 받을 때는 신분증과 통지서가 필요하다고 통지서에 안내되어 있어요.<\/li><\/ul>\n<p>조회 결과를 보고 ARS(1544-9944)나 가까운 세무서로 지급 신청을 할 수도 있다고 정부 개방서비스 페이지에 소개돼 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>1년과 5년은 무엇일까?<\/b><\/span><\/p>\n<p>여기서 '지급요구일'은 국세청이 금융회사나 우체국에 환급금을 지급하라고 처음 요구한 날이에요.<\/p>\n<ul><li>1년: 지급요구일로부터 1년이 지나면 금융회사나 우체국에서는 더 이상 지급하지 않아요. 이때는 관할 세무서에 지급 절차를 문의해야 해요.<\/li><li>5년: 최초 지급요구일부터 5년이 지날 때까지 찾아가지 않으면 국고로 귀속돼요. 통지서에는 국세기본법 시행령 제36조가 근거로 적혀 있어요.<\/li><\/ul>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>마무리하기 전에<\/b><\/span><\/p>\n<p>조회 화면은 주민등록번호를 입력하는 곳이라 포털 검색 광고나 문자로 받은 링크 대신 홈택스 공식 주소를 직접 열어서 들어가는 게 안전해요. 환급 사유나 금액이 궁금하면 안내 화면에 나온 세무서 문의처를 이용하면 되고요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>조회 대상: 환급이 결정됐지만 찾아가지 않은 국세 환급금(최근 5년)<\/li><li>조회 위치: 홈택스·손택스의 국세환급금찾기 (연말정산 환급은 별도)<\/li><li>기한: 지급요구일 1년 후 세무서 문의, 최초 지급요구일 5년 후 국고 귀속<\/li><\/ul>\n<p>기한과 절차는 바뀔 수 있으니 실제 신청 전에는 홈택스 안내를 다시 확인해 주세요.<\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/007/007_0_thumb.png\n\n국세 환급금에는 기억해 둘 숫자가 두 개 있어요. 하나는 '1년', 다른 하나는 '5년'입니다. 환급이 결정됐는데 계좌 정보가 맞지 않아 아직 찾아가지 않은 돈이 있을 수 있어서, 국세청 안내를 기준으로 조회 방법과 기한을 정리해 봤어요. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/007/007_1_card.png\n\n어떤 환급금이 조회될까?\n\n부가가치세나 종합소득세 같은 세금을 신고했거나 근로장려금·자녀장려금을 신청해서 환급이 결정됐는데, 계좌 오류 등의 이유로 찾아가지 않은 국세 환급금이 대상이에요. 환급이 결정된 날부터 최근 5년간의 자료가 조회된다고 안내되어 있어요.\n\n한 가지 구분해 둘 점이 있어요. 연말정산으로 돌려받는 환급금은 이 조회와 별개예요. 홈택스 안내 문구에도 연말정산 관련 환급금은 '조회/발급 > 기타조회 > 근로소득 지급명세서 조회'를 이용하라고 되어 있어요.\n\n조회하는 순서\n\n1. 홈택스(PC) 또는 손택스(모바일)에서 '국세환급금찾기'를 열어요.\n2. 주민등록번호(사업자는 사업자등록번호)와 성명(상호)을 입력하고 조회해요.\n3. 찾아가지 않은 환급금이 있으면 안내 문구와 함께 내역이 보이고, 없으면 \"존재하지 않습니다\"라고 나와요.\n\n참고로 은행에서 이미 지급을 마친 환급금이 시차 때문에 잠깐 조회될 수도 있다고 하니, 금액이 보여도 먼저 통장 입금 내역부터 확인해 보세요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/007/007_2_card.png\n\n찾는 방법은 세 가지\n\n- 홈택스·손택스: 환급금 상세조회에서 본인 인증을 한 뒤 환급계좌 개설(변경) 신고를 하면 돼요. 국세청 통지서에는 '납부·고지·환급 > 국세환급 > 환급계좌개설(변경)신고' 경로가 적혀 있어요.\n- 전화: 미수령 환급금이 500만 원 이하이면 세무서 담당자에게 연락해 본인 계좌를 신고할 수 있어요.\n- 방문: 세무서에서 국세환급금통지서를 받아 우체국에 가는 방법이에요. 우체국에서 직접 받을 때는 신분증과 통지서가 필요하다고 통지서에 안내되어 있어요.\n\n조회 결과를 보고 ARS(1544-9944)나 가까운 세무서로 지급 신청을 할 수도 있다고 정부 개방서비스 페이지에 소개돼 있어요.\n\n1년과 5년은 무엇일까?\n\n여기서 '지급요구일'은 국세청이 금융회사나 우체국에 환급금을 지급하라고 처음 요구한 날이에요.\n\n- 1년: 지급요구일로부터 1년이 지나면 금융회사나 우체국에서는 더 이상 지급하지 않아요. 이때는 관할 세무서에 지급 절차를 문의해야 해요.\n- 5년: 최초 지급요구일부터 5년이 지날 때까지 찾아가지 않으면 국고로 귀속돼요. 통지서에는 국세기본법 시행령 제36조가 근거로 적혀 있어요.\n\n마무리하기 전에\n\n조회 화면은 주민등록번호를 입력하는 곳이라 포털 검색 광고나 문자로 받은 링크 대신 홈택스 공식 주소를 직접 열어서 들어가는 게 안전해요. 환급 사유나 금액이 궁금하면 안내 화면에 나온 세무서 문의처를 이용하면 되고요.\n\n한눈에 정리\n\n- 조회 대상: 환급이 결정됐지만 찾아가지 않은 국세 환급금(최근 5년)\n- 조회 위치: 홈택스·손택스의 국세환급금찾기 (연말정산 환급은 별도)\n- 기한: 지급요구일 1년 후 세무서 문의, 최초 지급요구일 5년 후 국고 귀속\n\n기한과 절차는 바뀔 수 있으니 실제 신청 전에는 홈택스 안내를 다시 확인해 주세요.", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/007/007_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/007/007_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "007_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/007/007_1_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/007/007_1_card.png", "cap": "", "alt": "국세 환급금 한눈에 정리", "name": "007_1_card.png", "w": 1080, "h": 912}, {"n": 2, "label": "사진 2", "uri": "img/007/007_2_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/007/007_2_card.png", "cap": "", "alt": "국세환급금 조회 순서", "name": "007_2_card.png", "w": 1080, "h": 974}], "zip": "img/007/007_images.zip", "html": "<figure class=\"ph thumbfig\" data-n=\"0\"><img src=\"img/007/007_0_thumb.png\" alt=\"대표 이미지\"><\/figure>\n<p>국세 환급금에는 기억해 둘 숫자가 두 개 있어요. 하나는 '1년', 다른 하나는 '5년'입니다. 환급이 결정됐는데 계좌 정보가 맞지 않아 아직 찾아가지 않은 돈이 있을 수 있어서, 국세청 안내를 기준으로 조회 방법과 기한을 정리해 봤어요. (2026년 10월 5일 기준)<\/p>\n<figure class=\"ph\" data-n=\"1\"><img loading=\"lazy\" src=\"img/007/007_1_card.png\" alt=\"국세 환급금 한눈에 정리\"><\/figure>\n<h3>어떤 환급금이 조회될까?<\/h3>\n<p>부가가치세나 종합소득세 같은 세금을 신고했거나 근로장려금·자녀장려금을 신청해서 환급이 결정됐는데, 계좌 오류 등의 이유로 찾아가지 않은 국세 환급금이 대상이에요. 환급이 결정된 날부터 최근 5년간의 자료가 조회된다고 안내되어 있어요.<\/p>\n<p>한 가지 구분해 둘 점이 있어요. 연말정산으로 돌려받는 환급금은 이 조회와 별개예요. 홈택스 안내 문구에도 연말정산 관련 환급금은 '조회/발급 &gt; 기타조회 &gt; 근로소득 지급명세서 조회'를 이용하라고 되어 있어요.<\/p>\n<h3>조회하는 순서<\/h3>\n<ol><li>홈택스(PC) 또는 손택스(모바일)에서 '국세환급금찾기'를 열어요.<\/li><li>주민등록번호(사업자는 사업자등록번호)와 성명(상호)을 입력하고 조회해요.<\/li><li>찾아가지 않은 환급금이 있으면 안내 문구와 함께 내역이 보이고, 없으면 \"존재하지 않습니다\"라고 나와요.<\/li><\/ol>\n<p>참고로 은행에서 이미 지급을 마친 환급금이 시차 때문에 잠깐 조회될 수도 있다고 하니, 금액이 보여도 먼저 통장 입금 내역부터 확인해 보세요.<\/p>\n<figure class=\"ph\" data-n=\"2\"><img loading=\"lazy\" src=\"img/007/007_2_card.png\" alt=\"국세환급금 조회 순서\"><\/figure>\n<h3>찾는 방법은 세 가지<\/h3>\n<ul><li>홈택스·손택스: 환급금 상세조회에서 본인 인증을 한 뒤 환급계좌 개설(변경) 신고를 하면 돼요. 국세청 통지서에는 '납부·고지·환급 &gt; 국세환급 &gt; 환급계좌개설(변경)신고' 경로가 적혀 있어요.<\/li><li>전화: 미수령 환급금이 500만 원 이하이면 세무서 담당자에게 연락해 본인 계좌를 신고할 수 있어요.<\/li><li>방문: 세무서에서 국세환급금통지서를 받아 우체국에 가는 방법이에요. 우체국에서 직접 받을 때는 신분증과 통지서가 필요하다고 통지서에 안내되어 있어요.<\/li><\/ul>\n<p>조회 결과를 보고 ARS(1544-9944)나 가까운 세무서로 지급 신청을 할 수도 있다고 정부 개방서비스 페이지에 소개돼 있어요.<\/p>\n<h3>1년과 5년은 무엇일까?<\/h3>\n<p>여기서 '지급요구일'은 국세청이 금융회사나 우체국에 환급금을 지급하라고 처음 요구한 날이에요.<\/p>\n<ul><li>1년: 지급요구일로부터 1년이 지나면 금융회사나 우체국에서는 더 이상 지급하지 않아요. 이때는 관할 세무서에 지급 절차를 문의해야 해요.<\/li><li>5년: 최초 지급요구일부터 5년이 지날 때까지 찾아가지 않으면 국고로 귀속돼요. 통지서에는 국세기본법 시행령 제36조가 근거로 적혀 있어요.<\/li><\/ul>\n<h3>마무리하기 전에<\/h3>\n<p>조회 화면은 주민등록번호를 입력하는 곳이라 포털 검색 광고나 문자로 받은 링크 대신 홈택스 공식 주소를 직접 열어서 들어가는 게 안전해요. 환급 사유나 금액이 궁금하면 안내 화면에 나온 세무서 문의처를 이용하면 되고요.<\/p>\n<h3>한눈에 정리<\/h3>\n<ul><li>조회 대상: 환급이 결정됐지만 찾아가지 않은 국세 환급금(최근 5년)<\/li><li>조회 위치: 홈택스·손택스의 국세환급금찾기 (연말정산 환급은 별도)<\/li><li>기한: 지급요구일 1년 후 세무서 문의, 최초 지급요구일 5년 후 국고 귀속<\/li><\/ul>\n<p>기한과 절차는 바뀔 수 있으니 실제 신청 전에는 홈택스 안내를 다시 확인해 주세요.<\/p>", "extras": [{"title": "사진 삽입 제안", "html": "<blockquote>이미지 채움(2026-10-05): 대표 썸네일 · 사진 1 자체 제작 카드 · 사진 2 자체 제작 카드 — 파일 images/posts/007/ (개인정보·로그인 화면 없음)<\/blockquote>\n<div class=\"tw\"><table><thead><tr><th>위치<\/th><th>내용<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>도입부 아래<\/td><td>홈택스 '국세환급금찾기' 조회 입력 화면(입력 전 상태)<\/td><td>주민등록번호·성명 입력 후 화면은 절대 캡처하지 않기<\/td><\/tr><tr><td>'찾는 방법은 세 가지' 아래<\/td><td>환급계좌개설(변경)신고 메뉴 경로 화면<\/td><td>본인 계좌번호가 보이면 가림<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "사용자 확인 체크리스트", "html": "<ul><li class=\"cb\">☐ (선택) PC 홈택스에서 '국세환급금찾기' 메뉴 위치를 직접 열어 확인한 경우에만 본문에 한 줄 추가<\/li><li class=\"cb\">☐ 손택스·홈택스 화면에서 조회 입력 항목(주민등록번호, 성명)이 현재도 같은지 확인<\/li><li class=\"cb\">☐ 세무서 전화 신고의 '500만 원 이하' 조건이 현재 안내에도 남아 있는지 확인<\/li><li class=\"cb\">☐ 개인 환급 경험을 쓰고 싶다면 실제로 겪은 것만 쓰고, 금액·계좌는 가리기<\/li><li class=\"cb\">☐ 이 글은 세무 상담이 아니라 조회 절차 안내임을 유지(환급 사유 판단 문구 추가 금지)<\/li><\/ul>", "open": true}, {"title": "출처 (확인일 2026-10-05)", "html": "<div class=\"tw\"><table><thead><tr><th>내용<\/th><th>출처<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>국세환급금찾기 조회 항목, 최근 5년 조회, 5년 국고 귀속, 지급신청 방법(홈택스·전화 500만 원 이하·방문), 연말정산 환급 별도 안내<\/td><td>국세청 홈택스 모바일 국세환급금찾기 <a href=\"https://mob.tbht.hometax.go.kr/jsonAction.do?actionId=UTBRDAAA03F001\" target=\"_blank\" rel=\"noopener noreferrer\">https://mob.tbht.hometax.go.kr/jsonAction.do?actionId=UTBRDAAA03F001<\/a><\/td><td>공식<\/td><\/tr><tr><td>지급요구일 1년 후 금융회사·우체국 지급 중단, 5년 국고 귀속(국세기본법 시행령 제36조), 환급계좌개설(변경)신고 경로, 우체국 수령 시 서류<\/td><td>국세환급금 통지서 서식(국가법령정보센터) <a href=\"https://www.law.go.kr/LSW/flDownload.do?bylClsCd=110202&amp;flSeq=150100563&amp;gubun=\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.law.go.kr/LSW/flDownload.do?bylClsCd=110202&amp;flSeq=150100563&amp;gubun=<\/a> , <a href=\"https://law.go.kr/flDownload.do?flSeq=38325459&amp;gubun=\" target=\"_blank\" rel=\"noopener noreferrer\">https://law.go.kr/flDownload.do?flSeq=38325459&amp;gubun=<\/a><\/td><td>공식<\/td><\/tr><tr><td>대상 세목 예시(부가세·종소세·장려금), ARS 1544-9944<\/td><td>디지털서비스개방 국세 미수령환급금 조회 <a href=\"https://openservice.go.kr/refundInquiry\" target=\"_blank\" rel=\"noopener noreferrer\">https://openservice.go.kr/refundInquiry<\/a><\/td><td>공식<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "이미지 출처 표기", "html": "", "open": false}, {"title": "AI 활용 표기 문구", "html": "<blockquote>이 글은 AI 도구의 도움을 받아 초안을 구성한 뒤, 작성자가 공식 기관 자료를 직접 확인해 수정·보완했습니다. 확인 기준일은 2026년 10월 5일이며, 제도는 바뀔 수 있으니 신청 전 공식 안내를 다시 확인해 주세요.<\/blockquote>", "open": false}], "plain": "국세 환급금에는 기억해 둘 숫자가 두 개 있어요. 하나는 '1년', 다른 하나는 '5년'입니다. 환급이 결정됐는데 계좌 정보가 맞지 않아 아직 찾아가지 않은 돈이 있을 수 있어서, 국세청 안내를 기준으로 조회 방법과 기한을 정리해 봤어요. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/007/007_1_card.png\n\n어떤 환급금이 조회될까?\n\n부가가치세나 종합소득세 같은 세금을 신고했거나 근로장려금·자녀장려금을 신청해서 환급이 결정됐는데, 계좌 오류 등의 이유로 찾아가지 않은 국세 환급금이 대상이에요. 환급이 결정된 날부터 최근 5년간의 자료가 조회된다고 안내되어 있어요.\n\n한 가지 구분해 둘 점이 있어요. 연말정산으로 돌려받는 환급금은 이 조회와 별개예요. 홈택스 안내 문구에도 연말정산 관련 환급금은 '조회/발급 > 기타조회 > 근로소득 지급명세서 조회'를 이용하라고 되어 있어요.\n\n조회하는 순서\n\n1. 홈택스(PC) 또는 손택스(모바일)에서 '국세환급금찾기'를 열어요.\n2. 주민등록번호(사업자는 사업자등록번호)와 성명(상호)을 입력하고 조회해요.\n3. 찾아가지 않은 환급금이 있으면 안내 문구와 함께 내역이 보이고, 없으면 \"존재하지 않습니다\"라고 나와요.\n\n참고로 은행에서 이미 지급을 마친 환급금이 시차 때문에 잠깐 조회될 수도 있다고 하니, 금액이 보여도 먼저 통장 입금 내역부터 확인해 보세요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/007/007_2_card.png\n\n찾는 방법은 세 가지\n\n- 홈택스·손택스: 환급금 상세조회에서 본인 인증을 한 뒤 환급계좌 개설(변경) 신고를 하면 돼요. 국세청 통지서에는 '납부·고지·환급 > 국세환급 > 환급계좌개설(변경)신고' 경로가 적혀 있어요.\n- 전화: 미수령 환급금이 500만 원 이하이면 세무서 담당자에게 연락해 본인 계좌를 신고할 수 있어요.\n- 방문: 세무서에서 국세환급금통지서를 받아 우체국에 가는 방법이에요. 우체국에서 직접 받을 때는 신분증과 통지서가 필요하다고 통지서에 안내되어 있어요.\n\n조회 결과를 보고 ARS(1544-9944)나 가까운 세무서로 지급 신청을 할 수도 있다고 정부 개방서비스 페이지에 소개돼 있어요.\n\n1년과 5년은 무엇일까?\n\n여기서 '지급요구일'은 국세청이 금융회사나 우체국에 환급금을 지급하라고 처음 요구한 날이에요.\n\n- 1년: 지급요구일로부터 1년이 지나면 금융회사나 우체국에서는 더 이상 지급하지 않아요. 이때는 관할 세무서에 지급 절차를 문의해야 해요.\n- 5년: 최초 지급요구일부터 5년이 지날 때까지 찾아가지 않으면 국고로 귀속돼요. 통지서에는 국세기본법 시행령 제36조가 근거로 적혀 있어요.\n\n마무리하기 전에\n\n조회 화면은 주민등록번호를 입력하는 곳이라 포털 검색 광고나 문자로 받은 링크 대신 홈택스 공식 주소를 직접 열어서 들어가는 게 안전해요. 환급 사유나 금액이 궁금하면 안내 화면에 나온 세무서 문의처를 이용하면 되고요.\n\n한눈에 정리\n\n- 조회 대상: 환급이 결정됐지만 찾아가지 않은 국세 환급금(최근 5년)\n- 조회 위치: 홈택스·손택스의 국세환급금찾기 (연말정산 환급은 별도)\n- 기한: 지급요구일 1년 후 세무서 문의, 최초 지급요구일 5년 후 국고 귀속\n\n기한과 절차는 바뀔 수 있으니 실제 신청 전에는 홈택스 안내를 다시 확인해 주세요.", "copyAll": "국세 환급금에는 기억해 둘 숫자가 두 개 있어요. 하나는 '1년', 다른 하나는 '5년'입니다. 환급이 결정됐는데 계좌 정보가 맞지 않아 아직 찾아가지 않은 돈이 있을 수 있어서, 국세청 안내를 기준으로 조회 방법과 기한을 정리해 봤어요. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/007/007_1_card.png\n\n어떤 환급금이 조회될까?\n\n부가가치세나 종합소득세 같은 세금을 신고했거나 근로장려금·자녀장려금을 신청해서 환급이 결정됐는데, 계좌 오류 등의 이유로 찾아가지 않은 국세 환급금이 대상이에요. 환급이 결정된 날부터 최근 5년간의 자료가 조회된다고 안내되어 있어요.\n\n한 가지 구분해 둘 점이 있어요. 연말정산으로 돌려받는 환급금은 이 조회와 별개예요. 홈택스 안내 문구에도 연말정산 관련 환급금은 '조회/발급 > 기타조회 > 근로소득 지급명세서 조회'를 이용하라고 되어 있어요.\n\n조회하는 순서\n\n1. 홈택스(PC) 또는 손택스(모바일)에서 '국세환급금찾기'를 열어요.\n2. 주민등록번호(사업자는 사업자등록번호)와 성명(상호)을 입력하고 조회해요.\n3. 찾아가지 않은 환급금이 있으면 안내 문구와 함께 내역이 보이고, 없으면 \"존재하지 않습니다\"라고 나와요.\n\n참고로 은행에서 이미 지급을 마친 환급금이 시차 때문에 잠깐 조회될 수도 있다고 하니, 금액이 보여도 먼저 통장 입금 내역부터 확인해 보세요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/007/007_2_card.png\n\n찾는 방법은 세 가지\n\n- 홈택스·손택스: 환급금 상세조회에서 본인 인증을 한 뒤 환급계좌 개설(변경) 신고를 하면 돼요. 국세청 통지서에는 '납부·고지·환급 > 국세환급 > 환급계좌개설(변경)신고' 경로가 적혀 있어요.\n- 전화: 미수령 환급금이 500만 원 이하이면 세무서 담당자에게 연락해 본인 계좌를 신고할 수 있어요.\n- 방문: 세무서에서 국세환급금통지서를 받아 우체국에 가는 방법이에요. 우체국에서 직접 받을 때는 신분증과 통지서가 필요하다고 통지서에 안내되어 있어요.\n\n조회 결과를 보고 ARS(1544-9944)나 가까운 세무서로 지급 신청을 할 수도 있다고 정부 개방서비스 페이지에 소개돼 있어요.\n\n1년과 5년은 무엇일까?\n\n여기서 '지급요구일'은 국세청이 금융회사나 우체국에 환급금을 지급하라고 처음 요구한 날이에요.\n\n- 1년: 지급요구일로부터 1년이 지나면 금융회사나 우체국에서는 더 이상 지급하지 않아요. 이때는 관할 세무서에 지급 절차를 문의해야 해요.\n- 5년: 최초 지급요구일부터 5년이 지날 때까지 찾아가지 않으면 국고로 귀속돼요. 통지서에는 국세기본법 시행령 제36조가 근거로 적혀 있어요.\n\n마무리하기 전에\n\n조회 화면은 주민등록번호를 입력하는 곳이라 포털 검색 광고나 문자로 받은 링크 대신 홈택스 공식 주소를 직접 열어서 들어가는 게 안전해요. 환급 사유나 금액이 궁금하면 안내 화면에 나온 세무서 문의처를 이용하면 되고요.\n\n한눈에 정리\n\n- 조회 대상: 환급이 결정됐지만 찾아가지 않은 국세 환급금(최근 5년)\n- 조회 위치: 홈택스·손택스의 국세환급금찾기 (연말정산 환급은 별도)\n- 기한: 지급요구일 1년 후 세무서 문의, 최초 지급요구일 5년 후 국고 귀속\n\n기한과 절차는 바뀔 수 있으니 실제 신청 전에는 홈택스 안내를 다시 확인해 주세요.", "search": "007 홈택스에서 찾아가지 않은 국세 환급금 조회하는 법, 5년 지나면 국고로 귀속돼요 세금·연금 국세환급금, 홈택스, 미수령 환급금, 환급계좌 신고, 국고 귀속 환급이 결정됐지만 찾아가지 않은 국세 환급금을 홈택스에서 조회하고 계좌 신고로 받는 방법과 1년·5년 기한을 정리 국세 환급금에는 기억해 둘 숫자가 두 개 있어요. 하나는 '1년', 다른 하나는 '5년'입니 정액", "기초연금 신청", "복지로"], "summary": "2026년 기초연금 선정기준액(단독 247만 원)이 '소득'이 아니라 '소득인정액' 기준임을 설명하고 신청·지급 시기를 정리", "status": "초안", "created": "2026-10-05 12:19", "base": "2026-10-05", "need": 0, "chars": 1869, "chars_ns": 1468, "imgs": 3, "slots": 2, "filled": 2, "thumb": "img/006/006_0_thumb.png", "seHtml": "<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/006/006_0_thumb.png\" alt=\"대표 이미지\" width=\"720\"><\/p>\n<p>\"월 소득이 247만 원을 넘으면 기초연금은 못 받는다\"는 말, 주변에서 들어보신 적 있으신가요? 공식 자료를 확인해 보니 기준은 '소득'이 아니라 '소득인정액'이에요. 보건복지부와 정부24 안내를 바탕으로 2026년 기준을 정리했습니다. (2026년 10월 5일 기준)<\/p>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/006/006_1_card.png\" alt=\"기초연금 2026 한눈에 정리\" width=\"720\"><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>먼저 숫자부터: 2026년 선정기준액<\/b><\/span><\/p>\n<p>보건복지부는 2026년 선정기준액을 단독가구 월 247만 원, 부부가구 월 395만 2천 원으로 정했다고 밝혔어요. 2025년(228만 원, 364만 8천 원)보다 단독가구 기준 19만 원, 8.3% 오른 금액이에요. 가구의 월 소득인정액이 이 기준액 이하면 기초연금을 받을 수 있어요. 선정기준액은 65세 이상 어르신 중 수급자가 70% 수준이 되도록 정하는 기준선이라고 설명되어 있고요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>'소득인정액'은 어떻게 계산할까?<\/b><\/span><\/p>\n<p>소득인정액은 '월 소득평가액'과 '재산의 월 소득환산액'을 더한 값이에요. 그래서 월급이나 연금 수입이 같아도 재산이 얼마냐에 따라 결과가 달라질 수 있어요.<\/p>\n<ul><li>근로소득은 116만 원을 뺀 뒤 30%를 더 공제해서 반영해요. 사업·재산·공적이전소득 같은 기타 소득은 따로 더해요.<\/li><li>재산은 기본재산액(대도시 1억 3,500만 원, 중소도시 8,500만 원, 농어촌 7,250만 원)을 빼고, 금융재산은 2,000만 원을 공제한 뒤 부채를 차감해 월 소득으로 환산해요.<\/li><li>고급 자동차와 회원권은 일반재산에서 빼고 따로 계산한다고 안내돼 있어요.<\/li><\/ul>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>얼마나 받을까?<\/b><\/span><\/p>\n<p>2026년 기준연금액은 월 349,700원이에요. 정부24에는 단독가구 최고 349,700원, 부부가구 최고 559,520원으로 안내되어 있고, 국민연금 가입기간과 급여액, 가구 유형, 소득인정액 수준에 따라 감액될 수 있다고 해요. 복지부 보도자료에 따르면 2025년 9월 통계 기준 실제 수급자의 약 86%는 소득인정액이 150만 원 미만이라고 해요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>제외되는 경우도 있어요<\/b><\/span><\/p>\n<p>공무원연금, 사학연금, 군인연금, 별정우체국연금의 수급권자와 그 배우자는 원칙적으로 제외돼요. 다만 퇴직일시금을 받은 경우처럼 예외적으로 받을 수 있는 경우도 있어서, 해당될 것 같다면 창구에 꼭 문의해 보세요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>신청은 어디서, 언제부터?<\/b><\/span><\/p>\n<ul><li>신청 장소: 읍·면·동 행정복지센터, 국민연금공단 지사, 복지로(bokjiro.go.kr). 주소지 관할과 상관없이 신청할 수 있어요.<\/li><li>신청 시기: 만 65세 생일이 속한 달의 한 달 전부터예요. 2026년에는 1961년생이 새로 대상이 돼요.<\/li><li>거동이 불편하시면 국민연금공단(1355)에 '찾아뵙는 서비스'를 요청할 수 있고, 일반 문의는 보건복지상담센터 129로 하면 돼요.<\/li><\/ul>\n<p style=\"text-align:center\"><img src=\"https://senti-1000ma.github.io/blog-drafts/img/006/006_2_capture.png\" alt=\"&#x27;신청안내 &gt; 신청방법&#x27;의 신청 대상·장소·기간 (2026-10-05 확인)\" width=\"720\"><\/p><p style=\"text-align:center\"><span style=\"font-size:13px;color:#888888\">출처: 보건복지부 기초연금 누리집<\/span><\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>지급은 신청한 달부터<\/b><\/span><\/p>\n<p>기초연금은 신청한 날이 속한 달부터 지급되고, 매월 25일에 입금돼요. 25일이 토요일이나 공휴일이면 그 전날이에요. 예를 들어 7월에 신청해서 8월에 대상자로 결정되면, 8월 25일에 7월분까지 2개월 치를 받는다고 안내돼 있어요. 심사가 늦어져도 손해가 없다는 뜻이니, 생일 한 달 전에 맞춰 신청하는 게 가장 유리해요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>미리 가늠해 보고 싶다면<\/b><\/span><\/p>\n<p>국민연금공단 FAQ에는 '내 곁에 국민연금' 앱의 노후준비 메뉴에 '기초연금 모의계산'과 '기초연금 신청하기'가 있다고 나와 있어요. 다만 모의계산 결과는 참고용이고 실제 결정은 심사에서 나와요. 메뉴 이름과 위치는 앱 업데이트에 따라 바뀔 수 있어요.<\/p>\n<p><br><\/p><p><span style=\"font-size:19px\"><b>한눈에 정리<\/b><\/span><\/p>\n<ul><li>기준은 소득이 아니라 소득인정액(소득평가액 + 재산 환산액)<\/li><li>2026년 선정기준액: 단독 247만 원, 부부 395만 2천 원<\/li><li>신청: 생일 속한 달의 한 달 전부터, 지급은 신청한 달부터 매월 25일<\/li><\/ul>\n<p>제도는 해마다 바뀌니 신청 전에 복지로나 129에서 한 번 더 확인해 주세요.<\/p>", "sePlain": "[대표 이미지] https://senti-1000ma.github.io/blog-drafts/img/006/006_0_thumb.png\n\n\"월 소득이 247만 원을 넘으면 기초연금은 못 받는다\"는 말, 주변에서 들어보신 적 있으신가요? 공식 자료를 확인해 보니 기준은 '소득'이 아니라 '소득인정액'이에요. 보건복지부와 정부24 안내를 바탕으로 2026년 기준을 정리했습니다. (2026년 10월 5일 기준)\n\n[사진 1] https://senti-1000ma.github.io/blog-drafts/img/006/006_1_card.png\n\n먼저 숫자부터: 2026년 선정기준액\n\n보건복지부는 2026년 선정기준액을 단독가구 월 247만 원, 부부가구 월 395만 2천 원으로 정했다고 밝혔어요. 2025년(228만 원, 364만 8천 원)보다 단독가구 기준 19만 원, 8.3% 오른 금액이에요. 가구의 월 소득인정액이 이 기준액 이하면 기초연금을 받을 수 있어요. 선정기준액은 65세 이상 어르신 중 수급자가 70% 수준이 되도록 정하는 기준선이라고 설명되어 있고요.\n\n'소득인정액'은 어떻게 계산할까?\n\n소득인정액은 '월 소득평가액'과 '재산의 월 소득환산액'을 더한 값이에요. 그래서 월급이나 연금 수입이 같아도 재산이 얼마냐에 따라 결과가 달라질 수 있어요.\n\n- 근로소득은 116만 원을 뺀 뒤 30%를 더 공제해서 반영해요. 사업·재산·공적이전소득 같은 기타 소득은 따로 더해요.\n- 재산은 기본재산액(대도시 1억 3,500만 원, 중소도시 8,500만 원, 농어촌 7,250만 원)을 빼고, 금융재산은 2,000만 원을 공제한 뒤 부채를 차감해 월 소득으로 환산해요.\n- 고급 자동차와 회원권은 일반재산에서 빼고 따로 계산한다고 안내돼 있어요.\n\n얼마나 받을까?\n\n2026년 기준연금액은 월 349,700원이에요. 정부24에는 단독가구 최고 349,700원, 부부가구 최고 559,520원으로 안내되어 있고, 국민연금 가입기간과 급여액, 가구 유형, 소득인정액 수준에 따라 감액될 수 있다고 해요. 복지부 보도자료에 따르면 2025년 9월 통계 기준 실제 수급자의 약 86%는 소득인정액이 150만 원 미만이라고 해요.\n\n제외되는 경우도 있어요\n\n공무원연금, 사학연금, 군인연금, 별정우체국연금의 수급권자와 그 배우자는 원칙적으로 제외돼요. 다만 퇴직일시금을 받은 경우처럼 예외적으로 받을 수 있는 경우도 있어서, 해당될 것 같다면 창구에 꼭 문의해 보세요.\n\n신청은 어디서, 언제부터?\n\n- 신청 장소: 읍·면·동 행정복지센터, 국민연금공단 지사, 복지로(bokjiro.go.kr). 주소지 관할과 상관없이 신청할 수 있어요.\n- 신청 시기: 만 65세 생일이 속한 달의 한 달 전부터예요. 2026년에는 1961년생이 새로 대상이 돼요.\n- 거동이 불편하시면 국민연금공단(1355)에 '찾아뵙는 서비스'를 요청할 수 있고, 일반 문의는 보건복지상담센터 129로 하면 돼요.\n\n[사진 2] https://senti-1000ma.github.io/blog-drafts/img/006/006_2_capture.png\n출처: 보건복지부 기초연금 누리집\n\n지급은 신청한 달부터\n\n기초연금은 신청한 날이 속한 달부터 지급되고, 매월 25일에 입금돼요. 25일이 토요일이나 공휴일이면 그 전날이에요. 예를 들어 7월에 신청해서 8월에 대상자로 결정되면, 8월 25일에 7월분까지 2개월 치를 받는다고 안내돼 있어요. 심사가 늦어져도 손해가 없다는 뜻이니, 생일 한 달 전에 맞춰 신청하는 게 가장 유리해요.\n\n미리 가늠해 보고 싶다면\n\n국민연금공단 FAQ에는 '내 곁에 국민연금' 앱의 노후준비 메뉴에 '기초연금 모의계산'과 '기초연금 신청하기'가 있다고 나와 있어요. 다만 모의계산 결과는 참고용이고 실제 결정은 심사에서 나와요. 메뉴 이름과 위치는 앱 업데이트에 따라 바뀔 수 있어요.\n\n한눈에 정리\n\n- 기준은 소득이 아니라 소득인정액(소득평가액 + 재산 환산액)\n- 2026년 선정기준액: 단독 247만 원, 부부 395만 2천 원\n- 신청: 생일 속한 달의 한 달 전부터, 지급은 신청한 달부터 매월 25일\n\n제도는 해마다 바뀌니 신청 전에 복지로나 129에서 한 번 더 확인해 주세요.", "images": [{"n": 0, "label": "대표 이미지", "uri": "img/006/006_0_thumb.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/006/006_0_thumb.png", "cap": "", "alt": "대표 이미지", "name": "006_0_thumb.png", "w": 1080, "h": 1080}, {"n": 1, "label": "사진 1", "uri": "img/006/006_1_card.png", "abs": "https://senti-1000ma.github.io/blog-drafts/img/006/006_1_card.png", "cap": "", "alt": "기초연금 2026 한눈에 정리", "name": "006_1_card.p
